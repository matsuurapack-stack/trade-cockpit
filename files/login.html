<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/trade_icon_512.png">
<title>ログイン - Trade Cockpit</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#f4f5f7;color:#1c2330;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;-webkit-text-size-adjust:100%}
  body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
    padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
  .card{width:100%;max-width:380px;background:#fff;border-radius:16px;padding:28px 22px;
    box-shadow:0 2px 16px rgba(20,30,50,.10)}
  h1{font-size:20px;margin:0 0 4px;text-align:center}
  p.sub{margin:0 0 22px;text-align:center;font-size:13px;color:#6b7686}
  label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
  input{width:100%;height:52px;font-size:17px;padding:0 14px;border:1.5px solid #c9d0db;border-radius:12px;
    background:#fff;color:#1c2330;-webkit-appearance:none;appearance:none}
  input:focus{outline:none;border-color:#2f6fdb;box-shadow:0 0 0 3px rgba(47,111,219,.18)}
  button{width:100%;height:54px;margin-top:22px;font-size:18px;font-weight:700;color:#fff;background:#2f6fdb;
    border:0;border-radius:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  button:disabled{opacity:.6}
  .err{min-height:20px;margin-top:14px;font-size:14px;color:#c62828;text-align:center}
  .foot{margin-top:18px;font-size:12px;color:#8a94a3;text-align:center;line-height:1.6}
</style>
</head>
<body>
<main class="card">
  <h1>トレード・コックピット</h1>
  <p class="sub">ユーザー名とパスワードを入力してください</p>
  <form id="f" autocomplete="on">
    <label for="u">ユーザー名</label>
    <input id="u" name="username" type="text" inputmode="text" autocomplete="username"
           autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <label for="p">パスワード</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button id="b" type="submit">ログイン</button>
    <div class="err" id="e" role="alert" aria-live="polite"></div>
  </form>
  <div class="foot">パスワードは他の人に教えないでください。<br>共用のパソコンでは使い終わったら必ずログアウトしてください。</div>
</main>
<script>
(function(){
  var f=document.getElementById('f'),e=document.getElementById('e'),b=document.getElementById('b');
  f.addEventListener('submit',function(ev){
    ev.preventDefault(); e.textContent=''; b.disabled=true; b.textContent='確認しています…';
    fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',
      body:JSON.stringify({username:document.getElementById('u').value.trim(),password:document.getElementById('p').value})})
    .then(function(r){return r.json().catch(function(){return {}}).then(function(j){return {ok:r.ok,j:j}})})
    .then(function(x){
      if(x.ok&&x.j.ok){location.replace('/trade-cockpit.html');return}
      e.textContent=x.j.error||'ログインできませんでした'; b.disabled=false; b.textContent='ログイン';
    })
    .catch(function(){e.textContent='通信できませんでした。電波の良い場所でもう一度お試しください'; b.disabled=false; b.textContent='ログイン'});
  });
})();
</script>
</body>
</html>
