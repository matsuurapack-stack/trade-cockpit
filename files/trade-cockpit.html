      active_rules:activeRulesForConsult.map(r=>({rule:r.rule_text,confidence:r.confidence,action:r.action_text||null})),
      integrated_judgment:knowledge&&!knowledge.error?{
        judgment:knowledge.judgment.judgment,confidence:knowledge.judgment.confidence,reasons:knowledge.judgment.reasons,
        upcoming_events:knowledge.context.upcoming_events.slice(0,3).map(e=>({title:e.title||e.event,business_days_until:e.business_days_until})),
        matched_playbook:knowledge.context.matched_playbooks[0]?{name:knowledge.context.matched_playbooks[0].name,matchScore:knowledge.context.matched_playbooks[0].matchScore}:null,

  // 2026-09-02 ユーザー要望「投資判断ログ」：journal・myRulesをサーバーDB（Neon）へ移行後は、

  // 2026-09-17緊急修正：起動時に必ずNeonのwatchlistを取得して上書きする（他端末・
  // ChatGPT Import等での変更を反映するため）。従来はs.investmentLogMigrated&&
  // s.watchlistMigrated（いずれも端末localStorage内のフラグ）がtrueの場合だけ取得していた
  // ため、「移行」ボタンを一度も押していない端末（例：普段PCだけで操作しiPhoneでは初回の
  // 数銘柄しか登録していなかった端末）は永久にサーバー取得が走らず、その端末の古いローカル
  // watchlist（実例：3銘柄のみ）を表示し続けていた——監視銘柄は「ポジションだけ非共有、
  // それ以外は共有」の既存方針のはずが、端末単位のlocalStorageが実質のSSoTになっていた
  // バグ。サーバー側watchlist（Neon Postgres、全端末共有）を常に正として取得するよう
  // 移行フラグへの依存を撤廃した。取得失敗時（オフライン等）は今のローカル状態のまま
  // （既存の journal/rules と同じ安全側フォールバック方針を維持）。
  // 2026-09-18新規（運用診断：iPhoneがserver watchTargetsを取り込めない不具合調査）：
  // PC/iPhone間でサーバー再起動漏れ・古いプロセスが応答していることを画面上で突き合わせる
  // ための診断情報。/api/versionはバックエンドのビルド識別子（APP_BUILD_VERSION）を返す

  const [appVersionInfo,setAppVersionInfo]=useState(null);
  const [watchTargetsDiag,setWatchTargetsDiag]=useState(null);
  useEffect(()=>{
    fetch("/api/version").then(r=>r.ok?r.json():null).then(d=>{if(d)setAppVersionInfo(d);}).catch(()=>{});
  },[]);
  useEffect(()=>{
    (async()=>{
      try{
        const [jr,ur]=await Promise.all([fetch("/api/watchlist?market=JP"),fetch("/api/watchlist?market=US")]);
        if(jr.ok){
          const jd=await jr.json();
          if(Array.isArray(jd.items)){
            // 2026-09-17新規：「監視銘柄」タブのON/OFF状態（watchTargets）もwatchlist本体と
            // 同じis_watch_target列でサーバー側に永続化されたため、ここでもサーバー値を正として
            // 反映する。ただし、この列は今回新設したばかりでサーバー側はまだ空（false）のため、
            // 単純にサーバー値で上書きすると、今まで端末localStorageだけに積み上がっていた
            // PC側の選択（例：56銘柄）が初回アクセス時に消えてしまう（既存PC機能を壊さない、
            // の要件に反する）。そこで「サーバー値∪この端末のローカル値」の和集合を採用し、
            // ローカルにしか無かったコードはこの場でサーバーへも書き戻す（一度書き戻せば
            // 以後はどの端末でもサーバー値だけで揃うようになる、一回限りの自然な収束）。
            // 2026-09-18追記（運用診断）：isWatchTargetフィールド自体が応答に無い場合
            // （＝サーバープロセスがこの機能追加より前の古いコードのまま再起動されていない）
            // を明示的に検知し、診断パネルへ表示する（無言でローカル値のみに戻ってしまうと
            // 「iPhoneだけ3件のまま」のような不具合の原因が分からなくなるため）。
            const backendHasField=jd.items.length===0 || jd.items.some(w=>Object.prototype.hasOwnProperty.call(w,"isWatchTarget"));
            const serverWatchTargets=jd.items.filter(w=>w.isWatchTarget).map(w=>w.code);
            const localBefore=sRef.current.watchTargets;
            const localOnly=localBefore.filter(c=>!serverWatchTargets.includes(c));
            const merged=[...new Set([...serverWatchTargets,...localOnly])];
            setS(p=>({...p,watchlist:jd.items,watchTargets:merged}));
            setWatchTargetsDiag({
              backendHasIsWatchTargetField:backendHasField,
              localCountBeforeMerge:localBefore.length,
              serverCount:serverWatchTargets.length,
              mergedCount:merged.length,
              hydratedAt:new Date().toISOString(),
              pushPhase:localOnly.length>0?"pushing":"not_needed",
            });
            // 2026-09-18修正（運用診断：PC localStorage 73件がNeonへ反映されない不具合の調査）：
            // 従来はforEachでfire-and-forgetし、push結果を一切見ていなかった。
            // Promise.allで実際の結果（HTTP status・サーバー側ok）を集計し、push完了後に
            // /api/watchlistを再取得してNeon側の実際の件数を確認する——ユーザーの期待結果
            // 「local 73 / server 0 / merged 73 → POST成功 → server 73 → 再fetch →
            // local 73 / server 73 / merged 73」をこのeffect1回の中で検証できるようにする。
            if(localOnly.length>0){
              const pushResults=await Promise.all(localOnly.map(c=>persistWatchTarget(c,true)));
              const pushSucceeded=pushResults.filter(r=>r.ok&&r.serverOk!==false).length;
              const pushFailed=pushResults.filter(r=>!(r.ok&&r.serverOk!==false));
              // 2026-09-18追記（差分10件の分類調査）：失敗したcodeがこの時点のwatchlist
              // マスター（jd.items、直前に取得済みのJP一覧。新規APIコールは増やさない）に
              // 実在するかをこの場で突き合わせる。無ければ「A: masterに存在しない
              // （旧localStorage残骸の可能性）」、あれば「B: masterにはあるがpush失敗
              // （market不一致等、コード側の要調査）」に分類する。
              const jpMasterByCode=new Map(jd.items.map(w=>[w.code,w]));
              const pushFailedClassified=pushFailed.map(r=>{
                const inMaster=jpMasterByCode.get(r.code);
                return {code:r.code,status:r.status,serverOk:r.serverOk,error:r.error,
                  classification:inMaster?"B_in_master_but_failed":"A_not_in_jp_master",
                  masterName:inMaster?.name||null};
              });
              let serverCountAfterPush=null;
              try{
                const rr=await fetch("/api/watchlist?market=JP");
                if(rr.ok){
                  const rd=await rr.json();
                  if(Array.isArray(rd.items)){
                    const serverAfter=rd.items.filter(w=>w.isWatchTarget).map(w=>w.code);
                    serverCountAfterPush=serverAfter.length;
                    // push後のサーバー実値で最終的にもう一度そろえる（成功していればlocalOnlyが
                    // 丸ごとサーバー側にも現れ、merged自体は変わらないはず——ズレていれば
                    // pushFailedと合わせて「何件中何件が実際に反映されなかったか」が分かる）。
                    setS(p=>({...p,watchTargets:[...new Set([...serverAfter,...p.watchTargets])]}));
                  }
                }
              }catch(e){}
              setWatchTargetsDiag(prev=>({
                ...prev,
                pushPhase:"done",
                pushAttempted:localOnly.length,
                pushSucceeded,
                pushFailedCount:pushFailed.length,
                pushFailedSample:pushFailedClassified,  // 全件表示（10件程度なら画面を圧迫しない）
                serverCountAfterPush,
              }));
            }
          }
        }
        if(ur.ok){const ud=await ur.json();if(Array.isArray(ud.items))setS(p=>({...p,watchlistUS:ud.items}));}
      }catch(e){}
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[]);

  useEffect(()=>{if(!chartModal||!embeddable(chartModal.symbol))return;const c=modalChartRef.current;if(!c)return;

    const studies=[];if(cBB)studies.push("BB@tv-basicstudies");if(cRSI)studies.push("RSI@tv-basicstudies");if(cMA)studies.push("MASimple@tv-basicstudies");
    const sc=document.createElement("script");sc.src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";sc.async=true;
    sc.innerHTML=JSON.stringify({symbol:chartModal.symbol,interval:stockChartInterval,timezone:"Asia/Tokyo",theme:"light",style:"1",locale:"ja",studies,width:"100%",height:480,allow_symbol_change:false});
    c.appendChild(sc);},[chartModal,cBB,cRSI,cMA,stockChartInterval]);

  // 5-2章：JP個別株（TradingView無料埋め込み不可）は立花証券API／yfinanceのデータで自前描画する。
  // 2026-09-09更新（監視銘柄・市場チャートの時間足切替）：stockChartIntervalが"D"（日足）なら
  // 従来通り/api/stock-history（立花証券API・分割調整済み・上場来）をそのまま使用（指示書12番
  // 「日足機能は削除しない」）。1/5/15/60分足が選ばれた場合のみ、新設の共通短期足取得
  // （fetchChartBarsCached→/api/position-intraday-chart、ポジション画面と同じAPI・同じ
  // サーバー関数を再利用）に切り替える。依存配列にstockChartIntervalを含めることで、
  // モーダルを閉じずに時間足ボタンを押すだけで再取得・再描画される（指示書9番）。
  useEffect(()=>{
    if(!chartModal||embeddable(chartModal.symbol)||chartModal.market!=="JP"||!chartModal.code)return;
    if(typeof LightweightCharts==="undefined"){setJpHistoryMsg("チャート描画ライブラリの読み込みに失敗しました。通信環境をご確認ください。");return;}
    const myGen=++chartFetchGenRef.current; // 指示書9番：多重fetch防止（古い世代の結果は無視する）
    let cancelled=false;
    setJpHistoryMsg("読み込み中…");
    const isDaily=stockChartInterval==="D";

    const renderChart=({candles,volumes,vwapLine,priceLines,visibleRange})=>{
      if(cancelled||myGen!==chartFetchGenRef.current)return;
      const el=jpChartRef.current;
      if(!el)return;
      if(el._cleanup)el._cleanup();
      el.innerHTML="";
      const hasVolume=Array.isArray(volumes)&&volumes.length>0;
      // 日足(isDaily)はtimeにUNIX秒ではなく日付文字列("YYYY-MM-DD")を渡す別系統のデータ
      // （/api/stock-history）のため、jstTickMarkFormatter（UNIX秒前提）は分/時足の時だけ適用する
      // （日足の日付表示は元々timezoneの影響を受けない、対象外）。
      const jpChartBaseOptions={width:el.clientWidth||680,height:440,
        layout:{background:{color:"transparent"},textColor:"#565A52"},
        grid:{vertLines:{color:"#D6D8CF"},horzLines:{color:"#D6D8CF"}},
        timeScale:{borderColor:"#C6C8BF",timeVisible:!isDaily,secondsVisible:false},
        rightPriceScale:{borderColor:"#C6C8BF"}};
      const chart=LightweightCharts.createChart(el,isDaily?jpChartBaseOptions:withJstChartTimeOptions(jpChartBaseOptions,chartModal.market));
      const series=chart.addCandlestickSeries({upColor:"#AE3A34",downColor:"#2C6A48",borderVisible:false,
        wickUpColor:"#AE3A34",wickDownColor:"#2C6A48"}); // 日本の相場慣習に合わせ赤=上昇・緑=下落
      series.setData(candles);
      if(hasVolume){
        const volSeries=chart.addHistogramSeries({priceFormat:{type:"volume"},priceScaleId:"volPane",color:"#8a8f80"});
        volSeries.priceScale().applyOptions({scaleMargins:{top:0.82,bottom:0}});
        volSeries.setData(volumes);
      }
      if(vwapLine&&vwapLine.length){
        const vwapSeries=chart.addLineSeries({color:"#3A6EA5",lineWidth:1,priceLineVisible:false,lastValueVisible:false});
        vwapSeries.setData(vwapLine);
      }
      (priceLines||[]).forEach(({price,color,title})=>{
        if(price==null)return;
        series.createPriceLine({price,color,lineWidth:1,lineStyle:LightweightCharts.LineStyle.Dashed,axisLabelVisible:true,title});
      });
      if(visibleRange)chart.timeScale().setVisibleRange(visibleRange);
      else chart.timeScale().fitContent();
      // モーダル表示直後はレイアウト確定前でclientWidthが0のことがあるため、
      // ResizeObserverで実測幅が変わるたびに追従させる（ウィンドウリサイズも含めて一本化）。
      const ro=new ResizeObserver(entries=>{
        const w=entries[0]?.contentRect?.width;
        if(w)chart.applyOptions({width:Math.floor(w)});
      });
      ro.observe(el);
      // モーダルのレイアウトが1フレーム遅れて確定する環境向けの保険（ResizeObserverだけでは
      // 追従しないケースがあったため、初期化直後に実測幅で明示的にも合わせておく）。
      requestAnimationFrame(()=>{if(el.clientWidth)chart.applyOptions({width:el.clientWidth});});
      el._cleanup=()=>{ro.disconnect();chart.remove();};
    };

    if(isDaily){
      fetch("/api/stock-history?code="+encodeURIComponent(chartModal.code))
        .then(r=>r.json())
        .then(d=>{
          if(cancelled||myGen!==chartFetchGenRef.current)return;
          const hist=d.history||[];
          if(hist.length===0){setJpHistoryMsg("立花証券APIからチャートデータを取得できませんでした（未接続、または銘柄が対象外の可能性があります）。下のボタンからTradingView本体でご確認ください。");return;}
          setJpHistoryMsg("");
          renderChart({candles:hist.map(r=>({time:r.date,open:r.open,high:r.high,low:r.low,close:r.close}))});
        })
        .catch(()=>{if(!cancelled&&myGen===chartFetchGenRef.current)setJpHistoryMsg("取得に失敗しました。start.batのサーバーが起動しているかご確認ください。");});
    }else{
      const period=JP_CHART_INTERVAL_TO_PERIOD[stockChartInterval];
      fetchChartBarsCached(chartModal.code,chartModal.market,stockChartInterval,period)
        .then(d=>{
          if(cancelled||myGen!==chartFetchGenRef.current)return;
          if(d.error&&!(d.bars&&d.bars.length)){setJpHistoryMsg(d.error+"（下のボタンからTradingView本体でご確認いただけます）");return;}
          const bars=d.bars||[];
          if(bars.length===0){setJpHistoryMsg("短期足データを取得できませんでした（市場時間外、または対象外銘柄の可能性があります）。下のボタンからTradingView本体でご確認ください。");return;}
          setJpHistoryMsg("");
          const nDays={"1":1,"5":2,"15":5,"60":22}[stockChartInterval]||2;
          const showVwap=stockChartInterval==="1"||stockChartInterval==="5"||stockChartInterval==="15"; // 指示書7番
          const prevLevels=computePrevDayLevels(bars); // 指示書8番（データが1日分しか無い時はnull＝表示しない）
          const todayOpen=computeTodayOpen(bars);
          const current=num(sRef.current.stockQuotes?.[chartModal.code]?.t);
          renderChart({
            candles:bars.map(b=>({time:b.time,open:b.open,high:b.high,low:b.low,close:b.close})),
            volumes:bars.map(b=>({time:b.time,value:b.volume,color:b.close>=b.open?"rgba(174,58,52,.5)":"rgba(44,106,72,.5)"})),
            vwapLine:showVwap?computeSessionVwapSeries(bars):null,
            priceLines:[
              {price:prevLevels?.high,color:"#8a8f80",title:"前日高値"},
              {price:prevLevels?.low,color:"#8a8f80",title:"前日安値"},
              {price:todayOpen,color:"#D98C3F",title:"当日始値"},
              {price:current,color:"#565A52",title:"現在値"},
            ],
            visibleRange:computeVisibleRangeByDays(bars,nDays),
          });
        })
        .catch(()=>{if(!cancelled&&myGen===chartFetchGenRef.current)setJpHistoryMsg("取得に失敗しました。start.batのサーバーが起動しているかご確認ください。");});
    }
    return()=>{cancelled=true;if(jpChartRef.current&&jpChartRef.current._cleanup)jpChartRef.current._cleanup();};
  },[chartModal,stockChartInterval]);

  const openTV=(tv,interval)=>{if(tv)window.open("https://jp.tradingview.com/chart/?symbol="+encodeURIComponent(tv)+(interval?"&interval="+encodeURIComponent(interval):""),"_blank");};

  // 8章：日次モニターの項目クリックでチャートをトグル開閉
  const toggleMetric=(key)=>setOpenMetrics(prev=>{const n=new Set(prev);n.has(key)?n.delete(key):n.add(key);return n;});
  const openMetricsKey=useMemo(()=>[...openMetrics].sort().join(","),[openMetrics]);
  // v3-5：時間足はmonitorInterval（日次モニター用・デフォルト5分足）を使う。TradingView無料埋め込みは
  // JS APIでの動的な時間足変更に対応していないため、時間足が変わるたびにwidgetを作り直す
  // （依存配列にmonitorIntervalを含めて開いている全チャートを再生成する）。
  // なおINDEX:NKY（日経平均）はTradingView無料枠でintraday（分足）データが提供されていないため
  // （2026-09-03実測確認：純正ツールバーで1分/5分等をクリックしても日足のまま変化しない）、
  // monitorIntervalを渡しても日足のまま表示される。intradayOk:falseのメトリクスにはUI側で
  // その旨の注記を出す（下のJSX参照）。
  useEffect(()=>{
    METRICS.forEach(m=>{
      if(!openMetrics.has(m.key)||!m.tvEmbed)return;
      const c=metricRefs.current[m.key];if(!c)return;
      c.innerHTML='<div class="tradingview-widget-container__widget"></div>';
      const sc=document.createElement("script");sc.src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";sc.async=true;
      sc.innerHTML=JSON.stringify({symbol:m.tv,interval:monitorInterval,timezone:"Asia/Tokyo",theme:"light",style:"1",locale:"ja",studies:[],width:"100%",height:440,allow_symbol_change:false});
      c.appendChild(sc);
    });
  },[openMetricsKey,monitorInterval]);

  return (
    <div className="wrap">
      <div className="head">
        <div><div className="kicker">Trade Cockpit</div><h1>トレード・コックピット</h1></div>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <input type="date" className="mono" value={s.date} onChange={e=>set({date:e.target.value})} style={{fontSize:13}}/>
          <span className="mono" style={{fontSize:14,fontWeight:700,width:22,textAlign:"center",color:isMonday?"var(--accent)":"var(--ink)"}}>{day!=null?WD[day]:"―"}</span>
          <button className="ghost" onClick={rollToNextDay}>翌朝へ</button>
          <button className="ghost" onClick={exportJSON}>バックアップ↓</button>
          <button className="ghost" onClick={()=>fileRef.current.click()}>復元↑</button>
          <input ref={fileRef} type="file" accept="application/json,.json" onChange={importJSON} style={{display:"none"}}/>
          {/* 3-1章：テーマ切り替えトグル */}
          <button className="theme-toggle" onClick={toggleTheme} title="ダーク/ライト切り替え">{theme==="dark"?"🌙 ダーク":"☀️ ライト"}</button>
        </div>
      </div>

      {/* 10-5章：重要ニュース通知バナー（ページ最上部に常設、オン/オフ切り替え可） */}
      <div className="notify-bar" style={{marginTop:14}}>
        <span style={{fontSize:12.5,fontWeight:700}}>
          {s.notifyEnabled
            ? (importantNewsAll.length ? `⚠ 重要ニュース ${importantNewsAll.length}件（「ニュース」タブで確認）` : "重要ニュース通知：オン（該当ニュースなし）")
            : "重要ニュース通知：オフ"}
        </span>
        <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,cursor:"pointer"}}>
          <input type="checkbox" checked={s.notifyEnabled} onChange={e=>set({notifyEnabled:e.target.checked})}/>通知を有効にする
        </label>
      </div>

      {/* Choruco Style / ちょる子式（2026-09-12新規、指示書51・52番）：メイン画面上部の
          MARKET MODEバナー。ATTACK=緑系/NORMAL=黄橙系/DEFENSE=赤系（既存テーマの
          --up/--accent/--downをそのまま流用、日本の相場慣習配色とは独立した意味づけ）。 */}
      {chorucoMode && (()=>{const meta=CHORUCO_MODE_META[chorucoMode.mode]||{label:chorucoMode.mode,icon:"🛡",color:"var(--inkSoft)"};
        const eventMeta=CHORUCO_EVENT_RISK_META[chorucoMode.event_risk_level]||{label:"—",color:"var(--inkFaint)"};
        const mult=chorucoMode.position_multiplier;
        return <div className="notify-bar" style={{marginTop:8,border:`1px solid ${meta.color}`,flexWrap:"wrap",gap:10}}>
          <span style={{fontSize:13,fontWeight:800,color:meta.color}}>🛡 Market Mode　{meta.icon} {meta.label}</span>
          <span style={{fontSize:11.5,color:"var(--inkSoft)"}}>Score {chorucoMode.score}/100（確信度{chorucoMode.confidence}）</span>
          <span style={{fontSize:11.5,color:eventMeta.color}}>Event Risk: {eventMeta.label}</span>
          {mult!=null && <span style={{fontSize:11.5,color:"var(--inkSoft)"}}>推奨ロット {mult}x</span>}
          {chorucoMode.force_defense && <span style={{fontSize:11,color:"var(--down)",fontWeight:700}}>⚠強制DEFENSE：{(chorucoMode.force_defense_reasons||[]).join("・")}</span>}
        </div>;})()}

      {/* Sector Rotation / Capital Flow Engine（2026-09-12新規、指示書27番）：コンパクト表示。
          スコアが取れているテーマのみ、上位5件を表示する（UIを肥大化させない）。 */}
      {sectorRotationMap && sectorRotationMap.map?.some(s=>s.score!=null) && (()=>{
        const top=[...sectorRotationMap.map].filter(s=>s.score!=null).sort((a,b)=>(b.score||0)-(a.score||0)).slice(0,5);
        const stateColor={LEADING:"var(--up)",IMPROVING:"var(--up)",NEUTRAL:"var(--inkSoft)",WEAKENING:"var(--down)",LAGGING:"var(--down)"};
        return <div className="notify-bar" style={{marginTop:8,flexWrap:"wrap",gap:10}}>
          <span style={{fontSize:12.5,fontWeight:800}}>🔄 Sector Rotation</span>
          {top.map(s=><span key={s.sector} style={{fontSize:11.5}}>
            {s.sector}　<b style={{color:stateColor[s.state]||"var(--inkSoft)"}}>{s.state}</b>
          </span>)}
        </div>;})()}

      {/* v3-4（UI/UX再設計）：タブ構成をTAB_GROUPS（本ファイル上部で定義）に基づく2階層ナビゲーション
          に変更。第1階層＝グループ（監視銘柄／市場／トレード分析／ポジション／記録／ニュース）、
          第2階層＝グループ内の既存タブ（グループ内が1つだけなら省略）。既存のtabキー・各パネルの
          render条件（{tab==="xxx" && ...}）は一切変更していない。 */}
      <div className="tabs tabs-main">
        {TAB_GROUPS.map(g=>
          <button key={g.key} className={"tab"+(g.tabs.some(t=>t.key===tab)?" on":"")}
            onClick={()=>setTab(g.tabs.some(t=>t.key===tab)?tab:g.tabs[0].key)}>{g.label}
            {/* 指示書9番：評価未確認時は赤/オレンジ系のdotを付ける */}
            {g.key==="dailyreview" && dailyReviewUnread && <span style={{marginLeft:4,color:"var(--down)"}}>●</span>}
          </button>)}
      </div>
      {(()=>{const activeGroup=TAB_GROUPS.find(g=>g.tabs.some(t=>t.key===tab))||TAB_GROUPS[0];
        return activeGroup.tabs.length>1 && <div className="tabs" style={{marginTop:4}}>
          {activeGroup.tabs.map(t=>
            <button key={t.key} className={"tab"+(tab===t.key?" on":"")} onClick={()=>setTab(t.key)} style={{fontSize:12}}>{t.label}</button>)}
        </div>;})()}

      {/* ===== 日次モニター（独立タブ） ===== */}
      {tab==="monitor" && <div style={{marginTop:18}}>
        <MarketEnvironmentBanner metrics={s.metrics} watchlistAll={watchlistAll} stockQuotes={s.stockQuotes} top5={todayTop5}/>
        <TodayEventsWidget events={marketEvents} heldItems={heldItems} onOpen={()=>setTab("eventDashboard")}/>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
          <div className="sec-head">日次モニター</div>
          <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            <span style={{fontSize:11,color:"var(--inkSoft)"}}>{monitorFetching?"更新中…":monitorMsg}</span>
          </div>
        </div>
        <div className="sec-note">30秒おきに自動更新（数値は遅延あり）。項目クリックでチャート表示。</div>
        <TodaysMarketCard metrics={s.metrics} watchlistAll={watchlistAll} stockQuotes={s.stockQuotes}
          marketRisk={s.marketRisk} onRefresh={fetchMarketRisk} refreshing={marketRiskFetching}
          activeRules={s.myRules.filter(r=>r.active).map(r=>r.text)} importantNews={importantNewsAll}
          sectorRegimes={sectorRegimes} morningSectorRegime={s.morningSectorRegime} onRefreshSectorRegime={fetchSectorRegime} sectorRegimeFetching={sectorRegimeFetching}/>
        <ThemeSectorRanking watchlistAll={watchlistAll} stockQuotes={s.stockQuotes} metrics={s.metrics}/>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))",gap:1,background:"var(--rule)",border:"1px solid var(--rule)",borderRadius:4,overflow:"hidden"}}>
          {METRICS.map(m=>{const v=s.metrics[m.key];const t=num(v.t),p=num(v.p);
            const delta=t!=null&&p!=null?t-p:null;
            const pct=t!=null&&p!=null&&p?(t-p)/p*100:null;
            const c=changeColor(pct);
            const sparkColor=c.level>0?c.fg:"#8a8f86"; // セル背景と同色に埋もれないよう、文字色と同じコントラスト色で描画
            const condOn=m.cond&&t!=null&&m.cond(t);
            const isOpen=openMetrics.has(m.key);
            return <React.Fragment key={m.key}>
              <button onClick={()=>toggleMetric(m.key)} style={{width:"100%",background:c.bg,padding:"11px 13px",
                  border:condOn?"2px solid var(--gain)":"none",boxSizing:"border-box",textAlign:"left",cursor:"pointer",font:"inherit",
                  color:c.level>0?c.fg:"var(--ink)"}}>
                <div style={{fontSize:21,fontWeight:700,color:c.level>0?c.fg:"var(--ink)",display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
                  <span>{m.label}</span>{condOn&&<span className="mono" style={{fontSize:10,color:c.level>0?c.fg:"var(--gain)",fontWeight:700}}>条件○</span>}
                </div>
                <div style={{display:"flex",alignItems:"baseline",gap:7,marginTop:3,justifyContent:"flex-end"}}>
                  <span className="mono" style={{fontSize:21,fontWeight:700}}>{t!=null?t.toFixed(m.dp):"—"}</span>
                  {delta!=null&&<span className="mono" style={{fontSize:12}}>{delta>0?"▲":delta<0?"▼":""}{delta>0?"+":""}{delta.toFixed(m.dp)}</span>}
                </div>
                <div style={{marginTop:7,fontSize:12,color:c.level>0?c.fgSoft:"var(--inkSoft)",textAlign:"right"}}>前日 <span className="mono">{p!=null?p.toFixed(m.dp):"—"}</span></div>
                <div style={{marginTop:8}}><Sparkline data={v.spark} color={sparkColor}/></div>
              </button>
              {isOpen && <div style={{gridColumn:"1 / -1",background:"var(--card)",padding:12}}>
                {m.tvEmbed
                  ? <>
                      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8,marginBottom:8}}>
                        <IntervalSwitcher value={monitorInterval} onChange={setMonitorInterval}/>
                        {m.chartLabel && <span style={{fontSize:11.5,fontWeight:700,color:"var(--accent)"}}>{m.chartLabel}</span>}
                      </div>
                      {m.chartNote &&
                        <div style={{fontSize:11,color:"var(--inkSoft)",marginBottom:8,lineHeight:1.5}}>ℹ️ {m.chartNote}</div>}
                      <div ref={el=>metricRefs.current[m.key]=el} style={{border:"1px solid var(--rule)",borderRadius:4,overflow:"hidden",background:"var(--card)",minHeight:444}}></div>
                    </>
                  : <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10,padding:"8px 4px"}}>
                      <span style={{fontSize:12.5,color:"var(--inkSoft)"}}>{m.label}は無料埋め込みでは表示できないシンボルです。</span>
                      <button className="btn primary" onClick={()=>openTV(m.tv)}>↗ TradingViewで開く</button>
                    </div>}
              </div>}
            </React.Fragment>;})}
        </div>

        {/* v3-5（日次モニター情報優先順位）：Market→Sector→Stockの最後、「RS上位監視銘柄」を
            日次モニター末尾に置く。監視銘柄タブの「今日の注目TOP5」と同じtodayTop5（App側で
            computeEnrichedWatch/rankTop5により算出済み）をそのまま再利用し、新規計算はしない。
            クリックで既存のopenAnalysisFor（analysisTargetsに追加＋トレード分析タブへ遷移）を使う。 */}
        <div style={{marginTop:18}}>
          <div className="sec-head" style={{fontSize:14}}>RS上位 監視銘柄</div>
          {todayTop5.length===0
            ? <div style={{fontSize:12,color:"var(--inkFaint)",marginTop:6}}>判定可能な監視銘柄がまだありません。</div>
            : <div style={{display:"flex",flexDirection:"column",gap:4,marginTop:8}}>
                {todayTop5.map(w=>{
                  const grade=lightweightGrade(w);
                  const cur=num(s.stockQuotes[w.code]?.t);
                  return <div key={w.code} onClick={()=>openAnalysisFor(w.code)}
                    style={{display:"flex",alignItems:"center",gap:10,padding:"6px 10px",borderRadius:4,cursor:"pointer",
                      border:"1px solid var(--rule)",background:"var(--card)"}}>
                    <span className="mono" style={{fontSize:11,color:"var(--inkSoft)",width:44}}>{w.code}</span>
                    <span style={{fontSize:12.5,fontWeight:700,minWidth:100}}>{w.name}</span>
                    <span className="mono" style={{fontSize:12,marginLeft:"auto"}}>{cur!=null?cur.toLocaleString():"—"}</span>
                    <span className="mono" style={{fontSize:11.5,width:60,textAlign:"right",
                      color:w.pct==null?"var(--inkFaint)":w.pct>0?"var(--up)":w.pct<0?"var(--down)":"var(--inkFaint)"}}>

                                  <td style={{color:"var(--inkSoft)",padding:"2px 0 2px 14px"}}>BPS（実績）</td><td style={{textAlign:"right"}}>{a.issueDetail.pBPSB||"—"}</td></tr>
                              <tr><td style={{color:"var(--inkSoft)",padding:"2px 0"}}>ROE（予想）</td><td style={{textAlign:"right"}}>{a.issueDetail.pROEL||"—"}</td>
                                  <td style={{color:"var(--inkSoft)",padding:"2px 0 2px 14px"}}>配当利回り（予想）</td><td style={{textAlign:"right"}}>{a.issueDetail.pSYIE||"—"}</td></tr>
                              <tr><td style={{color:"var(--inkSoft)",padding:"2px 0"}}>株式益回り</td><td style={{textAlign:"right"}}>{a.issueDetail.pSPRO||"—"}</td>
                                  <td style={{color:"var(--inkSoft)",padding:"2px 0 2px 14px"}}>配当権利落日</td><td style={{textAlign:"right"}}>{a.issueDetail.pCLOE||"—"}</td></tr>
                              <tr><td style={{color:"var(--inkSoft)",padding:"2px 0"}}>年初来高値</td><td style={{textAlign:"right"}}>{a.issueDetail.pYHPR||"—"}{a.issueDetail.pYHPD&&<span style={{color:"var(--inkFaint)",fontSize:10.5}}>（{a.issueDetail.pYHPD}）</span>}</td>
                                  <td style={{color:"var(--inkSoft)",padding:"2px 0 2px 14px"}}>年初来安値</td><td style={{textAlign:"right"}}>{a.issueDetail.pYLPR||"—"}{a.issueDetail.pYLPD&&<span style={{color:"var(--inkFaint)",fontSize:10.5}}>（{a.issueDetail.pYLPD}）</span>}</td></tr>
                            </tbody></table>
                          </div>}
                          {a.shinyouZan && <div style={{marginTop:10,paddingTop:9,borderTop:"1px solid var(--ruleSoft)"}}>
                            <div style={{fontSize:12.5,fontWeight:700,color:"var(--ink)",marginBottom:6}}>信用残情報{a.shinyouZan.pMBD&&<span style={{fontWeight:400,color:"var(--inkFaint)",fontSize:11}}>（{a.shinyouZan.pMBD}時点）</span>}</div>
                            <table style={{width:"100%",fontSize:12.5,borderCollapse:"collapse"}}>
                              <thead><tr style={{color:"var(--inkFaint)"}}><td></td><td style={{textAlign:"right"}}>買残</td><td style={{textAlign:"right"}}>売残</td><td style={{textAlign:"right"}}>信用倍率</td></tr></thead>
                              <tbody>
                                <tr><td style={{color:"var(--inkSoft)"}}>合算</td><td style={{textAlign:"right"}}>{a.shinyouZan.pMBBQ||"—"}</td><td style={{textAlign:"right"}}>{a.shinyouZan.pMBSQ||"—"}</td><td style={{textAlign:"right",fontWeight:700}}>{a.shinyouZan.pMBRQ||"—"}倍</td></tr>
                                <tr><td style={{color:"var(--inkSoft)"}}>制度信用</td><td style={{textAlign:"right"}}>{a.shinyouZan.pMBB6||"—"}</td><td style={{textAlign:"right"}}>{a.shinyouZan.pMBS6||"—"}</td><td style={{textAlign:"right"}}>{a.shinyouZan.pMBR6||"—"}倍</td></tr>
                                <tr><td style={{color:"var(--inkSoft)"}}>一般信用</td><td style={{textAlign:"right"}}>{a.shinyouZan.pMBB3||"—"}</td><td style={{textAlign:"right"}}>{a.shinyouZan.pMBS3||"—"}</td><td style={{textAlign:"right"}}>{a.shinyouZan.pMBR3||"—"}倍</td></tr>
                              </tbody>
                            </table>
                          </div>}
                          {a.syoukinZan && <div style={{marginTop:10,paddingTop:9,borderTop:"1px solid var(--ruleSoft)"}}>
                            <div style={{fontSize:12.5,fontWeight:700,color:"var(--ink)",marginBottom:6}}>証金残情報{a.syoukinZan.pSFD&&<span style={{fontWeight:400,color:"var(--inkFaint)",fontSize:11}}>（{a.syoukinZan.pSFD}時点・{a.syoukinZan.pSFKS==="2"?"確報":"速報"}）</span>}</div>
                            <div style={{fontSize:12.5,color:"var(--ink)",lineHeight:1.8}}>
                              融資残 <b className="mono">{a.syoukinZan.pSFF6||"—"}</b>（前日比 {a.syoukinZan.pSFG6||"—"}）　貸株残 <b className="mono">{a.syoukinZan.pSFS6||"—"}</b>（前日比 {a.syoukinZan.pSSG6||"—"}）<br/>
                              差引残 <b className="mono">{a.syoukinZan.pSFN6||"—"}</b>（前日比 {a.syoukinZan.pSFC6||"—"}）　貸借倍率 <b className="mono">{a.syoukinZan.pSFR6||"—"}</b>倍　回転日数 {a.syoukinZan.pSFD6||"—"}日
                            </div>
                          </div>}
                          {a.hibuInfo && <div style={{marginTop:10,paddingTop:9,borderTop:"1px solid var(--ruleSoft)"}}>
                            <div style={{fontSize:12.5,fontWeight:700,color:"var(--ink)",marginBottom:6}}>逆日歩情報</div>
                            <div style={{fontSize:12.5,color:"var(--ink)"}}>
                              {a.hibuInfo.pBWRQ ? <>逆日歩 <b className="mono" style={{color:"var(--down)"}}>{a.hibuInfo.pBWRQ}円</b>（信用売り方は要注意）</> : "逆日歩なし"}
                            </div>
                          </div>}
                          {a.stockNews && a.stockNews.length>0 && <div style={{marginTop:10,paddingTop:9,borderTop:"1px solid var(--ruleSoft)"}}>
                            <div style={{fontSize:12.5,fontWeight:700,color:"var(--ink)",marginBottom:6}}>ニュース</div>
                            <div style={{display:"flex",flexDirection:"column",gap:8}}>
                              {a.stockNews.map((n,i)=>
                                <div key={i} style={{fontSize:12,lineHeight:1.6}}>
                                  <div style={{fontWeight:700,color:"var(--ink)"}}>{n.headline}{n.published&&<span style={{fontWeight:400,color:"var(--inkFaint)",marginLeft:6,fontSize:10.5}}>{n.published}</span>}</div>
                                  {n.body && <div style={{color:"var(--inkSoft)",marginTop:2,whiteSpace:"pre-wrap"}}>{n.body}</div>}
                                </div>)}
                            </div>
                          </div>}
                          </div>}
                        </div>}
                  </div>;
                })}
              </div>
            </div>}

        {/* 2026-09-17新規（Event Risk Guard＋トレード反省メモ Phase A、PHASE 9）：
            「今日の反省・気づき」。保存すると自動でcategory/tags/event_types/lesson/
            future_ruleがルールベース抽出される（完全な自然言語理解は目指さない）。 */}
        <div className="card" style={{padding:"10px 12px",marginTop:16}}>
          <b style={{fontSize:12.5}}>📝 今日の反省・気づき</b>
          <textarea value={reflectionDraft} onChange={e=>setReflectionDraft(e.target.value)}
            placeholder="例：FOMC後に上昇したことで地合いを楽観視し、翌日の日銀会合当日にエントリーしてしまった…"
            style={{width:"100%",minHeight:70,marginTop:6,fontSize:12.5,padding:6,boxSizing:"border-box",
              border:"1px solid var(--rule)",borderRadius:4,background:"var(--paper)",color:"var(--ink)"}}/>
          <div style={{marginTop:6}}>
            <button className="action-btn" onClick={saveReflection} disabled={reflectionSaving||!reflectionDraft.trim()}>
              {reflectionSaving?"保存中…":"反省を保存"}
            </button>
          </div>
          {reflections.length>0 && <div style={{marginTop:10,display:"flex",flexDirection:"column",gap:8}}>
            {reflections.map(item=>
              <div key={item.id} style={{border:"1px solid var(--rule)",borderRadius:4,padding:"6px 8px",fontSize:11.5}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span className="mono" style={{color:"var(--inkFaint)"}}>{item.tradeDate}</span>
                  <button className="iconbtn" onClick={()=>reflectionEditId===item.id?setReflectionEditId(null):startEditReflection(item)}>
                    {reflectionEditId===item.id?"閉じる":"編集"}
                  </button>
                </div>
                {reflectionEditId===item.id
                  ? <div style={{marginTop:4,display:"flex",flexDirection:"column",gap:4}}>
                      <textarea value={reflectionEditDraft?.reflectionText||""}
                        onChange={e=>setReflectionEditDraft(p=>({...p,reflectionText:e.target.value}))}
                        style={{width:"100%",minHeight:50,fontSize:11.5,padding:4,boxSizing:"border-box",
                          border:"1px solid var(--rule)",borderRadius:4,background:"var(--paper)",color:"var(--ink)"}}/>
                      <input value={reflectionEditDraft?.lesson||""} placeholder="lesson（教訓）"
                        onChange={e=>setReflectionEditDraft(p=>({...p,lesson:e.target.value}))}
                        style={{width:"100%",fontSize:11.5,padding:4,boxSizing:"border-box",
                          border:"1px solid var(--rule)",borderRadius:4,background:"var(--paper)",color:"var(--ink)"}}/>
                      <input value={reflectionEditDraft?.futureRule||""} placeholder="future_rule（次回ルール）"
                        onChange={e=>setReflectionEditDraft(p=>({...p,futureRule:e.target.value}))}
                        style={{width:"100%",fontSize:11.5,padding:4,boxSizing:"border-box",
                          border:"1px solid var(--rule)",borderRadius:4,background:"var(--paper)",color:"var(--ink)"}}/>
                      <button className="action-btn" onClick={saveEditReflection}>保存する</button>
                    </div>
                  : <>
                      <div style={{marginTop:2,whiteSpace:"pre-wrap"}}>{item.reflectionText}</div>
                      {item.tags&&item.tags.length>0 && <div style={{marginTop:4,display:"flex",flexWrap:"wrap",gap:4}}>
                        {item.tags.map(t=><span key={t} className="chip" style={{fontSize:9.5}}>{t}</span>)}
                      </div>}
                      {item.lesson && <div style={{marginTop:4,color:"var(--inkSoft)"}}>教訓：{item.lesson}</div>}
                      {item.futureRule && <div style={{marginTop:2,color:"var(--inkSoft)"}}>次回ルール：{item.futureRule}</div>}
                    </>}
              </div>)}
          </div>}
        </div>
      </div>}

      {/* ===== 記録（17章：売買記録・トレードジャーナル） ===== */}
      {tab==="journal" && <div style={{marginTop:18}}>
        <div className="sec-head">記録</div>
        {!s.investmentLogMigrated && <div className="sec-note" style={{fontSize:11}}>※ 現在この端末のブラウザにのみ保存されています。</div>}
        {/* 2026-09-02 ユーザー要望「投資判断ログ」：既存の記録・マイルールをサーバーDBへ移行する
            ボタン。移行後はsyncJournalSave等が自動でサーバーにも同期するため、この操作は
            1回だけでよい（IDが同じものは上書きになるため、誤って複数回押しても壊れない）。 */}
        <div style={{background:"var(--card)",border:"1px solid var(--rule)",borderRadius:4,padding:"10px 14px",marginBottom:14,display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
          {s.investmentLogMigrated
            ? <span style={{fontSize:12.5,color:"var(--up)",fontWeight:700}}>✓ サーバーDBへ移行済み（記録・マイルールはNeon Postgresに保存されています）</span>
            : <>
                <span style={{fontSize:12.5,color:"var(--inkSoft)"}}>記録・マイルールはまだこの端末のブラウザだけに保存されています。「投資判断ログ」タブと合わせて分析・MCP連携するには、サーバーDBへの移行が必要です。</span>
                <button className="btn" onClick={migrateToInvestmentDb} disabled={migratingLog}>{migratingLog?"移行中…":"サーバーDBへ移行"}</button>
              </>}
          {migrateLogMsg && <span style={{fontSize:11.5,color:"var(--inkSoft)"}}>{migrateLogMsg}</span>}
        </div>

        {/* v3-2（watchlistのNeon化）：ブラウザ側watchlistをサーバーDBへ移行するボタン。
            journal/rulesとは別フラグ（watchlistMigrated）で管理する。investmentLogMigrated
            （＝DB接続そのものが有効か）が前提条件。 */}
        <div style={{background:"var(--card)",border:"1px solid var(--rule)",borderRadius:4,padding:"10px 14px",marginBottom:14,display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
          {!s.investmentLogMigrated
            ? <span style={{fontSize:12.5,color:"var(--inkFaint)"}}>監視銘柄一覧のサーバー移行は、上の「サーバーDBへ移行」を先に行ってください。</span>
            : s.watchlistMigrated
              ? <span style={{fontSize:12.5,color:"var(--up)",fontWeight:700}}>✓ 監視銘柄一覧はサーバーDBへ移行済み（複数端末で同じ一覧を共有できます）</span>
              : <>
                  <span style={{fontSize:12.5,color:"var(--inkSoft)"}}>監視銘柄一覧（日本市場・アメリカ市場の登録銘柄）はまだこの端末のブラウザだけに保存されています。複数端末で共有したりChatGPT連携と組み合わせるには、サーバーDBへの移行が必要です。</span>
                  <button className="btn" onClick={migrateWatchlistToNeon} disabled={migratingWatchlist}>{migratingWatchlist?"移行中…":`監視銘柄をサーバーDBへ移行（${s.watchlist.length+s.watchlistUS.length}件）`}</button>
                </>}
          {migrateWatchlistMsg && <span style={{fontSize:11.5,color:"var(--inkSoft)"}}>{migrateWatchlistMsg}</span>}
        </div>

        {/* マイルール：追加・オンオフ・削除できる自分のトレードルール一覧。2026-08-20：
            固定リマインド文をやめ、良いトレード・気づきの都度育てられる形にした。
            エントリー・利確・損切りの機械的な判定（押し目/高値ブレイク・出来高ブレイクアウト等）は
            別物として銘柄分析タブの各カードに自動反映されている（このマイルールは自由記述の
            自己ルールで、ここでの自動判定はしない）。 */}
        <div style={{background:"var(--card)",border:"1px solid var(--rule)",borderRadius:4,padding:"12px 14px",marginBottom:14}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
            <div style={{fontWeight:700,color:"var(--ink)",fontSize:13}}>マイルール</div>
            <span style={{fontSize:11,color:"var(--inkFaint)"}}>{s.myRules.filter(r=>r.active).length}/{s.myRules.length}件 有効</span>
          </div>
          <div style={{display:"flex",gap:8,marginBottom:10}}>
            <input value={newRuleText} onChange={e=>setNewRuleText(e.target.value)}
              onKeyDown={e=>{if(e.key==="Enter"){addMyRule(newRuleText);setNewRuleText("");}}}
              placeholder="新しいルールを追加（例：決算またぎは自信がある銘柄のみ）"
              style={{flex:1,fontSize:12.5,padding:"6px 8px",border:"1px solid var(--rule)",borderRadius:3,background:"var(--bg)",color:"var(--ink)"}}/>
            <button className="btn" onClick={()=>{addMyRule(newRuleText);setNewRuleText("");}}>追加</button>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
            <button className="action-btn" onClick={seedDefaultRules} disabled={!s.investmentLogMigrated}
              title={s.investmentLogMigrated?"":"サーバーDBへの移行後に使えます（このタブ下部の「サーバーDBへ移行」ボタン）"}>
              ＋ 初期ルールを追加（損切り-10%・落ちるナイフ禁止など6件）
            </button>
            {seedRulesMsg && <span style={{fontSize:11,color:"var(--inkSoft)"}}>{seedRulesMsg}</span>}
          </div>
          {s.myRules.length===0
            ? <div style={{fontSize:12,color:"var(--inkFaint)"}}>まだルールがありません。上の欄から追加するか、下の記録の「学び」から追加できます。</div>
            : <div style={{display:"flex",flexDirection:"column",gap:4}}>
                {s.myRules.map(r=>
                  <label key={r.id} style={{display:"flex",alignItems:"center",gap:8,fontSize:12.5,padding:"4px 2px",
                      color:r.active?"var(--ink)":"var(--inkFaint)",textDecoration:r.active?"none":"line-through"}}>
                    <input type="checkbox" checked={r.active} onChange={()=>toggleMyRule(r.id)}/>
                    {r.priority && <span className="chip" style={{fontSize:9.5}}>{r.priority}</span>}
                    <span style={{flex:1}}>{r.text}</span>
                    <button className="iconbtn" title="削除" onClick={()=>deleteMyRule(r.id)}>×</button>
                  </label>)}
              </div>}
        </div>

        {/* 資金管理・分割買いツール：総資金とリスク許容%から、銘柄分析タブの各カードの損切り幅に
            応じた株数目安を計算する。値はsettingsとしてlocalStorageに自動保存される。
            2026-08-20：銘柄分析タブをすっきりさせるためこちらに移設（計算自体は銘柄分析タブの各カードで行う）。 */}
        <div style={{background:"var(--card)",border:"1px solid var(--rule)",borderRadius:4,padding:"10px 14px",marginBottom:14,display:"flex",flexWrap:"wrap",gap:14,alignItems:"center"}}>
          <div style={{fontSize:12,fontWeight:700,color:"var(--ink)"}}>資金管理設定</div>
          <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:"var(--inkSoft)"}}>総資金
            <input type="number" min="0" step="10000" value={s.settings?.totalCapital??""} placeholder="例：1000000"
              onChange={e=>setS({...s,settings:{...s.settings,totalCapital:e.target.value}})}
              style={{width:120,fontSize:13,padding:"3px 6px",border:"1px solid var(--rule)",borderRadius:3,background:"var(--bg)",color:"var(--ink)"}}/>円
          </label>
          <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:"var(--inkSoft)"}}>1トレードの許容損失
            <input type="number" min="0.1" max="10" step="0.1" value={s.settings?.riskPct??1}
              onChange={e=>setS({...s,settings:{...s.settings,riskPct:e.target.value}})}
              style={{width:60,fontSize:13,padding:"3px 6px",border:"1px solid var(--rule)",borderRadius:3,background:"var(--bg)",color:"var(--ink)"}}/>%
          </label>
          <div style={{fontSize:11,color:"var(--inkFaint)"}}>※ 銘柄分析タブの各銘柄カードで、この設定を使った株数目安が表示されます。</div>
        </div>
        {/* デスクトップ通知＋セクター内逆行銘柄。セクター内逆行銘柄は登録銘柄全体が対象。
            2026-08-20：銘柄分析タブをすっきりさせるためこちらに移設。
            2026-08-21：旧「本日優先」5分おき自動スキャン機能は「監視銘柄」タブに置き換えて撤去。
            出来高ブレイクアウトの該当銘柄も、ここへのチップ表示ではなく監視銘柄タブへの自動追加に変更。 */}
        <div style={{background:"var(--card)",border:"1px solid var(--rule)",borderRadius:4,padding:"12px 14px",marginBottom:14}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10}}>
            <div style={{fontSize:13,fontWeight:700,color:"var(--ink)"}}>🔔 デスクトップ通知</div>
            {notifyPermission!=="granted" &&
              <button className="btn" onClick={requestNotifyPermission}>{notifyPermission==="unsupported"?"通知非対応ブラウザ":"デスクトップ通知を許可"}</button>}
          </div>
          {sectorLaggards.length>0 && <div style={{marginTop:12,paddingTop:10,borderTop:"1px solid var(--ruleSoft)"}}>
            <div style={{fontSize:12.5,fontWeight:700,color:"var(--ink)",marginBottom:6}}>↗ セクター内逆行銘柄（弱いセクターの中で一人勝ちしている銘柄）</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {sectorLaggards.slice(0,10).map(item=>
                <span key={item.code} className="chip" style={{cursor:"default"}}>{item.name}（{item.code}）：{item.pct>0?"+":""}{item.pct.toFixed(2)}% / {item.sector}平均{item.sectorAvg.toFixed(2)}%</span>)}
            </div>
          </div>}
        </div>

        {journalDraft && <div className="card" style={{marginTop:12,marginBottom:16,padding:"14px 16px"}}>
          <div style={{fontWeight:700,marginBottom:8}}>記録の下書き：{journalDraft.name}（{journalDraft.code}）</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:10,marginBottom:8}}>
            <label style={{fontSize:12,color:"var(--inkSoft)"}}>区分
              <select value={journalDraft.action} onChange={e=>setJournalDraft({...journalDraft,action:e.target.value})} style={{marginLeft:6,fontSize:13}}>
                {["新規買い","買い増し","利確","損切り","見送り"].map(a=><option key={a} value={a}>{a}</option>)}
              </select>
            </label>
            <label style={{fontSize:12,color:"var(--inkSoft)"}}>価格
              <input type="number" value={journalDraft.price} onChange={e=>setJournalDraft({...journalDraft,price:e.target.value})}
                style={{marginLeft:6,width:100,fontSize:13,padding:"2px 6px",border:"1px solid var(--rule)",borderRadius:3,background:"var(--bg)",color:"var(--ink)"}}/>
            </label>
            <label style={{fontSize:12,color:"var(--inkSoft)"}}>株数
              <input type="number" value={journalDraft.shares} onChange={e=>setJournalDraft({...journalDraft,shares:e.target.value})}
                style={{marginLeft:6,width:90,fontSize:13,padding:"2px 6px",border:"1px solid var(--rule)",borderRadius:3,background:"var(--bg)",color:"var(--ink)"}}/>
            </label>
          </div>
          <div style={{fontSize:11.5,color:"var(--inkSoft)",marginBottom:6}}>
            エントリー時プラン：購入{journalDraft.entryPlan.entry?.toLocaleString?.()??"—"}／損切り{journalDraft.entryPlan.stop?.toLocaleString?.()??"—"}／利確{journalDraft.entryPlan.target?.toLocaleString?.()??"—"}
            {journalDraft.marketEnvAtEntry && <> ・地合い：{journalDraft.marketEnvAtEntry}</>}
          </div>
          <label style={{display:"block",fontSize:12,color:"var(--inkSoft)",marginBottom:8}}>理由
            <textarea value={journalDraft.reason} onChange={e=>setJournalDraft({...journalDraft,reason:e.target.value})}
              rows={2} style={{display:"block",width:"100%",fontSize:12.5,padding:6,marginTop:4,border:"1px solid var(--rule)",borderRadius:3,background:"var(--bg)",color:"var(--ink)"}}/>
          </label>
          <div style={{display:"flex",gap:8}}>
            <button className="btn primary" onClick={saveJournalEntry}>記録を保存</button>
            <button className="btn" onClick={()=>setJournalDraft(null)}>破棄</button>
          </div>
        </div>}

        {s.journal.length===0
          ? <div style={{padding:26,textAlign:"center",color:"var(--inkSoft)",fontSize:13,border:"1px solid var(--rule)",borderRadius:4,background:"var(--card)"}}>
              記録はまだありません。「銘柄分析」タブの各カードにある「記録に追加」ボタンから記録できます。
            </div>
          : <>
              <div style={{fontSize:12,color:"var(--inkSoft)",marginBottom:8}}>
                合計{s.journal.length}件（{["成功","失敗","引分","未定"].map(r=>`${r}${s.journal.filter(j=>j.result===r).length}`).join("・")}）
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                {s.journal.map(j=><div key={j.id} className="card" style={{padding:"12px 14px"}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:6}}>
                    <div>
                      <b>{j.name}</b> <span className="mono" style={{fontSize:12,color:"var(--inkSoft)"}}>{j.code}</span>
                      <span style={{marginLeft:8,fontSize:12,color:"var(--inkSoft)"}}>{j.action}　{j.price?Number(j.price).toLocaleString():"—"}円 × {j.shares||"—"}株</span>
                    </div>
                    <span style={{fontSize:11,color:"var(--inkFaint)"}}>{new Date(j.createdAt).toLocaleString()}</span>
                  </div>
                  {j.reason && <div style={{fontSize:12,color:"var(--inkSoft)",marginTop:4}}>理由：{j.reason}</div>}
                  {j.marketEnvAtEntry && <div style={{fontSize:11,color:"var(--inkFaint)",marginTop:2}}>地合い：{j.marketEnvAtEntry}</div>}
                  <div style={{fontSize:11,color:"var(--inkFaint)",marginTop:2}}>
                    プラン：購入{j.entryPlan?.entry?.toLocaleString?.()??"—"}／損切り{j.entryPlan?.stop?.toLocaleString?.()??"—"}／利確{j.entryPlan?.target?.toLocaleString?.()??"—"}
                  </div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:10,alignItems:"center",marginTop:8}}>
                    <label style={{fontSize:12,color:"var(--inkSoft)"}}>結果
                      <select value={j.result} onChange={e=>updateJournalEntry(j.id,{result:e.target.value})} style={{marginLeft:6,fontSize:12.5}}>
                        {["未定","成功","失敗","引分"].map(r=><option key={r} value={r}>{r}</option>)}
                      </select>
                    </label>
                    <button className="iconbtn" style={{marginLeft:"auto"}} title="削除" onClick={()=>deleteJournalEntry(j.id)}>×</button>
                  </div>
                  <label style={{display:"block",fontSize:11.5,color:"var(--inkSoft)",marginTop:6}}>学び・次回改善点
                    <textarea value={j.lessonNote} onChange={e=>updateJournalEntry(j.id,{lessonNote:e.target.value})}
                      rows={2} style={{display:"block",width:"100%",fontSize:12,padding:6,marginTop:4,border:"1px solid var(--rule)",borderRadius:3,background:"var(--bg)",color:"var(--ink)"}}/>
                  </label>
                  {j.lessonNote?.trim() && <button className="action-btn" style={{marginTop:6}}
                      onClick={()=>addMyRule(j.lessonNote)}>＋ この学びをマイルールに追加</button>}
                </div>)}
              </div>
            </>}
      </div>}

      {/* ===== ポジション（v3-4新規：保有株の管理を独立タブに分離） =====
          中身は既存のPortfolioPanel（Neonの portfolio テーブルで完結、localStorage移行フローなし）
          をそのまま移設。SL/TP・含み損益・トレーリング状態などの拡張は本タブ新設とは別タスク。 */}
      {tab==="position" && <div style={{marginTop:18}}>
        <div className="sec-head">ポジション</div>
        <div className="sec-note">保有中の建玉のみを表示します。売買記録・振り返りは「記録」タブへ。</div>
        <PortfolioPanel stockQuotes={s.stockQuotes} analysisData={s.analysisData} analysisEnrichedMap={analysisEnrichedMap} marketEvents={marketEvents} newsCatalysts={newsCatalysts} expertViews={expertViews}
          candidatesJP={masterJP} candidatesUS={masterUS} onAddToWatchlist={addToWatchlistDirect} eventRiskGuard={eventRiskGuard}
          onOpenChart={it=>setChartModal({symbol:it.market==="JP"?"TSE:"+it.code:it.code,name:it.name,code:it.code,market:it.market})}/>
      </div>}

      {/* ===== 投資判断ログ（2026-09-02新規） ===== */}
      {tab==="investlog" && <InvestmentLogPanel
        marketEnvAuto={marketEnvAuto} usMarketAuto={usMarketAuto} interestRateAuto={interestRateAuto}
        fxAuto={fxAuto} oilAuto={oilAuto} sectorStrengthAuto={sectorStrengthAuto} watchTargetItems={watchTargetItems}/>}

      {/* ===== ChatGPT連携（2026-09-02新規） ===== */}
      {tab==="chatgptimport" && <>
        <ChatGptImportPanel journal={s.journal} activeRules={s.myRules.filter(r=>r.active).map(r=>r.text)}/>
        <WatchlistImportPanel watchlist={s.watchlist} setWatchlist={setWatchlistJP} masterJP={masterJP}/>
        <ChatGptDailyImportPanel/>
      </>}

      {/* ===== 統計ダッシュボード（2026-09-02新規） ===== */}
      {tab==="stats" && <StatsPanel/>}

      {/* ===== ルール（学習システム、2026-09-09新規） ===== */}
      {tab==="traderules" && <TradeRulesPanel/>}

      {/* ===== Trade Experience Learning（2026-09-11新規） ===== */}
      {tab==="tradeexperience" && <TradeExperiencePanel/>}

      {/* ===== 今日の振り返り（日次投資レビュー、2026-09-09新規） ===== */}
      {tab==="dailyreview" && <DailyReviewPanel/>}

      {/* ===== 朝一チェック（MorningMarketCheck、2026-09-10新規） ===== */}
      {tab==="morningcheck" && <MorningCheckPanel notifyPermission={notifyPermission} requestNotifyPermission={requestNotifyPermission} notifyDesktop={notifyDesktop}/>}
      {tab==="morningcheck" && <IntradayTimelineSection notifyDesktop={notifyDesktop}/>}

      {/* ===== NEWS（9章・9-1章・9-2章） ===== */}
      {tab==="news" && (()=>{
        const NEWS_SUBTABS=[
          {key:"summary",label:"サマリー"},
          {key:"domestic",label:"国内市況"},
          {key:"overseas",label:"海外市況"},
          {key:"registered",label:"登録銘柄"},
          {key:"disclosure",label:"適時開示"},
          {key:"catalyst",label:"カタリスト"},
          {key:"expert",label:"有識者"},
          // 2026-09-10新規（Unified Smart Import、Phase SI-A）：カタリスト・イベント・有識者
          // 意見をまたいだ統一取り込み口。既存の各サブタブ内「JSONを取り込む」欄は維持したまま
          // 追加する（指示書25・26番）。
          {key:"smartimport",label:"📥 スマート取り込み"},
        ];
        // v3-9続き（PHASE 4・PHASE 5）：「カタリスト」「有識者」サブタブだけはニュース本体
        // （RSS/TDnet）ではなく、それぞれnews_catalysts／expert_views（構造化情報）を表示する。
        // サブタブchip barは他タブと共通のままにして、コンテンツ部分だけ切り替える
        // （chip barを早期returnで消すと元のサブタブへ戻る手段が無くなるため）。
        const isCatalyst=newsSubTab==="catalyst";
        const isExpert=newsSubTab==="expert";
        const isSmartImport=newsSubTab==="smartimport";
        const isStructured=isCatalyst||isExpert||isSmartImport;
        let listFor=isStructured?[]:{summary:newsSummary,domestic:s.macroNewsDomestic,overseas:overseasAll,registered:stockNameNewsAll,disclosure:disclosureAll}[newsSubTab];
        const showCode=newsSubTab==="summary"||newsSubTab==="disclosure"||newsSubTab==="registered";
        // Trade Cockpit v2 Phase4（設計案30番）：銘柄コードを持つニュース一覧は、保有＞今日の候補＞
        // 監視銘柄＞テーマ一致＞その他 の順に並べ替える（Array.sortは安定ソートのため、同じ優先度内
        // では元の並び＝取得順を保つ）。
        if(showCode)listFor=[...listFor].sort((a,b)=>newsPriorityRank(a.code)-newsPriorityRank(b.code));
        const hasImportant=!isStructured&&listFor.some(it=>isImportantNews(it.title));
        return <div style={{marginTop:18}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
            <div className="sec-head">ニュース</div>
            <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
              {!isStructured && <span style={{fontSize:10.5,color:"var(--inkFaint)",border:"1px solid var(--rule)",borderRadius:10,padding:"1px 8px"}}>新着順</span>}
              <span style={{fontSize:11,color:"var(--inkSoft)"}}>{newsFetching?"更新中…":newsMsg?newsMsg+`（${NEWS_AUTO_REFRESH_MINUTES}分おき自動更新）`:`${NEWS_AUTO_REFRESH_MINUTES}分おきに自動更新`}</span>
            </div>
          </div>
          <div className="subtabs">
            {NEWS_SUBTABS.map(t=><button key={t.key} className={"chip"+(newsSubTab===t.key?" on":"")} onClick={()=>{setNewsSubTab(t.key);setNewsShowCount(NEWS_PAGE_SIZE);}}>{t.label}</button>)}
          </div>
          {!isStructured && <NewsAlertSettingsBar/>}
          {isCatalyst && <CatalystsPanel catalysts={newsCatalysts} onReload={loadNewsCatalysts} onOpenSmartImport={()=>openSmartImport("CATALYST")}/>}
          {isExpert && <ExpertViewsPanel views={expertViews} onReload={loadExpertViews} onOpenSmartImport={()=>openSmartImport("EXPERT_OPINION")}/>}
          {isSmartImport && <SmartImportPanel onReload={()=>{loadNewsCatalysts();loadExpertViews();loadMarketEvents();}}/>}
          {!isStructured && <>
                {hasImportant && <div style={{display:"flex",alignItems:"center",gap:10,background:"var(--upBg)",border:"1px solid var(--up)",borderRadius:4,padding:"10px 14px",marginBottom:12}}>
                  <span style={{fontSize:13,fontWeight:700,color:"var(--up)"}}>⚠ 重要ニュースを含みます</span>
                  <span style={{fontSize:12,color:"var(--inkSoft)"}}>サプライズ決算・戦争紛争・パンデミック・大規模災害・株価暴落に関連する見出しに印を付けています。</span>
                </div>}
                {/* 指示書J：一覧の並び順（新着順）とは独立の別枠。ここに出しても一覧自体は
                    常にpublished_at DESCのまま（重要ニュースを理由に一覧の新着順を崩さない）。 */}
                {newsSubTab==="summary" && newsImportantHighlights.length>0 && <div className="card" style={{padding:"10px 14px",marginBottom:12,borderLeft:"3px solid var(--down)"}}>
                  <div style={{fontSize:12.5,fontWeight:700,marginBottom:6}}>🚨 重要ニュース（最大5件・新着順とは別枠）</div>
                  {newsImportantHighlights.map((it,i)=><a key={i} href={it.url||undefined} target="_blank" rel="noopener noreferrer"
                      style={{display:"block",fontSize:12,padding:"3px 0",color:"inherit",textDecoration:"none"}}>
                    <span className="chip" style={{fontSize:9,marginRight:6,fontWeight:700,color:it.notificationLevel==="CRITICAL"?"var(--down)":"var(--accent)",borderColor:it.notificationLevel==="CRITICAL"?"var(--down)":"var(--accent)"}}>{it.notificationLevel}</span>
                    {it.code&&<span className="news-tag" style={{marginRight:4}}>{it.code}</span>}
                    {it.title}<span style={{color:"var(--inkFaint)",marginLeft:6}}>{it.published}</span>
                  </a>)}
                </div>}
                <div className="card" style={{padding:"14px 16px 6px"}}>
                  <NewsList items={listFor.slice(0,newsShowCount)} showName={showCode} priorityOf={showCode?newsPriorityRank:null}/>
                </div>
                {listFor.length>newsShowCount && <div style={{textAlign:"center",marginTop:10}}>
                  <button className="btn" onClick={()=>setNewsShowCount(c=>c+NEWS_PAGE_SIZE)}>もっと見る（残り{listFor.length-newsShowCount}件）</button>
                </div>}
              </>}
        </div>;
      })()}

      {/* 「今日の振り返り」独立タブ化+15:30自動評価（2026-09-12新規、指示書8番）：完了Toast。
          クリックで「今日の振り返り」タブへ移動する。 */}
      <DailyReviewToast review={dailyReviewToast}
        onOpen={()=>{setTab("dailyreview");setDailyReviewToast(null);}}
        onDismiss={()=>setDailyReviewToast(null)}/>
      {/* Choruco Style（2026-09-12新規、指示書19・20・56番）：MODE変化・STORY BROKEN通知。 */}
      <ChorucoToast notice={chorucoToast} onDismiss={()=>setChorucoToast(null)}/>
      {/* 2026-09-14新規：重要ニュース通知。複数件たまっても1件ずつ表示し、閉じると次が出る。 */}
      <NewsAlertToast alert={newsAlertQueue[0]||null} onDismiss={()=>setNewsAlertQueue(q=>q.slice(1))}/>

      {/* 5章：登録銘柄行の「チャート」ボタンで開くモーダル（タブに依存しない。6章でタブ内チャートは廃止） */}
      {chartModal && <div onClick={()=>setChartModal(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:20,
          display:"flex",alignItems:"center",justifyContent:"center",padding:18}}>
        <div onClick={e=>e.stopPropagation()} style={{background:"var(--card)",border:"1px solid var(--rule)",borderRadius:12,
            width:"100%",maxWidth:760,maxHeight:"92vh",overflowY:"auto",padding:24,boxShadow:"var(--shadowLg)"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
            <div><div className="kicker">Chart</div><div style={{fontSize:17,fontWeight:700}}>{chartModal.name}</div>
              <div className="mono" style={{fontSize:11.5,color:"var(--inkSoft)"}}>{chartModal.symbol}</div></div>
            <button className="iconbtn" style={{fontSize:20}} onClick={()=>setChartModal(null)}>×</button>
          </div>
          {/* 2026-09-09更新（監視銘柄・市場チャートの時間足切替）：IntervalSwitcher自体は
              embeddable/JP自前描画のどちらでも共通で表示する（旧実装はembeddable限定だった
              ため、JP個別株のチャートには時間足切替が一切出ず「日足しか出ない」原因になって
              いた）。JP自前描画側はoptionsにJP_CHART_INTERVALS（1/5/15/60分・日足のみ）を渡し、
              yfinanceで安定取得できる範囲に絞る。ボリンジャー/RSI/移動平均のチェックボックスは
              TradingView埋め込み専用のスタディ指定のため、embeddable限定のまま維持する。 */}
          <div style={{marginBottom:10}}>
            <IntervalSwitcher value={stockChartInterval} onChange={setStockChartInterval}
              options={embeddable(chartModal.symbol)?undefined:JP_CHART_INTERVALS}/>
            {embeddable(chartModal.symbol) && <div style={{display:"flex",gap:14,flexWrap:"wrap",marginTop:8}}>
              <label style={{fontSize:12.5,display:"flex",gap:6,alignItems:"center",cursor:"pointer"}}><input type="checkbox" checked={cBB} onChange={e=>setCBB(e.target.checked)}/>ボリンジャー</label>
              <label style={{fontSize:12.5,display:"flex",gap:6,alignItems:"center",cursor:"pointer"}}><input type="checkbox" checked={cRSI} onChange={e=>setCRSI(e.target.checked)}/>RSI</label>
              <label style={{fontSize:12.5,display:"flex",gap:6,alignItems:"center",cursor:"pointer"}}><input type="checkbox" checked={cMA} onChange={e=>setCMA(e.target.checked)}/>移動平均</label>
            </div>}
          </div>
          {embeddable(chartModal.symbol)
            ? <div key="modaltvchart" ref={modalChartRef} style={{border:"1px solid var(--rule)",borderRadius:4,overflow:"hidden",background:"var(--card)",minHeight:484}}></div>
            : <div key="modaljpchart">
                <div style={{fontSize:11,color:"var(--inkSoft)",marginBottom:8}}>日本の個別株はTradingViewの無料埋め込みチャートでは表示できないため（東証データの再配信制限）、{stockChartInterval==="D"?"立花証券APIの日足データ（分割調整済み・上場来）":"yfinanceの短期足データ（当日〜直近営業日）"}で描画しています。{stockChartInterval!=="D"&&"VWAP（青線）・前日高値安値・当日始値・現在値の水平線付き。"}</div>
                {jpHistoryMsg && <div style={{fontSize:12.5,color:"var(--inkSoft)",padding:"10px 2px"}}>{jpHistoryMsg}</div>}
                {/* 読み込み中もdisplay:noneにしない（非表示状態でチャート初期化するとサイズが0のまま固定される問題があったため、常にレイアウトに乗せておく） */}
                <div ref={jpChartRef} style={{border:"1px solid var(--rule)",borderRadius:4,overflow:"hidden",background:"var(--card)",minHeight:440}}></div>
                <div style={{marginTop:10,textAlign:"right"}}><button className="ghost" onClick={()=>openTV(chartModal.symbol,stockChartInterval)}>↗ TradingViewで開く</button></div>
              </div>}
        </div>
      </div>}

      {/* 2026-09-08新規：日本市場/米国株一覧「⋮」メニューの「ポジションに追加」用。既存の
          PositionEntryModal（監視銘柄タブの「➕ ポジション追加」・PortfolioPanelの「買い増し」
          と全く同じコンポーネント）をそのまま再利用するだけで、新しい保存経路は作らない。 */}
      {sectorPositionEntryFor && <PositionEntryModal code={sectorPositionEntryFor.code} name={sectorPositionEntryFor.name} market={sectorPositionEntryFor.market}
        needsTradeStyle={true} onClose={()=>setSectorPositionEntryFor(null)}
        onSaved={()=>{loadHeldItems();}}/>}

      {/* 2026-09-10新規（Unified Smart Import、Phase SI-D）：各タブの「📥 Smart Importで追加」
          から開く共通モーダル。独立タブ（📥 Smart Import）と同じSmartImportPanelを使い回す
          （指示書11・29番：別コンポーネントを複製しない）。 */}
      {smartImportModal && <div onClick={()=>setSmartImportModal(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:30,
          display:"flex",alignItems:"center",justifyContent:"center",padding:18}}>
        <div onClick={e=>e.stopPropagation()} style={{background:"var(--card)",border:"1px solid var(--rule)",borderRadius:12,
            width:"100%",maxWidth:640,maxHeight:"92vh",overflowY:"auto",padding:20,boxShadow:"var(--shadowLg)"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
            <div className="kicker">Smart Import</div>
            <button className="iconbtn" style={{fontSize:20}} onClick={()=>setSmartImportModal(null)}>×</button>
          </div>
          <SmartImportPanel sourceContext={smartImportModal.sourceContext} compactMode={true}
            onReload={()=>{loadNewsCatalysts();loadExpertViews();loadMarketEvents();}}
            onSaved={()=>setSmartImportModal(null)}/>
        </div>
      </div>}

    </div>
  );
}
// 初回レンダー前にテーマを確定させ、ダークモード利用者でのライト表示のちらつきを防ぐ
(()=>{const t=getInitialTheme();setColorTheme(t);document.documentElement.dataset.theme=t;})();
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
