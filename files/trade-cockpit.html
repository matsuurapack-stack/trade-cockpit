<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>トレード・コックピット</title>
<!-- v3-9続き（2026-09-05・PHASE 7 MOBILE/PWA）：追加料金なしの最低限PWA対応。
     manifest.jsonのみ（service workerは今回入れない＝株価・ポジション等の最新データを
     古いキャッシュから誤表示する事故を避けるため。ユーザー指定：「複雑になるなら
     manifest中心でもよい」）。Basic Auth（server.py _authorized()）は今回変更しない。 -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TradeCockpit">
<style>
/* ===== デザイントークン（design_renewal_instruction.md）=====
   ムームー証券アプリを参考にした鮮やかな配色・タイポグラフィ・ダークモード対応。
   単体HTML構成（ビルド工程なし、CLAUDE.md方針）を維持するため、別ファイルの
   design-tokens.jsonではなくこのCSS変数群に集約する。
   注意：上昇/下落の色は日本の相場慣習（赤=上昇・緑=下落）を維持するため、
   指示書の「上昇=緑系」の鮮やかな数値は当アプリの赤(--up)に、
   「下落=赤系」の数値は当アプリの緑(--down)に、意味を保ったまま割り当てている。 */
:root{
  --paper:#FFFFFF; --paperAlt:#FFFFFF; --card:#F2F3F5; --ink:#1A1A1A; --inkSoft:#666666; --inkFaint:#999999;
  --rule:#DDDDDD; --ruleSoft:#EAEAEA; --band:#F2F3F5;
  --gain:#00A868; --loss:#E0334A; --accent:#FF7A17; --accentSoft:rgba(255,122,23,.15);
  --star:#B8863B; --warn:#FFA500;
  --alarm:#FFF3D6; --alarmEdge:#B8860B; --alarmText:#1A1A1A;
  --up:#FF4D5C; --down:#00B366; --upBg:#FFE3E5; --downBg:#DFF7EC;
  --shadow:none; --shadowLg:0 12px 32px rgba(0,0,0,.16);
}
:root[data-theme="dark"]{
  --paper:#101012; --paperAlt:#1C1C1E; --card:#1C1C1E; --ink:#FFFFFF; --inkSoft:#CCCCCC; --inkFaint:#909090;
  --rule:#333333; --ruleSoft:#2A2A2A; --band:#1C1C1E;
  --gain:#00D084; --loss:#FF6B78; --accent:#FF9142; --accentSoft:rgba(255,145,66,.2);
  --star:#D9A64E; --warn:#FFB84D;
  --alarm:#3A2A0A; --alarmEdge:#FFA500; --alarmText:#FFF3D6;
  --up:#FF8A93; --down:#4DFFB0; --upBg:rgba(255,77,92,.22); --downBg:rgba(0,208,132,.2);
  --shadow:none; --shadowLg:0 16px 40px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{background-color:var(--paper)}
body{margin:0;background-color:var(--paper);color:var(--ink);font-size:15px;min-height:100vh;
  font-family:'Segoe UI','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,Arial,sans-serif;
  overflow-wrap:break-word}
/* PHASE 7 MOBILE/PWA：.wrap自身にoverflow指定が無いため、子要素の未折返しテキスト1つが
   document全体に隠れた横スクロールを伝播させ得る（STEP1監査で発見。実例：ExpertViewsPanelの
   説明文中のUSER_PROVIDED_TRANSCRIPT等の長い識別子）。html/bodyへのoverflow-x:hiddenは
   position:sticky（メインナビ）を破壊する副作用があったため採用せず、根本原因である
   長い未分割トークンの側をoverflow-wrapで折り返す方式にした（.sec-note・body両方に適用）。
   ページ本体の横スクロールだけ明示的に止める（縦は許可、個別の意図的な横スクロール
   コンテナ＝.tabs/.watch-table-desktop等はoverflow-x:autoのまま機能する）。
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding:22px 18px 46px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;
  border-bottom:2px solid var(--ink);padding-bottom:12px}
.kicker{font-size:11px;letter-spacing:3px;color:var(--inkSoft);text-transform:uppercase}
h1{margin:3px 0 0;font-size:28px;font-weight:700;line-height:1.2;letter-spacing:-.4px}
/* テーマ切り替えトグル（3-1章） */
.theme-toggle{display:inline-flex;align-items:center;gap:6px;background:var(--paperAlt);color:var(--inkSoft);
  border:1px solid var(--rule);padding:7px 12px;font-size:13px;border-radius:8px;cursor:pointer}
.theme-toggle:hover{background:var(--band)}
/* 10-1章：タブ数が増えても横スクロールで収まるようにする（4-3章：タブバーのスタイル統一） */
.tabs{display:flex;gap:4px;margin-top:16px;background:var(--band);border-radius:8px 8px 0 0;
  padding:2px 4px 0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.tabs::-webkit-scrollbar{height:6px}
.tabs::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}
.tab{background:transparent;border:none;border-bottom:3px solid transparent;color:var(--inkSoft);
  font-size:15px;padding:9px 16px;cursor:pointer;font-weight:600;flex:none;white-space:nowrap;transition:color .15s}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:800}
.sec-head{font-size:22px;font-weight:600;line-height:1.3;margin:0 0 4px}
/* PHASE 7 MOBILE/PWA・STEP1監査で発見：USER_PROVIDED_TRANSCRIPT等の長い英語識別子を含む説明文が
   狭い画面で折り返されず、ページ全体に隠れた横スクロールを発生させていた（.wrap自体には
   overflow指定が無いため、子要素の未折返しテキストがdocument全体のscrollWidthまで伝播する）。
   overflow-wrapで強制的に折り返す。 */
.sec-note{font-size:13px;color:var(--inkSoft);margin-bottom:10px;overflow-wrap:break-word;word-break:break-word}
.card{border:none;background:var(--card);border-radius:14px;padding:14px 16px 16px;
  box-shadow:var(--shadow);transition:background-color .2s ease,border-color .2s ease}
.card-t{font-size:18px;font-weight:600;line-height:1.4}
.card-n{font-size:13px;color:var(--inkSoft);margin-top:2px}
.card-hd{border-bottom:1px solid var(--ruleSoft);padding-bottom:8px;margin-bottom:10px}
.grid{display:grid;gap:16px}
.btn{display:inline-flex;align-items:center;gap:6px;border:none;padding:10px 18px;font-size:14px;
  border-radius:8px;cursor:pointer;font-weight:600;transition:filter .15s,box-shadow .15s}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.ghost{display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--inkSoft);
  border:1px solid var(--rule);padding:9px 14px;font-size:14px;border-radius:8px;cursor:pointer;transition:background-color .15s}
.ghost:hover{background:var(--band)}
/* 登録銘柄行の「チャート」「分析」ボタンなど、背景が塗り分け配色（ヒートマップ風）のセル上に
   置かれるボタン用。透明な.ghostだと濃い背景に埋もれて見えにくくなるため、常に不透明な背景を持たせる */
.action-btn{display:inline-flex;align-items:center;gap:5px;background:var(--paperAlt);color:var(--ink);
  border:1px solid rgba(127,127,127,.35);padding:5px 10px;font-size:12.5px;font-weight:600;border-radius:6px;
  cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:filter .15s}
.action-btn:hover{filter:brightness(.94)}
.action-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.iconbtn{background:transparent;border:none;color:var(--inkSoft);cursor:pointer;padding:4px;font-size:15px}
input,select,textarea{padding:10px 12px;border:1px solid var(--rule);background:var(--paperAlt);
  color:var(--ink);font-size:14px;border-radius:6px;font-family:inherit;transition:border-color .15s,box-shadow .15s}
input::placeholder,textarea::placeholder{color:var(--inkFaint)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
textarea{resize:vertical;line-height:1.6;width:100%}
label.fld{display:block;margin-top:8px}
label.fld span{font-size:12px;color:var(--inkSoft);display:block;margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{padding:8px 10px;font-size:12px;font-weight:600;text-align:left;white-space:nowrap;color:var(--inkSoft)}
td{padding:7px 10px;vertical-align:middle}
.lbl{font-size:12px;color:var(--inkSoft);margin:8px 0 4px}
/* 監視銘柄テーブル専用（2026-09-03改善）：行高縮小・横スクロール廃止・行hover・sticky header用 */
.watch-table{table-layout:fixed;font-size:14px}
.watch-table th{padding:6px 8px;font-size:13px}
.watch-table td{padding:7px 8px}
.watch-table thead th{position:sticky;top:0;background:var(--band);z-index:1}
.watch-table tbody tr:nth-child(even){background:var(--band)}
.watch-row{transition:background-color .1s}
.watch-row:hover{background:var(--band) !important}
.watch-menu-btn{background:transparent;border:1px solid var(--rule);border-radius:4px;color:var(--inkSoft);
  cursor:pointer;font-size:15px;line-height:1;padding:3px 8px}
.watch-menu-btn:hover{background:var(--band)}
.watch-menu{position:absolute;right:0;top:100%;z-index:20;background:var(--card);border:1px solid var(--rule);
  border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.18);min-width:160px;overflow:hidden}
.watch-menu button{display:block;width:100%;text-align:left;padding:7px 12px;font-size:12.5px;background:transparent;
  border:none;color:var(--ink);cursor:pointer;white-space:nowrap}
.watch-menu button:hover{background:var(--band)}
.watch-menu button.on{color:var(--accent);font-weight:700}
.chip{font-size:13px;padding:4px 10px;border-radius:16px;cursor:pointer;border:1px solid var(--rule);
  background:var(--paperAlt);color:var(--inkSoft);transition:background-color .15s,color .15s}
.chip:hover{background:var(--band)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.alarm{background:var(--alarm);color:var(--alarmText);border:2px solid var(--alarmEdge);border-radius:8px;
  padding:16px 18px;display:flex;align-items:center;gap:13px;animation:almPulse 1.2s ease-in-out infinite}
@keyframes almPulse{0%,100%{opacity:1}50%{opacity:.82}}
.foot{margin-top:16px;font-size:13px;color:var(--inkSoft);line-height:1.7}
.results{position:absolute;z-index:5;left:0;right:0;margin-top:4px;background:var(--paperAlt);
  border:1px solid var(--rule);border-radius:8px;box-shadow:var(--shadowLg);overflow:hidden}
.res-row{display:flex;width:100%;align-items:center;gap:10px;padding:9px 12px;background:transparent;
  border:none;border-bottom:1px solid var(--ruleSoft);cursor:pointer;text-align:left}
.res-row:hover{background:var(--band)}
.loading{max-width:400px;margin:80px auto;text-align:center;color:var(--inkSoft)}
.news-list{display:block}
.news-item{display:flex;gap:9px;align-items:center;padding:10px 4px;
  border-bottom:1px solid var(--ruleSoft);text-decoration:none;color:var(--ink)}
.news-item:last-child{border-bottom:none}
.news-item:hover{background:var(--band)}
.news-item:hover .news-title{color:var(--accent);text-decoration:underline}
/* 2026-09-17新規（スマホ表示崩れ緊急修正）：重要／優先度／出典／IR／カテゴリ／銘柄コードの
   各バッジをまとめる1つのグループ。PC幅ではこれまでどおり.news-item内で横一列に並ぶ
   （このラッパー自体もdisplay:flexのため見た目は不変）。狭い画面向けの挙動は下の
   @media(max-width:600px)でこのグループごとflex-basis:100%にして専用の1行へ回す。 */
.news-badges{display:flex;flex-wrap:wrap;align-items:center}
.news-tag{flex:none;font-size:11px;font-weight:700;color:var(--accent);background:var(--paperAlt);
  border:1px solid var(--rule);border-radius:3px;padding:1px 6px;white-space:nowrap}
.news-body{flex:1;min-width:0}
.news-title{font-size:14px;line-height:1.5;overflow-wrap:break-word}
.news-summary{display:block;font-size:12px;line-height:1.5;color:var(--inkSoft);margin-top:4px}
.news-meta{display:block;font-size:11px;color:var(--inkFaint);margin-top:3px}
.news-empty{font-size:12px;color:var(--inkSoft);padding:16px 4px}
/* 9-2章：重大ニュースの強調表示（4-6章：アラート仕様に統一） */
.news-item.important{background:var(--upBg);border-left:3px solid var(--up);padding-left:8px;margin-left:-1px}
.news-item.important:hover{background:var(--upBg)}
.news-alert-badge{flex:none;font-size:10.5px;font-weight:700;color:#fff;background:var(--up);
  border-radius:3px;padding:2px 6px;white-space:nowrap;align-self:center}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
/* 10-5章：ニュース項目のサムネイル（実画像は取得できないため、出典名の頭文字によるアバター） */
.news-thumb{flex:none;width:42px;height:42px;border-radius:6px;background:var(--band);color:var(--inkSoft);
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;align-self:center;
  box-shadow:var(--shadow)}
/* 10-5章：重要ニュース通知バナー（ページ最上部に常設、オン/オフ切り替え可。4-6章：warning系に統一） */
.notify-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  background:var(--alarm);color:var(--alarmText);border:2px solid var(--alarmEdge);border-radius:8px;padding:10px 14px;margin-bottom:12px}

/* ===== v3-9続き（2026-09-05・PHASE 7 MOBILE/PWA）=====
   単一HTML+React/Babel構成を維持したまま@mediaで分離する。既存のPCレイアウト
   （.wrap/.tabs/.card/.grid等）・enrichWatchRow等の判定ロジックは一切変更せず、
   以下のブレークポイントで表示だけを調整する（STEP17：PC版保護）。
   iPhone Safe Area（PWA standalone時、ホームインジケータ等とUIが重ならないように）は
   env()が未対応の環境では0として無視されるため、常時適用して問題ない。 */
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.watch-table-mobile{display:none}
@media (max-width:768px){
  .wrap{padding-left:12px;padding-right:12px}
  /* メインナビ（TAB_GROUPS第1階層）だけをsticky化する。第2階層（グループ内サブタブ、
     同じ.tabsクラスだが.tabs-mainを持たない）は重なり防止のためsticky化しない
     （STEP13：sticky要素が重なって画面上部を占有しすぎないようにする）。 */
  .tabs-main{position:sticky;top:0;z-index:15;background:var(--paper);box-shadow:0 2px 6px rgba(0,0,0,.08)}
  .tab{padding:10px 14px;min-height:22px}
  /* 今日の監視銘柄：横長テーブルではなく専用compact card表示に切り替える（STEP4）。 */
  .watch-table-desktop{display:none}
  .watch-table-mobile{display:block}
  /* ポジション新規登録フォーム：固定px幅グリッドのままだと横スクロールが発生するため
     2カラムに畳む（STEP8、STEP1監査で発見）。 */
  .position-add-grid-1,.position-add-grid-2{grid-template-columns:1fr 1fr !important}
  /* ニュースカード：PC横並び（バッジ列+本文列+サムネ列）のままだと本文が極端に細くなり
     日本語タイトルが1〜3文字単位で折り返される緊急不具合があったため、スマホでは
     バッジ行→本文行の縦積みに切り替え、装飾サムネは非表示にする
     （2026-09-17新規（スマホ表示崩れ緊急修正））。 */
  .news-item{flex-wrap:wrap}
  .news-badges{flex:1 1 100%}
  .news-body{flex:1 1 100%;min-width:0}
  .news-thumb{display:none}
}
@media (max-width:430px){
  .position-add-grid-1,.position-add-grid-2{grid-template-columns:1fr !important}
  h1{font-size:22px}
  .sec-head{font-size:18px}
  .card{padding:12px 12px 14px}
}
/* 2026-09-07新規（ポジション→リアルタイム売却判断画面 Phase3）：5分足チャートと売却判断
   エリアの2カラム化。PCでは左：チャート／右：売却判断、スマホでは縦積みにする
   （item19。既存の.watch-table-desktop/mobile切替と同じ@media(max-width:768px)を流用）。 */
.pos-judgment-grid{display:grid;grid-template-columns:3fr 2fr;gap:12px;align-items:start}
/* 2026-09-15修正（トレード学習・損切り分析強化 指示書8番）：CSS Gridの子要素は既定で
   min-width:auto（コンテンツの最小内容サイズ）になるため、ローソク足本数が増えて
   LightweightChartsの内部canvasが要求する実測幅が育つと、containerRef側のwidth:100%指定が
   あってもグリッドの列自体がその幅より縮まなくなり、結果として.pos-judgment-grid全体・
   ページ全体が右にはみ出す（売却判断パネル・数値が画面外に押し出される）。子要素へ
   min-width:0を明示してグリッド列が親幅まで縮められるようにする（チャート側のResizeObserver
   によるwidth追従は既存のまま変更しない）。*/
.pos-judgment-grid>*{min-width:0;max-width:100%}
@media (max-width:768px){
  .pos-judgment-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="root"><div class="loading">読み込み中… （初回はライブラリの取得に数秒かかります）</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

const num = (v) => (v === "" || v == null || isNaN(+v) ? null : +v);
// 2026-09-07新規（通算実現損益を税引後ベースへ変更）：上場株式譲渡益の税率
// （所得税・復興特別所得税15.315%＋住民税5.000%＝20.315%）。バックエンド側のSSoTは
// investment_db.pyのSTOCK_CAPITAL_GAINS_TAX_RATE（実際のtrade_history保存・税額計算は
// そちらが権威）。フロントは別言語のため値を共有できず、売却確認画面のプレビュー表示用に
// 同名・同値で複製している——この値を変える場合は必ず両方同時に変更すること。
const STOCK_CAPITAL_GAINS_TAX_RATE = 0.20315;
// 税引前損益(grossPnl)から{tax, netPnl}を返す。利益の場合のみ税率を掛け円未満切り捨て、
// 損失の場合は追加で税を引かない（investment_db.py _calc_trade_tax と同じロジック）。
function calcTradeTax(grossPnl){
  if(grossPnl==null)return {tax:null,netPnl:null};
  const tax=grossPnl>0?Math.floor(grossPnl*STOCK_CAPITAL_GAINS_TAX_RATE):0;
  return {tax,netPnl:grossPnl-tax};
}
// 2026-09-07新規（ポジション→リアルタイム売却判断画面・実機バグ修正）：res.json()を無条件に
// 呼ぶと、サーバー側が404（ルート未実装＝server.py再起動漏れ）や500等で空bodyやHTMLエラー
// ページを返した場合に「Unexpected end of JSON input」で例外が飛び、分かりにくい「通信エラー」
// 表示になってしまう不具合を実機で確認した。res.ok・実際のbody文字列を確認してからJSON.parse
// することで、何が返ってきても呼び出し元は必ず{error:"..."}かパース済みオブジェクトのどちらか
// を受け取れるようにする（例外を投げない）。/api/position-live・/api/position-intraday-chart
// から使用。
// 2026-09-09更新（ルール学習システム）：POST呼び出し（/api/trade-rules/*）でも同じ
// 空body/非JSON応答の安全処理を再利用できるよう、任意の第2引数optionsをfetchへそのまま
// 渡せるようにした（省略時は従来通りGET、既存の全呼び出し元は無変更で動く）。
async function fetchJsonSafe(url,options){
  let res;
  try{
    res=await fetch(url,options);
  }catch(e){
    return {error:`通信に失敗しました: ${e.message}`};
  }
  let text="";
  try{text=await res.text();}catch(e){}
  if(!res.ok){
    return {error:`サーバーエラー（HTTP ${res.status}）。server.pyが最新版で起動しているかご確認ください（start.batの再起動が必要な場合があります）。${text?` 応答: ${text.slice(0,200)}`:""}`};
  }
  if(!text){
    return {error:"サーバーから空の応答が返りました。server.pyが最新版で起動しているかご確認ください（start.batの再起動が必要な場合があります）。"};
  }
  try{
    return JSON.parse(text);
  }catch(e){
    return {error:`応答がJSON形式ではありません: ${text.slice(0,200)}`};
  }
}

const _chartBarsCache=new Map(); // key: "code|market|interval" -> {at, promise|data}

async function fetchChartBarsCached(code,market,interval,period){

// 2026-09-10新規（不具合修正：日本株5分足チャートのX軸時刻がUTCのまま表示される問題）。
// 根本原因はサーバー側ではなくLightweightCharts側：バックエンドの_fetch_intraday_bars()は
// yfinanceのtimezone-awareなDatetimeIndex（日本株は東証タイムゾーンへ自動ローカライズ済み）を
// .timestamp()でUNIX秒（＝正しい絶対時刻）に変換しているだけで、値そのものは常に正しい
// （実測：7203.Tの5分足で1788998700秒→JST09:05・UTC00:05を確認、backendは無変更で良いと判断）。
// LightweightCharts（v4）はtime軸のラベルを既定でUTC基準の時刻として描画する仕様のため、
// timezone未指定のままだとJST日本市場の09:00-11:30/12:30-15:30が00:00-02:30/03:30-06:30と
// 表示されていた。「常時+9時間する」のではなく、Intl.DateTimeFormat（timeZone:"Asia/Tokyo"）
// による正規のtimezone変換をtickMarkFormatter/localization.timeFormatterへ渡す方式にする
// （データそのものは一切書き換えない＝データがどのtimezone由来でも二重変換にならない）。
// 「時刻正規化の責任箇所」はフロント側チャート描画部分に統一する（バックエンドはUTC UNIX秒を
// 保持するだけ、という既存設計を変更しない）。
const JST_TIME_ZONE="Asia/Tokyo";
const _jstHmFormatter=new Intl.DateTimeFormat("ja-JP",{timeZone:JST_TIME_ZONE,hour:"2-digit",minute:"2-digit",hour12:false});
const _jstYearFormatter=new Intl.DateTimeFormat("ja-JP",{timeZone:JST_TIME_ZONE,year:"numeric"});
const _jstMonthFormatter=new Intl.DateTimeFormat("ja-JP",{timeZone:JST_TIME_ZONE,month:"short"});
const _jstDayFormatter=new Intl.DateTimeFormat("ja-JP",{timeZone:JST_TIME_ZONE,day:"numeric"});
// crosshair・凡例に出す時刻（localization.timeFormatter）。
function jstCrosshairTimeFormatter(unixSec){
  return _jstHmFormatter.format(new Date(unixSec*1000));
}
// X軸の目盛りラベル（timeScale.tickMarkFormatter）。tickMarkTypeに応じて年/月/日/時刻を
// 切り替える（複数日分のbarsが混在する時間足でも、日付跨ぎの目盛りがJST基準で正しく出る＝
// 「日付跨ぎ対応」）。
function jstTickMarkFormatter(unixSec,tickMarkType){
  const TM=(typeof LightweightCharts!=="undefined")?LightweightCharts.TickMarkType:null;
  const d=new Date(unixSec*1000);
  if(TM&&tickMarkType===TM.Year)return _jstYearFormatter.format(d);
  if(TM&&tickMarkType===TM.Month)return _jstMonthFormatter.format(d);
  if(TM&&tickMarkType===TM.DayOfMonth)return _jstDayFormatter.format(d);
  return _jstHmFormatter.format(d);
}
// 日本株チャートのcreateChartオプションへ、上記のtimezone変換オプションだけを差し込むヘルパー。
// market!=="JP"の場合は何も変えず既存動作（LightweightChartsの既定描画）のまま返す＝
// 米国株等の他市場チャートは無変更（不具合修正の対象外・壊さない）。
function withJstChartTimeOptions(chartOptions,market){
  if((market||"JP")!=="JP")return chartOptions;
  return {...chartOptions,
    localization:{...(chartOptions.localization||{}),timeFormatter:jstCrosshairTimeFormatter},
    timeScale:{...(chartOptions.timeScale||{}),tickMarkFormatter:jstTickMarkFormatter}};
}
// 以下、短期足チャート専用のヘルパー（VWAP・前日高値安値・当日始値・初期表示範囲）。
// いずれも取得済みのbars配列だけから計算する軽量処理で、新しいAPI呼び出しは発生しない。
// 日付の区切りはJST基準（サーバーのタイムスタンプはUNIX秒＝UTC基準のため、JSTへ変換してから
// 日付キーを作る。日本市場のみが対象のため、このJST変換で十分）。
function jstDateKey(unixSec){
  const jst=new Date(unixSec*1000+9*3600*1000);
  return `${jst.getUTCFullYear()}-${String(jst.getUTCMonth()+1).padStart(2,"0")}-${String(jst.getUTCDate()).padStart(2,"0")}`;
}
// セッション（取引日）ごとにリセットするVWAP（出来高加重平均価格）のライン系列を作る
// （指示書7番：1分・5分・15分足に表示）。複数日分のbarsが混在していても、日付が変わった
// 時点で累積を0からやり直す＝各日の寄り付きからの本来のVWAPになる。
function computeSessionVwapSeries(bars){
  let dayKey=null,cumPV=0,cumVol=0;
  return bars.map(b=>{
    const k=jstDateKey(b.time);
    if(k!==dayKey){dayKey=k;cumPV=0;cumVol=0;}
    cumPV+=b.close*(b.volume||0);cumVol+=(b.volume||0);
    return {time:b.time,value:cumVol>0?cumPV/cumVol:b.close};
  });
}
// 直近の取引日より前の、最も新しい取引日（＝前営業日）のhigh/lowを求める（指示書8番）。
// barsが当日分しか無い場合（1分足＝period未指定）はnullを返す（捏造しない）。
function computePrevDayLevels(bars){
  if(!bars||!bars.length)return null;
  const lastKey=jstDateKey(bars[bars.length-1].time);
  const priorBars=bars.filter(b=>jstDateKey(b.time)!==lastKey);
  if(!priorBars.length)return null;
  const prevKey=jstDateKey(priorBars[priorBars.length-1].time);
  const prevDayBars=priorBars.filter(b=>jstDateKey(b.time)===prevKey);
  return {high:Math.max(...prevDayBars.map(b=>b.high)),low:Math.min(...prevDayBars.map(b=>b.low))};
}
// 当日（＝barsの最終日）の始値（指示書8番）。
function computeTodayOpen(bars){
  if(!bars||!bars.length)return null;
  const lastKey=jstDateKey(bars[bars.length-1].time);
  const todayBars=bars.filter(b=>jstDateKey(b.time)===lastKey);
  return todayBars.length?todayBars[0].open:null;
}
// 初期表示範囲（指示書5番）：直近nDays営業日分だけを画面にズームする。取得自体は
// より広いperiodで行っているため、ユーザーは左へスクロールすればそれ以前も見られる。
function computeVisibleRangeByDays(bars,nDays){
  if(!bars||!bars.length)return null;
  const keys=[...new Set(bars.map(b=>jstDateKey(b.time)))];
  const wantedKeys=new Set(keys.slice(-nDays));
  const windowBars=bars.filter(b=>wantedKeys.has(jstDateKey(b.time)));
  if(!windowBars.length)return null;
  return {from:windowBars[0].time,to:windowBars[windowBars.length-1].time};
}
const copyText = async (text) => {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch (e2) { return false; }
  }
};

const isStaleFetchedAt = (iso, staleMinutes) => {

const freshnessInfo = (iso, staleMinutes) => {
  if (!iso) return { text: "未取得", level: "stale" };
  const d = new Date(iso);
  if (isNaN(d)) return { text: "未取得", level: "stale" };
  const sameDay = todayISO() === `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const hhmm = `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  const hhmmss = `${hhmm}:${String(d.getSeconds()).padStart(2,"0")}`;
  if (!sameDay) return { text: `STALE（${d.getMonth()+1}/${d.getDate()} ${hhmm}取得）`, level: "stale" };
  const ageMin = (Date.now() - d.getTime()) / 60000;
  if (ageMin <= 1) return { text: `LIVE ${hhmmss}`, level: "live" };
  if (ageMin <= staleMinutes) return { text: `${Math.round(ageMin)}分遅延（${hhmm}取得）`, level: "delayed" };
  return { text: `STALE（${hhmm}取得）`, level: "stale" };
};

// トレード分析 リアルタイム自動更新（2026-09-12新規）：FAST UPDATEの鮮度を秒単位で表示する
// 専用バッジ（指示書7・10番）。既存のFreshnessBadge（分単位、銘柄分析全体の鮮度）とは別物——
// LIVE/DELAY/STALEの秒閾値（0-15s/15-30s/30s+）はFAST UPDATE専用の基準。
function LiveStatusBadge({updatedAt}){
  const [,forceTick]=useState(0);
  useEffect(()=>{const id=setInterval(()=>forceTick(v=>v+1),5000);return()=>clearInterval(id);},[]);
  if(!updatedAt)return <span style={{fontSize:10.5,color:"var(--inkFaint)"}}>—</span>;
  const t=new Date(updatedAt).getTime();
  if(isNaN(t))return <span style={{fontSize:10.5,color:"var(--inkFaint)"}}>—</span>;
  const ageSec=(Date.now()-t)/1000;
  const state=ageSec<=LIVE_FRESH_SEC?"LIVE":ageSec<=LIVE_DELAY_SEC?"DELAY":"STALE";
  const meta={LIVE:{icon:"🟢",color:"var(--up)"},DELAY:{icon:"🟡",color:"var(--inkSoft)"},STALE:{icon:"🔴",color:"var(--down)"}}[state];
  const hhmmss=new Date(updatedAt).toLocaleTimeString("ja-JP",{hour12:false});
  return <span className="mono" style={{fontSize:10.5,fontWeight:700,color:meta.color,whiteSpace:"nowrap"}} title="現在値・ENTRY条件の自動更新（FAST UPDATE）の最終取得時刻">{meta.icon} {state} {hhmmss}</span>;
}

// 短いビープを鳴らすだけにする（アセット追加不要・オフライン動作）。
function playDailyReviewNotifySound(){
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx)return;
    const ctx=new Ctx();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.type="sine";osc.frequency.value=880;
    gain.gain.setValueAtTime(0.15,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.35);
    osc.connect(gain);gain.connect(ctx.destination);
    osc.start();osc.stop(ctx.currentTime+0.35);
  }catch(e){}
}

// 上昇率(%)は0.5%刻みで6段階(0-0.5/0.5-1.0/1.0-1.5/1.5-2.0/2.0-2.5/2.5超)に区分し、1段階ずつ赤/緑を濃くする。
// 最終段階(2.5%超)は上限なくすべて同じ最も濃い色で頭打ちにする。
// レベル1（0%超〜0.5%）は現状使用している --up / --down の色そのものを「最も薄い色」の基準として使う。
const CHANGE_STEP = 0.5;
const CHANGE_MAX_LEVEL = 6; // 0.5%刻み6段階。2.5%超は全て最終段階（最大濃度）

// design_renewal_instruction.md：ムームー証券を参考にした鮮やかな配色をライト/ダークそれぞれで定義。
// 日本の相場慣習（赤=上昇・緑=下落）は維持し、指示書の「上昇=緑系」の数値は当アプリの赤に、
// 「下落=赤系」の数値は当アプリの緑に、意味を保ったまま割り当てている。
// ダークモードでは背景が暗いため、レベル6（最濃）を黒に近づけるのではなく、より明るく彩度の高い
// 色にすることで視認性を確保する（3-4章：ダークモード時のコントラスト確認）。
const COLOR_PALETTE = {
  light: {upBase:"#FF4D5C", upDark:"#8B0000", downBase:"#00B366", downDark:"#00522E", upBg:"#FFE3E5", downBg:"#DFF7EC"},
  dark:  {upBase:"#FF8A93", upDark:"#FF3B4E", downBase:"#4DFFB0", downDark:"#00E676", upBg:"rgba(255,77,92,.22)", downBg:"rgba(0,208,132,.22)"},
};
// 3-2章：CSS変数だけでなくJS側の色計算（changeColor/Sparkline）もテーマに応じて出し分ける必要があるため、
// App内のテーマ切り替えエフェクトでこのモジュール変数を更新する（single-file構成のためprops経由にせず共有）。
let CURRENT_THEME = "light";
const setColorTheme=(t)=>{CURRENT_THEME=(t==="dark")?"dark":"light";};

const hexToRgb=(h)=>{
  if(h.startsWith("rgba")){const m=h.match(/[\d.]+/g);return [+m[0],+m[1],+m[2]];}
  const n=parseInt(h.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255];
};
const rgbToHex=(r,g,b)=>"#"+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join("");
const mixHex=(a,b,t)=>{const[ar,ag,ab]=hexToRgb(a),[br,bg,bb]=hexToRgb(b);return rgbToHex(ar+(br-ar)*t,ag+(bg-ag)*t,ab+(bb-ab)*t);};

// セルの背景色に対して、白文字/濃色文字のどちらが読みやすいかをWCAGの相対輝度で判定する
const relLuminance=(hex)=>{
  const [r,g,b]=hexToRgb(hex).map(v=>{const c=v/255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);});
  return 0.2126*r+0.7152*g+0.0722*b;
};
const contrastText=(bgHex)=>relLuminance(bgHex)>0.42?"#1A1A1A":"#FFFFFF";

// pct(%)を受け取り、日次モニター・セクター・登録銘柄どれでも使う共通のカラー情報を返す。
// セルの背景そのものを段階配色にし（ヒートマップ的な塗り分け）、文字色は背景の明るさに応じて
// 白/濃色を自動選択することで、セルの中でも数字が確実に読めるようにする。pctがnull/0はニュートラル。
const changeColor=(pct)=>{
  if(pct==null||pct===0) return {level:0,dir:null,fg:"var(--inkSoft)",fgSoft:"var(--inkSoft)",bg:"var(--card)"};
  const pal=COLOR_PALETTE[CURRENT_THEME];
  const level=Math.min(CHANGE_MAX_LEVEL,Math.ceil(Math.abs(pct)/CHANGE_STEP));
  const t=(level-1)/(CHANGE_MAX_LEVEL-1);
  const up=pct>0;
  const bg=mixHex(up?pal.upBase:pal.downBase, up?pal.upDark:pal.downDark, t);
  const fg=contrastText(bg);
  const fgSoft=fg==="#FFFFFF"?"rgba(255,255,255,.75)":"rgba(26,26,26,.65)";
  return {level,dir:up?"up":"down",fg,fgSoft,bg};
};

  const toAdd=defaults.filter(m=>!seen.has(m.code)).map(m=>({id:m.code,...m,watch:"通常",note:"",theme:""}));

};

  });
};

// 10-1章：カードUI基盤。ミニスパークライン（値上がり/値下がりでグラデーション色を変える）
function Sparkline({data,color,width=140,height=36}){
  const gid=(React.useId?React.useId():"spark")+"-g";
  if(!data||data.length<2) return <svg width={width} height={height}></svg>;
  const min=Math.min(...data),max=Math.max(...data);
  const range=(max-min)||1;
  const stepX=width/(data.length-1);
  const pts=data.map((v,i)=>[i*stepX,height-((v-min)/range)*height]);
  const line=pts.map(([x,y],i)=>(i===0?"M":"L")+x.toFixed(1)+","+y.toFixed(1)).join(" ");
  const area=line+` L${width},${height} L0,${height} Z`;
  return <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} style={{display:"block",width:"100%",height}} preserveAspectRatio="none">
    <defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor={color} stopOpacity="0.32"/>
      <stop offset="100%" stopColor={color} stopOpacity="0"/>
    </linearGradient></defs>
    <path d={area} fill={`url(#${gid})`} stroke="none"/>
    <path d={line} fill="none" stroke={color} strokeWidth="1.6"/>
  </svg>;
}

// interval件ごとに1件挟む（末尾到達で先頭に戻る簡易ローテーション）。
// Trade Cockpit v2 Phase4（設計案30番）：ニュースの関連度優先順位ラベル（0=最優先）。
// 2026-09-08更新（ニュース優先順位改善）：4「その他」（コード無し＝一般市況ニュース）の手前に
// 5「登録銘柄」を追加した（保有／候補／監視／テーマのいずれにも該当しないが、登録銘柄一覧には
// コードが載っている銘柄のニュース。指示書の「登録銘柄に企業コードで直接ひも付くニュースを、
// 市況一般ニュースより上位に表示する」に対応。既存の保有＞候補＞監視＞テーマの並びは無変更）。
const NEWS_PRIORITY_LABELS=["保有","候補","監視","テーマ","登録銘柄","その他"];
// 情報源の優先順位（0=最優先）。指示書priority_orderに対応：①公式IR/TDnet②日経③NQN
// ④その他国内⑤海外。sourceフィールド（Googleニュースの媒体名／NQN／TDnet、いずれも
// server.py側で既に設定済み・新規取得経路は追加していない）だけで判定する。
const NEWS_SOURCE_LABELS=["TDnet","日経","NQN","国内","海外"];
function newsSourceRank(it){
  const src=it?.source||"";
  if(src==="TDnet")return 0;
  if(src.includes("日本経済新聞")||src.includes("日経")||(it?.url||"").includes("nikkei.com"))return 1;
  if(src==="NQN")return 2;
  if(it?._overseas)return 4;
  return 3;
}

// 2026-09-17新規（緊急修正STEP7）：登録銘柄ニュースの一般ニュース完全除外の
// frontend側最終安全弁。server.pyのGENERAL_NEWS_DISABLED_CODES／
// _is_official_disclosure_news_item()／_filter_general_news_for_disabled_codes()と
// 同じ対象銘柄・同じ判定基準をクライアント側にも独立して持たせ、「server側で除外され、
// frontend側でも防御される」二重構造にする（万一server側の安全弁をすり抜けても、
// フロント側でも最終的に弾く）。IR判定はタイトルの文字列一致ではなく、サーバーが
// 構造化情報から付与するit.source／it.sourceTypeだけを根拠にする。
const GENERAL_NEWS_DISABLED_CODES=new Set(["1332","1812","2282","2801","2802","2871"]);
const isOfficialDisclosureNewsItem=(it)=>{
  if(it?.source==="TDnet")return true;
  if(it?.sourceType==="PRIMARY_DISCLOSURE"||it?.sourceType==="PRIMARY_IR")return true;
  return false;
};
const filterGeneralNewsForDisabledCodes=(list)=>(list||[]).filter(
  it=>!(GENERAL_NEWS_DISABLED_CODES.has(it?.code)&&!isOfficialDisclosureNewsItem(it)));

// Trade Cockpit v3 Phase4（設計案43番）：ニュースのカテゴリ分類。有料AI APIは使わずキーワード
// 辞書のみ（既存のIMPORTANT_KEYWORDS・STOCK_NAME_NEWS_EXCLUDE_KEYWORDSと同じ方式）。
// 上から順に判定し、最初にヒットしたカテゴリを採用する。
// 2026-09-17修正（緊急修正STEP4）：「IR」カテゴリの判定キーワードから裸の"IR"（英大文字2文字）
// を削除した。t.includes("IR")は部分一致のため、"BE:FIRST"のような無関係な英単語の中間
// （F-IR-ST）にもヒットし、味の素スタジアムのアーティスト公演記事に「IR」バッジが付く
// 誤分類が実際に発生した。他のキーワード（適時開示・自己株式取得等）は複数文字の具体的な
// 用語のため誤爆しにくく、残している。IRバッジ自体の表示判定（isIrContent、下記）は
// サーバー側の構造化情報（it.sourceType）を優先するよう別途修正済み。
const NEWS_CATEGORY_KEYWORDS=[
  ["EARNINGS",["決算","上方修正","下方修正","増益","減益","最終利益","純利益","営業利益"]],
  ["IR",["適時開示","自己株式取得","株式分割","新株予約権","業務提携","M&A","公開買付","TOB","大量保有"]],
  ["FX",["ドル円","為替","円安","円高","USDJPY"]],
  ["COMMODITY",["原油","WTI","金価格","商品先物","天然ガス"]],
  ["POLITICS",["選挙","政権","大統領","首相","国会","規制強化","制裁"]],
  ["MACRO",["日銀","FRB","利上げ","利下げ","金利","GDP","インフレ","雇用統計","中央銀行"]],
  ["MARKET",["日経平均","NYダウ","NASDAQ","S&P","市場","株式市場","続落","続伸","急落","急騰"]],
  ["SECTOR",["セクター","業種","関連株"]],
];
const classifyNewsCategory=(title)=>{
  const t=title||"";
  for(const [cat,kws] of NEWS_CATEGORY_KEYWORDS){if(kws.some(k=>t.includes(k)))return cat;}
  return "COMPANY"; // 企業名一致で拾われた記事のデフォルト（OTHERはスポーツ等の除外漏れ検知用に予約）
};

function NewsList({items,showName,emptyText,priorityOf}){
  if(!items||!items.length) return <div className="news-empty">{emptyText||`まだ取得していません。自動更新（起動直後・${NEWS_AUTO_REFRESH_MINUTES}分おき）をお待ちください。`}</div>;
  return <div className="news-list">
    {items.map((it,i)=>{
      const meta=[showName?it.name:null,it.source,it.published].filter(Boolean).join(" ・ ");
      // 2026-09-14追加（指示書D・J）：サーバー側importance_score（登録銘柄×TDnet重要開示・
      // 中央銀行・地政学＋市場インパクト）による重要判定を、既存のisImportantNews
      // （サプライズ決算・戦争・パンデミック・災害・株価暴落の見出しキーワード）に追加する
      // （どちらか一方でも該当すれば重要表示、既存の見た目・条件は削らずOR結合）。
      const important=isImportantNews(it.title)||it.notificationLevel==="CRITICAL"||it.notificationLevel==="HIGH";
      // サーバーが付けたbadgesのうち、既存チップと重複するTDnet/登録銘柄/🚨重要を除いた
      // 追加情報バッジ（重要開示／決算／中央銀行／地政学）だけを表示する。
      const extraBadges=(it.badges||[]).filter(b=>!["TDnet","登録銘柄","🚨重要"].includes(b));
      // NQN等の速報見出し（立花証券API）は元記事URLが無いため、リンクにせずカード表示にする
      const Tag=it.url?"a":"div";
      const linkProps=it.url?{href:it.url,target:"_blank",rel:"noopener noreferrer"}:{};
      // Trade Cockpit v2 Phase4（設計案30番）：保有／候補／監視／テーマ／登録銘柄に該当する
      // ニュースにはバッジを付ける（2026-09-08更新：優先度5=その他（コード無し）のみ非表示。
      // 4=登録銘柄も表示するようになった）。
      const prio=priorityOf&&it.code?priorityOf(it.code):5;
      const category=classifyNewsCategory(it.title);
      // 2026-09-08新規（ニュース優先順位改善、指示書ui_request.badges対応）：出典バッジ
      // （TDnet／日経／NQN／海外）と、内容がIR系（決算・適時開示・M&A等、既存の
      // classifyNewsCategoryをそのまま再利用）なら追加で「IR」バッジも出す
      // （TDnet発ならバッジ自体が既に公式IRを意味するため「IR」は重ねて出さない）。
      const srcRank=newsSourceRank(it);
      const srcLabel=NEWS_SOURCE_LABELS[srcRank];
      const showSrcBadge=srcRank!==3; // 3=その他国内はノイズになるため表示しない
      // 2026-09-17修正（緊急修正STEP4）：IRバッジの判定はサーバー側の構造化情報
      // （it.sourceType、classify_source_tier()がTDnet／NQNのAI開示速報120・129だけを
      // "PRIMARY_DISCLOSURE"/"PRIMARY_IR"として付与する）を優先根拠にする。
      // classifyNewsCategoryのキーワード一致（IR系複数文字用語・決算系）は補助的にORで残す
      // （NEWS_CATEGORY_KEYWORDSから裸の"IR"は削除済みのため、以前のような部分一致誤爆
      // （"BE:FIRST"→"F-IR-ST"）はもう起きない）。
      const isIrContent=(it.sourceType==="PRIMARY_DISCLOSURE"||it.sourceType==="PRIMARY_IR"
                          ||category==="IR"||category==="EARNINGS")&&srcRank!==0;
      // 2026-09-09削除（ユーザー要望）：「不要」フィードバックボタンはユーザーに意味が伝わらず
      // 表示価値がないため一覧UIから削除した（v3 Phase4・設計案48番で追加したもの）。
      // バックエンドの/api/news-feedback/save・ログテーブル自体は変更していない（このUIの
      // 削除に伴い現状呼び出し元は無くなったが、他機能への影響を避けるためサーバー側は無変更）。
      // 2026-09-17緊急修正（スマホ表示崩れ）：バッジ類（重要／優先度／出典／IR／追加バッジ／
      // カテゴリ／銘柄コード）を1つのnews-badgesグループへまとめた。従来は.news-item（横一列
      // flex）の直接の子として並んでいたため、狭い画面幅ではこれらのflex:none要素が横幅の
      // 大半を消費し、残りのnews-body（タイトル）がごく僅かな幅（実機で数文字ごとに折り返す
      // レベル）へ押し込まれていた。news-badgesを1つの塊にしてCSS側でflex-basis:100%を
      // 与えることで、狭い画面ではバッジ行→タイトル行の2行構成へ自動的に切り替わる
      // （PC幅では見た目に影響しない、下記CSS参照）。
      return <Tag key={i} className={"news-item"+(important?" important":"")} {...linkProps}>
        <span className="news-badges">
          {important&&<span className="news-alert-badge">⚠ 重要</span>}
          {prio<5&&<span className="chip" style={{fontSize:10,marginRight:4}}>{NEWS_PRIORITY_LABELS[prio]}</span>}
          {showSrcBadge&&<span className="chip" style={{fontSize:9.5,marginRight:4,fontWeight:700,
            color:srcRank===0?"var(--up)":"var(--inkSoft)",borderColor:srcRank===0?"var(--up)":undefined}}>{srcLabel}</span>}
          {isIrContent&&<span className="chip" style={{fontSize:9.5,marginRight:4,color:"var(--inkSoft)"}}>IR</span>}
          {extraBadges.map(b=><span key={b} className="chip" style={{fontSize:9.5,marginRight:4,fontWeight:700,
            color:"var(--down)",borderColor:"var(--down)"}}>{b}</span>)}
          <span className="chip" style={{fontSize:9.5,marginRight:4,color:"var(--inkFaint)"}}>{category}</span>
          {showName&&it.code&&<span className="news-tag">{it.code}</span>}
        </span>
        <span className="news-body">
          <span className="news-title" style={important?{color:"var(--accent)",fontWeight:700}:undefined}>{it.title}</span>
          {it.summary&&<span className="news-summary">{it.summary}</span>}
          {meta&&<span className="news-meta">{meta}</span>}
        </span>
        <SourceThumb source={it.source}/>
      </Tag>;
    })}
  </div>;
}

// 決算期待値：0.5刻み5段階の星評価。過去の上方/下方修正比率・直近決算の良し悪し・現在の株価の
// 過熱度（RSI・52週高値/安値からの位置）からサーバー側で自動算出した値をそのまま表示する
// （旧・手動クリック評価は廃止）。
function EarningsStars({value}){
  const v=value||0;
  return <span style={{display:"inline-flex",gap:1}} title={`決算期待値（自動算出）：${v}/5`}>
    {[0,1,2,3,4].map(i=>{
      const pct=Math.max(0,Math.min(1,v-i))*100;
      return <span key={i} style={{position:"relative",display:"inline-block",fontSize:15,lineHeight:1}}>
        <span style={{color:"var(--rule)"}}>★</span>
        <span style={{position:"absolute",left:0,top:0,overflow:"hidden",width:pct+"%",color:"var(--star)"}}>★</span>
      </span>;
    })}
  </span>;
}

// 決算分析タブ：業績進捗率を「棒グラフ（推移＋通期予想との比較）」と「円グラフ（進捗率が一目でわかる）」で表示。
// moomoo証券アプリの配色に合わせ、進捗を示す環はaccent（オレンジ）、実績棒は前期比の増減でup/down色を使う。
function EarningsProgressChart({trend,latestDetail}){
  if(!trend||!trend.length||!latestDetail||latestDetail.forecastRevenue==null)return null;
  const bars=trend.filter(t=>t.sales!=null).slice(-6);
  if(!bars.length)return null;
  const forecastYen=latestDetail.forecastRevenue*1e6;
  const maxV=Math.max(forecastYen,...bars.map(b=>b.sales));
  const oku=v=>(v/1e8).toLocaleString(undefined,{maximumFractionDigits:0});
  const W=320,H=150,padL=4,padR=4,padB=20,padT=10;
  const plotW=W-padL-padR,plotH=H-padT-padB;
  const bw=plotW/bars.length*0.56;
  const gap=plotW/bars.length;
  const yOf=v=>padT+plotH-(v/maxV)*plotH;
  const forecastY=yOf(forecastYen);
  const pct=latestDetail.progressPct;
  const pctClamped=pct==null?0:Math.max(0,Math.min(100,pct));
  const R=42,CX=60,CY=60,STROKE=11;
  const circumference=2*Math.PI*R;
  const dash=circumference*(pctClamped/100);
  return <div style={{display:"flex",flexWrap:"wrap",gap:18,alignItems:"center",marginTop:10,paddingTop:9,borderTop:"1px solid var(--ruleSoft)"}}>
    <div style={{flex:"0 0 auto"}}>
      <div style={{fontSize:12.5,color:"var(--inkFaint)",marginBottom:4,textAlign:"center"}}>通期進捗率</div>
      <svg viewBox="0 0 120 120" width={120} height={120}>
        <circle cx={CX} cy={CY} r={R} fill="none" stroke="var(--rule)" strokeWidth={STROKE}/>
        <circle cx={CX} cy={CY} r={R} fill="none" stroke="var(--accent)" strokeWidth={STROKE}
          strokeDasharray={`${dash} ${circumference-dash}`} strokeLinecap="round"
          transform={`rotate(-90 ${CX} ${CY})`}/>
        <text x={CX} y={CY-2} textAnchor="middle" fontSize={20} fontWeight={800} fill="var(--ink)">
          {pct==null?"—":pct.toFixed(1)}
        </text>
        <text x={CX} y={CY+16} textAnchor="middle" fontSize={11} fill="var(--inkSoft)">{pct==null?"":"%"}</text>
      </svg>
    </div>
    <div style={{flex:"1 1 220px",minWidth:220}}>
      <div style={{fontSize:12.5,color:"var(--inkFaint)",marginBottom:4}}>売上高推移（実績）と通期会社予想（億円）</div>
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H}>
        <line x1={padL} y1={forecastY} x2={W-padR} y2={forecastY} stroke="var(--accent)" strokeWidth={1.5} strokeDasharray="4 3"/>
        <text x={W-padR} y={forecastY-3} textAnchor="end" fontSize={10} fill="var(--accent)">通期予想 {oku(forecastYen)}億</text>
        {bars.map((b,i)=>{
          const x=padL+gap*i+(gap-bw)/2;
          const y=yOf(b.sales);
          const h=padT+plotH-y;
          const up=b.salesYoy==null?null:b.salesYoy>=0;
          const color=b.isLatest?"var(--accent)":(up==null?"var(--inkFaint)":(up?"var(--up)":"var(--down)"));
          const label=b.periodEnd?b.periodEnd.slice(5):(b.periodLabel||"");
          return <g key={i}>
            <rect x={x} y={y} width={bw} height={Math.max(1,h)} fill={color} rx={2}/>
            <text x={x+bw/2} y={H-6} textAnchor="middle" fontSize={9.5} fill="var(--inkFaint)">{label}</text>
          </g>;
        })}
      </svg>
    </div>
  </div>;
}

// 6-1章：銘柄検索・登録＋セクター別アコーディオン表示（2〜5章の仕様）を市場ごとに再利用するための共通コンポーネント。
// 日本市場・アメリカ市場タブの両方で、このコンポーネントをそのまま使い回すことで「全く同じ仕様・UI」を担保する。
function SectorWatchlist({market,watchlist,setWatchlist,candidates,max,stockQuotes,analysisTargets,onToggleAnalysis,earningsTargets,onToggleEarnings,watchTargets,onToggleWatch,onOpenChart,metrics,breakoutLevels,analysisData,marketRiskLabel,onAddPosition,newsCatalysts}){
  const [q,setQ]=useState("");
  const [manualSector,setManualSector]=useState(SECTOR_CHOICES[0]);
  const [openSectors,setOpenSectors]=useState(()=>new Set());
  const rowRefs=useRef({}); // code -> <tr>要素。検索で既登録銘柄がヒットした際にスクロールで見せるため（2026-08-21 ユーザー要望）
  const [jumpHighlight,setJumpHighlight]=useState(null); // 直前にジャンプした銘柄コード。数秒だけ行を強調表示する
  // 2026-09-08新規：登録銘柄（最大300件）を業種アコーディオンを開かずに直接検索するための専用欄。
  // 上のq/resultsは「まだ登録していない候補」を探して追加する検索（既存・無変更）だが、
  // こちらは既に登録済みのwatchlistだけを対象にする別の検索（指示書8番：全銘柄検索とは分ける）。
  const [regQ,setRegQ]=useState("");
  const [regActiveIndex,setRegActiveIndex]=useState(0);

  const regCodes=useMemo(()=>new Set(watchlist.map(w=>w.code)),[watchlist]);
  // 2026-08-21 ユーザー要望：コード・企業名に加え、読み仮名（ひらがな・カタカナどちらで入力しても
  // ヒットする）でも検索できるようにする。normKana()でクエリ・候補側の双方をひらがなに正規化して
  // 比較するため、社名がカタカナのみの銘柄は読み未収録でもこれだけで検索可能になる。
  const results=useMemo(()=>{const t=normKana(q.trim());if(!t)return[];
    return candidates.filter(m=>!regCodes.has(m.code)&&(normKana(m.code).includes(t)||normKana(m.name).includes(t)||normKana(m.kana).includes(t)||normKana(m.sector).includes(t))).slice(0,8);},[q,regCodes,candidates]);
  // 「検索しても候補が出てこない」問い合わせ対応：日経225+主要30社／ダウ30社は最初から登録済み
  // （MASTER・DEFAULT_WATCHLIST）のため、有名企業ほど検索しても新規候補が0件になりやすい。
  // resultsが空のとき、実は既に登録済みなだけなのかを判定してユーザーに明示する。
  const alreadyRegisteredMatch=useMemo(()=>{const t=normKana(q.trim());if(!t)return null;
    return candidates.find(m=>regCodes.has(m.code)&&(normKana(m.code).includes(t)||normKana(m.name).includes(t)||normKana(m.kana).includes(t)))||null;},[q,regCodes,candidates]);
  // 2026-09-08新規：登録銘柄（watchlist、最大300件）だけを対象にした検索。normKana()で
  // コード・企業名・読み仮名・セクターいずれも大文字小文字・全角半角・カタカナ/ひらがなの
  // 揺れを吸収して比較する（上のresults用ロジックと同じ正規化を使い回すのみ、判定ロジックの
  // 二重実装は避ける）。クライアント側フィルタのみ（APIは叩かない、指示書10番）。
  const regResults=useMemo(()=>{
    const t=normKana(regQ.trim());if(!t)return[];
    return watchlist.filter(w=>normKana(w.code).includes(t)||normKana(w.name).includes(t)||normKana(w.kana).includes(t)||normKana(w.sector).includes(t))
      .sort((a,b)=>a.code.localeCompare(b.code)).slice(0,20);
  },[regQ,watchlist]);
  useEffect(()=>{setRegActiveIndex(0);},[regQ]);
  const clearRegSearch=()=>{setRegQ("");setRegActiveIndex(0);};
  const onRegSearchKeyDown=(e)=>{
    if(!regResults.length)return;
    if(e.key==="ArrowDown"){e.preventDefault();setRegActiveIndex(i=>(i+1)%regResults.length);}
    else if(e.key==="ArrowUp"){e.preventDefault();setRegActiveIndex(i=>(i-1+regResults.length)%regResults.length);}
    else if(e.key==="Enter"){e.preventDefault();jumpToRegistered(regResults[regActiveIndex]);}
    else if(e.key==="Escape"){e.preventDefault();clearRegSearch();}
  };
  const addStock=(m)=>{if(watchlist.length>=max){alert("登録は最大"+max+"社までです。");return;}
    if(regCodes.has(m.code))return; setWatchlist([...watchlist,{id:m.code,...m,watch:"通常",note:"",theme:""}]);setQ("");};
  const [sectorGuessing,setSectorGuessing]=useState(false);
  // 2026-08-21 ユーザー要望：マスターリストに無い銘柄を手動登録する際、業種プルダウンの手動選択に
  // 頼らずyfinanceから東証33業種を推定して自動で埋める（guess_sector()、server.py参照）。
  // 完全な精度は保証できないため、推定できなかった場合はプルダウンで選んだ値（manualSector）を
  // そのまま使う（従来どおり）。
  const addManual=async()=>{
    const raw=q.trim();if(!raw)return;if(watchlist.length>=max){alert("最大"+max+"社");return;}
    let code=raw,name=raw;
    if(!/^[0-9]{4}[0-9A-Za-z]?$/.test(raw)){
      const input=prompt(`「${raw}」の証券コード（例：5016、AAPL）を入力してください`,"");
      if(!input||!input.trim())return;
      code=input.trim();
    }
    let sector=manualSector;
    setSectorGuessing(true);
    try{
      const r=await fetch("/api/guess-sector",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code,market})});
      if(r.ok){
        const d=await r.json();
        if(d.sector&&SECTOR_CHOICES.includes(d.sector))sector=d.sector;
      }
    }catch(e){}
    setSectorGuessing(false);
    setWatchlist([...watchlist,{id:Date.now()+Math.random(),code,name,sector,market,tvSymbol:(market==="JP"?"TSE:"+code:code),watch:"通常",note:"",theme:""}]);setQ("");};
  const delStock=(id)=>setWatchlist(watchlist.filter(w=>w.id!==id));
  const editTheme=(w)=>{
    const input=prompt(`「${w.name}」のテーマ（例：AI関連、インバウンド、半導体）`,w.theme||"");
    if(input==null)return; // キャンセル
    setWatchlist(watchlist.map(x=>x.id===w.id?{...x,theme:input.trim()}:x));
  };

  // 銘柄コードの前日比(%)・売買代金（3章カラールール・セクター並び替えで共通利用）
  const pctOf=(code)=>{const qt=stockQuotes[code]||{};const t=num(qt.t),p=num(qt.p);
    return (t!=null&&p!=null&&p)?(t-p)/p*100:null;};
  const turnoverOf=(code)=>{const v=num(stockQuotes[code]?.turnover);return v!=null&&v>0?v:null;};

  // セクターの並び順は「セクター内合計売買代金の降順」。銘柄追加・株価更新のたびに再計算され、
  // 売買代金の変動に応じて自動的に入れ替わる。未取得時はSECTOR_CHOICES(33業種+指数・為替)の定義順にフォールバック。
  const sectorOrder=useMemo(()=>SECTOR_CHOICES,[]);
  const sectorGroups=useMemo(()=>{
    const map={};
    watchlist.forEach(w=>{(map[w.sector]=map[w.sector]||[]).push(w);});
    return Object.entries(map)
      .map(([sector,items])=>{
        const pcts=items.map(w=>pctOf(w.code)).filter(v=>v!=null);
        const avgPct=pcts.length?pcts.reduce((a,b)=>a+b,0)/pcts.length:null;
        const totalTurnover=items.reduce((sum,w)=>sum+(turnoverOf(w.code)||0),0);
        return {sector,avgPct,totalTurnover,items:[...items].sort((a,b)=>(wOrder[a.watch]-wOrder[b.watch])||a.code.localeCompare(b.code))};
      })
      .sort((a,b)=>(b.totalTurnover-a.totalTurnover)||(sectorOrder.indexOf(a.sector)-sectorOrder.indexOf(b.sector)));
  },[watchlist,stockQuotes,sectorOrder]);
  const toggleSector=(sec)=>setOpenSectors(prev=>{const n=new Set(prev);n.has(sec)?n.delete(sec):n.add(sec);return n;});

  // v3-3 Step4（UI統一）：監視銘柄タブと同じRS/Status判定をこのテーブルにも適用する。
  // 市場全体の当日騰落率は日本株=日経平均、米国株=NASDAQ（既存metricsから、追加リクエスト無し）。
  // セクター平均は上のsectorGroupsで既に集計済みの値をそのまま再利用する。
  const marketPct=useMemo(()=>{
    const m=metrics?.[market==="US"?"nasdaq":"nikkei"];if(!m)return null;
    const t=num(m.t),p=num(m.p);return (t!=null&&p!=null&&p)?(t-p)/p*100:null;
  },[metrics,market]);
  const sectorAvgMap=useMemo(()=>Object.fromEntries(sectorGroups.map(g=>[g.sector,g.avgPct])),[sectorGroups]);

  // Actionメニュー（監視銘柄タブと共通のCSSクラスを使う「⋮」ドロップダウン）
  const [openMenuFor,setOpenMenuFor]=useState(null);
  useEffect(()=>{
    if(!openMenuFor)return;
    const close=()=>setOpenMenuFor(null);
    window.addEventListener("click",close);
    return ()=>window.removeEventListener("click",close);
  },[openMenuFor]);

  // 2026-08-21 ユーザー要望：検索した銘柄が既に登録済みだった場合、そのセクターを開いて実際の行まで
  // スクロールする（メッセージを出すだけで終わらせない）。アコーディオンの開閉は次の描画を経てから
  // でないとDOMに行が無くscrollIntoViewできないため、setTimeoutで1フレーム分待つ。
  // 2026-08-22 判明：behavior:"smooth"はrequestAnimationFrameベースのアニメーションのため、
  // タブが非アクティブ/背面描画状態だと開始すらしないままスクロール位置が変わらないことがある
  // （ユーザー報告で再現）。アニメーションに依存しない"instant"に変更し、確実に移動させる。
  const jumpToRegistered=(m)=>{
    if(!m)return;
    setOpenSectors(prev=>new Set(prev).add(m.sector));
    setQ("");
    setRegQ(""); // 2026-09-08追加：登録銘柄専用検索から選んだ場合も、結果一覧を閉じて通常のアコーディオン表示に戻す
    setJumpHighlight(m.code);
    setTimeout(()=>{
      rowRefs.current[m.code]?.scrollIntoView({behavior:"instant",block:"center"});
    },50);
    setTimeout(()=>setJumpHighlight(prev=>prev===m.code?null:prev),2500);
  };

  return <div style={{marginTop:18}}>
    <div className="sec-head">登録銘柄　{watchlist.length}/{max}</div>
    <div className="sec-note">自動保存されます。</div>
    <div style={{position:"relative"}}>
      <div style={{display:"flex",alignItems:"center",gap:8,border:"1px solid var(--rule)",background:"var(--card)",borderRadius:4,padding:"8px 12px"}}>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder={market==="JP"?"銘柄コード・企業名・読み仮名・セクターで検索（例：6981、村田、むらた、化学）":"ティッカー・企業名・セクターで検索（例：AAPL、Apple、電気機器）"}
          style={{flex:1,border:"none",background:"transparent",outline:"none",fontSize:14}}/>
        {q && <button className="iconbtn" onClick={()=>setQ("")}>×</button>}
      </div>
      {q.trim() && <div className="results">
        {results.length===0 && alreadyRegisteredMatch && <button className="res-row" style={{fontSize:12.5,color:"var(--inkSoft)",textAlign:"left"}}
          onClick={()=>jumpToRegistered(alreadyRegisteredMatch)}>
          「{alreadyRegisteredMatch.name}」({alreadyRegisteredMatch.code}／{alreadyRegisteredMatch.sector})は既に登録済みです。クリックすると該当セクターを開いて表示します。
        </button>}
        {results.map(m=>
          <button key={m.code} className="res-row" onClick={()=>addStock(m)}>
            <span className="mono" style={{fontSize:12,width:60,color:"var(--inkSoft)"}}>{m.code}</span>
            <span style={{flex:1,fontSize:13}}>{m.name}</span>
            <span style={{fontSize:11,color:"var(--inkSoft)"}}>{m.sector}</span>
            <span style={{color:"var(--accent)",fontWeight:700}}>＋</span>
          </button>)}
        <div className="res-row" style={{background:"var(--band)",fontSize:12.5,color:"var(--inkSoft)",display:"flex",alignItems:"center",gap:8}}>
          <span>＋「{q.trim()}」を手動登録：業種（登録時に自動推定・違えば選び直せます）</span>
          <select value={manualSector} onChange={e=>setManualSector(e.target.value)} style={{fontSize:12}} disabled={sectorGuessing}>
            {SECTOR_CHOICES.map(s=><option key={s} value={s}>{s}</option>)}
          </select>
          <button className="btn" style={{fontSize:11.5,padding:"2px 10px"}} onClick={addManual} disabled={sectorGuessing}>{sectorGuessing?"業種を判定中…":"登録"}</button>
        </div>
      </div>}
    </div>
    {/* 2026-09-08新規：登録済み銘柄（最大{max}件）だけを対象にした検索欄。上の検索欄（新規登録用、
        既存・無変更）とは別に、既に登録済みの{watchlist.length}銘柄の中からコード・企業名・
        読み仮名・セクターで素早く見つけて該当行へジャンプするための専用UI（指示書1〜8番）。 */}
    <div style={{marginTop:10,position:"relative"}}>
      <div style={{display:"flex",alignItems:"center",gap:8,border:"1px solid var(--rule)",background:"var(--card)",borderRadius:4,padding:"8px 12px"}}>
        <span style={{color:"var(--inkFaint)",fontSize:13}}>🔍</span>
        <input value={regQ} onChange={e=>setRegQ(e.target.value)} onKeyDown={onRegSearchKeyDown}
          placeholder={`登録銘柄（${watchlist.length}件）をコード・企業名・読み仮名・セクターで検索…`}
          style={{flex:1,border:"none",background:"transparent",outline:"none",fontSize:14}}/>
        {regQ && <button className="iconbtn" onClick={clearRegSearch} title="検索をクリア（Escでも可）">×</button>}
      </div>
      {regQ.trim() && <div className="results">
        {regResults.length===0
          ? <div className="res-row" style={{fontSize:12.5,color:"var(--inkSoft)",cursor:"default"}}>該当する登録銘柄がありません。</div>
          : regResults.map((m,i)=>{
              const ct=num(stockQuotes[m.code]?.t),pt=num(stockQuotes[m.code]?.p);
              const pct=(ct!=null&&pt!=null&&pt)?(ct-pt)/pt*100:null;
              const pctColor=pct==null||pct===0?"var(--inkSoft)":(pct>0?"var(--up)":"var(--down)");
              return <button key={m.code} className="res-row" onMouseEnter={()=>setRegActiveIndex(i)}
                style={{background:i===regActiveIndex?"var(--band)":"transparent"}} onClick={()=>jumpToRegistered(m)}>
                <span className="mono" style={{fontSize:12,width:56,color:"var(--inkSoft)"}}>{m.code}</span>
                <span style={{flex:1,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={m.name}>{m.name}</span>
                <span style={{fontSize:11,color:"var(--inkSoft)",whiteSpace:"nowrap"}}>{m.sector}</span>
                <span className="mono" style={{fontSize:13,fontWeight:700,minWidth:56,textAlign:"right"}}>{ct!=null?ct.toLocaleString():"—"}</span>
                <span className="mono" style={{fontSize:11.5,fontWeight:600,color:pctColor,minWidth:52,textAlign:"right"}}>{pct!=null?(pct>0?"+":"")+pct.toFixed(2)+"%":"—"}</span>
              </button>;
            })}
      </div>}
    </div>
    <div style={{marginTop:12,border:"1px solid var(--rule)",background:"var(--card)",borderRadius:4,overflow:"hidden"}}>
      {regQ.trim() ? null : sectorGroups.length===0 ?
        <div style={{padding:26,textAlign:"center",color:"var(--inkSoft)",fontSize:13}}>{`上の検索から銘柄を登録してください（最大${max}社）。`}</div> :
        sectorGroups.map(({sector,avgPct,items},i)=>{
          const isOpen=openSectors.has(sector);
          // v3 Phase1（設計案4・11・90番）：セクター見出し行のベタ塗りを廃止。騰落率は文字色のみで表現。
          const avgFg=avgPct==null||avgPct===0?"var(--ink)":(avgPct>0?"var(--up)":"var(--down)");
          return <div key={sector} style={{borderTop:i===0?"none":"1px solid var(--ruleSoft)"}}>
            <button onClick={()=>toggleSector(sector)} style={{display:"flex",alignItems:"center",width:"100%",gap:10,padding:"8px 14px",
              background:isOpen?"var(--band)":"transparent",border:"none",cursor:"pointer",textAlign:"left",font:"inherit",color:"var(--ink)"}}>
              <span className="mono" style={{fontSize:12,color:"var(--inkSoft)",width:14}}>{isOpen?"▾":"▸"}</span>
              <span style={{flex:1,fontSize:14.5,fontWeight:700}}>{sector}</span>
              <span className="mono" style={{fontSize:15,fontWeight:800,color:avgFg,minWidth:64,textAlign:"right"}}>
                {avgPct!=null?(avgPct>0?"+":"")+avgPct.toFixed(2)+"%":"—"}
              </span>
              <span style={{fontSize:11.5,color:"var(--inkSoft)"}}>{items.length}銘柄</span>
            </button>
            {isOpen && <div style={{overflowX:"auto",overflowY:"auto",maxHeight:520}}>
              <table className="watch-table" style={{width:"100%"}}>
              <colgroup>
                <col style={{width:150}}/><col style={{width:54}}/><col style={{width:56}}/><col/>
                <col style={{width:80}}/><col style={{width:80}}/>
                <col style={{width:58}}/><col style={{width:64}}/><col style={{width:36}}/>
              </colgroup>
              <thead><tr>
                <th>Status</th><th style={{textAlign:"right"}} title="総合RS：市場とセクターに対する相対的な強さを0〜100で表した総合スコア">総合RS</th><th>コード</th><th>銘柄</th>
                <th style={{textAlign:"right"}}>現在値</th><th style={{textAlign:"right"}}>前日比</th>
                <th style={{textAlign:"right"}} title={`対市場：銘柄騰落率 − ${market==="US"?"NASDAQ":"日経平均"}騰落率。プラスが大きいほど市場より強い`}>対市場</th>
                <th style={{textAlign:"right"}} title="対セクター：銘柄騰落率 − セクター平均騰落率。プラスが大きいほど同業・同セクターより強い">対セクター</th><th></th></tr></thead>
              <tbody>{items.map(w=>{
                const enr=enrichWatchRow(w,stockQuotes,marketPct,sectorAvgMap[w.sector],breakoutLevels,analysisData,marketRiskLabel);
                const ct=num(stockQuotes[w.code]?.t);
                const fg=enr.pct==null||enr.pct===0?"var(--ink)":(enr.pct>0?"var(--up)":"var(--down)");
                const inAnalysis=analysisTargets.includes(w.code);
                const inEarnings=earningsTargets.includes(w.code);
                const inWatch=watchTargets.includes(w.code);
                const isJumpTarget=jumpHighlight===w.code;
                const meta=PRIMARY_STATUS_META[enr.status];
                // v3-6：Status列はPrimary Status＋Action Statusの2軸表示。詳細理由はtitleのみ。
                const actionMeta=ACTION_STATUS_META[enr.actionStatus];
                const reasonList=enr.actionStatus==="RISK"?enr.riskReasons.map(r=>RISK_REASON_META[r])
                  :enr.actionStatus==="WAIT"?enr.waitReasons.map(r=>WAIT_REASON_META[r]):[];
                const themeRS=themeRelativeStrength(w,stockQuotes,metrics); // 参考情報のみ、Status判定には使わない
                const statusTitle=[meta.label,actionMeta.label,reasonList.join("・"),
                  themeRS&&`テーマ相対強弱 ${themeRS.relPts>0?"+":""}${themeRS.relPts.toFixed(2)}pt（対${METRICS.find(m=>m.key===themeRS.proxyKey)?.label||themeRS.proxyKey}）`]
                  .filter(Boolean).join(" / ");
                return <tr key={w.id} ref={el=>{rowRefs.current[w.code]=el;}} className="watch-row"
                  style={{borderTop:"1px solid var(--ruleSoft)",background:isJumpTarget?"var(--accent)":"transparent",
                    color:isJumpTarget?"var(--card)":"var(--ink)",transition:"background 0.4s, color 0.4s"}}>
                  <td style={{whiteSpace:"nowrap",overflow:"hidden",borderLeft:`3px solid ${meta.color}`,paddingRight:10}} title={statusTitle}>
                    <div style={{fontWeight:700,fontSize:11.5,color:isJumpTarget?"var(--card)":meta.color,whiteSpace:"nowrap"}}>{meta.icon} {meta.label}</div>
                    {actionMeta.label && <div style={{fontWeight:700,fontSize:10.5,color:isJumpTarget?"var(--card)":actionMeta.color,whiteSpace:"nowrap",marginTop:1}}>{actionMeta.icon} {actionMeta.label}</div>}
                  </td>
                  <td className="mono" style={{fontWeight:800,fontSize:15,textAlign:"right",paddingLeft:10,color:isJumpTarget?"var(--card)":(enr.rsScore==null?"var(--ink)":enr.rsScore>=75?"var(--up)":enr.rsScore<25?"var(--down)":"var(--ink)")}}>{enr.rsScore!=null?enr.rsScore:"—"}</td>
                  <td className="mono" style={{fontWeight:700,fontSize:13}}>{w.code}</td>
                  <td style={{fontSize:15,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={w.name}>
                    {w.watch==="優先"&&<span style={{color:"var(--star)",marginRight:4}}>★</span>}{w.name}
                    <NewsBadge catalysts={newsCatalysts} code={w.code} sector={w.sector}/>
                    {isOpen && <WatchlistEventTag code={w.code}/>}</td>
                  <td className="mono" style={{textAlign:"right",fontWeight:700,fontSize:14.5,color:isJumpTarget?"var(--card)":fg,whiteSpace:"nowrap"}}>{ct!=null?ct.toLocaleString():"—"}</td>
                  <td className="mono" style={{textAlign:"right",fontWeight:600,fontSize:14,color:isJumpTarget?"var(--card)":fg,whiteSpace:"nowrap"}}>{enr.pct!=null?(enr.pct>0?"+":"")+enr.pct.toFixed(2)+"%":"—"}</td>
                  <td className="mono" style={{textAlign:"right",fontSize:13,fontWeight:700,whiteSpace:"nowrap"}}>{enr.marketRS!=null?(enr.marketRS>0?"+":"")+enr.marketRS.toFixed(1):"—"}</td>
                  <td className="mono" style={{textAlign:"right",fontSize:13,whiteSpace:"nowrap"}}>{enr.sectorRS!=null?(enr.sectorRS>0?"+":"")+enr.sectorRS.toFixed(1):"—"}</td>
                  <td style={{textAlign:"center",position:"relative"}}>
                    <button className="watch-menu-btn" onClick={e=>{e.stopPropagation();setOpenMenuFor(v=>v===w.code?null:w.code);}}>⋮</button>
                    {openMenuFor===w.code && <div className="watch-menu" onClick={e=>e.stopPropagation()}>
                      <button onClick={()=>{onOpenChart(w);setOpenMenuFor(null);}}>チャート</button>
                      <button className={inAnalysis?"on":""} onClick={()=>{onToggleAnalysis(w.code,w.market);setOpenMenuFor(null);}}>{inAnalysis?"✓ 分析中":"分析"}</button>
                      {market==="JP" && <button className={inWatch?"on":""} onClick={()=>{onToggleWatch(w.code);setOpenMenuFor(null);}}>{inWatch?"✓ 監視銘柄":"監視銘柄に追加"}</button>}
                      {market==="JP" && <button className={inEarnings?"on":""} onClick={()=>{onToggleEarnings(w.code);setOpenMenuFor(null);}}>{inEarnings?"✓ 決算":"決算"}</button>}
                      {/* 2026-09-08新規：監視銘柄（watchTargets）登録の有無に関わらず、登録銘柄
                          一覧から直接ポジション追加できるようにする。既存のPositionEntryModal
                          （監視銘柄タブ・PortfolioPanelと同じもの）をApp側で開くだけ。 */}
                      {onAddPosition && <button onClick={()=>{onAddPosition(w);setOpenMenuFor(null);}}>➕ ポジションに追加</button>}
                      <button onClick={()=>{editTheme(w);setOpenMenuFor(null);}}>{w.theme?`テーマ編集（${w.theme}）`:"＋テーマ"}</button>
                      <button onClick={()=>{delStock(w.id);setOpenMenuFor(null);}}>登録解除</button>
                    </div>}
                  </td>
                </tr>;})}</tbody>
            </table></div>}
          </div>;
        })}
    </div>
  </div>;
}

// 監視銘柄タブ（2026-08-21 ユーザー要望）：「日本市場」「アメリカ市場」タブの「監視銘柄」
// ボタン、または出来高ブレイクアウト条件への自動該当でwatchTargetsに入った銘柄を、市場を
// 問わずまとめて確認する。列構成はSectorWatchlistの登録銘柄テーブルと同じだが、対象が
// 少数精鋭になる想定のためセクター別アコーディオンにはせず前日比の大きい順にフラット表示する。
// 「本日優先」に相当するボタンは無く、末尾の「削除」はwatchTargetsから外すだけ（実際の登録
// 銘柄一覧からは削除しない。完全な登録解除は「日本市場」「アメリカ市場」タブの×で行う）。
// Relative Strength計算（Trade Cockpit v2 Phase1・設計案8-9番）。個別銘柄の当日騰落率と、
// 市場全体（日経平均）・所属セクター平均との差分からRS Scoreを0-100に正規化する。監視銘柄タブ
// （WatchTargetsPanel）・日次モニターのTODAY'S MARKET（TodaysMarketCard）の両方で使う共通関数。
// 重みは初期値（w1=w2=3）。運用しながら調整する想定で、ハードコードだがこの1箇所にまとめてある。
function calcRsScore(pct,marketPct,sectorAvg){
  if(pct==null)return {marketRS:null,sectorRS:null,rsScore:null};
  const marketRS=marketPct!=null?pct-marketPct:null;
  const sectorRS=sectorAvg!=null?pct-sectorAvg:null;
  if(marketRS==null&&sectorRS==null)return {marketRS,sectorRS,rsScore:null};
  const raw=(marketRS||0)*3+(sectorRS||0)*3;
  const rsScore=Math.max(0,Math.min(100,Math.round(50+raw)));
  return {marketRS,sectorRS,rsScore};
}

// 2026-09-08新規（ユーザーの後場レビューJSON、app_improvement_requests
// 「SECTOR_RELATIVE_STRENGTH」対応）：既存sectorRS（対セクター＝自分のwatchlist内の同業種
// 平均との差）は東証33業種の粒度で、半導体材料株（例：JX金属＝非鉄金属）のような
// テーマ横断の関連性までは拾えない。既存の`theme`欄（「＋テーマ」で自由入力済み、新規データ
// 追加なし）にキーワードが含まれる銘柄だけ、対応するセクター代表ETF（現状は半導体＝
// 200A、server.pyのSECTOR_PROXY_METRICSと対）との相対強弱を追加で計算する。
// calcRsScore/rsScore/Primary・Action Statusには一切混ぜない（既存の売買判定ロジックは
// 無変更、あくまで参考情報としてtitleツールチップ等に表示するだけ）。
const THEME_PROXY_METRIC={"半導体":"nikkei_semi"};
function themeProxyKeyFor(theme){
  if(!theme)return null;
  for(const k in THEME_PROXY_METRIC){if(theme.includes(k))return THEME_PROXY_METRIC[k];}
  return null;
}
function themeRelativeStrength(w,stockQuotes,metrics){
  const proxyKey=themeProxyKeyFor(w?.theme);
  if(!proxyKey)return null;
  const qt=stockQuotes[w.code]||{};
  const ct=num(qt.t),cp=num(qt.p);
  const pct=(ct!=null&&cp!=null&&cp)?(ct-cp)/cp*100:null;
  const m=metrics?.[proxyKey];
  const mt=m?num(m.t):null,mp=m?num(m.p):null;
  const proxyPct=(mt!=null&&mp!=null&&mp)?(mt-mp)/mp*100:null;
  if(pct==null||proxyPct==null)return null;
  return {pct,proxyPct,relPts:pct-proxyPct,proxyKey};
}

// Trade Cockpit v3-3 Step4（UI統一）：Status/BREAK判定ロジックを共通関数化。元はWatchTargetsPanel
// 内のuseMemoに閉じていたが、日本市場/アメリカ市場タブ（SectorWatchlist）でも同じ判定を使う
// ために切り出した。軽量計算のみ（サーバー側analyze_stock()は呼ばない）。
function enrichWatchRow(w,stockQuotes,marketPct,sectorAvg,breakoutLevels,analysisData,marketRiskLabel,eventRiskGuard){
  const qt=stockQuotes[w.code]||{};
  const ct=num(qt.t),p=num(qt.p);
  const pct=(ct!=null&&p!=null&&p)?(ct-p)/p*100:null;
  const {marketRS,sectorRS,rsScore}=calcRsScore(pct,marketPct,sectorAvg);
  const levels=breakoutLevels?.[w.code];
  const vol=num(qt.volume);
  const volRatio=(levels?.volAvg5&&vol!=null)?vol/levels.volAvg5:null;
  const highBreak=!!(levels&&ct!=null&&ct>levels.highLookback);
  const volSurge=volRatio!=null&&volRatio>=1.5;
  // 2026-09-09追記（TOP5/監視銘柄一覧と詳細分析のENTRY判定不整合の修正）：aは「分析」済み
  // 銘柄のanalyze_stock()フル結果（未分析ならundefined）。detailed分析側のdayTradeLabel・
  // EntryConditionsChecklist・pullbackEntryと全く同じフィールドをここでも読み、「銘柄として
  // 強いか」（Primary Status／breakType）と「今買えるか」（waitReasons／actionStatus）を
  // 混同しないよう、後者の判定にa.entryConditionsMet/Total・a.tradeRules.pullbackEntryを使う。
  const a=analysisData?.[w.code];
  const ind=a?.indicators;
  const assessment=a?.assessment;
  const vwapReclaim=!!(ind?.vwap!=null&&ct!=null&&ct>ind.vwap);
  const resistBreak=!!(ind?.resistance!=null&&ct!=null&&ct>ind.resistance);
  let breakType=null;
  if(highBreak&&volSurge)breakType="VOLUME";
  else if(highBreak)breakType="HIGH";
  else if(resistBreak)breakType="RESIST";
  else if(vwapReclaim)breakType="VWAP";

  // v3-3 Step5（BREAK判定の再検討・2026-09-03改訂）：「一度ブレイクした」だけでなく「今もブレイクが
  // 有効か」を見る。既に取得済みの当日高値（stockQuotes[].high）からの押し（pullback）・当日騰落率・
  // Market RS/Sector RSを使い、ACTIVE/WEAK/FAILEDの3段階に分ける（新規の重い計算は追加しない）。
  // なお「ブレイク水準を割っている」銘柄はbreakType自体が現在値とのライブ比較（highBreak等）で
  // 判定されるため、そもそもここに来る時点でbreakTypeが付かず自動的に除外される。
  const todayHigh=num(qt.high),todayLow=num(qt.low);
  const pullbackPct=(todayHigh!=null&&ct!=null&&todayHigh>0)?(todayHigh-ct)/todayHigh*100:null;
  let breakQuality=null;
  if(breakType){
    const decliningHard=pct!=null&&pct<=-2;
    const decliningMild=pct!=null&&pct<=-1;
    const fadedFromHigh=pullbackPct!=null&&pullbackPct>=5;
    const veryWeakRS=(marketRS!=null&&marketRS<=-6)||(sectorRS!=null&&sectorRS<=-6);
    const weakRS=(marketRS!=null&&marketRS<=-3)||(sectorRS!=null&&sectorRS<=-3);
    const mildPullback=pullbackPct!=null&&pullbackPct>=2;
    if(decliningHard||fadedFromHigh||veryWeakRS)breakQuality="FAILED";
    else if(decliningMild||weakRS||mildPullback)breakQuality="WEAK";
    else breakQuality="ACTIVE";
  }
  const isBreak=breakType!=null;

  // v3-6（2026-09-04・Primary/Action 2軸化）：Primary Statusは「銘柄そのものの強さ」だけを表す
  // （HOT/ACTIVE_BREAK/WEAK_BREAK/FAILED_BREAK/WATCH/WEAK）。旧status＋breakQualityを統合した形。
  let status;
  if(isBreak)status=breakQuality==="ACTIVE"?"ACTIVE_BREAK":breakQuality==="WEAK"?"WEAK_BREAK":"FAILED_BREAK";
  else if(rsScore!=null&&rsScore>=75)status="HOT";
  else if(rsScore!=null&&rsScore>=50)status="WATCH";
  else status="WEAK";

  // Action Status：「今ここから入れるか」。全監視銘柄にanalyze_stock()相当の重い計算は追加せず、
  // 既に取得済みのstockQuotes（当日高値・安値・出来高）・RS Score・breakoutLevelsだけで判定する。
  // 「分析」済み銘柄（analysisData）があればVWAP・RSI・信用倍率・Falling Knife/Chase Riskで精度を
  // 上げるが、無くても動く設計（この点は変更なし）。
  //
  // RISK（強く見えても今入るのは危険。isBreakかどうかを問わず評価＝BREAKと同時にRISKもあり得る）：
  //  - CHASE_UP: 当日+8%以上、かつ高値からの押しが2%未満（＝まだ反落していない伸び切った状態＝
  //    「飛んだ銘柄をFOMOで追わない」対象）
  //  - VWAP_EXTENDED: 現在値がVWAPの1.03倍超（分析済みのみ）
  //  - VOLUME_CRASH: 出来高急増を伴う当日-3%以下の急落
  //  - FALLING_KNIFE/CHASE_RISK: サーバー側analyze_stock()が既に算出済みの判定を再利用（分析済みのみ、
  //    新規計算なし）＝「落ちるナイフは掴まない」をこのライト判定でも機能させる
  //  - SPIKE_REVERSAL/EXTREME_MOVE/MARGIN_DANGER/RSI_HOT：既存条件を維持
  const riskReasons=[];
  if(pct!=null&&pct>=8&&pullbackPct!=null&&pullbackPct<2)riskReasons.push("CHASE_UP");
  if(ind?.vwap!=null&&ct!=null&&ct>ind.vwap*1.03)riskReasons.push("VWAP_EXTENDED");
  if(volSurge&&pct!=null&&pct<=-3)riskReasons.push("VOLUME_CRASH");
  if(assessment?.fallingKnife)riskReasons.push("FALLING_KNIFE");
  if(assessment?.chaseRisk)riskReasons.push("CHASE_RISK");
  if(pct!=null&&pct>=5&&pullbackPct!=null&&pullbackPct>=3)riskReasons.push("SPIKE_REVERSAL");
  if(pct!=null&&Math.abs(pct)>=8)riskReasons.push("EXTREME_MOVE");
  if(a?.tradeRules?.marginBadge==="danger")riskReasons.push("MARGIN_DANGER");
  if(ind?.rsi!=null&&ind.rsi>=80)riskReasons.push("RSI_HOT");

  // WAIT（「弱いから待つ」ではなく「候補としては良いがエントリー条件未達」）：
  // 2026-09-09修正（TOP5/監視銘柄一覧のENTRY READYが詳細分析のCHASE RISK／WAIT判定と
  // 矛盾する不具合対応。実例：5019出光興産＝ACTIVE BREAK＋総合RS高だが、詳細分析は
  // CHASE RISK・Entry Conditions 4/7・押し目未形成でWAIT）。
  // 旧実装は「既にbreakType成立済み＝BREAK系はもう入る条件が整っている」という前提で
  // isBreak時はWAIT判定そのものをスキップしていたが、これが誤りだった——「銘柄として強い
  // （ACTIVE BREAK）」と「今この価格から入ってよいか」は別軸であり、ブレイク済みでも
  // 押し目未形成・エントリー条件未達なら入るべきではない。isBreakによる除外を撤廃し、
  // NEAR_BREAKOUT（ブレイク前夜の意味なのでisBreak時は対象外のまま）以外は
  // BREAK系にも同じ基準を適用する。
  //  - VWAP_NOT_RECLAIMED: VWAP未回復（分析済みのみ）
  //  - RANGE_UNCONFIRMED: プラス圏だが当日レンジの下半分＝押し目形成途中／下げ止まり未確認
  //  - NEAR_BREAKOUT: highLookbackまで1.5%以内だが未突破＝ブレイク直前（isBreak時は対象外）
  //  - SECTOR_WEAK: Sector RS <= -2pt
  //  - MARKET_SOFT: 地合いが明確に軟調（日経当日-1%以下、またはMarket RiskがHIGH RISK/RISK OFF）
  //    かつ、この銘柄自身のMarket RS/Sector RSが地合いを跳ね返すほど強くはない場合のみ。
  //    ※ 市場が少しマイナスというだけでは発火しない・Market RS/Sector RSが非常に強い（+5pt以上）
  //    銘柄は地合いだけを理由にWAITへ落とさない（全面安の中の相対的な強さを重視する戦略のため）。
  //  - NO_PULLBACK_YET（新規）: 当日+3%以上伸びているのに高値から2%未満しか押していない＝
  //    まだ一度も反落していない「飛び乗り」状態。CHASE_UP（+8%・押し2%未満→RISK）より緩い
  //    水準で、分析データの有無に関わらずstockQuotes（当日高値・現在値）だけで判定できる。
  //    実例の5019（当日+5.7%、高値からの押し約1.4%）はこの条件で正しくWAITになる。
  //  - ENTRY_CONDITIONS_INCOMPLETE（新規）:「分析」済み銘柄について、詳細分析のEntry
  //    Conditions（entryConditionsMet/Total、詳細分析タブのdayTradeLabel／
  //    EntryConditionsChecklistと全く同じ数値）が全条件成立していない場合。「RSが高い
  //    だけでは入場許可にしない」（指示書5番）の直接的な実装——詳細分析側の判定を
  //    再利用するだけで新規の判定基準は増やさない。
  //  - PULLBACK_PENDING（新規）: 詳細分析のtradeRules.pullbackEntry.status==="candidate"
  //    （押し目候補ゾーンにまだ到達していない）の場合。「押し目待ち」の詳細分析結果を
  //    そのままTOP5/監視銘柄一覧のENTRY判定に反映する（指示書4番）。
  // WAITはPrimary StatusがWEAK（rsScore<50）の銘柄には付けない。「弱いから待つ」ではなく
  // 「候補としては良いがエントリー条件未達」という意味を保つため、そもそも候補にすらならない
  // 弱い銘柄（WEAK）はWAITではなくNONE（対象外）として扱う。
  const waitReasons=[];
  if(rsScore!=null&&rsScore>=50){
    if(ind?.vwap!=null&&ct!=null&&ct<ind.vwap)waitReasons.push("VWAP_NOT_RECLAIMED");
    const rangePos=(todayHigh!=null&&todayLow!=null&&ct!=null&&todayHigh>todayLow)?(ct-todayLow)/(todayHigh-todayLow):null;
    if(pct!=null&&pct>0&&rangePos!=null&&rangePos<0.5)waitReasons.push("RANGE_UNCONFIRMED");
    if(!isBreak&&levels?.highLookback!=null&&ct!=null&&ct<levels.highLookback&&((levels.highLookback-ct)/levels.highLookback)<=0.015)waitReasons.push("NEAR_BREAKOUT");
    if(sectorRS!=null&&sectorRS<=-2)waitReasons.push("SECTOR_WEAK");
    const veryStrongRS=(marketRS!=null&&marketRS>=5)||(sectorRS!=null&&sectorRS>=5);
    if(!veryStrongRS){
      const marketSoft=(marketPct!=null&&marketPct<=-1.0)||marketRiskLabel==="HIGH RISK"||marketRiskLabel==="RISK OFF";
      const rsNotStrongEnough=!(marketRS!=null&&marketRS>=3);
      const sectorSoft=sectorRS!=null&&sectorRS<=0;
      if(marketSoft&&(rsNotStrongEnough||sectorSoft))waitReasons.push("MARKET_SOFT");
    }
    if(pct!=null&&pct>=3&&pullbackPct!=null&&pullbackPct<2)waitReasons.push("NO_PULLBACK_YET");
    if(a&&a.entryConditionsTotal>0&&a.entryConditionsMet<a.entryConditionsTotal)waitReasons.push("ENTRY_CONDITIONS_INCOMPLETE");
    if(a?.tradeRules?.pullbackEntry?.status==="candidate")waitReasons.push("PULLBACK_PENDING");
  }

  // Action Statusの排他決定：RISK > WAIT > ENTRY_READY > NONE。
  // ENTRY_READYは「買いシグナル」ではなく「詳細分析する優先度が高い」の意味（HOT/ACTIVE_BREAK/
  // WATCH上位＝rsScore>=65で、RISKでもWAITでもない銘柄）。
  let actionStatus;
  if(riskReasons.length>0)actionStatus="RISK";
  else if(waitReasons.length>0)actionStatus="WAIT";
  else{
    const primaryQualifies=status==="HOT"||status==="ACTIVE_BREAK"||(status==="WATCH"&&rsScore!=null&&rsScore>=65);
    actionStatus=primaryQualifies?"ENTRY_READY":"NONE";
  }

  // TOP5表示ロジック修正指示（2026-09-12）：「今日の注目TOP5」のマイナス銘柄例外判定
  // （isResilienceExceptionCandidate）で「地合いが悪いか」を見るためmarketPctを持ち回す。
  // Event Risk Guard（2026-09-17新規、PHASE 7）：/api/event-risk-guardのbyCode[w.code]を
  // そのまま添えるだけ（新規計算はしない）。未取得時はLOW/未評価扱い（ノイズを増やさない）。
  const eventRisk=eventRiskGuard?.byCode?.[w.code];
  return {...w,pct,marketRS,sectorRS,rsScore,volRatio,status,breakType,breakQuality,actionStatus,riskReasons,waitReasons,marketPct,
    eventRiskLevel:eventRisk?.level||"LOW",eventRiskScore:eventRisk?.score??null,eventRiskReasons:eventRisk?.reasons||[]};
}

// v3-4（監視銘柄タブ「今日の注目TOP5」用）：enrichWatchRow()の軽量出力（rsScore/status/
// breakQuality）だけからA+/A/B+/B/Cとアクション（NOW/PULLBACK/BREAKOUT/WAIT/AVOID）を導出する。
// analyze_stock()が必要な厳密なgradeFromAnalysis/classifyEntryStrategy（トレード分析タブ用・
// 個別に「分析」した銘柄のみ）とは別物。全銘柄（数十〜数百件）に重い計算を追加しないための
// 簡易版で、"分析対象外の銘柄でもTOP5に出せる"ことを優先している。
function lightweightGrade(enr){
  if(enr.rsScore==null)return null;
  const order=["A+","A","B+","B","C"];
  let idx;
  if(enr.rsScore>=80)idx=0;
  else if(enr.rsScore>=70)idx=1;
  else if(enr.rsScore>=60)idx=2;
  else if(enr.rsScore>=50)idx=3;
  else idx=4;
  if(enr.actionStatus==="RISK"||enr.status==="WEAK"||enr.status==="FAILED_BREAK")idx=Math.min(order.length-1,idx+1);
  return order[idx];
}
function lightweightAction(enr){
  if(enr.status==null)return null;
  if(enr.actionStatus==="RISK")return "AVOID";
  if(enr.status==="ACTIVE_BREAK")return "BREAKOUT";
  if(enr.status==="WEAK_BREAK"||enr.status==="FAILED_BREAK")return "WAIT";
  if(enr.status==="HOT")return "NOW";
  if(enr.status==="WATCH")return enr.actionStatus==="ENTRY_READY"?"NOW":"PULLBACK";
  return "AVOID"; // WEAK
}
// TOP5の短い選定理由：既に画面に出しているRS Score・Status・前日比だけで組み立てる（新規計算なし）。
// v3-6：Action Status（RISK/WAIT）の理由があれば末尾に付け加える。
function lightweightReason(enr){
  const meta=PRIMARY_STATUS_META[enr.status];
  const pctTxt=enr.pct!=null?(enr.pct>0?"+":"")+enr.pct.toFixed(2)+"%":"—";
  const rsTxt=enr.rsScore!=null?`RS ${enr.rsScore}`:"RS —";
  const breakTxt=enr.breakType==="VOLUME"?"出来高急増ブレイク":enr.breakType==="HIGH"?"直近高値ブレイク":
    enr.breakType==="RESIST"?"レジスタンス上抜け":enr.breakType==="VWAP"?"VWAP回復":null;
  const reasonTxt=enr.actionStatus==="RISK"?enr.riskReasons.map(r=>RISK_REASON_META[r]).join("/")
    :enr.actionStatus==="WAIT"?enr.waitReasons.map(r=>WAIT_REASON_META[r]).join("/"):null;
  return [meta?.label,breakTxt,rsTxt,`前日比${pctTxt}`,reasonTxt].filter(Boolean).join("・");
}

// 2026-09-16新規（今買い時TOP5と詳細分析判定の整合性修正、指示書1-3・9番）：サーバー側
// entry_score/entryStateは監視銘柄全体を軽量パイプライン（Stage1/Stage2/5分足スナップショット
// のみ）でバッチ処理しており、詳細分析（analyze_stock()）が検出するRSI過熱・出来高の裏付け
// 不足・上値抵抗線接近等のCHASE RISK、およびEntry Conditionsチェックリストの未達を反映して
// いない（実データで確認：2026-09-16 5019出光興産はTOP5側RSI80.9/entry_conditions5-5で
// ENTRY_READYだが、analyze_stock()側はentryConditionsMet 4/6・chaseRisk=true「高値圏での
// 長い陽線の天井」「RSI(81)だけが高く出来高等の裏付けがない」でWAIT）。
// 一方、監視銘柄一覧・今日の注目TOP5側は既にenrichWatchRow()でこれらを統合済み
// （2026-09-09「TOP5/監視銘柄一覧のENTRY READYが詳細分析のCHASE RISK／WAIT判定と矛盾する
// 不具合対応」）。ここではその既存の統合結果（enr.actionStatus/waitReasons/riskReasons）を
// 「今買い時TOP5」表示にも同じ基準で適用する——新しい判定基準・新しいサーバー計算は追加しない
// （既存関数の再利用、指示書「既存実装を壊さず」）。
// ENTRY SCORE・候補順位（rank）自体は一切変更しない——「良い候補（順位・スコア）」と
// 「今ENTRYしてよいか（状態）」を分離する（指示書2・3番、「候補順位は高いがWAIT」は正常ケース）。
// 純粋関数（DOM/API非依存）：candidateEntryState（サーバーのc.entryState）とenr
// （enrichedByCode[c.code]、無ければundefined＝未分析銘柄はオーバーライドしない）を受け取り、
// {effectiveEntryState, confirmationOverrideReasons, confirmationUnblockConditions}を返す。
function resolveTop5EntryStateOverride(candidateEntryState,enr){
  const wasReadyLabel=candidateEntryState==="NOW_BUYABLE"||candidateEntryState==="ENTRY_READY";
  if(!wasReadyLabel||!enr){
    return {effectiveEntryState:candidateEntryState,confirmationOverrideReasons:null,confirmationUnblockConditions:null};
  }
  if(enr.actionStatus==="RISK"){
    const riskReasons=enr.riskReasons||[];
    return {
      effectiveEntryState:"CHASE_RISK",
      confirmationOverrideReasons:riskReasons.map(r=>RISK_REASON_META[r]||r),
      confirmationUnblockConditions:riskReasons.map(r=>RISK_UNBLOCK_CONDITION_META[r]).filter(Boolean),
    };
  }
  if(enr.actionStatus==="WAIT"){
    const waitReasons=enr.waitReasons||[];
    return {
      effectiveEntryState:waitReasons.includes("NEAR_BREAKOUT")?"WAIT_BREAKOUT":"WAIT_PULLBACK",
      confirmationOverrideReasons:waitReasons.map(r=>WAIT_REASON_META[r]||r),
      confirmationUnblockConditions:waitReasons.map(r=>WAIT_UNBLOCK_CONDITION_META[r]).filter(Boolean),
    };
  }
  return {effectiveEntryState:candidateEntryState,confirmationOverrideReasons:null,confirmationUnblockConditions:null};
}

// Status判定（Trade Cockpit v2 Phase1）。ルールベース・軽量計算のみ（サーバー側analyze_stock()は
// 呼ばない＝279銘柄規模でも重くならないよう、既に画面上にある値〈stockQuotes・sector平均・
// breakoutLevels〉だけから算出する）。RS Scoreの重み付けは初期値。運用しながら調整する想定。
// Trade Cockpit v3-4（UI/UX再設計）：星評価(1-5)を廃止し、既存のstrength値・Market RSから
// A+/A/B+/B/Cの総合評価を導出する（新規のサーバー計算は追加しない）。
function gradeFromAnalysis(a){
  const s=a.strength||0;
  const rs=a.assessment?.marketRS;
  const strong=rs!=null&&rs>=2;
  if(s>=5)return strong?"A+":"A";
  if(s===4)return strong?"A":"B+";
  if(s===3)return "B+";
  if(s===2)return "B";
  return "C";
}
const GRADE_COLOR={"A+":"var(--up)","A":"var(--up)","B+":"var(--accent)","B":"var(--accent)","C":"var(--inkFaint)"};

// エントリー戦略（NOW/PULLBACK/BREAKOUT/WAIT/AVOID）。既存のentry/stop/current・resistance・
// avoidChecklist・assessment（Falling Knife/Chase Risk）から判定するだけで、購入単価を
// そのまま表に出す旧方式を置き換える（新規のサーバー計算は追加しない）。
// 2026-09-09更新（TOP5/監視銘柄一覧とのENTRY判定統一。指示書「共通関数化」対応）：
// 第2引数enr（enrichWatchRow()の出力。TOP5・監視銘柄一覧・詳細分析の全てが同じ値を参照）を
// 渡すと、「NOW（今買える）」はenr.actionStatus==="ENTRY_READY"の場合のみ許可する。
// これにより、詳細分析カードの一番上のこのバッジと、その下のAssessmentCardが表示する
// Action Status（ACTION_STATUS_META、同じenr由来）が食い違うことがなくなる——
// 「銘柄として強いか」（BREAKOUT/PULLBACKという状況ラベル）はそのまま出しつつ、「今買える」
// という結論だけはTOP5/監視銘柄一覧と共通のenr.actionStatusに一本化する（指示書1番）。
// enrを渡さない旧来の呼び出し（無ければ全ての既存呼び出し元は互換のため必須にしない）では
// 従来通りの判定にフォールバックする。
function classifyEntryStrategy(a,enr){
  const criticalAvoid=(a.tradeRules?.avoidChecklist||[]).some(c=>c.hit&&["catastrophicVolumeCrash","badEarnings"].includes(c.key));
  if(a.assessment?.fallingKnife||criticalAvoid)return "AVOID";
  if(a.assessment?.chaseRisk)return "WAIT";
  const entryReady=enr?enr.actionStatus==="ENTRY_READY":true;
  if(entryReady){
    if(a.tradeRules?.entryPattern)return "NOW";
    const current=a.current,entry=a.entry;
    if(current!=null&&entry!=null&&current<=entry*1.005)return "NOW";
  }
  const current=a.current,entry=a.entry,resistance=a.indicators?.resistance;
  if(current!=null&&resistance!=null&&current>=resistance*0.995)return "BREAKOUT";
  if(current!=null&&entry!=null&&current>entry)return "PULLBACK";
  return "WAIT";
}
const ENTRY_STRATEGY_META={
  NOW:{label:"NOW：買える",color:"var(--up)"},
  PULLBACK:{label:"PULLBACK：押し目待ち",color:"var(--accent)"},
  BREAKOUT:{label:"BREAKOUT：高値更新待ち",color:"var(--accent)"},
  WAIT:{label:"WAIT：様子見",color:"var(--inkSoft)"},
  AVOID:{label:"AVOID：見送り",color:"var(--inkFaint)"},
};

// 無限に累積する問題があったため、サーバー側がauto_tagsを
// AUTO_MOMENTUM_DAY_CURRENT（最新スキャンのTOP15）／AUTO_MOMENTUM_DAY_SEEN（本日中に一度
// TOP15入りしたが現在は外れている履歴）の2キーに分けて管理するようになった。
// CURRENTを持つ銘柄はさらに、既存のPrimary/Action Status（30秒ごとの自動更新で再評価される）
// がRISK/FAILED_BREAK/WEAKになった時点で「崩れ始めた」＝WEAKENING表示に切り替える
// （新たにスコアを再計算するのではなく、無料データの更新頻度に合わせた軽量な判定、8-8の方針）。
// SEENのみの銘柄は「本日どこかでTOP15入りしたが、今は外れている」ことを示す別バッジ。
const MOMENTUM_BADGE_META={
  ACTIVE:    {icon:"🐒",label:"MOMENTUM DAY",color:"#b8860b"},
  WEAKENING: {icon:"🐒",label:"MOMENTUM WEAKENING",color:"var(--down)"},
  SEEN:      {icon:"🐒",label:"本日モメンタム(圏外)",color:"var(--inkFaint)"},
};
function deriveMomentumBadge(w){
  const cur=w.auto_tags?.AUTO_MOMENTUM_DAY_CURRENT;
  const seen=w.auto_tags?.AUTO_MOMENTUM_DAY_SEEN;
  if(cur){
    const weakening=w.actionStatus==="RISK"||w.status==="FAILED_BREAK"||w.status==="WEAK";
    return {tier:"current",meta:weakening?MOMENTUM_BADGE_META.WEAKENING:MOMENTUM_BADGE_META.ACTIVE,
      score:cur.score,stuckLimitUp:!!cur.stuckLimitUp};
  }
  if(seen)return {tier:"seen",meta:MOMENTUM_BADGE_META.SEEN,score:seen.score,stuckLimitUp:!!seen.stuckLimitUp};
  return null;
}

// v3-9続き（PHASE 3 EVENT/EARNINGS INTELLIGENCE）：イベント接近を銘柄分析・ポジションの判断材料
// として表示する（Primary/Action Statusには一切干渉しない、あくまで参考情報）。
// 営業日ベースの日数計算は簡易版（土日だけ除外、祝日は考慮しない）。
function businessDaysUntil(dateStr){
  if(!dateStr)return null;
  const target=new Date(dateStr+"T00:00:00+09:00");
  if(isNaN(target.getTime()))return null;
  const today=new Date();
  const todayJst=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  const targetJst=new Date(target.getFullYear(),target.getMonth(),target.getDate());
  let diffDays=Math.round((targetJst-todayJst)/86400000);
  if(diffDays<=0)return diffDays; // 当日・過去はそのまま返す（0=当日、負=既に経過）
  let businessDays=0,cursor=new Date(todayJst);
  for(let i=0;i<diffDays;i++){
    cursor=new Date(cursor.getTime()+86400000);
    const dow=cursor.getDay();
    if(dow!==0&&dow!==6)businessDays++;
  }
  return businessDays;
}
// 銘柄コード・セクターに関連するイベントのうち、直近のもの（未来のみ、withinDays日以内）を返す。
function nextEventForCode(events,code,sector,withinDays=45){
  if(!events||!events.length)return null;
  const todayStr=todayISO();
  const relevant=events.filter(ev=>{
    if(!ev.event_date||ev.event_date<todayStr)return false;
    const stocks=ev.affected_stocks||[];
    const sectors=ev.affected_sectors||[];
    const matches=stocks.includes(code)||(sector&&sectors.includes(sector));
    if(!matches)return false;
    const days=businessDaysUntil(ev.event_date);
    return days!=null&&days<=withinDays;
  });
  if(!relevant.length)return null;
  return relevant.sort((a,b)=>a.event_date.localeCompare(b.event_date))[0];
}
// 2026-09-07新規（複数重要イベント表示）：nextEventForCode()の「1件だけ」を、重要度HIGH
// 優先・同重要度なら近い日付順で最大3件に拡張したもの。マッチング（affected_stocks/
// affected_sectors）・過去イベント除外・businessDaysUntil()は既存nextEventForCodeと
// 同じロジックをそのまま再利用する。DAY/SWINGで表示ウィンドウを変える
// （DAY＝当日〜翌営業日のみ強めに表示、SWING・未指定＝10営業日以内）。
// Primary/Action Status・AUTOスコアへの新しい減点ルールは追加していない
// （あくまで表示用の抽出・並び替えで、判定ロジックには一切関与しない）。
function relevantEventsForCode(events,code,sector,tradeStyle,maxCount=3){
  if(!events||!events.length)return[];
  const todayStr=todayISO();
  const windowDays=tradeStyle==="DAY"?1:10;
  const IMPORTANCE_RANK={HIGH:0,MEDIUM:1,LOW:2};
  const relevant=events.filter(ev=>{
    if(!ev.event_date||ev.event_date<todayStr)return false; // 過去イベントは除外
    const stocks=ev.affected_stocks||[];
    const sectors=ev.affected_sectors||[];
    const matches=stocks.includes(code)||(sector&&sectors.includes(sector));
    if(!matches)return false;
    const days=businessDaysUntil(ev.event_date);
    return days!=null&&days<=windowDays;
  });
  return relevant.sort((a,b)=>{
    // 重要度HIGHを優先、同じ重要度なら近い日付順（ユーザー指示）
    const ai=IMPORTANCE_RANK[normalizeEventImportance(a.importance)]??3;
    const bi=IMPORTANCE_RANK[normalizeEventImportance(b.importance)]??3;
    if(ai!==bi)return ai-bi;
    return a.event_date.localeCompare(b.event_date);
  }).slice(0,maxCount);
}
