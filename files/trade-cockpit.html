          ["カタリスト",(parsed.catalysts||[]).length],["イベント",(parsed.events||[]).length],
          ["有識者見解",(parsed.expert_opinions||[]).length],["プレイブック",(parsed.trade_playbooks||[]).length],["感想",parsed.user_feedback?1:0]]
          .filter(([,n])=>n>0).map(([label,n])=>
            <span key={label} className="chip" style={{fontSize:11.5}}>{label} {n}件</span>)}
        {[["市場情報",parsed.market?.condition||parsed.market?.summary?1:0],["監視銘柄",(parsed.watchlist||[]).length],
          ["判断",(parsed.decisions||[]).length],["ルール",(parsed.rule_updates||[]).length],
          ["ニュース",(parsed.news||[]).length],["カタリスト",(parsed.catalysts||[]).length],
          ["イベント",(parsed.events||[]).length],["有識者見解",(parsed.expert_opinions||[]).length]]
          .every(([,n])=>n===0) && <span style={{fontSize:11.5,color:"var(--inkFaint)"}}>分類できた項目はありません（date/market/watchlist/decisions等をご確認ください）</span>}
      </div>
    </div>}
    {parsed&&extraNote && <div className="card" style={{marginTop:12,padding:"10px 14px",border:"1px solid var(--rule)",whiteSpace:"pre-wrap",fontSize:12.5,color:"var(--inkSoft)"}}>{extraNote}</div>}

    {/* v3-9続き（ChatGPT連携JSON解析改善）：詳細形式を検出・変換した場合、対応するキーが
        見つからず空欄になった項目を明示する（捏造しない・何が取れなかったか分かるようにする）。 */}
    {conversionInfo && <div className="card" style={{marginTop:12,padding:"10px 14px",border:"1px solid var(--rule)"}}>
      <div style={{fontSize:12.5}}>ℹ️ ChatGPT詳細形式（type:"morning_market_check"等）として自動変換しました。</div>
      {conversionInfo.missing.length>0 && <>
        <b style={{fontSize:12.5,color:"var(--inkSoft)"}}>以下は元のJSONに対応するキーが見つからなかったため空欄です：</b>
        <ul style={{margin:"6px 0 0",paddingLeft:18,fontSize:12,color:"var(--inkSoft)"}}>
          {conversionInfo.missing.map((m,i)=><li key={i}>{m}</li>)}
        </ul>
      </>}
    </div>}

    {parsed && <div className="card" style={{marginTop:12,padding:"12px 14px"}}>
      <b>プレビュー（保存前に内容を確認・修正できます）</b>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:10}}>
        <div><label style={labelStyle}>日付</label>
          <input style={fieldStyle} value={parsed.date||""} onChange={e=>setParsed(p=>({...p,date:e.target.value}))}/></div>
        <div><label style={labelStyle}>地合い（condition）</label>
          <input style={fieldStyle} value={parsed.market?.condition||""} onChange={e=>updateMarket("condition",e.target.value)}/></div>
        <div style={{gridColumn:"1 / -1"}}><label style={labelStyle}>市況サマリー</label>
          <input style={fieldStyle} value={parsed.market?.summary||""} onChange={e=>updateMarket("summary",e.target.value)}/></div>
        <div><label style={labelStyle}>強いセクター（カンマ区切り）</label>
          <input style={fieldStyle} value={(parsed.market?.strong_sectors||[]).join(", ")} onChange={e=>updateSectorList("strong_sectors",e.target.value)}/></div>
        <div><label style={labelStyle}>弱いセクター（カンマ区切り）</label>
          <input style={fieldStyle} value={(parsed.market?.weak_sectors||[]).join(", ")} onChange={e=>updateSectorList("weak_sectors",e.target.value)}/></div>
        <div style={{gridColumn:"1 / -1"}}><label style={labelStyle}>振り返り（review）</label>
          <textarea style={fieldStyle} rows={2} value={parsed.review||""} onChange={e=>setParsed(p=>({...p,review:e.target.value}))}/></div>
      </div>

      {(parsed.watchlist||[]).length>0 && <div style={{marginTop:14}}>
        <b style={{fontSize:12.5}}>ウォッチリスト</b>
        {(parsed.watchlist||[]).map((w,i)=><div key={i} style={{display:"grid",gridTemplateColumns:"70px 1fr 90px 1fr 24px",gap:6,marginTop:6,alignItems:"center"}}>
          <input style={fieldStyle} placeholder="コード" value={w.code||""} onChange={e=>updateWatchItem(i,"code",e.target.value)}/>
          <input style={fieldStyle} placeholder="銘柄名" value={w.name||""} onChange={e=>updateWatchItem(i,"name",e.target.value)}/>
          <input style={fieldStyle} placeholder="状態" value={w.status||""} onChange={e=>updateWatchItem(i,"status",e.target.value)}/>
          <input style={fieldStyle} placeholder="理由" value={w.reason||""} onChange={e=>updateWatchItem(i,"reason",e.target.value)}/>
          <button className="iconbtn" onClick={()=>removeWatchItem(i)}>×</button>
        </div>)}
      </div>}

      {(parsed.decisions||[]).length>0 && <div style={{marginTop:14}}>
        <b style={{fontSize:12.5}}>判断（decisions）</b>
        {(parsed.decisions||[]).map((d,i)=><div key={i} style={{border:"1px solid var(--ruleSoft)",borderRadius:4,padding:8,marginTop:6}}>
          <div style={{display:"grid",gridTemplateColumns:"70px 1fr 1fr 24px",gap:6,alignItems:"center"}}>
            <input style={fieldStyle} placeholder="コード" value={d.code||""} onChange={e=>updateDecisionItem(i,"code",e.target.value)}/>
            <input style={fieldStyle} placeholder="自分の判断" value={d.user_decision||""} onChange={e=>updateDecisionItem(i,"user_decision",e.target.value)}/>
            <input style={fieldStyle} placeholder="ChatGPTの判断" value={d.ai_decision||""} onChange={e=>updateDecisionItem(i,"ai_decision",e.target.value)}/>
            <button className="iconbtn" onClick={()=>removeDecisionItem(i)}>×</button>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginTop:6}}>
            <select style={fieldStyle} value={d.execution||""} onChange={e=>updateDecisionItem(i,"execution",e.target.value)}>
              <option value="">実行結果を選択</option>
              {CHATGPT_ALLOWED_EXECUTION.map(v=><option key={v} value={v}>{v}</option>)}
            </select>
            <input style={fieldStyle} placeholder="理由" value={d.reason||""} onChange={e=>updateDecisionItem(i,"reason",e.target.value)}/>
            <input style={fieldStyle} placeholder="心理状態" value={d.mental_state||""} onChange={e=>updateDecisionItem(i,"mental_state",e.target.value)}/>
          </div>
        </div>)}
      </div>}

      {(parsed.rule_updates||[]).length>0 && <div style={{marginTop:14}}>
        <b style={{fontSize:12.5}}>ルール更新（新規追加のみ・既存ルールの上書きはしません）</b>
        {(parsed.rule_updates||[]).map((r,i)=><div key={i} style={{display:"flex",gap:6,marginTop:6}}>
          <input style={fieldStyle} value={typeof r==="string"?r:(r.text||"")} onChange={e=>updateRuleUpdate(i,e.target.value)}/>
          <button className="iconbtn" onClick={()=>removeRuleUpdate(i)}>×</button>
        </div>)}
      </div>}

      <div style={{marginTop:14,display:"flex",gap:8,alignItems:"center"}}>
        <button className="action-btn" disabled={saving} onClick={()=>save(false)}>NEONへ保存</button>
        {saving && <span style={{fontSize:12,color:"var(--inkFaint)"}}>保存中…</span>}
      </div>
    </div>}

    {dupInfo && <div className="card" style={{marginTop:12,padding:"10px 14px",border:"1px solid var(--rule)"}}>
      <div style={{fontSize:12.5}}>{dupInfo.error}</div>
      <button className="action-btn" style={{marginTop:8}} disabled={saving} onClick={()=>save(true)}>それでも保存する（重複を許可）</button>
    </div>}

    {saveMsg && <div style={{marginTop:10,fontSize:12.5,whiteSpace:"pre-wrap"}}>{saveMsg}</div>}

    <div style={{marginTop:20}}>
      <div className="sec-head" style={{fontSize:13}}>取り込み履歴</div>
      {loadingImports
        ? <div style={{fontSize:12,color:"var(--inkFaint)"}}>読み込み中…</div>
        : imports.length===0
          ? <div style={{fontSize:12,color:"var(--inkFaint)"}}>まだ取り込みはありません</div>
          : <div style={{display:"flex",flexDirection:"column",gap:4,marginTop:6}}>
              {imports.map(im=><div key={im.id} style={{fontSize:12,padding:"4px 8px",border:"1px solid var(--ruleSoft)",borderRadius:3}}>
                <span className="mono">{im.import_date}</span> に取り込み（daily_log ID {im.daily_log_id}）
              </div>)}
            </div>}
    </div>
  </div>;
}

// v3-9続き（2026-09-05・PHASE 6 DAILY CHATGPT JSON IMPORT）：上のChatGptImportPanel（投資ログ
// 形式・kind='TRADING_LOG'）とは別の用途。ChatGPTとの日々のTrade Cockpit相談内容の要約
// （summary/trading_observations/app_changes/bugs_or_risks/new_rules_or_preferences/updates/
// claude_code_instruction）を貼り付けてimportする。Import（履歴保存）とApply Updates（差分の
//明示適用）を分離し、updates=[]の場合はinvestment_rules等に一切書き込まない
// （ユーザー指定の最重要ルール）。
const CHATGPT_DAILY_SAMPLE=`{
  "date": "${(()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");})()}",
  "summary": ["地合いは軟調、押し目待ちの銘柄が多い"],
  "trading_observations": ["半導体セクターは決算前で様子見ムード"],
  "app_changes": [],
  "bugs_or_risks": [],
  "new_rules_or_preferences": [],
  "updates": [],
  "claude_code_instruction": ""
}`;
function validateDailyDigestPayload(obj){
  const errs=[];
  if(typeof obj!=="object"||obj===null||Array.isArray(obj)){errs.push("JSONのトップレベルはオブジェクトである必要があります");return errs;}
  if(!obj.date||!/^\d{4}-\d{2}-\d{2}$/.test(obj.date))errs.push("date は YYYY-MM-DD 形式の文字列で必須です");
  ["summary","trading_observations","app_changes","bugs_or_risks","new_rules_or_preferences","updates"].forEach(k=>{
    if(obj[k]!=null&&!Array.isArray(obj[k]))errs.push(`${k} は配列である必要があります`);
  });
  if(obj.claude_code_instruction!=null&&typeof obj.claude_code_instruction!=="string")errs.push("claude_code_instruction は文字列である必要があります");
  (obj.updates||[]).forEach((u,i)=>{
    if(!u||typeof u!=="object"){errs.push(`updates[${i}] はオブジェクトである必要があります`);return;}
    if(!u.target)errs.push(`updates[${i}] に target がありません`);
    if(!["add","update","remove"].includes(u.change_type))errs.push(`updates[${i}].change_type は add|update|remove のいずれかである必要があります（値: ${u.change_type}）`);
  });
  return errs;
}
const DIFF_STATUS_META={
  NO_CHANGE:{label:"差分なし",color:"var(--inkFaint)"},
  ADD_CANDIDATE:{label:"ADD候補",color:"var(--accent)"},
  DIFF:{label:"差分あり",color:"var(--up)"},
  WARNING_PROTECTED:{label:"⚠ 保護ルール",color:"var(--down)"},
  UNSUPPORTED_TARGET:{label:"手動対応が必要",color:"var(--inkSoft)"},
};
function ChatGptDailyImportPanel(){
  const [rawText,setRawText]=useState("");
  const [parsed,setParsed]=useState(null);
  const [parseErrors,setParseErrors]=useState([]);
  const [importing,setImporting]=useState(false);
  const [importMsg,setImportMsg]=useState("");
  const [dupInfo,setDupInfo]=useState(null);
  const [imports,setImports]=useState([]);
  const [loadingImports,setLoadingImports]=useState(true);
  const [previews,setPreviews]=useState({}); // importId -> [diff,...]
  const [previewLoading,setPreviewLoading]=useState(null);
  const [applyMsg,setApplyMsg]=useState({}); // importId -> message

  const loadImports=async()=>{
    setLoadingImports(true);
    try{
      const r=await fetch("/api/chatgpt-daily/list");
      if(r.ok){const d=await r.json();setImports(Array.isArray(d.imports)?d.imports:[]);}
    }catch(e){}
    setLoadingImports(false);
  };
  useEffect(()=>{loadImports();},[]);

  const parse=()=>{
    setImportMsg("");setDupInfo(null);
    let obj;
    try{ obj=JSON.parse(rawText); }
    catch(e){ setParsed(null);setParseErrors(["JSONとして正しくありません: "+e.message]);return; }
    const errs=validateDailyDigestPayload(obj);
    setParseErrors(errs);
    setParsed(errs.length===0?obj:null);
  };

  const doImport=async(force)=>{
    setImporting(true);setImportMsg("");setDupInfo(null);
    try{
      const r=await fetch("/api/chatgpt-daily/import",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({payload:parsed,force:!!force})});
      const d=await r.json();
      if(d.errors){setImportMsg("取り込み失敗：\n・"+d.errors.join("\n・"));}
      else if(d.error){setDupInfo(d);}
      else{
        setImportMsg(`取り込みました（import ID ${d.importId}・updates ${d.updatesCount}件・状態 ${d.applyStatus}）`+
          (d.applyStatus==="NO_UPDATES"?"　→ ルール変更はありません。":"　→ 下の履歴からDiff Previewを確認してください。"));
        setRawText("");setParsed(null);setParseErrors([]);loadImports();
      }
    }catch(e){setImportMsg("取り込みに失敗しました。サーバーが起動しているか確認してください。");}
    setImporting(false);
  };

  const loadPreview=async(importId)=>{
    setPreviewLoading(importId);
    try{
      const r=await fetch(`/api/chatgpt-daily/preview?id=${importId}`);
      if(r.ok){const d=await r.json();setPreviews(p=>({...p,[importId]:d.preview||[]}));}
    }catch(e){}
    setPreviewLoading(null);
  };

  const applyUpdates=async(importId)=>{
    if(!confirm("差分プレビューで確認した内容をマイルールへ適用します。よろしいですか？"))return;
    setApplyMsg(m=>({...m,[importId]:"適用中…"}));
    try{
      const r=await fetch("/api/chatgpt-daily/apply",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({importId})});
      const d=await r.json();
      if(d.error){setApplyMsg(m=>({...m,[importId]:"エラー: "+d.error}));}
      else{
        const applied=(d.results||[]).filter(x=>x.outcome==="APPLIED").length;
        const skipped=(d.results||[]).filter(x=>x.outcome==="SKIPPED").length;
        const failed=(d.results||[]).filter(x=>x.outcome==="FAILED").length;
        setApplyMsg(m=>({...m,[importId]:`適用完了：状態 ${d.applyStatus}（適用${applied}件・スキップ${skipped}件・失敗${failed}件）`}));
        setPreviews(p=>({...p,[importId]:d.results||[]}));
        loadImports();
      }
    }catch(e){setApplyMsg(m=>({...m,[importId]:"通信エラー"}));}
  };

  const fieldStyle={width:"100%",fontSize:12,padding:8,border:"1px solid var(--rule)",borderRadius:3,background:"var(--bg)",color:"var(--ink)",fontFamily:"monospace",boxSizing:"border-box"};

  return <div style={{marginTop:24,paddingTop:18,borderTop:"1px solid var(--ruleSoft)"}}>
    <div className="sec-head">ChatGPT日次JSON</div>
    <div className="sec-note" style={{fontSize:11}}>※ importのみでは何も変更されません。「Apply Updates」を押した時だけマイルールへ反映します。</div>

    <div style={{marginTop:12}}>
      <label style={{fontSize:11,color:"var(--inkSoft)",display:"block",marginBottom:2}}>ChatGPTが出力した日次JSON
        <button className="action-btn" style={{marginLeft:8,fontSize:11}} onClick={()=>setRawText(CHATGPT_DAILY_SAMPLE)}>サンプルを入力</button>
      </label>
      <textarea value={rawText} onChange={e=>setRawText(e.target.value)} rows={10} placeholder='{"date":"2026-09-05", "summary":[], ...}' style={fieldStyle}/>
      <button className="action-btn" style={{marginTop:8}} onClick={parse} disabled={!rawText.trim()}>解析</button>
    </div>

    {parseErrors.length>0 && <div className="card" style={{marginTop:12,padding:"10px 14px",border:"1px solid var(--down)"}}>
      <b style={{color:"var(--down)"}}>入力内容にエラーがあります：</b>
      <ul style={{margin:"6px 0 0",paddingLeft:18,fontSize:12.5,color:"var(--down)"}}>
        {parseErrors.map((e,i)=><li key={i}>{e}</li>)}
      </ul>
    </div>}

    {parsed && <div className="card" style={{marginTop:12,padding:"12px 14px"}}>
      <b>プレビュー（{parsed.date}）</b>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:8,fontSize:12}}>
        <div>Summary：{(parsed.summary||[]).length}件</div>
        <div>Trading observations：{(parsed.trading_observations||[]).length}件</div>
        <div>App changes：{(parsed.app_changes||[]).length}件</div>
        <div>Bugs / risks：{(parsed.bugs_or_risks||[]).length}件</div>
        <div>New rules / preferences：{(parsed.new_rules_or_preferences||[]).length}件</div>
        <div style={{fontWeight:700}}>Updates：{(parsed.updates||[]).length}件{(parsed.updates||[]).length===0?"　✅ ルール変更なし":"　⚠ 差分確認が必要"}</div>
      </div>
      {parsed.claude_code_instruction && <div style={{marginTop:8,fontSize:12,color:"var(--inkSoft)"}}>
        Claude Codeへの変更指示（履歴保存のみ・自動実行しません）：{parsed.claude_code_instruction}
      </div>}
      {(parsed.updates||[]).length>0 && <div style={{marginTop:10}}>
        <b style={{fontSize:12.5}}>updates（保存後、履歴のDiff Previewで既存値と比較できます）</b>
        <ul style={{margin:"6px 0 0",paddingLeft:18,fontSize:12}}>
          {parsed.updates.map((u,i)=><li key={i}>{u.target}（{u.change_type}）：{u.instruction||u.reason||""}</li>)}
        </ul>
      </div>}
      <div style={{marginTop:14,display:"flex",gap:8,alignItems:"center"}}>
        <button className="action-btn" disabled={importing} onClick={()=>doImport(false)}>NEONへ取り込み（履歴保存のみ）</button>
        {importing && <span style={{fontSize:12,color:"var(--inkFaint)"}}>取り込み中…</span>}
      </div>
    </div>}

    {dupInfo && <div className="card" style={{marginTop:12,padding:"10px 14px",border:"1px solid var(--rule)"}}>
      <div style={{fontSize:12.5}}>{dupInfo.error}</div>
      <button className="action-btn" style={{marginTop:8}} disabled={importing} onClick={()=>doImport(true)}>それでも保存する（重複を許可）</button>
    </div>}

    {importMsg && <div style={{marginTop:10,fontSize:12.5,whiteSpace:"pre-wrap"}}>{importMsg}</div>}

    <div style={{marginTop:20}}>
      <div className="sec-head" style={{fontSize:13}}>取り込み履歴</div>
      {loadingImports
        ? <div style={{fontSize:12,color:"var(--inkFaint)"}}>読み込み中…</div>
        : imports.length===0
          ? <div style={{fontSize:12,color:"var(--inkFaint)"}}>まだ取り込みはありません</div>
          : <div style={{display:"flex",flexDirection:"column",gap:8,marginTop:6}}>
              {imports.map(im=>{
                const updatesCount=(im.updates||[]).length;
                const preview=previews[im.id];
                return <div key={im.id} style={{fontSize:12,padding:"8px 10px",border:"1px solid var(--ruleSoft)",borderRadius:4}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                    <span className="mono" style={{fontWeight:700}}>{im.import_date}</span>
                    <span style={{color:"var(--inkFaint)"}}>Summary{(im.summary||[]).length}／Obs{(im.trading_observations||[]).length}／
                      App{(im.app_changes||[]).length}／Bugs{(im.bugs_or_risks||[]).length}／Rules案{(im.new_rules_or_preferences||[]).length}</span>
                    <span style={{fontWeight:700}}>updates {updatesCount}件</span>
                    <span style={{fontSize:10.5,color:"var(--inkFaint)",border:"1px solid var(--rule)",borderRadius:3,padding:"1px 5px"}}>{im.apply_status}</span>
                    {updatesCount>0 && <button className="iconbtn" style={{marginLeft:"auto"}} onClick={()=>loadPreview(im.id)}>
                      {previewLoading===im.id?"確認中…":"Diff Preview"}
                    </button>}
                  </div>
                  {im.claude_code_instruction && <div style={{marginTop:4,color:"var(--inkSoft)"}}>指示メモ：{im.claude_code_instruction}</div>}
                  {preview && <div style={{marginTop:8,display:"flex",flexDirection:"column",gap:6}}>
                    {preview.length===0
                      ? <div style={{color:"var(--inkFaint)"}}>updatesはありません。</div>
                      : preview.map((d,i)=>{
                          const meta=DIFF_STATUS_META[d.status]||{label:d.status,color:"var(--inkSoft)"};
                          return <div key={i} style={{border:"1px solid var(--rule)",borderRadius:3,padding:"6px 8px",background:"var(--card)"}}>
                            <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
                              <span className="mono">{d.target}</span>
                              <span style={{color:"var(--inkFaint)"}}>{d.change_type}</span>
                              <span style={{color:meta.color,fontWeight:700}}>{meta.label}</span>
                            </div>
                            <div style={{marginTop:4,color:"var(--inkSoft)"}}>
                              現在：{d.current?`${d.current.text||"—"}${d.current.value!=null?`（${d.current.value}${d.current.unit||""}）`:""}`:"（未登録）"}
                              　→　提案：{d.proposed?.text||"—"}{d.proposed?.value!=null?`（${d.proposed.value}${d.proposed.unit||""}）`:""}
                            </div>
                            {d.reason && <div style={{color:"var(--inkFaint)"}}>理由：{d.reason}</div>}
                            {d.note && <div style={{color:"var(--inkFaint)"}}>{d.note}</div>}
                            {d.outcome && <div style={{color:"var(--inkFaint)"}}>結果：{d.outcome}{d.error?`（${d.error}）`:""}</div>}
                          </div>;
                        })}
                    {preview.some(d=>d.status==="DIFF"||d.status==="ADD_CANDIDATE") &&
                      <button className="action-btn" onClick={()=>applyUpdates(im.id)}>Apply Updates（差分だけ適用）</button>}
                    {applyMsg[im.id] && <div style={{color:"var(--inkSoft)"}}>{applyMsg[im.id]}</div>}
                  </div>}
                </div>;
              })}
            </div>}
    </div>
  </div>;
}

// 監視銘柄インポート（Trade Cockpit v3 Phase5・設計案66-76番）：普段ChatGPTへ証券アプリの
// スクリーンショットを共有しているユーザー向けに、ChatGPTが認識した銘柄一覧のJSONを貼り付けて
// 一括登録できるようにする。画像解析はTrade Cockpit側では一切行わない（AI不使用の原則を維持）。
// 実watchlist本体は既存アーキテクチャ通りブラウザ側（s.watchlist）が正、Neon側は
// 取り込み履歴・重複防止（watchlist_imports）専用。stock_codeをキーにmasterJPと照合して
// 正規化し、不明コードは勝手に登録せずUNKNOWN表示にする（設計案72番）。
const WATCHLIST_IMPORT_SAMPLE=`{
  "type": "watchlist_import",
  "date": "${(()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");})()}",
  "source": "chatgpt_screenshot",
  "stocks": [
    {"code":"9107","name":"川崎汽船"},
    {"code":"1605","name":"INPEX"},
    {"code":"7203","name":"トヨタ自動車"}
  ]
}`;
function WatchlistImportPanel({watchlist,setWatchlist,masterJP}){
  const [rawText,setRawText]=useState("");
  const [parsed,setParsed]=useState(null);
  const [parseErrors,setParseErrors]=useState([]);
  const [mode,setMode]=useState("add_only");
  const [applyMsg,setApplyMsg]=useState("");
  const [dupInfo,setDupInfo]=useState(null);

  const parse=()=>{
    setApplyMsg("");setDupInfo(null);
    let obj;
    try{ obj=JSON.parse(rawText); }
    catch(e){ setParsed(null);setParseErrors(["JSONとして正しくありません: "+e.message]);return; }
    const errs=[];
    if(typeof obj!=="object"||obj===null||!Array.isArray(obj.stocks))errs.push("stocks配列が必要です");
    (obj.stocks||[]).forEach((s,i)=>{if(!s||!s.code)errs.push(`stocks[${i}]にcodeがありません`);});
    if(obj.remove!=null&&!Array.isArray(obj.remove))errs.push("removeは配列である必要があります");
    setParseErrors(errs);
    setParsed(errs.length===0?obj:null);
  };

  // stock_codeでmasterJPと照合して名称・セクターを正規化。不明コードはUNKNOWN扱い（勝手に登録しない）。
  const normalized=useMemo(()=>{
    if(!parsed)return [];
    return parsed.stocks.map(s=>{
      const m=masterJP.find(x=>x.code===s.code);
      return m?{code:s.code,name:m.name,sector:m.sector,kana:m.kana,tvSymbol:m.tvSymbol,known:true}
        :{code:s.code,name:s.name||"UNKNOWN",sector:null,known:false};
    });
  },[parsed,masterJP]);

  const currentCodes=useMemo(()=>new Set(watchlist.map(w=>w.code)),[watchlist]);
  const newOnes=useMemo(()=>normalized.filter(s=>!currentCodes.has(s.code)),[normalized,currentCodes]);
  const alreadyIn=useMemo(()=>normalized.filter(s=>currentCodes.has(s.code)),[normalized,currentCodes]);
  const importedCodes=useMemo(()=>new Set(normalized.map(s=>s.code)),[normalized]);
  const missingFromJson=useMemo(()=>watchlist.filter(w=>!importedCodes.has(w.code)),[watchlist,importedCodes]);
  const removeCodes=useMemo(()=>new Set(parsed?.remove||[]),[parsed]);

  const apply=async()=>{
    if(mode==="full_sync"&&missingFromJson.length>0){
      if(!confirm(`完全同期を実行すると、今回のJSONに含まれない${missingFromJson.length}銘柄が監視リストから削除されます。よろしいですか？`))return;
    }
    let next=[...watchlist];
    // 新規追加分（不明コードUNKNOWNも、ユーザーが後でテーマ等を編集できるようそのまま追加はする。
    // ただしセクターが不明なため33業種フィルタには乗らない旨をプレビューで案内済み）
    newOnes.forEach(s=>{
      next.push({id:s.code,code:s.code,name:s.name,sector:s.sector||SECTOR_CHOICES[0],market:"JP",
        tvSymbol:s.tvSymbol||("TSE:"+s.code),watch:"通常",note:"",theme:""});
    });
    if(mode==="diff"){
      next=next.filter(w=>!removeCodes.has(w.code));
    }else if(mode==="full_sync"){
      next=next.filter(w=>importedCodes.has(w.code));
    }
    setWatchlist(next);
    const addedCount=newOnes.length;
    try{
      const r=await fetch("/api/watchlist-import/save",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({payload:parsed,mode,addedCount})});
      const d=await r.json();
      if(d.error){setDupInfo(d);}
      else{setApplyMsg(`適用しました（新規${addedCount}件${mode==="full_sync"?`・削除${missingFromJson.length}件`:""}）`);setRawText("");setParsed(null);}
    }catch(e){setApplyMsg("履歴の保存に失敗しましたが、監視銘柄への反映は完了しています。");}
  };
  const applyForce=async()=>{
    setDupInfo(null);
    try{
      await fetch("/api/watchlist-import/save",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({payload:parsed,mode,addedCount:newOnes.length,force:true})});
    }catch(e){}
    setApplyMsg("（重複を許可して）履歴を保存しました。監視銘柄は既に反映済みです。");
  };

  const fieldStyle={width:"100%",fontSize:12.5,padding:"5px 7px",border:"1px solid var(--rule)",borderRadius:3,background:"var(--bg)",color:"var(--ink)",boxSizing:"border-box"};

  // v3 Phase5（設計案74番）：逆方向のコピー。現在の監視銘柄一覧をChatGPTへ簡単に共有できるようにする。
  const [copyMsg,setCopyMsg]=useState("");
  const copyCurrentWatchlist=async()=>{
    const lines=[`【Trade Cockpit 監視銘柄】${new Date().toLocaleString("ja-JP")}（${watchlist.length}件）`,""];
    watchlist.forEach(w=>lines.push(`${w.code} ${w.name}（${w.sector||"—"}）`));
    const ok=await copyText(lines.join("\n"));
    setCopyMsg(ok?"コピーしました":"コピーに失敗しました");
    setTimeout(()=>setCopyMsg(""),2500);
  };

  return <div style={{marginTop:24,paddingTop:20,borderTop:"1px solid var(--rule)"}}>
    <div className="sec-head">監視銘柄インポート（ChatGPTスクリーンショット認識結果）</div>
    <div style={{marginTop:8,display:"flex",alignItems:"center",gap:8}}>
      <button className="action-btn" onClick={copyCurrentWatchlist}>現在の監視銘柄をChatGPT用にコピー（{watchlist.length}件）</button>
      {copyMsg && <span style={{fontSize:11,color:"var(--inkSoft)"}}>{copyMsg}</span>}
    </div>
    <div style={{marginTop:10}}>
      <label style={{fontSize:11,color:"var(--inkSoft)",display:"block",marginBottom:2}}>ChatGPTが出力したJSON
        <button className="action-btn" style={{marginLeft:8,fontSize:11}} onClick={()=>setRawText(WATCHLIST_IMPORT_SAMPLE)}>サンプルを入力</button>
      </label>
      <textarea value={rawText} onChange={e=>setRawText(e.target.value)} rows={8} placeholder='{"type":"watchlist_import","stocks":[{"code":"9107","name":"川崎汽船"}]}'
        style={{...fieldStyle,fontFamily:"monospace",fontSize:12}}/>
      <button className="action-btn" style={{marginTop:8}} onClick={parse} disabled={!rawText.trim()}>解析</button>
    </div>

    {parseErrors.length>0 && <div className="card" style={{marginTop:12,padding:"10px 14px",border:"1px solid var(--down)"}}>
      <b style={{color:"var(--down)"}}>入力内容にエラーがあります：</b>
      <ul style={{margin:"6px 0 0",paddingLeft:18,fontSize:12.5,color:"var(--down)"}}>{parseErrors.map((e,i)=><li key={i}>{e}</li>)}</ul>
    </div>}

    {parsed && <div className="card" style={{marginTop:12,padding:"12px 14px"}}>
      <b>差分プレビュー</b>
      <div style={{marginTop:10}}>
        {newOnes.length>0 && <div style={{marginBottom:8}}>
          <div style={{fontSize:11.5,color:"var(--inkSoft)",marginBottom:4}}>新規追加（{newOnes.length}件）</div>
          {newOnes.map(s=><div key={s.code} style={{fontSize:12.5}}>+ {s.code} {s.name}{!s.known&&<span style={{color:"var(--down)",marginLeft:6}}>（UNKNOWN：銘柄マスタに一致なし）</span>}</div>)}
        </div>}
        {alreadyIn.length>0 && <div style={{marginBottom:8}}>
          <div style={{fontSize:11.5,color:"var(--inkSoft)",marginBottom:4}}>登録済み（{alreadyIn.length}件、変更なし）</div>
          {alreadyIn.map(s=><div key={s.code} style={{fontSize:12.5,color:"var(--inkFaint)"}}>= {s.code} {s.name}</div>)}
        </div>}
        {missingFromJson.length>0 && <div>
          <div style={{fontSize:11.5,color:"var(--inkSoft)",marginBottom:4}}>現在アプリにあるが今回JSONにない（{missingFromJson.length}件）</div>
          {missingFromJson.slice(0,20).map(w=><div key={w.code} style={{fontSize:12.5,color:"var(--inkFaint)"}}>{w.code} {w.name}</div>)}
          {missingFromJson.length>20 && <div style={{fontSize:11.5,color:"var(--inkFaint)"}}>…他{missingFromJson.length-20}件</div>}
        </div>}
      </div>

      <div style={{marginTop:12,display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        <label style={{fontSize:12}}>同期モード：
          <select value={mode} onChange={e=>setMode(e.target.value)} style={{fontSize:12,marginLeft:6}}>
            <option value="add_only">追加のみ（既定・既存銘柄は削除しない）</option>
            <option value="diff">差分更新（JSONのremove配列で明示された銘柄のみ削除）</option>
            <option value="full_sync">完全同期（JSONに無い銘柄はすべて削除・要確認）</option>
          </select>
        </label>
      </div>
      <button className="action-btn" style={{marginTop:10}} onClick={apply}>この内容を監視銘柄に適用</button>
      {applyMsg && <span style={{marginLeft:8,fontSize:12,color:"var(--inkSoft)"}}>{applyMsg}</span>}
    </div>}

    {dupInfo && <div className="card" style={{marginTop:12,padding:"10px 14px",border:"1px solid var(--rule)"}}>
      <div style={{fontSize:12.5}}>{dupInfo.error}（監視銘柄への反映自体は完了しています。履歴だけ重複登録するかの確認です）</div>
      <button className="action-btn" style={{marginTop:8}} onClick={applyForce}>履歴だけ重複を許可して保存する</button>
    </div>}
  </div>;
}

// 統計ダッシュボード（Trade Cockpit v2 Phase8・設計案52-60番）。有料AI APIは使わずSQL集計のみ
// （server.py investment_db.get_stats()参照）。データが少ないうちは件数が小さく出るのは想定通り
// （個人利用でこれから蓄積していく前提）。
function StatsPanel(){
  const [stats,setStats]=useState(null);
  const [loading,setLoading]=useState(true);
  const load=async()=>{
    setLoading(true);
    try{
      const r=await fetch("/api/stats");
      if(r.ok)setStats(await r.json());
    }catch(e){}
    setLoading(false);
  };
  useEffect(()=>{load();},[]);

  const card={border:"1px solid var(--rule)",borderRadius:4,background:"var(--card)",padding:"12px 14px"};
  const rowsFromDict=(d)=>Object.entries(d||{}).sort((a,b)=>b[1]-a[1]);

  return <div style={{marginTop:18}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
      <div className="sec-head">統計ダッシュボード</div>
      <button className="action-btn" onClick={load} disabled={loading}>{loading?"更新中…":"更新"}</button>
    </div>
    <div className="sec-note">投資判断ログ・売買記録から自動集計します（AI不使用、SQL集計のみ）。データが少ないうちは件数が小さいのは正常です。</div>

    {loading
      ? <div style={{fontSize:12,color:"var(--inkFaint)",marginTop:10}}>読み込み中…</div>
      : !stats||stats.error
        ? <div style={{fontSize:12,color:"var(--inkFaint)",marginTop:10}}>{stats?.error||"データを取得できませんでした"}</div>
        : <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",gap:12,marginTop:12}}>
            <div style={card}>
              <div style={{fontWeight:700,marginBottom:8}}>売買記録（journal）</div>
              <div style={{fontSize:24,fontWeight:800}}>{stats.journal.total}<span style={{fontSize:12,fontWeight:400,color:"var(--inkSoft)"}}> 件</span></div>
              {stats.journal.winRate!=null && <div style={{fontSize:13,marginTop:4}}>勝率 <b>{stats.journal.winRate}%</b>（成功/(成功+失敗+引分)、未定は除く）</div>}
              <div style={{marginTop:8,display:"flex",flexWrap:"wrap",gap:4}}>
                {rowsFromDict(stats.journal.byResult).map(([k,v])=><span key={k} className="chip" style={{fontSize:11}}>{k} {v}</span>)}
              </div>
            </div>

            <div style={card}>
              <div style={{fontWeight:700,marginBottom:8}}>銘柄評価（投資判断ログ）</div>
              <div style={{fontSize:24,fontWeight:800}}>{stats.judgments.total}<span style={{fontSize:12,fontWeight:400,color:"var(--inkSoft)"}}> 件</span></div>
              {stats.judgments.decisionAgreement.rate!=null &&
                <div style={{fontSize:13,marginTop:4}}>自分とChatGPTの判断一致率 <b>{stats.judgments.decisionAgreement.rate}%</b>
                  （一致{stats.judgments.decisionAgreement.agree}／不一致{stats.judgments.decisionAgreement.disagree}）</div>}
              <div style={{marginTop:8}}>
                <div style={{fontSize:11,color:"var(--inkSoft)",marginBottom:2}}>実行結果別</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                  {rowsFromDict(stats.judgments.byExecutionStatus).map(([k,v])=><span key={k} className="chip" style={{fontSize:11}}>{k} {v}</span>)}
                </div>
              </div>
              {Object.keys(stats.judgments.byMentalState||{}).length>0 && <div style={{marginTop:8}}>
                <div style={{fontSize:11,color:"var(--inkSoft)",marginBottom:2}}>心理状態別</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                  {rowsFromDict(stats.judgments.byMentalState).map(([k,v])=><span key={k} className="chip" style={{fontSize:11}}>{k} {v}</span>)}
                </div>
              </div>}
            </div>

            <div style={card}>
              <div style={{fontWeight:700,marginBottom:8}}>今日の候補（trade_candidates）累計</div>
              <div style={{fontSize:24,fontWeight:800}}>{stats.candidates.total}<span style={{fontSize:12,fontWeight:400,color:"var(--inkSoft)"}}> 件</span></div>
              {stats.candidates.avgRsScore!=null && <div style={{fontSize:13,marginTop:4}}>平均RS Score <b>{stats.candidates.avgRsScore}</b></div>}
              <div style={{marginTop:8,display:"flex",flexWrap:"wrap",gap:4}}>
                {rowsFromDict(stats.candidates.byStatus).map(([k,v])=><span key={k} className="chip" style={{fontSize:11}}>{TRADE_CANDIDATE_STATUS_OPTIONS.find(o=>o.value===k)?.label||k} {v}</span>)}
              </div>
              {Object.values(stats.candidates.byRsBucket||{}).some(v=>v>0) && <div style={{marginTop:8}}>
                <div style={{fontSize:11,color:"var(--inkSoft)",marginBottom:2}}>RS Score帯別（v3設計案81番：全面安で強い銘柄を狙う戦略の検証用）</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                  {["90+","75-89","50-74","25-49","<25"].map(k=><span key={k} className="chip" style={{fontSize:11}}>{k} {stats.candidates.byRsBucket[k]||0}</span>)}
                </div>
              </div>}
              {Object.keys(stats.candidates.bySector||{}).length>0 && <div style={{marginTop:8}}>
                <div style={{fontSize:11,color:"var(--inkSoft)",marginBottom:2}}>セクター別（2026-09-02以降に保存した候補のみ集計。それ以前はUNKNOWN）</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                  {rowsFromDict(stats.candidates.bySector).map(([k,v])=><span key={k} className="chip" style={{fontSize:11}}>{k} {v}</span>)}
                </div>
              </div>}
            </div>

            <div style={{...card,gridColumn:"1 / -1"}}>
              <div style={{fontSize:11.5,color:"var(--inkFaint)"}}>ℹ️ {stats.note}</div>
            </div>
          </div>}
  </div>;
}

// ============================================================
// 2026-09-09新規（ルール学習システム）：「記録」グループの新規サブタブ「ルール」。
// 既存のinvestment_rules（/api/rules、単純な自由テキストのマイルール一覧）とは別の新テーブル
// trade_rulesを表示する。「蓄積→照合→検証→昇格/修正/弱体化→次回分析へ反映」の循環そのものを
// 操作できる画面（指示書10・11・16〜18・20番）。
// ============================================================
const TRADE_RULE_STATUS_META={
  ACTIVE:{label:"ACTIVE",color:"var(--up)"},
  TESTING:{label:"TESTING",color:"var(--accent)"},
  REVISED:{label:"REVISED",color:"var(--inkSoft)"},
  RETIRED:{label:"RETIRED",color:"var(--inkFaint)"},
  EXPIRED:{label:"EXPIRED",color:"var(--inkFaint)"},
};
const TRADE_RULE_CONFIDENCE_META={
  HIGH:{icon:"🟢",label:"HIGH",color:"var(--up)"},
  MEDIUM:{icon:"🟡",label:"MEDIUM",color:"var(--accent)"},
  LOW:{icon:"⚪",label:"LOW",color:"var(--inkFaint)"},
};
const TRADE_RULE_EVAL_OPTIONS=[
  {value:"SUPPORTED",label:"✅ SUPPORTED（支持された）"},
  {value:"FAILED",label:"❌ FAILED（逆効果だった）"},
  {value:"NEUTRAL",label:"➖ NEUTRAL（判定不能）"},
  {value:"NOT_APPLICABLE",label:"— NOT_APPLICABLE（条件不発生）"},
];
const TRADE_RULE_STATUS_OPTIONS=["TESTING","ACTIVE","REVISED","RETIRED"];
const TRADE_RULE_CONFIDENCE_OPTIONS=["LOW","MEDIUM","HIGH"];

// ルール1件の詳細（履歴・手動操作）。TradeRulesPanel内から行クリックで開く。
function TradeRuleDetail({ruleId,onChanged,onClose}){
  const [rule,setRule]=useState(null);
  const [loading,setLoading]=useState(true);
  const [evalDate,setEvalDate]=useState(todayISO());
  const [evalNote,setEvalNote]=useState("");
  const [busy,setBusy]=useState(false);
  const [editText,setEditText]=useState("");
  const [editAction,setEditAction]=useState("");
  const [editExceptions,setEditExceptions]=useState("");
  const [reviseText,setReviseText]=useState("");
  const [msg,setMsg]=useState("");

  const load=async()=>{
    setLoading(true);
    const d=await fetchJsonSafe(`/api/trade-rules/detail?id=${ruleId}`);
    if(d&&d.rule){
      setRule(d.rule);
      setEditText(d.rule.rule_text||"");
      setEditAction(d.rule.action_text||"");
      setEditExceptions((d.rule.exceptions_json||[]).join("\n"));
    }
    setLoading(false);
  };
  useEffect(()=>{load();},[ruleId]);

  const doEvaluate=async(evalResult)=>{
    setBusy(true);setMsg("");
    const d=await fetchJsonSafe("/api/trade-rules/evaluate",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id:ruleId,evalResult,evalDate,note:evalNote||null})});
    setBusy(false);
    if(d&&d.newStatus){
      setMsg(`記録しました（${d.newStatus}/${d.newConfidence}${d.promotionReason?"："+d.promotionReason:""}）`);
      setEvalNote("");
      load();onChanged&&onChanged();
    }else setMsg("記録に失敗しました");
  };
  const doUpdate=async(fields,reason)=>{
    setBusy(true);setMsg("");
    const d=await fetchJsonSafe("/api/trade-rules/update",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id:ruleId,fields,reason})});
    setBusy(false);
    if(d&&d.ok){setMsg("更新しました");load();onChanged&&onChanged();}
    else setMsg("更新に失敗しました");
  };
  const doRevise=async()=>{
    if(!reviseText.trim())return;
    setBusy(true);setMsg("");
    const d=await fetchJsonSafe("/api/trade-rules/revise",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({parentId:ruleId,newRuleText:reviseText.trim(),reason:"手動修正"})});
    setBusy(false);
    if(d&&d.id){setMsg("修正版ルールを作成しました（このルールはREVISEDになりました）");setReviseText("");load();onChanged&&onChanged();}
    else setMsg("修正版の作成に失敗しました");
  };

  if(loading)return <div style={{padding:16,fontSize:12,color:"var(--inkSoft)"}}>読み込み中…</div>;
  if(!rule)return <div style={{padding:16,fontSize:12,color:"var(--inkSoft)"}}>ルールが見つかりませんでした。</div>;
  const sm=TRADE_RULE_STATUS_META[rule.status]||{label:rule.status,color:"var(--ink)"};
  const cm=TRADE_RULE_CONFIDENCE_META[rule.confidence]||{icon:"",label:rule.confidence,color:"var(--ink)"};

  return <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.4)",zIndex:60,display:"flex",
      alignItems:"center",justifyContent:"center",padding:12}} onClick={onClose}>
    <div style={{background:"var(--card)",borderRadius:8,padding:16,maxWidth:640,width:"100%",
        maxHeight:"88vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
        <div style={{fontSize:14,fontWeight:800,lineHeight:1.5}}>{rule.rule_text}</div>
        <button className="iconbtn" onClick={onClose}>×</button>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:6,marginTop:8}}>
        <span className="chip" style={{color:sm.color,fontWeight:700}}>{sm.label}</span>
        <span className="chip" style={{color:cm.color,fontWeight:700}}>{cm.icon} {cm.label}</span>
        <span className="chip">{rule.category||"—"}</span>
        <span className="chip">{rule.scope||"—"}</span>
        <span className="chip">{rule.rule_type}</span>
        {rule.expires_date && <span className="chip">期限 {rule.expires_date}</span>}
      </div>
      <div style={{fontSize:12,color:"var(--inkSoft)",marginTop:8,display:"grid",gridTemplateColumns:"1fr 1fr",gap:4}}>
        <div>検証回数：{rule.total_evaluations}件（支持{rule.success_count}・失敗{rule.failure_count}・判定不能{rule.neutral_count}）</div>
        <div>成功率：{rule.success_rate!=null?(rule.success_rate*100).toFixed(0)+"%":"—"}</div>
        <div>evidence_count：{rule.evidence_count}</div>
        <div>初回確認：{rule.first_seen_date||"—"} ／ 最終検証：{rule.last_verified_date||"—"}</div>
      </div>
      {rule.action_text && <div style={{fontSize:12.5,marginTop:8,background:"var(--band)",borderRadius:4,padding:"6px 8px"}}>
        <b>アクション：</b>{rule.action_text}</div>}
      {(rule.exceptions_json||[]).length>0 && <div style={{fontSize:12,marginTop:6,color:"var(--inkSoft)"}}>
        <b>例外条件：</b>{(rule.exceptions_json||[]).join("・")}</div>}

      <div style={{marginTop:12,paddingTop:10,borderTop:"1px solid var(--rule)"}}>
        <div style={{fontWeight:700,fontSize:12.5,marginBottom:6}}>この日の相場でルールを評価する</div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
          <input type="date" value={evalDate} onChange={e=>setEvalDate(e.target.value)} style={{fontSize:12,padding:"3px 5px"}}/>
          <input placeholder="メモ（任意）" value={evalNote} onChange={e=>setEvalNote(e.target.value)}
            style={{fontSize:12,padding:"3px 6px",flex:1,minWidth:120}}/>
        </div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:6}}>
          {TRADE_RULE_EVAL_OPTIONS.map(o=><button key={o.value} className="action-btn" disabled={busy}
            onClick={()=>doEvaluate(o.value)}>{o.label}</button>)}
        </div>
      </div>

      <div style={{marginTop:12,paddingTop:10,borderTop:"1px solid var(--rule)"}}>
        <div style={{fontWeight:700,fontSize:12.5,marginBottom:6}}>手動操作</div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {TRADE_RULE_STATUS_OPTIONS.filter(s=>s!==rule.status).map(s=>
            <button key={s} className="action-btn" disabled={busy}
              onClick={()=>doUpdate({status:s},`手動でstatusを${rule.status}→${s}へ変更`)}>{s}へ</button>)}
          {TRADE_RULE_CONFIDENCE_OPTIONS.filter(c=>c!==rule.confidence).map(c=>
            <button key={c} className="action-btn" disabled={busy}
              onClick={()=>doUpdate({confidence:c},`手動でconfidenceを${rule.confidence}→${c}へ変更`)}>信頼度{c}へ</button>)}
        </div>
        <div style={{marginTop:8}}>
          <div style={{fontSize:11.5,color:"var(--inkSoft)"}}>ルール文の修正</div>
          <textarea value={editText} onChange={e=>setEditText(e.target.value)} rows={2}
            style={{width:"100%",fontSize:12,padding:6,boxSizing:"border-box"}}/>
          <div style={{fontSize:11.5,color:"var(--inkSoft)",marginTop:4}}>アクション</div>
          <input value={editAction} onChange={e=>setEditAction(e.target.value)}
            style={{width:"100%",fontSize:12,padding:6,boxSizing:"border-box"}}/>
          <div style={{fontSize:11.5,color:"var(--inkSoft)",marginTop:4}}>例外条件（1行1件）</div>
          <textarea value={editExceptions} onChange={e=>setEditExceptions(e.target.value)} rows={2}
            style={{width:"100%",fontSize:12,padding:6,boxSizing:"border-box"}}/>
          <button className="action-btn" style={{marginTop:6}} disabled={busy} onClick={()=>doUpdate({
            rule_text:editText.trim(), action_text:editAction.trim()||null,
            exceptions_json:editExceptions.split("\n").map(s=>s.trim()).filter(Boolean),
          },"手動編集")}>保存</button>
        </div>
        <div style={{marginTop:10}}>
          <div style={{fontSize:11.5,color:"var(--inkSoft)"}}>修正版ルールとして派生（元ルールはREVISEDになります）</div>
          <textarea value={reviseText} onChange={e=>setReviseText(e.target.value)} rows={2}
            placeholder="修正後のルール文を入力" style={{width:"100%",fontSize:12,padding:6,boxSizing:"border-box",marginTop:4}}/>
          <button className="action-btn" style={{marginTop:6}} disabled={busy||!reviseText.trim()} onClick={doRevise}>REVISEDとして派生</button>
        </div>
        {msg && <div style={{fontSize:11.5,color:"var(--accent)",marginTop:6}}>{msg}</div>}
      </div>

      <div style={{marginTop:12,paddingTop:10,borderTop:"1px solid var(--rule)"}}>
        <div style={{fontWeight:700,fontSize:12.5,marginBottom:6}}>履歴</div>
        <div style={{display:"flex",flexDirection:"column",gap:4,maxHeight:220,overflowY:"auto"}}>
          {(rule.history||[]).map(h=><div key={h.id} style={{fontSize:11.5,color:"var(--inkSoft)",
              borderBottom:"1px solid var(--ruleSoft)",paddingBottom:3}}>
            <span className="mono">{(h.created_at||"").slice(0,16).replace("T"," ")}</span>
            {h.event_type==="EVALUATION"&&`評価：${h.eval_result}${h.eval_date?`（${h.eval_date}時点）`:""}`}
            {h.event_type==="MENTION"&&"再言及"}
            {h.event_type==="STATUS_CHANGE"&&`ステータス変更：${h.old_status}→${h.new_status}`}
            {h.event_type==="CONFIDENCE_CHANGE"&&`信頼度変更：${h.old_confidence}→${h.new_confidence}`}
            {h.event_type==="TEXT_EDIT"&&"文章修正"}
            {h.event_type==="CREATED"&&"新規作成"}
            {h.event_type==="EXPIRED"&&"期限切れ"}
            {h.reason&&`（${h.reason}）`}
          </div>)}
        </div>
      </div>
    </div>
  </div>;
}

// Trade Experience Learning新規（2026-09-11、指示書18番④）：記録タブ「Trade Experience」。
// UIを肥大化させない——一覧は簡潔に、詳細（judgment・スコア内訳）は展開のみ。ACTIVEルールは
// ここからも変更できない（ルール候補の昇格ボタンはTESTINGへのみ、指示書9番）。
function TradeExperiencePanel(){
  const [experiences,setExperiences]=useState([]);
  const [patternData,setPatternData]=useState(null);
  const [loading,setLoading]=useState(true);
  const [promoting,setPromoting]=useState(null);
  const [msg,setMsg]=useState("");
  const load=async()=>{
    setLoading(true);
    const [er,pr]=await Promise.all([
      fetchJsonSafe("/api/trade-experiences"),
      fetchJsonSafe("/api/trade-experience-patterns"),
    ]);
    setExperiences((er&&er.experiences)||[]);
    setPatternData(pr||null);
    setLoading(false);
  };
  useEffect(()=>{load();},[]);
  const promote=async(ruleId)=>{
    setPromoting(ruleId);
    const r=await fetchJsonSafe(`/api/trade-experience-rule-candidates/${ruleId}/promote`,{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({reason:"ユーザーが記録タブから承認"})});
    setPromoting(null);
    if(r&&r.rule){setMsg(`「${r.rule.rule_text.slice(0,24)}…」をTESTINGへ昇格しました`);load();}
    else setMsg("昇格に失敗しました");
  };
  return <div>
    <div className="sec-head">Trade Experience</div>
    <div className="sec-note">日々の実トレードから勝ちパターン・負けパターン・WAIT条件を記録します。ACTIVEルールへは自動で昇格しません——候補（RULE_CANDIDATE）はここで確認・承認してください。</div>
    {loading && <div style={{fontSize:12,color:"var(--inkFaint)",marginTop:10}}>読み込み中…</div>}
    {msg && <div style={{fontSize:12,color:"var(--inkSoft)",marginTop:6}}>{msg}</div>}

    {patternData&&patternData.rule_candidates&&patternData.rule_candidates.length>0 && <div className="card" style={{padding:"10px 12px",marginTop:10}}>
      <div style={{fontWeight:800,fontSize:13}}>ルール候補（RULE_CANDIDATE）</div>
      {patternData.rule_candidates.map(r=><div key={r.id} style={{padding:"6px 0",borderTop:"1px solid var(--ruleSoft)",fontSize:12}}>
        <div>{r.rule_text}</div>
        <div style={{fontSize:10.5,color:"var(--inkFaint)"}}>信頼度 {r.confidence}　エビデンス{r.evidence_count}件</div>
        <button className="action-btn" style={{fontSize:10.5,marginTop:4}} disabled={promoting===r.id} onClick={()=>promote(r.id)}>
          {promoting===r.id?"昇格中…":"TESTINGへ昇格"}
        </button>
      </div>)}
    </div>}

    {patternData&&patternData.proposed_candidates&&patternData.proposed_candidates.length>0 && <div className="card" style={{padding:"10px 12px",marginTop:10}}>
      <div style={{fontWeight:800,fontSize:13}}>統計から見つかった候補（未生成、参考）</div>
      {patternData.proposed_candidates.map((p,i)=><div key={i} style={{padding:"6px 0",borderTop:"1px solid var(--ruleSoft)",fontSize:12}}>
        <div>{p.rule_text}</div>
        <div style={{fontSize:10.5,color:"var(--inkFaint)"}}>{p.pattern}　サンプル{p.sample_count}件　勝率{Math.round((p.win_rate||0)*100)}%　信頼度{p.confidence_level}</div>
      </div>)}
    </div>}

    {patternData&&patternData.patterns&&Object.keys(patternData.patterns).length>0 && <div className="card" style={{padding:"10px 12px",marginTop:10}}>
      <div style={{fontWeight:800,fontSize:13}}>パターン統計</div>
      {Object.entries(patternData.patterns).map(([tag,s])=><div key={tag} style={{fontSize:11.5,padding:"3px 0"}}>
        {tag}：{s.sample_count}件　勝率{s.win_rate!=null?Math.round(s.win_rate*100)+"%":"—"}　平均{s.avg_pnl_pct!=null?(s.avg_pnl_pct>0?"+":"")+s.avg_pnl_pct+"%":"—"}
        <span style={{marginLeft:6,color:"var(--inkFaint)"}}>信頼度{s.confidence_level}</span>
      </div>)}
    </div>}

    <div style={{marginTop:10}}>
      <div style={{fontWeight:800,fontSize:13}}>トレード履歴（{experiences.length}件）</div>
      {experiences.length===0 && !loading && <div style={{fontSize:12,color:"var(--inkFaint)",marginTop:6}}>まだ記録がありません。</div>}
      {experiences.map(t=><div key={t.id} className="card" style={{padding:"8px 10px",marginTop:6,fontSize:12}}>
        <div style={{fontWeight:700}}>{t.symbol} {t.stock_name||""}　{t.trade_date}
          <span style={{marginLeft:8,color:t.result_class==="WIN"?"var(--up)":t.result_class==="LOSS"?"var(--down)":"var(--inkSoft)"}}>{t.result_class}</span></div>
        <div style={{color:"var(--inkSoft)"}}>{t.entry_price}→{t.exit_price}　{t.quantity}株
          {t.gross_pnl!=null && <span>{t.gross_pnl>0?"+":""}{Math.round(t.gross_pnl).toLocaleString()}円</span>}
          {t.gross_pnl_pct!=null && <span>（{t.gross_pnl_pct>0?"+":""}{t.gross_pnl_pct}%）</span>}
        </div>
        {t.pattern_tags_json&&t.pattern_tags_json.length>0 && <div style={{fontSize:10.5,color:"var(--inkFaint)",marginTop:2}}>{t.pattern_tags_json.join("・")}</div>}
      </div>)}
    </div>
  </div>;
}

function TradeRulesPanel(){
  const [rules,setRules]=useState([]);
  const [loading,setLoading]=useState(true);
  const [statusFilter,setStatusFilter]=useState(null);
  const [confidenceFilter,setConfidenceFilter]=useState(null);
  const [categoryFilter,setCategoryFilter]=useState("");
  const [openRuleId,setOpenRuleId]=useState(null);
  const [debugOpen,setDebugOpen]=useState(false);
  const [debugStats,setDebugStats]=useState(null);
  const [migrating,setMigrating]=useState(false);
  const [migrateMsg,setMigrateMsg]=useState("");

  const load=async()=>{
    setLoading(true);
    const params=new URLSearchParams();
    if(statusFilter)params.set("status",statusFilter);
    if(confidenceFilter)params.set("confidence",confidenceFilter);
    if(categoryFilter)params.set("category",categoryFilter);
    const d=await fetchJsonSafe(`/api/trade-rules?${params.toString()}`);
    setRules((d&&d.rules)||[]);
    setLoading(false);
  };
  useEffect(()=>{load();},[statusFilter,confidenceFilter,categoryFilter]);

  const loadDebug=async()=>{
    const d=await fetchJsonSafe("/api/trade-rules/debug-stats");
    setDebugStats((d&&d.stats)||null);
  };
  useEffect(()=>{if(debugOpen)loadDebug();},[debugOpen]);

  const runMigrate=async()=>{
    setMigrating(true);setMigrateMsg("");
    const d=await fetchJsonSafe("/api/trade-rules/migrate",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});
    setMigrating(false);
    if(d)setMigrateMsg(`過去ログから${d.migratedFromDailyLog}件・既存マイルールから${d.migratedFromInvestmentRules}件を移行、指示書指定ルール${d.seededExplicit}件・恒久ルール${d.seededPermanent}件を登録しました（既存と重複するものは増えません）`);
    else setMigrateMsg("移行に失敗しました");
    load();
  };

  const categories=[...new Set(rules.map(r=>r.category).filter(Boolean))];

  return <div style={{marginTop:18}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
      <div className="sec-head">ルール（学習システム）</div>
      <div style={{display:"flex",gap:6}}>
        <button className="action-btn" onClick={load} disabled={loading}>{loading?"更新中…":"更新"}</button>
        <button className="action-btn" onClick={runMigrate} disabled={migrating}
          title="過去のrule_updates・既存マイルールから初期登録します。何度実行しても重複登録はされません">
          {migrating?"移行中…":"過去データから移行"}</button>
      </div>
    </div>
    <div className="sec-note">ChatGPT取込のrule_updatesを蓄積・照合し、支持された回数に応じて信頼度・ステータスを自動更新します。朝一分析・トレード分析には現在ACTIVEなルールだけが自動で参照されます。</div>
    {migrateMsg && <div style={{fontSize:11.5,color:"var(--accent)",marginTop:6}}>{migrateMsg}</div>}

    <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:10}}>
      {["ACTIVE","TESTING","REVISED","RETIRED","EXPIRED"].map(s=>
        <button key={s} className={"chip"+(statusFilter===s?" on":"")} style={{cursor:"pointer"}}
          onClick={()=>setStatusFilter(v=>v===s?null:s)}>{s}</button>)}
      <span style={{width:1,background:"var(--rule)"}}/>
      {["HIGH","MEDIUM","LOW"].map(c=>
        <button key={c} className={"chip"+(confidenceFilter===c?" on":"")} style={{cursor:"pointer"}}
          onClick={()=>setConfidenceFilter(v=>v===c?null:c)}>{TRADE_RULE_CONFIDENCE_META[c].icon} {c}</button>)}
      {categories.length>0 && <select value={categoryFilter} onChange={e=>setCategoryFilter(e.target.value)}
          style={{fontSize:11.5,padding:"2px 4px"}}>
        <option value="">カテゴリ：すべて</option>
        {categories.map(c=><option key={c} value={c}>{c}</option>)}
      </select>}
    </div>

    {loading
      ? <div style={{fontSize:12,color:"var(--inkFaint)",marginTop:10}}>読み込み中…</div>
      : rules.length===0
        ? <div style={{padding:20,textAlign:"center",color:"var(--inkSoft)",fontSize:12.5,border:"1px solid var(--rule)",borderRadius:4,marginTop:10}}>
            該当するルールがありません。「過去データから移行」を押すと、これまでのrule_updates・既存マイルールから初期登録できます。
          </div>
        : <div style={{marginTop:10,display:"flex",flexDirection:"column",gap:6}}>
            {rules.map(r=>{
              const sm=TRADE_RULE_STATUS_META[r.status]||{label:r.status,color:"var(--ink)"};
              const cm=TRADE_RULE_CONFIDENCE_META[r.confidence]||{icon:"",label:r.confidence,color:"var(--ink)"};
              return <div key={r.id} onClick={()=>setOpenRuleId(r.id)}
                style={{border:"1px solid var(--rule)",borderLeft:`3px solid ${sm.color}`,borderRadius:4,
                  padding:"8px 10px",cursor:"pointer",background:"var(--card)"}}>
                <div style={{display:"flex",justifyContent:"space-between",gap:8,alignItems:"flex-start"}}>
                  <div style={{fontSize:13,fontWeight:700,flex:1}}>{r.rule_text}</div>
                  <div style={{display:"flex",gap:4,flexShrink:0}}>
                    <span className="chip" style={{color:sm.color,fontWeight:700,fontSize:10.5}}>{sm.label}</span>
                    <span className="chip" style={{color:cm.color,fontWeight:700,fontSize:10.5}}>{cm.icon}{cm.label}</span>
                  </div>
                </div>
                <div style={{fontSize:11,color:"var(--inkSoft)",marginTop:4,display:"flex",flexWrap:"wrap",gap:8}}>
                  <span>{r.category||"—"}</span>
                  <span>検証{r.total_evaluations}件（支持{r.success_count}/失敗{r.failure_count}）</span>
                  <span>成功率{r.success_rate!=null?(r.success_rate*100).toFixed(0)+"%":"—"}</span>
                  <span>初回{r.first_seen_date||"—"}／最終{r.last_verified_date||"—"}</span>
                  {r.rule_type==="TEMPORARY"&&<span style={{color:"var(--down)"}}>期限{r.expires_date||"—"}</span>}
                </div>
                {r.action_text && <div style={{fontSize:11.5,color:"var(--ink)",marginTop:3}}>→ {r.action_text}</div>}
              </div>;
            })}
          </div>}

    <div style={{marginTop:16,borderTop:"1px solid var(--rule)",paddingTop:8}}>
      <button className="iconbtn" onClick={()=>setDebugOpen(v=>!v)} style={{fontSize:11.5}}>
        {debugOpen?"▾":"▸"} デバッグ表示
      </button>
      {debugOpen && (debugStats
        ? <div style={{fontSize:11.5,color:"var(--inkSoft)",marginTop:6,display:"flex",flexWrap:"wrap",gap:10}}>
            <span>総ルール数 {debugStats.totalRules}</span>
            {Object.entries(debugStats.byStatus||{}).map(([k,v])=><span key={k}>{k} {v}</span>)}
            <span style={{width:1,background:"var(--rule)"}}/>
            {Object.entries(debugStats.byType||{}).map(([k,v])=><span key={k}>{k} {v}</span>)}
            <span style={{width:1,background:"var(--rule)"}}/>
            <span>本日の評価：{Object.entries(debugStats.todayEvaluations||{}).map(([k,v])=>`${k} ${v}`).join("・")||"なし"}</span>
            <span>重複候補ペア {debugStats.duplicateCandidatePairs}</span>
          </div>
        : <div style={{fontSize:11.5,color:"var(--inkFaint)",marginTop:6}}>読み込み中…</div>)}
    </div>

    {openRuleId && <TradeRuleDetail ruleId={openRuleId} onChanged={load} onClose={()=>setOpenRuleId(null)}/>}
  </div>;
}

// ============================================================
// 2026-09-09新規（日次投資レビュー・投資スコア、指示書Phase4・5・30番）：「記録」グループの
// 新規サブタブ「今日の振り返り」。ポジション・売買履歴・持ち越し・ルール遵守から自動生成された
// スコア（生のPnLではなく実データから機械的に検証できる項目の積み上げ、指示書14番）を表示し、
// ユーザー感想の入力・保存を行う。
// ============================================================
const DAILY_REVIEW_SCORE_AXES=[
  ["score_rule_adherence","ルール遵守",25],["score_entry_quality","エントリー",20],
  ["score_exit_quality","利確・損切り",20],["score_market_fit","地合い適応",15],
  ["score_risk_mgmt","リスク管理",10],["score_reflection","振り返り",10],
];
function scoreColor(score,max){
  if(score==null)return"var(--inkFaint)";
  const ratio=score/max;
  return ratio>=0.8?"var(--up)":ratio>=0.5?"var(--accent)":"var(--down)";
}
// Market Intelligence Phase10新規（指示書25・26・34番）：日次振り返りへの追加専用セクション。
// 既存のscore_total計算・表示には一切触れない。
const DECISION_QUALITY_META = {
  GOOD_DECISION_GOOD_RESULT: {label:"良い判断・良い結果", color:"var(--up)"},
  GOOD_DECISION_BAD_RESULT: {label:"良い判断・悪い結果", color:"var(--accent)"},
  BAD_DECISION_GOOD_RESULT: {label:"悪い判断・良い結果", color:"var(--accent)"},
  BAD_DECISION_BAD_RESULT: {label:"悪い判断・悪い結果", color:"var(--down)"},
};
function DailyDecisionReviewSection({decisionReview}){
  if(!decisionReview||!decisionReview.items||decisionReview.items.length===0)return null;
  const dr=decisionReview;
  return <div className="card" style={{padding:"12px 14px",marginTop:10}}>
    <div style={{fontWeight:800,fontSize:13}}>🧭 判断品質・タイミング・ルール遵守（Event Support活用）</div>
    <div style={{fontSize:10.5,color:"var(--inkFaint)",marginTop:2}}>「結果が良かった」と「判断が良かった」は別物として分けて評価します（勝った日だけ高得点にはしません）。</div>
    <div style={{display:"flex",gap:14,flexWrap:"wrap",marginTop:8,fontSize:11.5}}>
      <span>良い判断 {dr.good_decisions}件</span><span>悪い判断 {dr.bad_decisions}件</span>
      <span>追いかけ取引 {dr.chase_entries}件</span><span>正しいWAIT {dr.correct_waits}件</span>
      <span>良い押し目 {dr.good_pullbacks}件</span><span>機会損失 {dr.missed_breakouts}件</span>
      {dr.avoided_losses_pct_total>0 && <span style={{color:"var(--up)"}}>回避した損失合計 {dr.avoided_losses_pct_total}%</span>}
    </div>
    <div style={{marginTop:8,display:"flex",flexDirection:"column",gap:4}}>
      {dr.items.map((it,i)=>{
        const meta=DECISION_QUALITY_META[it.decision_quality]||{label:it.decision_quality||"—",color:"var(--inkSoft)"};
        return <div key={i} style={{fontSize:11,padding:"3px 5px",borderRadius:3,background:"var(--bg)",border:"1px solid var(--ruleSoft)"}}>
          <span style={{fontWeight:700}}>{it.ticker}</span>
          <span style={{color:meta.color,fontWeight:700}}>{meta.label}</span>
          {it.timing_quality && <span style={{color:"var(--inkSoft)"}}>／{it.timing_quality}</span>}
          {it.rule_compliance&&it.rule_compliance!=="COMPLIANT" && <span style={{color:"var(--accent)"}}>／{it.rule_compliance}</span>}
          {it.pnl_pct!=null && <span style={{marginLeft:4,color:it.pnl_pct>=0?"var(--up)":"var(--down)"}}>{it.pnl_pct>0?"+":""}{it.pnl_pct}%</span>}
        </div>;
      })}
    </div>
  </div>;
}

// Trade Experience Learning新規（指示書12・18番）：「今日の学習」。既存score_total計算には
// 一切触れない追加専用セクション。
function TodaysLearningSection({tradeLearning}){
  if(!tradeLearning)return null;
  const tl=tradeLearning;
  const hasAny=tl.best_trade||tl.worst_trade||tl.best_wait||(tl.rule_violations&&tl.rule_violations.length)||(tl.learning_notes&&tl.learning_notes.length);
  if(!hasAny)return null;
  return <div className="card" style={{padding:"12px 14px",marginTop:10}}>
    <div style={{fontWeight:800,fontSize:13}}>🧠 今日の学習</div>
    <div style={{marginTop:6,display:"flex",flexDirection:"column",gap:4,fontSize:11.5}}>
      {tl.best_trade && <div><b>Best Trade：</b>{tl.best_trade.symbol} {tl.best_trade.stock_name||""}
        {tl.best_trade.gross_pnl_pct!=null && <span style={{color:"var(--up)",marginLeft:4}}>{tl.best_trade.gross_pnl_pct>0?"+":""}{tl.best_trade.gross_pnl_pct}%</span>}</div>}
      {tl.worst_trade && <div><b>Worst Trade：</b>{tl.worst_trade.symbol} {tl.worst_trade.stock_name||""}
        {tl.worst_trade.gross_pnl_pct!=null && <span style={{color:"var(--down)",marginLeft:4}}>{tl.worst_trade.gross_pnl_pct>0?"+":""}{tl.worst_trade.gross_pnl_pct}%</span>}</div>}
      {tl.best_wait && <div><b>Best WAIT：</b>{tl.best_wait.symbol}　{(tl.best_wait.reasons||[]).join("・")}</div>}
      {tl.rule_violations&&tl.rule_violations.length>0 && <div style={{color:"var(--down)"}}>
        <b>Rule Violation：</b>{tl.rule_violations.map(v=>v.symbol).join("・")}
      </div>}
      {tl.learning_notes&&tl.learning_notes.map((n,i)=><div key={i} style={{color:"var(--inkSoft)"}}>💡 {n}</div>)}
    </div>
  </div>;
}

function DailyReviewPanel(){
  const [date,setDate]=useState(todayISO());
  const [review,setReview]=useState(null);
  const [decisionReview,setDecisionReview]=useState(null);
  const [tradeLearning,setTradeLearning]=useState(null);
  const [loading,setLoading]=useState(true);
  const [generating,setGenerating]=useState(false);
  const [feedbackDraft,setFeedbackDraft]=useState("");
  const [savingFeedback,setSavingFeedback]=useState(false);
  const [feedbackMsg,setFeedbackMsg]=useState("");
  const [history,setHistory]=useState([]);
  // 「今日の振り返り」独立タブ化+15:30自動評価（2026-09-12新規、指示書24・25番）：直近の
  // 生成結果（Trade Experience同期件数・更新された銘柄プロフィール）と、蓄積状況
  // （新規Trade Experience/更新銘柄プロフィール/新しいPattern Candidate/Rule Candidate）。
  const [genResult,setGenResult]=useState(null);
  const [learningSummary,setLearningSummary]=useState(null);
  // 損切り学習レポート（2026-09-15新規、ユーザー運用指示）：勝率最大化ではなく期待値の高い
  // ENTRYを残す目的で、損切り件数・回避可能率・頻出LOSSタグ・タグ別成績・成功パターンとの
  // 比較を定期的に見る。既定は閉じたまま（毎日は必ずしも見ない前提の集計専用パネルのため）。
  const [lossReport,setLossReport]=useState(null);
  const [lossReportOpen,setLossReportOpen]=useState(false);
  const loadLossReport=async()=>{
    const r=await fetchJsonSafe("/api/trade-learning/loss-report");
    if(r)setLossReport(r);
  };
  const [notifySettings,setNotifySettings]=useState(loadDailyReviewNotifySettings);
  // Cross-Market Link / Sector Rotation Engine新規（2026-09-12）：「🔗今日の市場連動学習」
  // 「🔄今日のセクターローテーション学習」。
  const [crossMarketLearning,setCrossMarketLearning]=useState(null);
  const [sectorRotationLearning,setSectorRotationLearning]=useState(null);
  // トレード学習・損切り分析強化（2026-09-15新規、指示書5番）：「損した＝悪い判断」にしない、
  // トレードごとのエントリー/損切り判断/ルール遵守/結果の内訳。
  const [tradeBreakdown,setTradeBreakdown]=useState([]);

  const load=async(d)=>{
    setLoading(true);
    const r=await fetchJsonSafe(`/api/daily-review?date=${d}`);
    const rev=(r&&r.review)||null;
    setReview(rev);
    setDecisionReview((r&&r.decisionReview)||null);
    setTradeLearning((r&&r.tradeLearning)||null);
    setCrossMarketLearning((r&&r.crossMarketLearning)||null);
    setSectorRotationLearning((r&&r.sectorRotationLearning)||null);
    setTradeBreakdown((r&&r.tradeBreakdown)||[]);
    setFeedbackDraft(rev?.user_feedback||"");
    setLoading(false);
    const ls=await fetchJsonSafe(`/api/trade-learning/summary?date=${d}`);
    if(ls)setLearningSummary(ls);
  };
  useEffect(()=>{load(date);},[date]);
  // タブを開いたら既読化する（指示書9番「ユーザーが開いたら既読化」）。当日分を開いた時のみ
  // （過去日を見ても未読dotの意味＝今日の新着通知は消さない）。
  useEffect(()=>{if(review&&date===todayISO())markDailyReviewSeen(review.generated_at);},[review,date]);

  const loadHistory=async()=>{
    const r=await fetchJsonSafe("/api/daily-review/list");
    setHistory((r&&r.reviews)||[]);
  };
  useEffect(()=>{loadHistory();},[]);

  const generate=async()=>{
    setGenerating(true);
    const r=await fetchJsonSafe("/api/daily-review/generate",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({date})});
    setGenerating(false);
    if(r&&r.review){
      setReview(r.review);setFeedbackDraft(r.review.user_feedback||"");loadHistory();
      setGenResult({sync:r.sync,behaviorUpdated:r.behaviorUpdated,ruleCandidatesProposed:r.ruleCandidatesProposed});
      setTradeBreakdown(r.tradeBreakdown||[]);
      const ls=await fetchJsonSafe(`/api/trade-learning/summary?date=${date}`);
      if(ls)setLearningSummary(ls);
    }
  };
  const saveFeedback=async()=>{
    setSavingFeedback(true);setFeedbackMsg("");
    const r=await fetchJsonSafe("/api/daily-review/feedback",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({date,feedback:feedbackDraft})});
    setSavingFeedback(false);
    if(r&&r.review){setReview(r.review);setFeedbackMsg("保存しました");loadHistory();}
    else setFeedbackMsg("保存に失敗しました");
  };

  // 緊急修正（2026-09-16）：場中Daily Review確定・誤持ち越し判定の防止（指示書2・9番）。
  // review.is_finalizedはサーバー側can_finalize_daily_review()（大引け=15:30基準）で
  // ゲート済みのため、当日かつis_finalized=falseなら「場中・暫定」表示に切り替える
  // （FINALとPROVISIONALを明確に分離、新しい時刻判定はフロント側で行わない＝サーバーの
  // is_finalizedを唯一の真実として使う）。
  const isProvisionalToday = review && !review.is_finalized && date === todayISO();
  return <div style={{marginTop:18}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
      <div className="sec-head">
        {isProvisionalToday ? "🟡 今日の振り返り（場中・暫定）" : review?.is_finalized ? "今日の振り返り（確定）" : "今日の振り返り"}
      </div>
      <div style={{display:"flex",gap:6,alignItems:"center"}}>
        <input type="date" value={date} onChange={e=>setDate(e.target.value)} style={{fontSize:12,padding:"3px 5px"}}/>
        <button className="action-btn" onClick={generate} disabled={generating}>{generating?"生成中…":review?"再生成":"スコアを生成"}</button>
      </div>
    </div>
    {isProvisionalToday && <div className="sec-note" style={{color:"var(--accent)",fontWeight:700}}>
      ※ 取引時間中のためスコア・改善点・持ち越し判定は確定していません（大引け後に自動確定します）
    </div>}
    <div className="sec-note">ポジション・売買履歴・持ち越し・ルール遵守状況から自動で採点します。利益が出てもルール違反なら減点、損失でも正しい損切りなら高評価になり得ます（「結果」より「判断プロセス」の評価）。</div>
    {/* 指示書10番：15:30振り返り通知のON/OFF設定（音・ポップアップ個別）。初期値は全てON。 */}
    <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"center",fontSize:11.5,color:"var(--inkSoft)",marginTop:6}}>
      <label style={{display:"flex",alignItems:"center",gap:4,cursor:"pointer"}}>
        <input type="checkbox" checked={notifySettings.enabled}
          onChange={e=>{const n={...notifySettings,enabled:e.target.checked};setNotifySettings(n);saveDailyReviewNotifySettings(n);}}/>
        15:30振り返り通知
      </label>
      <label style={{display:"flex",alignItems:"center",gap:4,cursor:"pointer",opacity:notifySettings.enabled?1:0.5}}>
        <input type="checkbox" checked={notifySettings.sound} disabled={!notifySettings.enabled}
          onChange={e=>{const n={...notifySettings,sound:e.target.checked};setNotifySettings(n);saveDailyReviewNotifySettings(n);}}/>
        音
      </label>
      <label style={{display:"flex",alignItems:"center",gap:4,cursor:"pointer",opacity:notifySettings.enabled?1:0.5}}>
        <input type="checkbox" checked={notifySettings.popup} disabled={!notifySettings.enabled}
          onChange={e=>{const n={...notifySettings,popup:e.target.checked};setNotifySettings(n);saveDailyReviewNotifySettings(n);}}/>
        ポップアップ
      </label>
    </div>

    {loading ? <div style={{fontSize:12,color:"var(--inkFaint)",marginTop:10}}>読み込み中…</div>
    : !review ? <div style={{padding:20,textAlign:"center",color:"var(--inkSoft)",fontSize:12.5,border:"1px solid var(--rule)",borderRadius:4,marginTop:10}}>
        {date}のレビューはまだありません。「スコアを生成」を押してください。
      </div>
    : <div style={{marginTop:12}}>
        <div className="card" style={{padding:"14px 16px",textAlign:"center"}}>
          <div style={{fontSize:12,color:"var(--inkSoft)"}}>今日の投資スコア{isProvisionalToday && <span style={{color:"var(--accent)",fontWeight:700}}>（暫定）</span>}</div>
          <div style={{fontSize:36,fontWeight:800,color:scoreColor(review.score_total,100)}}>{isProvisionalToday?"暫定 ":""}{review.score_total}<span style={{fontSize:16,fontWeight:400,color:"var(--inkSoft)"}}> / 100</span></div>
          {/* 指示書6・7番：「判断品質」と「結果」を分けて表示する（勝った/負けただけで評価しない）。 */}
          {(review.decision_quality_score!=null||review.trade_result_score!=null) &&
            <div style={{display:"flex",justifyContent:"center",gap:16,marginTop:8,fontSize:11.5,color:"var(--inkSoft)"}}>
              {review.decision_quality_score!=null && <span>判断品質 <b style={{color:scoreColor(review.decision_quality_score,100)}}>{review.decision_quality_score}</b>/100</span>}
              {review.trade_result_score!=null && <span>結果 <b style={{color:scoreColor(review.trade_result_score,100)}}>{review.trade_result_score}</b>/100</span>}
            </div>}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:8,marginTop:10}}>
          {DAILY_REVIEW_SCORE_AXES.map(([key,label,max])=>
            <div key={key} className="card" style={{padding:"8px 10px",textAlign:"center"}}>
              <div style={{fontSize:11,color:"var(--inkSoft)"}}>{label}</div>
              <div style={{fontSize:18,fontWeight:700,color:scoreColor(review[key],max)}}>{review[key]}/{max}</div>
            </div>)}
        </div>

        {/* トレード学習・損切り分析強化（2026-09-15新規、指示書5番）：トレードごとの内訳。
            「損した＝悪い判断」「利益＝良い判断」には絶対にしない——エントリー判断/損切り判断/
            ルール遵守/結果を別々に採点し、損切り自体が正しかった場合は「損切りGOOD／問題は

        {tradeBreakdown.length>0 && <div className="card" style={{padding:"10px 12px",marginTop:10}}>
          <b style={{fontSize:12}}>トレード別の内訳（{tradeBreakdown.length}件）</b>
          <div style={{marginTop:8,display:"flex",flexDirection:"column",gap:8}}>
            {tradeBreakdown.map((t,i)=><div key={i} style={{border:"1px solid var(--rule)",borderRadius:4,padding:"6px 8px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:6}}>
                <span style={{fontWeight:700,fontSize:12.5}}>{t.symbol} {t.stockName||""}</span>
                <span style={{fontSize:12,fontWeight:700,color:t.resultClass==="WIN"?"var(--up)":t.resultClass==="LOSS"?"var(--down)":"var(--inkSoft)"}}>
                  {t.resultClass}{t.grossPnlPct!=null?` ${t.grossPnlPct>0?"+":""}${t.grossPnlPct}%`:""}
                </span>
              </div>
              {t.exitWasGoodButEntryWasBad && <div style={{fontSize:11,fontWeight:700,color:"var(--accent)",marginTop:2}}>
                損切りGOOD／問題はENTRY
              </div>}
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(90px,1fr))",gap:"2px 10px",marginTop:4,fontSize:11}}>
                <span>エントリー判断 <b>{t.entryTimingScore??"-"}</b>/25</span>
                <span>損切り判断 <b>{t.exitExecutionScore??"-"}</b>/20</span>
                <span>リスク管理 <b>{t.riskControlScore??"-"}</b>/20</span>
                <span>ルール遵守 <b>{t.ruleComplianceScore??"-"}</b>/20</span>
                <span>結果 <b>{t.tradeResultScore??"-"}</b>/100</span>
              </div>
              {t.lossReasonTags&&t.lossReasonTags.length>0 && <div style={{fontSize:11,color:"var(--inkSoft)",marginTop:4}}>
                損切り理由：{t.lossReasonTags.join("・")}
                {t.entryAvoidability && <span style={{marginLeft:6,fontWeight:700,
                    color:t.entryAvoidability==="AVOIDABLE"?"var(--down)":t.entryAvoidability==="NOT_AVOIDABLE"?"var(--up)":"var(--inkSoft)"}}>
                  {({AVOIDABLE:"（ENTRY時点で回避可能だった可能性）",PARTIALLY_AVOIDABLE:"（一部警戒材料あり・ENTRY自体には合理性）",
                     NOT_AVOIDABLE:"（エントリー自体は妥当、結果は不運）",UNKNOWN:"（判断材料不足）"})[t.entryAvoidability]}
                </span>}
                {/* 2026-09-16新規：ENTRY回避可能性とEXIT/RISK問題の分離表示。ENTRY_CAUSE
                    （注文・約定時刻までに観測可能だった情報）だけがAVOIDABLE判定に使われ、
                    それ以外（エントリー後の悪化・リスク管理上の問題）は参考情報として分けて示す。 */}
                {t.lossReasonCategories && <div style={{marginTop:3,display:"flex",flexDirection:"column",gap:1}}>
                  {t.lossReasonCategories.ENTRY_CAUSE?.length>0 && <span>ENTRY時点で分かっていた危険信号：{t.lossReasonCategories.ENTRY_CAUSE.join("・")}</span>}
                  {t.lossReasonCategories.POST_ENTRY_DETERIORATION?.length>0 && <span>ENTRY後に発生した悪化：{t.lossReasonCategories.POST_ENTRY_DETERIORATION.join("・")}</span>}
                  {t.lossReasonCategories.RISK_MANAGEMENT?.length>0 && <span>損切り／リスク管理上の問題：{t.lossReasonCategories.RISK_MANAGEMENT.join("・")}</span>}
                </div>}
                {t.entryUnblockConditions&&t.entryUnblockConditions.length>0 && <div style={{marginTop:2}}>
                  次回ENTRY解禁条件：{t.entryUnblockConditions.join("／")}
                </div>}
              </div>}
              {/* Trade Learning Phase C（2026-09-16、観測・保存のみでUI未接続だった）＋
                  EVENT_QUALITY（2026-09-17新規）：ENTRY/STOP/EXIT/REENTRY/EVENTの5軸独立評価。
                  勝敗結果とは無関係に表示する（LOSS以外にも表示、「損切りは良かったが入った
                  判断は悪かった」を分けて示す）。 */}
              {t.qualityAxes && <div style={{marginTop:4,display:"flex",flexWrap:"wrap",gap:6}}>
                {[["entry_quality","エントリー環境判断"],["stop_quality","損切り幅設計"],
                  ["exit_quality","決済執行"],["reentry_quality","再エントリー判断"],
                  ["event_quality","イベント認識"]].map(([key,label])=>{
                  const axis=t.qualityAxes[key];
                  if(!axis||axis.classification==="UNKNOWN")return null;
                  const cls=axis.classification;
                  const color=cls==="N/A"?"var(--inkFaint)":
                    (["GOOD_TIMING","GOOD","TRIGGER_DETECTED"].includes(cls)?"var(--up)":
                     (["QUESTIONABLE_TIMING","CHASE_OR_LATE_ENTRY","POOR"].includes(cls)?"var(--down)":"var(--inkSoft)"));
                  return <span key={key} style={{fontSize:10.5,fontWeight:700,color,border:`1px solid ${color}`,
                      borderRadius:3,padding:"1px 6px"}}
                      title={(axis.evidence&&(Array.isArray(axis.evidence)?axis.evidence.join("・"):JSON.stringify(axis.evidence)))||""}>
                    {label}：{cls}
                  </span>;
                })}
              </div>}
              {/* Phase：ENTRY後15/30/60分 Opportunity Learning（2026-09-16新規）。勝敗結果とは
                  独立に「そもそも利益を取れる値幅が存在したか」を表示する（LOSS以外にも表示）。 */}
              {t.opportunity && t.opportunity.opportunityClass!=="UNKNOWN" && <div style={{fontSize:11,color:"var(--inkSoft)",marginTop:4}}>
                値幅機会：<b>{({HIGH_OPPORTUNITY:"HIGH",NORMAL_OPPORTUNITY:"NORMAL",LOW_OPPORTUNITY:"LOW"})[t.opportunity.opportunityClass]}</b>
                （{t.opportunity.bestWindow}時点MFE {t.opportunity.bestMfePct>0?"+":""}{t.opportunity.bestMfePct}%）
                {t.opportunity.exitLeftValueOnTable && <span style={{marginLeft:6,fontWeight:700,color:"var(--accent)"}}>⚠ 利益機会はあったがEXITできなかった可能性（EXIT/ストップ設計側の問題）</span>}
                {t.opportunity.insufficientRangeConfirmed && <span style={{marginLeft:6,fontWeight:700,color:"var(--inkSoft)"}}>（値幅自体が不足＝INSUFFICIENT_RANGE）</span>}
              </div>}
            </div>)}
          </div>
        </div>}

        {(review.good_points||[]).length>0 && <div className="card" style={{padding:"10px 12px",marginTop:10,borderLeft:"3px solid var(--up)"}}>
          <b style={{fontSize:12,color:"var(--up)"}}>良かった点</b>
          <ul style={{margin:"6px 0 0",paddingLeft:18,fontSize:12}}>{(review.good_points||[]).map((g,i)=><li key={i}>{g}</li>)}</ul>
        </div>}
        {(review.improvement_points||[]).length>0 && <div className="card" style={{padding:"10px 12px",marginTop:10,borderLeft:"3px solid var(--down)"}}>
          <b style={{fontSize:12,color:"var(--down)"}}>改善点</b>
          <ul style={{margin:"6px 0 0",paddingLeft:18,fontSize:12}}>{(review.improvement_points||[]).map((g,i)=><li key={i}>{g}</li>)}</ul>
        </div>}
        {(review.tomorrow_notes||[]).length>0 && <div className="card" style={{padding:"10px 12px",marginTop:10,borderLeft:"3px solid var(--accent)"}}>
          <b style={{fontSize:12,color:"var(--accent)"}}>明日の注意</b>
          <ul style={{margin:"6px 0 0",paddingLeft:18,fontSize:12}}>{(review.tomorrow_notes||[]).map((g,i)=><li key={i}>{g}</li>)}</ul>
        </div>}
        <DailyDecisionReviewSection decisionReview={decisionReview}/>
        <TodaysLearningSection tradeLearning={tradeLearning}/>

        {/* 指示書24番：今日更新された銘柄のクセ。手動再生成した直後のみ表示（サーバーは
            behaviorUpdatedを永続化しないため、ページ再訪時は表示されない＝既知の制約）。 */}
        {genResult?.behaviorUpdated?.length>0 && <div className="card" style={{padding:"12px 14px",marginTop:10}}>
          <div style={{fontWeight:800,fontSize:13}}>🧬 今日更新された銘柄のクセ</div>
          <div style={{marginTop:6,display:"flex",flexDirection:"column",gap:4,fontSize:11.5}}>
            {genResult.behaviorUpdated.map(b=><div key={b.symbol}>
              <b>{b.symbol}</b>　サンプル{b.sample_count}件　信頼度{b.confidence_level}
              {b.confidence_level==="LOW" && <span style={{color:"var(--inkFaint)"}}>（参考程度）</span>}
            </div>)}
          </div>
        </div>}

        {/* 指示書25番：今日の学習（蓄積状況）。 */}
        {learningSummary && <div className="card" style={{padding:"12px 14px",marginTop:10}}>
          <div style={{fontWeight:800,fontSize:13}}>今日の学習（蓄積状況）</div>
          <div style={{marginTop:6,display:"flex",flexWrap:"wrap",gap:14,fontSize:11.5}}>
            <span>新規Trade Experience　<b>{learningSummary.new_trade_experiences}</b>件</span>
            <span>更新された銘柄プロフィール　<b>{learningSummary.updated_stock_profiles}</b>銘柄</span>
            <span>新しいPattern Candidate　<b>{learningSummary.new_pattern_candidates}</b>件</span>
            <span>Rule Candidate　<b>{learningSummary.rule_candidates_pending}</b>件</span>
          </div>
        </div>}

        {/* 損切り学習レポート（2026-09-15新規、ユーザー運用指示）：定期的に眺めてENTRY判定
            改善に使う集計。開くまでは取得しない（軽量化、他のカードのように毎回自動取得しない）。 */}
        <div className="card" style={{padding:"12px 14px",marginTop:10}}>

// ============================================================
// 2026-09-10新規（朝一マーケット自動分析システム、MorningMarketCheck）：
// 既存のNotification API連携（notifyDesktop/requestNotifyPermission、App内で既に
// 使われているセクター内逆行銘柄通知と同じ仕組み）をそのまま再利用する。
// 音は外部ファイルを持たずWeb Audio APIの短いビープ音で鳴らす（指示書19番「短い1回音」）。
// ブラウザの自動再生制限対策として、AudioContextは最初のユーザー操作（クリック等）まで
// 生成を遅らせる（指示書「初回のみユーザー操作後に音声許可を初期化」）。
// ============================================================
let _morningCheckAudioCtx=null;
if(typeof window!=="undefined"){
  const initAudio=()=>{
    if(!_morningCheckAudioCtx){
      try{_morningCheckAudioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
    }
    window.removeEventListener("click",initAudio);
    window.removeEventListener("keydown",initAudio);
  };
  window.addEventListener("click",initAudio,{once:true});
  window.addEventListener("keydown",initAudio,{once:true});
}
function playMorningCheckChime(urgent){
  try{
    const ctx=_morningCheckAudioCtx;
    if(!ctx)return;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type="sine";o.frequency.value=urgent?880:660;
    g.gain.setValueAtTime(0.0001,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.15,ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.35);
    o.connect(g);g.connect(ctx.destination);
    o.start();o.stop(ctx.currentTime+0.4);
    if(urgent){
      setTimeout(()=>{
        const o2=ctx.createOscillator(),g2=ctx.createGain();
        o2.type="sine";o2.frequency.value=880;
        g2.gain.setValueAtTime(0.0001,ctx.currentTime);
        g2.gain.exponentialRampToValueAtTime(0.15,ctx.currentTime+0.02);
        g2.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.35);
        o2.connect(g2);g2.connect(ctx.destination);
        o2.start();o2.stop(ctx.currentTime+0.4);
      },450);
    }
  }catch(e){}
}
