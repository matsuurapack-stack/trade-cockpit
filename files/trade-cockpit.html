      .formatToParts(now).reduce((acc,p)=>p.type==="hour"?acc+Number(p.value):p.type==="minute"?acc+Number(p.value)/60:acc,0));
  }catch(e){return now.getHours()+now.getMinutes()/60;}})();
  const isEveningWindow=jstHour>=15.5||jstHour<9.0;
  const nd=(nextDayThemes&&nextDayThemes.themes)||[];
  const td=(todayThemes&&todayThemes.themes)||[];
  const showNextDay=isEveningWindow&&nd.length>0;
  const showToday=(!showNextDay)&&td.length>0;
  const list=showNextDay?nd:showToday?td:(nd.length?nd:td); // 両方空でなければどちらか出す（時間帯が中途半端な場合のフォールバック）
  const title=showNextDay?"🔥 明日の注目テーマ":"🔥 今日の注目テーマ";
  const watchCodes=new Set((watchlistAll||[]).map(w=>w.code));
  if(list.length===0)return null;
  return <div style={{background:"var(--card)",border:"1px solid var(--rule)",borderRadius:6,padding:"12px 14px",marginTop:12}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:6,marginBottom:8}}>
      <div style={{fontWeight:800,fontSize:13.5}}>{title}<span style={{fontWeight:400,fontSize:11,color:"var(--inkFaint)"}}>（ヤーマン式・候補発掘レイヤー）</span></div>
    </div>
    <div style={{display:"flex",flexDirection:"column",gap:6}}>
      {list.map(t=>{
        const stageMeta=YAAMAN_STAGE_META[t.stage]||{label:t.stage||"—",color:"var(--inkSoft)"};
        const confMeta=t.confirmation_status?(YAAMAN_CONFIRM_META[t.confirmation_status]||{label:t.confirmation_status,color:"var(--inkSoft)"}):null;
        const triggers=t.trigger_stocks_json||[];
        const related=t.related_stocks_json||[];
        const isOpen=expandedTheme===t.theme;
        return <div key={t.theme} style={{border:"1px solid var(--rule)",borderRadius:4,background:"var(--bg)"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,padding:"7px 10px",cursor:"pointer",flexWrap:"wrap"}}
            onClick={()=>setExpandedTheme(isOpen?null:t.theme)}>
            <span style={{fontSize:13,fontWeight:800}}>{t.theme}</span>
            <span style={{fontSize:11,color:"var(--inkSoft)"}}>Score {t.theme_score!=null?Math.round(t.theme_score):"—"}</span>
            <span style={{fontSize:10.5,fontWeight:700,color:stageMeta.color,border:`1px solid ${stageMeta.color}`,borderRadius:3,padding:"1px 6px"}}>{stageMeta.label}</span>
            {confMeta && <span style={{fontSize:10.5,fontWeight:700,color:confMeta.color,border:`1px solid ${confMeta.color}`,borderRadius:3,padding:"1px 6px"}}>{confMeta.label}</span>}
            {t.catalyst && <span style={{fontSize:10.5,color:"var(--inkFaint)"}}>{t.catalyst}</span>}
            <span style={{fontSize:10.5,color:"var(--inkFaint)",marginLeft:"auto"}}>{isOpen?"▲":"▼"}</span>
          </div>
          {isOpen && <div style={{padding:"6px 10px 10px",borderTop:"1px solid var(--rule)"}}>
            <div style={{fontSize:11,color:"var(--inkSoft)",marginBottom:6}}>
              発端銘柄（LEADER）：{triggers.join("、")||"—"}
              {t.breadth!=null && <>　breadth {t.breadth}</>}
              {t.volume_expansion!=null && <>　出来高倍率 {t.volume_expansion}x</>}
            </div>
            <div style={{fontSize:11,fontWeight:700,color:"var(--inkSoft)",marginBottom:4}}>関連銘柄（FOLLOWER候補）</div>
            <div style={{display:"flex",flexDirection:"column",gap:4}}>
              {related.length===0 && <div style={{fontSize:11,color:"var(--inkFaint)"}}>関連銘柄なし</div>}
              {related.map(code=>{
                const inWatch=watchCodes.has(code);
                return <div key={code} style={{display:"flex",alignItems:"center",gap:8,fontSize:11.5}}>
                  <span className="mono" style={{width:56,color:"var(--inkSoft)"}}>{code}</span>
                  {inWatch
                    ? <button className="chip" style={{fontSize:10.5}} onClick={()=>onOpenAnalysis(code)}>分析へ</button>
                    : <button className="chip" style={{fontSize:10.5}} onClick={()=>onAddToWatchlist({code,market:"JP"})}>[+監視] 監視銘柄に追加</button>}
                </div>;
              })}
            </div>
          </div>}
        </div>;
      })}
    </div>
  </div>;
}

function WatchTargetsPanel({items,stockQuotes,analysisTargets,onToggleAnalysis,onOpenAnalysis,earningsTargets,onToggleEarnings,onRemove,onOpenChart,metrics,watchlistAll,breakoutLevels,activeRules,analysisData,marketRiskLabel,momentumScanning,momentumResult,onMomentumScan,breakScanning,breakResult,onBreakScan,rsScanning,rsScanResult,onRsScan,sectorLeaderScanning,sectorLeaderResult,onSectorLeaderScan,pullbackScanning,pullbackResult,onPullbackScan,reversalScanning,reversalResult,onReversalScan,volumeScanning,volumeResult,onVolumeScan,newsCatalysts,entryScanning,entryResult,onEntryScan,thesisStats,todayTheses,yaamanNextDayThemes,yaamanTodayThemes,onAddToWatchlist,eventRiskGuard,appVersionInfo,watchTargetsDiag,lastFastQuoteStats,onRemoveOrphanedWatchTargets}){
  const [expandedScoreCode,setExpandedScoreCode]=useState(null); // スコア内訳の折りたたみ展開（指示書21番）
  const [entryDebugOpen,setEntryDebugOpen]=useState(false); // TOP5表示ロジック修正指示・指示書7番：開発用デバッグ表示（既定は折りたたみ）

  // 2026-09-14新規（監視銘柄「動いていない」不具合調査・可視化）：/api/stock-quotesの
  // 自動更新（fetchMonitorAndJP、30秒おき）が実際にこのタブの銘柄まで届いているかを
  // ユーザー自身の画面上で確認できるようにする。stockQuotes[code].quoteFetchedAtは
  // 各銘柄が最後に新しい値を受け取った時刻（fetchMonitorAndJP側で毎回スタンプ済み）。
  const [debugUpdatesOpen,setDebugUpdatesOpen]=useState(false);
  const [nowTick,setNowTick]=useState(Date.now());
  useEffect(()=>{const id=setInterval(()=>setNowTick(Date.now()),1000);return()=>clearInterval(id);},[]);
  const prevQuoteFetchedAtRef=useRef({});
  const [lastPollStats,setLastPollStats]=useState(null); // {at, updated, total}
  useEffect(()=>{
    if(!items.length)return;
    const prev=prevQuoteFetchedAtRef.current;
    let updated=0;
    const next={};
    items.forEach(it=>{
      const fa=stockQuotes[it.code]?.quoteFetchedAt||null;
      next[it.code]=fa;
      if(fa&&fa!==prev[it.code])updated++;
    });
    prevQuoteFetchedAtRef.current=next;
    // 初回マウント直後（prevが空）は「全件が新規」になり無意味なので記録しない
    if(Object.keys(prev).length>0){
      const stat={at:Date.now(),updated,total:items.length};
      setLastPollStats(stat);
      console.log(`[監視銘柄更新] ${new Date(stat.at).toLocaleTimeString("ja-JP")} updated ${updated}/${items.length}`);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[stockQuotes,items.length]);
  const DEBUG_WATCH_CODES=["6753","8001","9532","9432","9434"];
  const lastAnyQuoteAt=useMemo(()=>{
    let max=null;
    items.forEach(it=>{
      const fa=stockQuotes[it.code]?.quoteFetchedAt;
      if(!fa)return;
      const t=new Date(fa).getTime();
      if(!max||t>max)max=t;
    });
    return max;
  },[items,stockQuotes]);
  const secondsSinceLastQuote=lastAnyQuoteAt?Math.round((nowTick-lastAnyQuoteAt)/1000):null;
  // Phase QF-1（2026-09-14）指示書11番：LIVE(0-45秒)/DELAYED(46-90秒)/STALE(91秒以上)の
  // 初期基準。市場時間外は「昼休み・引け後で約定が動かないだけ」を更新停止と誤判定しないよう、
  // STALE扱いにしない（データ遅延の注記のみに留める）。
  const updateStatusLabel=(()=>{
    if(secondsSinceLastQuote==null)return {text:"取得中…",color:"var(--inkSoft)"};
    const hhmmss=new Date(lastAnyQuoteAt).toLocaleTimeString("ja-JP");
    if(secondsSinceLastQuote<45)return {text:`最終更新 ${hhmmss} LIVE`,color:"var(--inkSoft)"};
    if(secondsSinceLastQuote<90)return {text:`最終更新 ${hhmmss}（DELAYED・${secondsSinceLastQuote}秒前）`,color:"var(--warn)"};
    if(!isJstMarketHours())return {text:`最終更新 ${hhmmss}（市場時間外・${secondsSinceLastQuote}秒前）`,color:"var(--inkSoft)"};
    // 注：ここは値の上昇/下落ではなく「更新が止まっている」という警告色のため、
    // 日本の相場慣習配色（--up=赤/--down=緑）ではなく固定の赤を使う（混同防止）。
    return {text:`⚠ STALE：最終更新 ${hhmmss}（${secondsSinceLastQuote}秒前）`,color:"#c62828"};
  })();
  const pctOf=(code)=>{const qt=stockQuotes[code]||{};const t=num(qt.t),p=num(qt.p);
    return (t!=null&&p!=null&&p)?(t-p)/p*100:null;};

  // v3-4：市場（日経平均）・セクター平均に対する差分→enrichWatchRow→TOP5選定は
  // computeEnrichedWatch/rankTop5（共通ヘルパー、本ファイル上部で定義）に切り出し済み。
  // 市場タブの「朝一分析」コピーも同じ関数で同じTOP5を算出する（二重実装を避ける）。
  const enriched=useMemo(()=>computeEnrichedWatch(items,stockQuotes,metrics,watchlistAll,breakoutLevels,analysisData,marketRiskLabel,eventRiskGuard),
    [items,stockQuotes,metrics,watchlistAll,breakoutLevels,analysisData,marketRiskLabel,eventRiskGuard]);
  // 今買い時TOP5と詳細分析判定の整合性修正（2026-09-16新規、指示書1-3番）：サーバー側
  // entry_score/entryStateは監視銘柄全体をバッチ処理する軽量パイプライン（Stage1/Stage2/
  // 5分足スナップショットのみ）で計算しており、詳細分析（analyze_stock()、RSI過熱・
  // Entry Conditionsチェックリスト・押し目未形成等のCHASE RISK判定）の結果を反映していない。
  // 逆に、監視銘柄一覧・今日の注目TOP5側は既にenrichWatchRow()でこれらを統合済み
  // （2026-09-09「TOP5/監視銘柄一覧のENTRY READYが詳細分析のCHASE RISK／WAIT判定と矛盾する
  // 不具合対応」、上のenriched参照）。ここではその既存の統合結果（enr.actionStatus/
  // waitReasons/riskReasons）を「今買い時TOP5」表示にも同じ基準で適用する——新しい判定基準・
  // 新しいサーバー計算は追加しない（指示書2番「候補順位とENTRY可否は分離」、既存関数の再利用）。
  const enrichedByCode=useMemo(()=>Object.fromEntries(enriched.map(e=>[e.code,e])),[enriched]);

  // v3-4「今日の注目TOP5」：判定不能（rsScore/currentが未取得）な銘柄は無理に順位付けせず除外する。
  // RISK（過熱・急落注意）とWEAK（弱い）は「デイトレ候補」としては出さない（除外）。
  // 残りをPrimary Status優先度→RS Scoreの順で並べ、上位5件を採用する。
  const top5=useMemo(()=>rankTop5(enriched,stockQuotes),[enriched,stockQuotes]);
  const top5Debug=useMemo(()=>computeTop5Debug(enriched,stockQuotes),[enriched,stockQuotes]);
  const [top5DebugOpen,setTop5DebugOpen]=useState(false); // 指示書7番：開発用デバッグ表示（既定は折りたたみ）

  const [sortKey,setSortKey]=useState("priority");
  const sorted=useMemo(()=>{
    const arr=[...enriched];
    const byNullLast=(va,vb,desc)=>{
      if(va==null&&vb==null)return 0;if(va==null)return 1;if(vb==null)return -1;
      return desc?vb-va:va-vb;
    };
    switch(sortKey){
      case "rsScore": return arr.sort((a,b)=>byNullLast(a.rsScore,b.rsScore,true));
      case "pct": return arr.sort((a,b)=>byNullLast(a.pct,b.pct,true));
      case "sector": return arr.sort((a,b)=>(a.sector||"").localeCompare(b.sector||"",'ja'));
      case "current": return arr.sort((a,b)=>byNullLast(num(stockQuotes[a.code]?.t),num(stockQuotes[b.code]?.t),true));
      case "status": return arr.sort((a,b)=>PRIMARY_STATUS_META[a.status].order-PRIMARY_STATUS_META[b.status].order||byNullLast(a.rsScore,b.rsScore,true));
      default: // priority：今日注目すべき順（Status優先度→RS Score）
        return arr.sort((a,b)=>PRIMARY_STATUS_META[a.status].order-PRIMARY_STATUS_META[b.status].order||byNullLast(a.rsScore,b.rsScore,true));
    }
  },[enriched,sortKey]);

  // Trade Cockpit v3 Phase1（設計案19-21番）：46銘柄・279銘柄を最初から全部読ませない。
  // サマリー件数→フィルタ→上位10件デフォルト表示、の順で絞り込む。
  // v3-6：Primary Status（強さ）とAction Status（今入れるか）の2軸それぞれの件数を数える。
  const summary=useMemo(()=>{
    const c={HOT:0,ACTIVE_BREAK:0,WEAK_BREAK:0,FAILED_BREAK:0,WATCH:0,WEAK:0,
      ENTRY_READY:0,WAIT:0,RISK:0,rs70:0};
    enriched.forEach(w=>{c[w.status]=(c[w.status]||0)+1;c[w.actionStatus]=(c[w.actionStatus]||0)+1;
      if(w.rsScore!=null&&w.rsScore>=70)c.rs70++;
      // v3-9改訂：CURRENT（最新TOP15）とSEEN（本日圏外に落ちた履歴）を別カウントする。
      if(w.auto_tags?.AUTO_MOMENTUM_DAY_CURRENT)c.momentumCurrent=(c.momentumCurrent||0)+1;
      if(w.auto_tags?.AUTO_MOMENTUM_DAY_SEEN)c.momentumSeen=(c.momentumSeen||0)+1;
      if(w.auto_tags?.AUTO_BREAK_CURRENT)c.breakCurrent=(c.breakCurrent||0)+1;
      if(w.auto_tags?.AUTO_BREAK_SEEN)c.breakSeen=(c.breakSeen||0)+1;
      if(w.auto_tags?.AUTO_RS_CURRENT)c.rsCurrent=(c.rsCurrent||0)+1;
      if(w.auto_tags?.AUTO_RS_SEEN)c.rsSeen=(c.rsSeen||0)+1;
      if(w.auto_tags?.AUTO_SECTOR_LEADER_CURRENT)c.sectorCurrent=(c.sectorCurrent||0)+1;
      if(w.auto_tags?.AUTO_SECTOR_LEADER_SEEN)c.sectorSeen=(c.sectorSeen||0)+1;
      if(w.auto_tags?.AUTO_PULLBACK_CURRENT)c.pullbackCurrent=(c.pullbackCurrent||0)+1;
      if(w.auto_tags?.AUTO_PULLBACK_SEEN)c.pullbackSeen=(c.pullbackSeen||0)+1;
      if(w.auto_tags?.AUTO_REVERSAL_CURRENT)c.reversalCurrent=(c.reversalCurrent||0)+1;
      if(w.auto_tags?.AUTO_REVERSAL_SEEN)c.reversalSeen=(c.reversalSeen||0)+1;
      if(w.auto_tags?.AUTO_VOLUME_CURRENT)c.volumeCurrent=(c.volumeCurrent||0)+1;
      if(w.auto_tags?.AUTO_VOLUME_SEEN)c.volumeSeen=(c.volumeSeen||0)+1;});
    return c;
  },[enriched]);
  const [statusFilters,setStatusFilters]=useState(new Set()); // Primary Status。空集合＝フィルタなし
  const [actionFilters,setActionFilters]=useState(new Set()); // Action Status。空集合＝フィルタなし
  const [rsFilter,setRsFilter]=useState(false); // RS Score 70以上のみ
  const [marketRsFilter,setMarketRsFilter]=useState(false); // Market RS +2pt以上のみ
  const [pctFilter,setPctFilter]=useState(""); // "up" | "down" | ""
  const [sectorFilter,setSectorFilter]=useState("");
  // v3-9改訂：""＝フィルタなし／"current"＝最新TOP15のみ／"history"＝本日中に一度でもTOP15
  // 入りした銘柄（CURRENT＋SEEN）を表示。「🐒 MOMENTUM DAY」チップは"current"を、
  // 「🐒 本日履歴」チップは"history"を指す。
  const [momentumFilter,setMomentumFilter]=useState("");
  const [breakFilter,setBreakFilter]=useState(""); // ""|"current"|"history"（AUTO_BREAK版、同じ考え方）
  const [rsAutoFilter,setRsAutoFilter]=useState(""); // ""|"current"|"history"（AUTO_RS版、同じ考え方）
  const [sectorLeaderFilter,setSectorLeaderFilter]=useState(""); // ""|"current"|"history"（AUTO_SECTOR_LEADER版）
  const [pullbackFilter,setPullbackFilter]=useState(""); // ""|"current"|"history"（AUTO_PULLBACK版）
  const [reversalFilter,setReversalFilter]=useState(""); // ""|"current"|"history"（AUTO_REVERSAL版）
  const [volumeFilter,setVolumeFilter]=useState(""); // ""|"current"|"history"（AUTO_VOLUME版）
  const [showAll,setShowAll]=useState(false);
  // 2026-09-07新規（監視銘柄画面・情報整理）：スキャンボタン・詳細フィルタ・AUTOシグナル・
  // 履歴を通常は折りたたむ。既存の状態・フィルタ・スキャンのロジックは一切変更せず、
  // JSXの表示/非表示を切り替えるだけ（機能削除ではなく階層化）。
  const [scanOpen,setScanOpen]=useState(false);
  const [filterOpen,setFilterOpen]=useState(false);
  const [autoOpen,setAutoOpen]=useState(false);
  const [historyOpen,setHistoryOpen]=useState(false);
  const toggleStatusFilter=(st)=>setStatusFilters(prev=>{const n=new Set(prev);n.has(st)?n.delete(st):n.add(st);return n;});
  const toggleActionFilter=(st)=>setActionFilters(prev=>{const n=new Set(prev);n.has(st)?n.delete(st):n.add(st);return n;});
  const sectorOptions=useMemo(()=>[...new Set(enriched.map(w=>w.sector).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja')),[enriched]);
  const filtered=useMemo(()=>sorted.filter(w=>
    (statusFilters.size===0||statusFilters.has(w.status))
    &&(actionFilters.size===0||actionFilters.has(w.actionStatus))
    &&(!rsFilter||(w.rsScore!=null&&w.rsScore>=70))
    &&(!marketRsFilter||(w.marketRS!=null&&w.marketRS>=2))
    &&(!pctFilter||(pctFilter==="up"?(w.pct!=null&&w.pct>0):(w.pct!=null&&w.pct<0)))
    &&(!sectorFilter||w.sector===sectorFilter)
    &&(!momentumFilter||(momentumFilter==="current"
        ?!!w.auto_tags?.AUTO_MOMENTUM_DAY_CURRENT
        :!!(w.auto_tags?.AUTO_MOMENTUM_DAY_CURRENT||w.auto_tags?.AUTO_MOMENTUM_DAY_SEEN)))
    &&(!breakFilter||(breakFilter==="current"
        ?!!w.auto_tags?.AUTO_BREAK_CURRENT
        :!!(w.auto_tags?.AUTO_BREAK_CURRENT||w.auto_tags?.AUTO_BREAK_SEEN)))
    &&(!rsAutoFilter||(rsAutoFilter==="current"
        ?!!w.auto_tags?.AUTO_RS_CURRENT
        :!!(w.auto_tags?.AUTO_RS_CURRENT||w.auto_tags?.AUTO_RS_SEEN)))
    &&(!sectorLeaderFilter||(sectorLeaderFilter==="current"
        ?!!w.auto_tags?.AUTO_SECTOR_LEADER_CURRENT
        :!!(w.auto_tags?.AUTO_SECTOR_LEADER_CURRENT||w.auto_tags?.AUTO_SECTOR_LEADER_SEEN)))
    &&(!pullbackFilter||(pullbackFilter==="current"
        ?!!w.auto_tags?.AUTO_PULLBACK_CURRENT
        :!!(w.auto_tags?.AUTO_PULLBACK_CURRENT||w.auto_tags?.AUTO_PULLBACK_SEEN)))
    &&(!reversalFilter||(reversalFilter==="current"
        ?!!w.auto_tags?.AUTO_REVERSAL_CURRENT
        :!!(w.auto_tags?.AUTO_REVERSAL_CURRENT||w.auto_tags?.AUTO_REVERSAL_SEEN)))
    &&(!volumeFilter||(volumeFilter==="current"
        ?!!w.auto_tags?.AUTO_VOLUME_CURRENT
        :!!(w.auto_tags?.AUTO_VOLUME_CURRENT||w.auto_tags?.AUTO_VOLUME_SEEN)))
  ),[sorted,statusFilters,actionFilters,rsFilter,marketRsFilter,pctFilter,sectorFilter,momentumFilter,breakFilter,rsAutoFilter,sectorLeaderFilter,pullbackFilter,reversalFilter,volumeFilter]);
  const TOP_N=10;
  const displayed=showAll?filtered:filtered.slice(0,TOP_N);
  const hasFilter=statusFilters.size>0||actionFilters.size>0||rsFilter||marketRsFilter||!!pctFilter||!!sectorFilter||!!momentumFilter||!!breakFilter||!!rsAutoFilter||!!sectorLeaderFilter||!!pullbackFilter||!!reversalFilter||!!volumeFilter;

  // 今日の候補（trade_candidates。8番）
  const [candidates,setCandidates]=useState([]);
  const [loadingCandidates,setLoadingCandidates]=useState(true);
  const [candidateStatusPick,setCandidateStatusPick]=useState({}); // code -> 選択中のstatus
  const loadCandidates=async()=>{
    setLoadingCandidates(true);
    try{
      const r=await fetch("/api/trade-candidates");
      if(r.ok){const d=await r.json();setCandidates(Array.isArray(d.candidates)?d.candidates:[]);}
    }catch(e){}
    setLoadingCandidates(false);
  };
  useEffect(()=>{loadCandidates();},[]);
  const saveCandidate=async(w)=>{
    const status=candidateStatusPick[w.code]||"WATCH";
    try{
      await fetch("/api/trade-candidates/save",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({code:w.code,name:w.name,status,
          rs_score:w.rsScore,market_rs:w.marketRS,sector_rs:w.sectorRS,
          sector:w.sector||null,margin_ratio:analysisData?.[w.code]?.tradeRules?.marginRatio??null})});
      loadCandidates();
    }catch(e){}
  };
  const removeCandidate=async(id)=>{
    try{
      await fetch("/api/trade-candidates/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})});
      loadCandidates();
    }catch(e){}
  };

  // 仮想IN（Trade Cockpit v2 Phase7・設計案12・40番）：見送り銘柄も含めて「今エントリーしたら」を
  // 記録し、後から結果を追跡できるようにする。実際の売買ではなく記録のみ（実売買は「記録」ボタン→
  // 投資判断ログ／記録タブで別途行う）。
  const virtualEntry=async(w)=>{
    const status=candidateStatusPick[w.code]||"WATCH";
    const price=num(stockQuotes[w.code]?.t);
    try{
      await fetch("/api/trade-candidates/save",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({code:w.code,name:w.name,status,
          rs_score:w.rsScore,market_rs:w.marketRS,sector_rs:w.sectorRS,
          sector:w.sector||null,margin_ratio:analysisData?.[w.code]?.tradeRules?.marginRatio??null,
          virtual_entry_price:price,virtual_entry_time:new Date().toISOString()})});
      loadCandidates();
    }catch(e){}
  };
  const [recordMsg,setRecordMsg]=useState("");
  // 「記録」（Trade Cockpit v2 Phase5・設計案39番）：監視銘柄の行から直接、当日の投資判断ログへ
  // 銘柄評価を1件追加する（投資判断ログタブでの手動入力を省略できるショートカット）。
  const recordToLog=async(w)=>{
    const qt=stockQuotes[w.code]||{};
    try{
      const r=await fetch("/api/investment-log/quick-judgment",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({judgment:{
          code:w.code,name:w.name,category:"監視",
          execution_status:candidateStatusPick[w.code]||"WATCH",
          entry_reason:`監視銘柄タブから記録（RS Score ${w.rsScore??"—"}・現在値${num(qt.t)??"—"}）`,
        }})});
      const d=await r.json();
      setRecordMsg(d.judgmentId?`${w.code} を投資判断ログに記録しました`:"記録に失敗しました");
    }catch(e){setRecordMsg("記録に失敗しました");}
    setTimeout(()=>setRecordMsg(""),2500);
  };

  // 仮想IN済み銘柄のチェックポイント記録（Trade Cockpit v2 Phase7・設計案40番）
  const CHECKPOINT_LABELS=[["30m","30分後"],["1h","1時間後"],["close","大引け"],["next_day","翌営業日"],["3d","3営業日後"],["5d","5営業日後"]];
  const recordCheckpoint=async(candidate,label)=>{
    const price=num(stockQuotes[candidate.code]?.t);
    if(price==null){alert("現在値が取得できていません（自動更新をお待ちください）");return;}
    try{
      await fetch("/api/trade-candidates/checkpoint",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({id:candidate.id,label,price})});
      loadCandidates();
    }catch(e){}
  };

  const fmtPt=(v)=>v==null?"—":(v>0?"+":"")+v.toFixed(1);

  // ChatGPT連携（Phase6・設計案44-45番）：銘柄相談用にコピー。有料AI APIは呼ばず、テキストを
  // 生成してクリップボードにコピーするだけ。
  const [consultMsg,setConsultMsg]=useState("");
  const copyConsult=async(w)=>{
    const qt=stockQuotes[w.code]||{};
    const t=num(qt.t),p=num(qt.p);
    const meta=PRIMARY_STATUS_META[w.status];
    const actionMeta=ACTION_STATUS_META[w.actionStatus];
    const reasonTxt=w.actionStatus==="RISK"?w.riskReasons.map(r=>RISK_REASON_META[r]).join("/")
      :w.actionStatus==="WAIT"?w.waitReasons.map(r=>WAIT_REASON_META[r]).join("/"):null;
    const lines=[
      `【Trade Cockpit 場中相談】${new Date().toLocaleString("ja-JP")}`,"",
      `銘柄: ${w.code} ${w.name}（${w.sector||"—"}）`,
      `現在値: ${t!=null?t.toLocaleString():"—"}　前日比: ${w.pct!=null?(w.pct>0?"+":"")+w.pct.toFixed(2)+"%":"—"}`,
      `Market RS: ${fmtPt(w.marketRS)}pt　Sector RS: ${fmtPt(w.sectorRS)}pt　RS Score: ${w.rsScore??"—"}`,
      `Status: ${meta.icon} ${meta.label}${actionMeta.label?`　${actionMeta.icon} ${actionMeta.label}`:""}${reasonTxt?`（${reasonTxt}）`:""}`,"",
    ];
    if(activeRules?.length){lines.push("投資ルール：");activeRules.forEach(t=>lines.push(`・${t}`));lines.push("");}
    lines.push("質問：この銘柄、今入るのどう？");
    const ok=await copyText(lines.join("\n"));
    setConsultMsg(ok?`${w.code} をコピーしました`:"コピーに失敗しました");
    setTimeout(()=>setConsultMsg(""),2500);
  };

  // v3-4（ChatGPT連携の再配置）：「今日のTOP5を相談」。TOP5各銘柄の詳細に加え、
  // 監視銘柄全体のサマリー（summary、既に画面上部に表示している件数と同じ値）も含める。
  const copyWatchTop5Consult=async()=>{
    // 2026-09-09新規（判断エンジン全画面統合、指示書4番）：候補ごとにフルコンテキストは
    // 取得せず、event_risk・直近ネガティブニュース・行動警告の3フラグだけを1回のAPI呼び
    // 出しでまとめて取得する（TOP5の順位自体は変更せず、補助フラグとしてのみ利用）。
    const sectorMap=Object.fromEntries(top5.map(w=>[w.code,w.sector||null]));
    const flags=await fetchJsonSafe("/api/knowledge-context/top5-flags",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({codes:top5.map(w=>w.code),sectorMap})}).then(d=>(d&&d.flags)||{}).catch(()=>({}));
    await copyChatGPTPayload("今日のTOP5を相談","watchlist_top5",{
      watchlist_summary:{total:items.length,...summary},
      top5:top5.map(w=>({
        code:w.code,name:w.name,current:num(stockQuotes[w.code]?.t),
        pct_change:w.pct,rs_score:w.rsScore,status:w.status,
        grade:lightweightGrade(w),action:lightweightAction(w),reason:lightweightReason(w),
        knowledge_flags:flags[w.code]||null,
      })),
    },setConsultMsg);
  };

  // 2026-09-03改善：Actionボタン群（9個）を「⋮」メニューに集約し、横幅・行高を大幅に節約する。
  const [openMenuFor,setOpenMenuFor]=useState(null);
  useEffect(()=>{
    if(!openMenuFor)return;
    const close=()=>setOpenMenuFor(null);
    window.addEventListener("click",close);
    return ()=>window.removeEventListener("click",close);
  },[openMenuFor]);
  // v3-9続き（2026-09-05・PHASE 7 MOBILE/PWA）：390px前後のスマホでは横長テーブルをそのまま
  // 縮小せず、専用compact card表示に切り替える（.watch-table-desktop/.watch-table-mobileの
  // CSS @media切り替え、下部参照）。詳細情報（対市場/対セクター/セクター/理由）はタップで
  // 展開する。既存のenrichWatchRow等の判定ロジックには一切触れず、表示だけの追加。
  const [expandedCode,setExpandedCode]=useState(null);
  // v3-9続き（2026-09-07・監視銘柄→ポジション連携）：「ポジション追加」モーダル。監視銘柄は
  // そのまま残し、portfolioへコピーするだけ（watchlistからの削除・移動はしない）。
  const [positionEntryFor,setPositionEntryFor]=useState(null); // {code,name,market}

  return <div style={{marginTop:18}}>
    <div style={{display:"flex",alignItems:"center",gap:6}}>
      <div className="sec-head" style={{marginBottom:0}}>監視銘柄　{items.length}件</div>
      <span style={{fontSize:12,color:"var(--inkFaint)",cursor:"help",border:"1px solid var(--rule)",borderRadius:"50%",width:16,height:16,display:"inline-flex",alignItems:"center",justifyContent:"center"}}
        title="「日本市場」タブの「監視銘柄」ボタン、または出来高ブレイクアウト条件（直近3か月高値を出来高1.5倍以上で上抜け）への自動該当で追加されます（日本市場のみ対象）。Status・RS Scoreは日経平均・所属セクター平均との当日騰落率の差から簡易算出（詳しい分析は「分析」ボタンから）。">？</span>
      {consultMsg && <span style={{fontSize:12,color:"var(--accent)",fontWeight:700}}>{consultMsg}</span>}
      {recordMsg && <span style={{fontSize:12,color:"var(--accent)",fontWeight:700}}>{recordMsg}</span>}
      {/* 2026-09-14新規：この一覧が実際に更新され続けているかをその場で確認できる表示
          （調査依頼：バックエンドが動いていることではなく、ユーザーが見る画面に表示されること）。 */}
      <span style={{fontSize:11,color:updateStatusLabel.color}}>{updateStatusLabel.text}</span>
      {lastPollStats && <span style={{fontSize:11,color:"var(--inkFaint)"}}>（前回poll：{lastPollStats.updated}/{lastPollStats.total}件更新）</span>}
      <button className="ghost" style={{fontSize:10,padding:"1px 6px"}} onClick={()=>setDebugUpdatesOpen(v=>!v)}>🔧 更新デバッグ {debugUpdatesOpen?"▲":"▼"}</button>
    </div>

    {debugUpdatesOpen && <div style={{fontSize:11,background:"var(--panelAlt,#f5f5f5)",border:"1px solid var(--rule)",borderRadius:6,padding:"6px 10px",marginTop:4,marginBottom:8}}>
      {/* 2026-09-18新規（運用診断：iPhoneがserver watchTargetsを取り込めない不具合調査）：
          PC/iPhoneを並べて見比べ、backend build・isWatchTarget対応有無・merge集計を
          その場で突き合わせられるようにする。 */}
      <div style={{marginBottom:6,paddingBottom:6,borderBottom:"1px dashed var(--rule)"}}>
        <div style={{fontWeight:700}}>診断：watchTargets同期</div>
        <div>backend build: <span className="mono">{appVersionInfo?.build||"（未取得）"}</span></div>
        <div>backend isWatchTarget対応: {appVersionInfo?.hasWatchTargetSupport==null?"（未取得）":(appVersionInfo.hasWatchTargetSupport?"OK":"⚠ 未対応の可能性")}</div>
        {watchTargetsDiag && <>
          <div>/api/watchlist応答にisWatchTargetフィールドあり: {watchTargetsDiag.backendHasIsWatchTargetField?"OK":"⚠ 無し（サーバー再起動が必要な可能性）"}</div>
          <div>merge前のローカル件数: {watchTargetsDiag.localCountBeforeMerge} / サーバー件数: {watchTargetsDiag.serverCount} / merge後: {watchTargetsDiag.mergedCount}（{watchTargetsDiag.hydratedAt}）</div>
          {/* 2026-09-18追記：push（差分のサーバーへの書き戻し）が実際に成功したかをその場で確認する。 */}
          {watchTargetsDiag.pushPhase==="pushing" && <div>差分のサーバーpush中…</div>}
          {watchTargetsDiag.pushPhase==="done" && <>
            <div>push結果：試行{watchTargetsDiag.pushAttempted}件中 成功{watchTargetsDiag.pushSucceeded}件・失敗{watchTargetsDiag.pushFailedCount}件</div>
            <div>push後の再取得でのサーバー件数: {watchTargetsDiag.serverCountAfterPush??"（取得失敗）"}
              {watchTargetsDiag.serverCountAfterPush===watchTargetsDiag.mergedCount?" ✅ 一致":" ⚠ merge後の件数と不一致"}</div>
            {watchTargetsDiag.pushFailedCount>0 && (()=>{
              const notInMaster=watchTargetsDiag.pushFailedSample.filter(f=>f.classification==="A_not_in_jp_master");
              const inMasterButFailed=watchTargetsDiag.pushFailedSample.filter(f=>f.classification==="B_in_master_but_failed");
              return <div style={{color:"var(--down)"}}>
                {notInMaster.length>0 && <div style={{marginTop:2}}>
                  A: JP監視銘柄マスターに存在しない（{notInMaster.length}件、旧localStorage残骸の可能性）：
                  <span className="mono">{notInMaster.map(f=>f.code).join("・")}</span>
                  <button className="iconbtn" style={{marginLeft:6}}
                    onClick={()=>{if(confirm(`${notInMaster.length}件をローカルの監視対象から削除します（監視銘柄マスター自体からは削除しません）。よろしいですか？`))onRemoveOrphanedWatchTargets?.(notInMaster.map(f=>f.code));}}>
                    このローカル残骸を削除
                  </button>
                </div>}
                {inMasterButFailed.length>0 && <div style={{marginTop:2}}>
                  B: マスターには存在するがpush失敗（{inMasterButFailed.length}件、要調査）：
                  <span className="mono">{inMasterButFailed.map(f=>`${f.code}(${f.masterName||"?"},status=${f.status})`).join("・")}</span>
                </div>}
              </div>;
            })()}
          </>}
        </>}
      </div>
      <div style={{fontWeight:700,marginBottom:4}}>指定5銘柄の更新状況（quoteFetchedAt＝frontend stateが最後に新しい値を受け取った時刻）</div>
      {lastFastQuoteStats && <div style={{marginBottom:4,color:"var(--inkSoft)"}}>
        前回FAST poll：requested={lastFastQuoteStats.requested} tachibana={lastFastQuoteStats.tachibana} fallback_cache={lastFastQuoteStats.fallback_cache} fallback_yf={lastFastQuoteStats.fallback_yf} failed={lastFastQuoteStats.failed} ({lastFastQuoteStats.duration_ms}ms)
      </div>}
      <table style={{width:"100%",borderCollapse:"collapse"}}><tbody>
        {DEBUG_WATCH_CODES.map(code=>{
          const it=items.find(w=>w.code===code);
          const q=stockQuotes[code];
          const fa=q?.quoteFetchedAt?new Date(q.quoteFetchedAt):null;
          const ago=fa?Math.round((nowTick-fa.getTime())/1000):null;
          return <tr key={code} style={{borderTop:"1px solid var(--rule)"}}>
            <td style={{padding:"2px 6px"}}>{code}</td>
            <td style={{padding:"2px 6px"}}>{it?.name||"(監視対象外)"}</td>
            <td style={{padding:"2px 6px"}}>{q?.t??"—"}</td>
            {/* Phase QF-1新規：source（TACHIBANA/cache/yfinance_fallback）をデバッグ表示 */}
            <td style={{padding:"2px 6px",fontWeight:700,color:q?.source==="tachibana"?"#2e7d32":q?.source?"var(--warn)":undefined}}>
              {q?.source?q.source.toUpperCase():"—"}</td>
            <td style={{padding:"2px 6px"}}>{fa?fa.toLocaleTimeString("ja-JP"):"未取得"}</td>
            {/* 注：これは値の上昇/下落ではなく「新鮮さ」の表示のため、相場配色（--up/--down）は使わない */}
            <td style={{padding:"2px 6px",color:ago==null?undefined:ago<45?"#2e7d32":ago<90?"var(--warn)":(isJstMarketHours()?"#c62828":"var(--inkSoft)")}}>
              {ago==null?"—":`${ago}秒前`}</td>
          </tr>;
        })}
      </tbody></table>
    </div>}

    {/* 2026-09-09新規（日次投資レビュー、指示書21番）：朝一チェックの入口となるこのタブの
        最上部に「昨日までの反省」を表示する。監視銘柄タブは実質的な朝一チェック画面のため
        ここに置く。反省が無ければ何も表示しない。 */}
    <RecentReflectionsNote/>

    {/* Yaaman Style / ヤーマン式（2026-09-12新規、指示書9番：UI表示順序 1.Market Mode
        2.Sector Rotation 3.明日/今日の注目テーマ 4.今日の注目TOP5 5.今買い時TOP5
        6.通常監視銘柄）。Market Mode・Sector Rotationはページ最上部に常設済み（App直下）
        のため、この監視銘柄タブ内では3番目＝TOP5群より前に置く。 */}
    <YaamanThemePanel nextDayThemes={yaamanNextDayThemes} todayThemes={yaamanTodayThemes}
      watchlistAll={watchlistAll} onAddToWatchlist={onAddToWatchlist} onOpenAnalysis={onOpenAnalysis}/>

    {/* v3-4「今日の注目TOP5」：既存のenrichWatchRow()出力のみから軽量に順位付け（新規のサーバー
        計算・重い分析呼び出しなし）。クリックで既存のonOpenAnalysis（analysisTargetsに追加＋
        トレード分析タブへ遷移）を再利用し、コード入力なしで直接トレード分析に飛べる。 */}
    <div style={{background:"var(--card)",border:"1px solid var(--rule)",borderRadius:6,padding:"12px 14px",marginTop:12}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:6,marginBottom:8}}>
        <div style={{fontWeight:800,fontSize:13.5}}>🎯 今日の注目 TOP5</div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <button className="chip" style={{fontSize:10.5}} onClick={()=>setTop5DebugOpen(v=>!v)}>🔧 デバッグ {top5DebugOpen?"▲":"▼"}</button>
          <button className="action-btn" onClick={copyWatchTop5Consult} disabled={top5.length===0}>🤖 今日のTOP5を相談</button>
        </div>
      </div>
      {top5DebugOpen && <div style={{fontSize:10.5,color:"var(--inkFaint)",marginBottom:8,padding:"4px 6px",background:"var(--bg)",borderRadius:4,display:"flex",flexWrap:"wrap",gap:"2px 12px"}} className="mono">
        <span>scanned: {top5Debug.scanned}</span>
        <span>positive_return_candidates: {top5Debug.positive_return_candidates}</span>
        <span>negative_excluded: {top5Debug.negative_excluded}</span>
        <span>exception_negative_candidates: {top5Debug.exception_negative_candidates}</span>
        <span>risk_excluded: {top5Debug.risk_excluded}</span>
        <span>weak_excluded: {top5Debug.weak_excluded}</span>
        <span>final_top5: {top5Debug.final_top5}</span>
      </div>}
      {top5.length===0
        ? <div style={{fontSize:12,color:"var(--inkFaint)"}}>判定可能な銘柄がまだありません（データ取得中か、RISK/WEAKのみの状態です）。</div>
        : <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {top5.map((w,i)=>{
              const grade=lightweightGrade(w);
              const action=lightweightAction(w);
              const actionMeta=ENTRY_STRATEGY_META[action];
              const qt=stockQuotes[w.code]||{};
              const cur=num(qt.t);
              {/* v3-9続き（PHASE 7 MOBILE/PWA・STEP1監査で発見）：flex:1のreason要素は
                  デフォルトのmin-width:autoにより、狭い画面で他の固定幅要素を押しのけて
                  横スクロールを発生させていた。flexWrap+minWidth:0で折り返し・省略を機能させる。 */}
              return <div key={w.code} onClick={()=>onOpenAnalysis(w.code,w.market)}
                style={{display:"flex",alignItems:"center",gap:10,padding:"7px 8px",borderRadius:4,cursor:"pointer",
                  background:"var(--bg)",border:w.isResilienceException?"1px solid var(--accent)":"1px solid var(--rule)",flexWrap:"wrap"}}
                title="クリックでトレード分析へ">
                <div style={{fontSize:13,fontWeight:800,color:"var(--inkFaint)",width:16,textAlign:"center"}}>{i+1}</div>
                <div style={{width:56,fontSize:11.5,color:"var(--inkSoft)"}} className="mono">{w.code}</div>
                <div style={{flex:"0 0 auto",minWidth:90,fontSize:12.5,fontWeight:700}}>{w.name}</div>
                <div className="mono" style={{width:78,fontSize:12.5,textAlign:"right"}}>{cur!=null?cur.toLocaleString():"—"}</div>
                <div className="mono" style={{width:60,fontSize:12,textAlign:"right",color:w.pct==null?"var(--inkFaint)":w.pct>0?"var(--up)":w.pct<0?"var(--down)":"var(--inkFaint)"}}>
                  {w.pct!=null?(w.pct>0?"+":"")+w.pct.toFixed(2)+"%":"—"}
                </div>
                {grade && <span style={{fontSize:11,fontWeight:800,color:GRADE_COLOR[grade],border:`1px solid ${GRADE_COLOR[grade]}`,borderRadius:3,padding:"1px 6px"}}>{grade}</span>}
                {actionMeta && <span style={{fontSize:10.5,fontWeight:700,color:actionMeta.color,border:`1px solid ${actionMeta.color}`,borderRadius:3,padding:"1px 6px",whiteSpace:"nowrap"}}>{actionMeta.label}</span>}
                {w.isResilienceException && <span style={{fontSize:10,fontWeight:700,color:"var(--accent)",whiteSpace:"nowrap"}} title="前日比マイナスだが、地合い悪化の中で対市場・対セクターとも明確に優位な逆行耐性候補（通常の値上がり銘柄とは別枠の例外表示）">🛡 逆行耐性例外</span>}
                <div style={{flex:"1 1 140px",minWidth:0,fontSize:11,color:"var(--inkSoft)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{lightweightReason(w)}</div>
                {/* 2026-09-09新規（監視銘柄・市場チャートの時間足切替、対象画面「TOP5」対応）：
                    既存のonOpenChart（監視銘柄一覧の「⋮」チャートボタンと同じ、共通ChartModalを開くだけ）
                    をそのまま再利用。行クリック（トレード分析へ）と競合しないようstopPropagation。 */}
                <button className="iconbtn" style={{fontSize:11}} title="チャートを開く"
                  onClick={e=>{e.stopPropagation();onOpenChart(w);}}>📈</button>
              </div>;
            })}
          </div>}
    </div>

    {/* Market Intelligence Timeline Phase2-C（今買い時TOP5＋Thesis永続化、2026-09-10新規）：
        上の「今日の注目TOP5」（クライアント側enrichWatchRow()だけの軽量ロジック、v3-4）とは
        別物の、サーバー側ENTRY SCORE（0-100）に基づく独立パネル。既存の今日の注目TOP5は
        無変更のまま残し、新しい仕組みは追加パネルとして併存させる（破壊しない）。 */}
    <div style={{background:"var(--card)",border:"1px solid var(--rule)",borderRadius:6,padding:"12px 14px",marginTop:12}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:6,marginBottom:8}}>
        <div style={{fontWeight:800,fontSize:13.5}}>🎯 今買い時TOP5<span style={{fontWeight:400,fontSize:11,color:"var(--inkFaint)"}}>（entry_score・Current）</span></div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          {thesisStats && thesisStats.totalFinalized>0 && <span style={{fontSize:11,color:"var(--inkFaint)"}}>
            直近30日 勝率{thesisStats.winRate}%（確定{thesisStats.totalFinalized}件）
          </span>}
          {entryResult && <button className="chip" style={{fontSize:10.5}} onClick={()=>setEntryDebugOpen(v=>!v)}>🔧 デバッグ {entryDebugOpen?"▲":"▼"}</button>}
          <button className="action-btn" style={{fontSize:12}} disabled={entryScanning} onClick={onEntryScan}>
            {entryScanning?"🎯 スキャン中…":"🎯 今買い時TOP5を更新"}
          </button>
        </div>
      </div>
      <div style={{fontSize:10.5,color:"var(--inkFaint)",marginBottom:8}}>
        「一番上がっている銘柄」ではなく「今から入ってもリスクリワードが良い銘柄」を上位表示します。ENTRY READY最優先、次点でスコアの高いブレイク待ち・押し目待ち候補も表示します（候補数は0〜5件、必ず5件揃える表示ではありません）。
      </div>
      {/* 場中リアルタイム化指示書STEP12：最終評価時刻・評価済件数・更新遅延の可視化。
          「今のランキングなのか？」を一目で確認できるようにする（指示書の要求そのもの）。 */}
      {entryResult && entryResult.generatedAt && <div style={{fontSize:10.5,color:entryResult.updateDelayWarning?"var(--down)":"var(--inkFaint)",marginBottom:6,display:"flex",flexWrap:"wrap",gap:"2px 10px",alignItems:"center"}}>
        <span>最終評価 {new Date(entryResult.generatedAt).toLocaleTimeString("ja-JP",{hour12:false})}</span>
        {entryResult.scoredCount!=null && <span>評価済 {entryResult.readyCount??"—"}/{entryResult.watchlistCount??entryResult.scoredCount}</span>}
        {entryResult.updateDelayWarning && <span style={{fontWeight:700}}>⚠ 更新遅延</span>}
      </div>}
      {entryResult && (entryResult.dataStale||entryResult.anySymbolMarketDataStale) && <div style={{fontSize:11,color:"var(--down)",fontWeight:700,marginBottom:6}}>
        ⚠ 元データが古いため、一部の「今すぐ買える／準備完了」は安全側で「データ更新遅延」表示に変更しています。
      </div>}
      {entryResult && entryDebugOpen && <div style={{fontSize:10.5,color:"var(--inkFaint)",marginBottom:8,padding:"4px 6px",background:"var(--bg)",borderRadius:4,display:"flex",flexWrap:"wrap",gap:"2px 12px"}} className="mono">
        <span>trigger: {entryResult.trigger??"—"}</span>
        <span>duration: {entryResult.durationMs!=null?entryResult.durationMs+"ms":"—"}</span>
        <span>ranking_age: {entryResult.rankingAgeSec!=null?entryResult.rankingAgeSec+"s":"—"}</span>
        <span>scanned: {entryResult.debug?.scanned??"—"}</span>
        <span>entry_ready: {entryResult.debug?.entry_ready??"—"}</span>
        <span>active_break: {entryResult.debug?.active_break??"—"}</span>
        <span>watch_near_ready: {entryResult.debug?.watch_near_ready??"—"}</span>
        <span>risk_excluded: {entryResult.debug?.risk_excluded??"—"}</span>
        <span>weak_excluded: {entryResult.debug?.weak_excluded??"—"}</span>
        <span>provisional_excluded: {entryResult.debug?.provisional_excluded??"—"}</span>
        <span>final_candidates: {entryResult.debug?.final_candidates??"—"}</span>
        {/* Event Risk Guard（2026-09-17新規）：運用確認用。次回実際の重要イベント日に
            HIGH/MEDIUMが発火しているかをここで確認できる。 */}
        <span>event_risk_market: {entryResult.debug?.eventRiskGuardDiagnostics?.marketLevel??"—"}
          ({entryResult.debug?.eventRiskGuardDiagnostics?.marketScore??"—"})</span>
        <span>event_risk_HIGH: {entryResult.debug?.eventRiskGuardDiagnostics?.highCount??"—"}</span>
        <span>event_risk_MEDIUM: {entryResult.debug?.eventRiskGuardDiagnostics?.mediumCount??"—"}</span>
        <span>event_risk_LOW: {entryResult.debug?.eventRiskGuardDiagnostics?.lowCount??"—"}</span>
      </div>}
      {!entryResult
        ? <div style={{fontSize:12,color:"var(--inkFaint)"}}>「今買い時TOP5を更新」を押すと、監視銘柄の中から現在最もエントリー条件が整っている候補をENTRY SCOREで算出します。</div>
        : <>
          {entryResult.dataQuality==="DEGRADED" && <div style={{fontSize:11,color:"var(--down)",fontWeight:700,marginBottom:6}}>⚠ データ取得が不十分なため、一部の判定は暫定（PROVISIONAL）です。</div>}
          {entryResult.entryReadyTop5.length===0
            ? <div style={{fontSize:12,color:"var(--inkFaint)"}}>現在ENTRY条件を満たす銘柄はありません。</div>
            : <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:entryResult.watchCandidates.length>0?10:0}}>
                {entryResult.entryReadyTop5.map(c=>{
                  const {effectiveEntryState,confirmationOverrideReasons,confirmationUnblockConditions}=
                    resolveTop5EntryStateOverride(c.entryState,enrichedByCode[c.code]);
                  const stMeta=ENTRY_STATE_META[effectiveEntryState]||{label:effectiveEntryState,color:"var(--inkFaint)"};
                  const isException=(c.reasons||[]).some(r=>r.includes("逆行耐性例外"));
                  const bd=c.scoreBreakdown||{};
                  const expanded=expandedScoreCode===c.code;
                  return <div key={c.code} style={{padding:"7px 8px",borderRadius:4,
                    background:"var(--bg)",border:isException?"1px solid var(--accent)":"1px solid var(--rule)"}}>
                    <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",cursor:"pointer"}}
                      onClick={()=>setExpandedScoreCode(expanded?null:c.code)} title="クリックでスコア内訳を表示">
                      <div style={{fontSize:13,fontWeight:800,color:"var(--inkFaint)",width:16,textAlign:"center"}}>{c.rank}</div>
                      <div style={{width:56,fontSize:11.5,color:"var(--inkSoft)"}} className="mono">{c.code}</div>
                      <div style={{flex:"0 0 auto",minWidth:90,fontSize:12.5,fontWeight:700}}>{c.name}</div>
                      <div className="mono" style={{width:70,fontSize:12.5,textAlign:"right"}} title={`株価 ${fmtHms(c.quoteAt)||"--"}${c.priceOverlaid?"（最新quoteで更新済み）":""} ／ スコア算出 ${fmtHms(c.scoredAt||entryResult?.generatedAt)||"--"}${c.scoredPrice!=null?`（算出時の価格 ${c.scoredPrice.toLocaleString()}）`:""}`}>{c.current!=null?c.current.toLocaleString():"—"}{(c.scoreStale||(c.priceDriftPct!=null&&Math.abs(c.priceDriftPct)>=0.5))&&<span style={{display:"block",fontSize:9.5,color:"var(--down)"}}>{c.scoreStale?"再評価中":""}{c.priceDriftPct!=null&&c.priceDriftPct!==0?`（算出から${c.priceDriftPct>0?"+":""}${c.priceDriftPct}%）`:""}</span>}</div>
                      <span className="mono" style={{width:56,fontSize:12,textAlign:"right",color:c.changePct==null?"var(--inkFaint)":c.changePct>0?"var(--up)":c.changePct<0?"var(--down)":"var(--inkFaint)"}}>
                        {c.changePct!=null?(c.changePct>0?"+":"")+c.changePct.toFixed(2)+"%":"—"}
                      </span>
                      <span style={{fontSize:12,fontWeight:800,color:"var(--accent)",border:"1px solid var(--accent)",borderRadius:3,padding:"1px 6px"}}>SCORE {c.entryScore}</span>
                      <span style={{fontSize:10.5,fontWeight:700,color:stMeta.color,border:`1px solid ${stMeta.color}`,borderRadius:3,padding:"1px 6px",whiteSpace:"nowrap"}}>{stMeta.label}</span>
                      {/* Market Intelligence Phase9新規（指示書21・38番）：entry_score自体は
                          不変、隣に並べるだけの追加専用表示。 */}
                      {c.eventSupport && <span style={{fontSize:10,fontWeight:700,whiteSpace:"nowrap",
                        color:c.eventSupport==="AVOID_CHASE"?"var(--down)":c.eventSupport==="STRONG"?"var(--up)":"var(--inkSoft)"}}>
                        Event Support: {ENTRY_EVENT_SUPPORT_LABELS[c.eventSupport]||c.eventSupport}
                      </span>}
                      {/* Trade Experience Learning新規（指示書7・20番）：entry_score自体は不変、
                          隣に並べるだけの補助スコア（0〜10）。 */}
                      {c.experienceScore!=null && <span style={{fontSize:10,fontWeight:700,whiteSpace:"nowrap",color:"var(--inkSoft)"}}
                        title={c.experienceSummary&&c.experienceSummary.similar_count?`類似${c.experienceSummary.similar_count}件・勝率${c.experienceSummary.win_rate!=null?Math.round(c.experienceSummary.win_rate*100)+"%":"—"}`:"類似トレードがまだありません"}>
                        経験値 {c.experienceScore}/10
                      </span>}
                      {c.analysisConfidence==="LOW" && <span style={{fontSize:10,color:"var(--down)"}}>確信度LOW</span>}
                      {isException && <span style={{fontSize:10,fontWeight:700,color:"var(--accent)"}}>⚠逆行耐性例外</span>}
                      {/* 値幅余地・反転モメンタム選考（2026-09-16新規、指示書9番）：セットアップ
                          タイプ＋値幅余地区分。「強いけど今から追う対象ではない」を一目で示す。 */}
                      {c.setupType && SETUP_TYPE_META[c.setupType] && <span style={{fontSize:10,fontWeight:700,whiteSpace:"nowrap",color:SETUP_TYPE_META[c.setupType].color}}>
                        {SETUP_TYPE_META[c.setupType].label}
                      </span>}
                      {c.roomToMove && <span style={{fontSize:10,fontWeight:700,whiteSpace:"nowrap",color:(ROOM_TO_MOVE_META[c.roomToMove]||ROOM_TO_MOVE_META.UNKNOWN).color}}>
                        {(ROOM_TO_MOVE_META[c.roomToMove]||ROOM_TO_MOVE_META.UNKNOWN).label}
                      </span>}
                      {/* Event Risk Guard（2026-09-17新規、PHASE 8）：entry_score自体は既に
                          server側で反映済み（riskEvent内訳）、ここは追加表示のみ。LOWは非表示。 */}
                      {c.eventRiskLevel&&c.eventRiskLevel!=="LOW" && <span style={{fontSize:10,fontWeight:700,whiteSpace:"nowrap",
                          color:c.eventRiskLevel==="HIGH"?"var(--down)":"var(--warn)"}}
                          title={(c.eventRiskReasons||[]).join("・")}>
                        {c.eventRiskLevel==="HIGH"?"🔴 EVENT HIGH":"🟠 EVENT MEDIUM"}
                      </span>}
                      <div style={{flex:"1 1 140px",minWidth:0,fontSize:11,color:"var(--inkSoft)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                        {(c.reasons||[]).filter(r=>!r.includes("逆行耐性例外")).join("・")}{c.risks&&c.risks.length>0?"　⚠"+c.risks.join("・"):""}
                      </div>
                      <span style={{fontSize:10,color:"var(--inkFaint)"}}>{expanded?"▲内訳を閉じる":"▼内訳"}</span>
                    </div>
                    {/* 分析順位と実戦順位の区別（2026-09-24）：analysis_top5は余力を見ない分析順位、
                        actionable_top5は現在の余力で実際に買える実戦順位。 */}
                    {(c.actionableRank!=null||c.analysisRank!=null) && <div style={{marginTop:4,display:"flex",flexWrap:"wrap",gap:"2px 12px",fontSize:10.5}} className="mono">
                      <span>分析評価 {c.entryScore}（分析{c.analysisRank!=null?c.analysisRank+"位":"TOP5圏外"}）</span>
                      <span style={{fontWeight:800,color:"var(--accent)"}}>実戦順位 {c.actionableRank}位</span>
                      {c.revivedBuyCandidate && <span style={{fontWeight:800,color:"var(--accent)"}}>🔄 復活（BUY_CANDIDATE）</span>}
                      {c.shadow && <span style={{color:"var(--inkSoft)"}}>👁 shadow_watch由来</span>}
                      {(c.protectedReasons||[]).length>0 && <span style={{color:"var(--inkSoft)"}}>朝の弱さで除外しない：{c.protectedReasons.join("・")}</span>}
                      {c.entryCapacity && <span style={{fontWeight:800,color:c.entryCapacity==="ENTRY_LIMIT"?"var(--down)":"var(--warn)"}}>
                        {c.entryCapacity==="ENTRY_LIMIT"?"🔴 ENTRY_LIMIT":"🟠 CAUTION"}：{c.entryCapacityWarning}</span>}
                    </div>}
                    {/* 買付余力ベース評価（2026-09-24新規）：余力設定済みの時だけ表示 */}
                    {c.minimumPurchaseAmount!=null && c.buyable!==undefined && c.buyable!==null && <div style={{marginTop:4,display:"flex",flexWrap:"wrap",gap:"2px 12px",fontSize:10.5}} className="mono">
                      <span style={{fontWeight:800,color:"var(--accent)"}}>{c.capitalStatus||"BUY_NOW"}</span>
                      <span>必要資金 {c.minimumPurchaseAmount.toLocaleString()}円</span>
                      <span>余力 {c.cashAvailable!=null?c.cashAvailable.toLocaleString():"—"}円</span>
                      {c.cashRemainingAfterBuy!=null && <span>購入後余力 {c.cashRemainingAfterBuy.toLocaleString()}円</span>}
                      {c.cashUsageRatio!=null && <span>余力使用率 {Math.round(c.cashUsageRatio*100)}%</span>}
                      {c.capitalEfficiencyScore!=null && <span>資金効率 {c.capitalEfficiencyScore}</span>}
                      {(c.capitalFlags||[]).includes("CAPITAL_CONCENTRATION_RISK") && <span style={{fontWeight:800,color:c.capitalConcentrationRisk==="STRONG"?"var(--down)":"var(--warn)"}}>
                        {c.capitalConcentrationRisk==="STRONG"?"🔴":"🟠"} CAPITAL_CONCENTRATION_RISK（{c.capitalConcentrationRisk==="STRONG"?"強警告":"注意"}）
                      </span>}
                    </div>}
                    {c.ipoInfo && <div style={{marginTop:4,display:"flex",flexWrap:"wrap",gap:"2px 12px",fontSize:10.5}} className="mono">
                      <span style={{fontWeight:800,color:"var(--accent)"}}>IPO {c.ipoInfo.stage}</span>
                      {c.ipoInfo.ipo_fundamental_score!=null && <span>IPO FUNDAMENTAL {c.ipoInfo.ipo_fundamental_score}</span>}
                      {c.ipoInfo.ipo_supply_demand_score!=null && <span>IPO SUPPLY DEMAND {c.ipoInfo.ipo_supply_demand_score}</span>}
                      {c.ipoInfo.ipo_momentum_score!=null && <span>IPO MOMENTUM {c.ipoInfo.ipo_momentum_score}</span>}
                      {c.ipoInfo.ipo_total_score!=null && <span>IPO総合 {c.ipoInfo.ipo_total_score}</span>}
                      {c.ipoInfo.fundamental_data_quality && <span style={{fontWeight:800,
                          color:["HIGH","MEDIUM"].includes(c.ipoInfo.fundamental_data_quality)?"var(--inkSoft)":"var(--down)"}}
                          title={"未取得の指標："+((c.ipoInfo.fundamental&&c.ipoInfo.fundamental.missing_components)||[]).join("・")}>
                        業績データ品質 {c.ipoInfo.fundamental_data_quality}{["LOW","INSUFFICIENT"].includes(c.ipoInfo.fundamental_data_quality)?"（データ不足：スコアは参考値）":""}
                      </span>}
                      {c.ipoInfo.priceVsOfferPct!=null && <span>公開価格比 {c.ipoInfo.priceVsOfferPct>0?"+":""}{c.ipoInfo.priceVsOfferPct}%</span>}
                    </div>}
                    {confirmationOverrideReasons&&confirmationOverrideReasons.length>0 && <div style={{marginTop:4,fontSize:10.5,color:stMeta.color}}>
                      詳細分析：{confirmationOverrideReasons.join("・")}
                      {confirmationUnblockConditions&&confirmationUnblockConditions.length>0 && <span style={{color:"var(--inkSoft)"}}>　／　ENTRY解禁：{confirmationUnblockConditions.join("・")}</span>}
                    </div>}
                    {expanded && <div style={{marginTop:6,paddingTop:6,borderTop:"1px dashed var(--rule)",display:"flex",flexWrap:"wrap",gap:"4px 14px",fontSize:11}}>
                      {ENTRY_SCORE_COMPONENT_META.map(m=><span key={m.key} className="mono">
                        {m.label} {bd[m.key]!=null?bd[m.key]:0}{m.max!=null?`/${m.max}`:""}
                      </span>)}
                      <span className="mono" style={{fontWeight:800}}>合計 {c.entryScore}</span>
                    </div>}
                  </div>;
                })}
              </div>}
          {entryResult.capital&&entryResult.capital.applied && <div style={{fontSize:11,color:"var(--inkSoft)",marginBottom:6}}>
            上の一覧は<b>実戦TOP5</b>（現在の買付余力
            <span className="mono" style={{fontWeight:800}}> {Math.round(entryResult.capital.cashAvailable).toLocaleString()}円 </span>
            で実際に買える候補）。余力不足で除外：{entryResult.capital.notBuyableCount}銘柄
            {entryResult.capital.openPositionCount!=null && <span>　／　保有 {entryResult.capital.openPositionCount}銘柄（新規ENTRY余地：{entryResult.capital.newEntryCapacity}）</span>}
          </div>}
          {entryResult.capital&&entryResult.capital.entryCapacityWarning && <div style={{fontSize:11,fontWeight:700,marginBottom:6,
              color:entryResult.capital.newEntryCapacity==="ENTRY_LIMIT"?"var(--down)":"var(--warn)"}}>
            ⚠ {entryResult.capital.entryCapacityWarning}（補助判断：既存ポジションの売却や候補の除外はしません）
          </div>}
          {entryResult.analysisTop5&&entryResult.analysisTop5.length>0 && entryResult.capital&&entryResult.capital.applied && <div style={{marginBottom:8}}>
            <div style={{fontSize:11,fontWeight:700,color:"var(--inkSoft)",marginBottom:4}}>分析TOP5（余力を考慮しない純粋な分析評価・過去検証用）—「良い銘柄なのに実戦TOP5に出ない理由」</div>
            <div style={{display:"flex",flexDirection:"column",gap:2}}>
              {entryResult.analysisTop5.map(c=><div key={c.code} className="mono" style={{fontSize:10.5}}>
                分析{c.analysisRank}位 {c.code} {c.name} 評価{c.entryScore}
                {c.minimumPurchaseAmount!=null && <span>　必要資金 {c.minimumPurchaseAmount.toLocaleString()}円</span>}
                {c.actionableRank!=null
                  ? <span style={{color:"var(--accent)",fontWeight:800}}>　→ 実戦{c.actionableRank}位</span>
                  : <span style={{color:"var(--down)"}}>　→ 実戦TOP5外：{c.actionableReason||"—"}</span>}
              </div>)}
            </div>
          </div>}
          {entryResult.capital&&entryResult.capital.combinations&&entryResult.capital.combinations.length>0 && <div style={{fontSize:11,marginBottom:8}}>
            <div style={{fontWeight:700,color:"var(--inkSoft)",marginBottom:2}}>同時に持てる組み合わせ（余力内・集中リスク考慮）</div>
            {entryResult.capital.combinations.map((cb,i)=><div key={i} className="mono">
              {cb.codes.join(" + ")}　合計 {cb.totalAmount.toLocaleString()}円　残余力 {cb.cashRemaining.toLocaleString()}円
              {cb.concentrationRisk && <span style={{color:"var(--warn)"}}>　集中:{cb.concentrationRisk}</span>}
            </div>)}
          </div>}
          {entryResult.capital&&entryResult.capital.notBuyableNotable&&entryResult.capital.notBuyableNotable.length>0 && <div style={{marginBottom:8}}>
            <div style={{fontSize:11,fontWeight:700,color:"var(--inkSoft)",marginBottom:4}}>余力不足だが注目（NOT_BUYABLE・TOP5には含めない）</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {entryResult.capital.notBuyableNotable.map(c=><span key={c.code} style={{fontSize:11,padding:"2px 7px",borderRadius:3,border:"1px dashed var(--rule)",whiteSpace:"nowrap"}}>
                {c.code} {c.name} <span className="mono">SCORE {c.entryScore}</span> <span className="mono">必要資金 {c.minimumPurchaseAmount.toLocaleString()}円</span> <span style={{color:"var(--down)"}}>余力不足</span>
              </span>)}
            </div>
          </div>}
          {entryResult.shadowRecheck&&entryResult.shadowRecheck.length>0 && <div style={{marginBottom:8}}>
            <div style={{fontSize:11,fontWeight:700,color:"var(--accent)",marginBottom:4}}>👁 再注目候補（監視解除後の内部追跡で再上昇を検出）</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {entryResult.shadowRecheck.map(c=><span key={c.code} style={{fontSize:11,padding:"2px 7px",borderRadius:3,border:"1px solid var(--accent)",whiteSpace:"nowrap"}}>
                {c.code} {c.name||""} {c.kind} <span className="mono">{c.price!=null?c.price.toLocaleString():"—"}円{c.changePct!=null?`（${c.changePct>0?"+":""}${c.changePct}%）`:""}</span> {c.reasons.join("・")}
                {c.pipelineStatus==="ACTIONABLE_TOP5" && <b style={{color:"var(--accent)"}}>　✅ 実戦TOP5{c.actionableRank!=null?c.actionableRank+"位":""}へ復帰</b>}
                {c.pipelineStatus==="BUY_CANDIDATE_BLOCKED" && <b style={{color:"var(--down)"}}>　BUY_CANDIDATE到達も実戦TOP5に入れない：{c.blockedReason}</b>}
                {c.pipelineStatus==="WATCHING" && <span style={{color:"var(--inkSoft)"}}>　監視継続（{c.stage}）</span>}
              </span>)}
            </div>
          </div>}
          {entryResult.watchLowCandidates&&entryResult.watchLowCandidates.length>0 && <div style={{marginBottom:8}}>
            <div style={{fontSize:11,fontWeight:700,color:"var(--inkSoft)",marginBottom:4}}>WATCH_LOW維持（朝の弱さだけで完全除外しない対象）</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {entryResult.watchLowCandidates.map(c=><span key={c.code} style={{fontSize:11,padding:"2px 7px",borderRadius:3,border:"1px dashed var(--rule)",whiteSpace:"nowrap"}}>
                {c.code} {c.name} <span className="mono">{c.changePct!=null?(c.changePct>0?"+":"")+c.changePct+"%":""}</span> {c.stage}：{(c.protectedReasons||[]).join("・")}
              </span>)}
            </div>
          </div>}
          {entryResult.watchCandidates.length>0 && <>
            <div style={{fontSize:11,fontWeight:700,color:"var(--inkSoft)",marginBottom:4}}>監視候補（BREAKOUT待ち・押し目待ち・反転待ち等、まだENTRY READYではない）</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {entryResult.watchCandidates.map(c=>{
                const stMeta=ENTRY_STATE_META[c.entryState]||{label:c.entryState,color:"var(--inkFaint)"};
                return <span key={c.code} style={{fontSize:11,padding:"2px 7px",borderRadius:3,border:"1px solid var(--rule)",whiteSpace:"nowrap"}}>
                  {c.code} {c.name} <span className="mono">{c.entryScore}</span> <span style={{color:stMeta.color}}>{stMeta.label}</span>
                </span>;
              })}
            </div>
          </>}
          {/* 値幅余地・反転モメンタム選考（2026-09-16新規、指示書4・6番）：前日比マイナス
              だが当日安値から強く反転している銘柄の新規探索レーン。既存entry_score
              ランキングとは別の判定基準（反転確認条件の充足数）で選出（「前日比プラスを
              候補条件にしない」）。 */}
          {entryResult.reversalCandidates&&entryResult.reversalCandidates.length>0 && <>
            <div style={{fontSize:11,fontWeight:700,color:"var(--inkSoft)",marginTop:10,marginBottom:4}}>
              🔄 反転モメンタム候補（前日比マイナスだが当日安値から強く反転）
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:4}}>
              {entryResult.reversalCandidates.map(c=>{
                const rev=c.reversalInfo||{};
                return <div key={c.code} style={{padding:"5px 8px",borderRadius:4,border:"1px solid var(--rule)",fontSize:11}}>
                  <span style={{fontWeight:700}}>{c.code} {c.name}</span>
                  <span className="mono" style={{marginLeft:8}}>{c.current!=null?c.current.toLocaleString():"—"}</span>
                  <span className="mono" style={{marginLeft:6,color:"var(--down)"}}>{c.changePct!=null?c.changePct.toFixed(2)+"%":"—"}</span>
                  <span style={{marginLeft:8,color:"var(--up)",fontWeight:700}}>安値から+{rev.bounceFromLowPct}%</span>
                  <span style={{marginLeft:8,color:"var(--inkSoft)"}}>{(rev.reversalReasons||[]).join("・")}</span>
                </div>;
              })}
            </div>
          </>}

// 資金管理・分割買いツール：総資金とリスク許容%、エントリー/損切り単価から株数目安を計算する（14-15章）。
// 日本株は100株単位、米国株は1株単位に丸める。分割買いは1回目40%（打診買い）・2回目30%（反転確認後）・
// 3回目残り30%（節目上抜け後）の目安に分ける（3回とも単元株数に丸めるため合計が端数分減ることがある）。
const computePositionSize=(totalCapital,riskPct,entry,stop,market)=>{
  const capital=num(totalCapital),risk=num(riskPct);
  if(capital==null||capital<=0||risk==null||risk<=0||entry==null||stop==null)return null;
  const perShareRisk=entry-stop;
  if(perShareRisk<=0)return null;
  const lotSize=market==="JP"?100:1;
  const riskAmount=capital*(risk/100);
  const rawShares=riskAmount/perShareRisk;
  const suggestedShares=Math.floor(rawShares/lotSize)*lotSize;
  if(suggestedShares<lotSize)return {suggestedShares:0,investAmount:0,tranches:[0,0,0]};
  const t1=Math.floor(suggestedShares*0.4/lotSize)*lotSize;
  const t2=Math.floor(suggestedShares*0.3/lotSize)*lotSize;
  const t3=suggestedShares-t1-t2;
  return {suggestedShares,investAmount:suggestedShares*entry,tranches:[t1,t2,t3]};
};

// 投資判断ログの「銘柄評価」1件分の入力欄定義。[DBの列名, 表示ラベル]。
// server.py/investment_db.pyの_JUDGMENT_COLSと1対1で対応させている。
const JUDGMENT_FIELDS=[

  ["supply_demand","需給評価（信用残・信用倍率等）"],["earnings_eval","業績評価"],["valuation_eval","バリュエーション評価"],
  ["theme_eval","テーマ評価"],["chart_eval","チャート評価"],["chatgpt_judgment","ChatGPTの判断"],
  ["my_judgment","自分の判断"],["actual_trade","実際に行った売買"],["trade_result","その後の結果"],
];
const JUDGMENT_CATEGORIES=["監視","保有","買い候補","見送り"];

// v3-4（ポジションタブ拡張）：含み損益・RRはportfolioの保存値（quantity/average_price/
// initial_stop/current_stop/target_1/target_2）とstockQuotesの現在値だけから毎回計算する。
// トレーリング状態も保存せず都度導出する（DBに保存するのはinitial_stop/current_stop/
// target_1/target_2の4値のみ。既存portfolioテーブルにこの4列だけ追加済み）。
function calcUnrealizedPnl(avgPrice,quantity,current){
  if(avgPrice==null||quantity==null||current==null)return {amount:null,pct:null};
  const amount=(current-avgPrice)*quantity;
  const pct=avgPrice>0?(current-avgPrice)/avgPrice*100:null;
  return {amount,pct};
}
