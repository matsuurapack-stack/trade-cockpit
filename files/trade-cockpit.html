                    {rb.meta.icon} {rb.meta.label}
                    {rb.resilience && <span style={{color:"#0d7a3f",marginLeft:4}} title="地合いが悪い日でも下がらなかった実績（登録時点）">
                      {rb.resilience.icon} {rb.resilience.label}
                    </span>}
                  </div>;})()}
                {(()=>{const sb=deriveSectorLeaderBadge(w);if(!sb)return null;
                  return <div style={{fontWeight:700,fontSize:10,color:sb.meta.color,whiteSpace:"nowrap",marginTop:1}}
                    title={`SECTOR_LEADER_SCORE ${sb.score}${sb.sectorRank?`／セクター順位${sb.sectorRank}/${sb.sectorTotal}`:""}（監視登録理由であり、買い推奨ではありません）`}>
                    {sb.meta.icon} {sb.meta.label}
                    {sb.strength && <span style={{color:sb.strength.color,marginLeft:4}} title="セクター対市場の強さ（登録時点）">
                      {sb.strength.icon} {sb.strength.label}
                    </span>}
                  </div>;})()}
                {(()=>{const pb=derivePullbackBadge(w);if(!pb)return null;
                  return <div style={{fontWeight:700,fontSize:10,color:pb.meta.color,whiteSpace:"nowrap",marginTop:1}}
                    title={`PULLBACK_SCORE ${pb.score}${pb.pullbackDevPct!=null?`／押し目乖離${pb.pullbackDevPct}%`:""}${pb.higherLow?"／安値切り上げ":""}（監視登録理由であり、買い推奨ではありません）`}>
                    {pb.meta.icon} {pb.meta.label}
                  </div>;})()}
                {(()=>{const rvb=deriveReversalBadge(w);if(!rvb)return null;
                  return <div style={{fontWeight:700,fontSize:10,color:rvb.meta.color,whiteSpace:"nowrap",marginTop:1}}
                    title={`REVERSAL_SCORE ${rvb.score}${rvb.currentFromRecentLowPct!=null?`／直近安値からの上昇率+${rvb.currentFromRecentLowPct}%`:""}${rvb.higherLow?"／安値切り上げ確認":""}${rvb.reversalTypes?.length?`／${rvb.reversalTypes.join("・")}`:""}（監視登録理由であり、買い推奨ではありません）`}>
                    {rvb.meta.icon} {rvb.meta.label}
                  </div>;})()}
                {(()=>{const vlb=deriveVolumeBadge(w);if(!vlb)return null;
                  return <div style={{fontWeight:700,fontSize:10,color:vlb.meta.color,whiteSpace:"nowrap",marginTop:1}}
                    title={`VOLUME_SCORE ${vlb.score}${vlb.volumeType?`／${VOLUME_TYPE_LABEL[vlb.volumeType]||vlb.volumeType}`:""}${vlb.timeAdjustedVolumeRatio!=null?`／時間帯補正後出来高倍率${vlb.timeAdjustedVolumeRatio}倍`:""}${vlb.isIntradayVolume?"（日中未確定）":""}（監視登録理由であり、買い推奨ではありません）`}>
                    {vlb.meta.icon} {vlb.meta.label}
                  </div>;})()}
              </td>
              <td className="mono" style={{fontWeight:800,fontSize:15,textAlign:"right",paddingLeft:10,color:rsFg}}>{w.rsScore!=null?w.rsScore:"—"}</td>
              <td className="mono" style={{fontWeight:700,fontSize:13}}>{w.code}</td>
              <td style={{fontSize:15,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={w.name}>{w.name}
                <NewsBadge catalysts={newsCatalysts} code={w.code} sector={w.sector}/></td>
              <td style={{fontSize:13,color:"var(--inkSoft)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={w.sector||""}>{w.sector||"—"}</td>
              <td className="mono" style={{textAlign:"right",fontWeight:700,fontSize:14.5,color:fg,whiteSpace:"nowrap"}}>{ct!=null?ct.toLocaleString():"—"}</td>
              <td className="mono" style={{textAlign:"right",fontWeight:600,fontSize:14,color:fg,whiteSpace:"nowrap"}}
                title={cp!=null&&ct!=null?`${ct-cp>0?"+":""}${(ct-cp).toLocaleString(undefined,{maximumFractionDigits:2})}`:""}>
                {pct!=null?(pct>0?"+":"")+pct.toFixed(2)+"%":"—"}</td>
              <td className="mono" style={{textAlign:"right",fontSize:13,fontWeight:700,whiteSpace:"nowrap"}}>{fmtPt(w.marketRS)}</td>
              <td className="mono" style={{textAlign:"right",fontSize:13,whiteSpace:"nowrap"}}>{fmtPt(w.sectorRS)}</td>
              <td style={{textAlign:"center",position:"relative"}}>
                <button className="watch-menu-btn" onClick={e=>{e.stopPropagation();setOpenMenuFor(v=>v===w.code?null:w.code);}}>⋮</button>
                {openMenuFor===w.code && <div className="watch-menu" onClick={e=>e.stopPropagation()}>
                  <button onClick={()=>{onOpenChart(w);setOpenMenuFor(null);}}>チャート</button>
                  <button className={inAnalysis?"on":""} onClick={()=>{onToggleAnalysis(w.code);setOpenMenuFor(null);}}>{inAnalysis?"✓ 分析中":"分析"}</button>
                  {w.market==="JP" && <button className={inEarnings?"on":""} onClick={()=>{onToggleEarnings(w.code);setOpenMenuFor(null);}}>{inEarnings?"✓ 決算":"決算"}</button>}
                  <div style={{padding:"6px 12px",display:"flex",gap:4,alignItems:"center"}}>
                    <select value={candidateStatusPick[w.code]||"WATCH"} onChange={e=>setCandidateStatusPick(p=>({...p,[w.code]:e.target.value}))}
                      style={{fontSize:11,padding:"2px 3px",flex:1}}>
                      {TRADE_CANDIDATE_STATUS_OPTIONS.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}
                    </select>
                  </div>
                  <button onClick={()=>{saveCandidate(w);setOpenMenuFor(null);}}>候補に追加</button>
                  {/* v3-9続き（2026-09-07・監視銘柄→ポジション連携）：監視銘柄はそのまま残し
                      （watchlistから削除・移動しない）、portfolioへコピーするだけの挙動。 */}
                  <button onClick={()=>{setPositionEntryFor({code:w.code,name:w.name,market:w.market});setOpenMenuFor(null);}}>➕ ポジション追加</button>
                  <button onClick={()=>{virtualEntry(w);setOpenMenuFor(null);}}>仮想IN</button>
                  <button onClick={()=>{recordToLog(w);setOpenMenuFor(null);}}>記録</button>
                  <button onClick={()=>{copyConsult(w);setOpenMenuFor(null);}}>🤖 相談用コピー</button>
                  <button onClick={()=>{onRemove(w.code);setOpenMenuFor(null);}}>監視解除</button>
                </div>}
              </td>
            </tr>;})}</tbody>
        </table></div>
        {/* v3-9続き（PHASE 7 MOBILE/PWA）：390px前後のスマホ用compact card表示。
            CSS（.watch-table-mobile、@media (max-width:768px)）でデスクトップ版と排他的に
            切り替える。既存のenrichWatchRow等の判定結果（w.status/actionStatus/rsScore等）を
            そのまま流用し、新しい判定ロジックは追加しない。 */}
        <div className="watch-table-mobile">
          {displayed.map((w)=>{
            const qt=stockQuotes[w.code]||{};
            const ct=num(qt.t),cp=num(qt.p);
            const pct=w.pct;
            const fg=pct==null||pct===0?"var(--ink)":(pct>0?"var(--up)":"var(--down)");

            const actionMeta=ACTION_STATUS_META[w.actionStatus];

            const isOpen=expandedCode===w.code;
            const mb=deriveMomentumBadge(w),bb=deriveBreakBadge(w),rb=deriveRsBadge(w),sb=deriveSectorLeaderBadge(w),pb=derivePullbackBadge(w),rvb=deriveReversalBadge(w),vlb=deriveVolumeBadge(w);
            const inAnalysis=analysisTargets.includes(w.code);
            return <div key={w.code} style={{padding:"10px 12px",borderTop:"1px solid var(--ruleSoft)",

              onClick={()=>setExpandedCode(v=>v===w.code?null:w.code)}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
                <div style={{minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:15,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{w.name}</div>
                  <div className="mono" style={{fontSize:12,color:"var(--inkSoft)"}}>{w.code}</div>
                </div>
                <div style={{textAlign:"right",flex:"none"}}>
                  <div className="mono" style={{fontWeight:700,fontSize:15,color:fg}}>{ct!=null?ct.toLocaleString():"—"}</div>
                  <div className="mono" style={{fontSize:13,fontWeight:600,color:fg}}>{pct!=null?(pct>0?"+":"")+pct.toFixed(2)+"%":"—"}</div>
                </div>
              </div>
              <div style={{display:"flex",flexWrap:"wrap",gap:6,marginTop:6,alignItems:"center"}}>
                <span style={{fontWeight:700,fontSize:11.5,color:meta.color}}>{meta.icon} {meta.label}</span>
                {actionMeta.label && <span style={{fontWeight:700,fontSize:11,color:actionMeta.color}}>{actionMeta.icon} {actionMeta.label}</span>}
                <span className="mono" style={{fontWeight:700,fontSize:12,color:rsFg,marginLeft:"auto"}}>RS {w.rsScore!=null?w.rsScore:"—"}</span>
              </div>
              {(mb||bb||rb||sb||pb||rvb||vlb) && <div style={{display:"flex",flexWrap:"wrap",gap:6,marginTop:4}}>
                {mb && <span style={{fontSize:10.5,fontWeight:700,color:mb.meta.color}}>{mb.meta.icon} {mb.meta.label}</span>}
                {bb && <span style={{fontSize:10.5,fontWeight:700,color:bb.meta.color}}>{bb.meta.icon} {bb.meta.label}</span>}
                {rb && <span style={{fontSize:10.5,fontWeight:700,color:rb.meta.color}}>{rb.meta.icon} {rb.meta.label}</span>}
                {sb && <span style={{fontSize:10.5,fontWeight:700,color:sb.meta.color}}>{sb.meta.icon} {sb.meta.label}</span>}
                {pb && <span style={{fontSize:10.5,fontWeight:700,color:pb.meta.color}}>{pb.meta.icon} {pb.meta.label}</span>}
                {rvb && <span style={{fontSize:10.5,fontWeight:700,color:rvb.meta.color}}>{rvb.meta.icon} {rvb.meta.label}</span>}
                {vlb && <span style={{fontSize:10.5,fontWeight:700,color:vlb.meta.color}}>{vlb.meta.icon} {vlb.meta.label}</span>}
              </div>}
              {isOpen && <div style={{marginTop:8,paddingTop:8,borderTop:"1px dashed var(--ruleSoft)",fontSize:12,
                  color:"var(--inkSoft)",display:"flex",flexDirection:"column",gap:5}} onClick={e=>e.stopPropagation()}>
                <div>セクター：{w.sector||"—"}</div>
                <div>対市場：{fmtPt(w.marketRS)}　対セクター：{fmtPt(w.sectorRS)}</div>
                {reasonList.length>0 && <div>{actionMeta.label}理由：{reasonList.filter(Boolean).join("・")}</div>}
                <div style={{display:"flex",gap:10,flexWrap:"wrap",marginTop:4}}>
                  <button className="action-btn" onClick={()=>onOpenChart(w)}>チャート</button>
                  <button className={"action-btn"+(inAnalysis?" on":"")} onClick={()=>onToggleAnalysis(w.code)}>{inAnalysis?"✓ 分析中":"分析"}</button>
                  <button className="action-btn" onClick={()=>onRemove(w.code)}>監視解除</button>
                </div>
              </div>}
            </div>;
          })}
        </div>
        </>}
      {!showAll&&filtered.length>TOP_N && <button className="action-btn" style={{display:"block",width:"100%",padding:"8px",borderTop:"1px solid var(--ruleSoft)"}}
        onClick={()=>setShowAll(true)}>すべて表示（残り{filtered.length-TOP_N}件）</button>}
      {showAll&&filtered.length>TOP_N && <button className="action-btn" style={{display:"block",width:"100%",padding:"8px",borderTop:"1px solid var(--ruleSoft)"}}
        onClick={()=>setShowAll(false)}>上位{TOP_N}件のみ表示に戻す</button>}
    </div>

    <div style={{marginTop:20}}>
      <div className="sec-head" style={{fontSize:13}}>今日の候補　{candidates.length}件</div>
      {loadingCandidates
        ? <div style={{fontSize:12,color:"var(--inkFaint)"}}>読み込み中…</div>
        : candidates.length===0
          ? <div style={{fontSize:12,color:"var(--inkFaint)"}}>まだありません。上の一覧から「候補に追加」で保存できます。</div>
          : <div style={{display:"flex",flexDirection:"column",gap:4,marginTop:6}}>
              {candidates.map(c=><div key={c.id} style={{fontSize:12.5,padding:"5px 8px",border:"1px solid var(--ruleSoft)",borderRadius:3}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span className="chip" style={{fontSize:10.5}}>{TRADE_CANDIDATE_STATUS_OPTIONS.find(o=>o.value===c.status)?.label||c.status}</span>
                  <span className="mono">{c.code}</span><span style={{fontWeight:600}}>{c.name}</span>
                  {c.rs_score!=null && <span style={{color:"var(--inkSoft)"}}>RS Score {c.rs_score}</span>}
                  {c.virtual_entry_price!=null && <span style={{color:"var(--inkSoft)"}}>仮想IN {num(c.virtual_entry_price).toLocaleString()}</span>}
                  <span style={{marginLeft:"auto",color:"var(--inkFaint)",fontSize:11}}>{(c.created_at||"").slice(11,16)}</span>
                  <button className="iconbtn" onClick={()=>removeCandidate(c.id)}>×</button>
                </div>
                {/* 仮想トレード追跡（Phase7）：仮想IN済みの候補にだけチェックポイント記録UIを出す */}
                {c.virtual_entry_price!=null && <div style={{display:"flex",gap:4,flexWrap:"wrap",marginTop:4,paddingTop:4,borderTop:"1px solid var(--ruleSoft)"}}>
                  {CHECKPOINT_LABELS.map(([key,label])=>{
                    const cp=c.checkpoints?.[key];
                    if(cp){
                      const chgPct=c.virtual_entry_price?((cp.price-c.virtual_entry_price)/c.virtual_entry_price*100):null;
                      return <span key={key} className="chip" style={{fontSize:10}}>{label} {num(cp.price).toLocaleString()}{chgPct!=null?`(${chgPct>0?"+":""}${chgPct.toFixed(1)}%)`:""}</span>;
                    }
                    return <button key={key} className="action-btn" style={{fontSize:10,padding:"2px 5px"}} onClick={()=>recordCheckpoint(c,key)}>{label}を記録</button>;
                  })}
                </div>}
              </div>)}
            </div>}
    </div>
    {positionEntryFor && <PositionEntryModal code={positionEntryFor.code} name={positionEntryFor.name} market={positionEntryFor.market}
      needsTradeStyle={true} onClose={()=>setPositionEntryFor(null)}
      onSaved={()=>setConsultMsg("ポジションに追加しました（ポジションタブで確認できます）")}/>}
  </div>;
}

// 資金管理・分割買いツール：総資金とリスク許容%、エントリー/損切り単価から株数目安を計算する（14-15章）。
// 日本株は100株単位、米国株は1株単位に丸める。分割買いは1回目40%（打診買い）・2回目30%（反転確認後）・
// 3回目残り30%（節目上抜け後）の目安に分ける（3回とも単元株数に丸めるため合計が端数分減ることがある）。
const computePositionSize=(totalCapital,riskPct,entry,stop,market)=>{
  const capital=num(totalCapital),risk=num(riskPct);
  if(capital==null||capital<=0||risk==null||risk<=0||entry==null||stop==null)return null;
  const perShareRisk=entry-stop;
  if(perShareRisk<=0)return null;
  const lotSize=market==="JP"?100:1;
  const riskAmount=capital*(risk/100);
  const rawShares=riskAmount/perShareRisk;
  const suggestedShares=Math.floor(rawShares/lotSize)*lotSize;
  if(suggestedShares<lotSize)return {suggestedShares:0,investAmount:0,tranches:[0,0,0]};
  const t1=Math.floor(suggestedShares*0.4/lotSize)*lotSize;
  const t2=Math.floor(suggestedShares*0.3/lotSize)*lotSize;
  const t3=suggestedShares-t1-t2;
  return {suggestedShares,investAmount:suggestedShares*entry,tranches:[t1,t2,t3]};
};

// v3-4（ポジションタブ拡張）：含み損益・RRはportfolioの保存値（quantity/average_price/
// initial_stop/current_stop/target_1/target_2）とstockQuotesの現在値だけから毎回計算する。
// トレーリング状態も保存せず都度導出する（DBに保存するのはinitial_stop/current_stop/
// target_1/target_2の4値のみ。既存portfolioテーブルにこの4列だけ追加済み）。
function calcUnrealizedPnl(avgPrice,quantity,current){
  if(avgPrice==null||quantity==null||current==null)return {amount:null,pct:null};
  const amount=(current-avgPrice)*quantity;
  const pct=avgPrice>0?(current-avgPrice)/avgPrice*100:null;
  return {amount,pct};
}
// 2026-09-10更新（損切りルール是正・最優先修正）：旧v3-8 Step2「SWING限定・-8%接近警告/
// -10%絶対損切り」は、ユーザーの実際の運用ルールと一致していなかったため是正した。
// calcHardStop/hardStopState/HARD_STOP_STATE_METAは既存データ・過去の呼び出し互換のため
// 削除せず残置するが、実際の判定にはもう使わない（下のevaluatePositionRiskRule系へ
// 一本化、Morning Check・通知・利確損切り相談・日次レビューと共通の唯一の設定）。
function calcHardStop(avgPrice,tradeStyle){
  if(tradeStyle!=="SWING"||avgPrice==null)return null;
  return avgPrice*0.90;
}
function hardStopState(pnlPct){
  if(pnlPct==null)return null;
  if(pnlPct<=-10)return "STOP";
  if(pnlPct<=-8)return "APPROACHING";
  return "OK";
}

// ---- ここから新ルール（唯一の真実） ----
// 全トレードスタイル共通：-6%WATCH／-7%WARNING／-8%EXIT。自信度・材料・ファンダ・
// ニュース・AI分析結果に関わらず、EXIT到達時点では一旦売却を促す（再エントリーは
// 「新しいトレード」として別途判断してよい＝allowReentry/reentryRequiresNewDecision）。
// サーバー側investment_db.DEFAULT_POSITION_RISK_RULESと同じ既定値。App起動時に
// /api/position-risk-rulesの実際の設定でこのオブジェクトを上書きする
// （fetch前・失敗時もこの既定値でそのまま正しく動く）。Morning Check・Positions画面・
// 通知・利確損切り相談・日次レビューの全てがこの1つのオブジェクトだけを参照する。
let POSITION_RISK_RULES={watchPct:-6.0,warningPct:-7.0,maxLossPct:-8.0,action:"EXIT",allowReentry:true,reentryRequiresNewDecision:true};
function evaluatePositionRiskRule(pnlPct){
  if(pnlPct==null)return null;
  if(pnlPct<=POSITION_RISK_RULES.maxLossPct)return "EXIT";
  if(pnlPct<=POSITION_RISK_RULES.warningPct)return "WARNING";
  if(pnlPct<=POSITION_RISK_RULES.watchPct)return "WATCH";
  return null;
}
function calcPositionExitPrice(avgPrice){
  return avgPrice!=null?avgPrice*(1+POSITION_RISK_RULES.maxLossPct/100):null;
}
const POSITION_RISK_RULE_META={
  EXIT:{title:"🚨 EXIT RULE",label:`買値から${Math.abs(POSITION_RISK_RULES.maxLossPct)}%に到達しました。`,
    action:"「売却」",note:"投資判断がまだ有効でも一旦撤退してください。再エントリーは新しいトレードとして判断します。",color:"var(--down)"},
  WARNING:{title:"⚠ 損切りライン接近",label:`EXIT RULE（${POSITION_RISK_RULES.maxLossPct}%）まであと僅かです。`,color:"var(--down)"},
  WATCH:{title:"含み損やや拡大",label:"注視してください。",color:"var(--accent)"},
};
// RR = (TP1 - 取得値または現在値) / (取得値または現在値 - 現在SL)。ロング前提。
// 0除算・現在SL >= 基準値などの異常ケースはnull（表示側で「--」）。
function calcPositionRR(tp1,basisPrice,currentStop){
  if(tp1==null||basisPrice==null||currentStop==null)return null;
  const risk=basisPrice-currentStop;
  if(risk<=0)return null;
  const reward=tp1-basisPrice;
  if(reward<=0)return null;
  return reward/risk;
}

// v3-8 Step4（ポジション管理ロジック再設計）：ポジション専用のStatus判定。
// 【最重要原則】銘柄分析（新規エントリー判断）とポジション管理（継続保有/利確/損切り/撤退判断）は
// 判断基準を分離する。enrichWatchRow()のPrimary/Action Status・riskReasons・waitReasonsは

// 崩れ判定）・Step6（出来高複合判定）・Step7（トレーリング幅のDAY/SWING分岐）で判定材料を
// 段階的に追加していく前提（現時点でのEXIT/REDUCE判定はStep3フラグの単純カウントのみによる
// 暫定版で、Step5以降でチャート崩れの重み付けを加えて精緻化する）。
const POSITION_STATUS_META={
  STOP:{label:"STOP",icon:"🔴",color:"var(--down)"},
  EXIT:{label:"EXIT",icon:"🚪",color:"var(--down)"},
  REDUCE:{label:"REDUCE",icon:"✂",color:"var(--down)"},

};
// v3-8 Step5（ポジション管理：DAY/SWING別チャート崩れ判定）：取引タイプによって重視する
// シグナルを変える。DAY重視＝VWAP割れ・5分足直近安値割れ・ブレイク水準割れ・高値からの急反落
// （ザラ場の値動き中心）。SWING重視＝直近スイング安値割れ・5日線割れ・25日線割れ・ブレイク水準
// 割れ・FAILED_BREAK（日足〜数日単位のトレンド中心）。VWAPはDAYのみの材料でSWING側の判定には
// 一切含めない＝「VWAP単独でSWINGをEXITにしない」という要件を、判定式ではなく信号セット自体を
// 分けることで構造的に満たす。FAILED_BREAKはenrichWatchRow()のPrimary Statusだが、ここでは
// 「保有判断そのもの」ではなく「チャート崩れの一材料」として他の価格ベース信号と同列に扱うだけ
// （Step4の原則＝Action Status等を最終判断に流用しないことには反しない）。新規APIコールなし。
function evaluateChartBreakdown(tradeStyle,current,indicators,positionFlags,enrStatus){
  if(current==null)return {level:"NONE",fired:[]};
  const fired=[];
  if(tradeStyle==="DAY"){
    if(indicators?.vwap!=null && current<indicators.vwap)fired.push("VWAP割れ");
    if(positionFlags?.recentLow5m!=null && current<positionFlags.recentLow5m)fired.push("5分足直近安値割れ");
    if(positionFlags?.breakoutLookbackHigh!=null && current<positionFlags.breakoutLookbackHigh)fired.push("直近ブレイク水準割れ");
    if(indicators?.intradayHigh>0 && (indicators.intradayHigh-current)/indicators.intradayHigh>=0.03)fired.push("高値から急反落（-3%以上）");
  }else if(tradeStyle==="SWING"){
    if(positionFlags?.swingLowRecent!=null && current<positionFlags.swingLowRecent)fired.push("直近スイング安値割れ");
    if(indicators?.ma5Daily!=null && current<indicators.ma5Daily)fired.push("5日線割れ");
    if(indicators?.ma25!=null && current<indicators.ma25)fired.push("25日線割れ");
    if(positionFlags?.breakoutLookbackHigh!=null && current<positionFlags.breakoutLookbackHigh)fired.push("直近ブレイク水準割れ");
    if(enrStatus==="FAILED_BREAK")fired.push("Primary StatusがFAILED_BREAK");
  }
  return {level:fired.length>=2?"STRONG":fired.length===1?"WEAK":"NONE",fired};
}
// v3-8 Step7（トレーリングストップ）：含み益が一定水準を超えたら「持ち続ける」より「利益を
// 守るためにSLを切り上げていく」段階に移すという考え方。値幅（トレーリング幅）はATR14
// （analyze_stock()で既に計算済み、新規APIコールなし）があればそれを使い、無ければ現在値からの
// %で代用する（server.pyのatr_ref＝ATR代用ロジックと同じ考え方）。DAYはザラ場の値動きに合わせて
// 幅を狭く・トレーリング開始の含み益しきい値も低く、SWINGは日足のノイズを拾いすぎないよう
// 幅を広く・しきい値も高くする。
function calcTrailingWidth(tradeStyle,current,atr14){
  if(current==null)return null;
  const mult=tradeStyle==="DAY"?1.0:1.5;
  if(atr14!=null&&atr14>0)return atr14*mult;
  return current*(tradeStyle==="DAY"?0.02:0.05); // ATRが無い場合の代用（DAY:2%／SWING:5%）
}
const TRAIL_START_PCT={DAY:3,SWING:5};   // この含み益%を超えたらトレーリング開始を提案
const HOLD_STRONG_PCT={DAY:8,SWING:15};  // トレーリング幅が計算できない場合のフォールバック表示用

// v3-8 Step9（板情報）：立花証券APIから取得できる最良気配（ask/bid、stockQuotes[code].ask/bid、
// 既存の/api/stock-quotesがtachibana接続時に上書きする値をそのまま再利用。新規APIコールなし）
// のみを扱う。板の深さ・数量は立花証券APIでは取得できない（tachibana_api.get_market_price()の
// コメント参照）ため、スプレッド（ask-bid）の広さだけを判定材料にする。スプレッドが現在値比
// 0.5%以上に広がっている＝板が薄く売り抜けにくい可能性、という補助情報に限定する。
function evaluateSpreadWarning(ask,bid,current){
  if(ask==null||bid==null||current==null||current<=0||ask<=bid)return null;
  const spreadPct=(ask-bid)/current*100;
  return spreadPct>=0.5?{spreadPct:Math.round(spreadPct*100)/100}:null;
}

function derivePositionStatus({avgPrice,tradeStyle,current,currentStop,initialStop,target1,positionFlags,pnlPct,indicators,enrStatus,ask,bid}){
  const reasons=[];
  // 1. EXIT RULE（2026-09-10更新：全トレードスタイル共通・絶対最優先。自信度・材料・
  //    チャート・ファンダ・ニュース・AI分析結果等いかなる他の判定材料でも上書きしない。
  //    旧SWING限定-10%ハードストップから、ユーザー指定の最新ルール（-8%到達で一旦売却）
  //    へ是正した——構造は変えず「絶対最優先で他を上書きしない」という設計思想のみ維持）。
  const riskTier=evaluatePositionRiskRule(pnlPct);
  if(riskTier==="EXIT"){
    return {status:"STOP",reasons:[`EXIT RULE：買値から${pnlPct!=null?pnlPct.toFixed(1):"—"}%（${POSITION_RISK_RULES.maxLossPct}%到達）。一旦売却してください。再エントリーは新しいトレードとして判断します。`]};
  }
  // 2. 警戒シグナルの収集（単独では撤退トリガーにしない。個々の重みはStep6以降でさらに精緻化予定）
  if(riskTier==="WARNING")reasons.push(`EXIT RULE（${POSITION_RISK_RULES.maxLossPct}%）に接近（現在${pnlPct!=null?pnlPct.toFixed(1):"—"}%）`);
  else if(riskTier==="WATCH")reasons.push(`含み損がやや拡大（現在${pnlPct!=null?pnlPct.toFixed(1):"—"}%、注視）`);
  if(positionFlags?.longBearishCandle)reasons.push("直近に大陰線（実体の大きい陰線）");
  if(positionFlags?.gapUpFailure)reasons.push("寄り付きの上放れがその後失速（ギャップ失敗）");
  // Step5：DAY/SWING別チャート崩れ判定。STRONG（2件以上該当）は警戒2件分、WEAK（1件該当）は
  // 警戒1件分として合算する（個別の内訳はreasonsにそのまま列挙し、根拠を追える形にする）。
  const chart=evaluateChartBreakdown(tradeStyle,current,indicators,positionFlags,enrStatus);
  chart.fired.forEach(f=>reasons.push(`チャート崩れ：${f}`));
  // Step6（出来高複合判定）：出来高は単独では判断材料にせず、価格の動きと組み合わせた複合条件
  // （サーバー側で既に判定済み）のみを警戒材料の一つとして加える。この3条件のうちどれか1つだけが
  // 立っている状態は他のケースと同様にCAUTIONどまりで、単独でREDUCE/EXITには至らない
  // （「出来高だけで撤退等を決めない」という要件を、他の警戒シグナルと同じ加算の仕組みに載せる
  // ことで満たす＝出来高複合フラグ専用の特別な即断ルートは作らない）。
  if(positionFlags?.volumeUpWithDecline)reasons.push("出来高複合：出来高増加を伴う下落");
  if(positionFlags?.highZoneVolumeReversal)reasons.push("出来高複合：高値圏で大出来高からの反落");
  if(positionFlags?.failedBreakoutWithVolume)reasons.push("出来高複合：ブレイク失敗（出来高増加を伴う）");
  // Step9（板情報）：最良気配のスプレッド拡大は、それ単独では警戒シグナルに数えない。価格・出来高・
  // チャートのいずれかで既に1件以上の警戒が立っているときだけ「補強材料」として1件追加する
  // （＝板情報だけでreasonsがゼロから発生することはなく、常に他の材料との複合条件になる）。
  const spreadWarning=evaluateSpreadWarning(ask,bid,current);
  if(spreadWarning&&reasons.length>0)reasons.push(`板：スプレッド拡大（${spreadWarning.spreadPct}%、流動性低下の可能性）`);
  const warnCount=reasons.length;

  const trailKey=deriveTrailingStatus(currentStop,initialStop,avgPrice,current);
  const tp1Reached=target1!=null&&current!=null&&current>=target1;

  // 3. 利確①到達は警戒シグナルの有無に関わらず知らせる（見逃し防止。警戒理由があれば併記）
  if(tp1Reached)return {status:"TAKE_PROFIT",reasons:[...reasons,"利確①水準に到達"]};

  // 4. 警戒シグナル2つ以上：含み損ならEXIT検討、含み益ならREDUCE（一部利確）検討
  if(warnCount>=2){
    return {status:(pnlPct!=null&&pnlPct<=0)?"EXIT":"REDUCE",reasons};
  }
  // 5. 警戒シグナル1つ：CAUTION（注視）
  if(warnCount>=1)return {status:"CAUTION",reasons};

  // 6. トレーリング（Step7）：現在SLを手動で利益保護・追随中に設定済み（既存のderiveTrailingStatus）、
  //    またはDAY/SWING別のしきい値を超える含み益に達していれば、トレーリング開始の目安として提案する。
  //    ATR14（indicators.atr14、既存の分析結果を再利用）から算出したトレーリング幅ぶんだけ現在値
  //    から離した価格をsuggestedTrailingStopとして添える（あくまで目安の提示で、current_stopの
  //    自動書き換えは行わない）。
  const manualTrailing=trailKey==="TRAILING"||trailKey==="PROTECT";
  const trailStartPct=TRAIL_START_PCT[tradeStyle]??5;
  if(manualTrailing||(pnlPct!=null&&pnlPct>=trailStartPct)){
    const width=calcTrailingWidth(tradeStyle,current,indicators?.atr14);
    if(current!=null&&width!=null){
      const r=pnlPct!=null?[`含み益${pnlPct.toFixed(1)}%＝トレーリング開始の目安（幅：${tradeStyle==="DAY"?"ATR×1.0相当":"ATR×1.5相当"}）`]:[];
      if(manualTrailing)r.push(`現在SL状態：${TRAILING_STATUS_META[trailKey].label}`);
      return {status:"TRAIL",reasons:r,suggestedTrailingStop:Math.round((current-width)*100)/100};
    }
    if(manualTrailing)return {status:"TRAIL",reasons:[`現在SL状態：${TRAILING_STATUS_META[trailKey].label}`]};
  }
  // 7. 含み益がHOLD_STRONGしきい値以上だが、現在値・ATRが揃わずトレーリング幅を計算できない場合の
  //    フォールバック表示（「強い含み益」であることだけを伝える）。
  const holdStrongPct=HOLD_STRONG_PCT[tradeStyle]??15;
  if(pnlPct!=null&&pnlPct>=holdStrongPct)return {status:"HOLD_STRONG",reasons:[`含み益${pnlPct.toFixed(1)}%（トレーリング幅を計算するデータ不足）`]};

  // 8. デフォルト（通常保有継続）
  return {status:"HOLD",reasons:[]};
}
// current_stopが未設定ならOFF。initial_stopのままなら「初期SL」。average_priceと一致すれば
// 「建値」。average_priceより上に上げてあれば「利益保護」、さらに現在値との乖離が小さい
// （値幅を詰めて追随中とみなせる目安として3%以内）場合は「トレーリング」とする。完全自動売買は
// 行わず、あくまで表示用の簡易分類（新規の重い計算・保存列は追加しない）。
function deriveTrailingStatus(currentStop,initialStop,avgPrice,current){
  if(currentStop==null)return "OFF";
  const eq=(a,b)=>a!=null&&b!=null&&Math.abs(a-b)<0.01;
  if(eq(currentStop,initialStop))return "INITIAL";
  if(eq(currentStop,avgPrice))return "BREAKEVEN";
  if(avgPrice!=null&&currentStop>avgPrice){
    if(current!=null&&current>0&&(current-currentStop)/current<=0.03)return "TRAILING";
    return "PROTECT";
  }
  return "INITIAL";
}

// portfolio（保有株、2026-09-03新規、Trade Cockpit v3-2）：localStorageに存在しなかった新規
// 機能のため、最初からNeonのみで完結する（移行フローは不要）。ChatGPT朝一/大引けコピーに
// 保有銘柄として含める（TodaysMarketCard・ChatGptImportPanel側でこのAPIを叩く）。
// v3-4：SL/TP（initial_stop/current_stop/target_1/target_2）を追加。current_stopは行内で
// 直接編集・保存できる。stockQuotes（現在値）・analysisData（トレード分析タブのentry/stop/
// target/fullExitTargetのスナップショット）を新たにpropsで受け取り、既存の取得済みデータを
// 再利用する（新規リクエストは追加しない）。
// v3-9続き（2026-09-07・監視銘柄→ポジション連携・売買損益管理）：買い/買い増しの共通モーダル。
// 監視銘柄カードの「ポジション追加」（新規、needsTradeStyle=true）と、保有カードの「買い増し」
// （既存ポジション、needsTradeStyle=false）の両方から使う。サーバー側（add_position_entry）が
// 既存ポジションの有無を見て加重平均で合算するか新規作成するかを判断するため、呼び出し側の
// 分岐はneedsTradeStyleの有無だけで済む。
function PositionEntryModal({code,name,market,needsTradeStyle,onClose,onSaved}){
  const [price,setPrice]=useState("");
  const [shares,setShares]=useState("");
  const [tradeStyle,setTradeStyle]=useState("");
  const [saving,setSaving]=useState(false);
  const [errMsg,setErrMsg]=useState("");
  // 2026-09-08新規（日本市場一覧「⋮」→ポジションに追加、指示書4・5・6番）：
  // 現在値の参考表示（average_priceには絶対に自動で入れない）と、既に同一銘柄・市場の
  // ポジションが無いかの確認。既存の/api/stock-quotes・/api/portfolioをそのまま再利用する
  // だけで、新しいAPIは作らない。needsTradeStyle=false（PortfolioPanelの「買い増し」）は
  // そもそも既存ポジションへの追記が前提のため、重複確認はneedsTradeStyle=trueの時だけ行う
  // （買い増しのたびに「既にあります」と聞かれる煩わしさを避ける）。
  const [previewQuote,setPreviewQuote]=useState(null);
  const [existingPosition,setExistingPosition]=useState(null);
  useEffect(()=>{
    let cancelled=false;
    (async()=>{
      try{
        const r=await fetch("/api/stock-quotes",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify([{code,market}])});
        if(r.ok){const d=await r.json();if(!cancelled)setPreviewQuote(d.quotes?.[code]||null);}
      }catch(e){}
      if(needsTradeStyle){
        try{
          const r=await fetch("/api/portfolio");
          if(r.ok){
            const d=await r.json();
            const existing=(d.items||[]).find(it=>it.code===code&&(it.market||"JP")===market&&it.active!==false);
            if(!cancelled)setExistingPosition(existing||null);
          }
        }catch(e){}
      }
    })();
    return ()=>{cancelled=true;};
  },[code,market,needsTradeStyle]);
  const inputStyle={display:"block",width:"100%",marginTop:4,fontSize:15,padding:"6px 8px",
    border:"1px solid var(--rule)",borderRadius:4,background:"var(--bg)",color:"var(--ink)",boxSizing:"border-box"};
  const submit=async()=>{
    const p=num(price),s=num(shares);
    if(!(p>0)){setErrMsg("買値は正の数で入力してください");return;}
    if(!(s>0)){setErrMsg("枚数は正の数で入力してください");return;}
    if(needsTradeStyle&&!tradeStyle){setErrMsg("取引タイプ（DAY/SWING）を選択してください");return;}
    // 指示書6番：既存ポジションがある場合は単純上書きではなく「追加建て」であることを確認する
    // （承諾後の保存処理自体は元々add_position_entry＝加重平均合算のため変更不要）。
    if(existingPosition&&!confirm(
      `${name||code}（${code}）は既にポジションにあります（現在 ${num(existingPosition.quantity)?.toLocaleString()}株 @${num(existingPosition.average_price)?.toLocaleString()}円）。\n追加建てとして登録しますか？（既存分と加重平均で合算されます）`
    ))return;
    setSaving(true);setErrMsg("");
    try{
      const r=await fetch("/api/portfolio/add-entry",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({code,name,market,price:p,shares:s,trade_style:tradeStyle||undefined})});
      const d=await r.json();
      if(d.error){setErrMsg(d.error);}
      else{onSaved&&onSaved(d.position);onClose();}
    }catch(e){setErrMsg("通信エラー: "+e.message);}
    setSaving(false);
  };
  return <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:30,
      display:"flex",alignItems:"center",justifyContent:"center",padding:18}}>
    <div onClick={e=>e.stopPropagation()} style={{background:"var(--card)",border:"1px solid var(--rule)",borderRadius:12,
        width:"100%",maxWidth:360,padding:20,boxShadow:"var(--shadowLg)"}}>
      <div style={{fontWeight:700,fontSize:16,marginBottom:2}}>{name||code}</div>
      <div className="mono" style={{fontSize:12,color:"var(--inkSoft)",marginBottom:2}}>{code}{market?`（${market}）`:""}</div>
      {previewQuote?.t!=null && <div style={{fontSize:11.5,color:"var(--inkSoft)",marginBottom:10}}>現在値（参考） <span className="mono" style={{fontWeight:700,color:"var(--ink)"}}>{num(previewQuote.t)?.toLocaleString()}</span>円</div>}
      {existingPosition && <div style={{fontSize:11,color:"var(--accent)",fontWeight:700,background:"var(--band)",border:"1px solid var(--rule)",borderRadius:4,padding:"5px 8px",marginBottom:10}}>
        ⚠ 既にポジションにあります（{num(existingPosition.quantity)?.toLocaleString()}株 @{num(existingPosition.average_price)?.toLocaleString()}円）。追加建てとして登録できます。
      </div>}
      <label style={{display:"block",fontSize:12,color:"var(--inkSoft)"}}>買値
        <input type="number" value={price} onChange={e=>setPrice(e.target.value)} style={inputStyle}/>
      </label>
      <label style={{display:"block",fontSize:12,color:"var(--inkSoft)",marginTop:10}}>枚数
        <input type="number" value={shares} onChange={e=>setShares(e.target.value)} style={inputStyle}/>
      </label>
      {needsTradeStyle && <label style={{display:"block",fontSize:12,color:"var(--inkSoft)",marginTop:10}}>取引タイプ*
        <select value={tradeStyle} onChange={e=>setTradeStyle(e.target.value)}
          style={{...inputStyle,fontSize:14,color:tradeStyle?"var(--ink)":"var(--down)"}}>
          <option value="">選択してください</option>
          <option value="DAY">DAY（デイトレ）</option>
          <option value="SWING">SWING（スイング）</option>
        </select>
      </label>}
      {errMsg && <div style={{fontSize:12,color:"var(--down)",marginTop:10}}>{errMsg}</div>}
      <div style={{display:"flex",gap:8,marginTop:14}}>
        <button className="btn primary" disabled={saving} onClick={submit}>{saving?"保存中…":"ポジション追加"}</button>
        <button className="ghost" onClick={onClose}>キャンセル</button>
      </div>
    </div>
  </div>;
}

// v3-9続き：売却モーダル。誤操作防止のため「入力」→「確認（損益プレビュー）」の2段階にする
// （ユーザー指示：売却単価・売却枚数・実現損益を確定前に必ず確認できること）。
function PositionExitModal({position,currentPrice,onClose,onSaved}){
  const [price,setPrice]=useState(currentPrice!=null?String(Math.round(currentPrice)):"");
  const [shares,setShares]=useState(position.quantity!=null?String(position.quantity):"");
  const [confirming,setConfirming]=useState(false);
  const [saving,setSaving]=useState(false);
  const [errMsg,setErrMsg]=useState("");
  // v3-9追加（2026-09-07・ユーザーフィードバック→実機テストで発覚した修正）：確定ボタンの
  // 連打・通信遅延によるtrade_historyへの二重登録防止ガード。当初はuseState(saving)を
  // submit()冒頭でチェックしていたが、同一イベントループtick内での連続クリック
  // （btn.click();btn.click();のような極端な連打）ではReactのstate更新が間に合わず、
  // 2回目の呼び出しも「submitが定義された時点のsaving=false」を見たままガードが効かない
  // ケースを実機検証で確認したため、レンダーを跨いでも同期的に共有されるuseRefへ変更した
  // （このrefはReactの再描画を待たずその場で読み書きできるため、同tick内の連打にも耐える）。
  const savingRef=useRef(false);
  const p=num(price),s=num(shares);
  const avg=num(position.average_price)||0;
  const pnl=(p!=null&&p>0&&s!=null&&s>0)?(p-avg)*s:null;
  const tradeTax=calcTradeTax(pnl);
  const inputStyle={display:"block",width:"100%",marginTop:4,fontSize:15,padding:"6px 8px",
    border:"1px solid var(--rule)",borderRadius:4,background:"var(--bg)",color:"var(--ink)",boxSizing:"border-box"};
  const goConfirm=()=>{
    if(!(p>0)){setErrMsg("売値は正の数で入力してください");return;}
    if(!(s>0)){setErrMsg("売却枚数は正の数で入力してください");return;}
    if(s>Number(position.quantity||0)+1e-9){setErrMsg(`保有枚数（${num(position.quantity)?.toLocaleString()}株）を超える売却はできません`);return;}
    setErrMsg("");setConfirming(true);
  };
  const submit=async()=>{
    if(savingRef.current)return;
    savingRef.current=true;
    setSaving(true);setErrMsg("");
    try{
      const r=await fetch("/api/portfolio/exit",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({code:position.code,market:position.market,exitPrice:p,shares:s})});
      const d=await r.json();
      if(d.error){setErrMsg(d.error);setConfirming(false);}
      else{onSaved&&onSaved(d);onClose();}
    }catch(e){setErrMsg("通信エラー: "+e.message);}
    savingRef.current=false;
    setSaving(false);
  };
  return <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:30,
      display:"flex",alignItems:"center",justifyContent:"center",padding:18}}>
    <div onClick={e=>e.stopPropagation()} style={{background:"var(--card)",border:"1px solid var(--rule)",borderRadius:12,
        width:"100%",maxWidth:380,padding:20,boxShadow:"var(--shadowLg)"}}>
      {!confirming ? <>
        <div style={{fontWeight:700,fontSize:16,marginBottom:2}}>{position.name||position.code}</div>
        <div className="mono" style={{fontSize:12,color:"var(--inkSoft)",marginBottom:10}}>{position.code}</div>
        {/* v3-9続き（2026-09-07・リアルタイム売却判断 Phase1）：item13「取得単価・現在値を同時表示」。
            currentPriceは呼び出し元（PortfolioPanelの一覧行、またはリアルタイム詳細エリア展開時は
            その最新取得値）からそのまま受け取るだけで、この画面自体は新規に価格取得しない。 */}
        <div style={{fontSize:12,color:"var(--inkSoft)",marginBottom:10,display:"flex",gap:14,flexWrap:"wrap"}}>
          <span>保有 <span className="mono" style={{fontWeight:700,color:"var(--ink)"}}>{num(position.quantity)?.toLocaleString()}</span>株</span>
          <span>取得 <span className="mono" style={{fontWeight:700,color:"var(--ink)"}}>{avg?avg.toLocaleString():"—"}</span>円</span>
          <span>現在 <span className="mono" style={{fontWeight:700,color:"var(--ink)"}}>{currentPrice!=null?Math.round(currentPrice).toLocaleString():"—"}</span>円</span>
        </div>
        <label style={{display:"block",fontSize:12,color:"var(--inkSoft)"}}>売値
          <input type="number" value={price} onChange={e=>setPrice(e.target.value)} style={inputStyle}/>
        </label>
        <label style={{display:"block",fontSize:12,color:"var(--inkSoft)",marginTop:10}}>売却枚数
          <input type="number" value={shares} onChange={e=>setShares(e.target.value)} style={inputStyle}/>
        </label>
        {/* item14/15：株数ショートカット。押しただけでは確定せず、あくまで入力欄に値をセットするのみ
            （従来通り「入力→確認画面→確定」の2段階は維持）。単元株数（JP=100株・US=1株）にfloor
            丸め。丸めた結果0株になる場合（例：保有100株＝1単元のみで25%を選ぶと0株になる）は、
            誤って「全株売却」に化けさせると事故の元になるため、フォールバックはせずボタン自体を
            disabledにする（実際に選択可能な株数だけを提示する）。 */}
        <div style={{display:"flex",gap:6,marginTop:8,flexWrap:"wrap"}}>
          {[0.25,0.5,0.75,1].map(pct=>{
            const total=Number(position.quantity||0);
            const lotSize=position.market==="JP"?100:1;
            const sug=pct===1?total:Math.floor(total*pct/lotSize)*lotSize;
            const disabled=!(sug>0);
            return <button key={pct} type="button" className="ghost" disabled={disabled}
              style={{fontSize:11,padding:"3px 9px",opacity:disabled?0.4:1,cursor:disabled?"default":"pointer"}}
              onClick={()=>!disabled&&setShares(String(sug))}>{pct===1?"全株":`${pct*100}%`}</button>;
          })}
        </div>
        {errMsg && <div style={{fontSize:12,color:"var(--down)",marginTop:10}}>{errMsg}</div>}
        <div style={{display:"flex",gap:8,marginTop:14}}>
          <button className="btn primary" onClick={goConfirm}>次へ（確認）</button>
          <button className="ghost" onClick={onClose}>キャンセル</button>
        </div>
      </> : <>
        <div style={{fontWeight:700,fontSize:15,marginBottom:12}}>売却確認</div>
        <div style={{fontSize:13,marginBottom:6}}>{position.name||position.code} <span className="mono" style={{color:"var(--inkSoft)"}}>{position.code}</span></div>
        <div style={{fontSize:12.5,color:"var(--inkSoft)",display:"flex",flexDirection:"column",gap:2,marginBottom:12}}>
          <div>取得単価　{avg.toLocaleString()}円</div>
          <div>売却単価　{p.toLocaleString()}円</div>
          <div>売却枚数　{s.toLocaleString()}株</div>
        </div>
        {/* 2026-09-07追加（通算実現損益を税引後ベースへ変更）：税引前損益・概算税額・税引後損益を
            確定前に確認できるようにする。実際に保存されるgross_pnl/tax/net_pnlと同じ計算式
            （calcTradeTax、SSoTはinvestment_db.py側）を使ってプレビューするだけで、確定処理
            自体はこれまで通りサーバー側（add_position_exit）が権威を持つ。 */}
        <div style={{fontSize:11,color:"var(--inkFaint)",marginBottom:2}}>税引前損益</div>
        <div style={{fontSize:19,fontWeight:800,color:pnl>=0?"var(--up)":"var(--down)",marginBottom:8}}>
          {pnl>=0?"+":""}{Math.round(pnl).toLocaleString()}円
        </div>
        <div style={{fontSize:12,color:"var(--inkSoft)",display:"flex",justifyContent:"space-between",marginBottom:2}}>
          <span>概算税額</span><span className="mono">{tradeTax.tax>0?`-${tradeTax.tax.toLocaleString()}円`:"0円"}</span>
        </div>
        <div style={{fontSize:11,color:"var(--inkFaint)",marginTop:8,marginBottom:2}}>税引後損益</div>
        <div style={{fontSize:19,fontWeight:800,color:tradeTax.netPnl>=0?"var(--up)":"var(--down)",marginBottom:6}}>
          {tradeTax.netPnl>=0?"+":""}{Math.round(tradeTax.netPnl).toLocaleString()}円
        </div>
        <div style={{fontSize:10,color:"var(--inkFaint)",marginBottom:16}}>
          ※ 税額は概算（{(STOCK_CAPITAL_GAINS_TAX_RATE*100).toFixed(3)}%、損失の場合は0円）です。実際の源泉徴収額は証券会社の損益通算等により異なる場合があります。通算実現損益に反映されるのは税引後損益です。
        </div>
        {errMsg && <div style={{fontSize:12,color:"var(--down)",marginBottom:10}}>{errMsg}</div>}
        <div style={{display:"flex",gap:8}}>
          <button className="btn primary" disabled={saving} style={saving?{pointerEvents:"none",opacity:.6}:undefined} onClick={submit}>{saving?"確定中…":"確定"}</button>
          <button className="ghost" disabled={saving} onClick={()=>setConfirming(false)}>戻る</button>
        </div>
      </>}
    </div>
  </div>;
}

// 2026-09-07新規（ポジション→リアルタイム売却判断画面 Phase2）：当日5分足チャート。
// 既存のJP個別株チャート（LightweightCharts、5-2章）と全く同じライブラリ・同じ配色規約を再利用
// する。データ取得（ローソク足・出来高）とライン描画（建値・SL・TP・現在値）を別のuseEffectに
// 分離しているのは、現在値が数秒〜十数秒おきに変わるたびにチャート本体を作り直す（ズーム位置が
// リセットされる等）のを避けるため——チャート自体の作成・データの定期取得はitem.code/marketが
// 変わらない限り実行されず、水平線だけを値の変化に応じて引き直す。既存の売却処理・
// derivePositionStatus等のポジションSSoTには一切関与しない、表示専用の追加コンポーネント。
const POSITION_CHART_POLL_MS=45000; // 5分足データの再取得間隔（yfinanceの分足はTachibana現在値ほど頻繁に叩く想定のAPIではないため、価格ティッカーより控えめにする）
function PositionIntradayChart({item,currentPrice}){
  const containerRef=useRef(null);
  const apiRef=useRef(null); // {chart,series,volSeries,lines}
  const [msg,setMsg]=useState("読み込み中…");

  // チャート本体の作成・5分足OHLCVの定期取得。item.code/marketが変わった時だけ作り直す。
  useEffect(()=>{
    let cancelled=false;
    const el=containerRef.current;
    if(!el)return;
    if(typeof LightweightCharts==="undefined"){setMsg("チャート描画ライブラリの読み込みに失敗しました。通信環境をご確認ください。");return;}
    el.innerHTML="";
    const chart=LightweightCharts.createChart(el,{width:el.clientWidth||600,height:280,
      layout:{background:{color:"transparent"},textColor:"#565A52"},
      grid:{vertLines:{color:"#D6D8CF"},horzLines:{color:"#D6D8CF"}},
      timeScale:{borderColor:"#C6C8BF",timeVisible:true,secondsVisible:false},
      rightPriceScale:{borderColor:"#C6C8BF"}});
    const series=chart.addCandlestickSeries({upColor:"#AE3A34",downColor:"#2C6A48",borderVisible:false,
      wickUpColor:"#AE3A34",wickDownColor:"#2C6A48"}); // 日本の相場慣習に合わせ赤=上昇・緑=下落（既存JPチャートと同一配色）
    const volSeries=chart.addHistogramSeries({priceFormat:{type:"volume"},priceScaleId:"volPane",color:"#8a8f80"});
    volSeries.priceScale().applyOptions({scaleMargins:{top:0.82,bottom:0}});
    apiRef.current={chart,series,volSeries,lines:[]};

    const loadBars=async()=>{
      const d=await fetchJsonSafe(`/api/position-intraday-chart?code=${encodeURIComponent(item.code)}&market=${encodeURIComponent(item.market||"JP")}`);
      if(cancelled)return;
      const bars=d.bars||[];
      if(bars.length===0){setMsg(d.error||"当日の5分足データを取得できませんでした。");return;}
      setMsg("");
      series.setData(bars.map(b=>({time:b.time,open:b.open,high:b.high,low:b.low,close:b.close})));
      volSeries.setData(bars.map(b=>({time:b.time,value:b.volume,color:b.close>=b.open?"rgba(174,58,52,.5)":"rgba(44,106,72,.5)"})));
      chart.timeScale().fitContent();
    };
    loadBars();
    const timer=setInterval(loadBars,POSITION_CHART_POLL_MS);
    const ro=new ResizeObserver(entries=>{const w=entries[0]?.contentRect?.width;if(w)chart.applyOptions({width:Math.floor(w)});});
    ro.observe(el);
    return ()=>{cancelled=true;clearInterval(timer);ro.disconnect();chart.remove();apiRef.current=null;};
  },[item.code,item.market]);

  // 建値・初期SL・現在SL・TP1・TP2・現在値の水平線。item21〜7の要件：値が変わった時だけ
  // 引き直す（チャート自体・ズーム位置は保持したまま）。
  useEffect(()=>{
    const api=apiRef.current;
    if(!api||typeof LightweightCharts==="undefined")return;
    const {series}=api;
    (api.lines||[]).forEach(pl=>{try{series.removePriceLine(pl);}catch(e){}});
    const lines=[];
    const addLine=(price,color,title)=>{
      if(price==null)return;
      lines.push(series.createPriceLine({price,color,lineWidth:1,lineStyle:LightweightCharts.LineStyle.Dashed,axisLabelVisible:true,title}));
    };
    addLine(item.average_price,"#3A6EA5","建値");
    addLine(item.initial_stop,"#AE3A34","初期SL");
    addLine(item.current_stop,"#D98C3F","現在SL");
    addLine(item.target_1,"#2C6A48","TP1");
    addLine(item.target_2,"#1F8F5F","TP2");
    addLine(currentPrice,"#565A52","現在値");
    api.lines=lines;
  },[item.average_price,item.initial_stop,item.current_stop,item.target_1,item.target_2,currentPrice]);

  return <div style={{marginTop:8}}>
    {msg && <div style={{fontSize:11,color:"var(--inkFaint)",marginBottom:4}}>{msg}</div>}
    <div ref={containerRef} style={{width:"100%",minHeight:280}}/>
  </div>;
}

// 2026-09-07更新（リアルタイム売却判断のCAUTION改善）：既存derivePositionStatus()（トレード
// 分析用SSoT、日足・63営業日高値ベースの評価も含む——ここは一切変更しない）はそのまま残し、
// 「チャート分析タブ」等の既存用途で引き続き使われる。
// 一方、9984の実データトレースで判明した通り、既存の8状態→3段階マッピングをそのまま
// リアルタイム売却判断に使うと、evaluateChartBreakdown()内のbreakoutLookbackHigh
// （直近63営業日＝3か月の"日足"高値。当日の値動きとは無関係にほぼ一定）だけを理由に
// CAUTIONになってしまう問題があった。STOP・TAKE_PROFITはchart-breakdown評価より前に
// 確定する“きれいな”判定なのでそのまま信頼するが、CAUTION相当はリアルタイム専用に
// deriveRealtimeAlert()で作り直す（下記参照、新しい巨大スコアリングは作らず既存の閾値・
// 既存データを転用するだけ）。
const POSITION_ALERT_TIER_META={
  HOLD:{icon:"🟢",label:"HOLD",color:"#2C6A48"},
  TAKE_PROFIT:{icon:"🔵",label:"TAKE PROFIT",color:"#3A6EA5"},
  CAUTION:{icon:"🟡",label:"CAUTION",color:"#D98C3F"},
  EXIT_ALERT:{icon:"🔴",label:"EXIT ALERT",color:"#AE3A34"},
};
// 2026-09-07新規（リアルタイム売却判断専用）：既存derivePositionStatus()を1回だけ呼び、
// STOP（2026-09-10更新：全トレードスタイル共通EXIT RULE -8%、chart-breakdown評価より前に
// 確定するため汚染されていない）とTAKE_PROFIT（利確①到達、item6：既存SSoTが返した場合の
// み使用し新しい利確条件は作らない）
// はそのまま信頼する。それ以外（REDUCE/CAUTION/TRAIL/HOLD_STRONG/HOLD）は、
// breakoutLookbackHigh等の日足・中期指標を含むため使わず、当日の値動きだけで独自に
// 警戒シグナルを数え直す：
//   ・現在SL割れ／接近（3%以内）…既存deriveTrailingStatusの3%という閾値をそのまま流用
//   ・建値割れ…新規計算なし（buildDiffの符号を見るだけ）
//   ・当日高値から-3%以上の失速…既存evaluateChartBreakdown（DAY分岐）と同じ-3%閾値を流用、
//     ただしindicators.intradayHigh（分析時点の古い値）ではなくdetail.high（リアルタイム）を使う
//   ・出来高：AUTO_VOLUMEのvolumeType分類（NEGATIVE_VOLUME/CLIMAX_DOWN）をそのまま転用
//   ・SWINGのみ：positionFlags.swingLowRecent（直近10営業日安値＝中期支持線、
//     breakoutLookbackHigh＝63営業日高値とは別物）を追加考慮（item5：DAYには効かせない）
// breakoutLookbackHigh自体は削除せず、CAUTION判定には使わず「中期参考」として表示するのみ
// にする（item3）。
function deriveRealtimeAlert({item,detail,cur,posFlags,posIndicators,enrStatus,pnlPct}){
  const base=derivePositionStatus({avgPrice:item.average_price,tradeStyle:item.trade_style,
    current:cur,currentStop:item.current_stop,initialStop:item.initial_stop,target1:item.target_1,
    positionFlags:posFlags,pnlPct,indicators:posIndicators,enrStatus,ask:detail.ask,bid:detail.bid});
  if(base.status==="STOP")return {tier:"EXIT_ALERT",reasons:base.reasons};

  const avg=num(item.average_price);
  const currentStop=num(item.current_stop);
  const high=num(detail.high);
  const reasons=[];
  let exitAlert=false;

  if(currentStop!=null&&cur!=null&&currentStop>0){
    if(cur<currentStop){reasons.push(`現在SL割れ（SL ${currentStop.toLocaleString()}円）`);exitAlert=true;}
    else if((cur-currentStop)/cur<=0.03){reasons.push(`現在SLに接近（残り${(((cur-currentStop)/cur)*100).toFixed(1)}%）`);}
  }
  if(avg!=null&&cur!=null&&cur<avg){reasons.push("建値割れ");}
  if(high!=null&&cur!=null&&high>0&&(high-cur)/high>=0.03){
    reasons.push(`当日高値から急反落（-${(((high-cur)/high)*100).toFixed(1)}%）`);
  }
  const volType=detail.volumeDetail?.volumeType;
  if(volType==="NEGATIVE_VOLUME"||volType==="CLIMAX_DOWN"){
    reasons.push("出来高急増を伴う下落（AUTO_VOLUME判定）");
  }
  if(item.trade_style==="SWING"&&posFlags?.swingLowRecent!=null&&cur!=null&&cur<posFlags.swingLowRecent){
    reasons.push("直近スイング安値割れ（中期支持線）");
  }

  if(exitAlert)return {tier:"EXIT_ALERT",reasons};
  if(base.status==="TAKE_PROFIT")return {tier:"TAKE_PROFIT",reasons:["利確①水準に到達",...reasons]};
  if(reasons.length>=1)return {tier:"CAUTION",reasons};
  return {tier:"HOLD",reasons:[]};
}

// 2026-09-07新規（Phase3）：5分足チャートの右側に置く「売却判断」エリア。現在状態
// （deriveRealtimeAlert・上記参照）・建値との関係・当日高値からの下落率・出来高評価

  const avg=num(item.average_price);
  const high=num(detail.high);
  const buildDiff=(avg!=null&&cur!=null)?cur-avg:null;
  const buildDiffPct=(avg&&cur!=null)?(cur-avg)/avg*100:null;
  const {amount:pnlAmount,pct:pnlPct}=calcUnrealizedPnl(item.average_price,item.quantity,cur);
  const fromHighPct=(high&&cur!=null)?(cur-high)/high*100:null;
  const ask=num(detail.ask),bid=num(detail.bid);
  const vd=detail.volumeDetail;

  const alert=deriveRealtimeAlert({item,detail,cur,posFlags,posIndicators,enrStatus,pnlPct});
  const tierMeta=POSITION_ALERT_TIER_META[alert.tier];

  // item3：63営業日高値は判定には使わず「中期参考」として表示するだけにする。
  const breakoutHigh=num(posFlags?.breakoutLookbackHigh);

  return <div style={{padding:"10px 10px",background:"var(--bg)",border:"1px solid var(--rule)",borderRadius:5}}>
    {/* item2：現在状態（HOLD/TAKE PROFIT/CAUTION/EXIT ALERTの4段階）＋item4：理由（最大3件） */}
    <div style={{fontSize:16,fontWeight:800,color:tierMeta.color,marginBottom:4}}>{tierMeta.icon} {tierMeta.label}</div>
    {alert.reasons.length>0 && <ul style={{margin:"0 0 10px",paddingLeft:16,fontSize:11.5,color:"var(--inkSoft)"}}>
      {alert.reasons.slice(0,3).map((r,i)=><li key={i}>{r}</li>)}
    </ul>}

    {/* item4：建値との関係（視認性を高くする、専用ブロック） */}
    <div style={{padding:"8px 10px",background:"var(--card)",border:"1px solid var(--ruleSoft)",borderRadius:4,marginBottom:8}}>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:"var(--inkSoft)"}}>
        <span>建値 {avg!=null?avg.toLocaleString():"—"}円</span>
        <span>現在 {cur!=null?cur.toLocaleString():"—"}円</span>
      </div>
      <div className="mono" style={{fontSize:17,fontWeight:800,marginTop:4,
          color:pnlAmount==null?"var(--inkFaint)":pnlAmount>0?"var(--up)":pnlAmount<0?"var(--down)":"var(--inkSoft)"}}>
        {buildDiff!=null?`${buildDiff>0?"+":""}${buildDiff.toLocaleString()}円`:"—"}
      </div>
      <div className="mono" style={{fontSize:13,fontWeight:700,
          color:pnlAmount==null?"var(--inkFaint)":pnlAmount>0?"var(--up)":pnlAmount<0?"var(--down)":"var(--inkSoft)"}}>
        {pnlAmount!=null?`${pnlAmount>0?"+":""}${Math.round(pnlAmount).toLocaleString()}円`:"—"}
        {buildDiffPct!=null && <span style={{marginLeft:8}}>({buildDiffPct>0?"+":""}{buildDiffPct.toFixed(2)}%)</span>}
      </div>
    </div>

    {/* item5：当日高値からの下落率（売却判断で重要なため専用行） */}
    <div style={{fontSize:12,marginBottom:8}}>
      <div style={{color:"var(--inkSoft)"}}>高値 {high!=null?high.toLocaleString():"—"}円　現在 {cur!=null?cur.toLocaleString():"—"}円</div>
      <div className="mono" style={{fontWeight:700,color:fromHighPct!=null&&fromHighPct<0?"var(--down)":"var(--inkSoft)"}}>
        高値から {fromHighPct!=null?`${fromHighPct>0?"+":""}${fromHighPct.toFixed(2)}%`:"—"}
      </div>
    </div>

    {/* item3：63営業日高値（3か月の日足高値）は判定には使わず、中期参考として小さく表示するのみ。
        トレード分析タブのbreakoutLookbackHigh自体は削除・変更していない。 */}
    {breakoutHigh!=null && <div style={{fontSize:10.5,color:"var(--inkFaint)",marginBottom:8}}>
      中期参考　63日高値 {breakoutHigh.toLocaleString()}円　現在値は高値比 {breakoutDiffPct!=null?`${breakoutDiffPct>0?"+":""}${breakoutDiffPct.toFixed(1)}%`:"—"}
    </div>}

    {/* item6：出来高評価（AUTO_VOLUME再利用、Phase1と同じデータをこのブロックへ統合） */}
    {vd && <div style={{fontSize:12,marginBottom:8}}>
      <span style={{color:"var(--inkSoft)"}}>出来高比 </span>
      <span className="mono" style={{fontWeight:700}}>{vd.timeAdjustedVolumeRatio!=null?`${vd.timeAdjustedVolumeRatio}x`:"—"}</span>
      {vd.volumeType && <span style={{fontWeight:700,marginLeft:8}}>{VOLUME_TYPE_LABEL[vd.volumeType]||vd.volumeType}</span>}
    </div>}

    {/* item1：最良気配（複数段の板は取得不可のため最良値のみ。数量は未確認のため表示しない＝推測しない） */}
    <div style={{fontSize:12,marginBottom:4}}>
      <div style={{fontWeight:700,color:"var(--inkSoft)",marginBottom:2}}>最良気配</div>
      <div className="mono" style={{display:"flex",flexDirection:"column",gap:1}}>
        <span>売 {ask!=null?`${ask.toLocaleString()}円`:"—"}</span>
        <span>現在 {cur!=null?cur.toLocaleString():"—"}円</span>
        <span>買 {bid!=null?`${bid.toLocaleString()}円`:"—"}</span>
      </div>
    </div>
    <div style={{fontSize:10,color:"var(--inkFaint)",marginBottom:8}}>※ 複数段の板情報は未取得</div>

    {/* item8/9：売却ボタン（EXIT ALERTでも自動売却はしない。既存PositionExitModalをそのまま開くだけ） */}
    <button className="btn primary" style={{fontSize:12,width:"100%"}} onClick={()=>onOpenExit(item,cur)}>💰 売却</button>
  </div>;
