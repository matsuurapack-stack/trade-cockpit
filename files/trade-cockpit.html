// ChatGPT連携（2026-09-02新規、Phase1）：有料AI APIは使わず、「ChatGPTで相談→JSON出力→
// ここへ手動貼り付け」の半自動フローで投資ログをNeonへ蓄積する。JSONの構造検証はまずここ
// （フロント）で即時に行い、保存はサーバー側（server.py）でも同じ検証をやり直す（二重防御）。
const CHATGPT_ALLOWED_EXECUTION=["BUY","SELL","WAIT","WATCH","NO_TRADE","MISSED","CANCELLED","STOP_LOSS","TAKE_PROFIT"];
const CHATGPT_SAMPLE_JSON=`{
  "date": "${(()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");})()}",
  "market": { "condition": "bearish", "summary": "全面安",
    "strong_sectors": ["shipping"], "weak_sectors": ["banks","semiconductors"] },
  "watchlist": [ {"code":"9107","name":"川崎汽船","status":"WATCH","reason":"全面安の中で相対的に強い"} ],
  "decisions": [ {"code":"9107","user_decision":"WAIT","ai_decision":"WAIT","execution":"NO_TRADE",
    "reason":"地合いが悪いため","mental_state":"calm"} ],
  "review": "無理に入らず待った",
  "rule_updates": []
}`;

function validateChatGptPayload(obj){
  const errs=[];
  if(typeof obj!=="object"||obj===null||Array.isArray(obj)){errs.push("JSONのトップレベルはオブジェクトである必要があります");return errs;}
  if(!obj.date||!/^\d{4}-\d{2}-\d{2}$/.test(obj.date))errs.push("date は YYYY-MM-DD 形式の文字列で必須です");
  if(obj.watchlist!=null&&!Array.isArray(obj.watchlist))errs.push("watchlist は配列である必要があります");
  (obj.watchlist||[]).forEach((w,i)=>{ if(!w||!w.code)errs.push(`watchlist[${i}] に code がありません`); });
  if(obj.decisions!=null&&!Array.isArray(obj.decisions))errs.push("decisions は配列である必要があります");
  (obj.decisions||[]).forEach((d,i)=>{
    if(!d||!d.code){errs.push(`decisions[${i}] に code がありません`);return;}
    if(d.execution&&!CHATGPT_ALLOWED_EXECUTION.includes(d.execution))
      errs.push(`decisions[${i}].execution "${d.execution}" は許可された値ではありません（許可: ${CHATGPT_ALLOWED_EXECUTION.join(", ")}）`);
  });
  if(obj.rule_updates!=null&&!Array.isArray(obj.rule_updates))errs.push("rule_updates は配列である必要があります");
  return errs;
}

function ChatGptImportPanel({journal,activeRules}){
  const [rawText,setRawText]=useState("");
  const [parsed,setParsed]=useState(null);
  const [parseErrors,setParseErrors]=useState([]);
  const [saving,setSaving]=useState(false);
  const [saveMsg,setSaveMsg]=useState("");
  const [dupInfo,setDupInfo]=useState(null); // {error} が重複だった場合、再送信（force）を促す
  const [imports,setImports]=useState([]);
  const [loadingImports,setLoadingImports]=useState(true);

  const loadImports=async()=>{
    setLoadingImports(true);
    try{
      const r=await fetch("/api/chatgpt-import/list");
      if(r.ok){const d=await r.json();setImports(Array.isArray(d.imports)?d.imports:[]);}
    }catch(e){}
    setLoadingImports(false);
  };
  useEffect(()=>{loadImports();},[]);

  // ChatGPT連携（Phase6・設計案47番）：大引け振り返り用にコピー。有料AI APIは使わず、
  // 今日のtrade_candidates・journal（本日分）・投資ルールをテキストにまとめてコピーするだけ。
  const [closingMsg,setClosingMsg]=useState("");
  const copyClosingReport=async()=>{
    const today=todayISO();
    const lines=[`【Trade Cockpit 大引け振り返り】${new Date().toLocaleString("ja-JP")}`,""];
    try{
      const r=await fetch("/api/portfolio");
      if(r.ok){const d=await r.json();const ps=d.items||[];
        if(ps.length){lines.push(`■ 保有銘柄（${ps.length}件）`);
          ps.forEach(p=>lines.push(`${p.code} ${p.name||""}${p.quantity!=null?` ${p.quantity}株`:""}${p.average_price!=null?` @${p.average_price}`:""}`));lines.push("");}}
    }catch(e){}
    try{
      const r=await fetch("/api/trade-candidates");
      if(r.ok){
        const d=await r.json();const cs=d.candidates||[];
        if(cs.length){lines.push(`■ 今日の候補（${cs.length}件）`);
          cs.forEach(c=>lines.push(`${c.code} ${c.name}（${c.status}）RS Score${c.rs_score??"—"}`));lines.push("");}
      }
    }catch(e){}
    const todayJournal=(journal||[]).filter(j=>(j.createdAt||"").slice(0,10)===today);
    if(todayJournal.length){
      lines.push(`■ 本日の売買記録（${todayJournal.length}件）`);
      todayJournal.forEach(j=>lines.push(`${j.code} ${j.name}　${j.action}　${j.price}円×${j.shares}株　結果:${j.result}${j.reason?`　理由:${j.reason}`:""}`));
      lines.push("");
    }else{
      lines.push("■ 本日の売買記録：なし（見送り・様子見の日）");lines.push("");
    }
    if(activeRules?.length){lines.push("■ 投資ルール");activeRules.forEach(t=>lines.push(`・${t}`));lines.push("");}
    lines.push("上記の内容を踏まえ、今日の投資判断ログ用JSON（date/market/watchlist/decisions/review/rule_updates）を作成してください。");
    const ok=await copyText(lines.join("\n"));
    setClosingMsg(ok?"コピーしました":"コピーに失敗しました");
    setTimeout(()=>setClosingMsg(""),2500);
  };

  const parse=()=>{
    setSaveMsg("");setDupInfo(null);
    let obj;
    try{ obj=JSON.parse(rawText); }
    catch(e){ setParsed(null);setParseErrors(["JSONとして正しくありません: "+e.message]);return; }
    const errs=validateChatGptPayload(obj);
    setParseErrors(errs);
    setParsed(errs.length===0?obj:null);
  };

  const updateMarket=(field,value)=>setParsed(p=>({...p,market:{...(p.market||{}),[field]:value}}));
  const updateSectorList=(field,text)=>updateMarket(field,text.split(",").map(s=>s.trim()).filter(Boolean));
  const updateWatchItem=(idx,field,value)=>setParsed(p=>({...p,watchlist:(p.watchlist||[]).map((w,i)=>i===idx?{...w,[field]:value}:w)}));
  const removeWatchItem=(idx)=>setParsed(p=>({...p,watchlist:(p.watchlist||[]).filter((_,i)=>i!==idx)}));
  const updateDecisionItem=(idx,field,value)=>setParsed(p=>({...p,decisions:(p.decisions||[]).map((d,i)=>i===idx?{...d,[field]:value}:d)}));
  const removeDecisionItem=(idx)=>setParsed(p=>({...p,decisions:(p.decisions||[]).filter((_,i)=>i!==idx)}));
  const updateRuleUpdate=(idx,value)=>setParsed(p=>({...p,rule_updates:(p.rule_updates||[]).map((r,i)=>i===idx?value:r)}));
  const removeRuleUpdate=(idx)=>setParsed(p=>({...p,rule_updates:(p.rule_updates||[]).filter((_,i)=>i!==idx)}));

  const save=async(force)=>{
    setSaving(true);setSaveMsg("");setDupInfo(null);
    try{
      const r=await fetch("/api/chatgpt-import/save",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({payload:parsed,force:!!force})});
      const d=await r.json();
      if(d.errors){setSaveMsg("保存失敗：\n・"+d.errors.join("\n・"));}
      else if(d.error){setDupInfo(d);}
      else{
        setSaveMsg(`保存しました（daily_log ID ${d.dailyLogId}・銘柄評価 ${d.judgments}件・追加ルール ${d.rulesAdded}件）`);
        setRawText("");setParsed(null);setParseErrors([]);loadImports();
      }
    }catch(e){setSaveMsg("保存に失敗しました。サーバーが起動しているか確認してください。");}
    setSaving(false);
  };

  const fieldStyle={width:"100%",fontSize:12.5,padding:"5px 7px",border:"1px solid var(--rule)",borderRadius:3,background:"var(--bg)",color:"var(--ink)",boxSizing:"border-box"};
  const labelStyle={fontSize:11,color:"var(--inkSoft)",display:"block",marginBottom:2};

  return <div style={{marginTop:18}}>
    <div className="sec-head">ChatGPT連携（投資ログ取り込み）</div>
    <div className="sec-note">
      ChatGPTで相談して作成した投資ログJSONをここへ貼り付けます。有料AI APIはこのアプリからは呼び出しません
      （ChatGPTとのやり取りは従来どおりChatGPT側で行い、その結果のJSONだけをコピー＆ペーストします）。
    </div>

    <div style={{marginTop:10,display:"flex",alignItems:"center",gap:8}}>
      <button className="action-btn" onClick={copyClosingReport}>📋 ChatGPT大引け振り返り用にコピー</button>
      {closingMsg && <span style={{fontSize:11,color:"var(--inkSoft)"}}>{closingMsg}</span>}
    </div>

    <div style={{marginTop:16}}>
      <label style={labelStyle}>ChatGPTが出力したJSON
        <button className="action-btn" style={{marginLeft:8,fontSize:11}} onClick={()=>setRawText(CHATGPT_SAMPLE_JSON)}>サンプルを入力</button>
      </label>
      <textarea value={rawText} onChange={e=>setRawText(e.target.value)} rows={10} placeholder='{"date":"2026-09-02", ...}'
        style={{...fieldStyle,fontFamily:"monospace",fontSize:12}}/>
      <button className="action-btn" style={{marginTop:8}} onClick={parse} disabled={!rawText.trim()}>解析</button>
    </div>

    {parseErrors.length>0 && <div className="card" style={{marginTop:12,padding:"10px 14px",border:"1px solid var(--down)"}}>
      <b style={{color:"var(--down)"}}>入力内容にエラーがあります：</b>
      <ul style={{margin:"6px 0 0",paddingLeft:18,fontSize:12.5,color:"var(--down)"}}>
        {parseErrors.map((e,i)=><li key={i}>{e}</li>)}
      </ul>
    </div>}

    {parsed && <div className="card" style={{marginTop:12,padding:"12px 14px"}}>
      <b>プレビュー（保存前に内容を確認・修正できます）</b>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:10}}>
        <div><label style={labelStyle}>日付</label>
          <input style={fieldStyle} value={parsed.date||""} onChange={e=>setParsed(p=>({...p,date:e.target.value}))}/></div>
        <div><label style={labelStyle}>地合い（condition）</label>
          <input style={fieldStyle} value={parsed.market?.condition||""} onChange={e=>updateMarket("condition",e.target.value)}/></div>
        <div style={{gridColumn:"1 / -1"}}><label style={labelStyle}>市況サマリー</label>
          <input style={fieldStyle} value={parsed.market?.summary||""} onChange={e=>updateMarket("summary",e.target.value)}/></div>
        <div><label style={labelStyle}>強いセクター（カンマ区切り）</label>
          <input style={fieldStyle} value={(parsed.market?.strong_sectors||[]).join(", ")} onChange={e=>updateSectorList("strong_sectors",e.target.value)}/></div>
        <div><label style={labelStyle}>弱いセクター（カンマ区切り）</label>
          <input style={fieldStyle} value={(parsed.market?.weak_sectors||[]).join(", ")} onChange={e=>updateSectorList("weak_sectors",e.target.value)}/></div>
        <div style={{gridColumn:"1 / -1"}}><label style={labelStyle}>振り返り（review）</label>
          <textarea style={fieldStyle} rows={2} value={parsed.review||""} onChange={e=>setParsed(p=>({...p,review:e.target.value}))}/></div>
      </div>

      {(parsed.watchlist||[]).length>0 && <div style={{marginTop:14}}>
        <b style={{fontSize:12.5}}>ウォッチリスト</b>
        {(parsed.watchlist||[]).map((w,i)=><div key={i} style={{display:"grid",gridTemplateColumns:"70px 1fr 90px 1fr 24px",gap:6,marginTop:6,alignItems:"center"}}>
          <input style={fieldStyle} placeholder="コード" value={w.code||""} onChange={e=>updateWatchItem(i,"code",e.target.value)}/>
          <input style={fieldStyle} placeholder="銘柄名" value={w.name||""} onChange={e=>updateWatchItem(i,"name",e.target.value)}/>
          <input style={fieldStyle} placeholder="状態" value={w.status||""} onChange={e=>updateWatchItem(i,"status",e.target.value)}/>
          <input style={fieldStyle} placeholder="理由" value={w.reason||""} onChange={e=>updateWatchItem(i,"reason",e.target.value)}/>
          <button className="iconbtn" onClick={()=>removeWatchItem(i)}>×</button>
        </div>)}
      </div>}

      {(parsed.decisions||[]).length>0 && <div style={{marginTop:14}}>
        <b style={{fontSize:12.5}}>判断（decisions）</b>
        {(parsed.decisions||[]).map((d,i)=><div key={i} style={{border:"1px solid var(--ruleSoft)",borderRadius:4,padding:8,marginTop:6}}>
          <div style={{display:"grid",gridTemplateColumns:"70px 1fr 1fr 24px",gap:6,alignItems:"center"}}>
            <input style={fieldStyle} placeholder="コード" value={d.code||""} onChange={e=>updateDecisionItem(i,"code",e.target.value)}/>
            <input style={fieldStyle} placeholder="自分の判断" value={d.user_decision||""} onChange={e=>updateDecisionItem(i,"user_decision",e.target.value)}/>
            <input style={fieldStyle} placeholder="ChatGPTの判断" value={d.ai_decision||""} onChange={e=>updateDecisionItem(i,"ai_decision",e.target.value)}/>
            <button className="iconbtn" onClick={()=>removeDecisionItem(i)}>×</button>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginTop:6}}>
            <select style={fieldStyle} value={d.execution||""} onChange={e=>updateDecisionItem(i,"execution",e.target.value)}>
              <option value="">実行結果を選択</option>
              {CHATGPT_ALLOWED_EXECUTION.map(v=><option key={v} value={v}>{v}</option>)}
            </select>
            <input style={fieldStyle} placeholder="理由" value={d.reason||""} onChange={e=>updateDecisionItem(i,"reason",e.target.value)}/>
            <input style={fieldStyle} placeholder="心理状態" value={d.mental_state||""} onChange={e=>updateDecisionItem(i,"mental_state",e.target.value)}/>
          </div>
        </div>)}
      </div>}

      {(parsed.rule_updates||[]).length>0 && <div style={{marginTop:14}}>
        <b style={{fontSize:12.5}}>ルール更新（新規追加のみ・既存ルールの上書きはしません）</b>
        {(parsed.rule_updates||[]).map((r,i)=><div key={i} style={{display:"flex",gap:6,marginTop:6}}>
          <input style={fieldStyle} value={typeof r==="string"?r:(r.text||"")} onChange={e=>updateRuleUpdate(i,e.target.value)}/>
          <button className="iconbtn" onClick={()=>removeRuleUpdate(i)}>×</button>
        </div>)}
      </div>}

      <div style={{marginTop:14,display:"flex",gap:8,alignItems:"center"}}>
        <button className="action-btn" disabled={saving} onClick={()=>save(false)}>NEONへ保存</button>
        {saving && <span style={{fontSize:12,color:"var(--inkFaint)"}}>保存中…</span>}
      </div>
    </div>}

    {dupInfo && <div className="card" style={{marginTop:12,padding:"10px 14px",border:"1px solid var(--rule)"}}>
      <div style={{fontSize:12.5}}>{dupInfo.error}</div>
      <button className="action-btn" style={{marginTop:8}} disabled={saving} onClick={()=>save(true)}>それでも保存する（重複を許可）</button>
    </div>}

    {saveMsg && <div style={{marginTop:10,fontSize:12.5,whiteSpace:"pre-wrap"}}>{saveMsg}</div>}

    <div style={{marginTop:20}}>
      <div className="sec-head" style={{fontSize:13}}>取り込み履歴</div>
      {loadingImports
        ? <div style={{fontSize:12,color:"var(--inkFaint)"}}>読み込み中…</div>
        : imports.length===0
          ? <div style={{fontSize:12,color:"var(--inkFaint)"}}>まだ取り込みはありません</div>
          : <div style={{display:"flex",flexDirection:"column",gap:4,marginTop:6}}>
              {imports.map(im=><div key={im.id} style={{fontSize:12,padding:"4px 8px",border:"1px solid var(--ruleSoft)",borderRadius:3}}>
                <span className="mono">{im.import_date}</span> に取り込み（daily_log ID {im.daily_log_id}）
              </div>)}
            </div>}
    </div>
  </div>;
}

// 監視銘柄インポート（Trade Cockpit v3 Phase5・設計案66-76番）：普段ChatGPTへ証券アプリの
// スクリーンショットを共有しているユーザー向けに、ChatGPTが認識した銘柄一覧のJSONを貼り付けて
// 一括登録できるようにする。画像解析はTrade Cockpit側では一切行わない（AI不使用の原則を維持）。
// 実watchlist本体は既存アーキテクチャ通りブラウザ側（s.watchlist）が正、Neon側は
// 取り込み履歴・重複防止（watchlist_imports）専用。stock_codeをキーにmasterJPと照合して
// 正規化し、不明コードは勝手に登録せずUNKNOWN表示にする（設計案72番）。
const WATCHLIST_IMPORT_SAMPLE=`{
  "type": "watchlist_import",
  "date": "${(()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");})()}",
  "source": "chatgpt_screenshot",
  "stocks": [
    {"code":"9107","name":"川崎汽船"},
    {"code":"1605","name":"INPEX"},
    {"code":"7203","name":"トヨタ自動車"}
  ]
}`;
function WatchlistImportPanel({watchlist,setWatchlist,masterJP}){
  const [rawText,setRawText]=useState("");
  const [parsed,setParsed]=useState(null);
  const [parseErrors,setParseErrors]=useState([]);
  const [mode,setMode]=useState("add_only");
  const [applyMsg,setApplyMsg]=useState("");
  const [dupInfo,setDupInfo]=useState(null);

  const parse=()=>{
    setApplyMsg("");setDupInfo(null);
    let obj;
    try{ obj=JSON.parse(rawText); }
    catch(e){ setParsed(null);setParseErrors(["JSONとして正しくありません: "+e.message]);return; }
    const errs=[];
    if(typeof obj!=="object"||obj===null||!Array.isArray(obj.stocks))errs.push("stocks配列が必要です");
    (obj.stocks||[]).forEach((s,i)=>{if(!s||!s.code)errs.push(`stocks[${i}]にcodeがありません`);});
    if(obj.remove!=null&&!Array.isArray(obj.remove))errs.push("removeは配列である必要があります");
    setParseErrors(errs);
    setParsed(errs.length===0?obj:null);
  };

  // stock_codeでmasterJPと照合して名称・セクターを正規化。不明コードはUNKNOWN扱い（勝手に登録しない）。
  const normalized=useMemo(()=>{
    if(!parsed)return [];
    return parsed.stocks.map(s=>{
      const m=masterJP.find(x=>x.code===s.code);
      return m?{code:s.code,name:m.name,sector:m.sector,kana:m.kana,tvSymbol:m.tvSymbol,known:true}
        :{code:s.code,name:s.name||"UNKNOWN",sector:null,known:false};
    });
  },[parsed,masterJP]);

  const currentCodes=useMemo(()=>new Set(watchlist.map(w=>w.code)),[watchlist]);
  const newOnes=useMemo(()=>normalized.filter(s=>!currentCodes.has(s.code)),[normalized,currentCodes]);
  const alreadyIn=useMemo(()=>normalized.filter(s=>currentCodes.has(s.code)),[normalized,currentCodes]);
  const importedCodes=useMemo(()=>new Set(normalized.map(s=>s.code)),[normalized]);
  const missingFromJson=useMemo(()=>watchlist.filter(w=>!importedCodes.has(w.code)),[watchlist,importedCodes]);
  const removeCodes=useMemo(()=>new Set(parsed?.remove||[]),[parsed]);

  const apply=async()=>{
    if(mode==="full_sync"&&missingFromJson.length>0){
      if(!confirm(`完全同期を実行すると、今回のJSONに含まれない${missingFromJson.length}銘柄が監視リストから削除されます。よろしいですか？`))return;
    }
    let next=[...watchlist];
    // 新規追加分（不明コードUNKNOWNも、ユーザーが後でテーマ等を編集できるようそのまま追加はする。
    // ただしセクターが不明なため33業種フィルタには乗らない旨をプレビューで案内済み）
    newOnes.forEach(s=>{
      next.push({id:s.code,code:s.code,name:s.name,sector:s.sector||SECTOR_CHOICES[0],market:"JP",
        tvSymbol:s.tvSymbol||("TSE:"+s.code),watch:"通常",note:"",theme:""});
    });
    if(mode==="diff"){
      next=next.filter(w=>!removeCodes.has(w.code));
    }else if(mode==="full_sync"){
      next=next.filter(w=>importedCodes.has(w.code));
    }
    setWatchlist(next);
    const addedCount=newOnes.length;
    try{
      const r=await fetch("/api/watchlist-import/save",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({payload:parsed,mode,addedCount})});
      const d=await r.json();
      if(d.error){setDupInfo(d);}
      else{setApplyMsg(`適用しました（新規${addedCount}件${mode==="full_sync"?`・削除${missingFromJson.length}件`:""}）`);setRawText("");setParsed(null);}
    }catch(e){setApplyMsg("履歴の保存に失敗しましたが、監視銘柄への反映は完了しています。");}
  };
  const applyForce=async()=>{
    setDupInfo(null);
    try{
      await fetch("/api/watchlist-import/save",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({payload:parsed,mode,addedCount:newOnes.length,force:true})});
    }catch(e){}
    setApplyMsg("（重複を許可して）履歴を保存しました。監視銘柄は既に反映済みです。");
  };

  const fieldStyle={width:"100%",fontSize:12.5,padding:"5px 7px",border:"1px solid var(--rule)",borderRadius:3,background:"var(--bg)",color:"var(--ink)",boxSizing:"border-box"};

  // v3 Phase5（設計案74番）：逆方向のコピー。現在の監視銘柄一覧をChatGPTへ簡単に共有できるようにする。
  const [copyMsg,setCopyMsg]=useState("");
  const copyCurrentWatchlist=async()=>{
    const lines=[`【Trade Cockpit 監視銘柄】${new Date().toLocaleString("ja-JP")}（${watchlist.length}件）`,""];
    watchlist.forEach(w=>lines.push(`${w.code} ${w.name}（${w.sector||"—"}）`));
    const ok=await copyText(lines.join("\n"));
    setCopyMsg(ok?"コピーしました":"コピーに失敗しました");
    setTimeout(()=>setCopyMsg(""),2500);
  };

  return <div style={{marginTop:24,paddingTop:20,borderTop:"1px solid var(--rule)"}}>
    <div className="sec-head">監視銘柄インポート（ChatGPTスクリーンショット認識結果）</div>
    <div className="sec-note">
      普段ChatGPTへ証券アプリの監視銘柄スクリーンショットを共有している場合、ChatGPTに認識結果をJSONで出力してもらい、ここへ貼り付けると一括登録できます。
      画像認識はChatGPT側で行い、Trade Cockpitでは行いません（有料AI APIは呼び出しません）。銘柄コードはmasterJPと照合し、不明な場合はUNKNOWNのまま登録します。
    </div>
    <div style={{marginTop:8,display:"flex",alignItems:"center",gap:8}}>
      <button className="action-btn" onClick={copyCurrentWatchlist}>現在の監視銘柄をChatGPT用にコピー（{watchlist.length}件）</button>
      {copyMsg && <span style={{fontSize:11,color:"var(--inkSoft)"}}>{copyMsg}</span>}
    </div>
    <div style={{marginTop:10}}>
      <label style={{fontSize:11,color:"var(--inkSoft)",display:"block",marginBottom:2}}>ChatGPTが出力したJSON
        <button className="action-btn" style={{marginLeft:8,fontSize:11}} onClick={()=>setRawText(WATCHLIST_IMPORT_SAMPLE)}>サンプルを入力</button>
      </label>
      <textarea value={rawText} onChange={e=>setRawText(e.target.value)} rows={8} placeholder='{"type":"watchlist_import","stocks":[{"code":"9107","name":"川崎汽船"}]}'
        style={{...fieldStyle,fontFamily:"monospace",fontSize:12}}/>
      <button className="action-btn" style={{marginTop:8}} onClick={parse} disabled={!rawText.trim()}>解析</button>
    </div>

    {parseErrors.length>0 && <div className="card" style={{marginTop:12,padding:"10px 14px",border:"1px solid var(--down)"}}>
      <b style={{color:"var(--down)"}}>入力内容にエラーがあります：</b>
      <ul style={{margin:"6px 0 0",paddingLeft:18,fontSize:12.5,color:"var(--down)"}}>{parseErrors.map((e,i)=><li key={i}>{e}</li>)}</ul>
    </div>}

    {parsed && <div className="card" style={{marginTop:12,padding:"12px 14px"}}>
      <b>差分プレビュー</b>
      <div style={{marginTop:10}}>
        {newOnes.length>0 && <div style={{marginBottom:8}}>
          <div style={{fontSize:11.5,color:"var(--inkSoft)",marginBottom:4}}>新規追加（{newOnes.length}件）</div>
          {newOnes.map(s=><div key={s.code} style={{fontSize:12.5}}>+ {s.code} {s.name}{!s.known&&<span style={{color:"var(--down)",marginLeft:6}}>（UNKNOWN：銘柄マスタに一致なし）</span>}</div>)}
        </div>}
        {alreadyIn.length>0 && <div style={{marginBottom:8}}>
          <div style={{fontSize:11.5,color:"var(--inkSoft)",marginBottom:4}}>登録済み（{alreadyIn.length}件、変更なし）</div>
          {alreadyIn.map(s=><div key={s.code} style={{fontSize:12.5,color:"var(--inkFaint)"}}>= {s.code} {s.name}</div>)}
        </div>}
        {missingFromJson.length>0 && <div>
          <div style={{fontSize:11.5,color:"var(--inkSoft)",marginBottom:4}}>現在アプリにあるが今回JSONにない（{missingFromJson.length}件）</div>
          {missingFromJson.slice(0,20).map(w=><div key={w.code} style={{fontSize:12.5,color:"var(--inkFaint)"}}>{w.code} {w.name}</div>)}
          {missingFromJson.length>20 && <div style={{fontSize:11.5,color:"var(--inkFaint)"}}>…他{missingFromJson.length-20}件</div>}
        </div>}
      </div>

      <div style={{marginTop:12,display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        <label style={{fontSize:12}}>同期モード：
          <select value={mode} onChange={e=>setMode(e.target.value)} style={{fontSize:12,marginLeft:6}}>
            <option value="add_only">追加のみ（既定・既存銘柄は削除しない）</option>
            <option value="diff">差分更新（JSONのremove配列で明示された銘柄のみ削除）</option>
            <option value="full_sync">完全同期（JSONに無い銘柄はすべて削除・要確認）</option>
          </select>
        </label>
      </div>
      <button className="action-btn" style={{marginTop:10}} onClick={apply}>この内容を監視銘柄に適用</button>
      {applyMsg && <span style={{marginLeft:8,fontSize:12,color:"var(--inkSoft)"}}>{applyMsg}</span>}
    </div>}

    {dupInfo && <div className="card" style={{marginTop:12,padding:"10px 14px",border:"1px solid var(--rule)"}}>
      <div style={{fontSize:12.5}}>{dupInfo.error}（監視銘柄への反映自体は完了しています。履歴だけ重複登録するかの確認です）</div>
      <button className="action-btn" style={{marginTop:8}} onClick={applyForce}>履歴だけ重複を許可して保存する</button>
    </div>}
  </div>;
}

// 統計ダッシュボード（Trade Cockpit v2 Phase8・設計案52-60番）。有料AI APIは使わずSQL集計のみ
// （server.py investment_db.get_stats()参照）。データが少ないうちは件数が小さく出るのは想定通り
// （個人利用でこれから蓄積していく前提）。
function StatsPanel(){
  const [stats,setStats]=useState(null);
  const [loading,setLoading]=useState(true);
  const load=async()=>{
    setLoading(true);
    try{
      const r=await fetch("/api/stats");
      if(r.ok)setStats(await r.json());
    }catch(e){}
    setLoading(false);
  };
  useEffect(()=>{load();},[]);

  const card={border:"1px solid var(--rule)",borderRadius:4,background:"var(--card)",padding:"12px 14px"};
  const rowsFromDict=(d)=>Object.entries(d||{}).sort((a,b)=>b[1]-a[1]);

  return <div style={{marginTop:18}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
      <div className="sec-head">統計ダッシュボード</div>
      <button className="action-btn" onClick={load} disabled={loading}>{loading?"更新中…":"更新"}</button>
    </div>
    <div className="sec-note">投資判断ログ・売買記録から自動集計します（AI不使用、SQL集計のみ）。データが少ないうちは件数が小さいのは正常です。</div>

    {loading
      ? <div style={{fontSize:12,color:"var(--inkFaint)",marginTop:10}}>読み込み中…</div>
      : !stats||stats.error
        ? <div style={{fontSize:12,color:"var(--inkFaint)",marginTop:10}}>{stats?.error||"データを取得できませんでした"}</div>

// テーマ・セクター強弱の可視化：SectorWatchlist内のsectorGroups集計（平均騰落率・合計売買代金）と
// 同じ考え方を、JP+US統合した銘柄リストに対して汎用的に適用する。keyFnがnull/""を返す銘柄は
// 対象外にする（テーマ未設定銘柄をテーマ別ランキングから除外するため）。
const groupStocks=(items,stockQuotes,keyFn)=>{
  const pctOf=(code)=>{const qt=stockQuotes[code]||{};const t=num(qt.t),p=num(qt.p);
    return (t!=null&&p!=null&&p)?(t-p)/p*100:null;};
  const turnoverOf=(code)=>{const v=num(stockQuotes[code]?.turnover);return v!=null&&v>0?v:null;};
  const map={};
  items.forEach(w=>{const key=keyFn(w);if(!key)return;(map[key]=map[key]||[]).push(w);});
  return Object.entries(map).map(([key,members])=>{
    const pcts=members.map(w=>pctOf(w.code)).filter(v=>v!=null);
    const avgPct=pcts.length?pcts.reduce((a,b)=>a+b,0)/pcts.length:null;
    const totalTurnover=members.reduce((sum,w)=>sum+(turnoverOf(w.code)||0),0);
    // 代表銘柄：グループ内で騰落率の絶対値が最大の銘柄（値動きが最も大きい＝今日そのグループを牽引している銘柄）
    let leader=null,leaderAbsPct=-1;
    members.forEach(w=>{const p=pctOf(w.code);if(p!=null&&Math.abs(p)>leaderAbsPct){leaderAbsPct=Math.abs(p);leader={name:w.name,pct:p};}});
    return {key,avgPct,totalTurnover,count:members.length,leader};
  }).sort((a,b)=>(b.totalTurnover-a.totalTurnover));
};

// TODAY'S MARKET（Trade Cockpit v2 Phase3・設計案27・68・69番）。日次モニターの最上部に置き、
// 「今日の地合い→強い/弱いセクター→RS上位銘柄数」を1画面で把握できるようにする。Market Risk Score
// はサーバー側_market_environment()（25日線トレンド判定）が必要なため/api/market-riskを叩くが、
// 重い処理（3か月分の日足取得×4指数）のため1日1回だけ自動取得し、以降は手動更新ボタンに委ねる
// （breakoutLevelsと同じキャッシュパターン）。日経/NASDAQ/SOX/US10Yの数値自体は既存のmetrics
// （30秒おきに自動更新済み）をそのまま使うため追加リクエストは発生しない。
function TodaysMarketCard({metrics,watchlistAll,stockQuotes,marketRisk,onRefresh,refreshing,activeRules,importantNews}){
  const pctOfMetric=(key)=>{const m=metrics[key];if(!m)return null;const t=num(m.t),p=num(m.p);
    return (t!=null&&p!=null&&p)?(t-p)/p*100:null;};
  const marketPct=pctOfMetric("nikkei");

  const sectorGroups=useMemo(()=>groupStocks(watchlistAll||[],stockQuotes,w=>w.sector),[watchlistAll,stockQuotes]);
  const strongSectors=useMemo(()=>[...sectorGroups].filter(g=>g.avgPct!=null).sort((a,b)=>b.avgPct-a.avgPct).slice(0,3),[sectorGroups]);
  const weakSectors=useMemo(()=>[...sectorGroups].filter(g=>g.avgPct!=null).sort((a,b)=>a.avgPct-b.avgPct).slice(0,3),[sectorGroups]);
  const sectorAvgMap=useMemo(()=>Object.fromEntries(sectorGroups.map(g=>[g.key,g.avgPct])),[sectorGroups]);

  const rsStrongList=useMemo(()=>{
    if(marketPct==null)return [];
    const out=[];
    (watchlistAll||[]).forEach(w=>{
      const qt=stockQuotes[w.code]||{};const t=num(qt.t),p=num(qt.p);
      const pct=(t!=null&&p!=null&&p)?(t-p)/p*100:null;
      const {rsScore}=calcRsScore(pct,marketPct,sectorAvgMap[w.sector]);
      if(rsScore!=null&&rsScore>=75)out.push({code:w.code,name:w.name,rsScore,pct});
    });
    return out.sort((a,b)=>b.rsScore-a.rsScore);
  },[watchlistAll,stockQuotes,marketPct,sectorAvgMap]);
  const rsStrongCount=rsStrongList.length;

  const riskMeta=marketRisk?.marketRiskLabel;
  const riskColor=riskMeta==="RISK OFF"?"var(--down)":riskMeta==="HIGH RISK"?"var(--accent)":riskMeta==="LOW RISK"?"var(--up)":"var(--inkSoft)";
  const quickIdx=[["日経","nikkei",0],["NASDAQ","nasdaq",0],["SOX","sox",0],["US10Y","us10y",2]];

  // ChatGPT連携（Phase6・設計案46番）：朝一チェック用にコピー。有料AI APIは使わず、テキストを
  // 生成してクリップボードにコピーするだけ（貼り付け先はChatGPT側で人間が操作）。
  const [copyMsg,setCopyMsg]=useState("");
  const copyMorningReport=async()=>{
    const lines=[`【Trade Cockpit 朝一チェック】${new Date().toLocaleString("ja-JP")}`,""];
    lines.push(`■ Market Risk: ${marketRisk?.marketRiskLabel||"—"}（${marketRisk?.marketRiskScore??"—"}/100）`);
    if(marketRisk?.text)lines.push(marketRisk.text);
    lines.push("");
    lines.push("■ 指数");
    quickIdx.forEach(([label,key,dp])=>{
      const m=metrics[key]||{};const t=num(m.t);const pct=pctOfMetric(key);
      lines.push(`${label}: ${t!=null?t.toFixed(dp):"—"}${pct!=null?`（${pct>0?"+":""}${pct.toFixed(2)}%）`:""}`);
    });
    lines.push("");
    if(strongSectors.length){lines.push("■ 強いセクター");strongSectors.forEach(g=>lines.push(`${g.key} ${g.avgPct>0?"+":""}${g.avgPct.toFixed(1)}%`));lines.push("");}
    if(weakSectors.length){lines.push("■ 弱いセクター");weakSectors.forEach(g=>lines.push(`${g.key} ${g.avgPct>0?"+":""}${g.avgPct.toFixed(1)}%`));lines.push("");}
    if(rsStrongList.length){lines.push(`■ Relative Strength銘柄（${rsStrongList.length}件）`);
      rsStrongList.slice(0,10).forEach(x=>lines.push(`${x.code} ${x.name} RS Score${x.rsScore} (${x.pct>0?"+":""}${x.pct.toFixed(2)}%)`));lines.push("");}
    try{
      const r=await fetch("/api/portfolio");
      if(r.ok){const d=await r.json();const ps=d.items||[];
        if(ps.length){lines.push(`■ 保有銘柄（${ps.length}件）`);
          ps.forEach(p=>lines.push(`${p.code} ${p.name||""}${p.quantity!=null?` ${p.quantity}株`:""}${p.average_price!=null?` @${p.average_price}`:""}`));lines.push("");}}
    }catch(e){}
    try{
      const r=await fetch("/api/trade-candidates");
      if(r.ok){const d=await r.json();const cs=d.candidates||[];
        if(cs.length){lines.push(`■ 今日の候補（${cs.length}件）`);
          cs.forEach(c=>lines.push(`${c.code} ${c.name}（${c.status}）`));lines.push("");}}
    }catch(e){}
    if(activeRules?.length){lines.push("■ 投資ルール");activeRules.forEach(t=>lines.push(`・${t}`));lines.push("");}
    if(importantNews?.length){lines.push(`■ 重要ニュース（${importantNews.length}件）`);
      importantNews.slice(0,8).forEach(n=>lines.push(`・${n.title}`));lines.push("");}
    lines.push("上記を踏まえて、今日の注目セクター・銘柄について相談したいです。");
    const ok=await copyText(lines.join("\n"));
    setCopyMsg(ok?"コピーしました":"コピーに失敗しました");
    setTimeout(()=>setCopyMsg(""),2500);
  };

  return <div className="card" style={{padding:"12px 16px",marginBottom:16}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
      <div style={{fontWeight:800,fontSize:14}}>TODAY'S MARKET</div>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        {copyMsg && <span style={{fontSize:11,color:"var(--inkSoft)"}}>{copyMsg}</span>}
        <button className="action-btn" onClick={copyMorningReport}>🌅 ChatGPT朝一チェック用にコピー</button>
        <button className="action-btn" onClick={onRefresh} disabled={refreshing}>{refreshing?"更新中…":"更新"}</button>
      </div>
    </div>
    {marketRisk==null
      ? <div style={{fontSize:12,color:"var(--inkFaint)",marginTop:6}}>{refreshing?"取得中…":"未取得（「更新」で取得できます）"}</div>
      : <>
        <div style={{display:"flex",alignItems:"baseline",gap:10,marginTop:8}}>
          <span style={{fontWeight:800,fontSize:20,color:riskColor}}>{marketRisk.marketRiskLabel||"—"}</span>
          {marketRisk.marketRiskScore!=null && <span className="mono" style={{fontSize:16,color:"var(--inkSoft)"}}>{marketRisk.marketRiskScore} / 100</span>}
        </div>
        {marketRisk.text && <div style={{fontSize:11.5,color:"var(--inkSoft)",marginTop:4}}>{marketRisk.text}</div>}
        <div style={{display:"flex",gap:14,flexWrap:"wrap",marginTop:10}}>
          {quickIdx.map(([label,key,dp])=>{
            const m=metrics[key]||{};const t=num(m.t);const pct=pctOfMetric(key);
            return <div key={key} style={{fontSize:12}}>
              <span style={{color:"var(--inkSoft)"}}>{label}</span>{" "}
              <span className="mono" style={{fontWeight:700}}>{t!=null?t.toFixed(dp):"—"}</span>{" "}
              {pct!=null && <span className="mono" style={{color:pct>0?"var(--up)":pct<0?"var(--down)":"var(--inkSoft)"}}>{pct>0?"+":""}{pct.toFixed(2)}%</span>}
            </div>;})}
        </div>
        <div style={{display:"flex",gap:24,flexWrap:"wrap",marginTop:10}}>
          {strongSectors.length>0 && <div style={{fontSize:12}}>
            <span style={{color:"var(--inkSoft)"}}>強いセクター：</span>
            {strongSectors.map(g=><span key={g.key} className="chip" style={{fontSize:10.5,marginRight:4}}>{g.key} {g.avgPct>0?"+":""}{g.avgPct.toFixed(1)}%</span>)}
          </div>}
          {weakSectors.length>0 && <div style={{fontSize:12}}>
            <span style={{color:"var(--inkSoft)"}}>弱いセクター：</span>
            {weakSectors.map(g=><span key={g.key} className="chip" style={{fontSize:10.5,marginRight:4}}>{g.key} {g.avgPct>0?"+":""}{g.avgPct.toFixed(1)}%</span>)}
          </div>}
          {rsStrongCount!=null && <div style={{fontSize:12}}>
            <span style={{color:"var(--inkSoft)"}}>Relative Strength銘柄：</span>
            <span style={{fontWeight:700}}>{rsStrongCount}</span></div>}
        </div>
      </>}
  </div>;
}

// 日次モニター先頭に表示するランキングパネル。「市場→テーマ→セクター→銘柄」の確認順序を

// 付けたタグのみを対象にするため、1件も設定されていなければテーマ欄は非表示にする。
function ThemeSectorRanking({watchlistAll,stockQuotes}){
  const sectorRanking=useMemo(()=>groupStocks(watchlistAll,stockQuotes,w=>w.sector).slice(0,5),[watchlistAll,stockQuotes]);
  const themeRanking=useMemo(()=>groupStocks(watchlistAll,stockQuotes,w=>(w.theme||"").trim()).slice(0,5),[watchlistAll,stockQuotes]);

  const RankList=({title,rows,emptyNote})=>
    <div style={{flex:"1 1 320px",minWidth:280}}>

      {rows.length===0
        ? <div style={{fontSize:12,color:"var(--inkSoft)"}}>{emptyNote}</div>
        : <div style={{border:"1px solid var(--rule)",borderRadius:4,overflow:"hidden"}}>
            {rows.map((r,i)=>{const c=changeColor(r.avgPct);
              return <div key={r.key} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 10px",
                borderTop:i===0?"none":"1px solid var(--ruleSoft)",background:c.level>0?c.bg:"transparent"}}>
                <span className="mono" style={{fontSize:11,color:"var(--inkSoft)",width:14}}>{i+1}</span>
                <span style={{flex:1,fontSize:13,fontWeight:600,color:c.level>0?c.fg:"var(--ink)"}}>{r.key}</span>
                <span style={{fontSize:11,color:"var(--inkSoft)"}}>{r.count}銘柄</span>
                <span className="mono" style={{fontSize:13,fontWeight:800,color:c.fg,minWidth:56,textAlign:"right"}}>
                  {r.avgPct!=null?(r.avgPct>0?"+":"")+r.avgPct.toFixed(2)+"%":"—"}
                </span>
                {r.leader&&<span style={{fontSize:11,color:"var(--inkSoft)",whiteSpace:"nowrap"}}>代表：{r.leader.name}
                  <span className="mono" style={{color:changeColor(r.leader.pct).fg,fontWeight:700}}> {r.leader.pct>0?"+":""}{r.leader.pct.toFixed(1)}%</span>
                </span>}
              </div>;})}
          </div>}
    </div>;

  return <div style={{marginBottom:18}}>
    <div className="sec-head">本日の注目セクター・テーマ</div>
    <div className="sec-note">登録銘柄（日本・アメリカ市場）の平均騰落率・合計売買代金から自動算出。「代表銘柄」はそのグループ内で最も値動きが大きい銘柄です。</div>
    <div style={{display:"flex",flexWrap:"wrap",gap:16,marginTop:8}}>
      <RankList title="セクター別（上位5・合計売買代金順）" rows={sectorRanking} emptyNote="登録銘柄がありません。「日本市場」「アメリカ市場」タブで銘柄を登録してください。"/>
      <RankList title="テーマ別（上位5・合計売買代金順）" rows={themeRanking} emptyNote="テーマが設定された銘柄がありません。「日本市場」「アメリカ市場」タブの登録銘柄一覧で、銘柄名の右の「＋テーマ」から設定できます。"/>
    </div>
  </div>;
}

          macroNewsList:Array.isArray(nd.macroNews)?nd.macroNews:p.macroNewsList,
          macroNewsDomestic:Array.isArray(nd.macroNewsDomestic)?nd.macroNewsDomestic:p.macroNewsDomestic,
          macroNewsOverseas:Array.isArray(nd.macroNewsOverseas)?nd.macroNewsOverseas:p.macroNewsOverseas,

    }catch(e){}
    try{
      const nru=await fetch("/api/news",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(cur.watchlistUS)});
      if(nru.ok){const ndu=await nru.json();
        setS(p=>({...p,
          usStockNewsList:Array.isArray(ndu.stockNews)?ndu.stockNews:p.usStockNewsList,
          usStockNameNewsList:Array.isArray(ndu.stockNameNews)?ndu.stockNameNews:p.usStockNameNewsList,
          usDisclosureNewsList:Array.isArray(ndu.disclosureNews)?ndu.disclosureNews:p.usDisclosureNewsList}));}
    }catch(e){}
    setNewsMsg(nowHHMM()+" 自動更新");
  };
  const [newsFetching,setNewsFetching]=useState(false);
  const [newsMsg,setNewsMsg]=useState("");

  // 日次モニター（指数・為替等）＋日本市場（登録銘柄の現在値）を30秒おきに自動更新する。
  // 2026-08-24 判明：Render無料プラン（メモリ512MB上限）で「Ran out of memory」により
  // サーバーが繰り返しクラッシュする不具合が発生。登録銘柄278社分の株価取得（立花証券APIを
  // 分割して複数回叩く重い処理）が30秒おきに走る一方、取得に30秒以上かかることがあり、
  // 前回の取得が終わる前に次の取得が二重・三重に走ってメモリを食い潰していたのが主因と判明。
  // 実行中フラグで多重起動を防ぐ（ローカル/LANでも無駄なリクエスト重複を避けられるため常時有効）。
  const monitorFetchingRef=useRef(false);
  const fetchMonitorAndJP=async()=>{
    if(monitorFetchingRef.current)return;
    monitorFetchingRef.current=true;
    setMonitorFetching(true);setJpFetching(true);
    try{
      const qr=await fetch("/api/quotes");
      if(qr.ok){
        const qd=await qr.json();
        setS(p=>{const nm={...p.metrics};
          Object.entries(qd.quotes||{}).forEach(([k,v])=>{
            if(nm[k]!=null&&v){nm[k]={...nm[k],
              t:(v.t!=null?String(v.t):nm[k].t),
              p:(v.p!=null?String(v.p):nm[k].p),
              spark:(Array.isArray(v.spark)?v.spark:nm[k].spark)};}
          });
          return {...p,metrics:nm};});
        setMonitorMsg((qd.fetchedAt||nowHHMM())+" 自動更新");
      }
    }catch(e){}
    try{
      const srJP=await fetch("/api/stock-quotes",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(sRef.current.watchlist)});
      if(srJP.ok){
        const sdJP=await srJP.json();
        setS(p=>({...p,stockQuotes:{...p.stockQuotes,...(sdJP.quotes||{})}}));
        setJpMsg(nowHHMM()+" 自動更新");
      }
    }catch(e){}
    setMonitorFetching(false);setJpFetching(false);
    monitorFetchingRef.current=false;
  };

  // アメリカ市場（登録銘柄の現在値）は朝6時（日本時間・端末時刻基準）に1日1回だけ自動更新する。
  const fetchUS=async()=>{
    setUsFetching(true);
    try{
      const srUS=await fetch("/api/stock-quotes",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(sRef.current.watchlistUS)});
      if(srUS.ok){
        const sdUS=await srUS.json();
        setS(p=>({...p,stockQuotes:{...p.stockQuotes,...(sdUS.quotes||{})},usQuotesFetchedDate:todayISO()}));
        setUsMsg(nowHHMM()+" 自動更新");
      }
    }catch(e){}
    setUsFetching(false);
  };

  // 出来高ブレイクアウト（直近3か月高値を5日平均出来高の1.5倍以上で上抜け。2026-08-21：参照期間を
  // 20営業日→3か月に変更）の基準値を取得する。銘柄分析タブのentry算出と同じ定義（server.pyのget_breakout_levels）。
  // 基準値自体は日中変わらないため1日1回だけ取得し、現在値との比較は下のuseMemoで毎回軽く行う
  // （2026-08-20 ユーザー要望：登録銘柄全体を対象にしたブレイクアウトの機械的なアラート）。
  const fetchBreakoutLevels=async(watchlistSubset)=>{
    try{
      const r=await fetch("/api/breakout-levels",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(watchlistSubset)});
      if(r.ok){
        const d=await r.json();
        setS(p=>({...p,breakoutLevels:{...p.breakoutLevels,...(d.levels||{})}}));
      }
    }catch(e){}
  };

  useEffect(()=>{
    fetchMonitorAndJP();
    const id=setInterval(fetchMonitorAndJP,30*1000);
    return ()=>clearInterval(id);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[]);

  useEffect(()=>{
    // 今日まだ計算していなければ登録銘柄全体（日本株）で即時計算し、以後は日付が変わるまで再計算しない。
    if(s.breakoutLevelsFetchedDate!==todayISO()){
      fetchBreakoutLevels(s.watchlist).then(()=>setS(p=>({...p,breakoutLevelsFetchedDate:todayISO()})));
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[]);

  useEffect(()=>{
    // 日中に銘柄を追加登録した場合、その銘柄だけ基準値が無いままになるため、不足分だけ追加取得する。
    // 本日分の初回一括取得（上のuseEffect）が終わるまでは「全銘柄が不足」に見えてしまい二重取得
    // になるため、初回取得が完了済み（breakoutLevelsFetchedDateが今日）の場合のみ動く。
    if(s.breakoutLevelsFetchedDate!==todayISO())return;
    const missing=s.watchlist.filter(w=>!s.breakoutLevels[w.code]);
    if(missing.length)fetchBreakoutLevels(missing);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[s.watchlist.length,s.breakoutLevelsFetchedDate]);

  // TODAY'S MARKET（Trade Cockpit v2 Phase3）：Market Risk Scoreの取得。breakoutLevelsと同じく
  // 重い処理のため1日1回のみ自動取得し、以降はTodaysMarketCardの「更新」ボタンで手動再取得する。
  const [marketRiskFetching,setMarketRiskFetching]=useState(false);
  const fetchMarketRisk=async()=>{
    setMarketRiskFetching(true);
    try{
      const r=await fetch("/api/market-risk");
      if(r.ok){
        const d=await r.json();
        setS(p=>({...p,marketRisk:d,marketRiskFetchedDate:todayISO()}));
      }
    }catch(e){}
    setMarketRiskFetching(false);
  };
  useEffect(()=>{
    if(s.marketRiskFetchedDate!==todayISO())fetchMarketRisk();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[]);

  // ニュース優先順位付け（Trade Cockpit v2 Phase4・設計案30-33番）：保有＞今日の候補＞監視銘柄＞
  // テーマ一致＞その他 の順で関連度の高いニュースを上に出す。「今日の候補」だけはNeon保存のため
  // 起動時に1回取得する（他の3つはすでにローカルstateにある）。
  const [candidateCodes,setCandidateCodes]=useState(new Set());
  useEffect(()=>{
    fetch("/api/trade-candidates").then(r=>r.ok?r.json():null).then(d=>{
      if(d&&Array.isArray(d.candidates))setCandidateCodes(new Set(d.candidates.map(c=>c.code)));
    }).catch(()=>{});
  },[]);
  const newsPriorityRank=(code)=>{
    if(!code)return 4;
    const heldCodes=new Set(s.journal.filter(j=>j.result==="未定").map(j=>j.code));
    if(heldCodes.has(code))return 0;
    if(candidateCodes.has(code))return 1;
    if(s.watchTargets.includes(code))return 2;
    if(watchlistAll.some(w=>w.code===code&&w.theme))return 3;
    return 4;
  };

  useEffect(()=>{
    fetchNewsOnly();
    const id=setInterval(fetchNewsOnly,60*60*1000);
    return ()=>clearInterval(id);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[]);

  useEffect(()=>{
    // 今日まだ一度も取得していなければ（アプリを開いた直後に空欄のままにしないよう）即時取得。
    if(s.usQuotesFetchedDate!==todayISO())fetchUS();
    let intervalId=null;
    const now=new Date();
    const next=new Date(now.getFullYear(),now.getMonth(),now.getDate(),6,0,0,0);
    if(now>=next)next.setDate(next.getDate()+1);
    const timeoutId=setTimeout(()=>{
      fetchUS();
      intervalId=setInterval(fetchUS,24*60*60*1000);
    },next-now);
    return ()=>{clearTimeout(timeoutId);if(intervalId)clearInterval(intervalId);};
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[]);

  const set=(patch)=>setS(p=>({...p,...patch}));
  const setMetric=(k,f,v)=>setS(p=>({...p,metrics:{...p.metrics,[k]:{...p.metrics[k],[f]:v}}}));
  // v3-2（watchlistのNeon化）：SectorWatchlist・WatchlistImportPanel等は従来通り「新しい配列
  // 全体」をsetWatchlistJP/USへ渡す設計のままにし（呼び出し側は無改修）、ここで旧配列との差分
  // （追加・変更・削除）を検出してNeonへ書き込む。localStorage（s.watchlist）はUI表示用の
  // キャッシュとして引き続き使うが、正データはNeon。
  const syncWatchlistToNeon=(prevList,nextList,market)=>{
    if(!s.watchlistMigrated)return; // watchlistの一括移行が済むまでは個別同期もしない（移行前にNeonへ半端な状態を書き込まないため）
    const prevByCode=new Map(prevList.map(w=>[w.code,w]));
    const nextByCode=new Map(nextList.map(w=>[w.code,w]));
    nextList.forEach(w=>{
      const prev=prevByCode.get(w.code);
      if(!prev||JSON.stringify(prev)!==JSON.stringify(w)){
        fetch("/api/watchlist/save",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({...w,market})}).catch(()=>{});
      }
    });
    prevList.forEach(w=>{
      if(!nextByCode.has(w.code)){
        fetch("/api/watchlist/delete",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({code:w.code,market})}).catch(()=>{});
      }
    });
  };
  const setWatchlistJP=(wl)=>{syncWatchlistToNeon(sRef.current.watchlist,wl,"JP");set({watchlist:wl});};
  const setWatchlistUS=(wl)=>{syncWatchlistToNeon(sRef.current.watchlistUS,wl,"US");set({watchlistUS:wl});};
  // 2026-08-22 ユーザー要望：「日本市場」タブの検索候補を、日経225中心の手動キュレーション
  // リスト（MASTER、約277社）だけでなく東証上場銘柄全体（約4400社）に広げる。立花証券APIの
  // 株式銘柄マスタをサーバー側でキャッシュ済みの/api/jp-issue-masterから1回だけ取得し、
  // MASTERに無いコードだけ追加する（MASTERにある分は読み仮名等を手動で整えてあるためそちらを優先）。
  const [jpIssueMaster,setJpIssueMaster]=useState(null);
  useEffect(()=>{
    fetch("/api/jp-issue-master").then(r=>r.ok?r.json():null).then(d=>{if(d)setJpIssueMaster(d.items||{});}).catch(()=>{});
  },[]);
  const masterJP=useMemo(()=>{
    const curated=MASTER.filter(m=>m.market==="JP"||m.market==="IDX");
    if(!jpIssueMaster)return curated;
    const known=new Set(curated.map(m=>m.code));
    const extra=Object.entries(jpIssueMaster)
      .filter(([code])=>!known.has(code))
      .map(([code,v])=>({code,name:v.name,sector:v.sector,kana:v.kana,market:"JP",tvSymbol:"TSE:"+code}));
    return [...curated,...extra];
  },[jpIssueMaster]);
  const masterUS=useMemo(()=>MASTER.filter(m=>m.market==="US"),[]);

  // 12章：分析タブの対象銘柄（日本市場・アメリカ市場どちらの登録銘柄からも追加され得る）
  const allWatch=useMemo(()=>[...s.watchlist,...s.watchlistUS],[s.watchlist,s.watchlistUS]);
  const analysisItems=useMemo(()=>s.analysisTargets.map(code=>allWatch.find(w=>w.code===code)).filter(Boolean),[s.analysisTargets,allWatch]);
  // 2026-08-21 ユーザー要望：監視銘柄は日本市場に限定（アメリカ市場タブの「監視銘柄」ボタンは
  // 撤去済みだが、念のためここでも日本株以外は除外しておく）。
  const watchTargetItems=useMemo(()=>s.watchTargets.map(code=>allWatch.find(w=>w.code===code)).filter(Boolean).filter(w=>w.market==="JP"),[s.watchTargets,allWatch]);
  // 投資判断ログの「新規ログ」下書きに自動で入れる値。金利・為替・原油は日次モニターの直近取得値
  // （s.metrics）、市場全体の地合い・米国市場は直近の銘柄分析結果（analyze_stock共通の_market_environment）
  // から、セクター強弱はgroupStocks()の売買代金上位から組み立てる。いずれも編集可能な「下書き」であり、
  // ユーザーが保存前に自由に書き換えられる（2026-09-02新規）。
  const marketEnvAuto=useMemo(()=>Object.values(s.analysisData)[0]?.marketEnv||"",[s.analysisData]);
  const usMarketAuto=useMemo(()=>{const m=marketEnvAuto.split("／");return m.length>1?m.slice(1).join("／"):"";},[marketEnvAuto]);
  const interestRateAuto=useMemo(()=>s.metrics?.us10y?.t?`米10年債利回り ${s.metrics.us10y.t}%`:"",[s.metrics]);
  const fxAuto=useMemo(()=>s.metrics?.usdjpy?.t?`ドル円 ${s.metrics.usdjpy.t}円`:"",[s.metrics]);
  const oilAuto=useMemo(()=>s.metrics?.wti?.t?`WTI原油 ${s.metrics.wti.t}ドル`:"",[s.metrics]);
  const sectorStrengthAuto=useMemo(()=>{
    const top=groupStocks(watchlistAll,s.stockQuotes,w=>w.sector).slice(0,3);
    return top.map(g=>`${g.key}${g.avgPct!=null?(g.avgPct>0?"+":"")+g.avgPct.toFixed(2)+"%":""}`).join("、");
  },[watchlistAll,s.stockQuotes]);
  const [analyzing,setAnalyzing]=useState(false);
  const fetchAnalysisFor=async(items)=>{
    if(!items||!items.length)return;
    setAnalyzing(true);
    // 再取得中に前回の結果を残したままにすると、取得に失敗した場合でも古い（現在値と食い違った）
    // 単価がそのまま表示され続けてしまう。先に対象銘柄のanalysisDataをクリアし、取得に失敗したら
    // 「データを取得できませんでした」と正直に表示されるようにする。
    setS(p=>{const ad={...p.analysisData};items.forEach(w=>{delete ad[w.code];});return {...p,analysisData:ad};});
    try{
      // 登録銘柄テーブルの現在値（30秒おきの自動更新で取得済み）をcurrentとして同封する。
      // 分析APIは内部でyfinanceに別途問い合わせるため、これを渡さないと分析結果側の単価が
      // テーブルの最新値とズレることがある。
      const withCurrent=items.map(w=>({...w,current:s.stockQuotes[w.code]?.t}));
      const ar=await fetch("/api/analysis",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(withCurrent)});
      if(ar.ok){
        const ad=await ar.json();
        // 診断用：この取得で実際にサーバーへ送った現在値(currentSent)と取得時刻(fetchedAt)を
        // 結果に添えておく。「反映されない」不具合の切り分け（現在値送信自体が古いのか、
        // 表示側が古いままなのか）をカードで直接確認できるようにする。
        const stampedAt=nowHHMM();
        const withCurrentByCode=Object.fromEntries(withCurrent.map(w=>[w.code,w.current]));
        Object.entries(ad.analysis||{}).forEach(([code,r])=>{r._fetchedAt=stampedAt;r._currentSent=withCurrentByCode[code];});
        setS(p=>({...p,analysisData:{...p.analysisData,...(ad.analysis||{})}}));
      }
    }catch(e){}
    setAnalyzing(false);
  };
  // 銘柄追加時：analysisDataにまだ結果がない対象銘柄だけを取得する
  useEffect(()=>{
    // technical_analysis_rules.md反映でスキーマ変更（strength/autoEarningsStarsフィールド追加）したため、
    // 旧スキーマのキャッシュ済みデータ（いずれか未定義）も再取得対象に含める
    const missing=analysisItems.filter(w=>!s.analysisData[w.code]||s.analysisData[w.code].strength===undefined||s.analysisData[w.code].autoEarningsStars===undefined);
    if(missing.length)fetchAnalysisFor(missing);
  },[s.analysisTargets]);

  // ===== デスクトップ通知（セクター内逆行銘柄・出来高ブレイクアウトの監視銘柄自動追加で使用） =====
  // 2026-08-21 ユーザー要望：旧「本日優先」5分おき自動スキャン機能（priorityTargets・
  // autoScanEnabled・9社上限）は「監視銘柄」タブに置き換えて撤去した。通知の許可取得・送信の
  // 仕組み自体はそのまま残し、下のsectorLaggards・breakoutAlertsから利用する。
  const [notifyPermission,setNotifyPermission]=useState(typeof Notification!=="undefined"?Notification.permission:"unsupported");
  const notifiedLaggardsRef=useRef(new Set()); // 通知済みのセクター内逆行銘柄コード（同じ銘柄への通知連打を防ぐ。日をまたぐか再読み込みでリセット）

  const requestNotifyPermission=async()=>{
    if(typeof Notification==="undefined"){alert("このブラウザはデスクトップ通知に対応していません。");return;}
    const perm=await Notification.requestPermission();
    setNotifyPermission(perm);
  };
  const notifyDesktop=(title,body)=>{
    if(typeof Notification==="undefined"||Notification.permission!=="granted")return;
    try{ new Notification(title,{body}); }catch(e){}
  };

  // セクター内逆行銘柄（項目3-4）：全体的に弱いセクターの中で1銘柄だけ強い動きをしている銘柄を
  // 拾う。既に取得済みのstockQuotesだけで計算できる軽い処理のため、優先銘柄に絞らず登録銘柄
  // 全体（日本＋アメリカ）を対象にする（ユーザー確認済み）。しきい値は「セクター平均が弱い
  // (-0.3%以下)のに個別銘柄は強い(+1.5%以上)、かつその差が2ポイント以上」という簡易基準。
  const sectorLaggards=useMemo(()=>{
    const bySector=groupStocks(watchlistAll,s.stockQuotes,w=>w.sector);
    const sectorAvg=Object.fromEntries(bySector.map(g=>[g.key,g.avgPct]));
    const out=[];
    watchlistAll.forEach(w=>{
      const qt=s.stockQuotes[w.code]||{};
      const t=num(qt.t),p=num(qt.p);
      const pct=(t!=null&&p!=null&&p)?(t-p)/p*100:null;
      const avg=sectorAvg[w.sector];
      if(pct!=null&&avg!=null&&avg<=-0.3&&pct>=1.5&&(pct-avg)>=2){
        out.push({code:w.code,name:w.name,sector:w.sector,pct,sectorAvg:avg});
      }
    });
    return out.sort((a,b)=>(b.pct-b.sectorAvg)-(a.pct-a.sectorAvg));
  },[watchlistAll,s.stockQuotes]);

  useEffect(()=>{
    sectorLaggards.forEach(item=>{
      if(!notifiedLaggardsRef.current.has(item.code)){
        notifiedLaggardsRef.current.add(item.code);
        notifyDesktop(`↗ ${item.name} ${item.code}：セクター内逆行`,
          `${item.sector}平均${item.sectorAvg.toFixed(2)}%に対し個別${item.pct.toFixed(2)}%`);
      }
    });
  },[sectorLaggards]);

  // 出来高ブレイクアウト（登録銘柄全体・日本株のみ）：get_breakout_levels()で1日1回計算した
  // 基準値（highLookback・volAvg5）と、30秒おきに更新される現在値(t)・当日出来高(volume)を比較する
  // 軽い処理。analyze_stock()のbreakout_confirmedと同一基準（直近3か月高値を、5日平均出来高の
  // 1.5倍以上の出来高を伴って上抜け。2026-08-21：参照期間を20営業日→3か月に変更）。
  // sectorLaggardsと同じく登録銘柄全体が対象（2026-08-20 ユーザー要望）。
  const breakoutAlerts=useMemo(()=>{
    const out=[];
    s.watchlist.forEach(w=>{
      const levels=s.breakoutLevels[w.code];
      if(!levels)return;
      const qt=s.stockQuotes[w.code]||{};
      const t=num(qt.t),vol=num(qt.volume);
      if(t==null||vol==null)return;
      const volRatio=levels.volAvg5?vol/levels.volAvg5:null;
      if(t>levels.highLookback && volRatio!=null && volRatio>=1.5){
        out.push({code:w.code,name:w.name,highLookback:levels.highLookback,t,volRatio});
      }
    });
    return out;
  },[s.watchlist,s.breakoutLevels,s.stockQuotes]);

  // 出来高ブレイクアウト条件に該当した銘柄は、表示するだけでなく「監視銘柄」へ自動追加する
  // （2026-08-21 ユーザー要望：「記録」タブのチップ表示は撤去し、監視銘柄タブに一本化）。
  // 既にwatchTargetsに入っていれば重複追加も再通知もしない（冪等）。
  useEffect(()=>{
    breakoutAlerts.forEach(item=>{
      if(s.watchTargets.includes(item.code))return;
      setS(p=>p.watchTargets.includes(item.code)?p:{...p,watchTargets:[...p.watchTargets,item.code]});
      notifyDesktop(`▲ ${item.name} ${item.code}：出来高ブレイクアウト→監視銘柄に追加`,
        `直近3か月高値${item.highLookback.toLocaleString()}を出来高${item.volRatio.toFixed(1)}倍で上抜け`);
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[breakoutAlerts]);

  // 決算分析タブの対象銘柄。「決算」ボタンで追加され、直近の決算短信（TDnet）のタイトル・
  // 数値要約を取得して表示する（要約の作り方は適時開示タブと同じ、9章のsummarize_earnings_pdf）。
  const earningsItems=useMemo(()=>s.earningsTargets.map(code=>allWatch.find(w=>w.code===code)).filter(Boolean),[s.earningsTargets,allWatch]);
  const [earningsFetching,setEarningsFetching]=useState(false);
  const fetchEarningsDetailFor=async(items)=>{
    if(!items||!items.length)return;
    setEarningsFetching(true);
    try{
      const er=await fetch("/api/earnings-detail",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify(items.map(w=>({code:w.code,name:w.name})))});
      if(er.ok){const ed=await er.json();
        const byCode=Object.fromEntries((ed.results||[]).map(r=>[r.code,r]));
        setS(p=>({...p,earningsDetail:{...p.earningsDetail,...byCode}}));}
    }catch(e){}
    setEarningsFetching(false);
  };
  // 銘柄追加時：earningsDetailにまだ結果がない対象銘柄だけを取得する
  useEffect(()=>{
    const missing=earningsItems.filter(w=>!s.earningsDetail[w.code]);
    if(missing.length)fetchEarningsDetailFor(missing);
  },[s.earningsTargets]);

  const day=useMemo(()=>{const d=new Date(s.date+"T00:00:00");return isNaN(d)?null:d.getDay();},[s.date]);
  const isMonday=day===1;

  // 複数カテゴリのニュース配列を、重複URLを除きつつ公開日時(published:"MM/DD HH:MM")の
  // 降順にまとめる。米国株ニュースを国内カテゴリと混ぜて表示する際に使う（年またぎは非対応）。
  const mergeByDate=(...lists)=>{
    const seen=new Set();const out=[];
    for(const list of lists){for(const it of list){if(!it.url||seen.has(it.url))continue;seen.add(it.url);out.push(it);}}
    return out.sort((a,b)=>(b.published||"").localeCompare(a.published||""));
  };
  // 適時開示：日本の登録銘柄＋アメリカ市場（ダウ30社）の開示・IR・決算ニュースを、当日含む
  // 直近10日分・種類を問わず全件まとめて表示する
  const disclosureAll=useMemo(()=>mergeByDate(s.disclosureNewsList,s.usDisclosureNewsList),[s.disclosureNewsList,s.usDisclosureNewsList]);
  // 登録銘柄：IR以外も含む社名一致ニュース（日本＋アメリカ）
  const stockNameNewsAll=useMemo(()=>mergeByDate(s.stockNameNewsList,s.usStockNameNewsList),[s.stockNameNewsList,s.usStockNameNewsList]);
  // 海外市況：マクロの海外市況クエリに加え、アメリカ市場登録銘柄のニュースも含める
  const overseasAll=useMemo(()=>mergeByDate(s.macroNewsOverseas,s.usStockNewsList),[s.macroNewsOverseas,s.usStockNewsList]);

  // 9-1章：「サマリー」の中身の方針。既存に該当機能がなかったため新規に決定：
  // (1) 重大ニュース（9-2章の判定に該当）を全カテゴリから最優先で集約し、(2) 残り枠を
  // 適時開示（日本＋アメリカ）・国内市況・海外市況からバランスよく抜粋する。重複URLは除外する。
  const newsSummary=useMemo(()=>{
    const seen=new Set();
    const push=(arr,list)=>{for(const it of list){if(!it.url||seen.has(it.url))continue;seen.add(it.url);arr.push(it);}};
    const byDateDesc=(a,b)=>(b.published||"").localeCompare(a.published||"");
    // 4カテゴリ（登録銘柄IR・米国株IR・国内市況・海外市況）を単純に連結するだけだと、各カテゴリ内は
    // 新しい順でも、カテゴリをまたいだ全体では古い記事が新しい記事より上に出てしまっていたため、
    // 「重要」枠・「残り」枠それぞれの中で公開日時の降順に並べ替える（重要枠を上に固定する方針は維持）。
    const important=[];push(important,[...s.stockNewsList,...s.usStockNewsList,...s.macroNewsDomestic,...s.macroNewsOverseas,...s.stockNameNewsList].filter(it=>isImportantNews(it.title)));
    important.sort(byDateDesc);
    const rest=[];
    push(rest,s.stockNewsList.slice(0,6));
    push(rest,s.usStockNewsList.slice(0,6));
    push(rest,s.macroNewsDomestic.slice(0,8));
    push(rest,s.macroNewsOverseas.slice(0,8));
    push(rest,s.stockNameNewsList.slice(0,10));
    rest.sort(byDateDesc);
    return [...important,...rest];
  },[s.stockNewsList,s.usStockNewsList,s.macroNewsDomestic,s.macroNewsOverseas,s.stockNameNewsList]);

  // 10-5章：ページ最上部の重要ニュース通知バナー用（全カテゴリを対象に件数を集計）
  const importantNewsAll=useMemo(()=>{
    const seen=new Set();const out=[];
    [...s.stockNewsList,...s.usStockNewsList,...s.macroNewsDomestic,...s.macroNewsOverseas,...s.stockNameNewsList].forEach(it=>{
      if(isImportantNews(it.title)&&it.url&&!seen.has(it.url)){seen.add(it.url);out.push(it);}
    });
    return out;
  },[s.stockNewsList,s.usStockNewsList,s.macroNewsDomestic,s.macroNewsOverseas,s.stockNameNewsList]);

  // 5章：「分析」ボタン。押すたびに分析タブ（12章）の対象銘柄リストに追加/削除をトグルし、
  // 追加・削除いずれの場合も結果をすぐ確認できるよう「分析」タブに遷移する。
  const toggleAnalysisTarget=(code)=>{
    setS(p=>({...p,analysisTargets:p.analysisTargets.includes(code)
      ?p.analysisTargets.filter(c=>c!==code):[...p.analysisTargets,code]}));

  // 追加・削除いずれの場合も結果をすぐ確認できるよう「決算分析」タブに遷移する（分析ボタンと同様の設計）。
  const toggleEarningsTarget=(code)=>{

  // 2026-08-21 ユーザー要望：登録銘柄テーブルの「監視銘柄」ボタン。「監視銘柄」タブでまとめて
  // 確認する対象銘柄を上限なく手動選択する（旧「本日優先」＝5分おき自動スキャン機能はここで撤去）。
  const toggleWatchTarget=(code)=>{

  // 売買記録（トレードジャーナル）：銘柄分析カードの「記録に追加」ボタンから、そのカードの
  // entry/stop/target/marketEnv/entryReasonを初期値にしたドラフトを開き、「記録」タブへ遷移する。
  // 保存するまでs.journalには追加しない（下書き段階ではjournalDraft stateのみで保持）。
  const [journalDraft,setJournalDraft]=useState(null);
  const openJournalDraft=(w,a)=>{
    setJournalDraft({
      code:w.code,name:w.name,action:"新規買い",
      price:a.entry??"",shares:"",
      entryPlan:{entry:a.entry,stop:a.stop,target:a.target},
      marketEnvAtEntry:a.marketEnv||"",reason:a.entryReason||"",
    });
    setTab("journal");
  };
  // 2026-09-02 ユーザー要望「投資判断ログ」：journal・myRulesをサーバーDB（Neon）へ移行後は、
  // 画面上の操作はこれまで通りs（ローカル状態）を即時更新しつつ、ベストエフォートでサーバーにも
  // 同期する（失敗しても画面操作は止めない＝他の外部API連携と同じ方針）。sRef.currentで最新の
  // 移行済みフラグを見るのは、setS呼び出し直後でもクロージャが古いsを見てしまわないようにするため。
  const syncJournalSave=(entry)=>{if(sRef.current.investmentLogMigrated)fetch("/api/journal/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(entry)}).catch(()=>{});};
  const syncJournalDelete=(id)=>{if(sRef.current.investmentLogMigrated)fetch("/api/journal/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})}).catch(()=>{});};
  const syncRuleSave=(rule)=>{if(sRef.current.investmentLogMigrated)fetch("/api/rules/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(rule)}).catch(()=>{});};
  const syncRuleDelete=(id)=>{if(sRef.current.investmentLogMigrated)fetch("/api/rules/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})}).catch(()=>{});};

  // 「記録」タブの「サーバーDBへ移行」ボタン。現在のjournal・myRulesをまとめてDBへ送り、
  // 以降はsyncJournalSave等が実際にサーバーへも書き込むようにフラグを立てる。IDが同じものは
  // 上書きになるため、何度押しても壊れない（investment_db.migrate_legacy参照）。
  const [migratingLog,setMigratingLog]=useState(false);
  const [migrateLogMsg,setMigrateLogMsg]=useState("");
  const migrateToInvestmentDb=async()=>{
    setMigratingLog(true);setMigrateLogMsg("");
    try{
      const r=await fetch("/api/migrate-legacy",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({journal:sRef.current.journal,rules:sRef.current.myRules})});
      if(r.ok){
        const d=await r.json();
        if(d.error){setMigrateLogMsg("移行失敗："+d.error);}
        else{setS(p=>({...p,investmentLogMigrated:true}));setMigrateLogMsg(`移行完了（記録${d.journal}件・マイルール${d.rules}件）`);}
      }else{setMigrateLogMsg("移行に失敗しました。サーバーが起動しているか確認してください。");}
    }catch(e){setMigrateLogMsg("移行に失敗しました。サーバーが起動しているか確認してください。");}
    setMigratingLog(false);
  };

  // 移行済みなら起動時にサーバーDBのjournal・myRulesを取得して上書きする（MCP/ChatGPT経由で
  // サーバー側だけが更新されているケースを反映するため）。取得失敗時は今のローカル状態のまま
  // （他の外部API連携と同じ、失敗を許容する方針）。
  useEffect(()=>{
    if(!s.investmentLogMigrated)return;
    (async()=>{
      try{
        const [jr,rr]=await Promise.all([fetch("/api/journal"),fetch("/api/rules")]);
        if(jr.ok){const jd=await jr.json();if(Array.isArray(jd.journal))setS(p=>({...p,journal:jd.journal}));}
        if(rr.ok){const rd=await rr.json();if(Array.isArray(rd.rules))setS(p=>({...p,myRules:rd.rules}));}
      }catch(e){}
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[s.investmentLogMigrated]);

  // v3-2（watchlistのNeon化）：既存ユーザーのブラウザに残っているwatchlistを1回だけNeonへ
  // 移行するボタン用。investmentLogMigratedとは別のフラグ（watchlistMigrated）で管理する
  // （journal/rulesは移行済みでもwatchlistはまだ、というケースがあり得るため）。
  const [migratingWatchlist,setMigratingWatchlist]=useState(false);
  const [migrateWatchlistMsg,setMigrateWatchlistMsg]=useState("");
  const migrateWatchlistToNeon=async()=>{
    setMigratingWatchlist(true);setMigrateWatchlistMsg("");
    try{
      const items=[...sRef.current.watchlist,...sRef.current.watchlistUS];
      const r=await fetch("/api/watchlist/migrate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({items})});
      if(r.ok){
        const d=await r.json();
        setS(p=>({...p,watchlistMigrated:true}));
        setMigrateWatchlistMsg(`移行完了（${d.count}件）。以後はサーバー（Neon）が正データです。`);
      }else{setMigrateWatchlistMsg("移行に失敗しました。サーバーが起動しているか確認してください。");}
    }catch(e){setMigrateWatchlistMsg("移行に失敗しました。サーバーが起動しているか確認してください。");}
    setMigratingWatchlist(false);
  };

  // 移行済みなら起動時にNeonのwatchlistを取得して上書きする（他端末・ChatGPT Import等での
  // 変更を反映するため）。取得失敗時は今のローカル状態のまま（既存の journal/rules と同じ方針）。
  useEffect(()=>{
    if(!s.investmentLogMigrated||!s.watchlistMigrated)return;
    (async()=>{
      try{
        const [jr,ur]=await Promise.all([fetch("/api/watchlist?market=JP"),fetch("/api/watchlist?market=US")]);
        if(jr.ok){const jd=await jr.json();if(Array.isArray(jd.items))setS(p=>({...p,watchlist:jd.items}));}
        if(ur.ok){const ud=await ur.json();if(Array.isArray(ud.items))setS(p=>({...p,watchlistUS:ud.items}));}
      }catch(e){}
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[s.investmentLogMigrated,s.watchlistMigrated]);

  const saveJournalEntry=()=>{
    if(!journalDraft)return;
    const entry={...journalDraft,id:Date.now()+Math.random(),createdAt:new Date().toISOString(),result:"未定",lessonNote:""};
    setS(p=>({...p,journal:[entry,...p.journal]}));
    syncJournalSave(entry);
    setJournalDraft(null);
  };
  const updateJournalEntry=(id,patch)=>setS(p=>{
    const next=p.journal.map(j=>j.id===id?{...j,...patch}:j);
    syncJournalSave(next.find(j=>j.id===id));
    return {...p,journal:next};
  });
  const deleteJournalEntry=(id)=>{if(!confirm("この記録を削除しますか？"))return;setS(p=>({...p,journal:p.journal.filter(j=>j.id!==id)}));syncJournalDelete(id);};

  // マイルール：追加・オンオフ・削除。良いトレード・気づきの都度アップデートできるようにする
  // （2026-08-20 ユーザー要望）。トグルで一時的に無効化もできる（削除せず参照だけ残したい場合）。
  const [newRuleText,setNewRuleText]=useState("");
  const addMyRule=(text)=>{
    const t=(text||"").trim();
    if(!t)return;
    const rule={id:Date.now()+Math.random(),text:t,active:true,createdAt:new Date().toISOString()};
    setS(p=>({...p,myRules:[rule,...p.myRules]}));
    syncRuleSave(rule);
  };
  const toggleMyRule=(id)=>setS(p=>{
    const next=p.myRules.map(r=>r.id===id?{...r,active:!r.active}:r);
    syncRuleSave(next.find(r=>r.id===id));
    return {...p,myRules:next};
  });
  const deleteMyRule=(id)=>{setS(p=>({...p,myRules:p.myRules.filter(r=>r.id!==id)}));syncRuleDelete(id);};
  // v3 Phase6（設計案57番）：初期ルール候補（SWING_STOP_LOSS等）をまとめて追加する。
  // サーバーDB未移行（investmentLogMigrated=false）の環境ではrule_code等の構造化列を保存できない
  // ため案内のみ表示する（syncRuleSaveは/api/rules/saveへPOSTするだけの薄いラッパーのため）。
  const [seedRulesMsg,setSeedRulesMsg]=useState("");
  const seedDefaultRules=async()=>{

      if(d.count){
        const rr=await fetch("/api/rules");
        if(rr.ok){const rd=await rr.json();if(Array.isArray(rd.rules))setS(p=>({...p,myRules:rd.rules}));}
        setSeedRulesMsg(`初期ルール${d.count}件を追加しました`);

  const rollToNextDay=()=>{if(!confirm("今日の値を前日値へ繰り越し、新しい一日にします（登録銘柄・分析対象銘柄は保持）。よろしいですか？"))return;
    setS(p=>({...emptyState(),date:todayISO(),watchlist:p.watchlist,watchlistUS:p.watchlistUS,analysisTargets:p.analysisTargets,
      watchTargets:p.watchTargets,
      metrics:Object.fromEntries(Object.entries(p.metrics).map(([k,v])=>[k,{t:"",p:v.t}]))}));};
  const exportJSON=()=>{const blob=new Blob([JSON.stringify(s,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="trade-cockpit-"+s.date+".json";a.click();URL.revokeObjectURL(url);};
  const importJSON=(e)=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);
      setS({...emptyState(),...d,watchlist:migrateSectors(d.watchlist),watchlistUS:migrateSectors(d.watchlistUS)});
    }catch{alert("読み込み失敗");}};r.readAsText(f);e.target.value="";};

  // 日本の個別株（TSE:xxxx）は無料の埋め込みウィジェットでは表示不可（東証データの再配信制限）。
  const embeddable=(sym)=>!/^TSE:/i.test(sym||"");

  useEffect(()=>{if(!chartModal||!embeddable(chartModal.symbol))return;const c=modalChartRef.current;if(!c)return;
    c.innerHTML='<div class="tradingview-widget-container__widget"></div>';
    const studies=[];if(cBB)studies.push("BB@tv-basicstudies");if(cRSI)studies.push("RSI@tv-basicstudies");if(cMA)studies.push("MASimple@tv-basicstudies");
    const sc=document.createElement("script");sc.src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";sc.async=true;
    sc.innerHTML=JSON.stringify({symbol:chartModal.symbol,interval:"D",timezone:"Asia/Tokyo",theme:"light",style:"1",locale:"ja",studies,width:"100%",height:480,allow_symbol_change:false});
