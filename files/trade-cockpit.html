  },[draft.market,candidatesJP,candidatesUS]);
  const codeMatches=useMemo(()=>{
    const t=normKana(draft.code.trim());if(!t)return[];
    return positionCandidates.filter(m=>normKana(m.code).includes(t)||normKana(m.name).includes(t)||normKana(m.kana).includes(t)||normKana(m.sector||"").includes(t)).slice(0,10);
  },[draft.code,positionCandidates]);
  useEffect(()=>{setCodeActiveIndex(0);},[draft.code]);
  // 2026-09-08新規：確定した銘柄コード・市場の現在値を参考表示用に取得する（既存の
  // /api/stock-quotesをそのまま再利用、新規APIは作らない）。あくまで参考値であり、
  // average_priceには絶対に自動で入れない（指示書7番）＝実際の約定単価はユーザーが入力する。
  const fetchPreviewQuote=async(code,market)=>{
    setPreviewQuote(null);
    try{
      const r=await fetch("/api/stock-quotes",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify([{code,market}])});
      if(r.ok){const d=await r.json();const q=d.quotes?.[code];if(q)setPreviewQuote(q);}
    }catch(e){}
  };
  const selectCandidate=(m)=>{
    setDraft(d=>({...d,code:m.code,name:m.name,market:m.market}));
    setSelectedSector(m.sector||"");
    setCodeSearchOpen(false);
    fetchPreviewQuote(m.code,m.market);
  };
  const onCodeKeyDown=(e)=>{
    if(!codeSearchOpen||!codeMatches.length)return;
    if(e.key==="ArrowDown"){e.preventDefault();setCodeActiveIndex(i=>(i+1)%codeMatches.length);}
    else if(e.key==="ArrowUp"){e.preventDefault();setCodeActiveIndex(i=>(i-1+codeMatches.length)%codeMatches.length);}
    else if(e.key==="Enter"){e.preventDefault();selectCandidate(codeMatches[codeActiveIndex]);}
    else if(e.key==="Escape"){e.preventDefault();setCodeSearchOpen(false);}
  };
  // 指示書12番：同一銘柄・同一市場が既にポジションにある場合の重複検出（既存の建玉管理仕様＝
  // add_position_entry()の加重平均合算をそのまま使う。upsert（/api/portfolio/save）で
  // 上書きすると既存の数量・取得単価が消えてしまうため、重複時だけ既存の「買い増し」と
  // 同じエンドポイント（/api/portfolio/add-entry）に切り替える）。
  const duplicatePosition=useMemo(()=>{
    const code=draft.code.trim();if(!code)return null;
    return items.find(it=>it.code===code&&(it.market||"JP")===draft.market)||null;
  },[draft.code,draft.market,items]);

  const load=async()=>{
    setLoading(true);
    try{
      const r=await fetch("/api/portfolio");
      if(r.ok){const d=await r.json();setItems(Array.isArray(d.items)?d.items:[]);}
    }catch(e){}
    setLoading(false);
  };
  useEffect(()=>{load();},[]);

  // v3-9続き（2026-09-07・監視銘柄→ポジション連携・売買損益管理）：通算実現損益（初期値＋
  // trade_history合計、サーバー側で毎回再計算）と取引履歴。既存portfolio（含み損益・保有中）
  // とは完全に別枠で表示する（実現損益と含み損益を混同しない、というユーザー指示）。
  const [totals,setTotals]=useState({initialRealizedPnl:0,totalRealizedPnl:0});
  const [trades,setTrades]=useState([]);
  const [initialPnlDraft,setInitialPnlDraft]=useState("");
  const [editingInitialPnl,setEditingInitialPnl]=useState(false);
  const loadTotals=async()=>{
    try{
      const r=await fetch("/api/investment-totals");
      if(r.ok){const d=await r.json();setTotals(d);}
    }catch(e){}
  };
  const loadTrades=async()=>{
    try{
      const r=await fetch("/api/trade-history");
      if(r.ok){const d=await r.json();setTrades(Array.isArray(d.trades)?d.trades:[]);}
    }catch(e){}
  };
  useEffect(()=>{loadTotals();loadTrades();},[]);
  // 買付余力（2026-09-24新規）：ユーザーが手動設定した値（MANUAL最優先）。保存後は
  // "cash-updated"イベントで今買い時TOP5側（別コンポーネント）が即時に再取得する。
  const [cashInfo,setCashInfo]=useState(null);
  const [editingCash,setEditingCash]=useState(false);
  const [cashDraft,setCashDraft]=useState("");
  const [cashError,setCashError]=useState("");
  const loadCash=async()=>{
    try{
      const r=await fetch("/api/portfolio/cash");
      if(r.ok)setCashInfo(await r.json());else setCashInfo({cash_available:null});
    }catch(e){setCashInfo({cash_available:null});}
  };
  useEffect(()=>{loadCash();},[]);
  const saveCash=async()=>{
    const v=Number(String(cashDraft).replace(/[,，\s円]/g,""));
    if(!isFinite(v)||v<0||cashDraft===""){setCashError("0以上の数値を入力してください");return;}
    try{
      const r=await fetch("/api/portfolio/cash",{method:"PUT",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({cash_available:v})});
      if(!r.ok){setCashError("保存に失敗しました");return;}
      setCashInfo(await r.json());
      setEditingCash(false);setCashError("");
      window.dispatchEvent(new CustomEvent("cash-updated"));
    }catch(e){setCashError("保存に失敗しました");}
  };
  // v3-9追加（2026-09-07・ユーザーフィードバック）：入力ミス修正のため、通常時は編集不可
  // 表示のまま「修正」を押した時だけ入力欄を出し、確定前に「初期通算損益を変更すると通算損益が
  // 再計算されます」という確認を必ず挟む（trade_history自体は一切変更しない・再計算対象は
  // 表示上のtotalRealizedPnlのみ）。既存remove()のconfirm()パターンを踏襲。
  const saveInitialPnl=async()=>{
    const v=num(initialPnlDraft);
    if(v==null)return;
    if(!confirm(`初期通算損益を${v.toLocaleString()}円に修正します。\n通算実現損益（初期値＋売買履歴の合計）が再計算されます。売買履歴（trade_history）自体は変更されません。\nよろしいですか？`))return;
    try{
      const r=await fetch("/api/investment-totals/set-initial",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({value:v})});
      if(r.ok){setTotals(await r.json());}
    }catch(e){}
    setEditingInitialPnl(false);
  };
  const todayStr=todayISO();
  const todaysTrades=useMemo(()=>trades.filter(t=>(t.closed_at||"").slice(0,10)===todayStr),[trades,todayStr]);

  // 監視銘柄→ポジション連携の「買い増し」／保有カードの「売却」モーダル状態。
  const [entryModalFor,setEntryModalFor]=useState(null); // {code,name,market}
  const [exitModalFor,setExitModalFor]=useState(null); // portfolio 1件
  const [exitPriceOverride,setExitPriceOverride]=useState(null); // リアルタイム詳細から開いた場合の最新現在値
  const afterEntrySaved=()=>{load();};
  const afterExitSaved=()=>{load();loadTotals();loadTrades();};
  // item12/13：リアルタイム詳細エリアの「💰 売却」から開く場合は、そこで取得した最新の現在値を
  // 売値の初期値に使う（一覧の一括stockQuotesより新しいことが多いため）。通常の一覧行から開く
  // 場合は従来通りstockQuotesを使う（openExitの第2引数省略）。売却処理自体はどちらもこの同じ
  // PositionExitModal・同じ/api/portfolio/exitのみを使う（新しい売却経路は作らない）。
  const openExit=(it,liveCurrent)=>{setExitModalFor(it);setExitPriceOverride(liveCurrent??null);};
  // v3-9続き（2026-09-07・リアルタイム売却判断画面 Phase1）：詳細展開は同時に1銘柄のみ
  // （item17のAPI負荷対策として推奨されている方式を採用。展開を閉じれば即ポーリング停止）。
  const [expandedLiveCode,setExpandedLiveCode]=useState(null);
  // 不具合修正（2026-09-11）：上部ポジションカードの「現在値」が30秒間隔の一括stockQuotes
  // （watchlist経由の/api/stock-quotesバッチ）を見ていた一方、リアルタイム売却判断／チャートは
  // 12秒間隔で独自に/api/position-liveをポーリングしており、2つの別々の取得経路で数値がズレる
  // 不具合があった（上部2,584円・下部2,634円のように表示が食い違う）。PositionLiveDetailが
  // 取得した最新値をonQuoteで親（この一箇所）へ集約し、single source of truthとして
  // カード全体（現在値・評価損益・trailing・RR・EXIT/CAUTION等）へ流す。展開中のポジション
  // だけがこのmapに値を持ち、優先順位は「liveQuotes（実測） > stockQuotes（30秒バッチ） >
  // なし」とする（指示書の優先順位：live > market quote > DB/cache）。
  const [liveQuotes,setLiveQuotes]=useState({}); // key: code+market -> {price, fetchedAt}
  // Phase B-3：売却判断ログ。判断(exitDecision)が変わった瞬間はTRANSITION、変わらなくても60秒毎に
  // SNAPSHOTを/api/position-decision-logへ送る（サーバーはposition_decision_log.jsonlへ追記）。
  // 利益が出た後の条件悪化(profitThenDeterioration)もここで検出できる。
  const lastPosDecisionRef=useRef({});
  useEffect(()=>{
    const snaps=window.__posDecisionSnap||{};
    const now=Date.now(), out=[];
    Object.entries(snaps).forEach(([k,sn])=>{
      const last=lastPosDecisionRef.current[k];
      if(!last||last.decision!==sn.exitDecision){
        out.push({...sn,kind:"TRANSITION",prevDecision:last?last.decision:null,
          quoteToUiMs:sn.quoteAt?now-new Date(sn.quoteAt).getTime():null});
        lastPosDecisionRef.current[k]={decision:sn.exitDecision,at:now};
      }else if(now-last.at>=60000){
        out.push({...sn,kind:"SNAPSHOT",prevDecision:last.decision,
          quoteToUiMs:sn.quoteAt?now-new Date(sn.quoteAt).getTime():null});
        last.at=now;
      }
    });
    if(out.length)fetch("/api/position-decision-log",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({records:out})}).catch(()=>{});
  });
  const reportLiveQuote=useCallback((key,price,quoteAt)=>{
    if(price==null)return;
    setLiveQuotes(p=>((p[key]?.price===price&&p[key]?.quoteAt===(quoteAt||null))?p:{...p,[key]:{price,quoteAt:quoteAt||null,fetchedAt:new Date().toISOString()}}));
  },[]);

  // v3-4：入力中のコードがトレード分析タブで既に「分析」済みなら、その時点のstop/target/
  // fullExitTargetを初期SL・利確①②の下書きに流し込むショートカット（既存analysisDataの
  // 再利用のみ、新規計算なし）。あくまで下書きへの反映で、押さない限り書き換わらない。
  const analysisForDraft=analysisData?.[draft.code.trim()];
  const applyAnalysisValues=()=>{
    if(!analysisForDraft)return;
    setDraft(d=>({...d,
      initial_stop:analysisForDraft.stop??d.initial_stop,
      target_1:analysisForDraft.target??d.target_1,
      target_2:analysisForDraft.fullExitTarget??d.target_2,
      // Trade Learning Phase B：分析値由来のSTOPは根拠も一緒に引き継ぐ（後で手入力すればMANUALに上書きされる）
      stop_reason_category:analysisForDraft.stopReasonCategory??d.stop_reason_category,
      stop_reason_text:analysisForDraft.stopReason??d.stop_reason_text}));
  };

  const resetDraftExtras=()=>{setDraft(emptyDraft);setPreviewQuote(null);setSelectedSector("");setAlsoWatch(false);setCodeSearchOpen(false);};
  const save=async()=>{
    const code=draft.code.trim();
    if(!code)return;
    // 2026-09-08追加（指示書12番）：既に同一銘柄・同一市場のポジションがある場合、黙って
    // 上書き（/api/portfolio/save）せず、既存の建玉管理仕様（加重平均で合算する
    // add_position_entry、監視銘柄カードの「ポジション追加」「買い増し」と同じロジック）に
    // 切り替えるかどうかを確認する。
    if(duplicatePosition){
      if(!confirm(`${draft.name||code}（${code}）は既にポジションにあります（現在 ${num(duplicatePosition.quantity)?.toLocaleString()}株 @${num(duplicatePosition.average_price)?.toLocaleString()}円）。\n追加建てとして登録しますか？（既存分と加重平均で合算されます）`))return;
      if(!draft.trade_style){alert("取引タイプ（DAY/SWING）を選択してください");return;}
      setSaving(true);
      try{
        const r=await fetch("/api/portfolio/add-entry",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({code,name:draft.name,market:draft.market,price:num(draft.average_price),shares:num(draft.quantity),trade_style:draft.trade_style,entry_venue:draft.entry_venue})});
        const d=await r.json();
        if(d.error){alert(d.error);}
        else{
          if(alsoWatch)await addAlsoToWatchlist(code,draft.name,draft.market);
          resetDraftExtras();load();
        }
      }catch(e){}
      setSaving(false);
      return;
    }
    setSaving(true);
    try{
      await fetch("/api/portfolio/save",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({...draft,quantity:num(draft.quantity),average_price:num(draft.average_price),
          acquired_at:draft.acquired_at||null,
          initial_stop:num(draft.initial_stop),target_1:num(draft.target_1),target_2:num(draft.target_2),
          // current_stopは新規登録時は初期SLと同じ値で開始する（トレーリング状態＝「初期SL」から始まる）
          current_stop:num(draft.initial_stop),
          // Trade Learning Phase B：空文字はNULL（未設定=UNKNOWN扱い）として送る
          stop_reason_category:draft.stop_reason_category||null,stop_reason_text:draft.stop_reason_text||null})});
      if(alsoWatch)await addAlsoToWatchlist(code,draft.name,draft.market);
      resetDraftExtras();
      load();
    }catch(e){}
    setSaving(false);
  };
  // 指示書4番：「監視にも追加」チェックボックス。監視銘柄への自動追加は行わず、ユーザーが
  // 明示的にチェックした場合のみ、既存のsetWatchlistJP/US（App側、Neon同期込み）を呼び出す。
  // 業種は候補選択時に分かっていればそれを使い、フリー入力等で不明な場合のみ既存の
  // /api/guess-sector（SectorWatchlist.addManual()と同じ、新規APIは作らない）で推定する。
  const addAlsoToWatchlist=async(code,name,market)=>{
    let sector=selectedSector;
    if(!sector){
      try{
        const r=await fetch("/api/guess-sector",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code,market})});
        if(r.ok){const d=await r.json();sector=d.sector||"";}
      }catch(e){}
    }
    const result=onAddToWatchlist&&onAddToWatchlist({code,name,market,sector});
    setWatchAddMsg(result==="already"?"（既に監視銘柄に登録済みでした）":result==="max"?"（監視銘柄が上限のため追加できませんでした）":"（監視銘柄にも追加しました）");
    setTimeout(()=>setWatchAddMsg(""),3500);
  };
  const remove=async(code,market)=>{
    if(!confirm(`${code}を保有株一覧から削除しますか？`))return;
    try{
      const r=await fetchJsonSafe("/api/portfolio/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code,market})});
      // 未約定ポジション削除連動（2026-09-16新規）：実約定が確認できない仮登録だった場合のみ、
      // サーバー側がその日の日次振り返りを自動再生成する。ユーザーが「再生成」を押し直さずに
      // 済むよう、発火した場合だけ簡潔に知らせる（発火しなかった場合は無言＝実売買データは
      // 一切変更していない）。
      if(r?.reviewCleanup?.triggered){
        setWatchAddMsg(`（実約定が確認できない仮登録だったため、${r.reviewCleanup.reviewDate}の振り返りを再生成しました）`);
        setTimeout(()=>setWatchAddMsg(""),5000);
      }
      load();
    }catch(e){}
  };

  // v3-4：現在SLだけをその場で編集・保存する（他の列は送らないので上書きされない＝
  // upsert_portfolio_itemは送られた列だけをUPDATEする部分更新の仕組みを利用）。
  const [stopDraftFor,setStopDraftFor]=useState(null); // 編集中のcode+market
  const [stopDraftVal,setStopDraftVal]=useState("");
  const saveCurrentStop=async(it)=>{
    const v=num(stopDraftVal);
    try{
      await fetch("/api/portfolio/save",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({code:it.code,market:it.market,current_stop:v})});
      setStopDraftFor(null);
      load();
    }catch(e){}
  };

  // v3-8 Step1：既存ポジション（取引タイプ未設定＝NULL）にDAY/SWINGを後から設定するための
  // ワンクリック保存（他の列は送らないので上書きされない＝部分更新の仕組みを利用）。
  const saveTradeStyle=async(it,style)=>{
    try{
      await fetch("/api/portfolio/save",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({code:it.code,market:it.market,trade_style:style})});
      load();
    }catch(e){}
  };

  // v3-4（ChatGPT連携の再配置）：「利確・損切り相談」。ポジションの実データ（実際の平均取得単価
  // 基準）に加えて、対応するトレード分析結果（analysisData、あれば）を「参考情報」として別枠で
  // 添える。ポジション管理の基準は実際の取得単価であり、トレード分析のentryは参考値である旨を
  // 明示するnoteを含める。
  const [positionConsultMsg,setPositionConsultMsg]=useState("");
  const copyPositionConsult=async(it)=>{
    const current=num(stockQuotes?.[it.code]?.t);
    const {amount:pnlAmount,pct:pnlPct}=calcUnrealizedPnl(it.average_price,it.quantity,current);
    const basisPrice=it.average_price??current;
    const rr=calcPositionRR(it.target_1,basisPrice,it.current_stop);
    const trailKey=deriveTrailingStatus(it.current_stop,it.initial_stop,it.average_price,current);
    // 2026-09-10更新（損切りルール是正・最優先修正）：全トレードスタイル共通の
    // POSITION_RISK_RULES（唯一の真実）を参照する。旧SWING限定-10%からの是正。
    const exitPrice=calcPositionExitPrice(it.average_price);
    const riskTier=evaluatePositionRiskRule(pnlPct);
    const a=analysisData?.[it.code];
    // 2026-09-09新規（ルール学習システム、指示書12番）：exit/position/riskカテゴリと、
    // この銘柄のsector/themeから推定したカテゴリのACTIVE/TESTINGルールを添える。
    const cats=[...new Set([...guessRuleCategoriesForStock(it.sector,it.theme),"position","exit"])];
    const activeRulesForPosition=await fetchJsonSafe(`/api/trade-rules/relevant?categories=${encodeURIComponent(cats.join(","))}`)
      .then(d=>(d&&d.rules)||[]).catch(()=>[]);
    // 2026-09-09新規（判断エンジン全画面統合、指示書5・6番）：ポジション相談・利確損切り
    // 相談は新規買い判断ではなくEXIT側（HOLD/RAISE_STOP/TAKE_PROFIT/REDUCE/EXIT/
    // NO_OVERNIGHT）を返すscope="exit"で統合コンテキストを取得する。
    const knowledgeExit=await fetchJsonSafe("/api/knowledge-context",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({code:it.code,sector:it.sector,market:it.market,scope:"exit",
        position:{trade_style:it.trade_style,unrealized_pnl_pct:pnlPct}})}).catch(()=>null);
    // 2026-09-09新規（判断エンジン全画面統合、指示書7番）：持ち越し判断専用ロジック
    // （OVERNIGHT_OK/OVERNIGHT_CAUTION/NO_OVERNIGHT）も併せて取得する。
    const overnight=await fetchJsonSafe("/api/knowledge-context",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({code:it.code,sector:it.sector,market:it.market,scope:"overnight",
        position:{trade_style:it.trade_style,unrealized_pnl_pct:pnlPct}})}).catch(()=>null);
    await copyChatGPTPayload("利確・損切り相談","position_management",{
      stock:{code:it.code,name:it.name,market:it.market},
      position:{
        trade_style:it.trade_style||null,
        quantity:it.quantity,average_price_actual:it.average_price,current,
        unrealized_pnl:{amount:pnlAmount,pct:pnlPct},
        initial_stop:it.initial_stop,current_stop:it.current_stop,
        target_1:it.target_1,target_2:it.target_2,rr,trailing_status:TRAILING_STATUS_META[trailKey].label,
        exit_rule:exitPrice!=null?{price:exitPrice,tier:riskTier,maxLossPct:POSITION_RISK_RULES.maxLossPct}:null,
      },

    {/* 買付余力（2026-09-24新規）：今買い時TOP5・注目候補の「実際に買える銘柄」判定に使う手動設定値。 */}

            const gross=num(t.gross_pnl)??num(t.pnl);

            // 振り返り：PTS売買対応（2026-09-23新規）：市場区分（通常/PTS）をENTRY/EXITそれぞれ

            return <div key={t.id} style={{fontSize:12,display:"flex",flexWrap:"wrap",gap:8,alignItems:"center"}}>

              <span className="mono" style={{fontSize:11,color:"var(--inkFaint)"}}>
                税引前 <span style={{fontWeight:700,color:gross>0?"var(--up)":gross<0?"var(--down)":"var(--inkSoft)"}}>{gross!=null?`${gross>0?"+":""}${Math.round(gross).toLocaleString()}円`:"—"}</span>
              </span>
              <span className="mono" style={{fontSize:12,fontWeight:700,color:net==null?"var(--inkFaint)":net>0?"var(--up)":net<0?"var(--down)":"var(--inkSoft)"}}>
                税引後 {net!=null?`${net>0?"+":""}${Math.round(net).toLocaleString()}円`:"—（旧レコード）"}
              </span>

    </div>
    <div style={{background:"var(--card)",border:"1px solid var(--rule)",borderRadius:4,padding:"12px 14px",marginBottom:14}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
      <div style={{fontWeight:700,color:"var(--ink)",fontSize:13}}>保有株（portfolio）</div>
      <span style={{fontSize:11,color:"var(--inkFaint)"}}>{items.length}銘柄</span>
    </div>
    {/* 2026-09-08更新（ポジション登録機能の改善）：「コード」欄を銘柄検索欄として機能させる。

        （candidatesJP/US）から即座に候補を表示する。285Aのような英字混じりコードもcode列は
        常に文字列のまま扱い、数値変換は一切行わない（指示書9番）。自由入力（候補に無い銘柄を
        手で打つ）も従来通り可能。 */}
    <div className="position-add-grid-1" style={{display:"grid",gridTemplateColumns:"110px 1fr 55px 90px 110px 70px 90px 110px",gap:6,marginBottom:6}}>
      <div style={{position:"relative"}}>
        <input placeholder="コード/銘柄名で検索" value={draft.code}
          onChange={e=>{setDraft({...draft,code:e.target.value});setCodeSearchOpen(true);setPreviewQuote(null);setSelectedSector("");}}
          onFocus={()=>setCodeSearchOpen(true)} onBlur={()=>setTimeout(()=>setCodeSearchOpen(false),150)}
          onKeyDown={onCodeKeyDown} style={fieldStyle}/>
        {codeSearchOpen && draft.code.trim() && codeMatches.length>0 && <div className="results" style={{maxHeight:260,overflowY:"auto"}}>
          {codeMatches.map((m,i)=>
            <button key={m.code} type="button" className="res-row" style={{background:i===codeActiveIndex?"var(--band)":"transparent"}}
              onMouseEnter={()=>setCodeActiveIndex(i)} onMouseDown={e=>e.preventDefault()} onClick={()=>selectCandidate(m)}>
              <span className="mono" style={{fontSize:12,width:56,color:"var(--inkSoft)"}}>{m.code}</span>
              <span style={{flex:1,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={m.name}>{m.name}</span>
              <span style={{fontSize:11,color:"var(--inkSoft)",whiteSpace:"nowrap"}}>{m.sector}</span>
            </button>)}
        </div>}
      </div>
      <input placeholder="銘柄名" value={draft.name} onChange={e=>setDraft({...draft,name:e.target.value})} style={fieldStyle}/>
      <select value={draft.market} onChange={e=>{setDraft({...draft,market:e.target.value});setPreviewQuote(null);setSelectedSector("");}} style={fieldStyle}>
        <option value="JP">JP</option><option value="US">US</option>
      </select>
      {/* v3-8 Step1：取引タイプは新規登録で必須（未選択のプレースホルダーを空値のoptionとして用意）。 */}
      <select value={draft.trade_style} onChange={e=>setDraft({...draft,trade_style:e.target.value})} style={{...fieldStyle,fontWeight:draft.trade_style?400:700,color:draft.trade_style?"var(--ink)":"var(--down)"}}>
        <option value="">取引タイプ*</option><option value="DAY">DAY（デイトレ）</option><option value="SWING">SWING（スイング）</option>
      </select>
      {/* 振り返り：PTS売買対応（2026-09-23新規）：市場区分（通常/PTS）。既定は通常。 */}
      <select value={draft.entry_venue} onChange={e=>setDraft({...draft,entry_venue:e.target.value})} style={fieldStyle} title="購入した市場区分（通常市場／PTS）">
        <option value="REGULAR">市場区分：通常</option><option value="PTS">市場区分：PTS</option>
      </select>
      <input placeholder="株数" value={draft.quantity} onChange={e=>setDraft({...draft,quantity:e.target.value})} style={fieldStyle}/>
      <input placeholder="平均取得単価（実際の約定単価）" value={draft.average_price} onChange={e=>setDraft({...draft,average_price:e.target.value})} style={fieldStyle}/>
      <input type="date" value={draft.acquired_at} onChange={e=>setDraft({...draft,acquired_at:e.target.value})} style={fieldStyle}/>
    </div>
    {/* 指示書5・7番：確定した銘柄の現在値を参考表示（average_priceには絶対に自動で入れない）。

    {(previewQuote||duplicatePosition) && <div style={{fontSize:11.5,marginBottom:8,display:"flex",flexWrap:"wrap",gap:10,alignItems:"center"}}>
      {previewQuote && <span style={{color:"var(--inkSoft)"}}>現在値（参考） <span className="mono" style={{fontWeight:700,color:"var(--ink)"}}>{num(previewQuote.t)?.toLocaleString()??"—"}</span>円</span>}
      {duplicatePosition && <span style={{color:"var(--accent)",fontWeight:700}}>⚠ 既にポジションにあります（{num(duplicatePosition.quantity)?.toLocaleString()}株 @{num(duplicatePosition.average_price)?.toLocaleString()}円）。追加建て（加重平均で合算）として登録されます。</span>}
    </div>}
    <div className="position-add-grid-2" style={{display:"grid",gridTemplateColumns:"90px 90px 90px 1fr auto auto",gap:6,marginBottom:6,alignItems:"center"}}>
      <input placeholder="初期SL" value={draft.initial_stop} onChange={e=>setDraft({...draft,initial_stop:e.target.value,
        // Trade Learning Phase B：手入力で上書きしたら根拠はMANUAL扱いに切り替える（分析値の根拠を誤って残さない）
        stop_reason_category:"MANUAL",stop_reason_text:""})} style={fieldStyle}/>
      <input placeholder="利確①" value={draft.target_1} onChange={e=>setDraft({...draft,target_1:e.target.value})} style={fieldStyle}/>
      <input placeholder="利確②" value={draft.target_2} onChange={e=>setDraft({...draft,target_2:e.target.value})} style={fieldStyle}/>
      <input placeholder="メモ" value={draft.memo} onChange={e=>setDraft({...draft,memo:e.target.value})} style={fieldStyle}/>
      {analysisForDraft && <button className="action-btn" type="button" onClick={applyAnalysisValues} title="トレード分析タブでのこの銘柄のstop/利確①/利確②を下書きに反映します（参考値。実際の取得単価は上の欄に手入力してください）">分析値を使う</button>}
      <button className="btn" onClick={save} disabled={saving||!draft.code.trim()||!draft.trade_style} title={!draft.trade_style?"取引タイプ（DAY/SWING）の選択が必須です":undefined}>追加</button>
    </div>
    {/* 指示書4番：監視銘柄への自動追加はしない。チェックした場合のみ既存のsetWatchlistJP/US

    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>

    </div>
    {loading
      ? <div style={{fontSize:12,color:"var(--inkFaint)"}}>読み込み中…</div>

        ? <div style={{fontSize:12,color:"var(--inkFaint)"}}>まだ保有株の登録がありません。</div>
        : <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",gap:8}}>
            {items.map(it=>{
              // 不具合修正（2026-09-11）：live（/api/position-live実測、liveQuotes）を最優先、
              // 無ければ従来通りstockQuotes（30秒バッチ）を使う。current以下（損益・trailing・

              const liveKey=it.code+it.market;

              // 採用する（liveが古いのに優先されて他画面とズレるのを防ぐ）。時刻が無ければ従来のlive優先。
              const _lq=liveQuotes[liveKey], _sq=stockQuotes?.[it.code];
              const _lqAt=Date.parse(_lq?.quoteAt||_lq?.fetchedAt||"")||0, _sqAt=Date.parse(_sq?.quote_timestamp||_sq?.quoteFetchedAt||"")||0;
              const current=(_lq?.price!=null&&!(num(_sq?.t)!=null&&_sqAt>_lqAt))?_lq.price:(num(_sq?.t)??_lq?.price??null);
              const {amount:pnlAmount,pct:pnlPct}=calcUnrealizedPnl(it.average_price,it.quantity,current);
              const basisPrice=it.average_price??current;
              const rr=calcPositionRR(it.target_1,basisPrice,it.current_stop);
              const trailKey=deriveTrailingStatus(it.current_stop,it.initial_stop,it.average_price,current);
              const trailMeta=TRAILING_STATUS_META[trailKey];

              // EXIT RULE（-8%）。他のいかなる判定より優先表示する。
              const exitPrice=calcPositionExitPrice(it.average_price);
              const riskTier=evaluatePositionRiskRule(pnlPct);
              const riskMeta=riskTier?POSITION_RISK_RULE_META[riskTier]:null;
              // v3-8 Step4：ポジション専用Status。銘柄分析用のPrimary/Action Status（enr）とは
              // 別ロジックで、あくまで保有判断専用（enrはこの下で「参考情報」としてのみ添える）。
              // Step5：DAY/SWING別チャート崩れ判定用にindicators（VWAP・5日線・25日線・当日高値）
              // も渡す（analysisData、既存の分析結果をそのまま再利用。新規取得なし）。
              const posFlags=analysisData?.[it.code]?.positionFlags;
              const posIndicators=analysisData?.[it.code]?.indicators;
              const enr=analysisEnrichedMap?.get(it.code);
              // Step9：最良気配（stockQuotesが立花証券API接続時に上書きするask/bid、新規取得なし）
              const boardAsk=num(stockQuotes?.[it.code]?.ask);
              const boardBid=num(stockQuotes?.[it.code]?.bid);
              const posResult=derivePositionStatus({avgPrice:it.average_price,tradeStyle:it.trade_style,
                current,currentStop:it.current_stop,initialStop:it.initial_stop,target1:it.target_1,
                positionFlags:posFlags,pnlPct,indicators:posIndicators,enrStatus:enr?.status,
                ask:boardAsk,bid:boardBid,eventRiskLevel:eventRiskGuard?.byCode?.[it.code]?.level});
              const posMeta=POSITION_STATUS_META[posResult.status];
              // Phase B-3（2026-09-25）：売却判断の追跡スナップショット。renderごとに最新値を
              // window側へ置き、下のuseEffect(usePositionDecisionLogger)が状態遷移時／60秒毎に送信する。
              {
                const _a=analysisData?.[it.code];
                const _peak=it.peak_price!=null?Math.max(it.peak_price,current??0):current;
                const _peakPnl=it.peak_pnl_pct??null;
                (window.__posDecisionSnap=window.__posDecisionSnap||{})[it.code+(it.market||"JP")]={
                  code:it.code,market:it.market||"JP",tradeStyle:it.trade_style,
                  quoteAt:_a?.quoteAt||stockQuotes?.[it.code]?.quote_timestamp||liveQuotes[liveKey]?.quoteAt||null,
                  analysisAt:_a?.analyzedAt||null,renderedAt:new Date().toISOString(),
                  entryPrice:it.average_price??null,currentPrice:current??null,unrealizedPct:pnlPct!=null?Math.round(pnlPct*100)/100:null,
                  highSinceEntry:_peak??null,distanceFromHighPct:(_peak&&current!=null)?Math.round((current-_peak)/_peak*10000)/100:null,
                  peakPnlPct:_peakPnl,exitRule:evaluatePositionRiskRule(pnlPct),exitDecision:posResult.status,
                  riskState:(positionAlerts[it.code+(it.market||"JP")]||{}).tier||null,
                  profitThenDeterioration:(_peakPnl!=null&&_peakPnl>=0.5&&pnlPct!=null&&(pnlPct<=0.1||pnlPct<_peakPnl*0.5)),
                  reasons:(posResult.reasons||[]).slice(0,6)};
              }
              // v3-8 Step8（UIカード再設計）：表示順を「取引タイプ→ポジションStatus→取得値/現在値/
              // 損益→HARD STOP/現在SL→Trailing/利確候補→チャート・出来高警戒（Statusの理由として
              // 既に列挙）→判断理由→操作」に統一。既存のENTRY READY等（enr、銘柄分析用の参考情報）
              // は主役にせず、末尾に小さく添えるだけにする。ロジック自体（derivePositionStatus等）は
              // 変更しない、表示順のみの並び替え。
              return <div key={it.code+it.market} id={"position-card-"+it.code+(it.market||"JP")} style={{border:"1px solid var(--rule)",borderRadius:5,padding:"10px 12px",background:"var(--bg)"}}>
                {/* ① 取引タイプ（ヘッダー：銘柄名・コード・DAY/SWING切替・削除） */}
                <div style={{display:"flex",alignItems:"baseline",gap:8}}>
                  <span style={{fontWeight:800,fontSize:13.5}}>{it.name||it.code}</span>
                  <span className="mono" style={{fontSize:11,color:"var(--inkFaint)"}}>{it.code}</span>
                  {it.trade_style && <button className="iconbtn" style={{fontSize:10.5,fontWeight:700,color:"var(--inkSoft)",border:"1px solid var(--rule)",borderRadius:3,padding:"1px 6px"}}
                    title="クリックでDAY⇔SWINGを切り替え"
                    onClick={()=>saveTradeStyle(it,it.trade_style==="DAY"?"SWING":"DAY")}>
                    {it.trade_style==="DAY"?"DAY":"SWING"}</button>}
                  <button className="iconbtn" style={{marginLeft:"auto"}} title="削除" onClick={()=>remove(it.code,it.market)}>×</button>
                </div>
                {!it.trade_style && <div style={{display:"flex",alignItems:"center",gap:6,marginTop:4,fontSize:11,color:"var(--down)"}}>
                  ⚠ 取引タイプ未設定：
                  <button className="action-btn" style={{fontSize:10.5,padding:"2px 8px"}} onClick={()=>saveTradeStyle(it,"DAY")}>DAYに設定</button>
                  <button className="action-btn" style={{fontSize:10.5,padding:"2px 8px"}} onClick={()=>saveTradeStyle(it,"SWING")}>SWINGに設定</button>
                </div>}

                {/* ② ポジションStatus（このカードの主役。HOLD_STRONG〜STOPの8状態） */}
                <div style={{display:"flex",alignItems:"center",gap:6,marginTop:8}}>
                  <span style={{fontSize:13,fontWeight:800,color:posMeta.color,border:`1px solid ${posMeta.color}`,borderRadius:3,padding:"3px 9px"}}>
                    {posMeta.icon} {posMeta.label}
                  </span>
                </div>

                {/* ③ 取得値/現在値/損益 */}
                <div className="mono" style={{fontSize:12,color:"var(--inkSoft)",marginTop:8}}>
                  {it.quantity!=null?`${it.quantity.toLocaleString()}株`:"—株"} @ {it.average_price!=null?it.average_price.toLocaleString():"—"}
                  {"　現在 "}{current!=null?current.toLocaleString():"—"}
                  {/* v3-8 Step9：最良気配（立花証券API接続時のみ）。板の深さ・数量は取得できないため
                      表示もbid/askとスプレッドのみ。あくまで参考の補助情報。 */}
                  {boardBid!=null && boardAsk!=null && <span style={{color:"var(--inkFaint)",fontSize:11}}>
                    {"　気配 "}{boardBid.toLocaleString()}/{boardAsk.toLocaleString()}
                  </span>}
                </div>
                <div className="mono" style={{fontSize:15,fontWeight:800,marginTop:2,
                    color:pnlAmount==null?"var(--inkFaint)":pnlAmount>0?"var(--up)":pnlAmount<0?"var(--down)":"var(--inkSoft)"}}>
                  {pnlAmount!=null?`${pnlAmount>0?"+":""}${Math.round(pnlAmount).toLocaleString()}円`:"—"}
                  {pnlPct!=null && <span style={{fontSize:12,fontWeight:700,marginLeft:6}}>({pnlPct>0?"+":""}{pnlPct.toFixed(2)}%)</span>}
                </div>

                {/* PHASE7（2026-09-18新規、保有中撤退判断支援アラート）：最大含み益・ENTRY
                    THESIS・撤退警戒度・過去類似失敗を常時表示する。EXIT RULE（下）を上書き
                    しない、あくまで追加情報。 */}
                {(()=>{
                  const alertKey=it.code+(it.market||"JP");
                  const alert=positionAlerts[alertKey];
                  if(!alert)return null;
                  const tierMeta=alert.tier?EXIT_ALERT_TIER_META[alert.tier]:null;
                  const thesisTotal=it.entry_thesis_json?Object.keys(THESIS_DIMENSION_LABELS).length:null;
                  const thesisOk=it.entry_thesis_json?thesisTotal-alert.brokenConditions.length:null;
                  const failures=similarFailures[alertKey];
                  return <div style={{marginTop:6,fontSize:11,color:"var(--inkSoft)"}}>
                    <div style={{display:"flex",flexWrap:"wrap",gap:"2px 10px"}}>
                      {peakCacheRef.current[alertKey]?.peakPnlPct!=null && <span>最大含み益 +{peakCacheRef.current[alertKey].peakPnlPct.toFixed(2)}%</span>}
                      {alert.profitGivebackPct!=null && <span>利益消失 {Math.round(alert.profitGivebackPct)}%</span>}
                      {thesisTotal!=null && <span>ENTRY THESIS {thesisOk}/{thesisTotal}</span>}
                      {tierMeta && <span style={{fontWeight:800,color:tierMeta.color,border:`1px solid ${tierMeta.color}`,borderRadius:3,padding:"0 6px"}}>
                        撤退警戒度 {tierMeta.label}
                      </span>}
                    </div>
                    {alert.reasons.length>0 && <div style={{marginTop:2}}>{alert.reasons.join("・")}</div>}
                    {alert.isHopeHolding && <div style={{marginTop:2,fontWeight:700,color:"var(--down)"}}>
                      ⚠ HOPE HOLDING DETECTED：根拠より期待で保有している可能性があります。現在の保有理由を再確認してください。
                    </div>}
                    {alert.isBreakevenExitCandidate && <div style={{marginTop:2,fontWeight:700,color:"var(--down)"}}>
                      🔴 同値撤退候補：期待で持つ状態に移行している可能性があります。撤退判断を再確認してください。
                    </div>}
                    {failures && failures.length>0 && <div style={{marginTop:2,color:"var(--inkFaint)"}}>
                      過去類似失敗：{failures.map(f=>`${f.tradeDate}${f.lesson?"「"+f.lesson+"」":""}`).join("／")}
                    </div>}
                  </div>;
                })()}

                {/* ④ EXIT RULE／現在SL（2026-09-10更新：全トレードスタイル共通-8%ルール） */}
                {riskMeta && <div style={{marginTop:8,padding:"6px 9px",
                    background:"var(--downBg)",border:`1.5px solid ${riskMeta.color}`,borderRadius:3,
                    fontSize:11.5,fontWeight:800,color:riskMeta.color}}>
                  <div>{riskMeta.title}</div>
                  <div style={{fontWeight:600,marginTop:2}}>{riskMeta.label}（取得単価比 {pnlPct!=null?pnlPct.toFixed(1):"—"}%）</div>
                  {riskTier==="EXIT" && <>
                    <div style={{fontWeight:800,fontSize:13,marginTop:4}}>{riskMeta.action}</div>
                    <div style={{fontWeight:400,fontSize:11,marginTop:2,color:"var(--inkSoft)"}}>{riskMeta.note}</div>
                  </>}
                </div>}
                <div style={{display:"flex",flexWrap:"wrap",gap:10,marginTop:8,fontSize:12,alignItems:"center"}}>
                  {exitPrice!=null && <div title="全トレードスタイル共通・取得単価×0.92（-8%）。自信度・材料等いかなる他条件に関わらずこれを下回れば一旦売却が原則（再エントリーは新しいトレードとして別途判断）。">
                    <span style={{color:"var(--down)"}}>EXIT RULE </span>
                    <span className="mono" style={{fontWeight:700,color:"var(--down)"}}>{Math.round(exitPrice).toLocaleString()}</span>
                    <span style={{color:"var(--inkFaint)"}}>（{POSITION_RISK_RULES.maxLossPct}%）</span>
                  </div>}
                  <div>
                    <span style={{color:"var(--inkSoft)"}}>SL </span>
                    <span className="mono">{it.initial_stop!=null?it.initial_stop.toLocaleString():"—"}</span>
                    <span style={{color:"var(--inkFaint)"}}> → 現在SL </span>
                    {editingStop
                      ? <span style={{display:"inline-flex",gap:4,alignItems:"center"}}>
                          <input autoFocus value={stopDraftVal} onChange={e=>setStopDraftVal(e.target.value)}
                            onKeyDown={e=>{if(e.key==="Enter")saveCurrentStop(it);if(e.key==="Escape")setStopDraftFor(null);}}
                            style={{...fieldStyle,width:70,padding:"2px 5px"}}/>
                          <button className="action-btn" style={{fontSize:10,padding:"2px 5px"}} onClick={()=>saveCurrentStop(it)}>保存</button>
                        </span>
                      : <span className="mono" style={{fontWeight:700,cursor:"pointer",borderBottom:"1px dashed var(--inkFaint)"}}
                          title="クリックして現在SLを変更"
                          onClick={()=>{setStopDraftFor(it.code+it.market);setStopDraftVal(it.current_stop??it.initial_stop??"");}}>
                          {it.current_stop!=null?it.current_stop.toLocaleString():"未設定"}
                        </span>}
                  </div>
                </div>

                {/* ⑤ Trailing／利確候補 */}
                <div style={{display:"flex",flexWrap:"wrap",gap:10,marginTop:6,fontSize:12,alignItems:"center"}}>
                  <span style={{fontSize:10.5,fontWeight:700,color:trailMeta.color,border:`1px solid ${trailMeta.color}`,borderRadius:3,padding:"1px 6px"}}>状態：{trailMeta.label}</span>
                  {posResult.suggestedTrailingStop!=null && <span style={{fontSize:11,color:"var(--up)"}}>
                    トレーリング目安SL <span className="mono" style={{fontWeight:700}}>{posResult.suggestedTrailingStop.toLocaleString()}</span>
                  </span>}
                  <div><span style={{color:"var(--inkSoft)"}}>TP1 </span><span className="mono">{it.target_1!=null?it.target_1.toLocaleString():"—"}</span></div>
                  <div><span style={{color:"var(--inkSoft)"}}>TP2 </span><span className="mono">{it.target_2!=null?it.target_2.toLocaleString():"—"}</span></div>
                  <div><span style={{color:"var(--inkSoft)"}}>RR </span><span className="mono" style={{fontWeight:700}}>{rr!=null?`1 : ${rr.toFixed(2)}`:"--"}</span></div>
                </div>

                {/* ⑥⑦ チャート・出来高警戒／判断理由（Step3〜6のフラグはposResult.reasonsに集約済み。
                    ここでは省略せず全件表示する） */}
                {posResult.reasons.length>0 && <div style={{marginTop:8,padding:"6px 8px",background:"var(--card)",border:"1px solid var(--rule)",borderRadius:3}}>
                  <div style={{fontSize:10.5,fontWeight:700,color:"var(--inkSoft)",marginBottom:2}}>判断理由</div>
                  <ul style={{margin:0,paddingLeft:16,fontSize:11,color:"var(--inkSoft)"}}>
                    {posResult.reasons.map((r,i)=><li key={i}>{r}</li>)}
                  </ul>
                </div>}

                {/* v3-9続き（PHASE 3）：イベント接近（参考情報のみ、Statusには不干渉）。
                    trade_styleに応じてDAY/SWINGで扱いを変える注記を添える。 */}
                <EventRiskNote events={marketEvents} code={it.code} sector={it.sector} tradeStyle={it.trade_style}/>
                {/* v3-9続き（PHASE 4）：カタリスト接近（参考情報のみ、Statusには不干渉）。 */}
                <CatalystNote catalysts={newsCatalysts} code={it.code} sector={it.sector}/>
                {/* v3-9続き（PHASE 5）：EXPERT VIEW（参考情報のみ、ポジション判定ロジックには使わない）。
                    ユーザー指定のモックアップに合わせ、ポジションカードでは一行要約（compact）で表示する。 */}
                <ExpertViewNote views={expertViews} code={it.code} sector={it.sector} market={it.market} compact/>

                {/* ⑨ リアルタイム売却判断エリア（Phase1〜3）。「リアルタイム」ボタンで展開している
                    ポジションのみ、PositionLiveDetailが/api/position-liveを一定間隔でポーリングする。
                    同時に1銘柄のみ展開可能（expandedLiveCode、item17のAPI負荷対策）。
                    2026-09-07追加（実機フィードバック）：既存カードに埋もれて新機能だと分からない
                    という指摘を受け、トグルボタンをaccent色・フル幅にして視認性を上げた。 */}
                <div style={{marginTop:8}}>
                  <button className="btn" style={{fontSize:12,width:"100%",background:"var(--accent)",color:"#fff",border:"none"}}
                    onClick={()=>setExpandedLiveCode(k=>k===(it.code+it.market)?null:(it.code+it.market))}>
                    {expandedLiveCode===(it.code+it.market)?"📊 リアルタイム売却判断 ▲ 閉じる":"📊 リアルタイム売却判断を開く ▼"}
                  </button>
                  {expandedLiveCode===(it.code+it.market) && <PositionLiveDetail item={it} onOpenExit={openExit}
                    posFlags={posFlags} posIndicators={posIndicators} enrStatus={enr?.status}
                    onQuote={(price,quoteAt)=>reportLiveQuote(liveKey,price,quoteAt)}/>}
                </div>

                {/* ⑧ 操作・参考情報・メモ */}
                <div style={{display:"flex",alignItems:"center",gap:6,marginTop:8,flexWrap:"wrap"}}>
                  {positionConsultMsg && <span style={{fontSize:10.5,color:"var(--accent)",fontWeight:700}}>{positionConsultMsg}</span>}
                  <button className="action-btn" style={{fontSize:11}} onClick={()=>copyPositionConsult(it)}>🤖 利確・損切り相談</button>
                  {/* v3-9続き（2026-09-07）：売却・買い増し。実現損益の自動計算・通算実現損益の
                      更新・全株売却時の自動削除はサーバー側（add_position_exit）が行う。 */}
                  <button className="action-btn" style={{fontSize:11}} onClick={()=>openExit(it)}>💰 売却</button>
                  <button className="action-btn" style={{fontSize:11}} onClick={()=>setEntryModalFor({code:it.code,name:it.name,market:it.market})}>➕ 買い増し</button>
                  {/* 2026-09-09新規（監視銘柄・市場チャートの時間足切替、対象画面「ポジション画面」対応）：
                      他画面と全く同じ共通ChartModalをここからも開けるようにした。 */}
                  {onOpenChart && <button className="action-btn" style={{fontSize:11}} onClick={()=>onOpenChart(it)}>📈 チャート</button>}
                </div>
                {enr && <div style={{fontSize:10,color:"var(--inkFaint)",marginTop:4}}>
                  （参考・新規エントリー判断用の指標であり保有判断には使用していません：銘柄分析 {PRIMARY_STATUS_META[enr.status]?.label||enr.status}
                  {enr.actionStatus&&enr.actionStatus!=="NONE"?`・${ACTION_STATUS_META[enr.actionStatus]?.label||enr.actionStatus}`:""}）
                </div>}
                {it.memo && <div style={{fontSize:11,color:"var(--inkFaint)",marginTop:4}}>{it.memo}</div>}
              </div>;
            })}
          </div>}
    </div>
    {entryModalFor && <PositionEntryModal code={entryModalFor.code} name={entryModalFor.name} market={entryModalFor.market}
      needsTradeStyle={false} onClose={()=>setEntryModalFor(null)} onSaved={afterEntrySaved}/>}
    {exitModalFor && <PositionExitModal position={exitModalFor}
      currentPrice={exitPriceOverride??num(stockQuotes?.[exitModalFor.code]?.t)}
      onClose={()=>{setExitModalFor(null);setExitPriceOverride(null);}} onSaved={afterExitSaved}/>}
  </>;
}

// 投資判断ログタブ（2026-09-02新規）：日次の相場観＋銘柄ごとの評価をサーバーDB（Neon）に保存する。
// 「記録」タブでのDB移行が済んでいなくても閲覧・作成はできる（journal/myRulesの移行有無とは
// 独立した機能）が、DB自体（DATABASE_URL）が未設定のサーバーでは保存も一覧取得もできない。
function InvestmentLogPanel({marketEnvAuto,usMarketAuto,interestRateAuto,fxAuto,oilAuto,sectorStrengthAuto,watchTargetItems}){
  const emptyDraft=()=>({date:todayISO(),market_env:marketEnvAuto,us_market:usMarketAuto,interest_rate:interestRateAuto,
    fx:fxAuto,oil:oilAuto,sector_strength:sectorStrengthAuto,chatgpt_view:"",my_view:"",reflection:""});
  const [draft,setDraft]=useState(emptyDraft);
  const [judgments,setJudgments]=useState([]);
  const [saving,setSaving]=useState(false);
  const [msg,setMsg]=useState("");
  const [logs,setLogs]=useState([]);
  const [loading,setLoading]=useState(true);
  const [expanded,setExpanded]=useState(()=>new Set());
  const [filterCode,setFilterCode]=useState("");

  const loadLogs=async(code)=>{
    setLoading(true);
    try{
      const qs=code?("?code="+encodeURIComponent(code)):"";
      const r=await fetch("/api/investment-log"+qs);
      if(r.ok){const d=await r.json();setLogs(Array.isArray(d.logs)?d.logs:[]);}
      else{setLogs([]);}
    }catch(e){setLogs([]);}
    setLoading(false);
  };
  useEffect(()=>{loadLogs(filterCode);},[filterCode]);

  const addJudgmentRow=(code,name)=>{
    if(judgments.some(j=>j.code===code))return;
    setJudgments(js=>[...js,{code:code||"",name:name||"",category:"監視"}]);
  };
  const updateJudgmentRow=(idx,patch)=>setJudgments(js=>js.map((j,i)=>i===idx?{...j,...patch}:j));
  const removeJudgmentRow=(idx)=>setJudgments(js=>js.filter((_,i)=>i!==idx));

  const save=async()=>{
    setSaving(true);setMsg("");
    try{
      const r=await fetch("/api/investment-log/create",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({dailyLog:draft,judgments})});
      if(r.ok){
        const d=await r.json();
        if(d.error){setMsg("保存失敗："+d.error);}
        else{setMsg("保存しました（ID "+d.id+"）");setDraft(emptyDraft());setJudgments([]);loadLogs(filterCode);}
      }else{setMsg("保存に失敗しました。サーバーが起動しているか確認してください。");}
    }catch(e){setMsg("保存に失敗しました。サーバーが起動しているか確認してください。");}
    setSaving(false);
  };

  const deleteLog=async(id)=>{
    if(!confirm("このログを削除しますか？"))return;
    try{
      await fetch("/api/investment-log/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})});
      loadLogs(filterCode);
    }catch(e){}
  };

  const toggleExpand=(id)=>setExpanded(prev=>{const n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n;});
  const fieldStyle={width:"100%",fontSize:12.5,padding:"5px 7px",border:"1px solid var(--rule)",borderRadius:3,background:"var(--bg)",color:"var(--ink)",boxSizing:"border-box"};
  const labelStyle={fontSize:11,color:"var(--inkSoft)",display:"block",marginBottom:2};

  return <div style={{marginTop:18}}>
    <div className="sec-head">投資判断ログ</div>

    <div className="card" style={{padding:"14px 16px",marginBottom:16}}>
      <div style={{fontWeight:700,marginBottom:10}}>新規ログ</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:10,marginBottom:10}}>
        <label><span style={labelStyle}>日付</span><input type="date" value={draft.date} onChange={e=>setDraft({...draft,date:e.target.value})} style={fieldStyle}/></label>
        <label><span style={labelStyle}>金利</span><input value={draft.interest_rate||""} onChange={e=>setDraft({...draft,interest_rate:e.target.value})} style={fieldStyle}/></label>
        <label><span style={labelStyle}>為替</span><input value={draft.fx||""} onChange={e=>setDraft({...draft,fx:e.target.value})} style={fieldStyle}/></label>
        <label><span style={labelStyle}>原油</span><input value={draft.oil||""} onChange={e=>setDraft({...draft,oil:e.target.value})} style={fieldStyle}/></label>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",gap:10,marginBottom:10}}>
        <label><span style={labelStyle}>市場全体の地合い</span><textarea rows={2} value={draft.market_env||""} onChange={e=>setDraft({...draft,market_env:e.target.value})} style={fieldStyle}/></label>
        <label><span style={labelStyle}>米国市場の状況</span><textarea rows={2} value={draft.us_market||""} onChange={e=>setDraft({...draft,us_market:e.target.value})} style={fieldStyle}/></label>
        <label><span style={labelStyle}>セクター強弱</span><textarea rows={2} value={draft.sector_strength||""} onChange={e=>setDraft({...draft,sector_strength:e.target.value})} style={fieldStyle}/></label>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",gap:10,marginBottom:10}}>
        <label><span style={labelStyle}>ChatGPTの判断（全体観）</span><textarea rows={3} value={draft.chatgpt_view||""} onChange={e=>setDraft({...draft,chatgpt_view:e.target.value})} style={fieldStyle}/></label>
        <label><span style={labelStyle}>自分の判断（全体観）</span><textarea rows={3} value={draft.my_view||""} onChange={e=>setDraft({...draft,my_view:e.target.value})} style={fieldStyle}/></label>
        <label><span style={labelStyle}>反省点</span><textarea rows={3} value={draft.reflection||""} onChange={e=>setDraft({...draft,reflection:e.target.value})} style={fieldStyle}/></label>
      </div>

      <div style={{borderTop:"1px solid var(--ruleSoft)",paddingTop:10,marginTop:4}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8,marginBottom:8}}>
          <div style={{fontWeight:700,fontSize:13}}>銘柄評価（{judgments.length}件）</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {watchTargetItems.slice(0,12).map(w=>
              <button key={w.code} className="action-btn" onClick={()=>addJudgmentRow(w.code,w.name)}>＋{w.name}</button>)}
            <button className="action-btn" onClick={()=>setJudgments(js=>[...js,{code:"",name:"",category:"監視"}])}>＋銘柄を手動追加</button>
          </div>
        </div>
        {judgments.length===0 && <div style={{fontSize:12,color:"var(--inkFaint)"}}>上のボタン（監視銘柄）から追加するか、下のコード欄に直接入力してください。</div>}
        {judgments.map((j,idx)=>
          <div key={idx} style={{border:"1px solid var(--rule)",borderRadius:4,padding:"10px 12px",marginBottom:8,background:"var(--band)"}}>
            <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",marginBottom:8}}>
              <input value={j.code} onChange={e=>updateJudgmentRow(idx,{code:e.target.value})} placeholder="コード" style={{...fieldStyle,width:90}}/>
              <input value={j.name} onChange={e=>updateJudgmentRow(idx,{name:e.target.value})} placeholder="銘柄名" style={{...fieldStyle,width:140}}/>
              <select value={j.category} onChange={e=>updateJudgmentRow(idx,{category:e.target.value})} style={{...fieldStyle,width:100}}>
                {JUDGMENT_CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}
              </select>
              <button className="iconbtn" style={{marginLeft:"auto"}} onClick={()=>removeJudgmentRow(idx)}>×</button>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:8}}>
              {JUDGMENT_FIELDS.map(([col,label])=>
                <label key={col}><span style={labelStyle}>{label}</span>
                  <textarea rows={2} value={j[col]||""} onChange={e=>updateJudgmentRow(idx,{[col]:e.target.value})} style={fieldStyle}/>
                </label>)}
            </div>
          </div>)}
      </div>

      <div style={{display:"flex",alignItems:"center",gap:10,marginTop:10}}>
        <button className="btn primary" onClick={save} disabled={saving}>{saving?"保存中…":"ログを保存"}</button>
        {msg && <span style={{fontSize:12,color:"var(--inkSoft)"}}>{msg}</span>}
      </div>
    </div>

    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8,marginBottom:8}}>
      <div style={{fontWeight:700}}>過去のログ</div>
      <input value={filterCode} onChange={e=>setFilterCode(e.target.value)} placeholder="銘柄コードで絞り込み（例：6981）"
        style={{...fieldStyle,width:220}}/>
    </div>
    {loading
      ? <div style={{fontSize:12.5,color:"var(--inkSoft)"}}>読み込み中…</div>
      : logs.length===0
        ? <div style={{padding:22,textAlign:"center",color:"var(--inkSoft)",fontSize:13,border:"1px solid var(--rule)",borderRadius:4,background:"var(--card)"}}>
            まだログがありません（DATABASE_URL未設定の場合はこの機能は使えません）。
          </div>
        : <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {logs.map(log=>{
              const isOpen=expanded.has(log.id);
              return <div key={log.id} className="card" style={{padding:"10px 14px"}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8,cursor:"pointer"}} onClick={()=>toggleExpand(log.id)}>
                  <div><b className="mono">{log.date}</b> <span style={{fontSize:12,color:"var(--inkSoft)"}}>{(log.market_env||"").slice(0,40)}</span></div>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontSize:11,color:"var(--inkFaint)"}}>{(log.judgments||[]).length}銘柄</span>
                    <button className="iconbtn" onClick={e=>{e.stopPropagation();deleteLog(log.id);}}>×</button>
                  </div>
                </div>
                {isOpen && <div style={{marginTop:10,fontSize:12.5,lineHeight:1.7}}>
                  {log.us_market && <div>米国市場：{log.us_market}</div>}
                  {log.interest_rate && <div>金利：{log.interest_rate}</div>}
                  {log.fx && <div>為替：{log.fx}</div>}
                  {log.oil && <div>原油：{log.oil}</div>}
                  {log.sector_strength && <div>セクター強弱：{log.sector_strength}</div>}
                  {log.chatgpt_view && <div>ChatGPTの判断：{log.chatgpt_view}</div>}
                  {log.my_view && <div>自分の判断：{log.my_view}</div>}
                  {log.reflection && <div>反省点：{log.reflection}</div>}
                  {(log.judgments||[]).map(j=>
                    <div key={j.id} style={{marginTop:8,paddingTop:8,borderTop:"1px solid var(--ruleSoft)"}}>
                      <b>{j.name}（{j.code}）</b> <span className="chip" style={{fontSize:10.5}}>{j.category}</span>
                      {JUDGMENT_FIELDS.map(([col,label])=>j[col]?<div key={col} style={{fontSize:11.5,color:"var(--inkSoft)"}}>{label}：{j[col]}</div>:null)}
                    </div>)}
                </div>}
              </div>;
            })}
          </div>}
  </div>;
}

// ChatGPT連携（2026-09-02新規、Phase1）：有料AI APIは使わず、「ChatGPTで相談→JSON出力→
// ここへ手動貼り付け」の半自動フローで投資ログをNeonへ蓄積する。JSONの構造検証はまずここ
// （フロント）で即時に行い、保存はサーバー側（server.py）でも同じ検証をやり直す（二重防御）。
const CHATGPT_ALLOWED_EXECUTION=["BUY","SELL","WAIT","WATCH","NO_TRADE","MISSED","CANCELLED","STOP_LOSS","TAKE_PROFIT"];
// 2026-09-08更新（ChatGPT連携JSONスキーマ統一、指示書7番）：サンプルは共通スキーマ
// （schema_version:"1.0"）に統一。画面ごとに別形式のサンプルは持たせない。
const CHATGPT_SAMPLE_JSON=`{
  "schema_version": "1.0",
  "type": "investment_update",
  "date": "${(()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");})()}",
  "market": { "condition": "bearish", "summary": "全面安",
    "strong_sectors": ["shipping"], "weak_sectors": ["banks","semiconductors"] },
  "watchlist": [ {"code":"9107","name":"川崎汽船","themes":[],"view":"継続監視","reason":"全面安の中で相対的に強い","priority":"medium"} ],
  "decisions": [ {"code":"9107","name":"川崎汽船","action":"NO_TRADE","reason":"地合いが悪いため","risk":"","time_horizon":"short"} ],
  "review": "無理に入らず待った",
  "rule_updates": [ {"rule":"地合いが悪い日は無理に新規INしない","status":"recommended"} ],
  "notes": []
}`;

// 2026-09-08時点：ChatGptImportPanelのparse()はnormalizeChatGPTPayload()（本ファイル後方、
// ChatGptImportPanel直前に定義）が返すerrors/warningsを使うようになったため、この関数は
// 現在どこからも呼ばれていない（削除はせず残置。CHATGPT_ALLOWED_EXECUTIONの厳格チェックを
// 含む旧仕様の参考として、また将来この形の一括検証が必要になった場合のため）。
function validateChatGptPayload(obj){
  const errs=[];
  if(typeof obj!=="object"||obj===null||Array.isArray(obj)){errs.push("JSONのトップレベルはオブジェクトである必要があります");return errs;}
  if(!obj.date||!/^\d{4}-\d{2}-\d{2}$/.test(obj.date))errs.push("date は YYYY-MM-DD 形式の文字列で必須です");
  if(obj.watchlist!=null&&!Array.isArray(obj.watchlist))errs.push("watchlist は配列である必要があります");
  (obj.watchlist||[]).forEach((w,i)=>{ if(!w||!w.code)errs.push(`watchlist[${i}] に code がありません`); });
  if(obj.decisions!=null&&!Array.isArray(obj.decisions))errs.push("decisions は配列である必要があります");
  (obj.decisions||[]).forEach((d,i)=>{
    if(!d||!d.code){errs.push(`decisions[${i}] に code がありません`);return;}
    if(d.execution&&!CHATGPT_ALLOWED_EXECUTION.includes(d.execution))
      errs.push(`decisions[${i}].execution "${d.execution}" は許可された値ではありません（許可: ${CHATGPT_ALLOWED_EXECUTION.join(", ")}）`);
  });
  if(obj.rule_updates!=null&&!Array.isArray(obj.rule_updates))errs.push("rule_updates は配列である必要があります");
  return errs;
}

// v3-9続き（2026-09-07・ChatGPT連携JSON解析改善）：既存のフラット形式
// {date, market:{condition,summary,strong_sectors,weak_sectors}, watchlist, decisions, review,
// rule_updates}に加え、ChatGPTが出力する詳細形式（type:"morning_market_check"、summary/
// market_sentiment/us_market/sox/adr/sector_view/daytrade_watchlist/execution_rules/
// scenario_plan/morning_conclusion等のネスト構造）を検出し、既存のフラット形式へ自動変換する。
// 既存のvalidateChatGptPayload・プレビューUI・save()は一切変更せず、parse()の入口だけで
// 変換を挟むことで「既存のフラットJSON取り込みは壊さない」を担保する。
function detectChatGptFormat(obj){
  if(obj&&typeof obj==="object"&&!Array.isArray(obj)){
    if(obj.type==="morning_market_check")return"detailed";
    if(obj.market&&typeof obj.market==="object")return"flat";
    const detailedKeys=["summary","market_sentiment","us_market","sox","adr","sector_view",
      "daytrade_watchlist","execution_rules","scenario_plan","morning_conclusion"];
    if(detailedKeys.some(k=>obj[k]!=null))return"detailed";
  }
  return"flat";
}
// ネストした値を人間が読める1行/複数行の日本語テキストに変換する（値が無ければ空文字を返す
// だけで、それらしい文言を捏造しない）。
function _cgSummarizeValue(v){
  if(v==null||v==="")return"";
  if(typeof v==="string")return v;
  if(typeof v==="number"||typeof v==="boolean")return String(v);
  if(Array.isArray(v))return v.map(_cgSummarizeValue).filter(Boolean).join("・");
  if(typeof v==="object"){
    return Object.entries(v).map(([k,val])=>{const s=_cgSummarizeValue(val);return s?`${k}: ${s}`:null;})
      .filter(Boolean).join("／");
  }
  return String(v);
}
function _cgBulletize(v){
  if(v==null||v==="")return"";
  if(Array.isArray(v))return v.map(item=>"・"+_cgSummarizeValue(item)).filter(s=>s!=="・").join("\n");
  if(typeof v==="object")return _cgSummarizeValue(v);
  return"・"+String(v);
}
// path（"summary.overall_bias"等）でネストした値を安全に取得する。
function _cgPick(obj,path){
  return path.split(".").reduce((cur,p)=>(cur==null?undefined:cur[p]),obj);
}
function _cgPickFirst(obj,paths){
  for(const p of paths){const v=_cgPick(obj,p);if(v!=null&&v!=="")return v;}
  return undefined;
}
// ChatGPT詳細形式（morning_market_check等）を既存のフラット形式へ変換する。戻り値：
// {converted, missing}。missingは「元のJSONに対応するキーが見つからず空欄になった項目」の
// 一覧（解析失敗時にどのキーが取得できなかったか表示する、というユーザー指示に対応）。
function convertDetailedChatGptPayload(obj){
  const missing=[];

  const overallBias=_cgPickFirst(obj,["summary.overall_bias","summary.bias","market_sentiment.overall_bias"]);
  const marketType=_cgPickFirst(obj,["morning_conclusion.market_type","scenario_plan.market_type"]);
  const condition=[overallBias,marketType].filter(Boolean).join("・");
  if(!condition)missing.push("summary.overall_bias / morning_conclusion.market_type（condition用）");

  const summaryParts=[];
  const keyMessage=_cgPickFirst(obj,["summary.key_message","summary.message","summary.headline"]);
  if(keyMessage)summaryParts.push(_cgSummarizeValue(keyMessage));
  else missing.push("summary.key_message（market_summary用）");
  if(obj.market_sentiment!=null){
    const t=_cgSummarizeValue(obj.market_sentiment);
    if(t)summaryParts.push(`市場心理: ${t}`);
  }else missing.push("market_sentiment（market_summary用）");
  const usPoints=_cgPickFirst(obj,["us_market.key_points","us_market.summary","us_market.interpretation"]);
  if(usPoints)summaryParts.push(`米国株: ${_cgSummarizeValue(usPoints)}`);
  else missing.push("us_market.key_points（market_summary用）");
  const soxInterp=_cgPickFirst(obj,["sox.interpretation","sox.summary"]);
  if(soxInterp)summaryParts.push(`SOX: ${_cgSummarizeValue(soxInterp)}`);
  else missing.push("sox.interpretation（market_summary用）");
  const adrInterp=_cgPickFirst(obj,["adr.interpretation","adr.summary"]);
  if(adrInterp)summaryParts.push(`ADR: ${_cgSummarizeValue(adrInterp)}`);
  else missing.push("adr.interpretation（market_summary用）");
  const marketSummary=summaryParts.join("\n");

  const sectorView=Array.isArray(obj.sector_view)?obj.sector_view:[];
  const strongRatings=["A+","A","B+"];
  const strongSectors=[],weakSectors=[];
  if(sectorView.length){
    sectorView.forEach(sv=>{
      const name=sv&&(sv.sector||sv.name||sv.sector_name);
      if(!name)return;
      const rating=(sv.rating||"").toString().toUpperCase();
      const stance=(sv.stance||"").toString().toLowerCase();
      const isLong=/long/.test(stance);
      const isAvoid=/avoid|low.?priority/.test(stance);
      if(strongRatings.includes(rating)&&(isLong||!stance))strongSectors.push(name);
      else if(isAvoid||/^[c-f]/.test(rating))weakSectors.push(name);
    });
  }else missing.push("sector_view（strong_sectors/weak_sectors用）");

  const reviewParts=[];
  if(obj.execution_rules!=null)reviewParts.push("【執行ルール】\n"+_cgBulletize(obj.execution_rules));
  else missing.push("execution_rules（review用）");
  if(obj.scenario_plan!=null)reviewParts.push("【シナリオ】\n"+_cgBulletize(obj.scenario_plan));
  else missing.push("scenario_plan（review用）");
  const oneLine=_cgPickFirst(obj,["morning_conclusion.one_line","morning_conclusion.summary"]);
  if(oneLine)reviewParts.push("【結論】"+_cgSummarizeValue(oneLine));
  else missing.push("morning_conclusion.one_line（review用）");
  const watchlistTop=Array.isArray(obj.daytrade_watchlist)?obj.daytrade_watchlist.slice(0,5):[];
  if(watchlistTop.length){
    const wlText=watchlistTop.map(w=>[w.code,w.name,w.reason||w.note].filter(Boolean).join(" ")).join("\n");
    reviewParts.push("【デイトレ監視上位】\n"+wlText);
  }else missing.push("daytrade_watchlist（review用）");

  // 2026-09-08追加（「NEONへ保存」失敗の調査）：detailed形式の実サンプルにはtype/summary/
  // market_sentiment等はあってもトップレベルにdateが無いケースがあり得ることが分かった
  // （実際に検証用サンプルで再現）。dateが無いとvalidateChatGptPayloadで弾かれ保存に進めない
  // ため、無ければ「本日」をデフォルト値として補う（既存のフラット形式でdateを明示している
  // 場合はそちらを優先、ここで上書きはしない）。捏造ではなく、日次チェックJSONという性質上
  // 「今日の日付」が最も妥当な既定値という判断。
  if(!obj.date)missing.push("date（未指定のため本日の日付を既定値として使用）");

  return{
    converted:{
      date:obj.date||todayISO(),
      market:{condition,summary:marketSummary,strong_sectors:strongSectors,weak_sectors:weakSectors},
      watchlist:Array.isArray(obj.daytrade_watchlist)
        ?obj.daytrade_watchlist.map(w=>({code:w.code,name:w.name,status:w.status||"WATCH",reason:w.reason||w.note||""})).filter(w=>w.code)
        :[],
      decisions:[],
      review:reviewParts.join("\n\n"),
      rule_updates:[],
    },
    missing,
  };
}

// ============================================================
// 2026-09-08新規（ChatGPT連携JSONスキーマ統一）：全てのChatGPT取込画面（投資判断ログ・
// イベント登録・カタリスト・有識者・ポジション相談等）が共通で使う正規化の単一窓口。
// 「ChatGPTが毎回どの画面用のJSONか意識しなくてよい」を満たすため、以下を標準スキーマとし、
// 旧形式は全てここで自動変換してから既存の各画面の保存処理（save_chatgpt_import・
// import_market_events・import_news_catalysts等）へ渡す（内部DBスキーマ自体は無変更）。
//
// 標準スキーマ：{schema_version:"1.0", type:"investment_update"（用途別に"morning_market_
// check"等も許容、9番）, date, market:{condition,summary,strong_sectors,weak_sectors},
// watchlist[], decisions[], positions[], events[], recent_catalysts[], review,
// rule_updates[], notes[]}
//
// 対応する旧形式（指示書3番の対応表）：
//   - type:"morning_market_check"等のネスト形式 → 既存convertDetailedChatGptPayload()を
//     そのまま再利用（新規ロジックの二重実装を避ける）
//   - 完全フラット形式（date/market/watchlist/decisions/review/rule_updates） → そのまま通す
//   - strong_sectors/weak_sectorsがmarket内でなくルート直下 → market側へ取り込む
//   - symbol/ticker/stock_code（code以外の銘柄コード別名） → codeへ正規化
//   - rule_updatesが文字列配列 → {rule, status:"recommended"}へ変換
//   - rule_updatesがオブジェクト配列でstatus省略 → "recommended"を既定値として補う
//   - reviewが配列 → 改行結合して文字列へ
// ============================================================
const CHATGPT_CODE_ALIASES=["symbol","ticker","stock_code"]; // 優先度順（codeそのものは別途チェック済み）
// 銘柄を扱う配列（watchlist/decisions/positions/recent_catalysts）の1件について、
// code/symbol/ticker/stock_codeのいずれかからcodeを補完する（指示書2番）。補完した場合は
// warningsへ「〇〇[i].symbol を code として自動変換しました」の形で記録する（指示書6番）。
function _cgNormalizeCode(item,label,idx,warnings){
  if(!item||typeof item!=="object")return item;
  if(item.code!=null&&item.code!=="")return{...item,code:String(item.code)};
  for(const alt of CHATGPT_CODE_ALIASES){
    if(item[alt]!=null&&item[alt]!==""){
      warnings.push(`${label}[${idx}].${alt} を code として自動変換しました`);
      return{...item,code:String(item[alt])};
    }
  }
  return item;
}
function _cgNormalizeRuleUpdate(ru,idx,warnings){
  if(typeof ru==="string"){
    warnings.push(`rule_updates[${idx}]（文字列）を {rule, status:"recommended"} 形式へ自動変換しました`);
    return{rule:ru,status:"recommended"};
  }
  if(ru&&typeof ru==="object"&&!Array.isArray(ru)){
    if(!ru.status){
      warnings.push(`rule_updates[${idx}].status が無いため既定値 "recommended" を補いました`);
      return{...ru,status:"recommended"};
    }
    return ru;
  }
  return ru;
}
// 戻り値：{normalized, warnings, errors}。errorsが1件でもあれば保存不可（真に判定不能な場合の
// み＝銘柄コードが1件も見つからない等）。warningsは自動補完・無視した項目の説明で、保存は
// 可能（指示書6番：エラーと警告を分ける）。normalizedは常に上記の標準スキーマ形状で返る。
function normalizeChatGPTPayload(raw){
  const warnings=[],errors=[];
  if(typeof raw!=="object"||raw===null||Array.isArray(raw)){
    errors.push("JSONのトップレベルはオブジェクトである必要があります");
    return{normalized:null,warnings,errors};
  }
  // ネスト形式（morning_market_check等）は既存のconvertDetailedChatGptPayloadでフラット化
  // してから続きの正規化にかける。events/recent_catalysts/positions等の共通スキーマ項目が
  // 元のJSON直下にあれば（ネスト形式と併記されていても）そのまま拾えるよう、変換結果を
  // 元のrawへ上書きマージする（convertedのdate/market/watchlist/decisions/review/
  // rule_updatesを優先）。
  let base=raw;
  if(detectChatGptFormat(raw)==="detailed"){
    const{converted,missing}=convertDetailedChatGptPayload(raw);
    base={...raw,...converted};
    missing.forEach(m=>warnings.push(`（ネスト形式からの変換）${m}が見つからなかったため空欄です`));
  }

  const date=base.date||todayISO();
  if(!base.date)warnings.push("date が無いため本日の日付を既定値として使用しました");

  // 指示書4番：strong_sectors/weak_sectorsはmarket.strong_sectors/weak_sectorsが正式形式だが、
  // ルート直下に来ても取り込む。
  const marketSrc=(base.market&&typeof base.market==="object"&&!Array.isArray(base.market))?base.market:{};
  let strongSectors=marketSrc.strong_sectors,weakSectors=marketSrc.weak_sectors;
  if(!Array.isArray(strongSectors)&&Array.isArray(base.strong_sectors)){
    warnings.push("strong_sectors（ルート直下）を market.strong_sectors として取り込みました");
    strongSectors=base.strong_sectors;
  }
  if(!Array.isArray(weakSectors)&&Array.isArray(base.weak_sectors)){
    warnings.push("weak_sectors（ルート直下）を market.weak_sectors として取り込みました");
    weakSectors=base.weak_sectors;
  }
  const market={
    condition:marketSrc.condition||"",
    summary:marketSrc.summary||"",
    strong_sectors:Array.isArray(strongSectors)?strongSectors:[],
    weak_sectors:Array.isArray(weakSectors)?weakSectors:[],
  };

  const watchlist=(Array.isArray(base.watchlist)?base.watchlist:[]).map((w,i)=>_cgNormalizeCode(w,"watchlist",i,warnings));
  watchlist.forEach((w,i)=>{if(!w||!w.code)errors.push(`watchlist[${i}] に code / symbol / ticker / stock_code のいずれも見つかりませんでした`);});

  // 指示書8番：共通スキーマのdecisions[].action（自由記述、例："HOLD_WITH_CAUTION"）は、
  // 既存の投資判断ログ保存経路（add_stock_judgment）が見ているdecisions[].execution
  // （旧仕様、CHATGPT_ALLOWED_EXECUTIONの厳格な列挙値）とは別名のため、executionが
  // 元々無ければactionをそのままexecutionとしてもコピーする（情報を失わないため。
  // execution_status列はTEXT型でDB側にCHECK制約が無く、自由記述の値もそのまま保存できる。
  // サーバー側validate_chatgpt_payloadの列挙値チェックも2026-09-08に警告扱いへ緩和済み）。
  const decisions=(Array.isArray(base.decisions)?base.decisions:[]).map((d,i)=>{
    const withCode=_cgNormalizeCode(d,"decisions",i,warnings);
    if(withCode&&withCode.action&&!withCode.execution)return{...withCode,execution:withCode.action};
    return withCode;
  });
  decisions.forEach((d,i)=>{if(!d||!d.code)errors.push(`decisions[${i}] に code / symbol / ticker / stock_code のいずれも見つかりませんでした`);});

  const positions=(Array.isArray(base.positions)?base.positions:[]).map((p,i)=>_cgNormalizeCode(p,"positions",i,warnings));
  const recentCatalysts=(Array.isArray(base.recent_catalysts)?base.recent_catalysts:[]).map((c,i)=>_cgNormalizeCode(c,"recent_catalysts",i,warnings));
  const events=Array.isArray(base.events)?base.events:[];
  // 2026-09-09追加（ChatGPT統合連携、指示書3番）：news/expert_opinions/catalysts/
  // user_feedback/position_reviewは任意項目。無くても既存動作に一切影響しない
  // （常に配列/空文字/空オブジェクトへフォールバックするだけ）。catalystsは既存の
  // recent_catalystsキーとも意味が重なるため、catalysts未指定ならrecent_catalystsを
  // そのまま流用する（サーバー側classify_chatgpt_unified_payloadは"catalysts"キーを見る）。
  const news=Array.isArray(base.news)?base.news:[];
  const expertOpinions=Array.isArray(base.expert_opinions)?base.expert_opinions:[];
  const catalysts=Array.isArray(base.catalysts)?base.catalysts:recentCatalysts;
  const userFeedback=typeof base.user_feedback==="string"?base.user_feedback:"";
  const positionReview=(base.position_review&&typeof base.position_review==="object"&&!Array.isArray(base.position_review))?base.position_review:{};
  // 2026-09-09追加（判断エンジン強化、指示書8番）：trade_playbooksも任意項目として通す。
  const tradePlaybooks=Array.isArray(base.trade_playbooks)?base.trade_playbooks:[];

  const reviewRaw=base.review;
  const review=Array.isArray(reviewRaw)?reviewRaw.join("\n"):(reviewRaw||"");

  const ruleUpdates=(Array.isArray(base.rule_updates)?base.rule_updates:[]).map((ru,i)=>_cgNormalizeRuleUpdate(ru,i,warnings));

  const notes=Array.isArray(base.notes)?base.notes:(base.notes?[base.notes]:[]);

  const normalized={
    schema_version:base.schema_version||"1.0",
    // 指示書9番：typeは用途識別用として残すが、基本フィールド構造（このnormalizedの形）は
    // typeによって変えない。
    type:base.type||"investment_update",
    date, market, watchlist, decisions, positions, events,
    recent_catalysts:recentCatalysts, review, rule_updates:ruleUpdates, notes,
    news, expert_opinions:expertOpinions, catalysts, user_feedback:userFeedback, position_review:positionReview,
    trade_playbooks:tradePlaybooks,
  };
  return{normalized,warnings,errors};
}

function ChatGptImportPanel({journal,activeRules}){
  const [rawText,setRawText]=useState("");
  const [parsed,setParsed]=useState(null);
  const [parseErrors,setParseErrors]=useState([]);
  const [saving,setSaving]=useState(false);
  const [saveMsg,setSaveMsg]=useState("");
  const [dupInfo,setDupInfo]=useState(null); // {error} が重複だった場合、再送信（force）を促す
  const [imports,setImports]=useState([]);
  const [loadingImports,setLoadingImports]=useState(true);
  // v3-9続き（ChatGPT連携JSON解析改善）：詳細形式（morning_market_check等）を検出・変換した
  // 場合の付随情報（{missing:[...]}）。フラット形式そのままの場合はnull。
  const [conversionInfo,setConversionInfo]=useState(null);
  // 2026-09-08新規（ChatGPT連携JSONスキーマ統一、指示書6番）：エラー（保存不可）とは別に、
  // 自動補完・自動変換した項目を警告として表示する（symbol→code変換・rule_updates文字列→
  // オブジェクト変換等）。保存自体は可能。
  const [parseWarnings,setParseWarnings]=useState([]);
  // positions/events/recent_catalysts等、共通スキーマの追加項目が含まれていた場合の案内。
  const [extraNote,setExtraNote]=useState("");

  const loadImports=async()=>{
    setLoadingImports(true);
    try{
      const r=await fetch("/api/chatgpt-import/list");
      if(r.ok){const d=await r.json();setImports(Array.isArray(d.imports)?d.imports:[]);}
    }catch(e){}
    setLoadingImports(false);
  };
  useEffect(()=>{loadImports();},[]);

  // ChatGPT連携（Phase6・設計案47番）：大引け振り返り用にコピー。有料AI APIは使わず、
  // 今日のtrade_candidates・journal（本日分）・投資ルールをテキストにまとめてコピーするだけ。
  const [closingMsg,setClosingMsg]=useState("");
  const copyClosingReport=async()=>{
    const today=todayISO();
    const lines=[`【Trade Cockpit 大引け振り返り】${new Date().toLocaleString("ja-JP")}`,""];
    try{
      const r=await fetch("/api/portfolio");
      if(r.ok){const d=await r.json();const ps=d.items||[];
        if(ps.length){lines.push(`■ 保有銘柄（${ps.length}件）`);
          ps.forEach(p=>lines.push(`${p.code} ${p.name||""}${p.quantity!=null?` ${p.quantity}株`:""}${p.average_price!=null?` @${p.average_price}`:""}`));lines.push("");}}
    }catch(e){}
    try{
      const r=await fetch("/api/trade-candidates");
      if(r.ok){
        const d=await r.json();const cs=d.candidates||[];
        if(cs.length){lines.push(`■ 今日の候補（${cs.length}件）`);
          cs.forEach(c=>lines.push(`${c.code} ${c.name}（${c.status}）RS Score${c.rs_score??"—"}`));lines.push("");}
      }
    }catch(e){}
    const todayJournal=(journal||[]).filter(j=>(j.createdAt||"").slice(0,10)===today);
    if(todayJournal.length){
      lines.push(`■ 本日の売買記録（${todayJournal.length}件）`);
      todayJournal.forEach(j=>lines.push(`${j.code} ${j.name}　${j.action}　${j.price}円×${j.shares}株　結果:${j.result}${j.reason?`　理由:${j.reason}`:""}`));
      lines.push("");
    }else{
      lines.push("■ 本日の売買記録：なし（見送り・様子見の日）");lines.push("");
    }
    if(activeRules?.length){lines.push("■ 投資ルール");activeRules.forEach(t=>lines.push(`・${t}`));lines.push("");}
    lines.push("上記の内容を踏まえ、今日の投資判断ログ用JSON（date/market/watchlist/decisions/review/rule_updates）を作成してください。");
    const ok=await copyText(lines.join("\n"));
    setClosingMsg(ok?"コピーしました":"コピーに失敗しました");
    setTimeout(()=>setClosingMsg(""),2500);
  };

  const parse=()=>{
    setSaveMsg("");setDupInfo(null);setConversionInfo(null);setParseWarnings([]);setExtraNote("");
    let obj;
    try{ obj=JSON.parse(rawText); }
    catch(e){ setParsed(null);setParseErrors(["JSONとして正しくありません: "+e.message]);return; }
    // 2026-09-08更新（ChatGPT連携JSONスキーマ統一）：全画面共通のnormalizeChatGPTPayload()を
    // 必ず最初に通す。旧来の詳細形式検出・変換（convertDetailedChatGptPayload）はこの関数の
    // 内部で再利用しているだけで、二重実装はしていない（既存のフラットJSON取り込み経路も
    // このnormalizeを通るだけで動作は変わらない＝後方互換）。
    const{normalized,warnings,errors}=normalizeChatGPTPayload(obj);
    const nestedNotes=warnings.filter(w=>w.startsWith("（ネスト形式からの変換）"));
    if(nestedNotes.length)setConversionInfo({missing:nestedNotes.map(w=>w.replace("（ネスト形式からの変換）",""))});
    setParseWarnings(warnings);
    setParseErrors(errors);
    setParsed(errors.length===0?normalized:null);
    if(errors.length===0&&normalized){
      const notes=[];
      if((normalized.positions||[]).length)
        notes.push(`ℹ️ ポジション情報${normalized.positions.length}件が含まれていますが、実際の保有株の変更は安全のため自動反映しません。「ポジション」タブから内容をご確認のうえ手動で登録してください。`);
      if((normalized.events||[]).length)
        notes.push(`ℹ️ イベント情報${normalized.events.length}件は、保存時に「イベント登録」へも自動で取り込みます。`);
      if((normalized.catalysts||[]).length)
        notes.push(`ℹ️ 材料情報${normalized.catalysts.length}件は、保存時に「カタリスト」へも自動で取り込みます。`);
      if((normalized.news||[]).length)
        notes.push(`ℹ️ ニュース情報${normalized.news.length}件は、保存時にカタリストとして自動で取り込みます。`);
      if((normalized.expert_opinions||[]).length)
        notes.push(`ℹ️ 有識者見解${normalized.expert_opinions.length}件は、保存時に「有識者」へも自動で取り込みます。`);
      if(normalized.user_feedback)
        notes.push(`ℹ️ 感想（user_feedback）が含まれています。保存時に「今日の振り返り」へ反映します。`);
      setExtraNote(notes.join("\n"));
    }
  };

  const updateMarket=(field,value)=>setParsed(p=>({...p,market:{...(p.market||{}),[field]:value}}));
  const updateSectorList=(field,text)=>updateMarket(field,text.split(",").map(s=>s.trim()).filter(Boolean));
  const updateWatchItem=(idx,field,value)=>setParsed(p=>({...p,watchlist:(p.watchlist||[]).map((w,i)=>i===idx?{...w,[field]:value}:w)}));
  const removeWatchItem=(idx)=>setParsed(p=>({...p,watchlist:(p.watchlist||[]).filter((_,i)=>i!==idx)}));
  const updateDecisionItem=(idx,field,value)=>setParsed(p=>({...p,decisions:(p.decisions||[]).map((d,i)=>i===idx?{...d,[field]:value}:d)}));
  const removeDecisionItem=(idx)=>setParsed(p=>({...p,decisions:(p.decisions||[]).filter((_,i)=>i!==idx)}));
  const updateRuleUpdate=(idx,value)=>setParsed(p=>({...p,rule_updates:(p.rule_updates||[]).map((r,i)=>i===idx?value:r)}));
  const removeRuleUpdate=(idx)=>setParsed(p=>({...p,rule_updates:(p.rule_updates||[]).filter((_,i)=>i!==idx)}));

  // 2026-09-08更新（「NEONへ保存」失敗調査）：以前はどんな失敗でも一律「サーバーが起動して
  // いるか確認してください」としか表示せず、実際のHTTPステータス・サーバー側のエラー内容が
  // 分からなかった。res.ok・実際のbody文字列（fetchJsonSafeと同じ考え方）・サーバー側で
  // 新設したfatalErrorキー（想定外の例外）を見て、可能な限り具体的な原因を表示し、
  // console.errorにも詳細を出すようにした。
  const save=async(force)=>{
    setSaving(true);setSaveMsg("");setDupInfo(null);
    let res,text;
    try{
      res=await fetch("/api/chatgpt-import/save",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({payload:parsed,force:!!force})});
    }catch(e){
      console.error("[ChatGPT保存] fetch自体が失敗:",e);
      setSaveMsg(`保存に失敗しました（通信エラー）：${e.message}\n・server.pyが起動しているか\n・Wi-Fi/Tailscale等の接続状況\nをご確認ください。`);
      setSaving(false);return;
    }
    try{text=await res.text();}catch(e){text="";}
    console.log(`[ChatGPT保存] HTTP ${res.status} ${res.statusText}`,text);
    if(!res.ok){
      setSaveMsg(`保存に失敗しました（HTTP ${res.status}）。${text?`応答: ${text.slice(0,300)}`:"応答本文が空でした。"}`);
      setSaving(false);return;
    }
    let d;
    try{d=JSON.parse(text);}catch(e){
      console.error("[ChatGPT保存] レスポンスがJSONではありません:",text);
      setSaveMsg(`保存に失敗しました。サーバーの応答がJSON形式ではありません（詳細はブラウザのコンソールをご確認ください）。`);
      setSaving(false);return;
    }
    if(d.fatalError){
      console.error("[ChatGPT保存] サーバー側で例外:",d.fatalError);
      setSaveMsg(`保存に失敗しました（サーバーエラー）：${d.fatalError}`);
    }else if(d.errors){setSaveMsg("保存失敗：\n・"+d.errors.join("\n・"));}
    else if(d.error){setDupInfo(d);}
    else{
      // 2026-09-09更新（ChatGPT統合連携、指示書1・2番）：events/news/catalysts/
      // expert_opinions/user_feedbackの振り分けはサーバー側save_chatgpt_unified_import()が
      // 一括で行うようになったため、フロント側から個別API（/api/market-events/import等）を
      // 二重に叩く旧実装は削除した。ここではd.unified（各バケットのimport結果）を読んで
      // メッセージを組み立てるだけ（保存処理自体の二重実装を避ける）。
      const extraMsgs=[];
      const u=d.unified||{};
      if(u.events)extraMsgs.push(`イベント：新規${u.events.imported||0}件・更新${u.events.updated||0}件`);
      if(u.news)extraMsgs.push(`ニュース：新規${u.news.imported||0}件`);
      if(u.catalysts)extraMsgs.push(`カタリスト：新規${u.catalysts.imported||0}件`);
      if(u.expert_opinions)extraMsgs.push(`有識者見解：新規${u.expert_opinions.imported||0}件`);
      if(u.trade_playbooks)extraMsgs.push(`プレイブック：新規${u.trade_playbooks.imported||0}件・既存${u.trade_playbooks.matched||0}件`);
      if(u.user_feedback?.saved)extraMsgs.push(`今日の振り返りに感想を反映しました（${u.user_feedback.date}）`);
      // 2026-09-09新規（ルール学習システム、指示書18番）：「本日のルール更新」を保存結果に
      // 追加表示する。d.ruleSyncはsave_chatgpt_import()側でsync_rule_updates_to_trade_rules()
      // の戻り値がそのまま入っている（新規に集計し直さない）。
      if(d.ruleSync&&((d.ruleSync.newRules||0)+(d.ruleSync.existingSupported||0))>0){
        const rs=d.ruleSync;
        extraMsgs.push(`本日のルール更新：新規${rs.newRules}件・既存ルール支持${rs.existingSupported}件・信頼度上昇${rs.confidenceUp}件・ステータス変化${rs.statusUp}件（詳細は「記録」→「ルール」タブで確認できます）`);
      }
      setSaveMsg(`保存しました（daily_log ID ${d.dailyLogId}・銘柄評価 ${d.judgments}件・追加ルール ${d.rulesAdded}件）`
        +(extraMsgs.length?`\n${extraMsgs.join("\n")}`:""));
      setRawText("");setParsed(null);setParseErrors([]);setConversionInfo(null);setParseWarnings([]);setExtraNote("");loadImports();
    }
    setSaving(false);
  };

  const fieldStyle={width:"100%",fontSize:12.5,padding:"5px 7px",border:"1px solid var(--rule)",borderRadius:3,background:"var(--bg)",color:"var(--ink)",boxSizing:"border-box"};
  const labelStyle={fontSize:11,color:"var(--inkSoft)",display:"block",marginBottom:2};

  return <div style={{marginTop:18}}>
    {/* 2026-09-09更新（指示書1・2・29番）：「投資ログ取り込み」から「ChatGPT統合連携」へ
        役割を拡張。ChatGPTから受け取った市場情報・銘柄・ニュース・イベント・有識者見解・
        投資判断・ルールを自動分類して取り込む唯一の入口という位置づけを明示する。 */}
    <div className="sec-head">ChatGPT / Claude / AI分析を貼り付け</div>
    <div className="sec-note" style={{marginTop:2}}>JSON・自然文・箇条書き・分析文をそのまま貼り付け可能です。市場情報、銘柄、ニュース、イベント、有識者見解、投資判断、ルールを自動分類して取り込みます。</div>

    <div style={{marginTop:10,display:"flex",alignItems:"center",gap:8}}>
      <button className="action-btn" onClick={copyClosingReport}>📋 ChatGPT大引け振り返り用にコピー</button>
      {closingMsg && <span style={{fontSize:11,color:"var(--inkSoft)"}}>{closingMsg}</span>}
    </div>

    {/* 2026-09-10新規（Unified Smart Import、Phase SI-B、指示書1・12番）：ChatGPT統合連携を
        Smart Importへ統合。「文章・自然文・箇条書き・分析文をそのまま貼る」場合はこちらを
        使う（MARKET_ANALYSIS/MORNING_MARKET_CHECK/INTRADAY_REPORT/TRADE_RULE/CATALYST/
        EVENT/EXPERT_OPINION/旧ChatGPT JSON形式まで自動判別）。既存の「詳細形式JSON」欄
        （厳密なフラットschema向け、下記）はそのまま残す（指示書1・12番：既存JSONサンプル
        入力欄も残してよい）。 */}
    <SmartImportPanel onReload={loadImports}/>

    <div style={{marginTop:24,paddingTop:16,borderTop:"1px solid var(--rule)"}}>
      <div className="sec-head" style={{fontSize:13}}>詳細形式JSON（従来方式・厳密なschema向け）</div>
      <div style={{marginTop:10}}>
        <label style={labelStyle}>ChatGPTが出力したJSON
          <button className="action-btn" style={{marginLeft:8,fontSize:11}} onClick={()=>setRawText(CHATGPT_SAMPLE_JSON)}>サンプルを入力</button>
        </label>
        <textarea value={rawText} onChange={e=>setRawText(e.target.value)} rows={10} placeholder='{"date":"2026-09-02", ...}'
          style={{...fieldStyle,fontFamily:"monospace",fontSize:12}}/>
        <button className="action-btn" style={{marginTop:8}} onClick={parse} disabled={!rawText.trim()}>解析</button>
      </div>
    </div>

    {parseErrors.length>0 && <div className="card" style={{marginTop:12,padding:"10px 14px",border:"1px solid var(--down)"}}>
      <b style={{color:"var(--down)"}}>ERROR：このままでは保存できません：</b>
      <ul style={{margin:"6px 0 0",paddingLeft:18,fontSize:12.5,color:"var(--down)"}}>
        {parseErrors.map((e,i)=><li key={i}>{e}</li>)}
      </ul>
    </div>}
    {/* 2026-09-08新規（ChatGPT連携JSONスキーマ統一、指示書6番）：エラー（保存不可）とは別に、
        自動補完・自動変換した項目を警告として表示する。保存自体は可能。 */}
    {parseErrors.length===0&&parseWarnings.length>0 && <div className="card" style={{marginTop:12,padding:"10px 14px",border:"1px solid var(--accent)"}}>
      <b style={{color:"var(--accent)"}}>WARNING：一部項目を自動補完・変換しました（保存は可能です）：</b>
      <ul style={{margin:"6px 0 0",paddingLeft:18,fontSize:12.5,color:"var(--inkSoft)"}}>
        {parseWarnings.map((w,i)=><li key={i}>{w}</li>)}
      </ul>
    </div>}
    {/* 2026-09-09新規（ChatGPT統合連携、指示書5番）：分類結果のプレビュー。市場情報1件・
        監視銘柄N件・判断N件・ルールN件・ニュースN件・イベントN件・有識者見解N件、のように
        保存先ごとの件数を一覧表示する。0件の項目は省略（表示過多を避ける）。 */}
    {parsed && <div className="card" style={{marginTop:12,padding:"10px 14px",border:"1px solid var(--rule)"}}>
      <b style={{fontSize:12.5}}>今回のJSONから分類：</b>
      <div style={{display:"flex",flexWrap:"wrap",gap:6,marginTop:6}}>
        {[["市場情報",parsed.market?.condition||parsed.market?.summary?1:0],
          ["監視銘柄",(parsed.watchlist||[]).length],["判断",(parsed.decisions||[]).length],
          ["ルール",(parsed.rule_updates||[]).length],["ニュース",(parsed.news||[]).length],
