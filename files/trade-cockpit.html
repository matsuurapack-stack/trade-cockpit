function IntradayTimelineSection({notifyDesktop}){
  const [reports,setReports]=useState([]);
  const [loading,setLoading]=useState(true);
  const [generatingType,setGeneratingType]=useState(null);
  const [selected,setSelected]=useState(null);
  const settings=MorningCheckSettings();
  const lastSeenIdsRef=useRef({});
  const firstLoadRef=useRef(true);
  const [toast,setToast]=useState(null);

  const load=async(announce)=>{
    const d=await fetchJsonSafe("/api/market-intelligence");
    const list=(d&&d.reports)||[];
    if(announce){
      for(const rt of INTRADAY_REPORT_ORDER){
        const rep=list.find(r=>r.report_type===rt);
        if(!rep)continue;
        const prevId=lastSeenIdsRef.current[rt];
        if(prevId!=null&&rep.id!==prevId){
          const major=(rep.strategy_update_json?.major_changes||[]);
          const urgent=major.length>0||(rep.risk_alerts_json||[]).some(w=>w.level==="CRITICAL");
          if(settings.soundOn)playMorningCheckChime(urgent);
          if(settings.popupOn){
            setToast({urgent,title:`${urgent?"⚠ ":"🔔 "}${INTRADAY_REPORT_META[rt].jp}が完成しました`,
              body:major.length?major.join("・"):(rep.market_summary||"").slice(0,60)});
            setTimeout(()=>setToast(null),urgent?12000:8000);
          }
          notifyDesktop?.(`${INTRADAY_REPORT_META[rt].jp}が完成しました`,(rep.market_summary||"").slice(0,80));
        }
      }
    }
    INTRADAY_REPORT_ORDER.forEach(rt=>{const rep=list.find(r=>r.report_type===rt);if(rep)lastSeenIdsRef.current[rt]=rep.id;});
    setReports(list);setLoading(false);
    if(firstLoadRef.current){
      firstLoadRef.current=false;
      const latest=[...INTRADAY_REPORT_ORDER].reverse().find(rt=>list.some(r=>r.report_type===rt));
      if(latest)setSelected(latest);
    }
  };
  useEffect(()=>{load(false);
    const id=setInterval(()=>load(true),60*1000);
    return ()=>clearInterval(id);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[]);

  const generate=async(reportType)=>{
    setGeneratingType(reportType);
    const d=await fetchJsonSafe("/api/market-intelligence/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({reportType})});
    setGeneratingType(null);
    if(d&&d.report){setSelected(reportType);load(false);}
  };

  if(loading)return null;
  const selectedReport=selected?reports.find(r=>r.report_type===selected):null;

  return <div style={{marginTop:18}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
      <div className="sec-head">📡 Market Intelligence Timeline</div>
      <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
        {INTRADAY_REPORT_ORDER.map(rt=>
          <button key={rt} className="iconbtn" style={{fontSize:11}} disabled={generatingType===rt}
            onClick={()=>generate(rt)}>{generatingType===rt?"分析中…":`今すぐ分析（${INTRADAY_REPORT_META[rt].time}）`}</button>)}
      </div>
    </div>

    {/* タイムライン（指示書7番）：08:50→09:30→11:30→13:00→15:30。クリックで詳細を切り替え */}
    <div style={{display:"flex",gap:6,marginTop:10,flexWrap:"wrap",fontSize:11}}>
      <div style={{padding:"4px 9px",borderRadius:4,border:"1px solid var(--rule)",background:"var(--upBg)",color:"var(--up)"}}>08:50 MORNING ✅</div>
      {INTRADAY_REPORT_ORDER.map(rt=>{
        const rep=reports.find(r=>r.report_type===rt);
        const done=!!rep;
        return <div key={rt} onClick={()=>done&&setSelected(rt)} style={{padding:"4px 9px",borderRadius:4,
          border:selected===rt?"2px solid var(--accent)":"1px solid var(--rule)",cursor:done?"pointer":"default",
          background:done?"var(--upBg)":"transparent",color:done?"var(--up)":"var(--inkFaint)"}}>
          {INTRADAY_REPORT_META[rt].time} {INTRADAY_REPORT_META[rt].label} {done?"✅":"⏳"}
        </div>;})}
    </div>

    {!selectedReport
      ? <div style={{padding:20,textAlign:"center",color:"var(--inkSoft)",fontSize:12.5,border:"1px solid var(--rule)",borderRadius:4,marginTop:10}}>
          本日の場中レポートはまだありません。「今すぐ分析」を押すか、各時間帯（09:30/11:30/13:00/15:30）の自動生成をお待ちください。
        </div>
      : <IntradayReportCard report={selectedReport} reportType={selected} isClose={selected==="MARKET_CLOSE"}/>}

    {toast && <div style={{position:"fixed",right:16,bottom:16,zIndex:9999,maxWidth:320,
        background:"var(--card)",border:`2px solid ${toast.urgent?"var(--down)":"var(--accent)"}`,borderRadius:8,
        padding:"10px 12px",boxShadow:"0 4px 16px rgba(0,0,0,0.25)",cursor:"pointer"}}
      onClick={()=>{setToast(null);}}>
      <div style={{fontWeight:800,fontSize:12.5,color:toast.urgent?"var(--down)":"var(--accent)"}}>{toast.title}</div>
      {toast.body && <div style={{fontSize:11.5,marginTop:4,color:"var(--inkSoft)"}}>{toast.body}</div>}
      <div style={{fontSize:10.5,color:"var(--inkFaint)",marginTop:4}}>クリックで閉じる</div>
    </div>}
  </div>;
}

// テーマ・セクター強弱の可視化：SectorWatchlist内のsectorGroups集計（平均騰落率・合計売買代金）と
// 同じ考え方を、JP+US統合した銘柄リストに対して汎用的に適用する。keyFnがnull/""を返す銘柄は
// 対象外にする（テーマ未設定銘柄をテーマ別ランキングから除外するため）。
const groupStocks=(items,stockQuotes,keyFn)=>{
  const pctOf=(code)=>{const qt=stockQuotes[code]||{};const t=num(qt.t),p=num(qt.p);
    return (t!=null&&p!=null&&p)?(t-p)/p*100:null;};
  const turnoverOf=(code)=>{const v=num(stockQuotes[code]?.turnover);return v!=null&&v>0?v:null;};
  const map={};
  items.forEach(w=>{const key=keyFn(w);if(!key)return;(map[key]=map[key]||[]).push(w);});
  return Object.entries(map).map(([key,members])=>{
    const pcts=members.map(w=>pctOf(w.code)).filter(v=>v!=null);
    const avgPct=pcts.length?pcts.reduce((a,b)=>a+b,0)/pcts.length:null;
    const totalTurnover=members.reduce((sum,w)=>sum+(turnoverOf(w.code)||0),0);
    // 代表銘柄：グループ内で騰落率の絶対値が最大の銘柄（値動きが最も大きい＝今日そのグループを牽引している銘柄）
    let leader=null,leaderAbsPct=-1;
    members.forEach(w=>{const p=pctOf(w.code);if(p!=null&&Math.abs(p)>leaderAbsPct){leaderAbsPct=Math.abs(p);leader={name:w.name,pct:p};}});
    return {key,avgPct,totalTurnover,count:members.length,leader};
  }).sort((a,b)=>(b.totalTurnover-a.totalTurnover));
};

// v3-4（市場タブ再設計）：「今日の日本株環境」バナー。米国市場・金利・為替・原油は独立した
// 投資対象としてではなく、あくまで「日本株を判断するための外部環境」として最上部にまとめて
// 表示する（数値自体は既存metrics＝30秒おきに自動更新済みのものをそのまま使い、追加リクエストは
// 発生しない）。地合い（強気/中立/弱気）は日経225先物・NASDAQ・SOXの当日騰落率の平均から簡易
// 判定する（サーバー側の重いMarket Risk Score/_market_environment()とは別物・軽量計算のみ）。
const ENV_ROWS=[["日経先物","nikkei_fut",0],["ドル円","usdjpy",2],["米10年金利","us10y",2],["WTI原油","wti",2],["NASDAQ","nasdaq",0],["SOX","sox",0]];
function arrowOf(pct){if(pct==null)return "→";return pct>=0.05?"↑":pct<=-0.05?"↓":"→";}
function MarketEnvironmentBanner({metrics,watchlistAll,stockQuotes,top5}){
  const pctOfMetric=(key)=>{const m=metrics?.[key];if(!m)return null;const t=num(m.t),p=num(m.p);
    return (t!=null&&p!=null&&p)?(t-p)/p*100:null;};
  const sentiment=useMemo(()=>{
    const vals=[pctOfMetric("nikkei_fut")??pctOfMetric("nikkei"),pctOfMetric("nasdaq"),pctOfMetric("sox")].filter(v=>v!=null);
    if(!vals.length)return null;
    const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
    if(avg>=0.3)return "強気";
    if(avg<=-0.3)return "弱気";
    return "中立";
  },[metrics]);
  const sentimentColor=sentiment==="強気"?"var(--up)":sentiment==="弱気"?"var(--down)":"var(--inkSoft)";

  // セクター強弱：既存groupStocks()（登録銘柄の当日騰落率平均・売買代金順）を強い/中立/弱いの
  // 3段階に区分するだけ（新規計算なし）。±1%を目安の閾値とする。
  const sectorGroups=useMemo(()=>groupStocks(watchlistAll||[],stockQuotes,w=>w.sector).filter(g=>g.avgPct!=null),[watchlistAll,stockQuotes]);
  const strongSectors=useMemo(()=>[...sectorGroups].filter(g=>g.avgPct>=1).sort((a,b)=>b.avgPct-a.avgPct).slice(0,5),[sectorGroups]);
  const weakSectors=useMemo(()=>[...sectorGroups].filter(g=>g.avgPct<=-1).sort((a,b)=>a.avgPct-b.avgPct).slice(0,5),[sectorGroups]);
  const neutralSectors=useMemo(()=>[...sectorGroups].filter(g=>g.avgPct>-1&&g.avgPct<1).sort((a,b)=>b.totalTurnover-a.totalTurnover).slice(0,5),[sectorGroups]);

  // v3-4（ChatGPT連携の再配置）：「朝一分析」。この画面に表示している値（地合い・指数・
  // セクター強弱）そのものと、監視銘柄TOP5（App側でcomputeEnrichedWatch/rankTop5により算出済み、
  // 監視銘柄タブと同一ロジック）をJSONにまとめてコピーする。新規のサーバー計算・追加リクエストなし。
  const [morningMsg,setMorningMsg]=useState("");
  const copyMorningAnalysis=async()=>{
    // 2026-09-09新規（ルール学習システム、指示書12番）：朝一分析はmarket全体を見る画面のため、
    // market/semiconductor/sectorカテゴリのACTIVE/TESTINGルールを添える（全ルールは送らない）。
    const activeRulesForMorning=await fetchJsonSafe("/api/trade-rules/relevant?categories=market,semiconductor,sector,event")
      .then(d=>(d&&d.rules)||[]).catch(()=>[]);
    // 2026-09-09新規（統合インテリジェンス機能、指示書25・26番）：直近の振り返り（昨日までの
    // 反省点）を添える。全履歴ではなく直近3日分だけ（指示書27番：古い情報を無制限に混ぜない）。
    const recentReflections=await fetchJsonSafe("/api/daily-review/recent?days=3")
      .then(d=>(d&&d.reflections)||[]).catch(()=>[]);
    // 2026-09-09新規（判断エンジン全画面統合、指示書3番）：朝一では個別銘柄よりmarket全体
    // （macro expert views・直近の重要イベント・行動警告）を優先する。stock_codeを渡さない
    // build_relevant_trading_contextを呼び、「今日やってはいけないこと」を行動警告＋
    // riskカテゴリのACTIVEルールから自動生成する。
    const morningKnowledge=await fetchJsonSafe("/api/knowledge-context",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({market:"JP",ruleCategories:["market","risk","semiconductor","sector","event"]})}).catch(()=>null);
    const avoidToday=[];
    if(morningKnowledge&&!morningKnowledge.error){
      (morningKnowledge.context.behavioral_warnings||[]).forEach(w=>avoidToday.push(w.message));
      (morningKnowledge.context.relevant_rules||[]).filter(r=>r.category==="risk"&&r.status==="ACTIVE").slice(0,2)
        .forEach(r=>avoidToday.push(`ACTIVEルール『${r.rule_text}』に注意`));
      if((morningKnowledge.context.event_signals||[]).includes("EVENT_RISK_HIGH"))avoidToday.push("重要イベント直前のため新規は慎重に");
    }
    await copyChatGPTPayload("朝一分析","morning_market",{
      sentiment,
      indices:Object.fromEntries(ENV_ROWS.map(([label,key,dp])=>{
        const m=metrics?.[key]||{};const t=num(m.t);const pct=pctOfMetric(key);
        return [key,{label,value:t,pct_change:pct}];
      })),
      sectors:{
        strong:strongSectors.map(g=>({sector:g.key,avg_pct:g.avgPct})),
        neutral:neutralSectors.map(g=>({sector:g.key,avg_pct:g.avgPct})),
        weak:weakSectors.map(g=>({sector:g.key,avg_pct:g.avgPct})),
      },
      watchlist_top5:(top5||[]).map(w=>({
        code:w.code,name:w.name,current:num(stockQuotes[w.code]?.t),
        pct_change:w.pct,rs_score:w.rsScore,status:w.status,
        grade:lightweightGrade(w),action:lightweightAction(w),reason:lightweightReason(w),
      })),
      active_rules:activeRulesForMorning.map(r=>({rule:r.rule_text,confidence:r.confidence,action:r.action_text||null})),
      recent_reflections:recentReflections.map(r=>({date:r.date,score:r.score,notes:(r.tomorrowNotes.length?r.tomorrowNotes:r.improvementPoints).slice(0,3)})),
      expert_views:(morningKnowledge&&!morningKnowledge.error?morningKnowledge.context.expert_views:[]).map(e=>({expert_name:e.expert_name,outlook:e.outlook,status:e.status})),
      upcoming_events:(morningKnowledge&&!morningKnowledge.error?morningKnowledge.context.upcoming_events:[]).slice(0,5).map(e=>({title:e.title||e.event,business_days_until:e.business_days_until,importance:e.importance})),
      today_avoid:avoidToday,
    },setMorningMsg);
  };

  return <div className="card" style={{padding:"12px 16px",marginBottom:14}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8,marginBottom:8}}>
      <div style={{fontWeight:800,fontSize:14}}>今日の日本株環境</div>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        {morningMsg && <span style={{fontSize:11,color:"var(--inkSoft)"}}>{morningMsg}</span>}
        <button className="action-btn" onClick={copyMorningAnalysis}>🤖 朝一分析</button>
      </div>
    </div>
    <div style={{display:"flex",alignItems:"baseline",gap:8,marginBottom:10}}>
      <span style={{fontSize:12,color:"var(--inkSoft)"}}>今日の地合い：</span>
      <span style={{fontWeight:800,fontSize:18,color:sentimentColor}}
        title="日経先物・NASDAQ・SOXの当日騰落率の平均から簡易判定／米国市場は日本株判断のための外部環境として扱います">{sentiment||"—"}</span>
    </div>
    <div style={{display:"flex",flexWrap:"wrap",gap:16,marginBottom:12}}>
      {ENV_ROWS.map(([label,key,dp])=>{
        const m=metrics?.[key]||{};const t=num(m.t);const pct=pctOfMetric(key);
        return <div key={key} style={{fontSize:12.5}}>
          <span style={{color:"var(--inkSoft)"}}>{label}：</span>
          <span className="mono" style={{fontWeight:700,color:pct==null?"var(--inkSoft)":pct>0?"var(--up)":pct<0?"var(--down)":"var(--inkSoft)"}}>{arrowOf(pct)}</span>{" "}
          <span className="mono">{t!=null?t.toFixed(dp):"—"}</span>{" "}
          {pct!=null && <span className="mono" style={{fontSize:11,color:pct>0?"var(--up)":pct<0?"var(--down)":"var(--inkSoft)"}}>({pct>0?"+":""}{pct.toFixed(2)}%)</span>}
        </div>;})}
    </div>
    <div style={{display:"flex",flexWrap:"wrap",gap:20}}>
      <div style={{fontSize:12}}>
        <span style={{color:"var(--inkSoft)"}}>強い：</span>
        {strongSectors.length
          ? strongSectors.map(g=><span key={g.key} className="chip" style={{fontSize:10.5,marginRight:4}}>{g.key} {g.avgPct>0?"+":""}{g.avgPct.toFixed(1)}%</span>)
          : <span style={{color:"var(--inkFaint)"}}>該当なし</span>}
      </div>
      <div style={{fontSize:12}}>
        <span style={{color:"var(--inkSoft)"}}>中立：</span>
        {neutralSectors.length
          ? neutralSectors.map(g=><span key={g.key} className="chip" style={{fontSize:10.5,marginRight:4}}>{g.key} {g.avgPct>0?"+":""}{g.avgPct.toFixed(1)}%</span>)
          : <span style={{color:"var(--inkFaint)"}}>該当なし</span>}
      </div>
      <div style={{fontSize:12}}>
        <span style={{color:"var(--inkSoft)"}}>弱い：</span>
        {weakSectors.length
          ? weakSectors.map(g=><span key={g.key} className="chip" style={{fontSize:10.5,marginRight:4}}>{g.key} {g.avgPct>0?"+":""}{g.avgPct.toFixed(1)}%</span>)
          : <span style={{color:"var(--inkFaint)"}}>該当なし</span>}
      </div>
    </div>
  </div>;
}

// TODAY'S MARKET（Trade Cockpit v2 Phase3・設計案27・68・69番）。日次モニターの最上部に置き、
// 「今日の地合い→強い/弱いセクター→RS上位銘柄数」を1画面で把握できるようにする。Market Risk Score
// はサーバー側_market_environment()（25日線トレンド判定）が必要なため/api/market-riskを叩くが、
// 重い処理（3か月分の日足取得×4指数）のため1日1回だけ自動取得し、以降は手動更新ボタンに委ねる
// （breakoutLevelsと同じキャッシュパターン）。日経/NASDAQ/SOX/US10Yの数値自体は既存のmetrics
// （30秒おきに自動更新済み）をそのまま使うため追加リクエストは発生しない。
function TodaysMarketCard({metrics,watchlistAll,stockQuotes,marketRisk,onRefresh,refreshing,activeRules,importantNews,sectorRegimes,morningSectorRegime,onRefreshSectorRegime,sectorRegimeFetching}){
  const pctOfMetric=(key)=>{const m=metrics[key];if(!m)return null;const t=num(m.t),p=num(m.p);
    return (t!=null&&p!=null&&p)?(t-p)/p*100:null;};
  const marketPct=pctOfMetric("nikkei");

  const sectorGroups=useMemo(()=>groupStocks(watchlistAll||[],stockQuotes,w=>w.sector),[watchlistAll,stockQuotes]);
  const strongSectors=useMemo(()=>[...sectorGroups].filter(g=>g.avgPct!=null).sort((a,b)=>b.avgPct-a.avgPct).slice(0,3),[sectorGroups]);
  const weakSectors=useMemo(()=>[...sectorGroups].filter(g=>g.avgPct!=null).sort((a,b)=>a.avgPct-b.avgPct).slice(0,3),[sectorGroups]);
  const sectorAvgMap=useMemo(()=>Object.fromEntries(sectorGroups.map(g=>[g.key,g.avgPct])),[sectorGroups]);

  const rsStrongList=useMemo(()=>{
    if(marketPct==null)return [];
    const out=[];
    (watchlistAll||[]).forEach(w=>{
      const qt=stockQuotes[w.code]||{};const t=num(qt.t),p=num(qt.p);
      const pct=(t!=null&&p!=null&&p)?(t-p)/p*100:null;
      const {rsScore}=calcRsScore(pct,marketPct,sectorAvgMap[w.sector]);
      if(rsScore!=null&&rsScore>=75)out.push({code:w.code,name:w.name,rsScore,pct});
    });
    return out.sort((a,b)=>b.rsScore-a.rsScore);
  },[watchlistAll,stockQuotes,marketPct,sectorAvgMap]);
  const rsStrongCount=rsStrongList.length;

  const riskMeta=marketRisk?.marketRiskLabel;
  const riskColor=riskMeta==="RISK OFF"?"var(--down)":riskMeta==="HIGH RISK"?"var(--accent)":riskMeta==="LOW RISK"?"var(--up)":"var(--inkSoft)";
  const quickIdx=[["日経","nikkei",0],["NASDAQ","nasdaq",0],["SOX","sox",0],["US10Y","us10y",2]];

  // ChatGPT連携（Phase6・設計案46番）：朝一チェック用にコピー。有料AI APIは使わず、テキストを
  // 生成してクリップボードにコピーするだけ（貼り付け先はChatGPT側で人間が操作）。
  const [copyMsg,setCopyMsg]=useState("");
  const copyMorningReport=async()=>{
    const lines=[`【Trade Cockpit 朝一チェック】${new Date().toLocaleString("ja-JP")}`,""];
    lines.push(`■ Market Risk: ${marketRisk?.marketRiskLabel||"—"}（${marketRisk?.marketRiskScore??"—"}/100）`);
    if(marketRisk?.text)lines.push(marketRisk.text);
    lines.push("");
    lines.push("■ 指数");
    quickIdx.forEach(([label,key,dp])=>{
      const m=metrics[key]||{};const t=num(m.t);const pct=pctOfMetric(key);
      lines.push(`${label}: ${t!=null?t.toFixed(dp):"—"}${pct!=null?`（${pct>0?"+":""}${pct.toFixed(2)}%）`:""}`);
    });
    lines.push("");
    if(strongSectors.length){lines.push("■ 強いセクター");strongSectors.forEach(g=>lines.push(`${g.key} ${g.avgPct>0?"+":""}${g.avgPct.toFixed(1)}%`));lines.push("");}
    if(weakSectors.length){lines.push("■ 弱いセクター");weakSectors.forEach(g=>lines.push(`${g.key} ${g.avgPct>0?"+":""}${g.avgPct.toFixed(1)}%`));lines.push("");}
    if(rsStrongList.length){lines.push(`■ Relative Strength銘柄（${rsStrongList.length}件）`);
      rsStrongList.slice(0,10).forEach(x=>lines.push(`${x.code} ${x.name} RS Score${x.rsScore} (${x.pct>0?"+":""}${x.pct.toFixed(2)}%)`));lines.push("");}
    try{
      const r=await fetch("/api/portfolio");
      if(r.ok){const d=await r.json();const ps=d.items||[];
        if(ps.length){lines.push(`■ 保有銘柄（${ps.length}件）`);
          ps.forEach(p=>lines.push(`${p.code} ${p.name||""}${p.quantity!=null?` ${p.quantity}株`:""}${p.average_price!=null?` @${p.average_price}`:""}`));lines.push("");}}
    }catch(e){}
    try{
      const r=await fetch("/api/trade-candidates");
      if(r.ok){const d=await r.json();const cs=d.candidates||[];
        if(cs.length){lines.push(`■ 今日の候補（${cs.length}件）`);
          cs.forEach(c=>lines.push(`${c.code} ${c.name}（${c.status}）`));lines.push("");}}
    }catch(e){}
    if(activeRules?.length){lines.push("■ 投資ルール");activeRules.forEach(t=>lines.push(`・${t}`));lines.push("");}
    if(importantNews?.length){lines.push(`■ 重要ニュース（${importantNews.length}件）`);
      importantNews.slice(0,8).forEach(n=>lines.push(`・${n.title}`));lines.push("");}
    lines.push("上記を踏まえて、今日の注目セクター・銘柄について相談したいです。");
    const ok=await copyText(lines.join("\n"));
    setCopyMsg(ok?"コピーしました":"コピーに失敗しました");
    setTimeout(()=>setCopyMsg(""),2500);
  };

  return <div className="card" style={{padding:"12px 16px",marginBottom:16}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
      <div style={{fontWeight:800,fontSize:14}}>TODAY'S MARKET</div>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        {copyMsg && <span style={{fontSize:11,color:"var(--inkSoft)"}}>{copyMsg}</span>}
        <button className="action-btn" onClick={copyMorningReport}>🌅 ChatGPT朝一チェック用にコピー</button>
        <button className="action-btn" onClick={onRefresh} disabled={refreshing}>{refreshing?"更新中…":"更新"}</button>
      </div>
    </div>
    {marketRisk==null
      ? <div style={{fontSize:12,color:"var(--inkFaint)",marginTop:6}}>{refreshing?"取得中…":"未取得（「更新」で取得できます）"}</div>
      : <>
        <div style={{display:"flex",alignItems:"baseline",gap:10,marginTop:8}}>
          <span style={{fontWeight:800,fontSize:20,color:riskColor}}>{marketRisk.marketRiskLabel||"—"}</span>
          {marketRisk.marketRiskScore!=null && <span className="mono" style={{fontSize:16,color:"var(--inkSoft)"}}>{marketRisk.marketRiskScore} / 100</span>}
        </div>
        {marketRisk.text && <div style={{fontSize:11.5,color:"var(--inkSoft)",marginTop:4}}>{marketRisk.text}</div>}
        <div style={{display:"flex",gap:14,flexWrap:"wrap",marginTop:10}}>
          {quickIdx.map(([label,key,dp])=>{
            const m=metrics[key]||{};const t=num(m.t);const pct=pctOfMetric(key);
            return <div key={key} style={{fontSize:12}}>
              <span style={{color:"var(--inkSoft)"}}>{label}</span>{" "}
              <span className="mono" style={{fontWeight:700}}>{t!=null?t.toFixed(dp):"—"}</span>{" "}
              {pct!=null && <span className="mono" style={{color:pct>0?"var(--up)":pct<0?"var(--down)":"var(--inkSoft)"}}>{pct>0?"+":""}{pct.toFixed(2)}%</span>}
            </div>;})}
        </div>
        {/* 2026-09-08新規（後場レビューJSON対応：SECTOR_REGIME・MORNING_TO_AFTERNOON_REGIME_CHANGE）。
            対象はSECTOR_PROXY_METRICS（現状は半導体ETF200Aのみ）。RISK_ON/MIXED/RISK_OFFの
            現在値と、当日最初に取得できた「朝のシナリオ」からの変化を表示する。Primary/Action
            Statusには一切干渉しない参考情報。 */}
        {Object.entries(sectorRegimes||{}).map(([key,r])=>{
          const metaLabel=METRICS.find(m=>m.key===key)?.label||key;
          const regimeMeta={RISK_ON:{icon:"🟢",color:"var(--up)"},MIXED:{icon:"🟡",color:"var(--accent)"},RISK_OFF:{icon:"🔴",color:"var(--down)"}}[r.regime]||{icon:"⚪",color:"var(--inkSoft)"};
          const morning=morningSectorRegime?.regimes?.[key];
          const regimeChanged=morning&&morning.regime!==r.regime;
          const worsened=regimeChanged&&(
            (morning.regime==="RISK_ON"&&(r.regime==="MIXED"||r.regime==="RISK_OFF"))||
            (morning.regime==="MIXED"&&r.regime==="RISK_OFF"));
          return <div key={key} style={{marginTop:8,fontSize:12}}>
            <span style={{color:"var(--inkSoft)"}}>{metaLabel} セクターレジーム：</span>{" "}
            <span style={{fontWeight:700,color:regimeMeta.color}} title={`現在値${r.current}／VWAP${r.vwap}（${r.aboveVwap?"VWAP上":"VWAP下"}）`}>{regimeMeta.icon} {r.regime}</span>
            {worsened && <span style={{marginLeft:8,fontWeight:700,color:"var(--down)"}}>
              ⚠️ 朝のシナリオが無効化されました（朝：{morning.regime}→現在：{r.regime}）
            </span>}
          </div>;
        })}
        <div style={{display:"flex",gap:24,flexWrap:"wrap",marginTop:10}}>
          {strongSectors.length>0 && <div style={{fontSize:12}}>
            <span style={{color:"var(--inkSoft)"}}>強いセクター：</span>
            {strongSectors.map(g=><span key={g.key} className="chip" style={{fontSize:10.5,marginRight:4}}>{g.key} {g.avgPct>0?"+":""}{g.avgPct.toFixed(1)}%</span>)}
          </div>}
          {weakSectors.length>0 && <div style={{fontSize:12}}>
            <span style={{color:"var(--inkSoft)"}}>弱いセクター：</span>
            {weakSectors.map(g=><span key={g.key} className="chip" style={{fontSize:10.5,marginRight:4}}>{g.key} {g.avgPct>0?"+":""}{g.avgPct.toFixed(1)}%</span>)}
          </div>}
          {rsStrongCount!=null && <div style={{fontSize:12}}>
            <span style={{color:"var(--inkSoft)"}}>Relative Strength銘柄：</span>
            <span style={{fontWeight:700}}>{rsStrongCount}</span></div>}
        </div>
      </>}
  </div>;
}

// 日次モニター先頭に表示するランキングパネル。「市場→テーマ→セクター→銘柄」の確認順序を
// タブを跨がずに把握できるようにする（4〜6章対応）。テーマは登録銘柄にユーザーが手動で
// 付けたタグのみを対象にするため、1件も設定されていなければテーマ欄は非表示にする。
// v3-5（日次モニター整理）：「セクター別」「テーマ別」の2本立てをやめ、セクター別1本に絞って
// コンパクトな表形式にする。合計売買代金だけで「強い」と誤解しないよう、騰落率とMarket RS
// （対日経平均）を併記する（大型株の多いセクターが売買代金だけでは上位に出やすいため）。
// テーマ別ランキングは要望により日次モニターから非表示にするが、算出ロジック自体
// （groupStocksでのtheme集計）・watchlist側のthemeフィールド・「＋テーマ」登録UIは
// 削除していない。将来テーマ分析を再開する場合は、下のthemeRanking行のコメントを外して
// RankList相当の表示を復活させればよい。
function ThemeSectorRanking({watchlistAll,stockQuotes,metrics}){
  const marketPct=useMemo(()=>{
    const m=metrics?.nikkei;if(!m)return null;
    const t=num(m.t),p=num(m.p);return (t!=null&&p!=null&&p)?(t-p)/p*100:null;
  },[metrics]);
  const sectorRanking=useMemo(()=>groupStocks(watchlistAll,stockQuotes,w=>w.sector).slice(0,5),[watchlistAll,stockQuotes]);
  // 非表示（削除ではない）：const themeRanking=useMemo(()=>groupStocks(watchlistAll,stockQuotes,w=>(w.theme||"").trim()).slice(0,5),[watchlistAll,stockQuotes]);

  const fmtOku=(v)=>v==null||v<=0?"—":v>=1e8?(v/1e8).toFixed(1)+"億":(v/1e4).toFixed(0)+"万";

  return <div style={{marginBottom:18}}>
    <div className="sec-head">本日の注目セクター</div>
    {sectorRanking.length===0
      ? <div style={{fontSize:12,color:"var(--inkSoft)",marginTop:8}}>登録銘柄がありません。「日本市場」「アメリカ市場」タブで銘柄を登録してください。</div>
      : <div style={{overflowX:"auto",marginTop:8}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:12.5}}>
            <thead><tr>
              <th style={{textAlign:"left",padding:"4px 8px",color:"var(--inkSoft)",fontWeight:600,borderBottom:"1px solid var(--rule)"}}>Rank</th>
              <th style={{textAlign:"left",padding:"4px 8px",color:"var(--inkSoft)",fontWeight:600,borderBottom:"1px solid var(--rule)"}}>Sector</th>
              <th style={{textAlign:"right",padding:"4px 8px",color:"var(--inkSoft)",fontWeight:600,borderBottom:"1px solid var(--rule)"}}>騰落率</th>
              <th style={{textAlign:"right",padding:"4px 8px",color:"var(--inkSoft)",fontWeight:600,borderBottom:"1px solid var(--rule)"}} title="対日経平均（pt）">Market RS</th>
              <th style={{textAlign:"right",padding:"4px 8px",color:"var(--inkSoft)",fontWeight:600,borderBottom:"1px solid var(--rule)"}}>売買代金</th>
              <th style={{textAlign:"left",padding:"4px 8px",color:"var(--inkSoft)",fontWeight:600,borderBottom:"1px solid var(--rule)"}}>代表銘柄</th>
            </tr></thead>
            <tbody>
              {sectorRanking.map((r,i)=>{
                const rs=(r.avgPct!=null&&marketPct!=null)?r.avgPct-marketPct:null;
                const pctColor=r.avgPct==null?"var(--inkFaint)":r.avgPct>0?"var(--up)":r.avgPct<0?"var(--down)":"var(--inkSoft)";
                const rsColor=rs==null?"var(--inkFaint)":rs>0?"var(--up)":rs<0?"var(--down)":"var(--inkSoft)";
                return <tr key={r.key}>
                  <td className="mono" style={{padding:"6px 8px",color:"var(--inkSoft)",borderBottom:"1px solid var(--ruleSoft)"}}>{i+1}</td>
                  <td style={{padding:"6px 8px",fontWeight:700,borderBottom:"1px solid var(--ruleSoft)"}}>{r.key}
                    <span style={{fontSize:10.5,color:"var(--inkFaint)",fontWeight:400}}>（{r.count}銘柄）</span></td>
                  <td className="mono" style={{padding:"6px 8px",textAlign:"right",fontWeight:700,color:pctColor,borderBottom:"1px solid var(--ruleSoft)"}}>
                    {r.avgPct!=null?(r.avgPct>0?"+":"")+r.avgPct.toFixed(2)+"%":"—"}</td>
                  <td className="mono" style={{padding:"6px 8px",textAlign:"right",color:rsColor,borderBottom:"1px solid var(--ruleSoft)"}}>
                    {rs!=null?(rs>0?"+":"")+rs.toFixed(1):"—"}</td>
                  <td className="mono" style={{padding:"6px 8px",textAlign:"right",color:"var(--inkSoft)",borderBottom:"1px solid var(--ruleSoft)"}}>{fmtOku(r.totalTurnover)}</td>
                  <td style={{padding:"6px 8px",whiteSpace:"nowrap",fontSize:11.5,color:"var(--inkSoft)",borderBottom:"1px solid var(--ruleSoft)"}}>
                    {r.leader
                      ? <>{r.leader.name} <span className="mono" style={{color:changeColor(r.leader.pct).fg,fontWeight:700}}>{r.leader.pct>0?"+":""}{r.leader.pct.toFixed(1)}%</span></>
                      : "—"}
                  </td>
                </tr>;})}
            </tbody>
          </table>
        </div>}
  </div>;
}

  const newsFetchingRef=useRef(false);

    try{

      if(nru.ok){const ndu=await nru.json();
        setS(p=>({...p,
          usStockNewsList:Array.isArray(ndu.stockNews)?ndu.stockNews:p.usStockNewsList,
          usStockNameNewsList:Array.isArray(ndu.stockNameNews)?ndu.stockNameNews:p.usStockNameNewsList,

  const [newsFetching,setNewsFetching]=useState(false);
  const [newsMsg,setNewsMsg]=useState("");

  // 日次モニター（指数・為替等）＋日本市場（登録銘柄の現在値）を30秒おきに自動更新する。
  // 2026-08-24 判明：Render無料プラン（メモリ512MB上限）で「Ran out of memory」により
  // サーバーが繰り返しクラッシュする不具合が発生。登録銘柄278社分の株価取得（立花証券APIを
  // 分割して複数回叩く重い処理）が30秒おきに走る一方、取得に30秒以上かかることがあり、
  // 前回の取得が終わる前に次の取得が二重・三重に走ってメモリを食い潰していたのが主因と判明。
  // 実行中フラグで多重起動を防ぐ（ローカル/LANでも無駄なリクエスト重複を避けられるため常時有効）。
  const monitorFetchingRef=useRef(false);
  const fetchMonitorAndJP=async()=>{
    if(monitorFetchingRef.current)return;

    try{

              t:(v.t!=null?String(v.t):nm[k].t),
              p:(v.p!=null?String(v.p):nm[k].p),
              spark:(Array.isArray(v.spark)?v.spark:nm[k].spark)};}
          });
          return {...p,metrics:nm,metricsFetchedAt:new Date().toISOString()};});

      const srJP=await fetch("/api/stock-quotes",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(sRef.current.watchlist)});
      if(srJP.ok){
        const sdJP=await srJP.json();
        const stampedAt=new Date().toISOString();
        const stamped=Object.fromEntries(Object.entries(sdJP.quotes||{}).map(([k,v])=>[k,{...v,quoteFetchedAt:stampedAt}]));
        setS(p=>({...p,stockQuotes:{...p.stockQuotes,...stamped}}));
        setJpMsg(nowHHMM()+" 自動更新");
      }
    }catch(e){}
    setMonitorFetching(false);setJpFetching(false);
    monitorFetchingRef.current=false;

  // アメリカ市場（登録銘柄の現在値）は朝6時（日本時間・端末時刻基準）に1日1回だけ自動更新する。
  const fetchUS=async()=>{
    setUsFetching(true);

      const srUS=await fetch("/api/stock-quotes",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(sRef.current.watchlistUS)});
      if(srUS.ok){
        const sdUS=await srUS.json();

  // 出来高ブレイクアウト（直近3か月高値を5日平均出来高の1.5倍以上で上抜け。2026-08-21：参照期間を

  // 基準値自体は日中変わらないため1日1回だけ取得し、現在値との比較は下のuseMemoで毎回軽く行う

  const fetchBreakoutLevels=async(watchlistSubset)=>{

  },[]);

  // 2026-09-08新規（後場レビューJSON対応：SECTOR_REGIME・MORNING_TO_AFTERNOON_REGIME_CHANGE）。
  // SECTOR_PROXY_METRICS（現状は半導体ETF200Aのみ、server.py参照）のRISK_ON/MIXED/RISK_OFFを

  const [sectorRegimes,setSectorRegimes]=useState({});

  useEffect(()=>{

  // 2026-09-08新規（トレード分析画面のリアルタイム性改善）：画面最上部の日付欄(s.date)は

  // 異なっていれば黙って今日の日付へ補正する（「翌朝へ」のような明示確認は不要＝表示の補正のみで

  useEffect(()=>{
    if(s.date!==todayISO())setS(p=>({...p,date:todayISO()}));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[]);

  // ニュース優先順位付け（Trade Cockpit v2 Phase4・設計案30-33番）：保有＞今日の候補＞監視銘柄＞
  // テーマ一致＞その他 の順で関連度の高いニュースを上に出す。「今日の候補」だけはNeon保存のため
  // 起動時に1回取得する（他の3つはすでにローカルstateにある）。
  const [candidateCodes,setCandidateCodes]=useState(new Set());
  useEffect(()=>{
    fetch("/api/trade-candidates").then(r=>r.ok?r.json():null).then(d=>{
      if(d&&Array.isArray(d.candidates))setCandidateCodes(new Set(d.candidates.map(c=>c.code)));
    }).catch(()=>{});
  },[]);
  const newsPriorityRank=(code)=>{
    if(!code)return 5;
    const heldCodes=new Set(s.journal.filter(j=>j.result==="未定").map(j=>j.code));
    if(heldCodes.has(code))return 0;
    if(candidateCodes.has(code))return 1;
    if(s.watchTargets.includes(code))return 2;
    if(watchlistAll.some(w=>w.code===code&&w.theme))return 3;
    // 2026-09-08新規（ニュース優先順位改善）：保有／候補／監視／テーマのいずれにも該当しなくても、
    // 登録銘柄一覧（日本市場・アメリカ市場タブ）にコードが載っていれば、無関係な市況一般
    // ニュース（コード無し＝5）より上位に表示する（指示書registered_stock_priority対応）。
    if(watchlistAll.some(w=>w.code===code))return 4;
    return 5;
  };

  useEffect(()=>{
    fetchNewsOnly();

    return ()=>clearInterval(id);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[]);

  useEffect(()=>{
    // 今日まだ一度も取得していなければ（アプリを開いた直後に空欄のままにしないよう）即時取得。
    if(s.usQuotesFetchedDate!==todayISO())fetchUS();

    const next=new Date(now.getFullYear(),now.getMonth(),now.getDate(),6,0,0,0);
    if(now>=next)next.setDate(next.getDate()+1);
    const timeoutId=setTimeout(()=>{

    return ()=>{clearTimeout(timeoutId);if(intervalId)clearInterval(intervalId);};
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[]);

  const set=(patch)=>setS(p=>({...p,...patch}));
  const setMetric=(k,f,v)=>setS(p=>({...p,metrics:{...p.metrics,[k]:{...p.metrics[k],[f]:v}}}));
  // v3-2（watchlistのNeon化）：SectorWatchlist・WatchlistImportPanel等は従来通り「新しい配列
  // 全体」をsetWatchlistJP/USへ渡す設計のままにし（呼び出し側は無改修）、ここで旧配列との差分
  // （追加・変更・削除）を検出してNeonへ書き込む。localStorage（s.watchlist）はUI表示用の
  // キャッシュとして引き続き使うが、正データはNeon。
  const syncWatchlistToNeon=(prevList,nextList,market)=>{
    if(!s.watchlistMigrated)return; // watchlistの一括移行が済むまでは個別同期もしない（移行前にNeonへ半端な状態を書き込まないため）
    const prevByCode=new Map(prevList.map(w=>[w.code,w]));
    const nextByCode=new Map(nextList.map(w=>[w.code,w]));
    nextList.forEach(w=>{
      const prev=prevByCode.get(w.code);
      if(!prev||JSON.stringify(prev)!==JSON.stringify(w)){
        fetch("/api/watchlist/save",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({...w,market})}).catch(()=>{});
      }
    });
    prevList.forEach(w=>{
      if(!nextByCode.has(w.code)){
        fetch("/api/watchlist/delete",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({code:w.code,market})}).catch(()=>{});
      }
    });
  };
  const setWatchlistJP=(wl)=>{syncWatchlistToNeon(sRef.current.watchlist,wl,"JP");set({watchlist:wl});};
  const setWatchlistUS=(wl)=>{syncWatchlistToNeon(sRef.current.watchlistUS,wl,"US");set({watchlistUS:wl});};
  // 2026-09-08新規（ポジション登録機能の改善・指示書4番）：ポジション画面の「監視銘柄にも
  // 追加する」チェックボックスから呼ばれる。既存のsetWatchlistJP/US（Neon同期込み）をそのまま

  // 追加できたら"ok"を返す（呼び出し元でメッセージ出し分けに使う）。
  const addToWatchlistDirect=({code,name,market,sector})=>{
    if(market==="US"){
      if(s.watchlistUS.some(w=>w.code===code))return "already";
      if(s.watchlistUS.length>=MAX_US)return "max";
      setWatchlistUS([...s.watchlistUS,{id:code,code,name:name||code,sector:sector||SECTOR_INDEX,market:"US",tvSymbol:code,watch:"通常",note:"",theme:""}]);
      return "ok";
    }
    if(s.watchlist.some(w=>w.code===code))return "already";
    if(s.watchlist.length>=MAX)return "max";
    setWatchlistJP([...s.watchlist,{id:code,code,name:name||code,sector:sector||SECTOR_CHOICES[0],market:"JP",tvSymbol:"TSE:"+code,watch:"通常",note:"",theme:""}]);
    return "ok";
  };
  // 2026-08-22 ユーザー要望：「日本市場」タブの検索候補を、日経225中心の手動キュレーション
  // リスト（MASTER、約277社）だけでなく東証上場銘柄全体（約4400社）に広げる。立花証券APIの
  // 株式銘柄マスタをサーバー側でキャッシュ済みの/api/jp-issue-masterから1回だけ取得し、
  // MASTERに無いコードだけ追加する（MASTERにある分は読み仮名等を手動で整えてあるためそちらを優先）。
  const [jpIssueMaster,setJpIssueMaster]=useState(null);
  useEffect(()=>{
    fetch("/api/jp-issue-master").then(r=>r.ok?r.json():null).then(d=>{if(d)setJpIssueMaster(d.items||{});}).catch(()=>{});
  },[]);
  const masterJP=useMemo(()=>{
    const curated=MASTER.filter(m=>m.market==="JP"||m.market==="IDX");
    if(!jpIssueMaster)return curated;
    const known=new Set(curated.map(m=>m.code));
    const extra=Object.entries(jpIssueMaster)
      .filter(([code])=>!known.has(code))
      .map(([code,v])=>({code,name:v.name,sector:v.sector,kana:v.kana,market:"JP",tvSymbol:"TSE:"+code}));
    return [...curated,...extra];
  },[jpIssueMaster]);
  // v3-9続き（PHASE 3 EVENT/EARNINGS INTELLIGENCE）：market_events（経済指標・決算・中銀会合等）。
  // ページ表示時に1回だけ取得する（jpIssueMasterと同じパターン）。EventsPanel（イベントタブ）
  // でimport後は明示的にリロードする。
  const [marketEvents,setMarketEvents]=useState([]);
  const loadMarketEvents=()=>{
    fetch("/api/market-events").then(r=>r.ok?r.json():null).then(d=>{if(d)setMarketEvents(d.events||[]);}).catch(()=>{});
  };
  useEffect(()=>{loadMarketEvents();},[]);
  // v3-9続き（PHASE 4 NEWS/CATALYST INTELLIGENCE）：news_catalysts。marketEventsと同じパターン
  // （ページ表示時に1回だけ取得、CatalystsPanelでimport後は明示的にリロード）。
  const [newsCatalysts,setNewsCatalysts]=useState([]);
  const loadNewsCatalysts=()=>{
    fetch("/api/news-catalysts").then(r=>r.ok?r.json():null).then(d=>{if(d)setNewsCatalysts(d.catalysts||[]);}).catch(()=>{});
  };
  useEffect(()=>{loadNewsCatalysts();},[]);
  // v3-9続き（PHASE 5 EXPERT INTELLIGENCE）：expert_views。marketEvents/newsCatalystsと同じ
  // パターン（ページ表示時に1回だけ取得、ExpertViewsPanelでimport後は明示的にリロード）。
  const [expertViews,setExpertViews]=useState([]);
  const loadExpertViews=()=>{
    fetch("/api/expert-views").then(r=>r.ok?r.json():null).then(d=>{if(d)setExpertViews(d.views||[]);}).catch(()=>{});
  };
  useEffect(()=>{loadExpertViews();},[]);
  // v3-9続き（2026-09-05・EVENT DASHBOARD）：EventDashboardPanelの「保有銘柄関連」表示に使う
  // 保有中コードの軽量な一覧（PortfolioPanel本体とは別に、App直下でも参照できるようにする）。
  // PortfolioPanelの完全なフィールドは不要なため、この専用の軽いfetchのみ追加する。
  const [heldItems,setHeldItems]=useState([]);
  const loadHeldItems=()=>{
    fetch("/api/portfolio").then(r=>r.ok?r.json():null).then(d=>{if(d)setHeldItems((d.items||[]).filter(it=>it.active!==false));}).catch(()=>{});
  };
  useEffect(()=>{loadHeldItems();},[]);
  const masterUS=useMemo(()=>MASTER.filter(m=>m.market==="US"),[]);

  // 12章：分析タブの対象銘柄（日本市場・アメリカ市場どちらの登録銘柄からも追加され得る）
  const allWatch=useMemo(()=>[...s.watchlist,...s.watchlistUS],[s.watchlist,s.watchlistUS]);
  const analysisItems=useMemo(()=>s.analysisTargets.map(code=>allWatch.find(w=>w.code===code)).filter(Boolean),[s.analysisTargets,allWatch]);
  // v3-6 Step1（銘柄分析画面のStatus統合）：監視銘柄タブと全く同じcomputeEnrichedWatch()を
  // 分析対象銘柄にも適用し、Primary Status／Action Statusを二重ロジックにせず共有する
  // （「一覧ではHOT+WAIT、分析画面では別判定」という矛盾を防ぐ）。code→enrichWatchRow結果のMap。
  const analysisEnrichedMap=useMemo(()=>{
    const enriched=computeEnrichedWatch(analysisItems,s.stockQuotes,s.metrics,watchlistAll,s.breakoutLevels,s.analysisData,s.marketRisk?.marketRiskLabel);
    return new Map(enriched.map(e=>[e.code,e]));
  },[analysisItems,s.stockQuotes,s.metrics,watchlistAll,s.breakoutLevels,s.analysisData,s.marketRisk]);
  // v3-6 Step2（銘柄分析画面にセクター情報を追加）：既存groupStocks()（セクター別平均騰落率・
  // 合計売買代金、日次モニターの「本日の注目セクター」等で既に使っている共通関数）をそのまま
  // 再利用し、セクター別の当日騰落率で順位付けする（新規計算・新規リクエストなし）。
  // sector→{avgPct,rank,totalCount,totalTurnover,count}のMap。
  const sectorRankMap=useMemo(()=>{
    const groups=groupStocks(watchlistAll||[],s.stockQuotes,w=>w.sector).filter(g=>g.avgPct!=null);
    const ranked=[...groups].sort((a,b)=>b.avgPct-a.avgPct);
    const total=ranked.length;
    return new Map(ranked.map((g,i)=>[g.key,{avgPct:g.avgPct,rank:i+1,total,count:g.count,totalTurnover:g.totalTurnover}]));
  },[watchlistAll,s.stockQuotes]);
  // 2026-08-21 ユーザー要望：監視銘柄は日本市場に限定（アメリカ市場タブの「監視銘柄」ボタンは
  // 撤去済みだが、念のためここでも日本株以外は除外しておく）。
  const watchTargetItems=useMemo(()=>s.watchTargets.map(code=>allWatch.find(w=>w.code===code)).filter(Boolean).filter(w=>w.market==="JP"),[s.watchTargets,allWatch]);
  // v3-4（ChatGPT連携の再配置）：市場タブ「朝一分析」に監視銘柄TOP5を含めるため、監視銘柄タブと
  // 同じcomputeEnrichedWatch/rankTop5（共通ヘルパー）でApp側でも同じTOP5を算出しておく。
  const todayTop5=useMemo(()=>{
    const enriched=computeEnrichedWatch(watchTargetItems,s.stockQuotes,s.metrics,watchlistAll,s.breakoutLevels,s.analysisData,s.marketRisk?.marketRiskLabel);
    return rankTop5(enriched,s.stockQuotes);
  },[watchTargetItems,s.stockQuotes,s.metrics,watchlistAll,s.breakoutLevels,s.analysisData,s.marketRisk]);
  // 投資判断ログの「新規ログ」下書きに自動で入れる値。金利・為替・原油は日次モニターの直近取得値
  // （s.metrics）、市場全体の地合い・米国市場は直近の銘柄分析結果（analyze_stock共通の_market_environment）
  // から、セクター強弱はgroupStocks()の売買代金上位から組み立てる。いずれも編集可能な「下書き」であり、
  // ユーザーが保存前に自由に書き換えられる（2026-09-02新規）。
  const marketEnvAuto=useMemo(()=>Object.values(s.analysisData)[0]?.marketEnv||"",[s.analysisData]);
  const usMarketAuto=useMemo(()=>{const m=marketEnvAuto.split("／");return m.length>1?m.slice(1).join("／"):"";},[marketEnvAuto]);
  const interestRateAuto=useMemo(()=>s.metrics?.us10y?.t?`米10年債利回り ${s.metrics.us10y.t}%`:"",[s.metrics]);
  const fxAuto=useMemo(()=>s.metrics?.usdjpy?.t?`ドル円 ${s.metrics.usdjpy.t}円`:"",[s.metrics]);
  const oilAuto=useMemo(()=>s.metrics?.wti?.t?`WTI原油 ${s.metrics.wti.t}ドル`:"",[s.metrics]);
  const sectorStrengthAuto=useMemo(()=>{
    const top=groupStocks(watchlistAll,s.stockQuotes,w=>w.sector).slice(0,3);
    return top.map(g=>`${g.key}${g.avgPct!=null?(g.avgPct>0?"+":"")+g.avgPct.toFixed(2)+"%":""}`).join("、");
  },[watchlistAll,s.stockQuotes]);
  const [analyzing,setAnalyzing]=useState(false);
  // 2026-09-08更新（トレード分析画面のリアルタイム性改善）：fetchAnalysisForは元々「取得開始時に
  // 対象銘柄のanalysisDataを即削除してから取り直す」設計だった。この方式では再取得中カードが
  // 一瞬「データを取得できませんでした」に見えてしまい、かつ取得失敗時に「直前まで見えていた値が
  // 実は古い参考値だった」ことが伝わらない。前回の結果は_refreshing/_refreshFailedフラグを立てて
  // 残したまま「更新中…」「最新データ取得失敗（表示は前回取得時点の参考値）」と明示できるようにした
  // （古い値を最新値であるかのように見せない、という要件を「消す」のではなく「正直にラベル付けする」
  // 形で満たす）。quoteOverrides・marketFetchedAtIsoはrefreshAnalysisContextから渡され、
  // 分析リクエスト直前に取り直した現在値・市場指標の取得時刻をそのまま分析結果に刻印する。
  const fetchAnalysisFor=async(items,opts)=>{
    if(!items||!items.length)return;
    const {quoteOverrides,marketFetchedAtIso}=opts||{};
    setAnalyzing(true);
    setS(p=>{const ad={...p.analysisData};
      items.forEach(w=>{if(ad[w.code])ad[w.code]={...ad[w.code],_refreshing:true,_refreshFailed:false};});
      return {...p,analysisData:ad};});
    const markDone=(failedCodes)=>{
      if(!failedCodes.size)return;
      setS(p=>{const ad={...p.analysisData};
        failedCodes.forEach(code=>{if(ad[code])ad[code]={...ad[code],_refreshing:false,_refreshFailed:true};});
        return {...p,analysisData:ad};});
    };
    try{
      // 登録銘柄テーブルの現在値（30秒おきの自動更新で取得済み、または直前にrefreshAnalysisContextが
      // 取り直した値＝quoteOverrides）をcurrentとして同封する。分析APIは内部でyfinanceに別途
      // 問い合わせるため、これを渡さないと分析結果側の単価がテーブルの最新値とズレることがある。
      // v3-7（押し目エントリー価格帯の見直し）：Primary/Action Status（enrichWatchRow、既に
      // analysisEnrichedMapとして算出済み）も同封する。サーバー側で同じ判定を再実装しない
      // （二重ロジックを避ける）ため、フロントの判定結果をそのまま渡すだけ。
      const withCurrent=items.map(w=>{
        const enr=analysisEnrichedMap.get(w.code);
        const ov=quoteOverrides&&quoteOverrides[w.code];
        const liveCurrent=ov?num(ov.t):s.stockQuotes[w.code]?.t;
        return {...w,current:liveCurrent,primaryStatus:enr?.status,actionStatus:enr?.actionStatus};
      });
      const ar=await fetch("/api/analysis",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(withCurrent)});
      if(ar.ok){
        const ad=await ar.json();
        // 診断用：この取得で実際にサーバーへ送った現在値(_currentSent)・現在値/市場指標/分析結果
        // それぞれの取得時刻(ISO)を結果に添えておく。カード側のFreshnessBadgeがこれを使って
        // LIVE/n分遅延/STALEを判定する。
        const stampedAt=new Date().toISOString();
        const withCurrentByCode=Object.fromEntries(withCurrent.map(w=>[w.code,w.current]));
        Object.entries(ad.analysis||{}).forEach(([code,r])=>{
          r._fetchedAtIso=stampedAt;
          r._currentSent=withCurrentByCode[code];
          r._quoteFetchedAtIso=(quoteOverrides&&quoteOverrides[code]?.quoteFetchedAt)||s.stockQuotes[code]?.quoteFetchedAt||null;
          r._marketFetchedAtIso=marketFetchedAtIso||s.metricsFetchedAt||null;
        });
        setS(p=>({...p,analysisData:{...p.analysisData,...(ad.analysis||{})}}));
        const gotCodes=new Set(Object.keys(ad.analysis||{}));
        markDone(new Set(items.map(w=>w.code).filter(c=>!gotCodes.has(c))));
      }else{
        markDone(new Set(items.map(w=>w.code)));
      }
    }catch(e){
      markDone(new Set(items.map(w=>w.code)));
    }
    setAnalyzing(false);
  };
  // 2026-09-08新規：「銘柄分析」を開く／再取得する際に、現在値・市場指標をまずその場で
  // 取り直してから分析APIへ渡す一元的な最新化処理（ユーザー指示書9番）。ローカルに残っている
  // 古いstockQuotes/metricsのまま分析すると、画面表示の現在値とサーバー分析結果の前提値が
  // ズレたまま「最新分析」のように見えてしまうため。
  const refreshAnalysisContext=async(items)=>{
    if(!items||!items.length)return;
    const jpItems=items.filter(w=>w.market==="JP");
    const usItems=items.filter(w=>w.market!=="JP");
    const nowIso=new Date().toISOString();
    let quoteOverrides={};
    const fetchQuotesFor=async(subset)=>{
      if(!subset.length)return;
      try{
        const r=await fetch("/api/stock-quotes",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(subset)});
        if(r.ok){
          const d=await r.json();
          const stamped=Object.fromEntries(Object.entries(d.quotes||{}).map(([k,v])=>[k,{...v,quoteFetchedAt:nowIso}]));
          quoteOverrides={...quoteOverrides,...stamped};
          setS(p=>({...p,stockQuotes:{...p.stockQuotes,...stamped}}));
        }
      }catch(e){}
    };
    await Promise.all([fetchQuotesFor(jpItems),fetchQuotesFor(usItems)]);
    try{
      const qr=await fetch("/api/quotes");
      if(qr.ok){
        const qd=await qr.json();
        setS(p=>{const nm={...p.metrics};
          Object.entries(qd.quotes||{}).forEach(([k,v])=>{
            if(nm[k]!=null&&v){nm[k]={...nm[k],
              t:(v.t!=null?String(v.t):nm[k].t),
              p:(v.p!=null?String(v.p):nm[k].p),
              spark:(Array.isArray(v.spark)?v.spark:nm[k].spark)};}
          });
          return {...p,metrics:nm,metricsFetchedAt:nowIso};});
      }
    }catch(e){}
    await fetchAnalysisFor(items,{quoteOverrides,marketFetchedAtIso:nowIso});
  };
  // 2026-09-08更新：銘柄追加時（新規＝analysisDataが無い）に加え、①「分析」タブを開いた瞬間、
  // ②既存の分析結果がANALYSIS_STALE_MINUTES分を超えて陳腐化している場合、も自動で最新化する
  // （ユーザー指示書1・5・9番：「日本市場→銘柄分析」で開いた時に古い分析結果がそのまま
  // 表示され続けていた不具合の本体）。以前はanalysisTargetsに既に入っている銘柄は「data有り」と
  // 判定されると二度と自動再取得されず、何日前の結果でもそのまま表示され続けていた。
  const [analysisEntering,setAnalysisEntering]=useState(false);
  // 2026-09-08新規（分析カードUI改善：DECISION_FIRST_LAYOUT/COLLAPSE_SECONDARY_INFORMATION）。
  // 補助情報（詳細テクニカル・信用残・証金残・ニュース全文等）はデフォルト折りたたみにし、
  // 銘柄コードごとに開閉状態を保持する（他銘柄のカードには影響しない）。既存の
  // openMenuFor/expandedCode等と同じ「コードをキーにしたSetで開閉管理」パターンを踏襲。
  const [analysisDetailOpen,setAnalysisDetailOpen]=useState(()=>new Set());
  const toggleAnalysisDetail=(code)=>setAnalysisDetailOpen(prev=>{const n=new Set(prev);n.has(code)?n.delete(code):n.add(code);return n;});
  useEffect(()=>{
    if(tab!=="analysis")return;
    const legacySchema=(a)=>!a||a.strength===undefined||a.autoEarningsStars===undefined;
    const missing=analysisItems.filter(w=>legacySchema(s.analysisData[w.code]));
    const stale=analysisItems.filter(w=>{
      const a=s.analysisData[w.code];
      if(legacySchema(a))return false; // missingの方でカバー済み（二重リクエスト防止）
      if(a._refreshing)return false; // 取得処理が既に進行中
      return isStaleFetchedAt(a._fetchedAtIso,ANALYSIS_STALE_MINUTES);
    });
    const targets=[...missing,...stale];
    if(targets.length){setAnalysisEntering(true);refreshAnalysisContext(targets).finally(()=>setAnalysisEntering(false));}
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[s.analysisTargets,tab]);

  // 2026-09-08新規：上のuseEffectは「分析タブを開いた瞬間／対象銘柄が変わった瞬間」しか
  // 見ないため、開いたまま15分以上経過した場合は何もトリガーが無くSTALE表示のまま放置されて
  // しまう（指示書5番「一定時間以上古ければstale扱い→再取得を試す」を機械的に満たすため）。
  // 分析タブを開いている間だけ、1分おきに陳腐化していないか確認し、あれば自動で最新化する。
  useEffect(()=>{
    if(tab!=="analysis")return;
    const id=setInterval(()=>{
      const ad=sRef.current.analysisData;
      const targets=sRef.current.analysisTargets.map(code=>allWatch.find(w=>w.code===code)).filter(Boolean).filter(w=>{
        const a=ad[w.code];
        if(!a||a._refreshing)return false;
        return isStaleFetchedAt(a._fetchedAtIso,ANALYSIS_STALE_MINUTES);
      });
      if(targets.length)refreshAnalysisContext(targets);
    },60*1000);
    return ()=>clearInterval(id);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[tab]);

  // ===== デスクトップ通知（セクター内逆行銘柄・出来高ブレイクアウトの監視銘柄自動追加で使用） =====
  // 2026-08-21 ユーザー要望：旧「本日優先」5分おき自動スキャン機能（priorityTargets・
  // autoScanEnabled・9社上限）は「監視銘柄」タブに置き換えて撤去した。通知の許可取得・送信の
  // 仕組み自体はそのまま残し、下のsectorLaggards・breakoutAlertsから利用する。
  const [notifyPermission,setNotifyPermission]=useState(typeof Notification!=="undefined"?Notification.permission:"unsupported");
  const notifiedLaggardsRef=useRef(new Set()); // 通知済みのセクター内逆行銘柄コード（同じ銘柄への通知連打を防ぐ。日をまたぐか再読み込みでリセット）

  const requestNotifyPermission=async()=>{
    if(typeof Notification==="undefined"){alert("このブラウザはデスクトップ通知に対応していません。");return;}
    const perm=await Notification.requestPermission();
    setNotifyPermission(perm);
  };
  const notifyDesktop=(title,body)=>{
    if(typeof Notification==="undefined"||Notification.permission!=="granted")return;
    try{ new Notification(title,{body}); }catch(e){}
  };

  // 2026-09-10新規（損切りルール是正・最優先修正）：POSITION_RISK_RULES（モジュール
  // レベルの唯一の真実オブジェクト）をサーバー側の実際の設定で上書きする。オブジェクトの
  // プロパティを書き換えるだけ（再代入しない）なので、既にこのオブジェクトを参照している
  // 全ての関数（derivePositionStatus等）が次回呼び出し時から自動的に最新値を使う。
  // fetch前・失敗時は既定値（-6/-7/-8%）のままなので、常に正しく動作する。
  useEffect(()=>{
    fetchJsonSafe("/api/position-risk-rules").then(d=>{
      const r=d&&d.rules;
      if(!r)return;
      Object.assign(POSITION_RISK_RULES,{
        watchPct:r.watch_pct??POSITION_RISK_RULES.watchPct,
        warningPct:r.warning_pct??POSITION_RISK_RULES.warningPct,
        maxLossPct:r.max_loss_pct??POSITION_RISK_RULES.maxLossPct,
        action:r.action??POSITION_RISK_RULES.action,
        allowReentry:r.allow_reentry??POSITION_RISK_RULES.allowReentry,
        reentryRequiresNewDecision:r.reentry_requires_new_decision??POSITION_RISK_RULES.reentryRequiresNewDecision,
      });
    });
  },[]);

  // セクター内逆行銘柄（項目3-4）：全体的に弱いセクターの中で1銘柄だけ強い動きをしている銘柄を
  // 拾う。既に取得済みのstockQuotesだけで計算できる軽い処理のため、優先銘柄に絞らず登録銘柄
  // 全体（日本＋アメリカ）を対象にする（ユーザー確認済み）。しきい値は「セクター平均が弱い
  // (-0.3%以下)のに個別銘柄は強い(+1.5%以上)、かつその差が2ポイント以上」という簡易基準。
  const sectorLaggards=useMemo(()=>{
    const bySector=groupStocks(watchlistAll,s.stockQuotes,w=>w.sector);
    const sectorAvg=Object.fromEntries(bySector.map(g=>[g.key,g.avgPct]));
    const out=[];
    watchlistAll.forEach(w=>{
      const qt=s.stockQuotes[w.code]||{};
      const t=num(qt.t),p=num(qt.p);
      const pct=(t!=null&&p!=null&&p)?(t-p)/p*100:null;
      const avg=sectorAvg[w.sector];
      if(pct!=null&&avg!=null&&avg<=-0.3&&pct>=1.5&&(pct-avg)>=2){
        out.push({code:w.code,name:w.name,sector:w.sector,pct,sectorAvg:avg});
      }
    });
    return out.sort((a,b)=>(b.pct-b.sectorAvg)-(a.pct-a.sectorAvg));
  },[watchlistAll,s.stockQuotes]);

    sectorLaggards.forEach(item=>{

  // 軽い処理。analyze_stock()のbreakout_confirmedと同一基準（直近3か月高値を、5日平均出来高の
  // 1.5倍以上の出来高を伴って上抜け。2026-08-21：参照期間を20営業日→3か月に変更）。
  // sectorLaggardsと同じく登録銘柄全体が対象（2026-08-20 ユーザー要望）。
  const breakoutAlerts=useMemo(()=>{

      const t=num(qt.t),vol=num(qt.volume);
      if(t==null||vol==null)return;
      const volRatio=levels.volAvg5?vol/levels.volAvg5:null;
      if(t>levels.highLookback && volRatio!=null && volRatio>=1.5){
        out.push({code:w.code,name:w.name,highLookback:levels.highLookback,t,volRatio});

  const mergeByDate=(...lists)=>{

  // 従来はカテゴリ（登録銘柄IR・米国株IR・国内市況・海外市況）ごとに件数上限を決め打ちで
  // 連結するだけだったが、指示書のranking_rulesに合わせ「①重要ニュース→②登録銘柄への
  // 直接関連→③情報源（公式IR/TDnet＞日経＞NQN＞その他国内＞海外）→④新しさ」の順で
  // 全件を横断ソートする方式に変更した。重複排除（URLベース）は既存のまま再利用。
  // 表示件数の上限（旧実装のslice合計にほぼ相当する60件）だけ従来の考え方を踏襲する。
  const newsSummary=useMemo(()=>{
    const seen=new Set();
    const pool=[];
    const push=(list,overseas)=>{for(const it of list){if(!it.url||seen.has(it.url))continue;seen.add(it.url);pool.push(overseas?{...it,_overseas:true}:it);}};
    push(s.stockNewsList,false);      // 登録銘柄（日本）のIR・TDnet
    push(s.usStockNewsList,false);    // 登録銘柄（米国）のIR。市況一般ではなく登録銘柄関連のため海外markしない
    push(s.macroNewsDomestic,false);  // 国内市況一般
    push(s.macroNewsOverseas,true);   // 海外市況一般
    push(s.stockNameNewsList,false);  // 登録銘柄の社名一致ニュース（IR以外も含む）
    const rankOf=(it)=>[isImportantNews(it.title)?0:1, it.code?newsPriorityRank(it.code):5, newsSourceRank(it)];
    pool.sort((a,b)=>{
      const ra=rankOf(a),rb=rankOf(b);
      for(let i=0;i<ra.length;i++){if(ra[i]!==rb[i])return ra[i]-rb[i];}
      return (b.published||"").localeCompare(a.published||"");
    });
    return pool.slice(0,60);

  // 理論値）を明確に別キーで分け、混同しないようnoteを添える。新規のサーバー計算は追加しない。
  const [analysisConsultMsg,setAnalysisConsultMsg]=useState("");
  // 2026-09-08新規（ニュース・材料連携の改善、指示書10番）：直近の重要材料（news_catalysts）を
  // 銘柄分析の相談用ペイロードに添える。既存のcatalystsForCode()（行バッジと同じマッチング
  // ロジック）をそのまま再利用し、判定を重複実装しない。catalyst_dateは日付のみ（時刻を
  // 保持しない）ため、age_hoursはその日のJST 0時からの経過時間という近似値になる点に注意。

    const items=catalystsForCode(newsCatalysts,code,sector).slice(0,maxCount);

    const knowledge=await fetchJsonSafe("/api/knowledge-context",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({code:w.code,sector:w.sector,market:w.market,analysisType:"stock",

      evaluation:{grade,action:strategy},

      },

        volume:num(s.stockQuotes[w.code]?.volume)},

      active_rules:activeRulesForConsult.map(r=>({rule:r.rule_text,confidence:r.confidence,action:r.action_text||null})),
      integrated_judgment:knowledge&&!knowledge.error?{

        upcoming_events:knowledge.context.upcoming_events.slice(0,3).map(e=>({title:e.title||e.event,business_days_until:e.business_days_until})),
        matched_playbook:knowledge.context.matched_playbooks[0]?{name:knowledge.context.matched_playbooks[0].name,matchScore:knowledge.context.matched_playbooks[0].matchScore}:null,

  // 2026-09-02 ユーザー要望「投資判断ログ」：journal・myRulesをサーバーDB（Neon）へ移行後は、

  const exportJSON=()=>{const blob=new Blob([JSON.stringify(s,null,2)],{type:"application/json"});

  // 5-2章：JP個別株（TradingView無料埋め込み不可）は立花証券API／yfinanceのデータで自前描画する。
  // 2026-09-09更新（監視銘柄・市場チャートの時間足切替）：stockChartIntervalが"D"（日足）なら
  // 従来通り/api/stock-history（立花証券API・分割調整済み・上場来）をそのまま使用（指示書12番
  // 「日足機能は削除しない」）。1/5/15/60分足が選ばれた場合のみ、新設の共通短期足取得
  // （fetchChartBarsCached→/api/position-intraday-chart、ポジション画面と同じAPI・同じ
  // サーバー関数を再利用）に切り替える。依存配列にstockChartIntervalを含めることで、
  // モーダルを閉じずに時間足ボタンを押すだけで再取得・再描画される（指示書9番）。
  useEffect(()=>{
    if(!chartModal||embeddable(chartModal.symbol)||chartModal.market!=="JP"||!chartModal.code)return;
    if(typeof LightweightCharts==="undefined"){setJpHistoryMsg("チャート描画ライブラリの読み込みに失敗しました。通信環境をご確認ください。");return;}
    const myGen=++chartFetchGenRef.current; // 指示書9番：多重fetch防止（古い世代の結果は無視する）
    let cancelled=false;
    setJpHistoryMsg("読み込み中…");
    const isDaily=stockChartInterval==="D";

    const renderChart=({candles,volumes,vwapLine,priceLines,visibleRange})=>{
      if(cancelled||myGen!==chartFetchGenRef.current)return;
      const el=jpChartRef.current;
      if(!el)return;
      if(el._cleanup)el._cleanup();
      el.innerHTML="";
      const hasVolume=Array.isArray(volumes)&&volumes.length>0;
      const chart=LightweightCharts.createChart(el,{width:el.clientWidth||680,height:440,

        grid:{vertLines:{color:"#D6D8CF"},horzLines:{color:"#D6D8CF"}},
        timeScale:{borderColor:"#C6C8BF",timeVisible:!isDaily,secondsVisible:false},
        rightPriceScale:{borderColor:"#C6C8BF"}});
      const series=chart.addCandlestickSeries({upColor:"#AE3A34",downColor:"#2C6A48",borderVisible:false,
        wickUpColor:"#AE3A34",wickDownColor:"#2C6A48"}); // 日本の相場慣習に合わせ赤=上昇・緑=下落
      series.setData(candles);
      if(hasVolume){
        const volSeries=chart.addHistogramSeries({priceFormat:{type:"volume"},priceScaleId:"volPane",color:"#8a8f80"});
        volSeries.priceScale().applyOptions({scaleMargins:{top:0.82,bottom:0}});
        volSeries.setData(volumes);
      }
      if(vwapLine&&vwapLine.length){
        const vwapSeries=chart.addLineSeries({color:"#3A6EA5",lineWidth:1,priceLineVisible:false,lastValueVisible:false});
        vwapSeries.setData(vwapLine);
      }
      (priceLines||[]).forEach(({price,color,title})=>{
        if(price==null)return;
        series.createPriceLine({price,color,lineWidth:1,lineStyle:LightweightCharts.LineStyle.Dashed,axisLabelVisible:true,title});
      });
      if(visibleRange)chart.timeScale().setVisibleRange(visibleRange);
      else chart.timeScale().fitContent();
      // モーダル表示直後はレイアウト確定前でclientWidthが0のことがあるため、
      // ResizeObserverで実測幅が変わるたびに追従させる（ウィンドウリサイズも含めて一本化）。
      const ro=new ResizeObserver(entries=>{
        const w=entries[0]?.contentRect?.width;
        if(w)chart.applyOptions({width:Math.floor(w)});
      });
      ro.observe(el);
      // モーダルのレイアウトが1フレーム遅れて確定する環境向けの保険（ResizeObserverだけでは
      // 追従しないケースがあったため、初期化直後に実測幅で明示的にも合わせておく）。
      requestAnimationFrame(()=>{if(el.clientWidth)chart.applyOptions({width:el.clientWidth});});
      el._cleanup=()=>{ro.disconnect();chart.remove();};
    };

    if(isDaily){
      fetch("/api/stock-history?code="+encodeURIComponent(chartModal.code))
        .then(r=>r.json())
        .then(d=>{
          if(cancelled||myGen!==chartFetchGenRef.current)return;

          setJpHistoryMsg("");
          renderChart({candles:hist.map(r=>({time:r.date,open:r.open,high:r.high,low:r.low,close:r.close}))});
        })
        .catch(()=>{if(!cancelled&&myGen===chartFetchGenRef.current)setJpHistoryMsg("取得に失敗しました。start.batのサーバーが起動しているかご確認ください。");});
    }else{
