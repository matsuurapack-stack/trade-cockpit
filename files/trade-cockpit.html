// 2026-09-07新規（ポジション→リアルタイム売却判断画面 Phase1）：ポジションカードの「リアルタイム」
// 展開エリア。展開している間だけ/api/position-liveを一定間隔でポーリングする（既存の全銘柄一括
// stockQuotesポーリングとは完全に別経路。閉じれば即座にpollingが止まり、他の監視銘柄・ポジションの
// 更新頻度には一切影響しない）。ここでは新しい売買ロジックは作らず、売却は既存のPositionExitModal
// （onOpenExit経由で親から渡される）をそのまま呼ぶだけ。
const POSITION_LIVE_POLL_MS=12000; // 展開中のみ12秒間隔（yfinance/立花証券APIとも常時ポーリング前提のAPIではないため控えめにする）
function PositionLiveDetail({item,onOpenExit,posFlags,posIndicators,enrStatus}){
  const [detail,setDetail]=useState(null);
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(true);
  useEffect(()=>{
    let cancelled=false;
    const load=async()=>{
      const d=await fetchJsonSafe(`/api/position-live?code=${encodeURIComponent(item.code)}&market=${encodeURIComponent(item.market||"JP")}`);
      if(cancelled)return;
      if(d.error){setErr(d.error);}else{setDetail(d);setErr("");}
      if(!cancelled)setLoading(false);
    };
    load();
    const timer=setInterval(load,POSITION_LIVE_POLL_MS);
    return ()=>{cancelled=true;clearInterval(timer);};
  },[item.code,item.market]);

  const rowStyle={display:"flex",justifyContent:"space-between",fontSize:12,padding:"2px 0"};
  if(loading&&!detail)return <div style={{marginTop:8,padding:"10px 10px",background:"var(--card)",border:"2px solid var(--accent)",borderRadius:5,fontSize:12,color:"var(--inkFaint)"}}>📊 リアルタイム売却判断 — 取得中…</div>;
  if(err&&!detail)return <div style={{marginTop:8,padding:"10px 10px",background:"var(--card)",border:"2px solid var(--down)",borderRadius:5,fontSize:12,color:"var(--down)"}}>📊 リアルタイム売却判断 — {err}</div>;
  if(!detail)return null;

  const avg=num(item.average_price);
  const cur=num(detail.t),prev=num(detail.p),open=num(detail.open),high=num(detail.high),low=num(detail.low);
  const changeAmt=(cur!=null&&prev!=null)?cur-prev:null;
  const changePct=(cur!=null&&prev)?(cur-prev)/prev*100:null;
  const buildDiff=(avg!=null&&cur!=null)?cur-avg:null;
  const buildDiffPct=(avg&&cur!=null)?(cur-avg)/avg*100:null;
  const fromHighPct=(high&&cur!=null)?(cur-high)/high*100:null;
  const fromLowPct=(low&&cur!=null)?(cur-low)/low*100:null;
  // 当日レンジバー用の位置（0〜100%）。high===lowのような異常値では中央固定にする。
  const rangePos=(high!=null&&low!=null&&high>low&&cur!=null)?Math.max(0,Math.min(100,(cur-low)/(high-low)*100)):null;
  // 出来高評価（vd）はPhase3でPositionJudgmentPanel側に統合したため、ここでは保持しない。

  return <div style={{marginTop:8,padding:"10px 10px",background:"var(--card)",border:"2px solid var(--accent)",borderRadius:5}}>
    {/* 2026-09-07追加（実機フィードバック）：既存カードに埋もれず「新しい機能だ」と一目で
        分かるよう、accent色の枠＋明確な見出しを付けた。 */}
    <div style={{fontSize:13,fontWeight:800,color:"var(--accent)",marginBottom:8,display:"flex",alignItems:"center",gap:6}}>
      📊 リアルタイム売却判断
    </div>
    {/* item3：建値基準の情報を上部に常時表示 */}
    <div style={{display:"flex",gap:16,flexWrap:"wrap",alignItems:"baseline",marginBottom:8}}>
      <div><span style={{fontSize:10.5,color:"var(--inkSoft)"}}>取得 </span><span className="mono" style={{fontSize:13}}>{avg!=null?avg.toLocaleString():"—"}</span></div>
      <div><span style={{fontSize:10.5,color:"var(--inkSoft)"}}>現在 </span><span className="mono" style={{fontSize:13,fontWeight:800}}>{cur!=null?cur.toLocaleString():"—"}</span></div>
      {buildDiff!=null && <div className="mono" style={{fontSize:13,fontWeight:800,color:buildDiff>0?"var(--up)":buildDiff<0?"var(--down)":"var(--inkSoft)"}}>
        {buildDiff>0?"+":""}{buildDiff.toLocaleString()}（{buildDiffPct>0?"+":""}{buildDiffPct.toFixed(2)}%）
      </div>}
      <button className="action-btn" style={{fontSize:11,marginLeft:"auto"}} onClick={()=>onOpenExit(item,cur)}>💰 売却</button>
    </div>

    {/* item2：リアルタイム株価の主要項目 */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(100px,1fr))",gap:"2px 10px",marginBottom:8}}>
      <div style={rowStyle}><span style={{color:"var(--inkSoft)"}}>前日比</span><span className="mono" style={{fontWeight:700,color:changeAmt>0?"var(--up)":changeAmt<0?"var(--down)":"var(--inkSoft)"}}>{changeAmt!=null?`${changeAmt>0?"+":""}${changeAmt.toLocaleString()}（${changePct>0?"+":""}${changePct.toFixed(2)}%）`:"—"}</span></div>
      <div style={rowStyle}><span style={{color:"var(--inkSoft)"}}>始値</span><span className="mono">{open!=null?open.toLocaleString():"—"}</span></div>
      <div style={rowStyle}><span style={{color:"var(--inkSoft)"}}>高値</span><span className="mono">{high!=null?high.toLocaleString():"—"}</span></div>
      <div style={rowStyle}><span style={{color:"var(--inkSoft)"}}>安値</span><span className="mono">{low!=null?low.toLocaleString():"—"}</span></div>
      <div style={rowStyle}><span style={{color:"var(--inkSoft)"}}>出来高</span><span className="mono">{detail.volume!=null?Math.round(detail.volume).toLocaleString():"—"}</span></div>
      <div style={rowStyle}><span style={{color:"var(--inkSoft)"}}>更新</span><span className="mono">{detail.fetchedAtJst||"—"}</span></div>
    </div>

    {/* item4：当日レンジバー */}
    {rangePos!=null && <div style={{marginBottom:8}}>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"var(--inkFaint)",marginBottom:2}}>
        <span>安値 {low.toLocaleString()}</span><span>高値 {high.toLocaleString()}</span>
      </div>
      <div style={{position:"relative",height:6,background:"var(--ruleSoft)",borderRadius:3}}>
        <div style={{position:"absolute",left:`${rangePos}%`,top:-3,width:2,height:12,background:"var(--ink)",transform:"translateX(-1px)"}} title={`現在値 ${cur.toLocaleString()}`}/>
      </div>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"var(--inkFaint)",marginTop:2}}>
        <span>高値から {fromHighPct>0?"+":""}{fromHighPct?.toFixed(2)}%</span>
        <span>安値から {fromLowPct>0?"+":""}{fromLowPct?.toFixed(2)}%</span>
      </div>
    </div>}

    {/* Phase3（item2〜9）：左＝5分足チャート（Phase2そのまま）、右＝売却判断エリア（新設）の
        2カラム（PC）／縦積み（スマホ、.pos-judgment-gridのCSS参照）。出来高評価（旧item10の
        単独表示）は売却判断エリア側に統合したため、ここでの単独表示は削除した。 */}
    <div className="pos-judgment-grid" style={{marginTop:4}}>
      <PositionIntradayChart item={item} currentPrice={cur}/>
      <PositionJudgmentPanel item={item} detail={detail} cur={cur}
        posFlags={posFlags} posIndicators={posIndicators} enrStatus={enrStatus} onOpenExit={onOpenExit}/>
    </div>
    {err && <div style={{fontSize:10.5,color:"var(--down)",marginTop:6}}>※直近の更新に失敗しました（表示は前回取得値）：{err}</div>}
  </div>;
}

function PortfolioPanel({stockQuotes,analysisData,analysisEnrichedMap,marketEvents,newsCatalysts,expertViews,candidatesJP,candidatesUS,onAddToWatchlist,onOpenChart}){
  const [items,setItems]=useState([]);
  const [loading,setLoading]=useState(true);
  // 2026-09-10新規（損切りルール是正・最優先修正）：EXIT RULE（-8%）到達を検知したら
  // 音＋ポップアップ＋デスクトップ通知を出す。自信度・材料に関わらず一旦売却を促す絶対
  // ルールのため、他の通知（セクター内逆行銘柄等）と同様の仕組みを再利用しつつ、含み損が
  // EXIT未満へ戻るまで同じ銘柄への連打通知はしない（ページ再読み込みでリセット）。
  const exitNotifiedRef=useRef(new Set());
  const [exitToast,setExitToast]=useState(null);
  useEffect(()=>{
    items.forEach(it=>{
      const current=num(stockQuotes?.[it.code]?.t);
      const {pct:pnlPct}=calcUnrealizedPnl(it.average_price,it.quantity,current);
      const tier=evaluatePositionRiskRule(pnlPct);
      const key=it.code+it.market;
      if(tier==="EXIT"){
        if(!exitNotifiedRef.current.has(key)){
          exitNotifiedRef.current.add(key);
          playMorningCheckChime(true);
          setExitToast({code:it.code,name:it.name,pnlPct});
          setTimeout(()=>setExitToast(v=>(v&&v.code===it.code)?null:v),12000);
          if(typeof Notification!=="undefined"&&Notification.permission==="granted"){
            try{new Notification("🚨 EXIT RULE",{body:`${it.name}：買値から${pnlPct.toFixed(1)}%（${POSITION_RISK_RULES.maxLossPct}%到達）。一旦売却してください。`});}catch(e){}
          }
        }
      }else{
        exitNotifiedRef.current.delete(key);
      }
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[items,stockQuotes]);
  // v3-8（ポジション管理ロジック再設計 Step1）：取引タイプ（DAY/SWING）を新規登録時に必須化。
  // SWINGの-10% HARD STOP等、取引タイプに応じた判断ロジックの起点となるフィールドのため。
  const emptyDraft={code:"",name:"",market:"JP",quantity:"",average_price:"",acquired_at:"",memo:"",
    initial_stop:"",target_1:"",target_2:"",trade_style:""};
  const [draft,setDraft]=useState(emptyDraft);
  const [saving,setSaving]=useState(false);
  // 2026-09-08新規（ポジション登録機能の改善）：監視銘柄に未登録の銘柄でも、日本市場/米国株一覧が
  // 既に読み込んでいる銘柄マスタ（candidatesJP＝MASTER+立花証券の東証全銘柄マスタ、
  // candidatesUS＝MASTER米国株）をそのまま検索対象として再利用する（指示書8番、新規の
  // 検索API・銘柄マスタは作らない）。コード欄は自由入力も維持しつつ、入力中に候補を出し
  // クリック/Enterで確定できるようにする。
  const [codeSearchOpen,setCodeSearchOpen]=useState(false);
  const [codeActiveIndex,setCodeActiveIndex]=useState(0);
  const [previewQuote,setPreviewQuote]=useState(null); // {t,p} 選択銘柄の現在値（参考表示のみ、average_priceには入れない）
  const [selectedSector,setSelectedSector]=useState(""); // 「監視銘柄にも追加」時の業種（候補選択時のみ分かる）
  const [alsoWatch,setAlsoWatch]=useState(false);
  const [watchAddMsg,setWatchAddMsg]=useState("");
  const positionCandidates=useMemo(()=>{
    const list=draft.market==="US"?(candidatesUS||[]):(candidatesJP||[]);
    return list.filter(m=>m.market!=="IDX"); // 指数・為替はポジション対象外
  },[draft.market,candidatesJP,candidatesUS]);
  const codeMatches=useMemo(()=>{
    const t=normKana(draft.code.trim());if(!t)return[];
    return positionCandidates.filter(m=>normKana(m.code).includes(t)||normKana(m.name).includes(t)||normKana(m.kana).includes(t)||normKana(m.sector||"").includes(t)).slice(0,10);
  },[draft.code,positionCandidates]);
  useEffect(()=>{setCodeActiveIndex(0);},[draft.code]);
  // 2026-09-08新規：確定した銘柄コード・市場の現在値を参考表示用に取得する（既存の
  // /api/stock-quotesをそのまま再利用、新規APIは作らない）。あくまで参考値であり、
  // average_priceには絶対に自動で入れない（指示書7番）＝実際の約定単価はユーザーが入力する。
  const fetchPreviewQuote=async(code,market)=>{
    setPreviewQuote(null);
    try{
      const r=await fetch("/api/stock-quotes",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify([{code,market}])});
      if(r.ok){const d=await r.json();const q=d.quotes?.[code];if(q)setPreviewQuote(q);}
    }catch(e){}
  };
  const selectCandidate=(m)=>{
    setDraft(d=>({...d,code:m.code,name:m.name,market:m.market}));
    setSelectedSector(m.sector||"");
    setCodeSearchOpen(false);
    fetchPreviewQuote(m.code,m.market);
  };
  const onCodeKeyDown=(e)=>{
    if(!codeSearchOpen||!codeMatches.length)return;
    if(e.key==="ArrowDown"){e.preventDefault();setCodeActiveIndex(i=>(i+1)%codeMatches.length);}
    else if(e.key==="ArrowUp"){e.preventDefault();setCodeActiveIndex(i=>(i-1+codeMatches.length)%codeMatches.length);}
    else if(e.key==="Enter"){e.preventDefault();selectCandidate(codeMatches[codeActiveIndex]);}
    else if(e.key==="Escape"){e.preventDefault();setCodeSearchOpen(false);}
  };
  // 指示書12番：同一銘柄・同一市場が既にポジションにある場合の重複検出（既存の建玉管理仕様＝
  // add_position_entry()の加重平均合算をそのまま使う。upsert（/api/portfolio/save）で
  // 上書きすると既存の数量・取得単価が消えてしまうため、重複時だけ既存の「買い増し」と
  // 同じエンドポイント（/api/portfolio/add-entry）に切り替える）。
  const duplicatePosition=useMemo(()=>{
    const code=draft.code.trim();if(!code)return null;
    return items.find(it=>it.code===code&&(it.market||"JP")===draft.market)||null;
  },[draft.code,draft.market,items]);

  const load=async()=>{
    setLoading(true);
    try{
      const r=await fetch("/api/portfolio");
      if(r.ok){const d=await r.json();setItems(Array.isArray(d.items)?d.items:[]);}
    }catch(e){}
    setLoading(false);
  };
  useEffect(()=>{load();},[]);

  // v3-9続き（2026-09-07・監視銘柄→ポジション連携・売買損益管理）：通算実現損益（初期値＋
  // trade_history合計、サーバー側で毎回再計算）と取引履歴。既存portfolio（含み損益・保有中）
  // とは完全に別枠で表示する（実現損益と含み損益を混同しない、というユーザー指示）。
  const [totals,setTotals]=useState({initialRealizedPnl:0,totalRealizedPnl:0});
  const [trades,setTrades]=useState([]);
  const [initialPnlDraft,setInitialPnlDraft]=useState("");
  const [editingInitialPnl,setEditingInitialPnl]=useState(false);
  const loadTotals=async()=>{
    try{
      const r=await fetch("/api/investment-totals");
      if(r.ok){const d=await r.json();setTotals(d);}
    }catch(e){}
  };
  const loadTrades=async()=>{
    try{
      const r=await fetch("/api/trade-history");
      if(r.ok){const d=await r.json();setTrades(Array.isArray(d.trades)?d.trades:[]);}
    }catch(e){}
  };
  useEffect(()=>{loadTotals();loadTrades();},[]);
  // v3-9追加（2026-09-07・ユーザーフィードバック）：入力ミス修正のため、通常時は編集不可
  // 表示のまま「修正」を押した時だけ入力欄を出し、確定前に「初期通算損益を変更すると通算損益が
  // 再計算されます」という確認を必ず挟む（trade_history自体は一切変更しない・再計算対象は
  // 表示上のtotalRealizedPnlのみ）。既存remove()のconfirm()パターンを踏襲。
  const saveInitialPnl=async()=>{
    const v=num(initialPnlDraft);
    if(v==null)return;
    if(!confirm(`初期通算損益を${v.toLocaleString()}円に修正します。\n通算実現損益（初期値＋売買履歴の合計）が再計算されます。売買履歴（trade_history）自体は変更されません。\nよろしいですか？`))return;
    try{
      const r=await fetch("/api/investment-totals/set-initial",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({value:v})});
      if(r.ok){setTotals(await r.json());}
    }catch(e){}
    setEditingInitialPnl(false);
  };
  const todayStr=todayISO();
  const todaysTrades=useMemo(()=>trades.filter(t=>(t.closed_at||"").slice(0,10)===todayStr),[trades,todayStr]);

  // 監視銘柄→ポジション連携の「買い増し」／保有カードの「売却」モーダル状態。
  const [entryModalFor,setEntryModalFor]=useState(null); // {code,name,market}
  const [exitModalFor,setExitModalFor]=useState(null); // portfolio 1件
  const [exitPriceOverride,setExitPriceOverride]=useState(null); // リアルタイム詳細から開いた場合の最新現在値
  const afterEntrySaved=()=>{load();};
  const afterExitSaved=()=>{load();loadTotals();loadTrades();};
  // item12/13：リアルタイム詳細エリアの「💰 売却」から開く場合は、そこで取得した最新の現在値を
  // 売値の初期値に使う（一覧の一括stockQuotesより新しいことが多いため）。通常の一覧行から開く
  // 場合は従来通りstockQuotesを使う（openExitの第2引数省略）。売却処理自体はどちらもこの同じ
  // PositionExitModal・同じ/api/portfolio/exitのみを使う（新しい売却経路は作らない）。
  const openExit=(it,liveCurrent)=>{setExitModalFor(it);setExitPriceOverride(liveCurrent??null);};
  // v3-9続き（2026-09-07・リアルタイム売却判断画面 Phase1）：詳細展開は同時に1銘柄のみ
  // （item17のAPI負荷対策として推奨されている方式を採用。展開を閉じれば即ポーリング停止）。
  const [expandedLiveCode,setExpandedLiveCode]=useState(null);

  // v3-4：入力中のコードがトレード分析タブで既に「分析」済みなら、その時点のstop/target/
  // fullExitTargetを初期SL・利確①②の下書きに流し込むショートカット（既存analysisDataの
  // 再利用のみ、新規計算なし）。あくまで下書きへの反映で、押さない限り書き換わらない。
  const analysisForDraft=analysisData?.[draft.code.trim()];
  const applyAnalysisValues=()=>{
    if(!analysisForDraft)return;
    setDraft(d=>({...d,
      initial_stop:analysisForDraft.stop??d.initial_stop,
      target_1:analysisForDraft.target??d.target_1,
      target_2:analysisForDraft.fullExitTarget??d.target_2}));
  };

  const resetDraftExtras=()=>{setDraft(emptyDraft);setPreviewQuote(null);setSelectedSector("");setAlsoWatch(false);setCodeSearchOpen(false);};
  const save=async()=>{
    const code=draft.code.trim();
    if(!code)return;
    // 2026-09-08追加（指示書12番）：既に同一銘柄・同一市場のポジションがある場合、黙って
    // 上書き（/api/portfolio/save）せず、既存の建玉管理仕様（加重平均で合算する
    // add_position_entry、監視銘柄カードの「ポジション追加」「買い増し」と同じロジック）に
    // 切り替えるかどうかを確認する。
    if(duplicatePosition){
      if(!confirm(`${draft.name||code}（${code}）は既にポジションにあります（現在 ${num(duplicatePosition.quantity)?.toLocaleString()}株 @${num(duplicatePosition.average_price)?.toLocaleString()}円）。\n追加建てとして登録しますか？（既存分と加重平均で合算されます）`))return;
      if(!draft.trade_style){alert("取引タイプ（DAY/SWING）を選択してください");return;}
      setSaving(true);
      try{
        const r=await fetch("/api/portfolio/add-entry",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({code,name:draft.name,market:draft.market,price:num(draft.average_price),shares:num(draft.quantity),trade_style:draft.trade_style})});
        const d=await r.json();
        if(d.error){alert(d.error);}
        else{
          if(alsoWatch)await addAlsoToWatchlist(code,draft.name,draft.market);
          resetDraftExtras();load();
        }
      }catch(e){}
      setSaving(false);
      return;
    }
    setSaving(true);
    try{
      await fetch("/api/portfolio/save",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({...draft,quantity:num(draft.quantity),average_price:num(draft.average_price),
          acquired_at:draft.acquired_at||null,
          initial_stop:num(draft.initial_stop),target_1:num(draft.target_1),target_2:num(draft.target_2),
          // current_stopは新規登録時は初期SLと同じ値で開始する（トレーリング状態＝「初期SL」から始まる）
          current_stop:num(draft.initial_stop)})}); // 空文字はTIMESTAMPTZ列に直接入らないためnullに変換
      if(alsoWatch)await addAlsoToWatchlist(code,draft.name,draft.market);
      resetDraftExtras();
      load();
    }catch(e){}
    setSaving(false);
  };
  // 指示書4番：「監視にも追加」チェックボックス。監視銘柄への自動追加は行わず、ユーザーが
  // 明示的にチェックした場合のみ、既存のsetWatchlistJP/US（App側、Neon同期込み）を呼び出す。
  // 業種は候補選択時に分かっていればそれを使い、フリー入力等で不明な場合のみ既存の
  // /api/guess-sector（SectorWatchlist.addManual()と同じ、新規APIは作らない）で推定する。
  const addAlsoToWatchlist=async(code,name,market)=>{
    let sector=selectedSector;
    if(!sector){
      try{
        const r=await fetch("/api/guess-sector",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code,market})});
        if(r.ok){const d=await r.json();sector=d.sector||"";}
      }catch(e){}
    }
    const result=onAddToWatchlist&&onAddToWatchlist({code,name,market,sector});
    setWatchAddMsg(result==="already"?"（既に監視銘柄に登録済みでした）":result==="max"?"（監視銘柄が上限のため追加できませんでした）":"（監視銘柄にも追加しました）");
    setTimeout(()=>setWatchAddMsg(""),3500);
  };
  const remove=async(code,market)=>{
    if(!confirm(`${code}を保有株一覧から削除しますか？`))return;
    try{
      await fetch("/api/portfolio/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code,market})});
      load();
    }catch(e){}
  };

  // v3-4：現在SLだけをその場で編集・保存する（他の列は送らないので上書きされない＝
  // upsert_portfolio_itemは送られた列だけをUPDATEする部分更新の仕組みを利用）。
  const [stopDraftFor,setStopDraftFor]=useState(null); // 編集中のcode+market
  const [stopDraftVal,setStopDraftVal]=useState("");
  const saveCurrentStop=async(it)=>{
    const v=num(stopDraftVal);
    try{
      await fetch("/api/portfolio/save",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({code:it.code,market:it.market,current_stop:v})});
      setStopDraftFor(null);
      load();
    }catch(e){}
  };

  // v3-8 Step1：既存ポジション（取引タイプ未設定＝NULL）にDAY/SWINGを後から設定するための
  // ワンクリック保存（他の列は送らないので上書きされない＝部分更新の仕組みを利用）。
  const saveTradeStyle=async(it,style)=>{
    try{
      await fetch("/api/portfolio/save",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({code:it.code,market:it.market,trade_style:style})});
      load();
    }catch(e){}
  };

  // v3-4（ChatGPT連携の再配置）：「利確・損切り相談」。ポジションの実データ（実際の平均取得単価
  // 基準）に加えて、対応するトレード分析結果（analysisData、あれば）を「参考情報」として別枠で
  // 添える。ポジション管理の基準は実際の取得単価であり、トレード分析のentryは参考値である旨を
  // 明示するnoteを含める。
  const [positionConsultMsg,setPositionConsultMsg]=useState("");
  const copyPositionConsult=async(it)=>{
    const current=num(stockQuotes?.[it.code]?.t);
    const {amount:pnlAmount,pct:pnlPct}=calcUnrealizedPnl(it.average_price,it.quantity,current);
    const basisPrice=it.average_price??current;
    const rr=calcPositionRR(it.target_1,basisPrice,it.current_stop);
    const trailKey=deriveTrailingStatus(it.current_stop,it.initial_stop,it.average_price,current);
    // 2026-09-10更新（損切りルール是正・最優先修正）：全トレードスタイル共通の
    // POSITION_RISK_RULES（唯一の真実）を参照する。旧SWING限定-10%からの是正。
    const exitPrice=calcPositionExitPrice(it.average_price);
    const riskTier=evaluatePositionRiskRule(pnlPct);
    const a=analysisData?.[it.code];
    // 2026-09-09新規（ルール学習システム、指示書12番）：exit/position/riskカテゴリと、
    // この銘柄のsector/themeから推定したカテゴリのACTIVE/TESTINGルールを添える。
    const cats=[...new Set([...guessRuleCategoriesForStock(it.sector,it.theme),"position","exit"])];
    const activeRulesForPosition=await fetchJsonSafe(`/api/trade-rules/relevant?categories=${encodeURIComponent(cats.join(","))}`)
      .then(d=>(d&&d.rules)||[]).catch(()=>[]);
    // 2026-09-09新規（判断エンジン全画面統合、指示書5・6番）：ポジション相談・利確損切り
    // 相談は新規買い判断ではなくEXIT側（HOLD/RAISE_STOP/TAKE_PROFIT/REDUCE/EXIT/
    // NO_OVERNIGHT）を返すscope="exit"で統合コンテキストを取得する。
    const knowledgeExit=await fetchJsonSafe("/api/knowledge-context",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({code:it.code,sector:it.sector,market:it.market,scope:"exit",
        position:{trade_style:it.trade_style,unrealized_pnl_pct:pnlPct}})}).catch(()=>null);
    // 2026-09-09新規（判断エンジン全画面統合、指示書7番）：持ち越し判断専用ロジック
    // （OVERNIGHT_OK/OVERNIGHT_CAUTION/NO_OVERNIGHT）も併せて取得する。
    const overnight=await fetchJsonSafe("/api/knowledge-context",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({code:it.code,sector:it.sector,market:it.market,scope:"overnight",
        position:{trade_style:it.trade_style,unrealized_pnl_pct:pnlPct}})}).catch(()=>null);
    await copyChatGPTPayload("利確・損切り相談","position_management",{
      stock:{code:it.code,name:it.name,market:it.market},
      position:{
        trade_style:it.trade_style||null,
        quantity:it.quantity,average_price_actual:it.average_price,current,
        unrealized_pnl:{amount:pnlAmount,pct:pnlPct},
        initial_stop:it.initial_stop,current_stop:it.current_stop,
        target_1:it.target_1,target_2:it.target_2,rr,trailing_status:TRAILING_STATUS_META[trailKey].label,
        exit_rule:exitPrice!=null?{price:exitPrice,tier:riskTier,maxLossPct:POSITION_RISK_RULES.maxLossPct}:null,
      },
      note:"average_price_actualは実際に約定した取得単価（ポジション管理の基準）。exit_ruleは全トレードスタイル共通の-8%到達で一旦売却するルールで、他のどの材料（自信度・材料・チャート・AI分析結果）よりも優先される（tierがEXITなら他条件に関わらず撤退が原則。再エントリーは新しいトレードとして別途判断可）。以下のtrade_analysis_reference.entry_theoreticalはトレード分析タブの理論値で、参考情報にすぎず取得単価とは別物。",
      trade_analysis_reference:a?{
        grade:gradeFromAnalysis(a),action:classifyEntryStrategy(a,analysisEnrichedMap?.get(it.code)),
        entry_theoretical:a.entry,initial_stop_theoretical:a.stop,
        target_1_theoretical:a.target,target_2_theoretical:a.fullExitTarget??null,
      }:null,
      active_rules:activeRulesForPosition.map(r=>({rule:r.rule_text,confidence:r.confidence,action:r.action_text||null})),
      integrated_judgment:knowledgeExit&&!knowledgeExit.error?{
        judgment:knowledgeExit.judgment.judgment,confidence:knowledgeExit.judgment.confidence,reasons:knowledgeExit.judgment.reasons,
        matched_playbook:knowledgeExit.context.matched_playbooks[0]?{name:knowledgeExit.context.matched_playbooks[0].name,matchScore:knowledgeExit.context.matched_playbooks[0].matchScore}:null,
        upcoming_events:knowledgeExit.context.upcoming_events.slice(0,2).map(e=>({title:e.title||e.event,business_days_until:e.business_days_until})),
      }:null,
      overnight_decision:overnight&&!overnight.error?{decision:overnight.judgment.judgment,reasons:overnight.judgment.reasons}:null,
      question:"今のSLを上げるべきか、TP1で利確すべきか、トレンド継続ならどこまで伸ばすべきか相談したいです。",
    },setPositionConsultMsg);
  };

  const fieldStyle={fontSize:12.5,padding:"5px 7px",border:"1px solid var(--rule)",borderRadius:3,background:"var(--bg)",color:"var(--ink)",boxSizing:"border-box"};

  return <>
    {/* 2026-09-10新規（損切りルール是正・最優先修正）：EXIT RULE到達の右下ポップアップ。 */}
    {exitToast && <div style={{position:"fixed",right:16,bottom:16,zIndex:9999,maxWidth:320,
        background:"var(--card)",border:"2px solid var(--down)",borderRadius:8,
        padding:"10px 12px",boxShadow:"0 4px 16px rgba(0,0,0,0.25)",cursor:"pointer"}}
      onClick={()=>setExitToast(null)}>
      <div style={{fontWeight:800,fontSize:12.5,color:"var(--down)"}}>🚨 EXIT RULE</div>
      <div style={{fontSize:12,marginTop:4}}>{exitToast.name}：買値から{exitToast.pnlPct.toFixed(1)}%（{POSITION_RISK_RULES.maxLossPct}%到達）</div>
      <div style={{fontSize:12,fontWeight:800,marginTop:4}}>「売却」</div>
      <div style={{fontSize:10.5,color:"var(--inkSoft)",marginTop:4}}>投資判断がまだ有効でも一旦撤退してください。再エントリーは新しいトレードとして判断します。</div>
      <div style={{fontSize:10.5,color:"var(--inkFaint)",marginTop:4}}>クリックで閉じる</div>
    </div>}
    {/* v3-9続き（2026-09-07）：通算実現損益。含み損益（下の保有カード）とは完全に別枠で表示する
        （実現損益＝売却済みの累積、通算実現損益にはこの含み損益を含めない、というユーザー指示）。 */}
    <div style={{background:"var(--card)",border:"1px solid var(--rule)",borderRadius:4,padding:"12px 14px",marginBottom:10}}>
      {/* 2026-09-07更新（通算実現損益を税引後ベースへ変更）：ラベルに「（税引後）」を明示。
          initial_realized_pnlはユーザーが既に税引後の値として入力している前提のため、
          ここへ追加の税計算はかけない（ユーザー指示）。 */}
      <div style={{fontSize:11,color:"var(--inkSoft)"}}>通算実現損益（税引後）</div>
      {editingInitialPnl
        ? <div style={{display:"flex",gap:8,alignItems:"center",marginTop:4}}>
            <input type="number" autoFocus value={initialPnlDraft} onChange={e=>setInitialPnlDraft(e.target.value)}
              placeholder="修正後の初期通算損益" style={{fontSize:15,padding:"5px 8px",border:"1px solid var(--rule)",borderRadius:4,background:"var(--bg)",color:"var(--ink)",width:160}}/>
            <button className="action-btn" onClick={saveInitialPnl}>修正を確定</button>
            <button className="ghost" onClick={()=>setEditingInitialPnl(false)}>キャンセル</button>
          </div>
        : <div style={{display:"flex",alignItems:"baseline",gap:10,marginTop:2}}>
            <span className="mono" style={{fontSize:22,fontWeight:800,
                color:totals.totalRealizedPnl>0?"var(--up)":totals.totalRealizedPnl<0?"var(--down)":"var(--inkSoft)"}}>
              {totals.totalRealizedPnl>0?"+":""}{Math.round(totals.totalRealizedPnl).toLocaleString()}円
            </span>
            <button className="iconbtn" style={{fontSize:11}} title="入力ミス修正など、初期通算損益を修正する場合のみ使用"
              onClick={()=>{setInitialPnlDraft(String(totals.initialRealizedPnl||""));setEditingInitialPnl(true);}}>修正</button>
          </div>}
      {todaysTrades.length>0 && <div style={{marginTop:10,paddingTop:10,borderTop:"1px solid var(--ruleSoft)"}}>
        <div style={{fontSize:11,fontWeight:700,color:"var(--inkSoft)",marginBottom:4}}>本日の取引</div>
        <div style={{display:"flex",flexDirection:"column",gap:4}}>
          {/* 2026-09-07更新（通算実現損益を税引後ベースへ変更）：税引前・税引後の両方を表示する。
              net_pnlが無い行（税引後対応前の旧レコード）はgross_pnl/taxも無いため、税引前=既存pnl
              のみ表示し「税引後」欄は「—」にする（推測値を作らない）。通算損益への反映は
              net_pnl（無ければpnlを暫定使用、バックエンドのCOALESCEと同じ考え方）。 */}
          {todaysTrades.map(t=>{
            const gross=num(t.gross_pnl)??num(t.pnl);
            const net=num(t.net_pnl);
            return <div key={t.id} style={{fontSize:12,display:"flex",flexWrap:"wrap",gap:8,alignItems:"center"}}>
              <span style={{fontWeight:700}}>{t.name||t.code}</span>
              <span className="mono" style={{color:"var(--inkSoft)"}}>{num(t.entry_price)?.toLocaleString()} → {num(t.exit_price)?.toLocaleString()}</span>
              <span className="mono" style={{color:"var(--inkSoft)"}}>{num(t.shares)?.toLocaleString()}株</span>
              <span className="mono" style={{fontSize:11,color:"var(--inkFaint)"}}>
                税引前 <span style={{fontWeight:700,color:gross>0?"var(--up)":gross<0?"var(--down)":"var(--inkSoft)"}}>{gross!=null?`${gross>0?"+":""}${Math.round(gross).toLocaleString()}円`:"—"}</span>
              </span>
              <span className="mono" style={{fontSize:12,fontWeight:700,color:net==null?"var(--inkFaint)":net>0?"var(--up)":net<0?"var(--down)":"var(--inkSoft)"}}>
                税引後 {net!=null?`${net>0?"+":""}${Math.round(net).toLocaleString()}円`:"—（旧レコード）"}
              </span>
            </div>;
          })}
        </div>
      </div>}
    </div>
    <div style={{background:"var(--card)",border:"1px solid var(--rule)",borderRadius:4,padding:"12px 14px",marginBottom:14}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
      <div style={{fontWeight:700,color:"var(--ink)",fontSize:13}}>保有株（portfolio）</div>
      <span style={{fontSize:11,color:"var(--inkFaint)"}}>{items.length}銘柄</span>
    </div>
    {/* 2026-09-08更新（ポジション登録機能の改善）：「コード」欄を銘柄検索欄として機能させる。
        監視銘柄への登録有無に関わらず、日本市場/米国株一覧が既に読み込んでいる銘柄マスタ
        （candidatesJP/US）から即座に候補を表示する。285Aのような英字混じりコードもcode列は
        常に文字列のまま扱い、数値変換は一切行わない（指示書9番）。自由入力（候補に無い銘柄を
        手で打つ）も従来通り可能。 */}
    <div className="position-add-grid-1" style={{display:"grid",gridTemplateColumns:"110px 1fr 55px 90px 70px 90px 110px",gap:6,marginBottom:6}}>
      <div style={{position:"relative"}}>
        <input placeholder="コード/銘柄名で検索" value={draft.code}
          onChange={e=>{setDraft({...draft,code:e.target.value});setCodeSearchOpen(true);setPreviewQuote(null);setSelectedSector("");}}
          onFocus={()=>setCodeSearchOpen(true)} onBlur={()=>setTimeout(()=>setCodeSearchOpen(false),150)}
          onKeyDown={onCodeKeyDown} style={fieldStyle}/>
        {codeSearchOpen && draft.code.trim() && codeMatches.length>0 && <div className="results" style={{maxHeight:260,overflowY:"auto"}}>
          {codeMatches.map((m,i)=>
            <button key={m.code} type="button" className="res-row" style={{background:i===codeActiveIndex?"var(--band)":"transparent"}}
              onMouseEnter={()=>setCodeActiveIndex(i)} onMouseDown={e=>e.preventDefault()} onClick={()=>selectCandidate(m)}>
              <span className="mono" style={{fontSize:12,width:56,color:"var(--inkSoft)"}}>{m.code}</span>
              <span style={{flex:1,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={m.name}>{m.name}</span>
              <span style={{fontSize:11,color:"var(--inkSoft)",whiteSpace:"nowrap"}}>{m.sector}</span>
            </button>)}
        </div>}
      </div>
      <input placeholder="銘柄名" value={draft.name} onChange={e=>setDraft({...draft,name:e.target.value})} style={fieldStyle}/>
      <select value={draft.market} onChange={e=>{setDraft({...draft,market:e.target.value});setPreviewQuote(null);setSelectedSector("");}} style={fieldStyle}>
        <option value="JP">JP</option><option value="US">US</option>
      </select>
      {/* v3-8 Step1：取引タイプは新規登録で必須（未選択のプレースホルダーを空値のoptionとして用意）。 */}
      <select value={draft.trade_style} onChange={e=>setDraft({...draft,trade_style:e.target.value})} style={{...fieldStyle,fontWeight:draft.trade_style?400:700,color:draft.trade_style?"var(--ink)":"var(--down)"}}>
        <option value="">取引タイプ*</option><option value="DAY">DAY（デイトレ）</option><option value="SWING">SWING（スイング）</option>
      </select>
      <input placeholder="株数" value={draft.quantity} onChange={e=>setDraft({...draft,quantity:e.target.value})} style={fieldStyle}/>
      <input placeholder="平均取得単価（実際の約定単価）" value={draft.average_price} onChange={e=>setDraft({...draft,average_price:e.target.value})} style={fieldStyle}/>
      <input type="date" value={draft.acquired_at} onChange={e=>setDraft({...draft,acquired_at:e.target.value})} style={fieldStyle}/>
    </div>
    {/* 指示書5・7番：確定した銘柄の現在値を参考表示（average_priceには絶対に自動で入れない）。
        指示書12番：既に同じ銘柄・市場のポジションがある場合の警告（保存時にも再度confirmする）。 */}
    {(previewQuote||duplicatePosition) && <div style={{fontSize:11.5,marginBottom:8,display:"flex",flexWrap:"wrap",gap:10,alignItems:"center"}}>
      {previewQuote && <span style={{color:"var(--inkSoft)"}}>現在値（参考） <span className="mono" style={{fontWeight:700,color:"var(--ink)"}}>{num(previewQuote.t)?.toLocaleString()??"—"}</span>円</span>}
      {duplicatePosition && <span style={{color:"var(--accent)",fontWeight:700}}>⚠ 既にポジションにあります（{num(duplicatePosition.quantity)?.toLocaleString()}株 @{num(duplicatePosition.average_price)?.toLocaleString()}円）。追加建て（加重平均で合算）として登録されます。</span>}
    </div>}
    <div className="position-add-grid-2" style={{display:"grid",gridTemplateColumns:"90px 90px 90px 1fr auto auto",gap:6,marginBottom:6,alignItems:"center"}}>
      <input placeholder="初期SL" value={draft.initial_stop} onChange={e=>setDraft({...draft,initial_stop:e.target.value})} style={fieldStyle}/>
      <input placeholder="利確①" value={draft.target_1} onChange={e=>setDraft({...draft,target_1:e.target.value})} style={fieldStyle}/>
      <input placeholder="利確②" value={draft.target_2} onChange={e=>setDraft({...draft,target_2:e.target.value})} style={fieldStyle}/>
      <input placeholder="メモ" value={draft.memo} onChange={e=>setDraft({...draft,memo:e.target.value})} style={fieldStyle}/>
      {analysisForDraft && <button className="action-btn" type="button" onClick={applyAnalysisValues} title="トレード分析タブでのこの銘柄のstop/利確①/利確②を下書きに反映します（参考値。実際の取得単価は上の欄に手入力してください）">分析値を使う</button>}
      <button className="btn" onClick={save} disabled={saving||!draft.code.trim()||!draft.trade_style} title={!draft.trade_style?"取引タイプ（DAY/SWING）の選択が必須です":undefined}>追加</button>
    </div>
    {/* 指示書4番：監視銘柄への自動追加はしない。チェックした場合のみ既存のsetWatchlistJP/US
        （Neon同期込み）を呼び出す。監視銘柄とポジションは引き続き別データとして管理する。 */}
    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
      <label style={{fontSize:11.5,color:"var(--inkSoft)",display:"flex",alignItems:"center",gap:5,cursor:"pointer"}}>
        <input type="checkbox" checked={alsoWatch} onChange={e=>setAlsoWatch(e.target.checked)}/>
        監視銘柄にも追加する
      </label>
      {watchAddMsg && <span style={{fontSize:11,color:"var(--inkSoft)"}}>{watchAddMsg}</span>}
    </div>
    {loading
      ? <div style={{fontSize:12,color:"var(--inkFaint)"}}>読み込み中…</div>
      : items.length===0
        ? <div style={{fontSize:12,color:"var(--inkFaint)"}}>まだ保有株の登録がありません。</div>
        : <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",gap:8}}>
            {items.map(it=>{
              const current=num(stockQuotes?.[it.code]?.t);
              const {amount:pnlAmount,pct:pnlPct}=calcUnrealizedPnl(it.average_price,it.quantity,current);
              const basisPrice=it.average_price??current;
              const rr=calcPositionRR(it.target_1,basisPrice,it.current_stop);
              const trailKey=deriveTrailingStatus(it.current_stop,it.initial_stop,it.average_price,current);
              const trailMeta=TRAILING_STATUS_META[trailKey];
              const editingStop=stopDraftFor===it.code+it.market;
              // 2026-09-10更新（損切りルール是正・最優先修正）：全トレードスタイル共通の
              // EXIT RULE（-8%）。他のいかなる判定より優先表示する。
              const exitPrice=calcPositionExitPrice(it.average_price);
              const riskTier=evaluatePositionRiskRule(pnlPct);
              const riskMeta=riskTier?POSITION_RISK_RULE_META[riskTier]:null;
              // v3-8 Step4：ポジション専用Status。銘柄分析用のPrimary/Action Status（enr）とは
              // 別ロジックで、あくまで保有判断専用（enrはこの下で「参考情報」としてのみ添える）。
              // Step5：DAY/SWING別チャート崩れ判定用にindicators（VWAP・5日線・25日線・当日高値）
              // も渡す（analysisData、既存の分析結果をそのまま再利用。新規取得なし）。
              const posFlags=analysisData?.[it.code]?.positionFlags;
              const posIndicators=analysisData?.[it.code]?.indicators;
              const enr=analysisEnrichedMap?.get(it.code);
              // Step9：最良気配（stockQuotesが立花証券API接続時に上書きするask/bid、新規取得なし）
              const boardAsk=num(stockQuotes?.[it.code]?.ask);
              const boardBid=num(stockQuotes?.[it.code]?.bid);
              const posResult=derivePositionStatus({avgPrice:it.average_price,tradeStyle:it.trade_style,
                current,currentStop:it.current_stop,initialStop:it.initial_stop,target1:it.target_1,
                positionFlags:posFlags,pnlPct,indicators:posIndicators,enrStatus:enr?.status,
                ask:boardAsk,bid:boardBid});
              const posMeta=POSITION_STATUS_META[posResult.status];
              // v3-8 Step8（UIカード再設計）：表示順を「取引タイプ→ポジションStatus→取得値/現在値/
              // 損益→HARD STOP/現在SL→Trailing/利確候補→チャート・出来高警戒（Statusの理由として
              // 既に列挙）→判断理由→操作」に統一。既存のENTRY READY等（enr、銘柄分析用の参考情報）
              // は主役にせず、末尾に小さく添えるだけにする。ロジック自体（derivePositionStatus等）は
              // 変更しない、表示順のみの並び替え。
              return <div key={it.code+it.market} style={{border:"1px solid var(--rule)",borderRadius:5,padding:"10px 12px",background:"var(--bg)"}}>
                {/* ① 取引タイプ（ヘッダー：銘柄名・コード・DAY/SWING切替・削除） */}
                <div style={{display:"flex",alignItems:"baseline",gap:8}}>
                  <span style={{fontWeight:800,fontSize:13.5}}>{it.name||it.code}</span>
                  <span className="mono" style={{fontSize:11,color:"var(--inkFaint)"}}>{it.code}</span>
                  {it.trade_style && <button className="iconbtn" style={{fontSize:10.5,fontWeight:700,color:"var(--inkSoft)",border:"1px solid var(--rule)",borderRadius:3,padding:"1px 6px"}}
                    title="クリックでDAY⇔SWINGを切り替え"
                    onClick={()=>saveTradeStyle(it,it.trade_style==="DAY"?"SWING":"DAY")}>
                    {it.trade_style==="DAY"?"DAY":"SWING"}</button>}
                  <button className="iconbtn" style={{marginLeft:"auto"}} title="削除" onClick={()=>remove(it.code,it.market)}>×</button>
                </div>
                {!it.trade_style && <div style={{display:"flex",alignItems:"center",gap:6,marginTop:4,fontSize:11,color:"var(--down)"}}>
                  ⚠ 取引タイプ未設定：
                  <button className="action-btn" style={{fontSize:10.5,padding:"2px 8px"}} onClick={()=>saveTradeStyle(it,"DAY")}>DAYに設定</button>
                  <button className="action-btn" style={{fontSize:10.5,padding:"2px 8px"}} onClick={()=>saveTradeStyle(it,"SWING")}>SWINGに設定</button>
                </div>}

                {/* ② ポジションStatus（このカードの主役。HOLD_STRONG〜STOPの8状態） */}
                <div style={{display:"flex",alignItems:"center",gap:6,marginTop:8}}>
                  <span style={{fontSize:13,fontWeight:800,color:posMeta.color,border:`1px solid ${posMeta.color}`,borderRadius:3,padding:"3px 9px"}}>
                    {posMeta.icon} {posMeta.label}
                  </span>
                </div>

                {/* ③ 取得値/現在値/損益 */}
                <div className="mono" style={{fontSize:12,color:"var(--inkSoft)",marginTop:8}}>
                  {it.quantity!=null?`${it.quantity.toLocaleString()}株`:"—株"} @ {it.average_price!=null?it.average_price.toLocaleString():"—"}
                  {"　現在 "}{current!=null?current.toLocaleString():"—"}
                  {/* v3-8 Step9：最良気配（立花証券API接続時のみ）。板の深さ・数量は取得できないため
                      表示もbid/askとスプレッドのみ。あくまで参考の補助情報。 */}
                  {boardBid!=null && boardAsk!=null && <span style={{color:"var(--inkFaint)",fontSize:11}}>
                    {"　気配 "}{boardBid.toLocaleString()}/{boardAsk.toLocaleString()}
                  </span>}
                </div>
                <div className="mono" style={{fontSize:15,fontWeight:800,marginTop:2,
                    color:pnlAmount==null?"var(--inkFaint)":pnlAmount>0?"var(--up)":pnlAmount<0?"var(--down)":"var(--inkSoft)"}}>
                  {pnlAmount!=null?`${pnlAmount>0?"+":""}${Math.round(pnlAmount).toLocaleString()}円`:"—"}
                  {pnlPct!=null && <span style={{fontSize:12,fontWeight:700,marginLeft:6}}>({pnlPct>0?"+":""}{pnlPct.toFixed(2)}%)</span>}
                </div>

                {/* ④ EXIT RULE／現在SL（2026-09-10更新：全トレードスタイル共通-8%ルール） */}
                {riskMeta && <div style={{marginTop:8,padding:"6px 9px",
                    background:"var(--downBg)",border:`1.5px solid ${riskMeta.color}`,borderRadius:3,
                    fontSize:11.5,fontWeight:800,color:riskMeta.color}}>
                  <div>{riskMeta.title}</div>
                  <div style={{fontWeight:600,marginTop:2}}>{riskMeta.label}（取得単価比 {pnlPct!=null?pnlPct.toFixed(1):"—"}%）</div>
                  {riskTier==="EXIT" && <>
                    <div style={{fontWeight:800,fontSize:13,marginTop:4}}>{riskMeta.action}</div>
                    <div style={{fontWeight:400,fontSize:11,marginTop:2,color:"var(--inkSoft)"}}>{riskMeta.note}</div>
                  </>}
                </div>}
                <div style={{display:"flex",flexWrap:"wrap",gap:10,marginTop:8,fontSize:12,alignItems:"center"}}>
                  {exitPrice!=null && <div title="全トレードスタイル共通・取得単価×0.92（-8%）。自信度・材料等いかなる他条件に関わらずこれを下回れば一旦売却が原則（再エントリーは新しいトレードとして別途判断）。">
                    <span style={{color:"var(--down)"}}>EXIT RULE </span>
                    <span className="mono" style={{fontWeight:700,color:"var(--down)"}}>{Math.round(exitPrice).toLocaleString()}</span>
                    <span style={{color:"var(--inkFaint)"}}>（{POSITION_RISK_RULES.maxLossPct}%）</span>
                  </div>}
                  <div>
                    <span style={{color:"var(--inkSoft)"}}>SL </span>
                    <span className="mono">{it.initial_stop!=null?it.initial_stop.toLocaleString():"—"}</span>
                    <span style={{color:"var(--inkFaint)"}}> → 現在SL </span>
                    {editingStop
                      ? <span style={{display:"inline-flex",gap:4,alignItems:"center"}}>
                          <input autoFocus value={stopDraftVal} onChange={e=>setStopDraftVal(e.target.value)}
                            onKeyDown={e=>{if(e.key==="Enter")saveCurrentStop(it);if(e.key==="Escape")setStopDraftFor(null);}}
                            style={{...fieldStyle,width:70,padding:"2px 5px"}}/>
                          <button className="action-btn" style={{fontSize:10,padding:"2px 5px"}} onClick={()=>saveCurrentStop(it)}>保存</button>
                        </span>
                      : <span className="mono" style={{fontWeight:700,cursor:"pointer",borderBottom:"1px dashed var(--inkFaint)"}}
                          title="クリックして現在SLを変更"
                          onClick={()=>{setStopDraftFor(it.code+it.market);setStopDraftVal(it.current_stop??it.initial_stop??"");}}>
                          {it.current_stop!=null?it.current_stop.toLocaleString():"未設定"}
                        </span>}
                  </div>
                </div>

                {/* ⑤ Trailing／利確候補 */}
                <div style={{display:"flex",flexWrap:"wrap",gap:10,marginTop:6,fontSize:12,alignItems:"center"}}>
                  <span style={{fontSize:10.5,fontWeight:700,color:trailMeta.color,border:`1px solid ${trailMeta.color}`,borderRadius:3,padding:"1px 6px"}}>状態：{trailMeta.label}</span>
                  {posResult.suggestedTrailingStop!=null && <span style={{fontSize:11,color:"var(--up)"}}>
                    トレーリング目安SL <span className="mono" style={{fontWeight:700}}>{posResult.suggestedTrailingStop.toLocaleString()}</span>
                  </span>}
                  <div><span style={{color:"var(--inkSoft)"}}>TP1 </span><span className="mono">{it.target_1!=null?it.target_1.toLocaleString():"—"}</span></div>
                  <div><span style={{color:"var(--inkSoft)"}}>TP2 </span><span className="mono">{it.target_2!=null?it.target_2.toLocaleString():"—"}</span></div>
                  <div><span style={{color:"var(--inkSoft)"}}>RR </span><span className="mono" style={{fontWeight:700}}>{rr!=null?`1 : ${rr.toFixed(2)}`:"--"}</span></div>
                </div>

                {/* ⑥⑦ チャート・出来高警戒／判断理由（Step3〜6のフラグはposResult.reasonsに集約済み。
                    ここでは省略せず全件表示する） */}
                {posResult.reasons.length>0 && <div style={{marginTop:8,padding:"6px 8px",background:"var(--card)",border:"1px solid var(--rule)",borderRadius:3}}>
                  <div style={{fontSize:10.5,fontWeight:700,color:"var(--inkSoft)",marginBottom:2}}>判断理由</div>
                  <ul style={{margin:0,paddingLeft:16,fontSize:11,color:"var(--inkSoft)"}}>
                    {posResult.reasons.map((r,i)=><li key={i}>{r}</li>)}
                  </ul>
                </div>}

                {/* v3-9続き（PHASE 3）：イベント接近（参考情報のみ、Statusには不干渉）。
                    trade_styleに応じてDAY/SWINGで扱いを変える注記を添える。 */}
                <EventRiskNote events={marketEvents} code={it.code} sector={it.sector} tradeStyle={it.trade_style}/>
                {/* v3-9続き（PHASE 4）：カタリスト接近（参考情報のみ、Statusには不干渉）。 */}
                <CatalystNote catalysts={newsCatalysts} code={it.code} sector={it.sector}/>
                {/* v3-9続き（PHASE 5）：EXPERT VIEW（参考情報のみ、ポジション判定ロジックには使わない）。
                    ユーザー指定のモックアップに合わせ、ポジションカードでは一行要約（compact）で表示する。 */}
                <ExpertViewNote views={expertViews} code={it.code} sector={it.sector} market={it.market} compact/>

                {/* ⑨ リアルタイム売却判断エリア（Phase1〜3）。「リアルタイム」ボタンで展開している
                    ポジションのみ、PositionLiveDetailが/api/position-liveを一定間隔でポーリングする。
                    同時に1銘柄のみ展開可能（expandedLiveCode、item17のAPI負荷対策）。
                    2026-09-07追加（実機フィードバック）：既存カードに埋もれて新機能だと分からない
                    という指摘を受け、トグルボタンをaccent色・フル幅にして視認性を上げた。 */}
                <div style={{marginTop:8}}>
                  <button className="btn" style={{fontSize:12,width:"100%",background:"var(--accent)",color:"#fff",border:"none"}}
                    onClick={()=>setExpandedLiveCode(k=>k===(it.code+it.market)?null:(it.code+it.market))}>
                    {expandedLiveCode===(it.code+it.market)?"📊 リアルタイム売却判断 ▲ 閉じる":"📊 リアルタイム売却判断を開く ▼"}
                  </button>
                  {expandedLiveCode===(it.code+it.market) && <PositionLiveDetail item={it} onOpenExit={openExit}
                    posFlags={posFlags} posIndicators={posIndicators} enrStatus={enr?.status}/>}
                </div>

                {/* ⑧ 操作・参考情報・メモ */}
                <div style={{display:"flex",alignItems:"center",gap:6,marginTop:8,flexWrap:"wrap"}}>
                  {positionConsultMsg && <span style={{fontSize:10.5,color:"var(--accent)",fontWeight:700}}>{positionConsultMsg}</span>}
                  <button className="action-btn" style={{fontSize:11}} onClick={()=>copyPositionConsult(it)}>🤖 利確・損切り相談</button>
                  {/* v3-9続き（2026-09-07）：売却・買い増し。実現損益の自動計算・通算実現損益の
                      更新・全株売却時の自動削除はサーバー側（add_position_exit）が行う。 */}

                  <button className="action-btn" style={{fontSize:11}} onClick={()=>setEntryModalFor({code:it.code,name:it.name,market:it.market})}>➕ 買い増し</button>
                  {/* 2026-09-09新規（監視銘柄・市場チャートの時間足切替、対象画面「ポジション画面」対応）：
                      他画面と全く同じ共通ChartModalをここからも開けるようにした。 */}
                  {onOpenChart && <button className="action-btn" style={{fontSize:11}} onClick={()=>onOpenChart(it)}>📈 チャート</button>}
                </div>
                {enr && <div style={{fontSize:10,color:"var(--inkFaint)",marginTop:4}}>
                  （参考・新規エントリー判断用の指標であり保有判断には使用していません：銘柄分析 {PRIMARY_STATUS_META[enr.status]?.label||enr.status}
                  {enr.actionStatus&&enr.actionStatus!=="NONE"?`・${ACTION_STATUS_META[enr.actionStatus]?.label||enr.actionStatus}`:""}）
                </div>}
                {it.memo && <div style={{fontSize:11,color:"var(--inkFaint)",marginTop:4}}>{it.memo}</div>}
              </div>;
            })}
          </div>}
    </div>

      needsTradeStyle={false} onClose={()=>setEntryModalFor(null)} onSaved={afterEntrySaved}/>}
    {exitModalFor && <PositionExitModal position={exitModalFor}
      currentPrice={exitPriceOverride??num(stockQuotes?.[exitModalFor.code]?.t)}
      onClose={()=>{setExitModalFor(null);setExitPriceOverride(null);}} onSaved={afterExitSaved}/>}
  </>;
}

// 投資判断ログタブ（2026-09-02新規）：日次の相場観＋銘柄ごとの評価をサーバーDB（Neon）に保存する。
// 「記録」タブでのDB移行が済んでいなくても閲覧・作成はできる（journal/myRulesの移行有無とは
// 独立した機能）が、DB自体（DATABASE_URL）が未設定のサーバーでは保存も一覧取得もできない。
function InvestmentLogPanel({marketEnvAuto,usMarketAuto,interestRateAuto,fxAuto,oilAuto,sectorStrengthAuto,watchTargetItems}){
  const emptyDraft=()=>({date:todayISO(),market_env:marketEnvAuto,us_market:usMarketAuto,interest_rate:interestRateAuto,
    fx:fxAuto,oil:oilAuto,sector_strength:sectorStrengthAuto,chatgpt_view:"",my_view:"",reflection:""});
  const [draft,setDraft]=useState(emptyDraft);
  const [judgments,setJudgments]=useState([]);
  const [saving,setSaving]=useState(false);
  const [msg,setMsg]=useState("");
  const [logs,setLogs]=useState([]);
  const [loading,setLoading]=useState(true);
  const [expanded,setExpanded]=useState(()=>new Set());
  const [filterCode,setFilterCode]=useState("");

  const loadLogs=async(code)=>{
    setLoading(true);
    try{
      const qs=code?("?code="+encodeURIComponent(code)):"";
      const r=await fetch("/api/investment-log"+qs);
      if(r.ok){const d=await r.json();setLogs(Array.isArray(d.logs)?d.logs:[]);}
      else{setLogs([]);}
    }catch(e){setLogs([]);}
    setLoading(false);
  };
  useEffect(()=>{loadLogs(filterCode);},[filterCode]);

  const addJudgmentRow=(code,name)=>{
    if(judgments.some(j=>j.code===code))return;
    setJudgments(js=>[...js,{code:code||"",name:name||"",category:"監視"}]);
  };
  const updateJudgmentRow=(idx,patch)=>setJudgments(js=>js.map((j,i)=>i===idx?{...j,...patch}:j));
  const removeJudgmentRow=(idx)=>setJudgments(js=>js.filter((_,i)=>i!==idx));

  const save=async()=>{
    setSaving(true);setMsg("");
    try{
      const r=await fetch("/api/investment-log/create",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({dailyLog:draft,judgments})});
      if(r.ok){
        const d=await r.json();
        if(d.error){setMsg("保存失敗："+d.error);}
        else{setMsg("保存しました（ID "+d.id+"）");setDraft(emptyDraft());setJudgments([]);loadLogs(filterCode);}
      }else{setMsg("保存に失敗しました。サーバーが起動しているか確認してください。");}
    }catch(e){setMsg("保存に失敗しました。サーバーが起動しているか確認してください。");}
    setSaving(false);
  };

  const deleteLog=async(id)=>{
    if(!confirm("このログを削除しますか？"))return;
    try{
      await fetch("/api/investment-log/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})});
      loadLogs(filterCode);
    }catch(e){}
  };

  const toggleExpand=(id)=>setExpanded(prev=>{const n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n;});

  const labelStyle={fontSize:11,color:"var(--inkSoft)",display:"block",marginBottom:2};

  return <div style={{marginTop:18}}>
    <div className="sec-head">投資判断ログ</div>

    <div className="card" style={{padding:"14px 16px",marginBottom:16}}>
      <div style={{fontWeight:700,marginBottom:10}}>新規ログ</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:10,marginBottom:10}}>
        <label><span style={labelStyle}>日付</span><input type="date" value={draft.date} onChange={e=>setDraft({...draft,date:e.target.value})} style={fieldStyle}/></label>
        <label><span style={labelStyle}>金利</span><input value={draft.interest_rate||""} onChange={e=>setDraft({...draft,interest_rate:e.target.value})} style={fieldStyle}/></label>
        <label><span style={labelStyle}>為替</span><input value={draft.fx||""} onChange={e=>setDraft({...draft,fx:e.target.value})} style={fieldStyle}/></label>
        <label><span style={labelStyle}>原油</span><input value={draft.oil||""} onChange={e=>setDraft({...draft,oil:e.target.value})} style={fieldStyle}/></label>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",gap:10,marginBottom:10}}>
        <label><span style={labelStyle}>市場全体の地合い</span><textarea rows={2} value={draft.market_env||""} onChange={e=>setDraft({...draft,market_env:e.target.value})} style={fieldStyle}/></label>
        <label><span style={labelStyle}>米国市場の状況</span><textarea rows={2} value={draft.us_market||""} onChange={e=>setDraft({...draft,us_market:e.target.value})} style={fieldStyle}/></label>
        <label><span style={labelStyle}>セクター強弱</span><textarea rows={2} value={draft.sector_strength||""} onChange={e=>setDraft({...draft,sector_strength:e.target.value})} style={fieldStyle}/></label>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",gap:10,marginBottom:10}}>
        <label><span style={labelStyle}>ChatGPTの判断（全体観）</span><textarea rows={3} value={draft.chatgpt_view||""} onChange={e=>setDraft({...draft,chatgpt_view:e.target.value})} style={fieldStyle}/></label>
        <label><span style={labelStyle}>自分の判断（全体観）</span><textarea rows={3} value={draft.my_view||""} onChange={e=>setDraft({...draft,my_view:e.target.value})} style={fieldStyle}/></label>
        <label><span style={labelStyle}>反省点</span><textarea rows={3} value={draft.reflection||""} onChange={e=>setDraft({...draft,reflection:e.target.value})} style={fieldStyle}/></label>
      </div>

      <div style={{borderTop:"1px solid var(--ruleSoft)",paddingTop:10,marginTop:4}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8,marginBottom:8}}>

          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {watchTargetItems.slice(0,12).map(w=>
              <button key={w.code} className="action-btn" onClick={()=>addJudgmentRow(w.code,w.name)}>＋{w.name}</button>)}

          </div>
        </div>
        {judgments.length===0 && <div style={{fontSize:12,color:"var(--inkFaint)"}}>上のボタン（監視銘柄）から追加するか、下のコード欄に直接入力してください。</div>}
        {judgments.map((j,idx)=>
          <div key={idx} style={{border:"1px solid var(--rule)",borderRadius:4,padding:"10px 12px",marginBottom:8,background:"var(--band)"}}>
            <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",marginBottom:8}}>
              <input value={j.code} onChange={e=>updateJudgmentRow(idx,{code:e.target.value})} placeholder="コード" style={{...fieldStyle,width:90}}/>
              <input value={j.name} onChange={e=>updateJudgmentRow(idx,{name:e.target.value})} placeholder="銘柄名" style={{...fieldStyle,width:140}}/>
              <select value={j.category} onChange={e=>updateJudgmentRow(idx,{category:e.target.value})} style={{...fieldStyle,width:100}}>
                {JUDGMENT_CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}
              </select>
              <button className="iconbtn" style={{marginLeft:"auto"}} onClick={()=>removeJudgmentRow(idx)}>×</button>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:8}}>
              {JUDGMENT_FIELDS.map(([col,label])=>
                <label key={col}><span style={labelStyle}>{label}</span>
                  <textarea rows={2} value={j[col]||""} onChange={e=>updateJudgmentRow(idx,{[col]:e.target.value})} style={fieldStyle}/>
                </label>)}
            </div>
          </div>)}
      </div>

      <div style={{display:"flex",alignItems:"center",gap:10,marginTop:10}}>
        <button className="btn primary" onClick={save} disabled={saving}>{saving?"保存中…":"ログを保存"}</button>
        {msg && <span style={{fontSize:12,color:"var(--inkSoft)"}}>{msg}</span>}
      </div>
    </div>

    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8,marginBottom:8}}>
      <div style={{fontWeight:700}}>過去のログ</div>
      <input value={filterCode} onChange={e=>setFilterCode(e.target.value)} placeholder="銘柄コードで絞り込み（例：6981）"
        style={{...fieldStyle,width:220}}/>
    </div>
    {loading
      ? <div style={{fontSize:12.5,color:"var(--inkSoft)"}}>読み込み中…</div>
      : logs.length===0
        ? <div style={{padding:22,textAlign:"center",color:"var(--inkSoft)",fontSize:13,border:"1px solid var(--rule)",borderRadius:4,background:"var(--card)"}}>
            まだログがありません（DATABASE_URL未設定の場合はこの機能は使えません）。
          </div>
        : <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {logs.map(log=>{
              const isOpen=expanded.has(log.id);
              return <div key={log.id} className="card" style={{padding:"10px 14px"}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8,cursor:"pointer"}} onClick={()=>toggleExpand(log.id)}>

                  {log.fx && <div>為替：{log.fx}</div>}
                  {log.oil && <div>原油：{log.oil}</div>}

                  {log.chatgpt_view && <div>ChatGPTの判断：{log.chatgpt_view}</div>}
