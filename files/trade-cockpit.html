<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>トレード・コックピット</title>
<style>
/* ===== デザイントークン（design_renewal_instruction.md）=====
   ムームー証券アプリを参考にした鮮やかな配色・タイポグラフィ・ダークモード対応。
   単体HTML構成（ビルド工程なし、CLAUDE.md方針）を維持するため、別ファイルの
   design-tokens.jsonではなくこのCSS変数群に集約する。
   注意：上昇/下落の色は日本の相場慣習（赤=上昇・緑=下落）を維持するため、
   指示書の「上昇=緑系」の鮮やかな数値は当アプリの赤(--up)に、
   「下落=赤系」の数値は当アプリの緑(--down)に、意味を保ったまま割り当てている。 */
:root{
  --paper:#FFFFFF; --paperAlt:#FFFFFF; --card:#F2F3F5; --ink:#1A1A1A; --inkSoft:#666666; --inkFaint:#999999;
  --rule:#DDDDDD; --ruleSoft:#EAEAEA; --band:#F2F3F5;
  --gain:#00A868; --loss:#E0334A; --accent:#FF7A17; --accentSoft:rgba(255,122,23,.15);
  --star:#B8863B; --warn:#FFA500;
  --alarm:#FFF3D6; --alarmEdge:#B8860B; --alarmText:#1A1A1A;
  --up:#FF4D5C; --down:#00B366; --upBg:#FFE3E5; --downBg:#DFF7EC;
  --shadow:none; --shadowLg:0 12px 32px rgba(0,0,0,.16);
}
:root[data-theme="dark"]{
  --paper:#101012; --paperAlt:#1C1C1E; --card:#1C1C1E; --ink:#FFFFFF; --inkSoft:#CCCCCC; --inkFaint:#909090;
  --rule:#333333; --ruleSoft:#2A2A2A; --band:#1C1C1E;
  --gain:#00D084; --loss:#FF6B78; --accent:#FF9142; --accentSoft:rgba(255,145,66,.2);
  --star:#D9A64E; --warn:#FFB84D;
  --alarm:#3A2A0A; --alarmEdge:#FFA500; --alarmText:#FFF3D6;
  --up:#FF8A93; --down:#4DFFB0; --upBg:rgba(255,77,92,.22); --downBg:rgba(0,208,132,.2);
  --shadow:none; --shadowLg:0 16px 40px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{background-color:var(--paper)}
body{margin:0;background-color:var(--paper);color:var(--ink);font-size:15px;min-height:100vh;
  font-family:'Segoe UI','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,Arial,sans-serif}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding:22px 18px 46px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;
  border-bottom:2px solid var(--ink);padding-bottom:12px}
.kicker{font-size:11px;letter-spacing:3px;color:var(--inkSoft);text-transform:uppercase}
h1{margin:3px 0 0;font-size:28px;font-weight:700;line-height:1.2;letter-spacing:-.4px}
/* テーマ切り替えトグル（3-1章） */
.theme-toggle{display:inline-flex;align-items:center;gap:6px;background:var(--paperAlt);color:var(--inkSoft);
  border:1px solid var(--rule);padding:7px 12px;font-size:13px;border-radius:8px;cursor:pointer}
.theme-toggle:hover{background:var(--band)}
/* 10-1章：タブ数が増えても横スクロールで収まるようにする（4-3章：タブバーのスタイル統一） */
.tabs{display:flex;gap:4px;margin-top:16px;background:var(--band);border-radius:8px 8px 0 0;
  padding:2px 4px 0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.tabs::-webkit-scrollbar{height:6px}
.tabs::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}
.tab{background:transparent;border:none;border-bottom:3px solid transparent;color:var(--inkSoft);
  font-size:15px;padding:9px 16px;cursor:pointer;font-weight:600;flex:none;white-space:nowrap;transition:color .15s}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:800}
.sec-head{font-size:22px;font-weight:600;line-height:1.3;margin:0 0 4px}
.sec-note{font-size:13px;color:var(--inkSoft);margin-bottom:10px}
.card{border:none;background:var(--card);border-radius:14px;padding:14px 16px 16px;
  box-shadow:var(--shadow);transition:background-color .2s ease,border-color .2s ease}
.card-t{font-size:18px;font-weight:600;line-height:1.4}
.card-n{font-size:13px;color:var(--inkSoft);margin-top:2px}
.card-hd{border-bottom:1px solid var(--ruleSoft);padding-bottom:8px;margin-bottom:10px}
.grid{display:grid;gap:16px}
.btn{display:inline-flex;align-items:center;gap:6px;border:none;padding:10px 18px;font-size:14px;
  border-radius:8px;cursor:pointer;font-weight:600;transition:filter .15s,box-shadow .15s}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.ghost{display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--inkSoft);
  border:1px solid var(--rule);padding:9px 14px;font-size:14px;border-radius:8px;cursor:pointer;transition:background-color .15s}
.ghost:hover{background:var(--band)}
/* 登録銘柄行の「チャート」「分析」ボタンなど、背景が塗り分け配色（ヒートマップ風）のセル上に
   置かれるボタン用。透明な.ghostだと濃い背景に埋もれて見えにくくなるため、常に不透明な背景を持たせる */
.action-btn{display:inline-flex;align-items:center;gap:5px;background:var(--paperAlt);color:var(--ink);
  border:1px solid rgba(127,127,127,.35);padding:5px 10px;font-size:12.5px;font-weight:600;border-radius:6px;
  cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:filter .15s}
.action-btn:hover{filter:brightness(.94)}
.action-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.iconbtn{background:transparent;border:none;color:var(--inkSoft);cursor:pointer;padding:4px;font-size:15px}
input,select,textarea{padding:10px 12px;border:1px solid var(--rule);background:var(--paperAlt);
  color:var(--ink);font-size:14px;border-radius:6px;font-family:inherit;transition:border-color .15s,box-shadow .15s}
input::placeholder,textarea::placeholder{color:var(--inkFaint)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
textarea{resize:vertical;line-height:1.6;width:100%}
label.fld{display:block;margin-top:8px}
label.fld span{font-size:12px;color:var(--inkSoft);display:block;margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{padding:8px 10px;font-size:12px;font-weight:600;text-align:left;white-space:nowrap;color:var(--inkSoft)}
td{padding:7px 10px;vertical-align:middle}
.lbl{font-size:12px;color:var(--inkSoft);margin:8px 0 4px}
.chip{font-size:13px;padding:4px 10px;border-radius:16px;cursor:pointer;border:1px solid var(--rule);
  background:var(--paperAlt);color:var(--inkSoft);transition:background-color .15s,color .15s}
.chip:hover{background:var(--band)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.alarm{background:var(--alarm);color:var(--alarmText);border:2px solid var(--alarmEdge);border-radius:8px;
  padding:16px 18px;display:flex;align-items:center;gap:13px;animation:almPulse 1.2s ease-in-out infinite}
@keyframes almPulse{0%,100%{opacity:1}50%{opacity:.82}}
.foot{margin-top:16px;font-size:13px;color:var(--inkSoft);line-height:1.7}
.results{position:absolute;z-index:5;left:0;right:0;margin-top:4px;background:var(--paperAlt);
  border:1px solid var(--rule);border-radius:8px;box-shadow:var(--shadowLg);overflow:hidden}
.res-row{display:flex;width:100%;align-items:center;gap:10px;padding:9px 12px;background:transparent;
  border:none;border-bottom:1px solid var(--ruleSoft);cursor:pointer;text-align:left}
.res-row:hover{background:var(--band)}
.loading{max-width:400px;margin:80px auto;text-align:center;color:var(--inkSoft)}
.news-list{display:block}
.news-item{display:flex;gap:9px;align-items:center;padding:10px 4px;
  border-bottom:1px solid var(--ruleSoft);text-decoration:none;color:var(--ink)}
.news-item:last-child{border-bottom:none}
.news-item:hover{background:var(--band)}
.news-item:hover .news-title{color:var(--accent);text-decoration:underline}
.news-tag{flex:none;font-size:11px;font-weight:700;color:var(--accent);background:var(--paperAlt);
  border:1px solid var(--rule);border-radius:3px;padding:1px 6px;white-space:nowrap}
.news-body{flex:1;min-width:0}
.news-title{font-size:14px;line-height:1.5}
.news-summary{display:block;font-size:12px;line-height:1.5;color:var(--inkSoft);margin-top:4px}
.news-meta{display:block;font-size:11px;color:var(--inkFaint);margin-top:3px}
.news-empty{font-size:12px;color:var(--inkSoft);padding:16px 4px}
/* 9-2章：重大ニュースの強調表示（4-6章：アラート仕様に統一） */
.news-item.important{background:var(--upBg);border-left:3px solid var(--up);padding-left:8px;margin-left:-1px}
.news-item.important:hover{background:var(--upBg)}
.news-alert-badge{flex:none;font-size:10.5px;font-weight:700;color:#fff;background:var(--up);
  border-radius:3px;padding:2px 6px;white-space:nowrap;align-self:center}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
/* 10-5章：ニュース項目のサムネイル（実画像は取得できないため、出典名の頭文字によるアバター） */
.news-thumb{flex:none;width:42px;height:42px;border-radius:6px;background:var(--band);color:var(--inkSoft);
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;align-self:center;
  box-shadow:var(--shadow)}
/* 10-5章：重要ニュース通知バナー（ページ最上部に常設、オン/オフ切り替え可。4-6章：warning系に統一） */
.notify-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  background:var(--alarm);color:var(--alarmText);border:2px solid var(--alarmEdge);border-radius:8px;padding:10px 14px;margin-bottom:12px}
</style>
</head>

// ===== カラールール（セクター・銘柄共通。3章の仕様）=====
// 上昇率(%)は0.5%刻みで6段階(0-0.5/0.5-1.0/1.0-1.5/1.5-2.0/2.0-2.5/2.5超)に区分し、1段階ずつ赤/緑を濃くする。
// 最終段階(2.5%超)は上限なくすべて同じ最も濃い色で頭打ちにする。
// レベル1（0%超〜0.5%）は現状使用している --up / --down の色そのものを「最も薄い色」の基準として使う。
const CHANGE_STEP = 0.5;
const CHANGE_MAX_LEVEL = 6; // 0.5%刻み6段階。2.5%超は全て最終段階（最大濃度）

// design_renewal_instruction.md：ムームー証券を参考にした鮮やかな配色をライト/ダークそれぞれで定義。
// 日本の相場慣習（赤=上昇・緑=下落）は維持し、指示書の「上昇=緑系」の数値は当アプリの赤に、
// 「下落=赤系」の数値は当アプリの緑に、意味を保ったまま割り当てている。
// ダークモードでは背景が暗いため、レベル6（最濃）を黒に近づけるのではなく、より明るく彩度の高い
// 色にすることで視認性を確保する（3-4章：ダークモード時のコントラスト確認）。
const COLOR_PALETTE = {
  light: {upBase:"#FF4D5C", upDark:"#8B0000", downBase:"#00B366", downDark:"#00522E", upBg:"#FFE3E5", downBg:"#DFF7EC"},
  dark:  {upBase:"#FF8A93", upDark:"#FF3B4E", downBase:"#4DFFB0", downDark:"#00E676", upBg:"rgba(255,77,92,.22)", downBg:"rgba(0,208,132,.22)"},
};
// 3-2章：CSS変数だけでなくJS側の色計算（changeColor/Sparkline）もテーマに応じて出し分ける必要があるため、
// App内のテーマ切り替えエフェクトでこのモジュール変数を更新する（single-file構成のためprops経由にせず共有）。
let CURRENT_THEME = "light";
const setColorTheme=(t)=>{CURRENT_THEME=(t==="dark")?"dark":"light";};

const hexToRgb=(h)=>{
  if(h.startsWith("rgba")){const m=h.match(/[\d.]+/g);return [+m[0],+m[1],+m[2]];}
  const n=parseInt(h.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255];
};
const rgbToHex=(r,g,b)=>"#"+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join("");
const mixHex=(a,b,t)=>{const[ar,ag,ab]=hexToRgb(a),[br,bg,bb]=hexToRgb(b);return rgbToHex(ar+(br-ar)*t,ag+(bg-ag)*t,ab+(bb-ab)*t);};

// セルの背景色に対して、白文字/濃色文字のどちらが読みやすいかをWCAGの相対輝度で判定する
const relLuminance=(hex)=>{
  const [r,g,b]=hexToRgb(hex).map(v=>{const c=v/255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);});
  return 0.2126*r+0.7152*g+0.0722*b;
};
const contrastText=(bgHex)=>relLuminance(bgHex)>0.42?"#1A1A1A":"#FFFFFF";

// pct(%)を受け取り、日次モニター・セクター・登録銘柄どれでも使う共通のカラー情報を返す。
// セルの背景そのものを段階配色にし（ヒートマップ的な塗り分け）、文字色は背景の明るさに応じて
// 白/濃色を自動選択することで、セルの中でも数字が確実に読めるようにする。pctがnull/0はニュートラル。
const changeColor=(pct)=>{
  if(pct==null||pct===0) return {level:0,dir:null,fg:"var(--inkSoft)",fgSoft:"var(--inkSoft)",bg:"var(--card)"};
  const pal=COLOR_PALETTE[CURRENT_THEME];
  const level=Math.min(CHANGE_MAX_LEVEL,Math.ceil(Math.abs(pct)/CHANGE_STEP));
  const t=(level-1)/(CHANGE_MAX_LEVEL-1);
  const up=pct>0;
  const bg=mixHex(up?pal.upBase:pal.downBase, up?pal.upDark:pal.downDark, t);
  const fg=contrastText(bg);
  const fgSoft=fg==="#FFFFFF"?"rgba(255,255,255,.75)":"rgba(26,26,26,.65)";
  return {level,dir:up?"up":"down",fg,fgSoft,bg};
};

// 10-1章：カードUI基盤。ミニスパークライン（値上がり/値下がりでグラデーション色を変える）
function Sparkline({data,color,width=140,height=36}){
  const gid=(React.useId?React.useId():"spark")+"-g";
  if(!data||data.length<2) return <svg width={width} height={height}></svg>;
  const min=Math.min(...data),max=Math.max(...data);
  const range=(max-min)||1;
  const stepX=width/(data.length-1);
  const pts=data.map((v,i)=>[i*stepX,height-((v-min)/range)*height]);
  const line=pts.map(([x,y],i)=>(i===0?"M":"L")+x.toFixed(1)+","+y.toFixed(1)).join(" ");
  const area=line+` L${width},${height} L0,${height} Z`;
  return <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} style={{display:"block",width:"100%",height}} preserveAspectRatio="none">
    <defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor={color} stopOpacity="0.32"/>
      <stop offset="100%" stopColor={color} stopOpacity="0"/>
    </linearGradient></defs>
    <path d={area} fill={`url(#${gid})`} stroke="none"/>
    <path d={line} fill="none" stroke={color} strokeWidth="1.6"/>
  </svg>;
}

// 決算分析タブ：業績進捗率を「棒グラフ（推移＋通期予想との比較）」と「円グラフ（進捗率が一目でわかる）」で表示。
// moomoo証券アプリの配色に合わせ、進捗を示す環はaccent（オレンジ）、実績棒は前期比の増減でup/down色を使う。
function EarningsProgressChart({trend,latestDetail}){
  if(!trend||!trend.length||!latestDetail||latestDetail.forecastRevenue==null)return null;
  const bars=trend.filter(t=>t.sales!=null).slice(-6);
  if(!bars.length)return null;
  const forecastYen=latestDetail.forecastRevenue*1e6;
  const maxV=Math.max(forecastYen,...bars.map(b=>b.sales));
  const oku=v=>(v/1e8).toLocaleString(undefined,{maximumFractionDigits:0});
  const W=320,H=150,padL=4,padR=4,padB=20,padT=10;
  const plotW=W-padL-padR,plotH=H-padT-padB;
  const bw=plotW/bars.length*0.56;
  const gap=plotW/bars.length;
  const yOf=v=>padT+plotH-(v/maxV)*plotH;
  const forecastY=yOf(forecastYen);
  const pct=latestDetail.progressPct;
  const pctClamped=pct==null?0:Math.max(0,Math.min(100,pct));
  const R=42,CX=60,CY=60,STROKE=11;
  const circumference=2*Math.PI*R;
  const dash=circumference*(pctClamped/100);
  return <div style={{display:"flex",flexWrap:"wrap",gap:18,alignItems:"center",marginTop:10,paddingTop:9,borderTop:"1px solid var(--ruleSoft)"}}>
    <div style={{flex:"0 0 auto"}}>
      <div style={{fontSize:12.5,color:"var(--inkFaint)",marginBottom:4,textAlign:"center"}}>通期進捗率</div>
      <svg viewBox="0 0 120 120" width={120} height={120}>
        <circle cx={CX} cy={CY} r={R} fill="none" stroke="var(--rule)" strokeWidth={STROKE}/>
        <circle cx={CX} cy={CY} r={R} fill="none" stroke="var(--accent)" strokeWidth={STROKE}
          strokeDasharray={`${dash} ${circumference-dash}`} strokeLinecap="round"
          transform={`rotate(-90 ${CX} ${CY})`}/>
        <text x={CX} y={CY-2} textAnchor="middle" fontSize={20} fontWeight={800} fill="var(--ink)">
          {pct==null?"—":pct.toFixed(1)}
        </text>
        <text x={CX} y={CY+16} textAnchor="middle" fontSize={11} fill="var(--inkSoft)">{pct==null?"":"%"}</text>
      </svg>
    </div>
    <div style={{flex:"1 1 220px",minWidth:220}}>
      <div style={{fontSize:12.5,color:"var(--inkFaint)",marginBottom:4}}>売上高推移（実績）と通期会社予想（億円）</div>
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H}>
        <line x1={padL} y1={forecastY} x2={W-padR} y2={forecastY} stroke="var(--accent)" strokeWidth={1.5} strokeDasharray="4 3"/>
        <text x={W-padR} y={forecastY-3} textAnchor="end" fontSize={10} fill="var(--accent)">通期予想 {oku(forecastYen)}億</text>
        {bars.map((b,i)=>{
          const x=padL+gap*i+(gap-bw)/2;
          const y=yOf(b.sales);
          const h=padT+plotH-y;
          const up=b.salesYoy==null?null:b.salesYoy>=0;
          const color=b.isLatest?"var(--accent)":(up==null?"var(--inkFaint)":(up?"var(--up)":"var(--down)"));
          const label=b.periodEnd?b.periodEnd.slice(5):(b.periodLabel||"");
          return <g key={i}>
            <rect x={x} y={y} width={bw} height={Math.max(1,h)} fill={color} rx={2}/>
            <text x={x+bw/2} y={H-6} textAnchor="middle" fontSize={9.5} fill="var(--inkFaint)">{label}</text>
          </g>;
        })}
      </svg>
    </div>
  </div>;
}

// 6-1章：銘柄検索・登録＋セクター別アコーディオン表示（2〜5章の仕様）を市場ごとに再利用するための共通コンポーネント。
// 日本市場・アメリカ市場タブの両方で、このコンポーネントをそのまま使い回すことで「全く同じ仕様・UI」を担保する。
function SectorWatchlist({market,watchlist,setWatchlist,candidates,max,stockQuotes,analysisTargets,onToggleAnalysis,earningsTargets,onToggleEarnings,watchTargets,onToggleWatch,onOpenChart}){
  const [q,setQ]=useState("");
  const [manualSector,setManualSector]=useState(SECTOR_CHOICES[0]);
  const [openSectors,setOpenSectors]=useState(()=>new Set());
  const rowRefs=useRef({}); // code -> <tr>要素。検索で既登録銘柄がヒットした際にスクロールで見せるため（2026-08-21 ユーザー要望）
  const [jumpHighlight,setJumpHighlight]=useState(null); // 直前にジャンプした銘柄コード。数秒だけ行を強調表示する

  const regCodes=useMemo(()=>new Set(watchlist.map(w=>w.code)),[watchlist]);
  // 2026-08-21 ユーザー要望：コード・企業名に加え、読み仮名（ひらがな・カタカナどちらで入力しても
  // ヒットする）でも検索できるようにする。normKana()でクエリ・候補側の双方をひらがなに正規化して
  // 比較するため、社名がカタカナのみの銘柄は読み未収録でもこれだけで検索可能になる。
  const results=useMemo(()=>{const t=normKana(q.trim());if(!t)return[];
    return candidates.filter(m=>!regCodes.has(m.code)&&(normKana(m.code).includes(t)||normKana(m.name).includes(t)||normKana(m.kana).includes(t)||normKana(m.sector).includes(t))).slice(0,8);},[q,regCodes,candidates]);
  // 「検索しても候補が出てこない」問い合わせ対応：日経225+主要30社／ダウ30社は最初から登録済み
  // （MASTER・DEFAULT_WATCHLIST）のため、有名企業ほど検索しても新規候補が0件になりやすい。
  // resultsが空のとき、実は既に登録済みなだけなのかを判定してユーザーに明示する。
  const alreadyRegisteredMatch=useMemo(()=>{const t=normKana(q.trim());if(!t)return null;
    return candidates.find(m=>regCodes.has(m.code)&&(normKana(m.code).includes(t)||normKana(m.name).includes(t)||normKana(m.kana).includes(t)))||null;},[q,regCodes,candidates]);
  const addStock=(m)=>{if(watchlist.length>=max){alert("登録は最大"+max+"社までです。");return;}
    if(regCodes.has(m.code))return; setWatchlist([...watchlist,{id:m.code,...m,watch:"通常",note:"",theme:""}]);setQ("");};
  const [sectorGuessing,setSectorGuessing]=useState(false);
  // 2026-08-21 ユーザー要望：マスターリストに無い銘柄を手動登録する際、業種プルダウンの手動選択に
  // 頼らずyfinanceから東証33業種を推定して自動で埋める（guess_sector()、server.py参照）。
  // 完全な精度は保証できないため、推定できなかった場合はプルダウンで選んだ値（manualSector）を
  // そのまま使う（従来どおり）。
  const addManual=async()=>{
    const raw=q.trim();if(!raw)return;if(watchlist.length>=max){alert("最大"+max+"社");return;}
    let code=raw,name=raw;
    if(!/^[0-9]{4}[0-9A-Za-z]?$/.test(raw)){
      const input=prompt(`「${raw}」の証券コード（例：5016、AAPL）を入力してください`,"");
      if(!input||!input.trim())return;
      code=input.trim();
    }
    let sector=manualSector;
    setSectorGuessing(true);
    try{
      const r=await fetch("/api/guess-sector",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code,market})});
      if(r.ok){
        const d=await r.json();
        if(d.sector&&SECTOR_CHOICES.includes(d.sector))sector=d.sector;
      }
    }catch(e){}
    setSectorGuessing(false);
    setWatchlist([...watchlist,{id:Date.now()+Math.random(),code,name,sector,market,tvSymbol:(market==="JP"?"TSE:"+code:code),watch:"通常",note:"",theme:""}]);setQ("");};
  const delStock=(id)=>setWatchlist(watchlist.filter(w=>w.id!==id));
  const editTheme=(w)=>{
    const input=prompt(`「${w.name}」のテーマ（例：AI関連、インバウンド、半導体）`,w.theme||"");
    if(input==null)return; // キャンセル
    setWatchlist(watchlist.map(x=>x.id===w.id?{...x,theme:input.trim()}:x));
  };

  // 銘柄コードの前日比(%)・売買代金（3章カラールール・セクター並び替えで共通利用）
  const pctOf=(code)=>{const qt=stockQuotes[code]||{};const t=num(qt.t),p=num(qt.p);
    return (t!=null&&p!=null&&p)?(t-p)/p*100:null;};
  const turnoverOf=(code)=>{const v=num(stockQuotes[code]?.turnover);return v!=null&&v>0?v:null;};

  // セクターの並び順は「セクター内合計売買代金の降順」。銘柄追加・株価更新のたびに再計算され、
  // 売買代金の変動に応じて自動的に入れ替わる。未取得時はSECTOR_CHOICES(33業種+指数・為替)の定義順にフォールバック。
  const sectorOrder=useMemo(()=>SECTOR_CHOICES,[]);
  const sectorGroups=useMemo(()=>{
    const map={};
    watchlist.forEach(w=>{(map[w.sector]=map[w.sector]||[]).push(w);});
    return Object.entries(map)
      .map(([sector,items])=>{
        const pcts=items.map(w=>pctOf(w.code)).filter(v=>v!=null);
        const avgPct=pcts.length?pcts.reduce((a,b)=>a+b,0)/pcts.length:null;
        const totalTurnover=items.reduce((sum,w)=>sum+(turnoverOf(w.code)||0),0);
        return {sector,avgPct,totalTurnover,items:[...items].sort((a,b)=>(wOrder[a.watch]-wOrder[b.watch])||a.code.localeCompare(b.code))};
      })
      .sort((a,b)=>(b.totalTurnover-a.totalTurnover)||(sectorOrder.indexOf(a.sector)-sectorOrder.indexOf(b.sector)));
  },[watchlist,stockQuotes,sectorOrder]);
  const toggleSector=(sec)=>setOpenSectors(prev=>{const n=new Set(prev);n.has(sec)?n.delete(sec):n.add(sec);return n;});

  // 2026-08-21 ユーザー要望：検索した銘柄が既に登録済みだった場合、そのセクターを開いて実際の行まで
  // スクロールする（メッセージを出すだけで終わらせない）。アコーディオンの開閉は次の描画を経てから
  // でないとDOMに行が無くscrollIntoViewできないため、setTimeoutで1フレーム分待つ。
  const jumpToRegistered=(m)=>{
    setOpenSectors(prev=>new Set(prev).add(m.sector));
    setQ("");
    setJumpHighlight(m.code);
    setTimeout(()=>{
      rowRefs.current[m.code]?.scrollIntoView({behavior:"smooth",block:"center"});
    },50);
    setTimeout(()=>setJumpHighlight(prev=>prev===m.code?null:prev),2500);
  };

  return <div style={{marginTop:18}}>
    <div className="sec-head">登録銘柄　{watchlist.length}/{max}</div>
    <div className="sec-note">自動保存されます。</div>
    <div style={{position:"relative"}}>
      <div style={{display:"flex",alignItems:"center",gap:8,border:"1px solid var(--rule)",background:"var(--card)",borderRadius:4,padding:"8px 12px"}}>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder={market==="JP"?"銘柄コード・企業名・読み仮名・セクターで検索（例：6981、村田、むらた、化学）":"ティッカー・企業名・セクターで検索（例：AAPL、Apple、電気機器）"}
          style={{flex:1,border:"none",background:"transparent",outline:"none",fontSize:14}}/>
        {q && <button className="iconbtn" onClick={()=>setQ("")}>×</button>}
      </div>
      {q.trim() && <div className="results">
        {results.length===0 && alreadyRegisteredMatch && <button className="res-row" style={{fontSize:12.5,color:"var(--inkSoft)",textAlign:"left"}}
          onClick={()=>jumpToRegistered(alreadyRegisteredMatch)}>
          「{alreadyRegisteredMatch.name}」({alreadyRegisteredMatch.code}／{alreadyRegisteredMatch.sector})は既に登録済みです。クリックすると該当セクターを開いて表示します。
        </button>}
        {results.map(m=>
          <button key={m.code} className="res-row" onClick={()=>addStock(m)}>
            <span className="mono" style={{fontSize:12,width:60,color:"var(--inkSoft)"}}>{m.code}</span>
            <span style={{flex:1,fontSize:13}}>{m.name}</span>
            <span style={{fontSize:11,color:"var(--inkSoft)"}}>{m.sector}</span>
            <span style={{color:"var(--accent)",fontWeight:700}}>＋</span>
          </button>)}
        <div className="res-row" style={{background:"var(--band)",fontSize:12.5,color:"var(--inkSoft)",display:"flex",alignItems:"center",gap:8}}>
          <span>＋「{q.trim()}」を手動登録：業種（登録時に自動推定・違えば選び直せます）</span>
          <select value={manualSector} onChange={e=>setManualSector(e.target.value)} style={{fontSize:12}} disabled={sectorGuessing}>
            {SECTOR_CHOICES.map(s=><option key={s} value={s}>{s}</option>)}
          </select>
          <button className="btn" style={{fontSize:11.5,padding:"2px 10px"}} onClick={addManual} disabled={sectorGuessing}>{sectorGuessing?"業種を判定中…":"登録"}</button>
        </div>
      </div>}
    </div>
    <div style={{marginTop:12,border:"1px solid var(--rule)",background:"var(--card)",borderRadius:4,overflow:"hidden"}}>
      {sectorGroups.length===0 ?
        <div style={{padding:26,textAlign:"center",color:"var(--inkSoft)",fontSize:13}}>{`上の検索から銘柄を登録してください（最大${max}社）。`}</div> :
        sectorGroups.map(({sector,avgPct,items},i)=>{
          const isOpen=openSectors.has(sector);
          const avgC=changeColor(avgPct);
          return <div key={sector} style={{borderTop:i===0?"none":"1px solid var(--ruleSoft)"}}>
            <button onClick={()=>toggleSector(sector)} style={{display:"flex",alignItems:"center",width:"100%",gap:10,padding:"11px 14px",
              background:avgC.level>0?avgC.bg:(isOpen?"var(--band)":"transparent"),border:"none",cursor:"pointer",textAlign:"left",font:"inherit",
              color:avgC.level>0?avgC.fg:"var(--ink)"}}>
              <span className="mono" style={{fontSize:12,color:avgC.level>0?avgC.fgSoft:"var(--inkSoft)",width:14}}>{isOpen?"▾":"▸"}</span>
              <span style={{flex:1,fontSize:18,fontWeight:700}}>{sector}</span>
              <span className="mono" style={{fontSize:19,fontWeight:800,color:avgC.fg,minWidth:70,textAlign:"right"}}>
                {avgPct!=null?(avgPct>0?"+":"")+avgPct.toFixed(2)+"%":"—"}
              </span>
              <span style={{fontSize:13,color:avgC.level>0?avgC.fgSoft:"var(--inkSoft)"}}>{items.length}銘柄</span>
            </button>
            {isOpen && <div style={{overflowX:"auto",padding:"0 0 0 28px",background:"var(--card)"}}><table style={{minWidth:860}}>
              <thead><tr style={{background:"var(--band)"}}><th>コード</th><th>銘柄</th><th>テーマ</th><th>現在値</th><th>前日比</th><th>高値</th><th>安値</th><th></th></tr></thead>
              <tbody>{items.map(w=>{
                const qt=stockQuotes[w.code]||{};
                const ct=num(qt.t),cp=num(qt.p),chi=num(qt.high),clo=num(qt.low);
                const delta=ct!=null&&cp!=null?ct-cp:null;
                const pct=pctOf(w.code);
                const c=changeColor(pct);
                const inAnalysis=analysisTargets.includes(w.code);
                const inEarnings=earningsTargets.includes(w.code);
                const inWatch=watchTargets.includes(w.code);
                const isJumpTarget=jumpHighlight===w.code;
                return <tr key={w.id} ref={el=>{rowRefs.current[w.code]=el;}}
                  style={{borderTop:"1px solid var(--ruleSoft)",background:isJumpTarget?"var(--accent)":c.bg,color:isJumpTarget?"var(--card)":(c.level>0?c.fg:"var(--ink)"),transition:"background 0.4s, color 0.4s"}}>
                  <td className="mono" style={{fontWeight:700,fontSize:14}}>{w.code}</td>
                  <td style={{fontSize:16,fontWeight:600}}>{w.watch==="優先"&&<span style={{color:"var(--star)",marginRight:4}}>★</span>}{w.name}</td>
                  <td>
                    <button className="iconbtn" style={{fontSize:11.5,color:w.theme?"var(--accent)":"var(--inkFaint)",whiteSpace:"nowrap"}}
                      onClick={()=>editTheme(w)} title="クリックしてテーマを編集">{w.theme||"＋テーマ"}</button>
                  </td>
                  <td className="mono" style={{fontWeight:800,fontSize:17,color:c.fg,whiteSpace:"nowrap"}}>{ct!=null?ct.toLocaleString():"—"}</td>
                  <td className="mono" style={{fontWeight:700,fontSize:16,color:c.fg,whiteSpace:"nowrap"}}>{delta!=null?(delta>0?"+":"")+delta.toLocaleString(undefined,{maximumFractionDigits:2})+(pct!=null?` (${pct>0?"+":""}${pct.toFixed(2)}%)`:""):"—"}</td>
                  <td className="mono" style={{color:c.level>0?c.fgSoft:"var(--inkSoft)",whiteSpace:"nowrap"}}>{chi!=null?chi.toLocaleString():"—"}</td>
                  <td className="mono" style={{color:c.level>0?c.fgSoft:"var(--inkSoft)",whiteSpace:"nowrap"}}>{clo!=null?clo.toLocaleString():"—"}</td>
                  <td style={{textAlign:"center",whiteSpace:"nowrap"}}>
                    <button className="action-btn" style={{marginRight:5}} onClick={()=>onOpenChart(w)}>チャート</button>
                    <button className={"action-btn"+(inAnalysis?" on":"")} style={{marginRight:5}} onClick={()=>onToggleAnalysis(w.code)}>{inAnalysis?"✓ 分析中":"分析"}</button>
                    {market==="JP" && <button className={"action-btn"+(inWatch?" on":"")} style={{marginRight:5}} onClick={()=>onToggleWatch(w.code)} title="「監視銘柄」タブでまとめて確認する対象にする（日本市場のみ）">{inWatch?"✓ 監視銘柄":"監視銘柄"}</button>}
                    {market==="JP" && <button className={"action-btn"+(inEarnings?" on":"")} style={{marginRight:5}} onClick={()=>onToggleEarnings(w.code)}>{inEarnings?"✓ 決算":"決算"}</button>}
                    <button className="iconbtn" style={{color:c.level>0?c.fg:"var(--inkSoft)"}} onClick={()=>delStock(w.id)}>×</button>
                  </td>
                </tr>;})}</tbody>
            </table></div>}
          </div>;
        })}
    </div>
  </div>;
}

// 監視銘柄タブ（2026-08-21 ユーザー要望）：「日本市場」「アメリカ市場」タブの「監視銘柄」
// ボタン、または出来高ブレイクアウト条件への自動該当でwatchTargetsに入った銘柄を、市場を
// 問わずまとめて確認する。列構成はSectorWatchlistの登録銘柄テーブルと同じだが、対象が
// 少数精鋭になる想定のためセクター別アコーディオンにはせず前日比の大きい順にフラット表示する。
// 「本日優先」に相当するボタンは無く、末尾の「削除」はwatchTargetsから外すだけ（実際の登録
// 銘柄一覧からは削除しない。完全な登録解除は「日本市場」「アメリカ市場」タブの×で行う）。
function WatchTargetsPanel({items,stockQuotes,analysisTargets,onToggleAnalysis,earningsTargets,onToggleEarnings,onRemove,onOpenChart}){
  const pctOf=(code)=>{const qt=stockQuotes[code]||{};const t=num(qt.t),p=num(qt.p);
    return (t!=null&&p!=null&&p)?(t-p)/p*100:null;};
  const sorted=useMemo(()=>[...items].sort((a,b)=>{
    const pa=pctOf(a.code),pb=pctOf(b.code);
    if(pa==null&&pb==null)return 0; if(pa==null)return 1; if(pb==null)return -1;
    return pb-pa;
  }),[items,stockQuotes]);
  return <div style={{marginTop:18}}>
    <div className="sec-head">監視銘柄　{items.length}件</div>
    <div className="sec-note">「日本市場」タブの「監視銘柄」ボタン、または出来高ブレイクアウト条件（直近3か月高値を出来高1.5倍以上で上抜け）への自動該当で追加されます（日本市場のみ対象）。</div>
    <div style={{marginTop:12,border:"1px solid var(--rule)",background:"var(--card)",borderRadius:4,overflow:"hidden"}}>
      {sorted.length===0 ?
        <div style={{padding:26,textAlign:"center",color:"var(--inkSoft)",fontSize:13}}>監視銘柄はまだありません。「日本市場」タブの一覧で「監視銘柄」ボタンを押すと、ここに追加されます。</div> :
        <div style={{overflowX:"auto"}}><table style={{minWidth:860}}>
          <thead><tr style={{background:"var(--band)"}}><th>コード</th><th>銘柄</th><th>テーマ</th><th>現在値</th><th>前日比</th><th>高値</th><th>安値</th><th></th></tr></thead>
          <tbody>{sorted.map(w=>{
            const qt=stockQuotes[w.code]||{};
            const ct=num(qt.t),cp=num(qt.p),chi=num(qt.high),clo=num(qt.low);
            const delta=ct!=null&&cp!=null?ct-cp:null;
            const pct=pctOf(w.code);
            const c=changeColor(pct);
            const inAnalysis=analysisTargets.includes(w.code);
            const inEarnings=earningsTargets.includes(w.code);
            return <tr key={w.code} style={{borderTop:"1px solid var(--ruleSoft)",background:c.bg,color:c.level>0?c.fg:"var(--ink)"}}>
              <td className="mono" style={{fontWeight:700,fontSize:14}}>{w.code}</td>
              <td style={{fontSize:16,fontWeight:600}}>{w.name}</td>
              <td style={{fontSize:12,color:w.theme?"var(--accent)":"var(--inkFaint)"}}>{w.theme||"—"}</td>
              <td className="mono" style={{fontWeight:800,fontSize:17,color:c.fg,whiteSpace:"nowrap"}}>{ct!=null?ct.toLocaleString():"—"}</td>
              <td className="mono" style={{fontWeight:700,fontSize:16,color:c.fg,whiteSpace:"nowrap"}}>{delta!=null?(delta>0?"+":"")+delta.toLocaleString(undefined,{maximumFractionDigits:2})+(pct!=null?` (${pct>0?"+":""}${pct.toFixed(2)}%)`:""):"—"}</td>
              <td className="mono" style={{color:c.level>0?c.fgSoft:"var(--inkSoft)",whiteSpace:"nowrap"}}>{chi!=null?chi.toLocaleString():"—"}</td>
              <td className="mono" style={{color:c.level>0?c.fgSoft:"var(--inkSoft)",whiteSpace:"nowrap"}}>{clo!=null?clo.toLocaleString():"—"}</td>
              <td style={{textAlign:"center",whiteSpace:"nowrap"}}>
                <button className="action-btn" style={{marginRight:5}} onClick={()=>onOpenChart(w)}>チャート</button>
                <button className={"action-btn"+(inAnalysis?" on":"")} style={{marginRight:5}} onClick={()=>onToggleAnalysis(w.code)}>{inAnalysis?"✓ 分析中":"分析"}</button>
                {w.market==="JP" && <button className={"action-btn"+(inEarnings?" on":"")} style={{marginRight:5}} onClick={()=>onToggleEarnings(w.code)}>{inEarnings?"✓ 決算":"決算"}</button>}
                <button className="action-btn" onClick={()=>onRemove(w.code)}>削除</button>
              </td>
            </tr>;})}</tbody>
        </table></div>}
    </div>
  </div>;
}

// 資金管理・分割買いツール：総資金とリスク許容%、エントリー/損切り単価から株数目安を計算する（14-15章）。
// 日本株は100株単位、米国株は1株単位に丸める。分割買いは1回目40%（打診買い）・2回目30%（反転確認後）・
// 3回目残り30%（節目上抜け後）の目安に分ける（3回とも単元株数に丸めるため合計が端数分減ることがある）。
const computePositionSize=(totalCapital,riskPct,entry,stop,market)=>{
  const capital=num(totalCapital),risk=num(riskPct);
  if(capital==null||capital<=0||risk==null||risk<=0||entry==null||stop==null)return null;
  const perShareRisk=entry-stop;
  if(perShareRisk<=0)return null;
  const lotSize=market==="JP"?100:1;
  const riskAmount=capital*(risk/100);
  const rawShares=riskAmount/perShareRisk;
  const suggestedShares=Math.floor(rawShares/lotSize)*lotSize;
  if(suggestedShares<lotSize)return {suggestedShares:0,investAmount:0,tranches:[0,0,0]};
  const t1=Math.floor(suggestedShares*0.4/lotSize)*lotSize;
  const t2=Math.floor(suggestedShares*0.3/lotSize)*lotSize;
  const t3=suggestedShares-t1-t2;
  return {suggestedShares,investAmount:suggestedShares*entry,tranches:[t1,t2,t3]};
};

// テーマ・セクター強弱の可視化：SectorWatchlist内のsectorGroups集計（平均騰落率・合計売買代金）と
// 同じ考え方を、JP+US統合した銘柄リストに対して汎用的に適用する。keyFnがnull/""を返す銘柄は
// 対象外にする（テーマ未設定銘柄をテーマ別ランキングから除外するため）。
const groupStocks=(items,stockQuotes,keyFn)=>{
  const pctOf=(code)=>{const qt=stockQuotes[code]||{};const t=num(qt.t),p=num(qt.p);
    return (t!=null&&p!=null&&p)?(t-p)/p*100:null;};
  const turnoverOf=(code)=>{const v=num(stockQuotes[code]?.turnover);return v!=null&&v>0?v:null;};
  const map={};
  items.forEach(w=>{const key=keyFn(w);if(!key)return;(map[key]=map[key]||[]).push(w);});
  return Object.entries(map).map(([key,members])=>{
    const pcts=members.map(w=>pctOf(w.code)).filter(v=>v!=null);
    const avgPct=pcts.length?pcts.reduce((a,b)=>a+b,0)/pcts.length:null;
    const totalTurnover=members.reduce((sum,w)=>sum+(turnoverOf(w.code)||0),0);
    // 代表銘柄：グループ内で騰落率の絶対値が最大の銘柄（値動きが最も大きい＝今日そのグループを牽引している銘柄）
    let leader=null,leaderAbsPct=-1;
    members.forEach(w=>{const p=pctOf(w.code);if(p!=null&&Math.abs(p)>leaderAbsPct){leaderAbsPct=Math.abs(p);leader={name:w.name,pct:p};}});
    return {key,avgPct,totalTurnover,count:members.length,leader};
  }).sort((a,b)=>(b.totalTurnover-a.totalTurnover));
};

// 日次モニター先頭に表示するランキングパネル。「市場→テーマ→セクター→銘柄」の確認順序を
// タブを跨がずに把握できるようにする（4〜6章対応）。テーマは登録銘柄にユーザーが手動で
// 付けたタグのみを対象にするため、1件も設定されていなければテーマ欄は非表示にする。
function ThemeSectorRanking({watchlistAll,stockQuotes}){
  const sectorRanking=useMemo(()=>groupStocks(watchlistAll,stockQuotes,w=>w.sector).slice(0,5),[watchlistAll,stockQuotes]);
  const themeRanking=useMemo(()=>groupStocks(watchlistAll,stockQuotes,w=>(w.theme||"").trim()).slice(0,5),[watchlistAll,stockQuotes]);

  const RankList=({title,rows,emptyNote})=>
    <div style={{flex:"1 1 320px",minWidth:280}}>
      <div style={{fontSize:13,fontWeight:700,marginBottom:6}}>{title}</div>
      {rows.length===0
        ? <div style={{fontSize:12,color:"var(--inkSoft)"}}>{emptyNote}</div>
        : <div style={{border:"1px solid var(--rule)",borderRadius:4,overflow:"hidden"}}>
            {rows.map((r,i)=>{const c=changeColor(r.avgPct);
              return <div key={r.key} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 10px",
                borderTop:i===0?"none":"1px solid var(--ruleSoft)",background:c.level>0?c.bg:"transparent"}}>
                <span className="mono" style={{fontSize:11,color:"var(--inkSoft)",width:14}}>{i+1}</span>
                <span style={{flex:1,fontSize:13,fontWeight:600,color:c.level>0?c.fg:"var(--ink)"}}>{r.key}</span>
                <span style={{fontSize:11,color:"var(--inkSoft)"}}>{r.count}銘柄</span>
                <span className="mono" style={{fontSize:13,fontWeight:800,color:c.fg,minWidth:56,textAlign:"right"}}>
                  {r.avgPct!=null?(r.avgPct>0?"+":"")+r.avgPct.toFixed(2)+"%":"—"}
                </span>
                {r.leader&&<span style={{fontSize:11,color:"var(--inkSoft)",whiteSpace:"nowrap"}}>代表：{r.leader.name}
                  <span className="mono" style={{color:changeColor(r.leader.pct).fg,fontWeight:700}}> {r.leader.pct>0?"+":""}{r.leader.pct.toFixed(1)}%</span>
                </span>}
              </div>;})}
          </div>}
    </div>;

  return <div style={{marginBottom:18}}>
    <div className="sec-head">本日の注目セクター・テーマ</div>
    <div className="sec-note">登録銘柄（日本・アメリカ市場）の平均騰落率・合計売買代金から自動算出。「代表銘柄」はそのグループ内で最も値動きが大きい銘柄です。</div>
    <div style={{display:"flex",flexWrap:"wrap",gap:16,marginTop:8}}>
      <RankList title="セクター別（上位5・合計売買代金順）" rows={sectorRanking} emptyNote="登録銘柄がありません。「日本市場」「アメリカ市場」タブで銘柄を登録してください。"/>
      <RankList title="テーマ別（上位5・合計売買代金順）" rows={themeRanking} emptyNote="テーマが設定された銘柄がありません。「日本市場」「アメリカ市場」タブの登録銘柄一覧で、銘柄名の右の「＋テーマ」から設定できます。"/>
    </div>
  </div>;
}

      }
    });
    return out.sort((a,b)=>(b.pct-b.sectorAvg)-(a.pct-a.sectorAvg));
  },[watchlistAll,s.stockQuotes]);

  useEffect(()=>{
    sectorLaggards.forEach(item=>{
      if(!notifiedLaggardsRef.current.has(item.code)){
        notifiedLaggardsRef.current.add(item.code);
        notifyDesktop(`↗ ${item.name} ${item.code}：セクター内逆行`,
          `${item.sector}平均${item.sectorAvg.toFixed(2)}%に対し個別${item.pct.toFixed(2)}%`);
      }
    });
  },[sectorLaggards]);

  // 出来高ブレイクアウト（登録銘柄全体・日本株のみ）：get_breakout_levels()で1日1回計算した
  // 基準値（highLookback・volAvg5）と、30秒おきに更新される現在値(t)・当日出来高(volume)を比較する
  // 軽い処理。analyze_stock()のbreakout_confirmedと同一基準（直近3か月高値を、5日平均出来高の
  // 1.5倍以上の出来高を伴って上抜け。2026-08-21：参照期間を20営業日→3か月に変更）。
  // sectorLaggardsと同じく登録銘柄全体が対象（2026-08-20 ユーザー要望）。
  const breakoutAlerts=useMemo(()=>{
    const out=[];
    s.watchlist.forEach(w=>{
      const levels=s.breakoutLevels[w.code];
      if(!levels)return;
      const qt=s.stockQuotes[w.code]||{};
      const t=num(qt.t),vol=num(qt.volume);
      if(t==null||vol==null)return;
      const volRatio=levels.volAvg5?vol/levels.volAvg5:null;
      if(t>levels.highLookback && volRatio!=null && volRatio>=1.5){
        out.push({code:w.code,name:w.name,highLookback:levels.highLookback,t,volRatio});
      }
    });
    return out;
  },[s.watchlist,s.breakoutLevels,s.stockQuotes]);

  // 出来高ブレイクアウト条件に該当した銘柄は、表示するだけでなく「監視銘柄」へ自動追加する
  // （2026-08-21 ユーザー要望：「記録」タブのチップ表示は撤去し、監視銘柄タブに一本化）。
  // 既にwatchTargetsに入っていれば重複追加も再通知もしない（冪等）。
  useEffect(()=>{
    breakoutAlerts.forEach(item=>{
      if(s.watchTargets.includes(item.code))return;
      setS(p=>p.watchTargets.includes(item.code)?p:{...p,watchTargets:[...p.watchTargets,item.code]});
      notifyDesktop(`▲ ${item.name} ${item.code}：出来高ブレイクアウト→監視銘柄に追加`,
        `直近3か月高値${item.highLookback.toLocaleString()}を出来高${item.volRatio.toFixed(1)}倍で上抜け`);
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[breakoutAlerts]);

  // 決算分析タブの対象銘柄。「決算」ボタンで追加され、直近の決算短信（TDnet）のタイトル・
  // 数値要約を取得して表示する（要約の作り方は適時開示タブと同じ、9章のsummarize_earnings_pdf）。
  const earningsItems=useMemo(()=>s.earningsTargets.map(code=>allWatch.find(w=>w.code===code)).filter(Boolean),[s.earningsTargets,allWatch]);
  const [earningsFetching,setEarningsFetching]=useState(false);
  const fetchEarningsDetailFor=async(items)=>{
    if(!items||!items.length)return;
    setEarningsFetching(true);
    try{
      const er=await fetch("/api/earnings-detail",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify(items.map(w=>({code:w.code,name:w.name})))});
      if(er.ok){const ed=await er.json();
        const byCode=Object.fromEntries((ed.results||[]).map(r=>[r.code,r]));
        setS(p=>({...p,earningsDetail:{...p.earningsDetail,...byCode}}));}
    }catch(e){}
    setEarningsFetching(false);
  };
  // 銘柄追加時：earningsDetailにまだ結果がない対象銘柄だけを取得する
  useEffect(()=>{
    const missing=earningsItems.filter(w=>!s.earningsDetail[w.code]);
    if(missing.length)fetchEarningsDetailFor(missing);
  },[s.earningsTargets]);

  const day=useMemo(()=>{const d=new Date(s.date+"T00:00:00");return isNaN(d)?null:d.getDay();},[s.date]);
  const isMonday=day===1;

  // 複数カテゴリのニュース配列を、重複URLを除きつつ公開日時(published:"MM/DD HH:MM")の
  // 降順にまとめる。米国株ニュースを国内カテゴリと混ぜて表示する際に使う（年またぎは非対応）。
  const mergeByDate=(...lists)=>{
    const seen=new Set();const out=[];
    for(const list of lists){for(const it of list){if(!it.url||seen.has(it.url))continue;seen.add(it.url);out.push(it);}}
    return out.sort((a,b)=>(b.published||"").localeCompare(a.published||""));
  };
  // 適時開示：日本の登録銘柄＋アメリカ市場（ダウ30社）の開示・IR・決算ニュースを、当日含む
  // 直近10日分・種類を問わず全件まとめて表示する
  const disclosureAll=useMemo(()=>mergeByDate(s.disclosureNewsList,s.usDisclosureNewsList),[s.disclosureNewsList,s.usDisclosureNewsList]);
  // 登録銘柄：IR以外も含む社名一致ニュース（日本＋アメリカ）
  const stockNameNewsAll=useMemo(()=>mergeByDate(s.stockNameNewsList,s.usStockNameNewsList),[s.stockNameNewsList,s.usStockNameNewsList]);
  // 海外市況：マクロの海外市況クエリに加え、アメリカ市場登録銘柄のニュースも含める
  const overseasAll=useMemo(()=>mergeByDate(s.macroNewsOverseas,s.usStockNewsList),[s.macroNewsOverseas,s.usStockNewsList]);

  // 9-1章：「サマリー」の中身の方針。既存に該当機能がなかったため新規に決定：
  // (1) 重大ニュース（9-2章の判定に該当）を全カテゴリから最優先で集約し、(2) 残り枠を
  // 適時開示（日本＋アメリカ）・国内市況・海外市況からバランスよく抜粋する。重複URLは除外する。
  const newsSummary=useMemo(()=>{
    const seen=new Set();
    const push=(arr,list)=>{for(const it of list){if(!it.url||seen.has(it.url))continue;seen.add(it.url);arr.push(it);}};
    const byDateDesc=(a,b)=>(b.published||"").localeCompare(a.published||"");
    // 4カテゴリ（登録銘柄IR・米国株IR・国内市況・海外市況）を単純に連結するだけだと、各カテゴリ内は
    // 新しい順でも、カテゴリをまたいだ全体では古い記事が新しい記事より上に出てしまっていたため、
    // 「重要」枠・「残り」枠それぞれの中で公開日時の降順に並べ替える（重要枠を上に固定する方針は維持）。
    const important=[];push(important,[...s.stockNewsList,...s.usStockNewsList,...s.macroNewsDomestic,...s.macroNewsOverseas,...s.stockNameNewsList].filter(it=>isImportantNews(it.title)));
    important.sort(byDateDesc);
    const rest=[];
    push(rest,s.stockNewsList.slice(0,6));
    push(rest,s.usStockNewsList.slice(0,6));
    push(rest,s.macroNewsDomestic.slice(0,8));
    push(rest,s.macroNewsOverseas.slice(0,8));
    push(rest,s.stockNameNewsList.slice(0,10));
    rest.sort(byDateDesc);
    return [...important,...rest];
  },[s.stockNewsList,s.usStockNewsList,s.macroNewsDomestic,s.macroNewsOverseas,s.stockNameNewsList]);

  // 10-5章：ページ最上部の重要ニュース通知バナー用（全カテゴリを対象に件数を集計）
  const importantNewsAll=useMemo(()=>{
    const seen=new Set();const out=[];
    [...s.stockNewsList,...s.usStockNewsList,...s.macroNewsDomestic,...s.macroNewsOverseas,...s.stockNameNewsList].forEach(it=>{
      if(isImportantNews(it.title)&&it.url&&!seen.has(it.url)){seen.add(it.url);out.push(it);}
    });
    return out;
  },[s.stockNewsList,s.usStockNewsList,s.macroNewsDomestic,s.macroNewsOverseas,s.stockNameNewsList]);

  // 5章：「分析」ボタン。押すたびに分析タブ（12章）の対象銘柄リストに追加/削除をトグルし、
  // 追加・削除いずれの場合も結果をすぐ確認できるよう「分析」タブに遷移する。
  const toggleAnalysisTarget=(code)=>{
    setS(p=>({...p,analysisTargets:p.analysisTargets.includes(code)
      ?p.analysisTargets.filter(c=>c!==code):[...p.analysisTargets,code]}));
    setTab("analysis");
  };

  // 登録銘柄テーブルの「決算」ボタン。押すたびに決算分析タブの対象銘柄リストに追加/削除をトグルし、
  // 追加・削除いずれの場合も結果をすぐ確認できるよう「決算分析」タブに遷移する（分析ボタンと同様の設計）。
  const toggleEarningsTarget=(code)=>{
    setS(p=>({...p,earningsTargets:p.earningsTargets.includes(code)
      ?p.earningsTargets.filter(c=>c!==code):[...p.earningsTargets,code]}));
    setTab("earnings");
  };

  // 2026-08-21 ユーザー要望：登録銘柄テーブルの「監視銘柄」ボタン。「監視銘柄」タブでまとめて
  // 確認する対象銘柄を上限なく手動選択する（旧「本日優先」＝5分おき自動スキャン機能はここで撤去）。
  const toggleWatchTarget=(code)=>{
    setS(p=>p.watchTargets.includes(code)
      ?{...p,watchTargets:p.watchTargets.filter(c=>c!==code)}
      :{...p,watchTargets:[...p.watchTargets,code]});
  };
  const removeWatchTarget=(code)=>setS(p=>({...p,watchTargets:p.watchTargets.filter(c=>c!==code)}));

  // 売買記録（トレードジャーナル）：銘柄分析カードの「記録に追加」ボタンから、そのカードの
  // entry/stop/target/marketEnv/entryReasonを初期値にしたドラフトを開き、「記録」タブへ遷移する。
  // 保存するまでs.journalには追加しない（下書き段階ではjournalDraft stateのみで保持）。
  const [journalDraft,setJournalDraft]=useState(null);
  const openJournalDraft=(w,a)=>{
    setJournalDraft({
      code:w.code,name:w.name,action:"新規買い",
      price:a.entry??"",shares:"",
      entryPlan:{entry:a.entry,stop:a.stop,target:a.target},
      marketEnvAtEntry:a.marketEnv||"",reason:a.entryReason||"",
    });
    setTab("journal");
  };
  const saveJournalEntry=()=>{
    if(!journalDraft)return;
    const entry={...journalDraft,id:Date.now()+Math.random(),createdAt:new Date().toISOString(),result:"未定",lessonNote:""};
    setS(p=>({...p,journal:[entry,...p.journal]}));
    setJournalDraft(null);
  };
  const updateJournalEntry=(id,patch)=>setS(p=>({...p,journal:p.journal.map(j=>j.id===id?{...j,...patch}:j)}));
  const deleteJournalEntry=(id)=>{if(!confirm("この記録を削除しますか？"))return;setS(p=>({...p,journal:p.journal.filter(j=>j.id!==id)}));};

  // マイルール：追加・オンオフ・削除。良いトレード・気づきの都度アップデートできるようにする
  // （2026-08-20 ユーザー要望）。トグルで一時的に無効化もできる（削除せず参照だけ残したい場合）。
  const [newRuleText,setNewRuleText]=useState("");
  const addMyRule=(text)=>{
    const t=(text||"").trim();
    if(!t)return;
    setS(p=>({...p,myRules:[{id:Date.now()+Math.random(),text:t,active:true,createdAt:new Date().toISOString()},...p.myRules]}));
  };
  const toggleMyRule=(id)=>setS(p=>({...p,myRules:p.myRules.map(r=>r.id===id?{...r,active:!r.active}:r)}));
  const deleteMyRule=(id)=>setS(p=>({...p,myRules:p.myRules.filter(r=>r.id!==id)}));

  const rollToNextDay=()=>{if(!confirm("今日の値を前日値へ繰り越し、新しい一日にします（登録銘柄・分析対象銘柄は保持）。よろしいですか？"))return;
    setS(p=>({...emptyState(),date:todayISO(),watchlist:p.watchlist,watchlistUS:p.watchlistUS,analysisTargets:p.analysisTargets,
      watchTargets:p.watchTargets,
      metrics:Object.fromEntries(Object.entries(p.metrics).map(([k,v])=>[k,{t:"",p:v.t}]))}));};
  const exportJSON=()=>{const blob=new Blob([JSON.stringify(s,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="trade-cockpit-"+s.date+".json";a.click();URL.revokeObjectURL(url);};
  const importJSON=(e)=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);
      setS({...emptyState(),...d,watchlist:migrateSectors(d.watchlist),watchlistUS:migrateSectors(d.watchlistUS)});
    }catch{alert("読み込み失敗");}};r.readAsText(f);e.target.value="";};

  // 日本の個別株（TSE:xxxx）は無料の埋め込みウィジェットでは表示不可（東証データの再配信制限）。
  const embeddable=(sym)=>!/^TSE:/i.test(sym||"");

  // 5章：登録銘柄行の「チャート」ボタンから開くモーダル用チャート（6章でタブ内チャートは廃止、モーダルのみ）
  useEffect(()=>{if(!chartModal||!embeddable(chartModal.symbol))return;const c=modalChartRef.current;if(!c)return;
    c.innerHTML='<div class="tradingview-widget-container__widget"></div>';
    const studies=[];if(cBB)studies.push("BB@tv-basicstudies");if(cRSI)studies.push("RSI@tv-basicstudies");if(cMA)studies.push("MASimple@tv-basicstudies");
    const sc=document.createElement("script");sc.src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";sc.async=true;
    sc.innerHTML=JSON.stringify({symbol:chartModal.symbol,interval:"D",timezone:"Asia/Tokyo",theme:"light",style:"1",locale:"ja",studies,width:"100%",height:480,allow_symbol_change:false});
    c.appendChild(sc);},[chartModal,cBB,cRSI,cMA]);

  // 5-2章：JP個別株（TradingView無料埋め込み不可）は立花証券APIの日足データで自前描画する。
  useEffect(()=>{
    if(!chartModal||embeddable(chartModal.symbol)||chartModal.market!=="JP"||!chartModal.code)return;
    if(typeof LightweightCharts==="undefined"){setJpHistoryMsg("チャート描画ライブラリの読み込みに失敗しました。通信環境をご確認ください。");return;}
    let cancelled=false;
    setJpHistoryMsg("読み込み中…");
    fetch("/api/stock-history?code="+encodeURIComponent(chartModal.code))
      .then(r=>r.json())
      .then(d=>{
        if(cancelled)return;
        const hist=d.history||[];
        const el=jpChartRef.current;
        if(!el)return;
        el.innerHTML="";
        if(hist.length===0){setJpHistoryMsg("立花証券APIからチャートデータを取得できませんでした（未接続、または銘柄が対象外の可能性があります）。下のボタンからTradingView本体でご確認ください。");return;}
        setJpHistoryMsg("");
        const chart=LightweightCharts.createChart(el,{width:el.clientWidth||680,height:440,
          layout:{background:{color:"transparent"},textColor:"#565A52"},
          grid:{vertLines:{color:"#D6D8CF"},horzLines:{color:"#D6D8CF"}},
          timeScale:{borderColor:"#C6C8BF"},rightPriceScale:{borderColor:"#C6C8BF"}});
        const series=chart.addCandlestickSeries({upColor:"#AE3A34",downColor:"#2C6A48",borderVisible:false,
          wickUpColor:"#AE3A34",wickDownColor:"#2C6A48"}); // 日本の相場慣習に合わせ赤=上昇・緑=下落
        series.setData(hist.map(r=>({time:r.date,open:r.open,high:r.high,low:r.low,close:r.close})));
        chart.timeScale().fitContent();
        // モーダル表示直後はレイアウト確定前でclientWidthが0のことがあるため、
        // ResizeObserverで実測幅が変わるたびに追従させる（ウィンドウリサイズも含めて一本化）。
        const ro=new ResizeObserver(entries=>{
          const w=entries[0]?.contentRect?.width;
          if(w)chart.applyOptions({width:Math.floor(w)});
        });
        ro.observe(el);
        // モーダルのレイアウトが1フレーム遅れて確定する環境向けの保険（ResizeObserverだけでは
        // 追従しないケースがあったため、初期化直後に実測幅で明示的にも合わせておく）。
        requestAnimationFrame(()=>{if(el.clientWidth)chart.applyOptions({width:el.clientWidth});});
        el._cleanup=()=>{ro.disconnect();chart.remove();};
      })
      .catch(()=>{if(!cancelled)setJpHistoryMsg("取得に失敗しました。start.batのサーバーが起動しているかご確認ください。");});
    return()=>{cancelled=true;if(jpChartRef.current&&jpChartRef.current._cleanup)jpChartRef.current._cleanup();};
  },[chartModal]);

  const openTV=(tv)=>{if(tv)window.open("https://jp.tradingview.com/chart/?symbol="+encodeURIComponent(tv),"_blank");};

  // 8章：日次モニターの項目クリックでチャートをトグル開閉
  const toggleMetric=(key)=>setOpenMetrics(prev=>{const n=new Set(prev);n.has(key)?n.delete(key):n.add(key);return n;});
  const openMetricsKey=useMemo(()=>[...openMetrics].sort().join(","),[openMetrics]);
  useEffect(()=>{
    METRICS.forEach(m=>{
      if(!openMetrics.has(m.key)||!m.tvEmbed)return;
      const c=metricRefs.current[m.key];if(!c)return;
      c.innerHTML='<div class="tradingview-widget-container__widget"></div>';
      const sc=document.createElement("script");sc.src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";sc.async=true;
      sc.innerHTML=JSON.stringify({symbol:m.tv,interval:"D",timezone:"Asia/Tokyo",theme:"light",style:"1",locale:"ja",studies:[],width:"100%",height:320,allow_symbol_change:false});
      c.appendChild(sc);
    });
  },[openMetricsKey]);

  return (
    <div className="wrap">
      <div className="head">
        <div><div className="kicker">Trade Cockpit</div><h1>トレード・コックピット</h1></div>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <input type="date" className="mono" value={s.date} onChange={e=>set({date:e.target.value})} style={{fontSize:13}}/>
          <span className="mono" style={{fontSize:14,fontWeight:700,width:22,textAlign:"center",color:isMonday?"var(--accent)":"var(--ink)"}}>{day!=null?WD[day]:"―"}</span>
          <button className="ghost" onClick={rollToNextDay}>翌朝へ</button>
          <button className="ghost" onClick={exportJSON}>バックアップ↓</button>
          <button className="ghost" onClick={()=>fileRef.current.click()}>復元↑</button>
          <input ref={fileRef} type="file" accept="application/json,.json" onChange={importJSON} style={{display:"none"}}/>
          {/* 3-1章：テーマ切り替えトグル */}
          <button className="theme-toggle" onClick={toggleTheme} title="ダーク/ライト切り替え">{theme==="dark"?"🌙 ダーク":"☀️ ライト"}</button>
        </div>
      </div>

      {/* 10-5章：重要ニュース通知バナー（ページ最上部に常設、オン/オフ切り替え可） */}
      <div className="notify-bar" style={{marginTop:14}}>
        <span style={{fontSize:12.5,fontWeight:700}}>
          {s.notifyEnabled
            ? (importantNewsAll.length ? `⚠ 重要ニュース ${importantNewsAll.length}件（「ニュース」タブで確認）` : "重要ニュース通知：オン（該当ニュースなし）")
            : "重要ニュース通知：オフ"}
        </span>
        <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,cursor:"pointer"}}>
          <input type="checkbox" checked={s.notifyEnabled} onChange={e=>set({notifyEnabled:e.target.checked})}/>通知を有効にする
        </label>
      </div>

      {/* タブ並び順：日次モニター→ニュース→アメリカ市場(6-1)→日本市場→決算分析→銘柄分析(12章)。
          日次モニターは6章の並びに含まれないが、要望により先頭に配置。
          決算分析：登録銘柄テーブルの「決算」ボタンで追加した銘柄の直近決算短信を表示するタブ
          （tabキーはearnings、内部状態はearningsTargets/earningsDetail）。「銘柄分析」は元「分析」タブ
          （tabキーはanalysisのまま、ラベルのみ変更）で、混同を避けるため隣に並べている。 */}
      <div className="tabs">
        <button className={"tab"+(tab==="monitor"?" on":"")} onClick={()=>setTab("monitor")}>日次モニター</button>
        <button className={"tab"+(tab==="news"?" on":"")} onClick={()=>setTab("news")}>ニュース</button>
        <button className={"tab"+(tab==="watch"?" on":"")} onClick={()=>setTab("watch")}>監視銘柄</button>
        <button className={"tab"+(tab==="us"?" on":"")} onClick={()=>setTab("us")}>アメリカ市場</button>
        <button className={"tab"+(tab==="briefing"?" on":"")} onClick={()=>setTab("briefing")}>日本市場</button>
        <button className={"tab"+(tab==="earnings"?" on":"")} onClick={()=>setTab("earnings")}>決算分析</button>
        <button className={"tab"+(tab==="analysis"?" on":"")} onClick={()=>setTab("analysis")}>銘柄分析</button>
        <button className={"tab"+(tab==="journal"?" on":"")} onClick={()=>setTab("journal")}>記録</button>
      </div>

      {/* ===== 日次モニター（独立タブ） ===== */}
      {tab==="monitor" && <div style={{marginTop:18}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
          <div className="sec-head">日次モニター</div>
          <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            <span style={{fontSize:11,color:"var(--inkSoft)"}}>{monitorFetching?"更新中…":monitorMsg}</span>
          </div>
        </div>

              <button className="btn" onClick={requestNotifyPermission}>{notifyPermission==="unsupported"?"通知非対応ブラウザ":"デスクトップ通知を許可"}</button>}
          </div>
          <div className="sec-note" style={{marginTop:8}}>セクター内逆行銘柄の検知、出来高ブレイクアウト該当銘柄の「監視銘柄」への自動追加のタイミングで、ブラウザのデスクトップ通知でお知らせします（許可が必要・タブを開いている間のみ動作）。</div>
          {sectorLaggards.length>0 && <div style={{marginTop:12,paddingTop:10,borderTop:"1px solid var(--ruleSoft)"}}>
            <div style={{fontSize:12.5,fontWeight:700,color:"var(--ink)",marginBottom:6}}>↗ セクター内逆行銘柄（弱いセクターの中で一人勝ちしている銘柄）</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {sectorLaggards.slice(0,10).map(item=>
                <span key={item.code} className="chip" style={{cursor:"default"}}>{item.name}（{item.code}）：{item.pct>0?"+":""}{item.pct.toFixed(2)}% / {item.sector}平均{item.sectorAvg.toFixed(2)}%</span>)}
            </div>
          </div>}
        </div>

        {journalDraft && <div className="card" style={{marginTop:12,marginBottom:16,padding:"14px 16px"}}>
          <div style={{fontWeight:700,marginBottom:8}}>記録の下書き：{journalDraft.name}（{journalDraft.code}）</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:10,marginBottom:8}}>
            <label style={{fontSize:12,color:"var(--inkSoft)"}}>区分
              <select value={journalDraft.action} onChange={e=>setJournalDraft({...journalDraft,action:e.target.value})} style={{marginLeft:6,fontSize:13}}>
                {["新規買い","買い増し","利確","損切り","見送り"].map(a=><option key={a} value={a}>{a}</option>)}
              </select>
            </label>
            <label style={{fontSize:12,color:"var(--inkSoft)"}}>価格
              <input type="number" value={journalDraft.price} onChange={e=>setJournalDraft({...journalDraft,price:e.target.value})}
                style={{marginLeft:6,width:100,fontSize:13,padding:"2px 6px",border:"1px solid var(--rule)",borderRadius:3,background:"var(--bg)",color:"var(--ink)"}}/>
            </label>
            <label style={{fontSize:12,color:"var(--inkSoft)"}}>株数
              <input type="number" value={journalDraft.shares} onChange={e=>setJournalDraft({...journalDraft,shares:e.target.value})}
                style={{marginLeft:6,width:90,fontSize:13,padding:"2px 6px",border:"1px solid var(--rule)",borderRadius:3,background:"var(--bg)",color:"var(--ink)"}}/>
            </label>
          </div>
          <div style={{fontSize:11.5,color:"var(--inkSoft)",marginBottom:6}}>
            エントリー時プラン：購入{journalDraft.entryPlan.entry?.toLocaleString?.()??"—"}／損切り{journalDraft.entryPlan.stop?.toLocaleString?.()??"—"}／利確{journalDraft.entryPlan.target?.toLocaleString?.()??"—"}
            {journalDraft.marketEnvAtEntry && <> ・地合い：{journalDraft.marketEnvAtEntry}</>}
          </div>
          <label style={{display:"block",fontSize:12,color:"var(--inkSoft)",marginBottom:8}}>理由
            <textarea value={journalDraft.reason} onChange={e=>setJournalDraft({...journalDraft,reason:e.target.value})}
              rows={2} style={{display:"block",width:"100%",fontSize:12.5,padding:6,marginTop:4,border:"1px solid var(--rule)",borderRadius:3,background:"var(--bg)",color:"var(--ink)"}}/>
          </label>
          <div style={{display:"flex",gap:8}}>
            <button className="btn primary" onClick={saveJournalEntry}>記録を保存</button>
            <button className="btn" onClick={()=>setJournalDraft(null)}>破棄</button>
          </div>
        </div>}

        {s.journal.length===0
          ? <div style={{padding:26,textAlign:"center",color:"var(--inkSoft)",fontSize:13,border:"1px solid var(--rule)",borderRadius:4,background:"var(--card)"}}>
              記録はまだありません。「銘柄分析」タブの各カードにある「記録に追加」ボタンから記録できます。
            </div>
          : <>
              <div style={{fontSize:12,color:"var(--inkSoft)",marginBottom:8}}>
                合計{s.journal.length}件（{["成功","失敗","引分","未定"].map(r=>`${r}${s.journal.filter(j=>j.result===r).length}`).join("・")}）
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                {s.journal.map(j=><div key={j.id} className="card" style={{padding:"12px 14px"}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:6}}>
                    <div>
                      <b>{j.name}</b> <span className="mono" style={{fontSize:12,color:"var(--inkSoft)"}}>{j.code}</span>
                      <span style={{marginLeft:8,fontSize:12,color:"var(--inkSoft)"}}>{j.action}　{j.price?Number(j.price).toLocaleString():"—"}円 × {j.shares||"—"}株</span>
                    </div>
                    <span style={{fontSize:11,color:"var(--inkFaint)"}}>{new Date(j.createdAt).toLocaleString()}</span>
                  </div>
                  {j.reason && <div style={{fontSize:12,color:"var(--inkSoft)",marginTop:4}}>理由：{j.reason}</div>}
                  {j.marketEnvAtEntry && <div style={{fontSize:11,color:"var(--inkFaint)",marginTop:2}}>地合い：{j.marketEnvAtEntry}</div>}
                  <div style={{fontSize:11,color:"var(--inkFaint)",marginTop:2}}>
                    プラン：購入{j.entryPlan?.entry?.toLocaleString?.()??"—"}／損切り{j.entryPlan?.stop?.toLocaleString?.()??"—"}／利確{j.entryPlan?.target?.toLocaleString?.()??"—"}
                  </div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:10,alignItems:"center",marginTop:8}}>
                    <label style={{fontSize:12,color:"var(--inkSoft)"}}>結果
                      <select value={j.result} onChange={e=>updateJournalEntry(j.id,{result:e.target.value})} style={{marginLeft:6,fontSize:12.5}}>
                        {["未定","成功","失敗","引分"].map(r=><option key={r} value={r}>{r}</option>)}
                      </select>
                    </label>
                    <button className="iconbtn" style={{marginLeft:"auto"}} title="削除" onClick={()=>deleteJournalEntry(j.id)}>×</button>
                  </div>
                  <label style={{display:"block",fontSize:11.5,color:"var(--inkSoft)",marginTop:6}}>学び・次回改善点
                    <textarea value={j.lessonNote} onChange={e=>updateJournalEntry(j.id,{lessonNote:e.target.value})}
                      rows={2} style={{display:"block",width:"100%",fontSize:12,padding:6,marginTop:4,border:"1px solid var(--rule)",borderRadius:3,background:"var(--bg)",color:"var(--ink)"}}/>
                  </label>
                  {j.lessonNote?.trim() && <button className="action-btn" style={{marginTop:6}}
                      onClick={()=>addMyRule(j.lessonNote)}>＋ この学びをマイルールに追加</button>}
                </div>)}
              </div>
            </>}
      </div>}

      {/* ===== NEWS（9章・9-1章・9-2章） ===== */}
      {tab==="news" && (()=>{
        const NEWS_SUBTABS=[
          {key:"summary",label:"サマリー"},
          {key:"domestic",label:"国内市況"},
          {key:"overseas",label:"海外市況"},
          {key:"registered",label:"登録銘柄"},
          {key:"disclosure",label:"適時開示"},
        ];
        const listFor={summary:newsSummary,domestic:s.macroNewsDomestic,overseas:overseasAll,registered:stockNameNewsAll,disclosure:disclosureAll}[newsSubTab];
        const showCode=newsSubTab==="summary"||newsSubTab==="disclosure"||newsSubTab==="registered";
        const hasImportant=listFor.some(it=>isImportantNews(it.title));
        return <div style={{marginTop:18}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
            <div className="sec-head">ニュース</div>
            <span style={{fontSize:11,color:"var(--inkSoft)"}}>{newsFetching?"更新中…":newsMsg?newsMsg+"（1時間おき自動更新）":"1時間おきに自動更新"}</span>
          </div>
          <div className="sec-note">1時間おきに自動更新します。日本株は銘柄コードで確実に関連付けられる立花証券APIのニュース（NQN等）を優先し、報道の少ない銘柄だけGoogleニュースで補完します（広告・野球結果等は除外済み）。「サマリー」「海外市況」「登録銘柄」「適時開示」にはアメリカ市場（ダウ30社）のニュースも含みます。「適時開示」は日本の登録銘柄について当日を含む直近10日分のTDnet開示を種類を問わず（決算・上方修正・下方修正・新株予約権発行など）全件表示します（アメリカ株はTDnet対象外のためGoogleニュースのIR関連キーワードで近似）。「登録銘柄」は社名またはNQNの銘柄コードでの一致で拾ったニュース全般（優先度上位の銘柄まで）です。見出しをクリックすると元記事が開きます（NQN等、元記事URLの無い速報はクリックできません）。</div>
          <div className="subtabs">
            {NEWS_SUBTABS.map(t=><button key={t.key} className={"chip"+(newsSubTab===t.key?" on":"")} onClick={()=>{setNewsSubTab(t.key);setNewsShowCount(NEWS_PAGE_SIZE);}}>{t.label}</button>)}
          </div>
          {hasImportant && <div style={{display:"flex",alignItems:"center",gap:10,background:"var(--upBg)",border:"1px solid var(--up)",borderRadius:4,padding:"10px 14px",marginBottom:12}}>
            <span style={{fontSize:13,fontWeight:700,color:"var(--up)"}}>⚠ 重要ニュースを含みます</span>
            <span style={{fontSize:12,color:"var(--inkSoft)"}}>サプライズ決算・戦争紛争・パンデミック・大規模災害・株価暴落に関連する見出しに印を付けています。</span>
          </div>}
          <div className="card" style={{padding:"14px 16px 6px"}}>
            <NewsList items={listFor.slice(0,newsShowCount)} showName={showCode}/>
          </div>
          {listFor.length>newsShowCount && <div style={{textAlign:"center",marginTop:10}}>
            <button className="btn" onClick={()=>setNewsShowCount(c=>c+NEWS_PAGE_SIZE)}>もっと見る（残り{listFor.length-newsShowCount}件）</button>
          </div>}
        </div>;
      })()}

      {/* 5章：登録銘柄行の「チャート」ボタンで開くモーダル（タブに依存しない。6章でタブ内チャートは廃止） */}
      {chartModal && <div onClick={()=>setChartModal(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:20,
          display:"flex",alignItems:"center",justifyContent:"center",padding:18}}>
        <div onClick={e=>e.stopPropagation()} style={{background:"var(--card)",border:"1px solid var(--rule)",borderRadius:12,
            width:"100%",maxWidth:760,maxHeight:"92vh",overflowY:"auto",padding:24,boxShadow:"var(--shadowLg)"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
            <div><div className="kicker">Chart</div><div style={{fontSize:17,fontWeight:700}}>{chartModal.name}</div>
              <div className="mono" style={{fontSize:11.5,color:"var(--inkSoft)"}}>{chartModal.symbol}</div></div>
            <button className="iconbtn" style={{fontSize:20}} onClick={()=>setChartModal(null)}>×</button>
          </div>
          {embeddable(chartModal.symbol) && <div style={{display:"flex",gap:14,flexWrap:"wrap",marginBottom:10}}>
            <label style={{fontSize:12.5,display:"flex",gap:6,alignItems:"center",cursor:"pointer"}}><input type="checkbox" checked={cBB} onChange={e=>setCBB(e.target.checked)}/>ボリンジャー</label>
            <label style={{fontSize:12.5,display:"flex",gap:6,alignItems:"center",cursor:"pointer"}}><input type="checkbox" checked={cRSI} onChange={e=>setCRSI(e.target.checked)}/>RSI</label>
            <label style={{fontSize:12.5,display:"flex",gap:6,alignItems:"center",cursor:"pointer"}}><input type="checkbox" checked={cMA} onChange={e=>setCMA(e.target.checked)}/>移動平均</label>
          </div>}
          {embeddable(chartModal.symbol)
            ? <div key="modaltvchart" ref={modalChartRef} style={{border:"1px solid var(--rule)",borderRadius:4,overflow:"hidden",background:"var(--card)",minHeight:484}}></div>
            : <div key="modaljpchart">
                <div style={{fontSize:11,color:"var(--inkSoft)",marginBottom:8}}>日本の個別株はTradingViewの無料埋め込みチャートでは表示できないため（東証データの再配信制限）、立花証券APIの日足データ（分割調整済み・上場来）で描画しています。</div>
                {jpHistoryMsg && <div style={{fontSize:12.5,color:"var(--inkSoft)",padding:"10px 2px"}}>{jpHistoryMsg}</div>}
                {/* 読み込み中もdisplay:noneにしない（非表示状態でチャート初期化するとサイズが0のまま固定される問題があったため、常にレイアウトに乗せておく） */}
                <div ref={jpChartRef} style={{border:"1px solid var(--rule)",borderRadius:4,overflow:"hidden",background:"var(--card)",minHeight:440}}></div>
                <div style={{marginTop:10,textAlign:"right"}}><button className="ghost" onClick={()=>openTV(chartModal.symbol)}>↗ TradingViewで開く</button></div>
              </div>}
        </div>
      </div>}

      <p className="foot" style={{borderTop:"1px solid var(--ruleSoft)",paddingTop:12,marginTop:24}}>
        データはこのブラウザに自動保存されます（同じファイルを同じブラウザで開けば継続）。念のため時々「バックアップ↓」でJSON保存を。<br/>
        このツールは判断材料の整理用で、売買を推奨するものではありません。最終判断はご自身で。
      </p>
    </div>
  );
}
// 初回レンダー前にテーマを確定させ、ダークモード利用者でのライト表示のちらつきを防ぐ
(()=>{const t=getInitialTheme();setColorTheme(t);document.documentElement.dataset.theme=t;})();
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
