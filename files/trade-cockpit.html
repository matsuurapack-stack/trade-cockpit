<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>トレード・コックピット</title>
<style>
/* ===== デザイントークン（design_renewal_instruction.md）=====
   ムームー証券アプリを参考にした鮮やかな配色・タイポグラフィ・ダークモード対応。
   単体HTML構成（ビルド工程なし、CLAUDE.md方針）を維持するため、別ファイルの
   design-tokens.jsonではなくこのCSS変数群に集約する。
   注意：上昇/下落の色は日本の相場慣習（赤=上昇・緑=下落）を維持するため、
   指示書の「上昇=緑系」の鮮やかな数値は当アプリの赤(--up)に、
   「下落=赤系」の数値は当アプリの緑(--down)に、意味を保ったまま割り当てている。 */
:root{
  --paper:#FFFFFF; --paperAlt:#FFFFFF; --card:#F2F3F5; --ink:#1A1A1A; --inkSoft:#666666; --inkFaint:#999999;
  --rule:#DDDDDD; --ruleSoft:#EAEAEA; --band:#F2F3F5;
  --gain:#00A868; --loss:#E0334A; --accent:#FF7A17; --accentSoft:rgba(255,122,23,.15);
  --star:#B8863B; --warn:#FFA500;
  --alarm:#FFF3D6; --alarmEdge:#B8860B; --alarmText:#1A1A1A;
  --up:#FF4D5C; --down:#00B366; --upBg:#FFE3E5; --downBg:#DFF7EC;
  --shadow:none; --shadowLg:0 12px 32px rgba(0,0,0,.16);
}
:root[data-theme="dark"]{
  --paper:#101012; --paperAlt:#1C1C1E; --card:#1C1C1E; --ink:#FFFFFF; --inkSoft:#CCCCCC; --inkFaint:#909090;
  --rule:#333333; --ruleSoft:#2A2A2A; --band:#1C1C1E;
  --gain:#00D084; --loss:#FF6B78; --accent:#FF9142; --accentSoft:rgba(255,145,66,.2);
  --star:#D9A64E; --warn:#FFB84D;
  --alarm:#3A2A0A; --alarmEdge:#FFA500; --alarmText:#FFF3D6;
  --up:#FF8A93; --down:#4DFFB0; --upBg:rgba(255,77,92,.22); --downBg:rgba(0,208,132,.2);
  --shadow:none; --shadowLg:0 16px 40px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{background-color:var(--paper)}
body{margin:0;background-color:var(--paper);color:var(--ink);font-size:15px;min-height:100vh;
  font-family:'Segoe UI','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,Arial,sans-serif}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding:22px 18px 46px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;
  border-bottom:2px solid var(--ink);padding-bottom:12px}
.kicker{font-size:11px;letter-spacing:3px;color:var(--inkSoft);text-transform:uppercase}
h1{margin:3px 0 0;font-size:28px;font-weight:700;line-height:1.2;letter-spacing:-.4px}
/* テーマ切り替えトグル（3-1章） */
.theme-toggle{display:inline-flex;align-items:center;gap:6px;background:var(--paperAlt);color:var(--inkSoft);
  border:1px solid var(--rule);padding:7px 12px;font-size:13px;border-radius:8px;cursor:pointer}
.theme-toggle:hover{background:var(--band)}
/* 10-1章：タブ数が増えても横スクロールで収まるようにする（4-3章：タブバーのスタイル統一） */
.tabs{display:flex;gap:4px;margin-top:16px;background:var(--band);border-radius:8px 8px 0 0;
  padding:2px 4px 0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.tabs::-webkit-scrollbar{height:6px}
.tabs::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}
.tab{background:transparent;border:none;border-bottom:3px solid transparent;color:var(--inkSoft);
  font-size:15px;padding:9px 16px;cursor:pointer;font-weight:600;flex:none;white-space:nowrap;transition:color .15s}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:800}
.sec-head{font-size:22px;font-weight:600;line-height:1.3;margin:0 0 4px}
.sec-note{font-size:13px;color:var(--inkSoft);margin-bottom:10px}
.card{border:none;background:var(--card);border-radius:14px;padding:14px 16px 16px;
  box-shadow:var(--shadow);transition:background-color .2s ease,border-color .2s ease}
.card-t{font-size:18px;font-weight:600;line-height:1.4}
.card-n{font-size:13px;color:var(--inkSoft);margin-top:2px}
.card-hd{border-bottom:1px solid var(--ruleSoft);padding-bottom:8px;margin-bottom:10px}
.grid{display:grid;gap:16px}
.btn{display:inline-flex;align-items:center;gap:6px;border:none;padding:10px 18px;font-size:14px;
  border-radius:8px;cursor:pointer;font-weight:600;transition:filter .15s,box-shadow .15s}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.ghost{display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--inkSoft);
  border:1px solid var(--rule);padding:9px 14px;font-size:14px;border-radius:8px;cursor:pointer;transition:background-color .15s}
.ghost:hover{background:var(--band)}
/* 登録銘柄行の「チャート」「分析」ボタンなど、背景が塗り分け配色（ヒートマップ風）のセル上に
   置かれるボタン用。透明な.ghostだと濃い背景に埋もれて見えにくくなるため、常に不透明な背景を持たせる */
.action-btn{display:inline-flex;align-items:center;gap:5px;background:var(--paperAlt);color:var(--ink);
  border:1px solid rgba(127,127,127,.35);padding:5px 10px;font-size:12.5px;font-weight:600;border-radius:6px;
  cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:filter .15s}
.action-btn:hover{filter:brightness(.94)}
.action-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.iconbtn{background:transparent;border:none;color:var(--inkSoft);cursor:pointer;padding:4px;font-size:15px}
input,select,textarea{padding:10px 12px;border:1px solid var(--rule);background:var(--paperAlt);
  color:var(--ink);font-size:14px;border-radius:6px;font-family:inherit;transition:border-color .15s,box-shadow .15s}
input::placeholder,textarea::placeholder{color:var(--inkFaint)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
textarea{resize:vertical;line-height:1.6;width:100%}
label.fld{display:block;margin-top:8px}
label.fld span{font-size:12px;color:var(--inkSoft);display:block;margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{padding:8px 10px;font-size:12px;font-weight:600;text-align:left;white-space:nowrap;color:var(--inkSoft)}
td{padding:7px 10px;vertical-align:middle}
.lbl{font-size:12px;color:var(--inkSoft);margin:8px 0 4px}
.chip{font-size:13px;padding:4px 10px;border-radius:16px;cursor:pointer;border:1px solid var(--rule);
  background:var(--paperAlt);color:var(--inkSoft);transition:background-color .15s,color .15s}
.chip:hover{background:var(--band)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.alarm{background:var(--alarm);color:var(--alarmText);border:2px solid var(--alarmEdge);border-radius:8px;
  padding:16px 18px;display:flex;align-items:center;gap:13px;animation:almPulse 1.2s ease-in-out infinite}
@keyframes almPulse{0%,100%{opacity:1}50%{opacity:.82}}
.foot{margin-top:16px;font-size:13px;color:var(--inkSoft);line-height:1.7}
.results{position:absolute;z-index:5;left:0;right:0;margin-top:4px;background:var(--paperAlt);
  border:1px solid var(--rule);border-radius:8px;box-shadow:var(--shadowLg);overflow:hidden}
.res-row{display:flex;width:100%;align-items:center;gap:10px;padding:9px 12px;background:transparent;
  border:none;border-bottom:1px solid var(--ruleSoft);cursor:pointer;text-align:left}
.res-row:hover{background:var(--band)}
.loading{max-width:400px;margin:80px auto;text-align:center;color:var(--inkSoft)}
.news-list{display:block}
.news-item{display:flex;gap:9px;align-items:center;padding:10px 4px;
  border-bottom:1px solid var(--ruleSoft);text-decoration:none;color:var(--ink)}
.news-item:last-child{border-bottom:none}
.news-item:hover{background:var(--band)}
.news-item:hover .news-title{color:var(--accent);text-decoration:underline}
.news-tag{flex:none;font-size:11px;font-weight:700;color:var(--accent);background:var(--paperAlt);
  border:1px solid var(--rule);border-radius:3px;padding:1px 6px;white-space:nowrap}
.news-body{flex:1;min-width:0}
.news-title{font-size:14px;line-height:1.5}
.news-meta{display:block;font-size:11px;color:var(--inkFaint);margin-top:3px}
.news-empty{font-size:12px;color:var(--inkSoft);padding:16px 4px}
/* 9-2章：重大ニュースの強調表示（4-6章：アラート仕様に統一） */
.news-item.important{background:var(--upBg);border-left:3px solid var(--up);padding-left:8px;margin-left:-1px}
.news-item.important:hover{background:var(--upBg)}
.news-alert-badge{flex:none;font-size:10.5px;font-weight:700;color:#fff;background:var(--up);
  border-radius:3px;padding:2px 6px;white-space:nowrap;align-self:center}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
/* 10-5章：ニュース項目のサムネイル（実画像は取得できないため、出典名の頭文字によるアバター） */
.news-thumb{flex:none;width:42px;height:42px;border-radius:6px;background:var(--band);color:var(--inkSoft);
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;align-self:center;
  box-shadow:var(--shadow)}
/* 10-5章：運営からの「新着情報」お知らせをニュース一覧に自然に挟み込むための行 */
.news-announce{display:flex;gap:9px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--ruleSoft);
  background:var(--paperAlt);border-left:3px solid var(--accent);padding-left:8px;margin-left:-1px}
.news-announce-badge{flex:none;font-size:10.5px;font-weight:700;color:#fff;background:var(--accent);
  border-radius:3px;padding:2px 6px;white-space:nowrap}
/* 10-5章：重要ニュース通知バナー（ページ最上部に常設、オン/オフ切り替え可。4-6章：warning系に統一） */
.notify-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  background:var(--alarm);color:var(--alarmText);border:2px solid var(--alarmEdge);border-radius:8px;padding:10px 14px;margin-bottom:12px}
</style>
</head>

// ===== カラールール（セクター・銘柄共通。3章の仕様）=====
// 上昇率(%)は0.5%刻みで6段階(0-0.5/0.5-1.0/1.0-1.5/1.5-2.0/2.0-2.5/2.5超)に区分し、1段階ずつ赤/緑を濃くする。
// 最終段階(2.5%超)は上限なくすべて同じ最も濃い色で頭打ちにする。
// レベル1（0%超〜0.5%）は現状使用している --up / --down の色そのものを「最も薄い色」の基準として使う。
const CHANGE_STEP = 0.5;
const CHANGE_MAX_LEVEL = 6; // 0.5%刻み6段階。2.5%超は全て最終段階（最大濃度）

// design_renewal_instruction.md：ムームー証券を参考にした鮮やかな配色をライト/ダークそれぞれで定義。
// 日本の相場慣習（赤=上昇・緑=下落）は維持し、指示書の「上昇=緑系」の数値は当アプリの赤に、
// 「下落=赤系」の数値は当アプリの緑に、意味を保ったまま割り当てている。
// ダークモードでは背景が暗いため、レベル6（最濃）を黒に近づけるのではなく、より明るく彩度の高い
// 色にすることで視認性を確保する（3-4章：ダークモード時のコントラスト確認）。
const COLOR_PALETTE = {
  light: {upBase:"#FF4D5C", upDark:"#8B0000", downBase:"#00B366", downDark:"#00522E", upBg:"#FFE3E5", downBg:"#DFF7EC"},
  dark:  {upBase:"#FF8A93", upDark:"#FF3B4E", downBase:"#4DFFB0", downDark:"#00E676", upBg:"rgba(255,77,92,.22)", downBg:"rgba(0,208,132,.22)"},
};
// 3-2章：CSS変数だけでなくJS側の色計算（changeColor/Sparkline）もテーマに応じて出し分ける必要があるため、
// App内のテーマ切り替えエフェクトでこのモジュール変数を更新する（single-file構成のためprops経由にせず共有）。
let CURRENT_THEME = "light";
const setColorTheme=(t)=>{CURRENT_THEME=(t==="dark")?"dark":"light";};

const hexToRgb=(h)=>{
  if(h.startsWith("rgba")){const m=h.match(/[\d.]+/g);return [+m[0],+m[1],+m[2]];}
  const n=parseInt(h.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255];
};
const rgbToHex=(r,g,b)=>"#"+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join("");
const mixHex=(a,b,t)=>{const[ar,ag,ab]=hexToRgb(a),[br,bg,bb]=hexToRgb(b);return rgbToHex(ar+(br-ar)*t,ag+(bg-ag)*t,ab+(bb-ab)*t);};

// セルの背景色に対して、白文字/濃色文字のどちらが読みやすいかをWCAGの相対輝度で判定する
const relLuminance=(hex)=>{
  const [r,g,b]=hexToRgb(hex).map(v=>{const c=v/255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);});
  return 0.2126*r+0.7152*g+0.0722*b;
};
const contrastText=(bgHex)=>relLuminance(bgHex)>0.42?"#1A1A1A":"#FFFFFF";

// pct(%)を受け取り、日次モニター・セクター・登録銘柄どれでも使う共通のカラー情報を返す。
// セルの背景そのものを段階配色にし（ヒートマップ的な塗り分け）、文字色は背景の明るさに応じて
// 白/濃色を自動選択することで、セルの中でも数字が確実に読めるようにする。pctがnull/0はニュートラル。
const changeColor=(pct)=>{
  if(pct==null||pct===0) return {level:0,dir:null,fg:"var(--inkSoft)",fgSoft:"var(--inkSoft)",bg:"var(--card)"};
  const pal=COLOR_PALETTE[CURRENT_THEME];
  const level=Math.min(CHANGE_MAX_LEVEL,Math.ceil(Math.abs(pct)/CHANGE_STEP));
  const t=(level-1)/(CHANGE_MAX_LEVEL-1);
  const up=pct>0;
  const bg=mixHex(up?pal.upBase:pal.downBase, up?pal.upDark:pal.downDark, t);
  const fg=contrastText(bg);
  const fgSoft=fg==="#FFFFFF"?"rgba(255,255,255,.75)":"rgba(26,26,26,.65)";
  return {level,dir:up?"up":"down",fg,fgSoft,bg};
};

const DEFAULT_WATCHLIST=(()=>{const seen=new Set();return MASTER.filter(m=>m.market==="JP"&&!m.extra&&m.code&&!seen.has(m.code)&&seen.add(m.code))
  .map(m=>({id:m.code,...m,watch:"通常",note:""}));})();

  .map(m=>({id:m.code,...m,watch:"通常",note:""}));})();

});
// 1章：255社デフォルトを後から追加したため、既にlocalStorageに保存済みだったユーザーは
// 保存データの登録銘柄がそのまま優先され、新しいデフォルト銘柄が反映されないケースがある。
// 保存データに存在しない銘柄コードだけを追加する形で移行し、既存の登録銘柄・設定は保持する。
const mergeDefaults=(saved,defaults,max)=>{
  if(!Array.isArray(saved))return saved;
  const seen=new Set(saved.map(w=>w.code));
  const toAdd=defaults.filter(m=>!seen.has(m.code)).map(m=>({id:m.code,...m,watch:"通常",note:""}));
  return [...saved,...toAdd].slice(0,max);
};
const loadState=()=>{try{const r=localStorage.getItem(KEY);if(!r)return null;const d=JSON.parse(r);
  const merged={...emptyState(),...d,metrics:{...emptyMetrics(),...(d.metrics||{})}};
  merged.watchlist=mergeDefaults(d.watchlist,DEFAULT_WATCHLIST,MAX);
  merged.watchlistUS=mergeDefaults(d.watchlistUS,DEFAULT_WATCHLIST_US,MAX_US);
  return merged;
}catch{return null;}};

// 10-1章：カードUI基盤。ミニスパークライン（値上がり/値下がりでグラデーション色を変える）
function Sparkline({data,color,width=140,height=36}){
  const gid=(React.useId?React.useId():"spark")+"-g";
  if(!data||data.length<2) return <svg width={width} height={height}></svg>;
  const min=Math.min(...data),max=Math.max(...data);
  const range=(max-min)||1;
  const stepX=width/(data.length-1);
  const pts=data.map((v,i)=>[i*stepX,height-((v-min)/range)*height]);
  const line=pts.map(([x,y],i)=>(i===0?"M":"L")+x.toFixed(1)+","+y.toFixed(1)).join(" ");
  const area=line+` L${width},${height} L0,${height} Z`;
  return <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} style={{display:"block",width:"100%",height}} preserveAspectRatio="none">
    <defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor={color} stopOpacity="0.32"/>
      <stop offset="100%" stopColor={color} stopOpacity="0"/>
    </linearGradient></defs>
    <path d={area} fill={`url(#${gid})`} stroke="none"/>
    <path d={line} fill="none" stroke={color} strokeWidth="1.6"/>
  </svg>;
}

// interval件ごとに1件挟む（末尾到達で先頭に戻る簡易ローテーション）。
function NewsList({items,showName,announcements,announceInterval=5}){
  if(!items||!items.length) return <div className="news-empty">まだ取得していません。ブリーフィングの「リアルタイムデータを反映」を押してください。</div>;
  let annIdx=0;
  return <div className="news-list">
    {items.map((it,i)=>{
      const meta=[showName?it.name:null,it.source,it.published].filter(Boolean).join(" ・ ");
      const important=isImportantNews(it.title);
      const showAnnounce=announcements&&announcements.length&&i>0&&i%announceInterval===0;
      const ann=showAnnounce?announcements[annIdx++%announcements.length]:null;
      return <React.Fragment key={i}>
        {ann&&<div className="news-announce">
          <span className="news-announce-badge">お知らせ</span>

// 決算またぎ期待値：0.5刻み5段階の星評価。星の左半分クリックで0.5刻み、右半分クリックで整数刻みにする。
// いつでも編集可能（決算前の事前予想→決算後の答え合わせ、という運用を想定）。
function EarningsStars({value,onChange}){
  const v=value||0;
  const pick=(i,e)=>{
    const rect=e.currentTarget.getBoundingClientRect();
    const half=(e.clientX-rect.left)<rect.width/2;
    onChange(half?i+0.5:i+1);
  };
  return <span style={{display:"inline-flex",gap:1,cursor:"pointer"}} title={`期待値評価：${v}/5（クリックで編集）`}>
    {[0,1,2,3,4].map(i=>{
      const pct=Math.max(0,Math.min(1,v-i))*100;
      return <span key={i} onClick={e=>pick(i,e)} style={{position:"relative",display:"inline-block",fontSize:15,lineHeight:1}}>
        <span style={{color:"var(--rule)"}}>★</span>
        <span style={{position:"absolute",left:0,top:0,overflow:"hidden",width:pct+"%",color:"var(--star)"}}>★</span>
      </span>;
    })}
  </span>;
}

// 6-1章：銘柄検索・登録＋セクター別アコーディオン表示（2〜5章の仕様）を市場ごとに再利用するための共通コンポーネント。
// 日本市場・アメリカ市場タブの両方で、このコンポーネントをそのまま使い回すことで「全く同じ仕様・UI」を担保する。
function SectorWatchlist({market,watchlist,setWatchlist,candidates,max,stockQuotes,analysisTargets,onToggleAnalysis,onOpenChart}){
  const [q,setQ]=useState("");
  const [manualSector,setManualSector]=useState(SECTOR_CHOICES[0]);
  const [openSectors,setOpenSectors]=useState(()=>new Set());

  const regCodes=useMemo(()=>new Set(watchlist.map(w=>w.code)),[watchlist]);
  const results=useMemo(()=>{const t=q.trim().toLowerCase();if(!t)return[];
    return candidates.filter(m=>!regCodes.has(m.code)&&(m.code.toLowerCase().includes(t)||m.name.toLowerCase().includes(t)||m.sector.toLowerCase().includes(t))).slice(0,8);},[q,regCodes,candidates]);
  const addStock=(m)=>{if(watchlist.length>=max){alert("登録は最大"+max+"社までです。");return;}
    if(regCodes.has(m.code))return; setWatchlist([...watchlist,{id:m.code,...m,watch:"通常",note:""}]);setQ("");};
  const addManual=()=>{
    const raw=q.trim();if(!raw)return;if(watchlist.length>=max){alert("最大"+max+"社");return;}
    let code=raw,name=raw;
    if(!/^[0-9]{4}[0-9A-Za-z]?$/.test(raw)){
      const input=prompt(`「${raw}」の証券コード（例：5016、AAPL）を入力してください`,"");
      if(!input||!input.trim())return;
      code=input.trim();
    }
    setWatchlist([...watchlist,{id:Date.now()+Math.random(),code,name,sector:manualSector,market,tvSymbol:(market==="JP"?"TSE:"+code:code),watch:"通常",note:""}]);setQ("");};
  const delStock=(id)=>setWatchlist(watchlist.filter(w=>w.id!==id));

  // 銘柄コードの前日比(%)・売買代金（3章カラールール・セクター並び替えで共通利用）
  const pctOf=(code)=>{const qt=stockQuotes[code]||{};const t=num(qt.t),p=num(qt.p);
    return (t!=null&&p!=null&&p)?(t-p)/p*100:null;};
  const turnoverOf=(code)=>{const v=num(stockQuotes[code]?.turnover);return v!=null&&v>0?v:null;};

  // セクターの並び順は「セクター内合計売買代金の降順」。銘柄追加・株価更新のたびに再計算され、
  // 売買代金の変動に応じて自動的に入れ替わる。未取得時はSECTOR_CHOICES(33業種+指数・為替)の定義順にフォールバック。
  const sectorOrder=useMemo(()=>SECTOR_CHOICES,[]);
  const sectorGroups=useMemo(()=>{
    const map={};
    watchlist.forEach(w=>{(map[w.sector]=map[w.sector]||[]).push(w);});
    return Object.entries(map)
      .map(([sector,items])=>{
        const pcts=items.map(w=>pctOf(w.code)).filter(v=>v!=null);
        const avgPct=pcts.length?pcts.reduce((a,b)=>a+b,0)/pcts.length:null;
        const totalTurnover=items.reduce((sum,w)=>sum+(turnoverOf(w.code)||0),0);
        return {sector,avgPct,totalTurnover,items:[...items].sort((a,b)=>(wOrder[a.watch]-wOrder[b.watch])||a.code.localeCompare(b.code))};
      })
      .sort((a,b)=>(b.totalTurnover-a.totalTurnover)||(sectorOrder.indexOf(a.sector)-sectorOrder.indexOf(b.sector)));
  },[watchlist,stockQuotes,sectorOrder]);
  const toggleSector=(sec)=>setOpenSectors(prev=>{const n=new Set(prev);n.has(sec)?n.delete(sec):n.add(sec);return n;});

  return <div style={{marginTop:18}}>
    <div className="sec-head">登録銘柄　{watchlist.length}/{max}</div>
    <div className="sec-note">自動保存されます。</div>
    <div style={{position:"relative"}}>
      <div style={{display:"flex",alignItems:"center",gap:8,border:"1px solid var(--rule)",background:"var(--card)",borderRadius:4,padding:"8px 12px"}}>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder={market==="JP"?"銘柄コード・企業名・セクターで検索（例：6981、村田、化学）":"ティッカー・企業名・セクターで検索（例：AAPL、Apple、電気機器）"}
          style={{flex:1,border:"none",background:"transparent",outline:"none",fontSize:14}}/>
        {q && <button className="iconbtn" onClick={()=>setQ("")}>×</button>}
      </div>
      {q.trim() && <div className="results">
        {results.map(m=>
          <button key={m.code} className="res-row" onClick={()=>addStock(m)}>
            <span className="mono" style={{fontSize:12,width:60,color:"var(--inkSoft)"}}>{m.code}</span>
            <span style={{flex:1,fontSize:13}}>{m.name}</span>
            <span style={{fontSize:11,color:"var(--inkSoft)"}}>{m.sector}</span>
            <span style={{color:"var(--accent)",fontWeight:700}}>＋</span>
          </button>)}
        <div className="res-row" style={{background:"var(--band)",fontSize:12.5,color:"var(--inkSoft)",display:"flex",alignItems:"center",gap:8}}>
          <span>＋「{q.trim()}」を手動登録：業種</span>
          <select value={manualSector} onChange={e=>setManualSector(e.target.value)} style={{fontSize:12}}>
            {SECTOR_CHOICES.map(s=><option key={s} value={s}>{s}</option>)}
          </select>
          <button className="btn" style={{fontSize:11.5,padding:"2px 10px"}} onClick={addManual}>登録</button>
        </div>
      </div>}
    </div>
    <div style={{marginTop:12,border:"1px solid var(--rule)",background:"var(--card)",borderRadius:4,overflow:"hidden"}}>
      {sectorGroups.length===0 ?
        <div style={{padding:26,textAlign:"center",color:"var(--inkSoft)",fontSize:13}}>{`上の検索から銘柄を登録してください（最大${max}社）。`}</div> :
        sectorGroups.map(({sector,avgPct,items},i)=>{
          const isOpen=openSectors.has(sector);
          const avgC=changeColor(avgPct);
          return <div key={sector} style={{borderTop:i===0?"none":"1px solid var(--ruleSoft)"}}>
            <button onClick={()=>toggleSector(sector)} style={{display:"flex",alignItems:"center",width:"100%",gap:10,padding:"11px 14px",
              background:avgC.level>0?avgC.bg:(isOpen?"var(--band)":"transparent"),border:"none",cursor:"pointer",textAlign:"left",font:"inherit",
              color:avgC.level>0?avgC.fg:"var(--ink)"}}>
              <span className="mono" style={{fontSize:12,color:avgC.level>0?avgC.fgSoft:"var(--inkSoft)",width:14}}>{isOpen?"▾":"▸"}</span>
              <span style={{flex:1,fontSize:18,fontWeight:700}}>{sector}</span>
              <span className="mono" style={{fontSize:19,fontWeight:800,color:avgC.fg,minWidth:70,textAlign:"right"}}>
                {avgPct!=null?(avgPct>0?"+":"")+avgPct.toFixed(2)+"%":"—"}
              </span>
              <span style={{fontSize:13,color:avgC.level>0?avgC.fgSoft:"var(--inkSoft)"}}>{items.length}銘柄</span>
            </button>
            {isOpen && <div style={{overflowX:"auto"}}><table style={{minWidth:860}}>
              <thead><tr style={{background:"var(--band)"}}><th>コード</th><th>銘柄</th><th>現在値</th><th>前日比</th><th>高値</th><th>安値</th><th></th></tr></thead>
              <tbody>{items.map(w=>{
                const qt=stockQuotes[w.code]||{};
                const ct=num(qt.t),cp=num(qt.p),chi=num(qt.high),clo=num(qt.low);
                const delta=ct!=null&&cp!=null?ct-cp:null;
                const pct=pctOf(w.code);
                const c=changeColor(pct);
                const inAnalysis=analysisTargets.includes(w.code);
                return <tr key={w.id} style={{borderTop:"1px solid var(--ruleSoft)",background:c.bg,color:c.level>0?c.fg:"var(--ink)"}}>
                  <td className="mono" style={{fontWeight:700,fontSize:14}}>{w.code}</td>
                  <td style={{fontSize:16,fontWeight:600}}>{w.watch==="優先"&&<span style={{color:"var(--star)",marginRight:4}}>★</span>}{w.name}</td>
                  <td className="mono" style={{fontWeight:800,fontSize:17,color:c.fg,whiteSpace:"nowrap"}}>{ct!=null?ct.toLocaleString():"—"}</td>
                  <td className="mono" style={{fontWeight:700,fontSize:16,color:c.fg,whiteSpace:"nowrap"}}>{delta!=null?(delta>0?"+":"")+delta.toLocaleString(undefined,{maximumFractionDigits:2})+(pct!=null?` (${pct>0?"+":""}${pct.toFixed(2)}%)`:""):"—"}</td>
                  <td className="mono" style={{color:c.level>0?c.fgSoft:"var(--inkSoft)",whiteSpace:"nowrap"}}>{chi!=null?chi.toLocaleString():"—"}</td>
                  <td className="mono" style={{color:c.level>0?c.fgSoft:"var(--inkSoft)",whiteSpace:"nowrap"}}>{clo!=null?clo.toLocaleString():"—"}</td>
                  <td style={{textAlign:"center",whiteSpace:"nowrap"}}>
                    <button className="action-btn" style={{marginRight:5}} onClick={()=>onOpenChart(w)}>チャート</button>
                    <button className={"action-btn"+(inAnalysis?" on":"")} style={{marginRight:5}} onClick={()=>onToggleAnalysis(w.code)}>{inAnalysis?"✓ 分析中":"分析"}</button>
                    <button className="iconbtn" style={{color:c.level>0?c.fg:"var(--inkSoft)"}} onClick={()=>delStock(w.id)}>×</button>
                  </td>
                </tr>;})}</tbody>
            </table></div>}
          </div>;
        })}
    </div>
  </div>;
}

    }catch(e){}
    try{
      const nru=await fetch("/api/news",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(s.watchlistUS)});
      if(nru.ok){const ndu=await nru.json();
        setS(p=>({...p,usStockNewsList:Array.isArray(ndu.stockNews)?ndu.stockNews:p.usStockNewsList}));}
    }catch(e){}
  };
  const [newsFetching,setNewsFetching]=useState(false);

  // 5章：どのタブの「リアルタイムデータを反映」ボタンを押しても、日次モニター・日本市場・
  // アメリカ市場・ニュースの4タブすべて（＋分析タブの対象銘柄の再計算）を同時に更新する。
  const refreshAll=async()=>{
    setMonitorFetching(true);setMonitorMsg("取得中…");
    setJpFetching(true);setJpMsg("取得中…");
    setUsFetching(true);setUsMsg("取得中…");
    setNewsFetching(true);
    let mergedQuotes=s.stockQuotes;
    let hadError=false;
    // 指数・日本株(277社)・米国株(30社)を同時並行で叩くとyfinance/Yahoo側のレート制限に
    // 引っかかりやすく、1つの失敗がPromise.allで全体を巻き込んで「サーバーに接続できません」
    // が誤って出てしまっていたため、逐次実行にし、1つ失敗しても他は続行するようにした。
    try{
      const qr=await fetch("/api/quotes");
      if(!qr.ok) throw new Error("quotes");
      const qd=await qr.json();
      setS(p=>{const nm={...p.metrics};
        Object.entries(qd.quotes||{}).forEach(([k,v])=>{
          if(nm[k]!=null&&v){nm[k]={...nm[k],
            t:(v.t!=null?String(v.t):nm[k].t),
            p:(v.p!=null?String(v.p):nm[k].p),
            spark:(Array.isArray(v.spark)?v.spark:nm[k].spark)};}
        });
        return {...p,metrics:nm};});
      setMonitorMsg((qd.fetchedAt||nowHHMM())+" 取得完了");
    }catch(e){hadError=true;setMonitorMsg("");}

    try{
      const srJP=await fetch("/api/stock-quotes",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(s.watchlist)});
      if(!srJP.ok) throw new Error("stock-quotes-jp");
      const sdJP=await srJP.json();
      mergedQuotes={...mergedQuotes,...(sdJP.quotes||{})};
      setS(p=>({...p,stockQuotes:{...p.stockQuotes,...(sdJP.quotes||{})}}));
      setJpMsg(nowHHMM()+" 取得完了");
    }catch(e){hadError=true;setJpMsg("");}

    try{
      const srUS=await fetch("/api/stock-quotes",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(s.watchlistUS)});
      if(!srUS.ok) throw new Error("stock-quotes-us");
      const sdUS=await srUS.json();
      mergedQuotes={...mergedQuotes,...(sdUS.quotes||{})};
      setS(p=>({...p,stockQuotes:{...p.stockQuotes,...(sdUS.quotes||{})}}));
      setUsMsg(nowHHMM()+" 取得完了");
    }catch(e){hadError=true;setUsMsg("");}

    try{ await fetchNewsOnly(); }catch(e){hadError=true;}
    setNewsFetching(false);

    // SNSはNitter側インスタンスが元々不安定で失敗も想定内のため、取得できなくてもhadErrorには
    // 含めない（「サーバーに接続できません」の誤アラートを出さないため。失敗時はSNSタブ側の
    // 既存フォールバック表示＝Xで直接開くボタンに任せる）。
    await fetchSnsFor(snsHandle);

    if(analysisItems.length){
      setJpMsg("分析データを再計算中…");setUsMsg("分析データを再計算中…");
      await fetchAnalysisFor(analysisItems,mergedQuotes);
      const doneAt=nowHHMM()+" 取得完了";
      setJpMsg(doneAt);setUsMsg(doneAt);
    }
    setMonitorFetching(false);setJpFetching(false);setUsFetching(false);
    if(hadError)showConnError();
  };
  const anyFetching=monitorFetching||jpFetching||usFetching||newsFetching||snsLoading;

  const set=(patch)=>setS(p=>({...p,...patch}));
  const setMetric=(k,f,v)=>setS(p=>({...p,metrics:{...p.metrics,[k]:{...p.metrics[k],[f]:v}}}));
  const setWatchlistJP=(wl)=>set({watchlist:wl});
  const setWatchlistUS=(wl)=>set({watchlistUS:wl});
  const masterJP=useMemo(()=>MASTER.filter(m=>m.market==="JP"||m.market==="IDX"),[]);
  const masterUS=useMemo(()=>MASTER.filter(m=>m.market==="US"),[]);

  // 12章：分析タブの対象銘柄（日本市場・アメリカ市場どちらの登録銘柄からも追加され得る）
  const allWatch=useMemo(()=>[...s.watchlist,...s.watchlistUS],[s.watchlist,s.watchlistUS]);
  const analysisItems=useMemo(()=>s.analysisTargets.map(code=>allWatch.find(w=>w.code===code)).filter(Boolean),[s.analysisTargets,allWatch]);
  const [analyzing,setAnalyzing]=useState(false);
  const fetchAnalysisFor=async(items,quotesOverride)=>{
    if(!items||!items.length)return;
    setAnalyzing(true);
    // 再取得中に前回の結果を残したままにすると、取得に失敗した場合でも古い（現在値と食い違った）
    // 単価がそのまま表示され続けてしまう。先に対象銘柄のanalysisDataをクリアし、取得に失敗したら
    // 「データを取得できませんでした」と正直に表示されるようにする。
    setS(p=>{const ad={...p.analysisData};items.forEach(w=>{delete ad[w.code];});return {...p,analysisData:ad};});
    try{
      // 登録銘柄テーブルの現在値（直前の「リアルタイムデータを反映」で取得済み）をcurrentとして
      // 同封する。分析APIは内部でyfinanceに別途問い合わせるため、これを渡さないとタイミング次第で
      // テーブルの最新値と分析結果の現在値がズレる（反映直後に分析しても最新値が反映されない不具合）。
      // quotesOverride: refreshAllがsetS直後に呼ぶ際、setSが非同期でクロージャ内のs.stockQuotes
      // がまだ更新前の値のままになるため、取得したての最新値を明示的に渡してもらうための引数
      // （渡さないと「表の現在値は最新だが分析の単価だけ古い現在値のまま」というズレが起きる）。
      const quotes=quotesOverride||s.stockQuotes;
      const withCurrent=items.map(w=>({...w,current:quotes[w.code]?.t}));
      const ar=await fetch("/api/analysis",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(withCurrent)});
      if(ar.ok){const ad=await ar.json();setS(p=>({...p,analysisData:{...p.analysisData,...(ad.analysis||{})}}));}
    }catch(e){}
    setAnalyzing(false);
  };
  // 銘柄追加時：analysisDataにまだ結果がない対象銘柄だけを取得する
  useEffect(()=>{
    // technical_analysis_rules.md反映でスキーマ変更（strengthフィールド追加）したため、
    // 旧スキーマのキャッシュ済みデータ（strength未定義）も再取得対象に含める
    const missing=analysisItems.filter(w=>!s.analysisData[w.code]||s.analysisData[w.code].strength===undefined);
    if(missing.length)fetchAnalysisFor(missing);
  },[s.analysisTargets]);

  // 決算またぎ期待値：星評価(0.5刻み・0〜5)。銘柄コードに紐づけてサーバー側のJSONファイルに保存し、
  // OneDrive共有フォルダ経由でも家族と共有・反映されるようにする（ローカルストレージだと共有されないため）。
  const [earningsRatings,setEarningsRatings]=useState({}); // {code:{stars,updatedAt}}
  useEffect(()=>{
    if(tab!=="analysis")return;
    fetch("/api/earnings-rating").then(r=>r.json()).then(d=>setEarningsRatings(d.ratings||{})).catch(()=>{});
  },[tab]);
  const setEarningsStar=(code,stars)=>{
    setEarningsRatings(prev=>({...prev,[code]:{stars,updatedAt:prev[code]?.updatedAt}}));
    fetch("/api/earnings-rating",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code,stars})})
      .then(r=>r.json()).then(d=>{if(d.ratings)setEarningsRatings(d.ratings);}).catch(()=>{});
  };


  const day=useMemo(()=>{const d=new Date(s.date+"T00:00:00");return isNaN(d)?null:d.getDay();},[s.date]);
  const isMonday=day===1;

  // 複数カテゴリのニュース配列を、重複URLを除きつつ公開日時(published:"MM/DD HH:MM")の
  // 降順にまとめる。米国株ニュースを国内カテゴリと混ぜて表示する際に使う（年またぎは非対応）。
  const mergeByDate=(...lists)=>{
    const seen=new Set();const out=[];
    for(const list of lists){for(const it of list){if(!it.url||seen.has(it.url))continue;seen.add(it.url);out.push(it);}}
    return out.sort((a,b)=>(b.published||"").localeCompare(a.published||""));
  };
  // 適時開示：日本の登録銘柄＋アメリカ市場（ダウ30社）のIR・決算ニュースをまとめて表示する
  const disclosureAll=useMemo(()=>mergeByDate(s.stockNewsList,s.usStockNewsList),[s.stockNewsList,s.usStockNewsList]);
  // 海外市況：マクロの海外市況クエリに加え、アメリカ市場登録銘柄のニュースも含める
  const overseasAll=useMemo(()=>mergeByDate(s.macroNewsOverseas,s.usStockNewsList),[s.macroNewsOverseas,s.usStockNewsList]);

  // 9-1章：「サマリー」の中身の方針。既存に該当機能がなかったため新規に決定：
  // (1) 重大ニュース（9-2章の判定に該当）を全カテゴリから最優先で集約し、(2) 残り枠を
  // 適時開示（日本＋アメリカ）・国内市況・海外市況からバランスよく抜粋する。重複URLは除外する。
  const newsSummary=useMemo(()=>{
    const seen=new Set();
    const push=(arr,list)=>{for(const it of list){if(!it.url||seen.has(it.url))continue;seen.add(it.url);arr.push(it);}};
    const important=[];push(important,[...s.stockNewsList,...s.usStockNewsList,...s.macroNewsDomestic,...s.macroNewsOverseas].filter(it=>isImportantNews(it.title)));
    const rest=[];
    push(rest,s.stockNewsList.slice(0,3));
    push(rest,s.usStockNewsList.slice(0,3));
    push(rest,s.macroNewsDomestic.slice(0,4));
    push(rest,s.macroNewsOverseas.slice(0,4));
    return [...important,...rest];
  },[s.stockNewsList,s.usStockNewsList,s.macroNewsDomestic,s.macroNewsOverseas]);

  // 10-5章：ページ最上部の重要ニュース通知バナー用（全カテゴリを対象に件数を集計）
  const importantNewsAll=useMemo(()=>{
    const seen=new Set();const out=[];
    [...s.stockNewsList,...s.usStockNewsList,...s.macroNewsDomestic,...s.macroNewsOverseas].forEach(it=>{
      if(isImportantNews(it.title)&&it.url&&!seen.has(it.url)){seen.add(it.url);out.push(it);}
    });
    return out;
  },[s.stockNewsList,s.usStockNewsList,s.macroNewsDomestic,s.macroNewsOverseas]);

  // 5章：「分析」ボタン。押すたびに分析タブ（12章）の対象銘柄リストに追加/削除をトグルし、
  // 追加・削除いずれの場合も結果をすぐ確認できるよう「分析」タブに遷移する。
  const toggleAnalysisTarget=(code)=>{
    setS(p=>({...p,analysisTargets:p.analysisTargets.includes(code)
      ?p.analysisTargets.filter(c=>c!==code):[...p.analysisTargets,code]}));
    setTab("analysis");
  };

  const rollToNextDay=()=>{if(!confirm("今日の値を前日値へ繰り越し、新しい一日にします（登録銘柄・分析対象銘柄は保持）。よろしいですか？"))return;
    setS(p=>({...emptyState(),date:todayISO(),watchlist:p.watchlist,watchlistUS:p.watchlistUS,analysisTargets:p.analysisTargets,
      metrics:Object.fromEntries(Object.entries(p.metrics).map(([k,v])=>[k,{t:"",p:v.t}]))}));};
  const exportJSON=()=>{const blob=new Blob([JSON.stringify(s,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="trade-cockpit-"+s.date+".json";a.click();URL.revokeObjectURL(url);};
  const importJSON=(e)=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{setS({...emptyState(),...JSON.parse(r.result)});}catch{alert("読み込み失敗");}};r.readAsText(f);e.target.value="";};

  // 日本の個別株（TSE:xxxx）は無料の埋め込みウィジェットでは表示不可（東証データの再配信制限）。
  const embeddable=(sym)=>!/^TSE:/i.test(sym||"");

  // 5章：登録銘柄行の「チャート」ボタンから開くモーダル用チャート（6章でタブ内チャートは廃止、モーダルのみ）
  useEffect(()=>{if(!chartModal||!embeddable(chartModal.symbol))return;const c=modalChartRef.current;if(!c)return;
    c.innerHTML='<div class="tradingview-widget-container__widget"></div>';
    const studies=[];if(cBB)studies.push("BB@tv-basicstudies");if(cRSI)studies.push("RSI@tv-basicstudies");if(cMA)studies.push("MASimple@tv-basicstudies");
    const sc=document.createElement("script");sc.src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";sc.async=true;
    sc.innerHTML=JSON.stringify({symbol:chartModal.symbol,interval:"D",timezone:"Asia/Tokyo",theme:"light",style:"1",locale:"ja",studies,width:"100%",height:480,allow_symbol_change:false});
    c.appendChild(sc);},[chartModal,cBB,cRSI,cMA]);

  // 6-2章：X公式の埋め込みタイムライン(widgets.js)はsyndication.twitter.comが429(レート制限)を
  // 頻発して安定して表示できなかったため、Nitter RSS経由でサーバー側から投稿一覧を取得する方式に
  // 変更（ニュースタブのGoogleニュースRSSと同じ手法。server.pyの/api/sns参照）。
  // refreshAll（全タブ連動）からも呼べるよう関数化してある（SNSタブを開いていなくても更新される）。
  const fetchSnsFor=async(handle)=>{
    setSnsLoading(true);setSnsFailed(false);
    try{
      const r=await fetch("/api/sns?handle="+encodeURIComponent(handle));
      const d=await r.json();
      const posts=Array.isArray(d.posts)?d.posts:[];
      setSnsPosts(posts);
      if(!posts.length)setSnsFailed(true);
    }catch(e){setSnsFailed(true);}
    setSnsLoading(false);
  };
  useEffect(()=>{
    if(tab!=="sns")return;
    fetchSnsFor(snsHandle);
  },[tab,snsHandle]);

  const openTV=(tv)=>{if(tv)window.open("https://jp.tradingview.com/chart/?symbol="+encodeURIComponent(tv),"_blank");};

  // 8章：日次モニターの項目クリックでチャートをトグル開閉
  const toggleMetric=(key)=>setOpenMetrics(prev=>{const n=new Set(prev);n.has(key)?n.delete(key):n.add(key);return n;});
  const openMetricsKey=useMemo(()=>[...openMetrics].sort().join(","),[openMetrics]);
  useEffect(()=>{
    METRICS.forEach(m=>{
      if(!openMetrics.has(m.key)||!m.tvEmbed)return;
      const c=metricRefs.current[m.key];if(!c)return;
      c.innerHTML='<div class="tradingview-widget-container__widget"></div>';
      const sc=document.createElement("script");sc.src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";sc.async=true;
      sc.innerHTML=JSON.stringify({symbol:m.tv,interval:"D",timezone:"Asia/Tokyo",theme:"light",style:"1",locale:"ja",studies:[],width:"100%",height:320,allow_symbol_change:false});
      c.appendChild(sc);
    });
  },[openMetricsKey]);

  return (
    <div className="wrap">
      <div className="head">
        <div><div className="kicker">Trade Cockpit</div><h1>トレード・コックピット</h1></div>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <input type="date" className="mono" value={s.date} onChange={e=>set({date:e.target.value})} style={{fontSize:13}}/>
          <span className="mono" style={{fontSize:14,fontWeight:700,width:22,textAlign:"center",color:isMonday?"var(--accent)":"var(--ink)"}}>{day!=null?WD[day]:"―"}</span>
          <button className="ghost" onClick={rollToNextDay}>翌朝へ</button>
          <button className="ghost" onClick={exportJSON}>バックアップ↓</button>
          <button className="ghost" onClick={()=>fileRef.current.click()}>復元↑</button>
          <input ref={fileRef} type="file" accept="application/json,.json" onChange={importJSON} style={{display:"none"}}/>
          {/* 3-1章：テーマ切り替えトグル */}
          <button className="theme-toggle" onClick={toggleTheme} title="ダーク/ライト切り替え">{theme==="dark"?"🌙 ダーク":"☀️ ライト"}</button>
        </div>
      </div>

      {/* 10-5章：重要ニュース通知バナー（ページ最上部に常設、オン/オフ切り替え可） */}
      <div className="notify-bar" style={{marginTop:14}}>
        <span style={{fontSize:12.5,fontWeight:700}}>
          {s.notifyEnabled
            ? (importantNewsAll.length ? `⚠ 重要ニュース ${importantNewsAll.length}件（「ニュース」タブで確認）` : "重要ニュース通知：オン（該当ニュースなし）")
            : "重要ニュース通知：オフ"}
        </span>
        <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,cursor:"pointer"}}>
          <input type="checkbox" checked={s.notifyEnabled} onChange={e=>set({notifyEnabled:e.target.checked})}/>通知を有効にする
        </label>
      </div>

      {/* タブ並び順：日次モニター→ニュース→アメリカ市場(6-1)→SNS(6-2)→日本市場→分析(12章)。
          日次モニターは6章の並びに含まれないが、要望により先頭に配置。 */}
      <div className="tabs">
        <button className={"tab"+(tab==="monitor"?" on":"")} onClick={()=>setTab("monitor")}>日次モニター</button>
        <button className={"tab"+(tab==="news"?" on":"")} onClick={()=>setTab("news")}>ニュース</button>
        <button className={"tab"+(tab==="us"?" on":"")} onClick={()=>setTab("us")}>アメリカ市場</button>
        <button className={"tab"+(tab==="sns"?" on":"")} onClick={()=>setTab("sns")}>SNS</button>
        <button className={"tab"+(tab==="briefing"?" on":"")} onClick={()=>setTab("briefing")}>日本市場</button>
        <button className={"tab"+(tab==="analysis"?" on":"")} onClick={()=>setTab("analysis")}>分析</button>
      </div>

      {/* ===== 日次モニター（独立タブ） ===== */}
      {tab==="monitor" && <div style={{marginTop:18}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
          <div className="sec-head">日次モニター</div>
          <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            {monitorMsg && <span style={{fontSize:11,color:"var(--inkSoft)"}}>{monitorMsg}</span>}
            <button className="btn primary" onClick={refreshAll} disabled={anyFetching}>{monitorFetching?"取得中…":"リアルタイムデータを反映"}</button>
          </div>
        </div>
        <div className="sec-note">「リアルタイムデータを反映」を押すたびに、ドル円・日経平均・ダウ・ナスダック・SOX・米10年債・S&P500・KOSPI・日経225先物・NYダウ先物・WTI原油・金・銅 を今日値／前日値ともに取得します（数値は遅延あり）。</div>
        <div className="sec-note" style={{marginTop:-4}}>項目をクリックするとリアルタイムチャートが下に開きます。</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))",gap:1,background:"var(--rule)",border:"1px solid var(--rule)",borderRadius:4,overflow:"hidden"}}>
          {METRICS.map(m=>{const v=s.metrics[m.key];const t=num(v.t),p=num(v.p);
            const delta=t!=null&&p!=null?t-p:null;
            const pct=t!=null&&p!=null&&p?(t-p)/p*100:null;
            const c=changeColor(pct);
            const sparkColor=c.level>0?c.fg:"#8a8f86"; // セル背景と同色に埋もれないよう、文字色と同じコントラスト色で描画
            const condOn=m.cond&&t!=null&&m.cond(t);
            const isOpen=openMetrics.has(m.key);
            return <React.Fragment key={m.key}>
              <button onClick={()=>toggleMetric(m.key)} style={{width:"100%",background:c.bg,padding:"11px 13px",
                  border:condOn?"2px solid var(--gain)":"none",boxSizing:"border-box",textAlign:"left",cursor:"pointer",font:"inherit",
                  color:c.level>0?c.fg:"var(--ink)"}}>
                <div style={{fontSize:21,fontWeight:700,color:c.level>0?c.fg:"var(--ink)",display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
                  <span>{m.label}</span>{condOn&&<span className="mono" style={{fontSize:10,color:c.level>0?c.fg:"var(--gain)",fontWeight:700}}>条件○</span>}
                </div>
                <div style={{display:"flex",alignItems:"baseline",gap:7,marginTop:3,justifyContent:"flex-end"}}>
                  <span className="mono" style={{fontSize:21,fontWeight:700}}>{t!=null?t.toFixed(m.dp):"—"}</span>
                  {delta!=null&&<span className="mono" style={{fontSize:12}}>{delta>0?"▲":delta<0?"▼":""}{delta>0?"+":""}{delta.toFixed(m.dp)}</span>}
                </div>
                <div style={{marginTop:7,fontSize:12,color:c.level>0?c.fgSoft:"var(--inkSoft)",textAlign:"right"}}>前日 <span className="mono">{p!=null?p.toFixed(m.dp):"—"}</span></div>
                <div style={{marginTop:8}}><Sparkline data={v.spark} color={sparkColor}/></div>
              </button>
              {isOpen && <div style={{gridColumn:"1 / -1",background:"var(--card)",padding:12}}>
                {m.tvEmbed
                  ? <div ref={el=>metricRefs.current[m.key]=el} style={{border:"1px solid var(--rule)",borderRadius:4,overflow:"hidden",background:"var(--card)",minHeight:324}}></div>
                  : <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10,padding:"8px 4px"}}>
                      <span style={{fontSize:12.5,color:"var(--inkSoft)"}}>{m.label}は無料埋め込みでは表示できないシンボルです。</span>
                      <button className="btn primary" onClick={()=>openTV(m.tv)}>↗ TradingViewで開く</button>
                    </div>}
              </div>}
            </React.Fragment>;})}
        </div>
        <p className="foot">※ 「リアルタイムデータを反映」は、start.bat で起動したローカルサーバー経由で取得します。数値は遅延あり（前営業日終値〜数十分遅れ）でリアルタイムの板ではありません。</p>
      </div>}

      {/* ===== BRIEFING（日本市場） ===== */}
      {tab==="briefing" && <div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8,marginTop:18}}>
          <div className="sec-head">日本市場</div>
          <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            {jpMsg && <span style={{fontSize:11,color:"var(--inkSoft)"}}>{jpMsg}</span>}
            <button className="btn primary" onClick={refreshAll} disabled={anyFetching}>{jpFetching?"取得中…":"リアルタイムデータを反映"}</button>
          </div>
        </div>
        <SectorWatchlist market="JP" watchlist={s.watchlist} setWatchlist={setWatchlistJP} candidates={masterJP} max={MAX}
          stockQuotes={s.stockQuotes} analysisTargets={s.analysisTargets} onToggleAnalysis={toggleAnalysisTarget}
          onOpenChart={w=>setChartModal({symbol:w.tvSymbol,name:w.name})}/>
        <p className="foot">※ ニュースはGoogleニュースRSSを利用しています。売買を推奨するものではなく、最終判断はご自身で。</p>
      </div>}

      {/* ===== US（アメリカ市場・6-1章） ===== */}
      {tab==="us" && <div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8,marginTop:18}}>
          <div className="sec-head">アメリカ市場</div>
          <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            {usMsg && <span style={{fontSize:11,color:"var(--inkSoft)"}}>{usMsg}</span>}
            <button className="btn primary" onClick={refreshAll} disabled={anyFetching}>{usFetching?"取得中…":"リアルタイムデータを反映"}</button>
          </div>
        </div>
        <SectorWatchlist market="US" watchlist={s.watchlistUS} setWatchlist={setWatchlistUS} candidates={masterUS} max={MAX_US}
          stockQuotes={s.stockQuotes} analysisTargets={s.analysisTargets} onToggleAnalysis={toggleAnalysisTarget}
          onOpenChart={w=>setChartModal({symbol:w.tvSymbol,name:w.name})}/>
        <p className="foot" style={{marginTop:16}}>※ 対象は現行のダウ工業株30種平均構成銘柄。業種分類は日本市場と同じ東証33業種の枠組みで統一しています（GICSセクターではありません）。アメリカ市場銘柄のニュース・決算・IRは「ニュース」タブのサマリー・海外市況・適時開示に統合表示しています。</p>
      </div>}

      {/* ===== SNS（6-2章） ===== */}
      {tab==="sns" && <div style={{marginTop:18}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
          <div className="sec-head">SNS</div>
          <button className="btn primary" onClick={refreshAll} disabled={anyFetching}>{snsLoading?"取得中…":"リアルタイムデータを反映"}</button>
        </div>
        <div className="sec-note">指定10アカウントの投稿文を一覧表示します（X公式の埋め込みが安定して表示できないため、Nitter RSS経由でサーバーから取得しています）。アカウントを選んで切り替えてください。</div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",margin:"12px 0"}}>
          {SNS_ACCOUNTS.map(h=><button key={h} className={"chip"+(snsHandle===h?" on":"")} onClick={()=>setSnsHandle(h)}>@{h}</button>)}
        </div>
        <div className="card" style={{padding:"14px 16px 6px",minHeight:300}}>
          {snsLoading
            ? <div className="news-empty">読み込み中…</div>
            : snsFailed
            ? <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14,padding:24,textAlign:"center"}}>
                <div style={{fontSize:12.5,color:"var(--inkSoft)",lineHeight:1.7,maxWidth:420}}>
                  投稿を取得できませんでした（配信元の一時的な制限の可能性があります）。下のボタンからXで直接確認してください。
                </div>
                <a className="btn primary" href={`https://x.com/${snsHandle}`} target="_blank" rel="noopener noreferrer">↗ @{snsHandle} をXで開く</a>
              </div>
            : (!snsPosts.length
                ? <div className="news-empty">まだ取得していません。</div>
                : <div className="news-list">
                    {snsPosts.map((it,i)=>
                      <a key={i} className="news-item" href={it.url} target="_blank" rel="noopener noreferrer">
                        <span className="news-body">
                          <span className="news-title">{it.title}</span>
                          {it.published&&<span className="news-meta">{it.published}</span>}
                        </span>
                      </a>)}
                  </div>)}
        </div>
        <p className="foot">※ 投稿の取得元はNitter（Xの代替フロントエンド）のRSSフィードのため、表示が遅れる・欠落することがあります。鍵アカウントの投稿は表示できません。<br/>※ 有料のX APIを契約すれば複数アカウント統合タイムラインも実装できますが、従量課金（読み取り$0.005/件、無料枠なし）のため今回は見送っています。必要であればご相談ください。</p>
      </div>}

      {/* ===== 分析（12章） ===== */}
      {tab==="analysis" && <div style={{marginTop:18}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
          <div className="sec-head">分析</div>
          <button className="btn primary" onClick={refreshAll} disabled={anyFetching}>{analyzing?"取得中…":"リアルタイムデータを反映"}</button>
        </div>
        {/* 12-2章：免責表示（必須・常時表示・断定的表現を避ける） */}
        <div style={{background:"var(--band)",border:"1px solid var(--rule)",borderRadius:4,padding:"12px 14px",marginBottom:14,fontSize:12.5,lineHeight:1.7,color:"var(--inkSoft)"}}>
          本分析は算出根拠の一つに過ぎず、投資判断は必ずご自身の判断で行ってください。数値を鵜呑みにせず、最終判断はご自身の責任で行ってください。
          購入・損切り・利確の各単価は「推奨」ではなく、あくまで目安・参考値です。
        </div>
        {/* 自身のトレードルール（trading_rules.md）：常に忘れないための固定リマインド */}
        <div style={{background:"var(--card)",border:"1px solid var(--rule)",borderRadius:4,padding:"12px 14px",marginBottom:14,fontSize:12,lineHeight:1.8,color:"var(--inkSoft)"}}>
          <div style={{fontWeight:700,color:"var(--ink)",marginBottom:4}}>自分のトレードルール（要点）</div>
          最優先は負けないこと・利確は欲張らず+3〜5%が目安・<b style={{color:"var(--ink)"}}>逆指値は絶対に下げない</b>・基本は持ち越さない（自信ある銘柄のみ例外）・地合いが悪い/弱いセクターでは無理をしない・ノートレードも立派な判断。
          <div style={{marginTop:6}}>銘柄選びの優先順位：①半導体 → ②AI関連 → ③当日最強セクター（日次モニターのセクター売買代金順を参照） → ④材料株。</div>
        </div>
        {analysisItems.length===0
          ? <div style={{padding:26,textAlign:"center",color:"var(--inkSoft)",fontSize:13,border:"1px solid var(--rule)",borderRadius:4,background:"var(--card)"}}>
              分析対象の銘柄がありません。「日本市場」「アメリカ市場」タブの登録銘柄一覧で「分析」ボタンを押すと、ここに追加されます。
            </div>
          : <div>
              {analyzing && <div className="sec-note">分析データを計算中…</div>}
              <div className="grid" style={{gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))"}}>
                {analysisItems.map(w=>{
                  const a=s.analysisData[w.code];
                  return <div key={w.code} className="card">
                    <div className="card-hd" style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                      <div><div className="card-t">{w.name}</div><div className="card-n mono">{w.code}</div></div>
                      <button className="iconbtn" title="分析対象から外す" onClick={()=>toggleAnalysisTarget(w.code)}>×</button>
                    </div>
                    {!a
                      ? <div style={{fontSize:12.5,color:"var(--inkSoft)"}}>
                          {analyzing
                            ? "計算中…"
                            : <>データを取得できませんでした。
                                <button className="btn" style={{marginLeft:8,fontSize:11.5,padding:"2px 10px"}}
                                  onClick={()=>fetchAnalysisFor([w])}>再取得</button>
                              </>}
                        </div>
                      : <div>
                          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
                            <div className="mono" style={{fontSize:12,color:"var(--inkSoft)"}}>現在値 {a.current.toLocaleString()}</div>
                            <div title="シグナル強度" style={{color:"var(--star)",fontSize:13,letterSpacing:1}}>{"★".repeat(a.strength||0)}{"☆".repeat(5-(a.strength||0))}</div>
                          </div>
                          {a.marketEnv && <div style={{fontSize:11,color:"var(--inkSoft)",marginBottom:8}}>{a.marketEnv}</div>}
                          {/* 決算またぎ期待値：発表10日前からカウントダウンを目立つ色で表示。星評価はいつでも編集可能で、
                              決算通過後もこのまま表示され続ける（事前予想→決算後の答え合わせ、という運用のため）。 */}
                          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:6,
                            background:"var(--band)",border:"1px solid var(--rule)",borderRadius:4,padding:"6px 8px",marginBottom:8}}>
                            {(a.daysToEarnings!=null && a.daysToEarnings>=0 && a.daysToEarnings<=10)
                              ? <span style={{fontSize:12.5,fontWeight:700,color:"var(--accent)"}}>📅 決算発表まで あと{a.daysToEarnings}日</span>
                              : <span style={{fontSize:11,color:"var(--inkSoft)"}}>決算期待値（事前予想・答え合わせ）</span>}
                            <EarningsStars value={earningsRatings[w.code]?.stars||0} onChange={stars=>setEarningsStar(w.code,stars)}/>
                          </div>
                          {a.tradeRules?.earningsNote && <div style={{fontSize:11.5,color:"var(--ink)",background:"var(--band)",border:"1px solid var(--rule)",borderRadius:4,padding:"6px 8px",marginBottom:8,lineHeight:1.6}}>📅 {a.tradeRules.earningsNote}</div>}
                          {a.tradeRules && <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:8}}>
                            {a.tradeRules.entryChecklist.filter(c=>c.pass!=null).map(c=>
                              <span key={c.key} className="chip" style={{fontSize:10.5,display:"inline-block",
                                background:c.pass?"var(--upBg)":"var(--band)",borderColor:c.pass?"var(--up)":"var(--rule)",
                                color:c.pass?"var(--up)":"var(--inkSoft)"}}>{c.pass?"✓":"・"} {c.label}</span>)}
                            {a.tradeRules.avoidChecklist.filter(c=>c.hit).map(c=>
                              <span key={c.key} className="chip" style={{fontSize:10.5,display:"inline-block",
                                background:"var(--downBg)",borderColor:"var(--down)",color:"var(--down)"}}>⚠ {c.label}</span>)}
                          </div>}
                          {(a.signals?.buy?.length>0) && <div style={{marginBottom:8}}>
                            {a.signals.buy.map(sig=><div key={sig.key} className="chip" style={{background:"var(--upBg)",borderColor:"var(--up)",color:"var(--up)",marginRight:4,marginBottom:4,display:"inline-block",fontSize:11}}>▲ {sig.label}</div>)}
                          </div>}
                          {(a.signals?.sell?.length>0) && <div style={{marginBottom:8}}>
                            {a.signals.sell.map(sig=><div key={sig.key} className="chip" style={{background:"var(--downBg)",borderColor:"var(--down)",color:"var(--down)",marginRight:4,marginBottom:4,display:"inline-block",fontSize:11}}>▼ {sig.label}</div>)}
                          </div>}
                          <div style={{display:"flex",flexDirection:"column",gap:10}}>
                            <div>
                              <div style={{fontSize:11.5,color:"var(--inkSoft)"}}>購入単価(目安)</div>
                              <div className="mono" style={{fontSize:22,fontWeight:800,color:"var(--ink)",lineHeight:1.3}}>{a.entry.toLocaleString()}</div>
                              <div style={{color:"var(--inkSoft)",fontSize:11,marginTop:2}}>{a.entryReason}</div>
                            </div>
                            <div>
                              <div style={{fontSize:11.5,color:"var(--inkSoft)"}}>損切り単価(目安)</div>
                              <div className="mono" style={{fontSize:22,fontWeight:800,color:"var(--down)",lineHeight:1.3}}>{a.stop.toLocaleString()}</div>
                              <div style={{color:"var(--inkSoft)",fontSize:11,marginTop:2}}>{a.stopReason}</div>
                            </div>
                            <div>
                              <div style={{fontSize:11.5,color:"var(--inkSoft)"}}>利確単価(目安)</div>
                              <div className="mono" style={{fontSize:22,fontWeight:800,color:"var(--up)",lineHeight:1.3}}>{a.target.toLocaleString()}</div>
                              <div style={{color:"var(--inkSoft)",fontSize:11,marginTop:2}}>{a.targetReason}</div>
                            </div>
                          </div>
                          <div style={{marginTop:10,paddingTop:8,borderTop:"1px solid var(--ruleSoft)",fontSize:11,color:"var(--inkSoft)",lineHeight:1.6}}>
                            25日線 {a.indicators.ma25??"—"}　75日線 {a.indicators.ma75??"—"}　100日線 {a.indicators.ma100??"—"}<br/>
                            RSI14 {a.indicators.rsi??"—"}　RCI26 {a.indicators.rci26??"—"}　ATR14 {a.indicators.atr14??"—"}<br/>
                            BB-2σ {a.indicators.bbLower2??"—"}　BB-3σ {a.indicators.bbLower3??"—"}<br/>
                            直近サポート {a.indicators.support}　直近レジスタンス {a.indicators.resistance}<br/>
                            52週高値 {a.indicators.high52w}　52週安値 {a.indicators.low52w}<br/>
                            {(a.indicators.intradayHigh!=null)
                              ? <>当日高値 {a.indicators.intradayHigh}　当日安値 {a.indicators.intradayLow}　VWAP {a.indicators.vwap??"—"}<br/>
                                  5分足RSI {a.indicators.rsi5m??"—"}　15分足RSI {a.indicators.rsi15m??"—"}<br/></>
                              : <>当日の分足データなし（市場時間外の可能性）<br/></>}
                            {a.fundamentalNote}
                          </div>
                        </div>}
                  </div>;
                })}
              </div>
            </div>}
        <p className="foot" style={{marginTop:16}}>※ テクニカル指標は過去1年の日足終値（25日/75日/100日移動平均・RSI14・RCI26・ATR14・ボリンジャーバンド20,±2σ/±3σ・52週高値安値）に加え、当日の1分足・5分足・15分足をリアルタイムに取得し、当日高値安値・VWAP・短期RSIを購入/損切り/利確単価の算出に反映しています（市場時間外は分足データなしで日足のみの算出になります）。パンパカパン・ゴールデンクロス・複合底打ち等のシグナル判定を含みます。エントリー適性チェック（上昇トレンド・出来高増加・押し目・VWAP）、見送り条件（出来高過少・地合い不安定）、決算またぎの目安（yfinance取得可能な場合のみ）も自動判定しています。ファンダメンタルはyfinance取得可能な範囲（PER・PBR・配当利回り・予想EPS)を使用しています。</p>
      </div>}

      {/* ===== NEWS（9章・9-1章・9-2章） ===== */}
      {tab==="news" && (()=>{
        const NEWS_SUBTABS=[
          {key:"summary",label:"サマリー"},
          {key:"domestic",label:"国内市況"},
          {key:"overseas",label:"海外市況"},
          {key:"disclosure",label:"適時開示"},
        ];
        const listFor={summary:newsSummary,domestic:s.macroNewsDomestic,overseas:overseasAll,disclosure:disclosureAll}[newsSubTab];
        const showCode=newsSubTab==="summary"||newsSubTab==="disclosure";
        const hasImportant=listFor.some(it=>isImportantNews(it.title));
        return <div style={{marginTop:18}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
            <div className="sec-head">ニュース</div>
            <button className="btn primary" onClick={refreshAll} disabled={anyFetching}>{newsFetching?"取得中…":"リアルタイムデータを反映"}</button>
          </div>
          <div className="sec-note">上のボタンで、各サブタブのニュースをGoogleニュースRSSから更新できます（登録銘柄の株価等は更新されません。それらも含めて更新する場合は「日本市場」タブのボタンを使ってください）。「サマリー」「海外市況」「適時開示」にはアメリカ市場（ダウ30社）のニュースも含みます。「適時開示」は決算・IR関連キーワードで絞り込んでいます。見出しをクリックすると元記事が開きます。</div>
          <div className="subtabs">
            {NEWS_SUBTABS.map(t=><button key={t.key} className={"chip"+(newsSubTab===t.key?" on":"")} onClick={()=>setNewsSubTab(t.key)}>{t.label}</button>)}
          </div>
          {hasImportant && <div style={{display:"flex",alignItems:"center",gap:10,background:"var(--upBg)",border:"1px solid var(--up)",borderRadius:4,padding:"10px 14px",marginBottom:12}}>
            <span style={{fontSize:13,fontWeight:700,color:"var(--up)"}}>⚠ 重要ニュースを含みます</span>
            <span style={{fontSize:12,color:"var(--inkSoft)"}}>サプライズ決算・戦争紛争・パンデミック・大規模災害・株価暴落に関連する見出しに印を付けています。</span>
          </div>}
          <div className="card" style={{padding:"14px 16px 6px"}}>
            <NewsList items={listFor} showName={showCode} announcements={ANNOUNCEMENTS}/>
          </div>
        </div>;
      })()}

      {/* 5章：登録銘柄行の「チャート」ボタンで開くモーダル（タブに依存しない。6章でタブ内チャートは廃止） */}
      {chartModal && <div onClick={()=>setChartModal(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:20,
          display:"flex",alignItems:"center",justifyContent:"center",padding:18}}>
        <div onClick={e=>e.stopPropagation()} style={{background:"var(--card)",border:"1px solid var(--rule)",borderRadius:12,
            width:"100%",maxWidth:760,maxHeight:"92vh",overflowY:"auto",padding:24,boxShadow:"var(--shadowLg)"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
            <div><div className="kicker">Chart</div><div style={{fontSize:17,fontWeight:700}}>{chartModal.name}</div>
              <div className="mono" style={{fontSize:11.5,color:"var(--inkSoft)"}}>{chartModal.symbol}</div></div>
            <button className="iconbtn" style={{fontSize:20}} onClick={()=>setChartModal(null)}>×</button>
          </div>
          {embeddable(chartModal.symbol) && <div style={{display:"flex",gap:14,flexWrap:"wrap",marginBottom:10}}>
            <label style={{fontSize:12.5,display:"flex",gap:6,alignItems:"center",cursor:"pointer"}}><input type="checkbox" checked={cBB} onChange={e=>setCBB(e.target.checked)}/>ボリンジャー</label>
            <label style={{fontSize:12.5,display:"flex",gap:6,alignItems:"center",cursor:"pointer"}}><input type="checkbox" checked={cRSI} onChange={e=>setCRSI(e.target.checked)}/>RSI</label>
            <label style={{fontSize:12.5,display:"flex",gap:6,alignItems:"center",cursor:"pointer"}}><input type="checkbox" checked={cMA} onChange={e=>setCMA(e.target.checked)}/>移動平均</label>
          </div>}
          {embeddable(chartModal.symbol)
            ? <div key="modaltvchart" ref={modalChartRef} style={{border:"1px solid var(--rule)",borderRadius:4,overflow:"hidden",background:"var(--card)",minHeight:484}}></div>
            : <div key="modaljpfallback" style={{border:"1px solid var(--rule)",borderRadius:4,background:"var(--card)",minHeight:300,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14,padding:24,textAlign:"center"}}>
                <div style={{fontSize:12.5,color:"var(--inkSoft)",lineHeight:1.7,maxWidth:420}}>日本の個別株は、TradingViewの無料埋め込みチャートでは表示できません（東証データの再配信制限のため）。下のボタンからTradingView本体で開いてください。</div>
                <button className="btn primary" onClick={()=>openTV(chartModal.symbol)}>↗ TradingViewで開く</button>
              </div>}
        </div>
      </div>}

      <p className="foot" style={{borderTop:"1px solid var(--ruleSoft)",paddingTop:12,marginTop:24}}>
        データはこのブラウザに自動保存されます（同じファイルを同じブラウザで開けば継続）。念のため時々「バックアップ↓」でJSON保存を。<br/>
        このツールは判断材料の整理用で、売買を推奨するものではありません。最終判断はご自身で。
      </p>
    </div>
  );
}
// 初回レンダー前にテーマを確定させ、ダークモード利用者でのライト表示のちらつきを防ぐ
(()=>{const t=getInitialTheme();setColorTheme(t);document.documentElement.dataset.theme=t;})();
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
