<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>トレード・コックピット</title>
<style>
/* ===== デザイントークン（design_renewal_instruction.md）=====
   ムームー証券アプリを参考にした鮮やかな配色・タイポグラフィ・ダークモード対応。
   単体HTML構成（ビルド工程なし、CLAUDE.md方針）を維持するため、別ファイルの
   design-tokens.jsonではなくこのCSS変数群に集約する。
   注意：上昇/下落の色は日本の相場慣習（赤=上昇・緑=下落）を維持するため、
   指示書の「上昇=緑系」の鮮やかな数値は当アプリの赤(--up)に、
   「下落=赤系」の数値は当アプリの緑(--down)に、意味を保ったまま割り当てている。 */
:root{
  --paper:#FFFFFF; --paperAlt:#FFFFFF; --card:#F2F3F5; --ink:#1A1A1A; --inkSoft:#666666; --inkFaint:#999999;
  --rule:#DDDDDD; --ruleSoft:#EAEAEA; --band:#F2F3F5;
  --gain:#00A868; --loss:#E0334A; --accent:#FF7A17; --accentSoft:rgba(255,122,23,.15);
  --star:#B8863B; --warn:#FFA500;
  --alarm:#FFF3D6; --alarmEdge:#B8860B; --alarmText:#1A1A1A;
  --up:#FF4D5C; --down:#00B366; --upBg:#FFE3E5; --downBg:#DFF7EC;
  --shadow:none; --shadowLg:0 12px 32px rgba(0,0,0,.16);
}
:root[data-theme="dark"]{
  --paper:#101012; --paperAlt:#1C1C1E; --card:#1C1C1E; --ink:#FFFFFF; --inkSoft:#CCCCCC; --inkFaint:#909090;
  --rule:#333333; --ruleSoft:#2A2A2A; --band:#1C1C1E;
  --gain:#00D084; --loss:#FF6B78; --accent:#FF9142; --accentSoft:rgba(255,145,66,.2);
  --star:#D9A64E; --warn:#FFB84D;
  --alarm:#3A2A0A; --alarmEdge:#FFA500; --alarmText:#FFF3D6;
  --up:#FF8A93; --down:#4DFFB0; --upBg:rgba(255,77,92,.22); --downBg:rgba(0,208,132,.2);
  --shadow:none; --shadowLg:0 16px 40px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{background-color:var(--paper)}
body{margin:0;background-color:var(--paper);color:var(--ink);font-size:15px;min-height:100vh;
  font-family:'Segoe UI','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,Arial,sans-serif}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding:22px 18px 46px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;
  border-bottom:2px solid var(--ink);padding-bottom:12px}
.kicker{font-size:11px;letter-spacing:3px;color:var(--inkSoft);text-transform:uppercase}
h1{margin:3px 0 0;font-size:28px;font-weight:700;line-height:1.2;letter-spacing:-.4px}
/* テーマ切り替えトグル（3-1章） */
.theme-toggle{display:inline-flex;align-items:center;gap:6px;background:var(--paperAlt);color:var(--inkSoft);
  border:1px solid var(--rule);padding:7px 12px;font-size:13px;border-radius:8px;cursor:pointer}
.theme-toggle:hover{background:var(--band)}
/* 10-1章：タブ数が増えても横スクロールで収まるようにする（4-3章：タブバーのスタイル統一） */
.tabs{display:flex;gap:4px;margin-top:16px;background:var(--band);border-radius:8px 8px 0 0;
  padding:2px 4px 0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.tabs::-webkit-scrollbar{height:6px}
.tabs::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}
.tab{background:transparent;border:none;border-bottom:3px solid transparent;color:var(--inkSoft);
  font-size:15px;padding:9px 16px;cursor:pointer;font-weight:600;flex:none;white-space:nowrap;transition:color .15s}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:800}
.sec-head{font-size:22px;font-weight:600;line-height:1.3;margin:0 0 4px}
.sec-note{font-size:13px;color:var(--inkSoft);margin-bottom:10px}
.card{border:none;background:var(--card);border-radius:14px;padding:14px 16px 16px;
  box-shadow:var(--shadow);transition:background-color .2s ease,border-color .2s ease}
.card-t{font-size:18px;font-weight:600;line-height:1.4}
.card-n{font-size:13px;color:var(--inkSoft);margin-top:2px}
.card-hd{border-bottom:1px solid var(--ruleSoft);padding-bottom:8px;margin-bottom:10px}
.grid{display:grid;gap:16px}
.btn{display:inline-flex;align-items:center;gap:6px;border:none;padding:10px 18px;font-size:14px;
  border-radius:8px;cursor:pointer;font-weight:600;transition:filter .15s,box-shadow .15s}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.ghost{display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--inkSoft);
  border:1px solid var(--rule);padding:9px 14px;font-size:14px;border-radius:8px;cursor:pointer;transition:background-color .15s}
.ghost:hover{background:var(--band)}
/* 登録銘柄行の「チャート」「分析」ボタンなど、背景が塗り分け配色（ヒートマップ風）のセル上に
   置かれるボタン用。透明な.ghostだと濃い背景に埋もれて見えにくくなるため、常に不透明な背景を持たせる */
.action-btn{display:inline-flex;align-items:center;gap:5px;background:var(--paperAlt);color:var(--ink);
  border:1px solid rgba(127,127,127,.35);padding:5px 10px;font-size:12.5px;font-weight:600;border-radius:6px;
  cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:filter .15s}
.action-btn:hover{filter:brightness(.94)}
.action-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.iconbtn{background:transparent;border:none;color:var(--inkSoft);cursor:pointer;padding:4px;font-size:15px}
input,select,textarea{padding:10px 12px;border:1px solid var(--rule);background:var(--paperAlt);
  color:var(--ink);font-size:14px;border-radius:6px;font-family:inherit;transition:border-color .15s,box-shadow .15s}
input::placeholder,textarea::placeholder{color:var(--inkFaint)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
textarea{resize:vertical;line-height:1.6;width:100%}
label.fld{display:block;margin-top:8px}
label.fld span{font-size:12px;color:var(--inkSoft);display:block;margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{padding:8px 10px;font-size:12px;font-weight:600;text-align:left;white-space:nowrap;color:var(--inkSoft)}
td{padding:7px 10px;vertical-align:middle}
.lbl{font-size:12px;color:var(--inkSoft);margin:8px 0 4px}
/* 監視銘柄テーブル専用（2026-09-03改善）：行高縮小・横スクロール廃止・行hover・sticky header用 */
.watch-table{table-layout:fixed;font-size:14px}
.watch-table th{padding:6px 8px;font-size:13px}
.watch-table td{padding:7px 8px}
.watch-table thead th{position:sticky;top:0;background:var(--band);z-index:1}
.watch-table tbody tr:nth-child(even){background:var(--band)}
.watch-row{transition:background-color .1s}
.watch-row:hover{background:var(--band) !important}
.watch-menu-btn{background:transparent;border:1px solid var(--rule);border-radius:4px;color:var(--inkSoft);
  cursor:pointer;font-size:15px;line-height:1;padding:3px 8px}
.watch-menu-btn:hover{background:var(--band)}
.watch-menu{position:absolute;right:0;top:100%;z-index:20;background:var(--card);border:1px solid var(--rule);
  border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.18);min-width:160px;overflow:hidden}
.watch-menu button{display:block;width:100%;text-align:left;padding:7px 12px;font-size:12.5px;background:transparent;
  border:none;color:var(--ink);cursor:pointer;white-space:nowrap}
.watch-menu button:hover{background:var(--band)}
.watch-menu button.on{color:var(--accent);font-weight:700}
.chip{font-size:13px;padding:4px 10px;border-radius:16px;cursor:pointer;border:1px solid var(--rule);
  background:var(--paperAlt);color:var(--inkSoft);transition:background-color .15s,color .15s}
.chip:hover{background:var(--band)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.alarm{background:var(--alarm);color:var(--alarmText);border:2px solid var(--alarmEdge);border-radius:8px;
  padding:16px 18px;display:flex;align-items:center;gap:13px;animation:almPulse 1.2s ease-in-out infinite}
@keyframes almPulse{0%,100%{opacity:1}50%{opacity:.82}}
.foot{margin-top:16px;font-size:13px;color:var(--inkSoft);line-height:1.7}
.results{position:absolute;z-index:5;left:0;right:0;margin-top:4px;background:var(--paperAlt);
  border:1px solid var(--rule);border-radius:8px;box-shadow:var(--shadowLg);overflow:hidden}
.res-row{display:flex;width:100%;align-items:center;gap:10px;padding:9px 12px;background:transparent;
  border:none;border-bottom:1px solid var(--ruleSoft);cursor:pointer;text-align:left}
.res-row:hover{background:var(--band)}
.loading{max-width:400px;margin:80px auto;text-align:center;color:var(--inkSoft)}
.news-list{display:block}
.news-item{display:flex;gap:9px;align-items:center;padding:10px 4px;
  border-bottom:1px solid var(--ruleSoft);text-decoration:none;color:var(--ink)}
.news-item:last-child{border-bottom:none}
.news-item:hover{background:var(--band)}
.news-item:hover .news-title{color:var(--accent);text-decoration:underline}
.news-tag{flex:none;font-size:11px;font-weight:700;color:var(--accent);background:var(--paperAlt);
  border:1px solid var(--rule);border-radius:3px;padding:1px 6px;white-space:nowrap}
.news-body{flex:1;min-width:0}
.news-title{font-size:14px;line-height:1.5}
.news-summary{display:block;font-size:12px;line-height:1.5;color:var(--inkSoft);margin-top:4px}
.news-meta{display:block;font-size:11px;color:var(--inkFaint);margin-top:3px}
.news-empty{font-size:12px;color:var(--inkSoft);padding:16px 4px}
/* 9-2章：重大ニュースの強調表示（4-6章：アラート仕様に統一） */
.news-item.important{background:var(--upBg);border-left:3px solid var(--up);padding-left:8px;margin-left:-1px}
.news-item.important:hover{background:var(--upBg)}
.news-alert-badge{flex:none;font-size:10.5px;font-weight:700;color:#fff;background:var(--up);
  border-radius:3px;padding:2px 6px;white-space:nowrap;align-self:center}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
/* 10-5章：ニュース項目のサムネイル（実画像は取得できないため、出典名の頭文字によるアバター） */
.news-thumb{flex:none;width:42px;height:42px;border-radius:6px;background:var(--band);color:var(--inkSoft);
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;align-self:center;
  box-shadow:var(--shadow)}
/* 10-5章：重要ニュース通知バナー（ページ最上部に常設、オン/オフ切り替え可。4-6章：warning系に統一） */
.notify-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  background:var(--alarm);color:var(--alarmText);border:2px solid var(--alarmEdge);border-radius:8px;padding:10px 14px;margin-bottom:12px}
</style>
</head>

// 有料AI APIは使わず、テキストを生成してコピーするだけ（貼り付け先はChatGPT側で人間が操作）。
// Clipboard APIが使えない環境（http接続・古いブラウザ等）向けにexecCommandへのフォールバックを用意。
const copyText = async (text) => {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch (e2) { return false; }
  }
};
// 2026-08-21 ユーザー要望：銘柄分析カードの「PTSの注記」〜「利確/損切シグナルチップ」の区間
// （エントリーチェックリスト・決算期待値の★・タイミングチェック・資金管理の株数目安等）を
// 一時的に非表示にする。コードは削除せず残しているため、復活させたい場合はtrueに戻すだけでよい。
const SHOW_ANALYSIS_CHECKLISTS = false;
// 2026-08-21 ユーザー要望：登録銘柄検索を読み仮名でも引っかかるようにする。カタカナ→ひらがな変換
// で正規化してから比較することで、社名がカタカナのみの銘柄（○○ホールディングス等）はこれだけで
// ひらがな検索に対応できる。漢字を含む社名は変換だけでは読みにならないため、MASTER定義末尾の
// JP_KANAで個別に読み（ひらがな）を補う（未収録分はkana=""のままだが、コード・社名・業種での
// 検索は従来どおり有効）。
const toHiragana = (str) => String(str||"").replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const normKana = (str) => toHiragana(String(str||"").toLowerCase());

const getInitialTheme=()=>{
  try{const saved=localStorage.getItem(THEME_KEY);if(saved==="light"||saved==="dark")return saved;}catch{}
  return (window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";

const SECTORS_33 = [

// ===== カラールール（セクター・銘柄共通。3章の仕様）=====
// 上昇率(%)は0.5%刻みで6段階(0-0.5/0.5-1.0/1.0-1.5/1.5-2.0/2.0-2.5/2.5超)に区分し、1段階ずつ赤/緑を濃くする。
// 最終段階(2.5%超)は上限なくすべて同じ最も濃い色で頭打ちにする。
// レベル1（0%超〜0.5%）は現状使用している --up / --down の色そのものを「最も薄い色」の基準として使う。
const CHANGE_STEP = 0.5;
const CHANGE_MAX_LEVEL = 6; // 0.5%刻み6段階。2.5%超は全て最終段階（最大濃度）

// design_renewal_instruction.md：ムームー証券を参考にした鮮やかな配色をライト/ダークそれぞれで定義。
// 日本の相場慣習（赤=上昇・緑=下落）は維持し、指示書の「上昇=緑系」の数値は当アプリの赤に、
// 「下落=赤系」の数値は当アプリの緑に、意味を保ったまま割り当てている。
// ダークモードでは背景が暗いため、レベル6（最濃）を黒に近づけるのではなく、より明るく彩度の高い
// 色にすることで視認性を確保する（3-4章：ダークモード時のコントラスト確認）。
const COLOR_PALETTE = {
  light: {upBase:"#FF4D5C", upDark:"#8B0000", downBase:"#00B366", downDark:"#00522E", upBg:"#FFE3E5", downBg:"#DFF7EC"},
  dark:  {upBase:"#FF8A93", upDark:"#FF3B4E", downBase:"#4DFFB0", downDark:"#00E676", upBg:"rgba(255,77,92,.22)", downBg:"rgba(0,208,132,.22)"},
};
// 3-2章：CSS変数だけでなくJS側の色計算（changeColor/Sparkline）もテーマに応じて出し分ける必要があるため、
// App内のテーマ切り替えエフェクトでこのモジュール変数を更新する（single-file構成のためprops経由にせず共有）。
let CURRENT_THEME = "light";
const setColorTheme=(t)=>{CURRENT_THEME=(t==="dark")?"dark":"light";};

const hexToRgb=(h)=>{
  if(h.startsWith("rgba")){const m=h.match(/[\d.]+/g);return [+m[0],+m[1],+m[2]];}
  const n=parseInt(h.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255];
};
const rgbToHex=(r,g,b)=>"#"+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join("");
const mixHex=(a,b,t)=>{const[ar,ag,ab]=hexToRgb(a),[br,bg,bb]=hexToRgb(b);return rgbToHex(ar+(br-ar)*t,ag+(bg-ag)*t,ab+(bb-ab)*t);};

// セルの背景色に対して、白文字/濃色文字のどちらが読みやすいかをWCAGの相対輝度で判定する
const relLuminance=(hex)=>{
  const [r,g,b]=hexToRgb(hex).map(v=>{const c=v/255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);});
  return 0.2126*r+0.7152*g+0.0722*b;
};
const contrastText=(bgHex)=>relLuminance(bgHex)>0.42?"#1A1A1A":"#FFFFFF";

// pct(%)を受け取り、日次モニター・セクター・登録銘柄どれでも使う共通のカラー情報を返す。
// セルの背景そのものを段階配色にし（ヒートマップ的な塗り分け）、文字色は背景の明るさに応じて
// 白/濃色を自動選択することで、セルの中でも数字が確実に読めるようにする。pctがnull/0はニュートラル。
const changeColor=(pct)=>{
  if(pct==null||pct===0) return {level:0,dir:null,fg:"var(--inkSoft)",fgSoft:"var(--inkSoft)",bg:"var(--card)"};
  const pal=COLOR_PALETTE[CURRENT_THEME];
  const level=Math.min(CHANGE_MAX_LEVEL,Math.ceil(Math.abs(pct)/CHANGE_STEP));
  const t=(level-1)/(CHANGE_MAX_LEVEL-1);
  const up=pct>0;
  const bg=mixHex(up?pal.upBase:pal.downBase, up?pal.upDark:pal.downDark, t);
  const fg=contrastText(bg);
  const fgSoft=fg==="#FFFFFF"?"rgba(255,255,255,.75)":"rgba(26,26,26,.65)";
  return {level,dir:up?"up":"down",fg,fgSoft,bg};
};

// 保存データに存在しない銘柄コードだけを追加する形で移行し、既存の登録銘柄・設定は保持する。
const mergeDefaults=(saved,defaults,max)=>{
  if(!Array.isArray(saved))return saved;
  const seen=new Set(saved.map(w=>w.code));
  const toAdd=defaults.filter(m=>!seen.has(m.code)).map(m=>({id:m.code,...m,watch:"通常",note:"",theme:""}));
  return [...saved,...toAdd].slice(0,max);
};

// 業種分類で上書きして移行する（MASTERに無い手動登録銘柄はそのまま据え置く）。
const VALID_SECTORS=new Set([...SECTORS_33,SECTOR_INDEX]);
const migrateSectors=(list)=>{
  if(!Array.isArray(list))return list;
  return list.map(w=>{
    if(VALID_SECTORS.has(w.sector))return w;
    const m=MASTER.find(x=>x.code===w.code);
    return m?{...w,sector:m.sector}:w;
  });
};

// 10-1章：カードUI基盤。ミニスパークライン（値上がり/値下がりでグラデーション色を変える）
function Sparkline({data,color,width=140,height=36}){
  const gid=(React.useId?React.useId():"spark")+"-g";
  if(!data||data.length<2) return <svg width={width} height={height}></svg>;
  const min=Math.min(...data),max=Math.max(...data);
  const range=(max-min)||1;
  const stepX=width/(data.length-1);
  const pts=data.map((v,i)=>[i*stepX,height-((v-min)/range)*height]);
  const line=pts.map(([x,y],i)=>(i===0?"M":"L")+x.toFixed(1)+","+y.toFixed(1)).join(" ");
  const area=line+` L${width},${height} L0,${height} Z`;
  return <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} style={{display:"block",width:"100%",height}} preserveAspectRatio="none">
    <defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor={color} stopOpacity="0.32"/>
      <stop offset="100%" stopColor={color} stopOpacity="0"/>
    </linearGradient></defs>
    <path d={area} fill={`url(#${gid})`} stroke="none"/>
    <path d={line} fill="none" stroke={color} strokeWidth="1.6"/>
  </svg>;
}

const NEWS_CATEGORY_KEYWORDS=[
  ["EARNINGS",["決算","上方修正","下方修正","増益","減益","最終利益","純利益","営業利益"]],
  ["IR",["IR","適時開示","自己株式取得","株式分割","新株予約権","業務提携","M&A","公開買付","TOB","大量保有"]],
  ["FX",["ドル円","為替","円安","円高","USDJPY"]],
  ["COMMODITY",["原油","WTI","金価格","商品先物","天然ガス"]],
  ["POLITICS",["選挙","政権","大統領","首相","国会","規制強化","制裁"]],
  ["MACRO",["日銀","FRB","利上げ","利下げ","金利","GDP","インフレ","雇用統計","中央銀行"]],
  ["MARKET",["日経平均","NYダウ","NASDAQ","S&P","市場","株式市場","続落","続伸","急落","急騰"]],
  ["SECTOR",["セクター","業種","関連株"]],
];
const classifyNewsCategory=(title)=>{
  const t=title||"";
  for(const [cat,kws] of NEWS_CATEGORY_KEYWORDS){if(kws.some(k=>t.includes(k)))return cat;}
  return "COMPANY"; // 企業名一致で拾われた記事のデフォルト（OTHERはスポーツ等の除外漏れ検知用に予約）
};

function NewsList({items,showName,emptyText,priorityOf}){
  if(!items||!items.length) return <div className="news-empty">{emptyText||"まだ取得していません。自動更新（起動直後・1時間おき）をお待ちください。"}</div>;
  return <div className="news-list">
    {items.map((it,i)=>{
      const meta=[showName?it.name:null,it.source,it.published].filter(Boolean).join(" ・ ");
      const important=isImportantNews(it.title);
      // NQN等の速報見出し（立花証券API）は元記事URLが無いため、リンクにせずカード表示にする
      const Tag=it.url?"a":"div";
      const linkProps=it.url?{href:it.url,target:"_blank",rel:"noopener noreferrer"}:{};
      // Trade Cockpit v2 Phase4（設計案30番）：保有／候補／監視／テーマ一致に該当するニュースには
      // バッジを付ける（優先度4=その他は表示しない）。
      const prio=priorityOf&&it.code?priorityOf(it.code):4;
      const category=classifyNewsCategory(it.title);
      // v3 Phase4（設計案48番）：「不要」フィードバック。AI不使用、ログ化するだけ（将来のキーワード
      // 辞書見直し用）。<a>タグ内のボタンのためクリック伝播でページ遷移しないようstopPropagation。
      const sendFeedback=(e)=>{
        e.preventDefault();e.stopPropagation();
        fetch("/api/news-feedback/save",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({title:it.title,source:it.source,matched_stock_code:it.code||null,category})}).catch(()=>{});
        e.currentTarget.textContent="✓";
      };
      return <Tag key={i} className={"news-item"+(important?" important":"")} {...linkProps}>
        {important&&<span className="news-alert-badge">⚠ 重要</span>}
        {prio<4&&<span className="chip" style={{fontSize:10,marginRight:4}}>{NEWS_PRIORITY_LABELS[prio]}</span>}
        <span className="chip" style={{fontSize:9.5,marginRight:4,color:"var(--inkFaint)"}}>{category}</span>
        {showName&&it.code&&<span className="news-tag">{it.code}</span>}
        <span className="news-body">
          <span className="news-title" style={important?{color:"var(--accent)",fontWeight:700}:undefined}>{it.title}</span>
          {it.summary&&<span className="news-summary">{it.summary}</span>}
          {meta&&<span className="news-meta">{meta}</span>}
        </span>
        <SourceThumb source={it.source}/>
        <button className="iconbtn" title="このニュースは不要（フィードバックとして記録します）" style={{fontSize:11,marginLeft:4}} onClick={sendFeedback}>不要</button>
      </Tag>;
    })}
  </div>;
}

// 決算期待値：0.5刻み5段階の星評価。過去の上方/下方修正比率・直近決算の良し悪し・現在の株価の
// 過熱度（RSI・52週高値/安値からの位置）からサーバー側で自動算出した値をそのまま表示する
// （旧・手動クリック評価は廃止）。
function EarningsStars({value}){
  const v=value||0;
  return <span style={{display:"inline-flex",gap:1}} title={`決算期待値（自動算出）：${v}/5`}>
    {[0,1,2,3,4].map(i=>{
      const pct=Math.max(0,Math.min(1,v-i))*100;
      return <span key={i} style={{position:"relative",display:"inline-block",fontSize:15,lineHeight:1}}>
        <span style={{color:"var(--rule)"}}>★</span>
        <span style={{position:"absolute",left:0,top:0,overflow:"hidden",width:pct+"%",color:"var(--star)"}}>★</span>
      </span>;
    })}
  </span>;
}

// 決算分析タブ：業績進捗率を「棒グラフ（推移＋通期予想との比較）」と「円グラフ（進捗率が一目でわかる）」で表示。
// moomoo証券アプリの配色に合わせ、進捗を示す環はaccent（オレンジ）、実績棒は前期比の増減でup/down色を使う。
function EarningsProgressChart({trend,latestDetail}){
  if(!trend||!trend.length||!latestDetail||latestDetail.forecastRevenue==null)return null;
  const bars=trend.filter(t=>t.sales!=null).slice(-6);
  if(!bars.length)return null;
  const forecastYen=latestDetail.forecastRevenue*1e6;
  const maxV=Math.max(forecastYen,...bars.map(b=>b.sales));
  const oku=v=>(v/1e8).toLocaleString(undefined,{maximumFractionDigits:0});
  const W=320,H=150,padL=4,padR=4,padB=20,padT=10;
  const plotW=W-padL-padR,plotH=H-padT-padB;
  const bw=plotW/bars.length*0.56;
  const gap=plotW/bars.length;
  const yOf=v=>padT+plotH-(v/maxV)*plotH;
  const forecastY=yOf(forecastYen);
  const pct=latestDetail.progressPct;
  const pctClamped=pct==null?0:Math.max(0,Math.min(100,pct));
  const R=42,CX=60,CY=60,STROKE=11;
  const circumference=2*Math.PI*R;
  const dash=circumference*(pctClamped/100);
  return <div style={{display:"flex",flexWrap:"wrap",gap:18,alignItems:"center",marginTop:10,paddingTop:9,borderTop:"1px solid var(--ruleSoft)"}}>
    <div style={{flex:"0 0 auto"}}>
      <div style={{fontSize:12.5,color:"var(--inkFaint)",marginBottom:4,textAlign:"center"}}>通期進捗率</div>
      <svg viewBox="0 0 120 120" width={120} height={120}>
        <circle cx={CX} cy={CY} r={R} fill="none" stroke="var(--rule)" strokeWidth={STROKE}/>
        <circle cx={CX} cy={CY} r={R} fill="none" stroke="var(--accent)" strokeWidth={STROKE}
          strokeDasharray={`${dash} ${circumference-dash}`} strokeLinecap="round"
          transform={`rotate(-90 ${CX} ${CY})`}/>
        <text x={CX} y={CY-2} textAnchor="middle" fontSize={20} fontWeight={800} fill="var(--ink)">
          {pct==null?"—":pct.toFixed(1)}
        </text>
        <text x={CX} y={CY+16} textAnchor="middle" fontSize={11} fill="var(--inkSoft)">{pct==null?"":"%"}</text>
      </svg>
    </div>
    <div style={{flex:"1 1 220px",minWidth:220}}>
      <div style={{fontSize:12.5,color:"var(--inkFaint)",marginBottom:4}}>売上高推移（実績）と通期会社予想（億円）</div>
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H}>
        <line x1={padL} y1={forecastY} x2={W-padR} y2={forecastY} stroke="var(--accent)" strokeWidth={1.5} strokeDasharray="4 3"/>
        <text x={W-padR} y={forecastY-3} textAnchor="end" fontSize={10} fill="var(--accent)">通期予想 {oku(forecastYen)}億</text>
        {bars.map((b,i)=>{
          const x=padL+gap*i+(gap-bw)/2;
          const y=yOf(b.sales);
          const h=padT+plotH-y;
          const up=b.salesYoy==null?null:b.salesYoy>=0;
          const color=b.isLatest?"var(--accent)":(up==null?"var(--inkFaint)":(up?"var(--up)":"var(--down)"));
          const label=b.periodEnd?b.periodEnd.slice(5):(b.periodLabel||"");
          return <g key={i}>
            <rect x={x} y={y} width={bw} height={Math.max(1,h)} fill={color} rx={2}/>
            <text x={x+bw/2} y={H-6} textAnchor="middle" fontSize={9.5} fill="var(--inkFaint)">{label}</text>
          </g>;
        })}
      </svg>
    </div>
  </div>;
}

// 6-1章：銘柄検索・登録＋セクター別アコーディオン表示（2〜5章の仕様）を市場ごとに再利用するための共通コンポーネント。
// 日本市場・アメリカ市場タブの両方で、このコンポーネントをそのまま使い回すことで「全く同じ仕様・UI」を担保する。
function SectorWatchlist({market,watchlist,setWatchlist,candidates,max,stockQuotes,analysisTargets,onToggleAnalysis,earningsTargets,onToggleEarnings,watchTargets,onToggleWatch,onOpenChart,metrics,breakoutLevels,analysisData}){
  const [q,setQ]=useState("");
  const [manualSector,setManualSector]=useState(SECTOR_CHOICES[0]);
  const [openSectors,setOpenSectors]=useState(()=>new Set());
  const rowRefs=useRef({}); // code -> <tr>要素。検索で既登録銘柄がヒットした際にスクロールで見せるため（2026-08-21 ユーザー要望）
  const [jumpHighlight,setJumpHighlight]=useState(null); // 直前にジャンプした銘柄コード。数秒だけ行を強調表示する

  const regCodes=useMemo(()=>new Set(watchlist.map(w=>w.code)),[watchlist]);
  // 2026-08-21 ユーザー要望：コード・企業名に加え、読み仮名（ひらがな・カタカナどちらで入力しても
  // ヒットする）でも検索できるようにする。normKana()でクエリ・候補側の双方をひらがなに正規化して
  // 比較するため、社名がカタカナのみの銘柄は読み未収録でもこれだけで検索可能になる。
  const results=useMemo(()=>{const t=normKana(q.trim());if(!t)return[];
    return candidates.filter(m=>!regCodes.has(m.code)&&(normKana(m.code).includes(t)||normKana(m.name).includes(t)||normKana(m.kana).includes(t)||normKana(m.sector).includes(t))).slice(0,8);},[q,regCodes,candidates]);
  // 「検索しても候補が出てこない」問い合わせ対応：日経225+主要30社／ダウ30社は最初から登録済み
  // （MASTER・DEFAULT_WATCHLIST）のため、有名企業ほど検索しても新規候補が0件になりやすい。
  // resultsが空のとき、実は既に登録済みなだけなのかを判定してユーザーに明示する。
  const alreadyRegisteredMatch=useMemo(()=>{const t=normKana(q.trim());if(!t)return null;
    return candidates.find(m=>regCodes.has(m.code)&&(normKana(m.code).includes(t)||normKana(m.name).includes(t)||normKana(m.kana).includes(t)))||null;},[q,regCodes,candidates]);
  const addStock=(m)=>{if(watchlist.length>=max){alert("登録は最大"+max+"社までです。");return;}
    if(regCodes.has(m.code))return; setWatchlist([...watchlist,{id:m.code,...m,watch:"通常",note:"",theme:""}]);setQ("");};
  const [sectorGuessing,setSectorGuessing]=useState(false);
  // 2026-08-21 ユーザー要望：マスターリストに無い銘柄を手動登録する際、業種プルダウンの手動選択に
  // 頼らずyfinanceから東証33業種を推定して自動で埋める（guess_sector()、server.py参照）。
  // 完全な精度は保証できないため、推定できなかった場合はプルダウンで選んだ値（manualSector）を
  // そのまま使う（従来どおり）。
  const addManual=async()=>{
    const raw=q.trim();if(!raw)return;if(watchlist.length>=max){alert("最大"+max+"社");return;}
    let code=raw,name=raw;
    if(!/^[0-9]{4}[0-9A-Za-z]?$/.test(raw)){
      const input=prompt(`「${raw}」の証券コード（例：5016、AAPL）を入力してください`,"");
      if(!input||!input.trim())return;
      code=input.trim();
    }
    let sector=manualSector;
    setSectorGuessing(true);
    try{
      const r=await fetch("/api/guess-sector",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code,market})});
      if(r.ok){
        const d=await r.json();
        if(d.sector&&SECTOR_CHOICES.includes(d.sector))sector=d.sector;
      }
    }catch(e){}
    setSectorGuessing(false);
    setWatchlist([...watchlist,{id:Date.now()+Math.random(),code,name,sector,market,tvSymbol:(market==="JP"?"TSE:"+code:code),watch:"通常",note:"",theme:""}]);setQ("");};
  const delStock=(id)=>setWatchlist(watchlist.filter(w=>w.id!==id));
  const editTheme=(w)=>{
    const input=prompt(`「${w.name}」のテーマ（例：AI関連、インバウンド、半導体）`,w.theme||"");
    if(input==null)return; // キャンセル
    setWatchlist(watchlist.map(x=>x.id===w.id?{...x,theme:input.trim()}:x));
  };

  // 銘柄コードの前日比(%)・売買代金（3章カラールール・セクター並び替えで共通利用）
  const pctOf=(code)=>{const qt=stockQuotes[code]||{};const t=num(qt.t),p=num(qt.p);
    return (t!=null&&p!=null&&p)?(t-p)/p*100:null;};
  const turnoverOf=(code)=>{const v=num(stockQuotes[code]?.turnover);return v!=null&&v>0?v:null;};

  // セクターの並び順は「セクター内合計売買代金の降順」。銘柄追加・株価更新のたびに再計算され、
  // 売買代金の変動に応じて自動的に入れ替わる。未取得時はSECTOR_CHOICES(33業種+指数・為替)の定義順にフォールバック。
  const sectorOrder=useMemo(()=>SECTOR_CHOICES,[]);
  const sectorGroups=useMemo(()=>{
    const map={};
    watchlist.forEach(w=>{(map[w.sector]=map[w.sector]||[]).push(w);});
    return Object.entries(map)
      .map(([sector,items])=>{
        const pcts=items.map(w=>pctOf(w.code)).filter(v=>v!=null);
        const avgPct=pcts.length?pcts.reduce((a,b)=>a+b,0)/pcts.length:null;
        const totalTurnover=items.reduce((sum,w)=>sum+(turnoverOf(w.code)||0),0);
        return {sector,avgPct,totalTurnover,items:[...items].sort((a,b)=>(wOrder[a.watch]-wOrder[b.watch])||a.code.localeCompare(b.code))};
      })
      .sort((a,b)=>(b.totalTurnover-a.totalTurnover)||(sectorOrder.indexOf(a.sector)-sectorOrder.indexOf(b.sector)));
  },[watchlist,stockQuotes,sectorOrder]);
  const toggleSector=(sec)=>setOpenSectors(prev=>{const n=new Set(prev);n.has(sec)?n.delete(sec):n.add(sec);return n;});

  // v3-3 Step4（UI統一）：監視銘柄タブと同じRS/Status判定をこのテーブルにも適用する。
  // 市場全体の当日騰落率は日本株=日経平均、米国株=NASDAQ（既存metricsから、追加リクエスト無し）。
  // セクター平均は上のsectorGroupsで既に集計済みの値をそのまま再利用する。
  const marketPct=useMemo(()=>{
    const m=metrics?.[market==="US"?"nasdaq":"nikkei"];if(!m)return null;
    const t=num(m.t),p=num(m.p);return (t!=null&&p!=null&&p)?(t-p)/p*100:null;
  },[metrics,market]);
  const sectorAvgMap=useMemo(()=>Object.fromEntries(sectorGroups.map(g=>[g.sector,g.avgPct])),[sectorGroups]);

  // Actionメニュー（監視銘柄タブと共通のCSSクラスを使う「⋮」ドロップダウン）
  const [openMenuFor,setOpenMenuFor]=useState(null);
  useEffect(()=>{
    if(!openMenuFor)return;
    const close=()=>setOpenMenuFor(null);
    window.addEventListener("click",close);
    return ()=>window.removeEventListener("click",close);
  },[openMenuFor]);

  // 2026-08-21 ユーザー要望：検索した銘柄が既に登録済みだった場合、そのセクターを開いて実際の行まで
  // スクロールする（メッセージを出すだけで終わらせない）。アコーディオンの開閉は次の描画を経てから
  // でないとDOMに行が無くscrollIntoViewできないため、setTimeoutで1フレーム分待つ。
  // 2026-08-22 判明：behavior:"smooth"はrequestAnimationFrameベースのアニメーションのため、
  // タブが非アクティブ/背面描画状態だと開始すらしないままスクロール位置が変わらないことがある
  // （ユーザー報告で再現）。アニメーションに依存しない"instant"に変更し、確実に移動させる。
  const jumpToRegistered=(m)=>{
    setOpenSectors(prev=>new Set(prev).add(m.sector));
    setQ("");
    setJumpHighlight(m.code);
    setTimeout(()=>{
      rowRefs.current[m.code]?.scrollIntoView({behavior:"instant",block:"center"});
    },50);
    setTimeout(()=>setJumpHighlight(prev=>prev===m.code?null:prev),2500);
  };

  return <div style={{marginTop:18}}>
    <div className="sec-head">登録銘柄　{watchlist.length}/{max}</div>
    <div className="sec-note">自動保存されます。</div>
    <div style={{position:"relative"}}>
      <div style={{display:"flex",alignItems:"center",gap:8,border:"1px solid var(--rule)",background:"var(--card)",borderRadius:4,padding:"8px 12px"}}>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder={market==="JP"?"銘柄コード・企業名・読み仮名・セクターで検索（例：6981、村田、むらた、化学）":"ティッカー・企業名・セクターで検索（例：AAPL、Apple、電気機器）"}
          style={{flex:1,border:"none",background:"transparent",outline:"none",fontSize:14}}/>
        {q && <button className="iconbtn" onClick={()=>setQ("")}>×</button>}
      </div>
      {q.trim() && <div className="results">
        {results.length===0 && alreadyRegisteredMatch && <button className="res-row" style={{fontSize:12.5,color:"var(--inkSoft)",textAlign:"left"}}
          onClick={()=>jumpToRegistered(alreadyRegisteredMatch)}>
          「{alreadyRegisteredMatch.name}」({alreadyRegisteredMatch.code}／{alreadyRegisteredMatch.sector})は既に登録済みです。クリックすると該当セクターを開いて表示します。
        </button>}
        {results.map(m=>
          <button key={m.code} className="res-row" onClick={()=>addStock(m)}>
            <span className="mono" style={{fontSize:12,width:60,color:"var(--inkSoft)"}}>{m.code}</span>
            <span style={{flex:1,fontSize:13}}>{m.name}</span>
            <span style={{fontSize:11,color:"var(--inkSoft)"}}>{m.sector}</span>
            <span style={{color:"var(--accent)",fontWeight:700}}>＋</span>
          </button>)}
        <div className="res-row" style={{background:"var(--band)",fontSize:12.5,color:"var(--inkSoft)",display:"flex",alignItems:"center",gap:8}}>
          <span>＋「{q.trim()}」を手動登録：業種（登録時に自動推定・違えば選び直せます）</span>
          <select value={manualSector} onChange={e=>setManualSector(e.target.value)} style={{fontSize:12}} disabled={sectorGuessing}>
            {SECTOR_CHOICES.map(s=><option key={s} value={s}>{s}</option>)}
          </select>
          <button className="btn" style={{fontSize:11.5,padding:"2px 10px"}} onClick={addManual} disabled={sectorGuessing}>{sectorGuessing?"業種を判定中…":"登録"}</button>
        </div>
      </div>}
    </div>
    <div style={{marginTop:12,border:"1px solid var(--rule)",background:"var(--card)",borderRadius:4,overflow:"hidden"}}>
      {sectorGroups.length===0 ?
        <div style={{padding:26,textAlign:"center",color:"var(--inkSoft)",fontSize:13}}>{`上の検索から銘柄を登録してください（最大${max}社）。`}</div> :
        sectorGroups.map(({sector,avgPct,items},i)=>{
          const isOpen=openSectors.has(sector);
          // v3 Phase1（設計案4・11・90番）：セクター見出し行のベタ塗りを廃止。騰落率は文字色のみで表現。
          const avgFg=avgPct==null||avgPct===0?"var(--ink)":(avgPct>0?"var(--up)":"var(--down)");
          return <div key={sector} style={{borderTop:i===0?"none":"1px solid var(--ruleSoft)"}}>
            <button onClick={()=>toggleSector(sector)} style={{display:"flex",alignItems:"center",width:"100%",gap:10,padding:"8px 14px",
              background:isOpen?"var(--band)":"transparent",border:"none",cursor:"pointer",textAlign:"left",font:"inherit",color:"var(--ink)"}}>
              <span className="mono" style={{fontSize:12,color:"var(--inkSoft)",width:14}}>{isOpen?"▾":"▸"}</span>
              <span style={{flex:1,fontSize:14.5,fontWeight:700}}>{sector}</span>
              <span className="mono" style={{fontSize:15,fontWeight:800,color:avgFg,minWidth:64,textAlign:"right"}}>
                {avgPct!=null?(avgPct>0?"+":"")+avgPct.toFixed(2)+"%":"—"}
              </span>
              <span style={{fontSize:11.5,color:"var(--inkSoft)"}}>{items.length}銘柄</span>
            </button>
            {isOpen && <div style={{overflowX:"auto",overflowY:"auto",maxHeight:520}}>
              <table className="watch-table" style={{width:"100%"}}>
              <colgroup>
                <col style={{width:76}}/><col style={{width:40}}/><col style={{width:56}}/><col/>
                <col style={{width:80}}/><col style={{width:80}}/>
                <col style={{width:52}}/><col style={{width:52}}/><col style={{width:36}}/>
              </colgroup>
              <thead><tr>
                <th>Status</th><th title="RS Score（0-100）">RS</th><th>コード</th><th>銘柄</th>
                <th style={{textAlign:"right"}}>現在値</th><th style={{textAlign:"right"}}>前日比</th>

              <tbody>{items.map(w=>{
                const enr=enrichWatchRow(w,stockQuotes,marketPct,sectorAvgMap[w.sector],breakoutLevels,analysisData);
                const ct=num(stockQuotes[w.code]?.t);
                const fg=enr.pct==null||enr.pct===0?"var(--ink)":(enr.pct>0?"var(--up)":"var(--down)");
                const inAnalysis=analysisTargets.includes(w.code);
                const inEarnings=earningsTargets.includes(w.code);
                const inWatch=watchTargets.includes(w.code);
                const isJumpTarget=jumpHighlight===w.code;
                const meta=WATCH_STATUS_META[enr.status];
                const badgeColor=enr.breakQuality?BREAK_QUALITY_META[enr.breakQuality].color:meta.color;
                const badgeLabel=enr.breakQuality?`${enr.breakQuality}_BREAK`:meta.label;
                return <tr key={w.id} ref={el=>{rowRefs.current[w.code]=el;}} className="watch-row"
                  style={{borderTop:"1px solid var(--ruleSoft)",background:isJumpTarget?"var(--accent)":"transparent",
                    color:isJumpTarget?"var(--card)":"var(--ink)",transition:"background 0.4s, color 0.4s"}}>
                  <td style={{whiteSpace:"nowrap",borderLeft:`3px solid ${badgeColor}`}} title={enr.breakType?`ブレイク条件: BREAK_${enr.breakType}`:meta.label}>
                    <span style={{fontWeight:700,fontSize:12.5,color:isJumpTarget?"var(--card)":badgeColor}}>{meta.icon} {badgeLabel}</span></td>
                  <td className="mono" style={{fontWeight:800,fontSize:15,color:isJumpTarget?"var(--card)":(enr.rsScore==null?"var(--ink)":enr.rsScore>=75?"var(--up)":enr.rsScore<25?"var(--down)":"var(--ink)")}}>{enr.rsScore!=null?enr.rsScore:"—"}</td>
                  <td className="mono" style={{fontWeight:700,fontSize:13}}>{w.code}</td>
                  <td style={{fontSize:15,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={w.name}>
                    {w.watch==="優先"&&<span style={{color:"var(--star)",marginRight:4}}>★</span>}{w.name}</td>
                  <td className="mono" style={{textAlign:"right",fontWeight:700,fontSize:14.5,color:isJumpTarget?"var(--card)":fg,whiteSpace:"nowrap"}}>{ct!=null?ct.toLocaleString():"—"}</td>
                  <td className="mono" style={{textAlign:"right",fontWeight:600,fontSize:14,color:isJumpTarget?"var(--card)":fg,whiteSpace:"nowrap"}}>{enr.pct!=null?(enr.pct>0?"+":"")+enr.pct.toFixed(2)+"%":"—"}</td>
                  <td className="mono" style={{textAlign:"right",fontSize:13,fontWeight:700,whiteSpace:"nowrap"}}>{enr.marketRS!=null?(enr.marketRS>0?"+":"")+enr.marketRS.toFixed(1):"—"}</td>
                  <td className="mono" style={{textAlign:"right",fontSize:13,whiteSpace:"nowrap"}}>{enr.sectorRS!=null?(enr.sectorRS>0?"+":"")+enr.sectorRS.toFixed(1):"—"}</td>
                  <td style={{textAlign:"center",position:"relative"}}>
                    <button className="watch-menu-btn" onClick={e=>{e.stopPropagation();setOpenMenuFor(v=>v===w.code?null:w.code);}}>⋮</button>
                    {openMenuFor===w.code && <div className="watch-menu" onClick={e=>e.stopPropagation()}>
                      <button onClick={()=>{onOpenChart(w);setOpenMenuFor(null);}}>チャート</button>
                      <button className={inAnalysis?"on":""} onClick={()=>{onToggleAnalysis(w.code);setOpenMenuFor(null);}}>{inAnalysis?"✓ 分析中":"分析"}</button>
                      {market==="JP" && <button className={inWatch?"on":""} onClick={()=>{onToggleWatch(w.code);setOpenMenuFor(null);}}>{inWatch?"✓ 監視銘柄":"監視銘柄に追加"}</button>}
                      {market==="JP" && <button className={inEarnings?"on":""} onClick={()=>{onToggleEarnings(w.code);setOpenMenuFor(null);}}>{inEarnings?"✓ 決算":"決算"}</button>}
                      <button onClick={()=>{editTheme(w);setOpenMenuFor(null);}}>{w.theme?`テーマ編集（${w.theme}）`:"＋テーマ"}</button>
                      <button onClick={()=>{delStock(w.id);setOpenMenuFor(null);}}>登録解除</button>
                    </div>}
                  </td>
                </tr>;})}</tbody>
            </table></div>}
          </div>;
        })}
    </div>
  </div>;
}

// 監視銘柄タブ（2026-08-21 ユーザー要望）：「日本市場」「アメリカ市場」タブの「監視銘柄」
// ボタン、または出来高ブレイクアウト条件への自動該当でwatchTargetsに入った銘柄を、市場を
// 問わずまとめて確認する。列構成はSectorWatchlistの登録銘柄テーブルと同じだが、対象が
// 少数精鋭になる想定のためセクター別アコーディオンにはせず前日比の大きい順にフラット表示する。
// 「本日優先」に相当するボタンは無く、末尾の「削除」はwatchTargetsから外すだけ（実際の登録
// 銘柄一覧からは削除しない。完全な登録解除は「日本市場」「アメリカ市場」タブの×で行う）。
// Relative Strength計算（Trade Cockpit v2 Phase1・設計案8-9番）。個別銘柄の当日騰落率と、
// 市場全体（日経平均）・所属セクター平均との差分からRS Scoreを0-100に正規化する。監視銘柄タブ
// （WatchTargetsPanel）・日次モニターのTODAY'S MARKET（TodaysMarketCard）の両方で使う共通関数。
// 重みは初期値（w1=w2=3）。運用しながら調整する想定で、ハードコードだがこの1箇所にまとめてある。
function calcRsScore(pct,marketPct,sectorAvg){
  if(pct==null)return {marketRS:null,sectorRS:null,rsScore:null};
  const marketRS=marketPct!=null?pct-marketPct:null;
  const sectorRS=sectorAvg!=null?pct-sectorAvg:null;
  if(marketRS==null&&sectorRS==null)return {marketRS,sectorRS,rsScore:null};
  const raw=(marketRS||0)*3+(sectorRS||0)*3;
  const rsScore=Math.max(0,Math.min(100,Math.round(50+raw)));
  return {marketRS,sectorRS,rsScore};
}

// Trade Cockpit v3-3 Step4（UI統一）：Status/BREAK判定ロジックを共通関数化。元はWatchTargetsPanel
// 内のuseMemoに閉じていたが、日本市場/アメリカ市場タブ（SectorWatchlist）でも同じ判定を使う
// ために切り出した。軽量計算のみ（サーバー側analyze_stock()は呼ばない）。
function enrichWatchRow(w,stockQuotes,marketPct,sectorAvg,breakoutLevels,analysisData){
  const qt=stockQuotes[w.code]||{};
  const ct=num(qt.t),p=num(qt.p);
  const pct=(ct!=null&&p!=null&&p)?(ct-p)/p*100:null;
  const {marketRS,sectorRS,rsScore}=calcRsScore(pct,marketPct,sectorAvg);
  const levels=breakoutLevels?.[w.code];
  const vol=num(qt.volume);
  const volRatio=(levels?.volAvg5&&vol!=null)?vol/levels.volAvg5:null;
  const highBreak=!!(levels&&ct!=null&&ct>levels.highLookback);
  const volSurge=volRatio!=null&&volRatio>=1.5;
  const ind=analysisData?.[w.code]?.indicators;
  const vwapReclaim=!!(ind?.vwap!=null&&ct!=null&&ct>ind.vwap);
  const resistBreak=!!(ind?.resistance!=null&&ct!=null&&ct>ind.resistance);
  let breakType=null;
  if(highBreak&&volSurge)breakType="VOLUME";
  else if(highBreak)breakType="HIGH";
  else if(resistBreak)breakType="RESIST";
  else if(vwapReclaim)breakType="VWAP";

  // v3-3 Step5（BREAK判定の再検討）：「一度ブレイクした」だけでなく「今もブレイクが有効か」を
  // 見る。既に取得済みの当日高値（stockQuotes[].high）からの押し（pullback）・当日騰落率・
  // Market RS/Sector RSを使い、ACTIVE/WEAK/FAILEDの3段階に分ける（新規の重い計算は追加しない）。
  // 「大幅下落中なのにBREAK_HIGH」対策として、当日-1%以上の下落、または当日高値から5%以上
  // 押した銘柄はFAILED（ブレイク水準を割った＝一度ブレイクしたが今は無効）として明示する
  // （WEAK/HOTへ紛れ込ませて見えなくするのではなく、「失敗したブレイク」として区別する）。
  let breakQuality=null;
  if(breakType){
    const todayHigh=num(qt.high);
    const pullbackPct=(todayHigh!=null&&ct!=null&&todayHigh>0)?(todayHigh-ct)/todayHigh*100:null;
    const declining=pct!=null&&pct<=-1;
    const fadedFromHigh=pullbackPct!=null&&pullbackPct>=5;
    const weakRS=(marketRS!=null&&marketRS<=-3)||(sectorRS!=null&&sectorRS<=-3);
    const mildPullback=pullbackPct!=null&&pullbackPct>=2;
    if(declining||fadedFromHigh)breakQuality="FAILED";
    else if(weakRS||mildPullback)breakQuality="WEAK";
    else breakQuality="ACTIVE";
  }
  const isBreak=breakType!=null;

  // v3-3 Step6（WAIT/RISKの軽量判定）：全銘柄にanalyze_stock()相当の重い計算は追加せず、
  // 既に取得済みのstockQuotes（当日高値・安値・出来高）とRS Scoreだけで判定する。「分析」済み
  // 銘柄（analysisData）があればVWAP・信用倍率等でさらに精度を上げるが、無くても動く設計。
  const todayHigh=num(qt.high),todayLow=num(qt.low);
  const rangePullbackPct=(todayHigh!=null&&ct!=null&&todayHigh>0)?(todayHigh-ct)/todayHigh*100:null;
  // RISK：短時間急騰からの高値急落（当日+5%以上あったのに現在は高値から3%以上押している）、
  // または当日の値動きが±8%を超える極端な変動（out-sizeなボラティリティ＝飛び付き注意）。
  // 「分析」済みなら信用倍率danger・RSI過熱（>=80）も加味する（無くても上記2条件だけで判定可）。
  const spikeReversal=pct!=null&&pct>=5&&rangePullbackPct!=null&&rangePullbackPct>=3;
  const extremeMove=pct!=null&&Math.abs(pct)>=8;
  const marginDanger=analysisData?.[w.code]?.tradeRules?.marginBadge==="danger";
  const rsiHot=ind?.rsi!=null&&ind.rsi>=80;
  const isRisk=spikeReversal||extremeMove||marginDanger||rsiHot;
  // WAIT：RSはWATCH相当（50-74）だが、当日プラスなのに値幅の下半分で推移＝強さが確認できていない。
  // 「分析」済みならVWAP未回復も加味する。
  const indecisive=pct!=null&&pct>0&&todayHigh!=null&&todayLow!=null&&todayHigh>todayLow&&((ct-todayLow)/(todayHigh-todayLow))<0.5;
  const vwapNotReclaimed=!!(ind?.vwap!=null&&ct!=null&&ct<ind.vwap);
  const isWaitCandidate=indecisive||vwapNotReclaimed;

  let status;
  if(isBreak)status="BREAK";
  else if(isRisk)status="RISK";
  else if(rsScore!=null&&rsScore>=75)status="HOT";
  else if(rsScore!=null&&rsScore>=50)status=isWaitCandidate?"WAIT":"WATCH";
  else status="WEAK";
  return {...w,pct,marketRS,sectorRS,rsScore,volRatio,status,breakType,breakQuality};
}

// Status判定（Trade Cockpit v2 Phase1）。ルールベース・軽量計算のみ（サーバー側analyze_stock()は
// 呼ばない＝279銘柄規模でも重くならないよう、既に画面上にある値〈stockQuotes・sector平均・
// breakoutLevels〉だけから算出する）。RS Scoreの重み付けは初期値。運用しながら調整する想定。
const WATCH_STATUS_META = {
  BREAK: {icon:"⚡",label:"BREAK",order:0,color:"var(--down)"},
  RISK:  {icon:"⚠",label:"RISK", order:1,color:"var(--up)"},
  HOT:   {icon:"🔥",label:"HOT",  order:2,color:"var(--down)"},
  WATCH: {icon:"👀",label:"WATCH",order:3,color:"var(--accent)"},
  WAIT:  {icon:"⏳",label:"WAIT", order:4,color:"var(--inkSoft)"},

};
// v3-3 Step5：BREAKの「今も有効か」による色分け。ACTIVE=まだ勢いがある（既存のBREAK色を継承）、
// WEAK=ブレイクはしたが勢いが弱い（要注意）、FAILED=一度ブレイクしたが現在値がブレイク水準を
// 割った（実質的に失敗）。ACTIVE_BREAK/WEAK_BREAK/FAILED_BREAKとしてバッジ表示する。
const BREAK_QUALITY_META = {
  ACTIVE: {color:"var(--down)"},
  WEAK:   {color:"var(--accent)"},
  FAILED: {color:"var(--inkFaint)"},
};
const TRADE_CANDIDATE_STATUS_OPTIONS=[
  {value:"WATCH",label:"監視"},{value:"WAIT",label:"待機"},
  {value:"BUY_CANDIDATE",label:"買い候補"},{value:"SKIP",label:"見送り"},
];

// 銘柄分析カード用の総合判断表示（Trade Cockpit v2 Phase2・24番）。server.py analyze_stock()の
// assessmentをそのまま表示するだけ（AI不使用・ルールベースの結果を可視化するのみ）。
// 色は既存entryChecklist/avoidChecklistの慣習に合わせる（--up=赤=好材料寄り、--down=緑=警告寄り。
// CLAUDE.md記載の「上昇=赤・下落=緑」の株価配色とは別に、このアプリでは買いシグナル=赤／
// 見送り警告=緑の対比として使われている。混同しないよう既存チップと同じ配色に揃える）。
const ASSESSMENT_STATUS_META={
  HOT:{icon:"🔥",label:"HOT",color:"var(--up)"},
  WATCH:{icon:"👀",label:"WATCH",color:"var(--accent)"},
  WAIT:{icon:"⏳",label:"WAIT",color:"var(--inkSoft)"},
  WEAK:{icon:"💤",label:"WEAK",color:"var(--inkFaint)"},
};
const AXIS_LABEL_META={
  "RISK ON":{color:"var(--up)"},"NEUTRAL":{color:"var(--inkSoft)"},"RISK OFF":{color:"var(--down)"},
  "STRONG":{color:"var(--up)"},"WEAK":{color:"var(--down)"},
  "POSITIVE":{color:"var(--up)"},"RISK":{color:"var(--down)"},
};
function AssessmentCard({assessment:a,marginBadge,marginRatio}){
  const meta=ASSESSMENT_STATUS_META[a.overallStatus]||ASSESSMENT_STATUS_META.WEAK;
  const axisRows=[
    ["Market",a.axes?.market],["Supply/Demand",a.axes?.supplyDemand],
    ["Technical",a.axes?.technical],["Catalyst",a.axes?.catalyst],
  ].filter(([,v])=>v!=null);
  // v3 Phase3（設計案37番）：Day Trade／Swingを分けて表示。新規のサーバー計算は追加せず、
  // 既存assessmentの値（Falling Knife/Chase Risk・Entry Conditions・Market/RS）から
  // クライアント側で導出するだけ（Day Tradeは短期シグナル寄り、Swingは地合い・RS寄りを重視）。
  const dayTradeLabel = (a.fallingKnife||a.chaseRisk) ? "WAIT"
    : (a.entryConditionsTotal>0 && a.entryConditionsMet===a.entryConditionsTotal) ? "STRONG WATCH"
    : (a.entryConditionsMet>0) ? "WATCH" : "NEUTRAL";
  const swingLabel = a.marketRiskLabel==="RISK OFF" ? "CAUTION"
    : (a.marketRS!=null && a.marketRS>=2) ? "STRONG" : "NEUTRAL";
  return <div style={{border:"1px solid var(--rule)",borderRadius:4,padding:"8px 10px",marginBottom:8,background:"var(--card)"}}>
    <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
      <span style={{fontWeight:800,fontSize:13,color:meta.color}}>{meta.icon} {meta.label}</span>
      <span className="chip" style={{fontSize:10.5}}>Day Trade: {dayTradeLabel}</span>
      <span className="chip" style={{fontSize:10.5}}>Swing: {swingLabel}</span>
      {a.marketRiskScore!=null && <span className="chip" style={{fontSize:10.5}}>Market Risk {a.marketRiskScore}（{a.marketRiskLabel}）</span>}
      {a.marketRS!=null && <span className="chip" style={{fontSize:10.5}}>Market RS {a.marketRS>0?"+":""}{a.marketRS}pt</span>}
      <span className="chip" style={{fontSize:10.5}}>Entry Conditions {a.entryConditionsMet}/{a.entryConditionsTotal}</span>
    </div>
    {a.judgmentText && <div style={{fontSize:12,color:"var(--ink)",marginTop:6,lineHeight:1.6}}>{a.judgmentText}</div>}
    {axisRows.length>0 && <div style={{display:"flex",flexWrap:"wrap",gap:4,marginTop:6}}>
      {axisRows.map(([label,val])=><span key={label} className="chip" style={{fontSize:10.5,color:AXIS_LABEL_META[val]?.color}}>{label}: {val}</span>)}
    </div>}
    {a.fallingKnife && <div style={{fontSize:11.5,fontWeight:700,color:"var(--down)",background:"var(--downBg)",border:"1px solid var(--down)",borderRadius:4,padding:"4px 8px",marginTop:6}}>
      🔪 FALLING KNIFE：{a.fallingKnifeReasons.join("・")}</div>}
    {a.chaseRisk && <div style={{fontSize:11.5,fontWeight:700,color:"var(--down)",background:"var(--downBg)",border:"1px solid var(--down)",borderRadius:4,padding:"4px 8px",marginTop:6}}>
      ⚠ CHASE RISK：{a.chaseRiskReasons.join("・")}</div>}
    {/* v3 Phase6（設計案58番）：ルール警告。AI不使用、既存の計算結果（marginBadge・marketRiskLabel）を
        条件判定するだけ。falling knife/chase riskと同じ見た目の警告ボックスに揃える。 */}
    {(marginBadge==="danger"||marginBadge==="caution") && <div style={{fontSize:11.5,fontWeight:700,color:"var(--down)",background:"var(--downBg)",border:"1px solid var(--down)",borderRadius:4,padding:"4px 8px",marginTop:6}}>
      ⚠ 信用買い残過多：信用倍率 {marginRatio}倍</div>}
    {a.marketRiskLabel==="RISK OFF" && <div style={{fontSize:11.5,fontWeight:700,color:"var(--down)",background:"var(--downBg)",border:"1px solid var(--down)",borderRadius:4,padding:"4px 8px",marginTop:6}}>
      ⚠ Market Risk High：{a.marketRiskScore}/100（RISK OFF）</div>}
  </div>;
}

function WatchTargetsPanel({items,stockQuotes,analysisTargets,onToggleAnalysis,earningsTargets,onToggleEarnings,onRemove,onOpenChart,metrics,watchlistAll,breakoutLevels,activeRules,analysisData}){
  const pctOf=(code)=>{const qt=stockQuotes[code]||{};const t=num(qt.t),p=num(qt.p);
    return (t!=null&&p!=null&&p)?(t-p)/p*100:null;};

  // 市場（日経平均）に対する当日騰落率の差分（8番：Relative Strength計算方法）
  const marketPct=useMemo(()=>{
    const m=metrics?.nikkei;if(!m)return null;
    const t=num(m.t),p=num(m.p);return (t!=null&&p!=null&&p)?(t-p)/p*100:null;
  },[metrics]);
  // セクター平均に対する差分（既存groupStocks()を再利用。ThemeSectorRanking等と同じ計算式）
  const sectorAvgMap=useMemo(()=>{
    const groups=groupStocks(watchlistAll||[],stockQuotes,w=>w.sector);
    return Object.fromEntries(groups.map(g=>[g.key,g.avgPct]));
  },[watchlistAll,stockQuotes]);

  const enriched=useMemo(()=>items.map(w=>
    enrichWatchRow(w,stockQuotes,marketPct,sectorAvgMap[w.sector],breakoutLevels,analysisData)
  ),[items,stockQuotes,marketPct,sectorAvgMap,breakoutLevels,analysisData]);

  const [sortKey,setSortKey]=useState("priority");
  const sorted=useMemo(()=>{
    const arr=[...enriched];
    const byNullLast=(va,vb,desc)=>{
      if(va==null&&vb==null)return 0;if(va==null)return 1;if(vb==null)return -1;
      return desc?vb-va:va-vb;
    };
    switch(sortKey){
      case "rsScore": return arr.sort((a,b)=>byNullLast(a.rsScore,b.rsScore,true));
      case "pct": return arr.sort((a,b)=>byNullLast(a.pct,b.pct,true));
      case "sector": return arr.sort((a,b)=>(a.sector||"").localeCompare(b.sector||"",'ja'));
      case "current": return arr.sort((a,b)=>byNullLast(num(stockQuotes[a.code]?.t),num(stockQuotes[b.code]?.t),true));
      case "status": return arr.sort((a,b)=>WATCH_STATUS_META[a.status].order-WATCH_STATUS_META[b.status].order||byNullLast(a.rsScore,b.rsScore,true));
      default: // priority：今日注目すべき順（Status優先度→RS Score）
        return arr.sort((a,b)=>WATCH_STATUS_META[a.status].order-WATCH_STATUS_META[b.status].order||byNullLast(a.rsScore,b.rsScore,true));
    }
  },[enriched,sortKey]);

  // Trade Cockpit v3 Phase1（設計案19-21番）：46銘柄・279銘柄を最初から全部読ませない。
  // サマリー件数→フィルタ→上位10件デフォルト表示、の順で絞り込む。
  const summary=useMemo(()=>{
    const c={HOT:0,BREAK:0,WATCH:0,WAIT:0,RISK:0,WEAK:0,rs70:0};
    enriched.forEach(w=>{c[w.status]=(c[w.status]||0)+1;if(w.rsScore!=null&&w.rsScore>=70)c.rs70++;});
    return c;
  },[enriched]);
  const [statusFilters,setStatusFilters]=useState(new Set()); // 空集合＝フィルタなし（全Status表示）
  const [rsFilter,setRsFilter]=useState(false); // RS Score 70以上のみ
  const [marketRsFilter,setMarketRsFilter]=useState(false); // Market RS +2pt以上のみ
  const [pctFilter,setPctFilter]=useState(""); // "up" | "down" | ""
  const [sectorFilter,setSectorFilter]=useState("");
  const [showAll,setShowAll]=useState(false);
  const toggleStatusFilter=(st)=>setStatusFilters(prev=>{const n=new Set(prev);n.has(st)?n.delete(st):n.add(st);return n;});
  const sectorOptions=useMemo(()=>[...new Set(enriched.map(w=>w.sector).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja')),[enriched]);
  const filtered=useMemo(()=>sorted.filter(w=>
    (statusFilters.size===0||statusFilters.has(w.status))
    &&(!rsFilter||(w.rsScore!=null&&w.rsScore>=70))
    &&(!marketRsFilter||(w.marketRS!=null&&w.marketRS>=2))
    &&(!pctFilter||(pctFilter==="up"?(w.pct!=null&&w.pct>0):(w.pct!=null&&w.pct<0)))
    &&(!sectorFilter||w.sector===sectorFilter)
  ),[sorted,statusFilters,rsFilter,marketRsFilter,pctFilter,sectorFilter]);
  const TOP_N=10;
  const displayed=showAll?filtered:filtered.slice(0,TOP_N);
  const hasFilter=statusFilters.size>0||rsFilter||marketRsFilter||!!pctFilter||!!sectorFilter;

  // 今日の候補（trade_candidates。8番）
  const [candidates,setCandidates]=useState([]);
  const [loadingCandidates,setLoadingCandidates]=useState(true);
  const [candidateStatusPick,setCandidateStatusPick]=useState({}); // code -> 選択中のstatus
  const loadCandidates=async()=>{
    setLoadingCandidates(true);
    try{
      const r=await fetch("/api/trade-candidates");
      if(r.ok){const d=await r.json();setCandidates(Array.isArray(d.candidates)?d.candidates:[]);}
    }catch(e){}
    setLoadingCandidates(false);
  };
  useEffect(()=>{loadCandidates();},[]);
  const saveCandidate=async(w)=>{
    const status=candidateStatusPick[w.code]||"WATCH";
    try{
      await fetch("/api/trade-candidates/save",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({code:w.code,name:w.name,status,
          rs_score:w.rsScore,market_rs:w.marketRS,sector_rs:w.sectorRS,
          sector:w.sector||null,margin_ratio:analysisData?.[w.code]?.tradeRules?.marginRatio??null})});
      loadCandidates();
    }catch(e){}
  };
  const removeCandidate=async(id)=>{
    try{
      await fetch("/api/trade-candidates/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})});
      loadCandidates();
    }catch(e){}
  };

  // 仮想IN（Trade Cockpit v2 Phase7・設計案12・40番）：見送り銘柄も含めて「今エントリーしたら」を
  // 記録し、後から結果を追跡できるようにする。実際の売買ではなく記録のみ（実売買は「記録」ボタン→
  // 投資判断ログ／記録タブで別途行う）。
  const virtualEntry=async(w)=>{
    const status=candidateStatusPick[w.code]||"WATCH";
    const price=num(stockQuotes[w.code]?.t);
    try{
      await fetch("/api/trade-candidates/save",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({code:w.code,name:w.name,status,
          rs_score:w.rsScore,market_rs:w.marketRS,sector_rs:w.sectorRS,
          sector:w.sector||null,margin_ratio:analysisData?.[w.code]?.tradeRules?.marginRatio??null,
          virtual_entry_price:price,virtual_entry_time:new Date().toISOString()})});
      loadCandidates();
    }catch(e){}
  };
  const [recordMsg,setRecordMsg]=useState("");
  // 「記録」（Trade Cockpit v2 Phase5・設計案39番）：監視銘柄の行から直接、当日の投資判断ログへ
  // 銘柄評価を1件追加する（投資判断ログタブでの手動入力を省略できるショートカット）。
  const recordToLog=async(w)=>{
    const qt=stockQuotes[w.code]||{};
    try{
      const r=await fetch("/api/investment-log/quick-judgment",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({judgment:{
          code:w.code,name:w.name,category:"監視",
          execution_status:candidateStatusPick[w.code]||"WATCH",
          entry_reason:`監視銘柄タブから記録（RS Score ${w.rsScore??"—"}・現在値${num(qt.t)??"—"}）`,
        }})});
      const d=await r.json();
      setRecordMsg(d.judgmentId?`${w.code} を投資判断ログに記録しました`:"記録に失敗しました");
    }catch(e){setRecordMsg("記録に失敗しました");}
    setTimeout(()=>setRecordMsg(""),2500);
  };

  // 仮想IN済み銘柄のチェックポイント記録（Trade Cockpit v2 Phase7・設計案40番）
  const CHECKPOINT_LABELS=[["30m","30分後"],["1h","1時間後"],["close","大引け"],["next_day","翌営業日"],["3d","3営業日後"],["5d","5営業日後"]];
  const recordCheckpoint=async(candidate,label)=>{
    const price=num(stockQuotes[candidate.code]?.t);
    if(price==null){alert("現在値が取得できていません（自動更新をお待ちください）");return;}
    try{
      await fetch("/api/trade-candidates/checkpoint",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({id:candidate.id,label,price})});
      loadCandidates();
    }catch(e){}
  };

  const fmtPt=(v)=>v==null?"—":(v>0?"+":"")+v.toFixed(1);

  // ChatGPT連携（Phase6・設計案44-45番）：銘柄相談用にコピー。有料AI APIは呼ばず、テキストを
  // 生成してクリップボードにコピーするだけ。
  const [consultMsg,setConsultMsg]=useState("");
  const copyConsult=async(w)=>{
    const qt=stockQuotes[w.code]||{};
    const t=num(qt.t),p=num(qt.p);
    const meta=WATCH_STATUS_META[w.status];
    const lines=[
      `【Trade Cockpit 場中相談】${new Date().toLocaleString("ja-JP")}`,"",
      `銘柄: ${w.code} ${w.name}（${w.sector||"—"}）`,
      `現在値: ${t!=null?t.toLocaleString():"—"}　前日比: ${w.pct!=null?(w.pct>0?"+":"")+w.pct.toFixed(2)+"%":"—"}`,
      `Market RS: ${fmtPt(w.marketRS)}pt　Sector RS: ${fmtPt(w.sectorRS)}pt　RS Score: ${w.rsScore??"—"}`,
      `Status: ${meta.icon} ${meta.label}`,"",
    ];
    if(activeRules?.length){lines.push("投資ルール：");activeRules.forEach(t=>lines.push(`・${t}`));lines.push("");}
    lines.push("質問：この銘柄、今入るのどう？");
    const ok=await copyText(lines.join("\n"));
    setConsultMsg(ok?`${w.code} をコピーしました`:"コピーに失敗しました");
    setTimeout(()=>setConsultMsg(""),2500);
  };

    {/* サマリー（v3設計案19番）：46銘柄を読ませる前にまず件数だけで状況を把握できるようにする */}

      <span className="chip" style={{fontSize:11}}>👀 WATCH {summary.WATCH||0}</span>

      <span className="chip" style={{fontSize:11}}>⚠ RISK {summary.RISK||0}</span>
      <span className="chip" style={{fontSize:11}}>💤 WEAK {summary.WEAK||0}</span>

    {/* フィルタ（v3設計案21番） */}

          {items.length===0?"監視銘柄はまだありません。「日本市場」タブの一覧で「監視銘柄」ボタンを押すと、ここに追加されます。":"条件に一致する銘柄はありません。"}
        </div> :
        <div style={{overflowX:"auto",maxHeight:620,overflowY:"auto"}}>
        <table className="watch-table" style={{width:"100%"}}>
          <colgroup>
            <col style={{width:76}}/><col style={{width:40}}/><col style={{width:56}}/><col/>
            <col style={{width:92}}/><col style={{width:80}}/><col style={{width:80}}/>

            <th style={{textAlign:"right"}} title="Market RS（対 日経平均、pt）">M.RS</th>

            const fg=pct==null||pct===0?"var(--ink)":(pct>0?"var(--up)":"var(--down)");

            return <tr key={w.code} className="watch-row" style={{borderTop:"1px solid var(--ruleSoft)"}}>

                <span style={{fontWeight:700,fontSize:12.5,color:badgeColor}}>{meta.icon} {badgeLabel}</span></td>
              <td className="mono" style={{fontWeight:800,fontSize:15,color:rsFg}}>{w.rsScore!=null?w.rsScore:"—"}</td>
              <td className="mono" style={{fontWeight:700,fontSize:13}}>{w.code}</td>
              <td style={{fontSize:15,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={w.name}>{w.name}</td>

              <td className="mono" style={{textAlign:"right",fontWeight:700,fontSize:14.5,color:fg,whiteSpace:"nowrap"}}>{ct!=null?ct.toLocaleString():"—"}</td>
              <td className="mono" style={{textAlign:"right",fontWeight:600,fontSize:14,color:fg,whiteSpace:"nowrap"}}
                title={cp!=null&&ct!=null?`${ct-cp>0?"+":""}${(ct-cp).toLocaleString(undefined,{maximumFractionDigits:2})}`:""}>
                {pct!=null?(pct>0?"+":"")+pct.toFixed(2)+"%":"—"}</td>
              <td className="mono" style={{textAlign:"right",fontSize:13,fontWeight:700,whiteSpace:"nowrap"}}>{fmtPt(w.marketRS)}</td>
              <td className="mono" style={{textAlign:"right",fontSize:13,whiteSpace:"nowrap"}}>{fmtPt(w.sectorRS)}</td>
              <td style={{textAlign:"center",position:"relative"}}>
                <button className="watch-menu-btn" onClick={e=>{e.stopPropagation();setOpenMenuFor(v=>v===w.code?null:w.code);}}>⋮</button>
                {openMenuFor===w.code && <div className="watch-menu" onClick={e=>e.stopPropagation()}>
                  <button onClick={()=>{onOpenChart(w);setOpenMenuFor(null);}}>チャート</button>
                  <button className={inAnalysis?"on":""} onClick={()=>{onToggleAnalysis(w.code);setOpenMenuFor(null);}}>{inAnalysis?"✓ 分析中":"分析"}</button>
                  {w.market==="JP" && <button className={inEarnings?"on":""} onClick={()=>{onToggleEarnings(w.code);setOpenMenuFor(null);}}>{inEarnings?"✓ 決算":"決算"}</button>}
                  <div style={{padding:"6px 12px",display:"flex",gap:4,alignItems:"center"}}>
                    <select value={candidateStatusPick[w.code]||"WATCH"} onChange={e=>setCandidateStatusPick(p=>({...p,[w.code]:e.target.value}))}
                      style={{fontSize:11,padding:"2px 3px",flex:1}}>
                      {TRADE_CANDIDATE_STATUS_OPTIONS.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}

                  </div>
                  <button onClick={()=>{saveCandidate(w);setOpenMenuFor(null);}}>候補に追加</button>
                  <button onClick={()=>{virtualEntry(w);setOpenMenuFor(null);}}>仮想IN</button>
                  <button onClick={()=>{recordToLog(w);setOpenMenuFor(null);}}>記録</button>

        </table></div>}
      {!showAll&&filtered.length>TOP_N && <button className="action-btn" style={{display:"block",width:"100%",padding:"8px",borderTop:"1px solid var(--ruleSoft)"}}

      {showAll&&filtered.length>TOP_N && <button className="action-btn" style={{display:"block",width:"100%",padding:"8px",borderTop:"1px solid var(--ruleSoft)"}}
        onClick={()=>setShowAll(false)}>上位{TOP_N}件のみ表示に戻す</button>}
    </div>

    <div style={{marginTop:20}}>
      <div className="sec-head" style={{fontSize:13}}>今日の候補　{candidates.length}件</div>
      {loadingCandidates
        ? <div style={{fontSize:12,color:"var(--inkFaint)"}}>読み込み中…</div>
        : candidates.length===0
          ? <div style={{fontSize:12,color:"var(--inkFaint)"}}>まだありません。上の一覧から「候補に追加」で保存できます。</div>
          : <div style={{display:"flex",flexDirection:"column",gap:4,marginTop:6}}>
              {candidates.map(c=><div key={c.id} style={{fontSize:12.5,padding:"5px 8px",border:"1px solid var(--ruleSoft)",borderRadius:3}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span className="chip" style={{fontSize:10.5}}>{TRADE_CANDIDATE_STATUS_OPTIONS.find(o=>o.value===c.status)?.label||c.status}</span>
                  <span className="mono">{c.code}</span><span style={{fontWeight:600}}>{c.name}</span>
                  {c.rs_score!=null && <span style={{color:"var(--inkSoft)"}}>RS Score {c.rs_score}</span>}
                  {c.virtual_entry_price!=null && <span style={{color:"var(--inkSoft)"}}>仮想IN {num(c.virtual_entry_price).toLocaleString()}</span>}
                  <span style={{marginLeft:"auto",color:"var(--inkFaint)",fontSize:11}}>{(c.created_at||"").slice(11,16)}</span>
                  <button className="iconbtn" onClick={()=>removeCandidate(c.id)}>×</button>
                </div>
                {/* 仮想トレード追跡（Phase7）：仮想IN済みの候補にだけチェックポイント記録UIを出す */}
                {c.virtual_entry_price!=null && <div style={{display:"flex",gap:4,flexWrap:"wrap",marginTop:4,paddingTop:4,borderTop:"1px solid var(--ruleSoft)"}}>
                  {CHECKPOINT_LABELS.map(([key,label])=>{
                    const cp=c.checkpoints?.[key];
                    if(cp){
                      const chgPct=c.virtual_entry_price?((cp.price-c.virtual_entry_price)/c.virtual_entry_price*100):null;
                      return <span key={key} className="chip" style={{fontSize:10}}>{label} {num(cp.price).toLocaleString()}{chgPct!=null?`(${chgPct>0?"+":""}${chgPct.toFixed(1)}%)`:""}</span>;
                    }
                    return <button key={key} className="action-btn" style={{fontSize:10,padding:"2px 5px"}} onClick={()=>recordCheckpoint(c,key)}>{label}を記録</button>;
                  })}
                </div>}
              </div>)}
            </div>}
    </div>
  </div>;
}

// 資金管理・分割買いツール：総資金とリスク許容%、エントリー/損切り単価から株数目安を計算する（14-15章）。
// 日本株は100株単位、米国株は1株単位に丸める。分割買いは1回目40%（打診買い）・2回目30%（反転確認後）・
// 3回目残り30%（節目上抜け後）の目安に分ける（3回とも単元株数に丸めるため合計が端数分減ることがある）。
const computePositionSize=(totalCapital,riskPct,entry,stop,market)=>{
  const capital=num(totalCapital),risk=num(riskPct);
  if(capital==null||capital<=0||risk==null||risk<=0||entry==null||stop==null)return null;
  const perShareRisk=entry-stop;
  if(perShareRisk<=0)return null;
  const lotSize=market==="JP"?100:1;
  const riskAmount=capital*(risk/100);
  const rawShares=riskAmount/perShareRisk;
  const suggestedShares=Math.floor(rawShares/lotSize)*lotSize;
  if(suggestedShares<lotSize)return {suggestedShares:0,investAmount:0,tranches:[0,0,0]};
  const t1=Math.floor(suggestedShares*0.4/lotSize)*lotSize;
  const t2=Math.floor(suggestedShares*0.3/lotSize)*lotSize;
  const t3=suggestedShares-t1-t2;
  return {suggestedShares,investAmount:suggestedShares*entry,tranches:[t1,t2,t3]};
};

// 投資判断ログの「銘柄評価」1件分の入力欄定義。[DBの列名, 表示ラベル]。
// server.py/investment_db.pyの_JUDGMENT_COLSと1対1で対応させている。
const JUDGMENT_FIELDS=[
  ["entry_reason","エントリー理由"],["skip_reason","見送り理由"],["exit_judgment","利確・損切り判断"],
  ["supply_demand","需給評価（信用残・信用倍率等）"],["earnings_eval","業績評価"],["valuation_eval","バリュエーション評価"],
  ["theme_eval","テーマ評価"],["chart_eval","チャート評価"],["chatgpt_judgment","ChatGPTの判断"],
  ["my_judgment","自分の判断"],["actual_trade","実際に行った売買"],["trade_result","その後の結果"],
];
const JUDGMENT_CATEGORIES=["監視","保有","買い候補","見送り"];

// portfolio（保有株、2026-09-03新規、Trade Cockpit v3-2）：localStorageに存在しなかった新規
// 機能のため、最初からNeonのみで完結する（移行フローは不要）。ChatGPT朝一/大引けコピーに
// 保有銘柄として含める（TodaysMarketCard・ChatGptImportPanel側でこのAPIを叩く）。
function PortfolioPanel(){
  const [items,setItems]=useState([]);
  const [loading,setLoading]=useState(true);
  const emptyDraft={code:"",name:"",market:"JP",quantity:"",average_price:"",acquired_at:"",memo:""};
  const [draft,setDraft]=useState(emptyDraft);
  const [saving,setSaving]=useState(false);
