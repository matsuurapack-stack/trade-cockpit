// 当日はevent_time（自由書式"21:30"等）があれば残り時間、無ければ「本日」。翌日以降はカレンダー
// 日数が近ければ「N日後」、離れていれば営業日数を併記する（businessDaysUntilは既存関数を再利用）。
function eventCountdownLabel(ev){
  const todayStr=todayISO();
  if(!ev.event_date)return"";
  if(ev.event_date<todayStr)return"終了";
  if(ev.event_date===todayStr){
    const m=/^(\d{1,2}):(\d{2})/.exec(ev.event_time||"");
    if(m){
      const now=new Date();
      const target=new Date(now.getFullYear(),now.getMonth(),now.getDate(),Number(m[1]),Number(m[2]));
      const diffMs=target-now;
      if(diffMs>0){
        const diffH=diffMs/3600000;
        return diffH<1?`⏳ ${Math.max(1,Math.round(diffMs/60000))}分後`:`⏳ ${Math.round(diffH)}時間後`;
      }
    }
    return"⏳ 本日";
  }
  const tomorrowStr=addDaysISO(1);
  if(ev.event_date===tomorrowStr)return"⏳ 明日";
  const calDays=Math.round((new Date(ev.event_date+"T00:00:00+09:00")-new Date(todayStr+"T00:00:00+09:00"))/86400000);
  if(calDays<=3)return`⏳ ${calDays}日後`;
  const bDays=businessDaysUntil(ev.event_date);
  return bDays!=null?`⏳ ${bDays}営業日後`:`⏳ ${calDays}日後`;
}

// event_date＝発効日がまだ先のもの）を1件返す。発効日が迫っているものを優先し、無ければ
// 最新のカタリストを優先する。
function nextCatalystForCode(catalysts,code,sector){
  if(!catalysts||!catalysts.length)return null;
  const todayStr=todayISO();
  const relevant=catalysts.filter(c=>{
    const stocks=c.affected_stocks||[];
    const sectors=c.affected_sectors||[];
    const matches=stocks.includes(code)||(sector&&sectors.includes(sector));
    if(!matches)return false;
    const pending=c.event_date&&c.event_date>=todayStr;
    return pending||catalystFreshnessLabel(c.catalyst_date)!=="OLD";
  });
  if(!relevant.length)return null;
  return relevant.sort((a,b)=>{
    const aPending=a.event_date&&a.event_date>=todayStr;
    const bPending=b.event_date&&b.event_date>=todayStr;
    if(aPending&&bPending)return a.event_date.localeCompare(b.event_date);
    if(aPending)return -1;
    if(bPending)return 1;
    return(b.catalyst_date||"").localeCompare(a.catalyst_date||"");
  })[0];
}
// tradeStyle省略時（銘柄分析タブ、まだポジションを持っていない段階）はDAY/SWINGの注記を出さない。
// ポジションタブから渡された場合だけ、DAY/SWINGで扱いを変える注記を添える（ユーザー要望：
// イベント接近を機械的にRISKへ変更せず、DAY/SWINGで参考情報の出し方だけを変える）。
function EventRiskNote({events,code,sector,tradeStyle}){
  // 2026-09-07更新（複数重要イベント表示）：最大3件を重要度HIGH優先・同重要度なら近い日付順で
  // 縦に並べる（relevantEventsForCode、上記参照）。DAY/SWINGの注記は従来通り最も近い1件
  // （evs[0]）を基準に判定する（既存の閾値・文言は無変更）。
  const evs=useMemo(()=>relevantEventsForCode(events,code,sector,tradeStyle),[events,code,sector,tradeStyle]);
  if(!evs.length)return null;
  const nearestDays=businessDaysUntil(evs[0].event_date);
  let styleNote=null;
  if(tradeStyle==="DAY"){
    styleNote="DAY：当日引けまでに手仕舞うなら影響は限定的";
  }else if(tradeStyle==="SWING"&&nearestDays!=null&&nearestDays<=10){
    styleNote="SWING：このイベントをまたぐ可能性＝重要なリスク";
  }
  return <div style={{fontSize:11,background:"var(--band)",border:"1px solid var(--rule)",borderRadius:4,padding:"4px 8px",marginBottom:8}}>

    {evs.map((ev,i)=>{
      const days=businessDaysUntil(ev.event_date);
      const icon=EVENT_TYPE_ICON[ev.event_type]||EVENT_TYPE_ICON.OTHER;
      const dayLabel=days===0?"本日":days===1?"1営業日後":`${days}営業日後`;
      const importanceHot=ev.importance==="HIGH"||ev.importance==="高";
      return <div key={ev.id} style={{marginTop:i>0?2:0,fontWeight:i===0?700:400,color:importanceHot?"var(--down)":"var(--inkSoft)"}}
        title={`情報源：${ev.source||"—"}／検証状態：${ev.verification_status}（画像由来の情報は確定情報として扱わない）`}>

        {importanceHot&&" ⚠重要度高"}

// v3-9続き（PHASE 4 NEWS/CATALYST INTELLIGENCE）：EventRiskNoteと同じ位置付けで、
// news_catalysts（マクロ・セクター・銘柄材料等）のうち銘柄コード/セクターに関連する直近の
// 1件を参考情報として表示する。Primary/Action Statusには一切干渉しない。
// 2026-09-08新規（ニュース・材料連携の改善）：好材料/悪材料/中立の方向性と、5段階重要度の
// 表示メタ。既存category（分類軸）・既存market_events等のimportance（HIGH/MEDIUM/LOW、
// 3段階）とは別軸・別表記のため、両方を吸収できるようMETAにHIGH/MEDIUM/LOWも含めておく
// （news_catalysts.importanceは自由入力のTEXT列のため、どちらの表記も来得る）。
const CATALYST_SENTIMENT_META={
  positive:{icon:"🟢",sign:"＋",label:"好材料",color:"var(--up)"},
  negative:{icon:"🔴",sign:"－",label:"悪材料",color:"var(--down)"},
  neutral:{icon:"🔵",sign:"N",label:"中立",color:"var(--inkSoft)"},
};
const CATALYST_IMPORTANCE_META={
  low:{label:"低",weight:1},medium:{label:"中",weight:2},medium_high:{label:"中高",weight:3},
  high:{label:"高",weight:4},very_high:{label:"最重要",weight:5},
  HIGH:{label:"高",weight:4},MEDIUM:{label:"中",weight:2},LOW:{label:"低",weight:1},
};
const catalystImportanceWeight=(imp)=>CATALYST_IMPORTANCE_META[imp]?.weight??0;
// 過去の日付から「何営業日前か」を返す（土日のみ除外、祝日は簡易版として考慮しない）。
// 当日・未来は0とする（businessDaysUntil()は未来向け、こちらは過去向けの対の関数）。
function businessDaysAgo(dateStr){
  if(!dateStr)return null;
  const target=new Date(dateStr+"T00:00:00+09:00");
  if(isNaN(target.getTime()))return null;
  const today=new Date();
  const todayJst=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  const targetJst=new Date(target.getFullYear(),target.getMonth(),target.getDate());
  const diffDays=Math.round((todayJst-targetJst)/86400000);
  if(diffDays<=0)return 0;
  let businessDays=0,cursor=new Date(targetJst);
  for(let i=0;i<diffDays;i++){
    cursor=new Date(cursor.getTime()+86400000);
    const dow=cursor.getDay();
    if(dow!==0&&dow!==6)businessDays++;
  }
  return businessDays;
}
// 銘柄コード・セクターに関連するカタリスト「全件」（新しい順）。nextCatalystForCode()は
// 表示用に最も参考にすべき1件だけを返す設計だったため、一覧の行バッジ（複数件・件数表示・
// 鮮度別強調）用にこちらを別途用意する（既存のマッチング条件＝affected_stocks/
// affected_sectorsはnextCatalystForCode()と同じものを再利用し、判定ロジックを重複させない）。
function catalystsForCode(catalysts,code,sector){
  if(!catalysts||!catalysts.length)return[];
  return catalysts.filter(c=>{
    const stocks=c.affected_stocks||[];
    const sectors=c.affected_sectors||[];
    return stocks.includes(code)||(sector&&sectors.includes(sector));
  }).sort((a,b)=>(b.catalyst_date||"").localeCompare(a.catalyst_date||""));
}
function CatalystNote({catalysts,code,sector}){
  const c=useMemo(()=>nextCatalystForCode(catalysts,code,sector),[catalysts,code,sector]);
  if(!c)return null;
  const icon=CATALYST_CATEGORY_ICON[c.category]||CATALYST_CATEGORY_ICON.OTHER;
  const fresh=catalystFreshnessLabel(c.catalyst_date);
  const todayStr=todayISO();
  const pending=c.event_date&&c.event_date>=todayStr;
  const importanceHot=catalystImportanceWeight(c.importance)>=4; // high/very_high、または既存HIGH
  const sentMeta=CATALYST_SENTIMENT_META[c.sentiment]||null; // sentiment未設定（旧データ）ならアイコンを出さない
  let dateNote;
  if(pending){
    const days=businessDaysUntil(c.event_date);
    dateNote=days===0?"本日発効":days===1?"発効まで1営業日":`発効まで${days}営業日`;
  }else{
    dateNote=CATALYST_FRESHNESS_LABEL[fresh]||"";
  }
  return <div style={{fontSize:11,color:importanceHot?"var(--down)":"var(--inkSoft)",
      background:"var(--band)",border:"1px solid var(--rule)",borderRadius:4,padding:"4px 8px",marginBottom:8}}
    title={`情報源：${c.source||"—"}／検証状態：${c.verification_status}（画像由来の情報は確定情報として扱わない）`}>
    {icon} {sentMeta&&<span title={sentMeta.label}>{sentMeta.icon}</span>} {c.title}（{dateNote}）
    {importanceHot&&" ⚠重要度高"}
    {c.verification_status==="UNVERIFIED"&&" （未検証）"}
    {c.verification_status==="IMAGE_DERIVED"&&" （画像由来・要確認）"}
    {c.summary&&<div style={{marginTop:2,color:"var(--inkFaint)"}}>{c.summary}</div>}
  </div>;
}
// 2026-09-08新規（指示書5・6・7番）：監視銘柄・日本市場一覧の行に付ける小さなニュースマーク。
// 好材料=🟢＋／悪材料=🔴－／重要ニュース（重要度high以上でsentimentが中立）=🟡！／
// 通常ニュース=🔵N。同日に複数あれば件数を添える（例：🟢＋2）。ホバー（title属性、既存の
// EventRiskNote/CatalystNote等と同じ最小限のツールチップ方式）で見出し・日付・重要度・
// 出典・要約を表示する。鮮度：当日=強調（不透明度1・太字）／1営業日前=やや弱／
// 2〜3営業日前=小さく／それ以前は原則非表示（ニュース履歴自体はnews_catalystsに残り続け、
// CatalystsPanelの一覧やCatalystNoteの「やや古い情報」表示からは引き続き参照できる）。
// Market Intelligence Phase9新規（指示書22・37番）：監視銘柄カード用の軽量タグ
// （EVENT+/EVENT⚠/PULLBACK）。UIを重くしないためモジュールレベルの簡易キャッシュを持ち、
// 同一コードへの重複fetchを防ぐ（既存のenrichWatchRow等の判定ロジックには一切触れない）。
const _watchlistEventTagCache={};
function WatchlistEventTag({code}){
  const [tags,setTags]=useState(()=>_watchlistEventTagCache[code]||null);
  useEffect(()=>{
    if(_watchlistEventTagCache[code]!==undefined){setTags(_watchlistEventTagCache[code]);return;}
    let cancelled=false;
    fetchJsonSafe(`/api/stocks/${encodeURIComponent(code)}/intelligence-summary`).then(d=>{
      if(!d)return;
      const t=[];
      if(d.active_events){
        if(d.avoid_chase)t.push("EVENT⚠");
        else if((d.best_event_support_score||0)>=65)t.push("EVENT+");
        if(d.pullback_candidate)t.push("PULLBACK");
      }
      _watchlistEventTagCache[code]=t;
      if(!cancelled)setTags(t);
    }).catch(()=>{});
    return ()=>{cancelled=true;};
  },[code]);
  if(!tags||tags.length===0)return null;
  return <span style={{fontSize:9.5,fontWeight:700,color:"var(--inkSoft)",marginLeft:4,whiteSpace:"nowrap"}} title="Market Intelligence：材料/反応/追いかけ警戒/押し目候補">
    {tags.join(" ")}
  </span>;
}

function NewsBadge({catalysts,code,sector}){
  const items=useMemo(()=>catalystsForCode(catalysts,code,sector),[catalysts,code,sector]);
  if(!items.length)return null;
  const freshest=items[0];
  const bdAgo=businessDaysAgo(freshest.catalyst_date);
  const todayStr=todayISO();
  const anyPending=items.some(c=>c.event_date&&c.event_date>=todayStr);
  if(bdAgo==null||(bdAgo>3&&!anyPending))return null; // 指示書7番：2〜3営業日超は一覧の強調を解除
  const sameDay=items.filter(c=>c.catalyst_date===freshest.catalyst_date);
  const hasVeryImportant=items.some(c=>catalystImportanceWeight(c.importance)>=4);
  let sentiment=freshest.sentiment||"neutral";
  if(sameDay.some(c=>(c.sentiment||"neutral")==="negative"))sentiment="negative";
  else if(sameDay.some(c=>(c.sentiment||"neutral")==="positive"))sentiment="positive";
  const meta=CATALYST_SENTIMENT_META[sentiment]||CATALYST_SENTIMENT_META.neutral;
  const showImportantMark=hasVeryImportant&&sentiment==="neutral";
  const icon=showImportantMark?"🟡":meta.icon;
  const sign=showImportantMark?"！":meta.sign;
  const count=sameDay.length;
  const opacity=bdAgo<=0?1:bdAgo===1?0.85:0.6;
  const fontSize=bdAgo<=0?12:bdAgo===1?11.5:10.5;
  const fontWeight=bdAgo<=0?800:600;
  const titleAttr=items.slice(0,3).map(c=>{
    const m=CATALYST_SENTIMENT_META[c.sentiment||"neutral"];
    const imp=CATALYST_IMPORTANCE_META[c.importance]?.label||c.importance||"—";
    return `${m.icon}${c.title}／${c.catalyst_date}／重要度:${imp}／出典:${c.source||"—"}${c.summary?`／${c.summary}`:""}`;
  }).join("\n");
  return <span style={{fontSize,fontWeight,color:showImportantMark?"var(--accent)":meta.color,opacity,marginLeft:4,cursor:"help",whiteSpace:"nowrap"}} title={titleAttr}>
    {icon}{sign}{count>1?count:""}
  </span>;
}

// 貼り付けでimportする（有料AI APIは使わない）。既存のwatchlist import等と同じ
// 「貼り付け→保存→リロード」パターン。
// 2026-09-07新規（STEP3：JSON parserの堅牢化）：貼り付けられたJSONから「イベント配列」を
// 取り出す。既存の[...]／{"events":[...]}に加え、ChatGPT等が別のラッパーキーで生成してくる
// 場合（{"market_events":[...]}等）にも対応する。曖昧な文章からイベントを勝手に生成する
// ことはせず、あくまで「どのキーに配列が入っているか」を探すだけ（フィールドの意味を
// 推測して作り変えることはしない）。見つからない場合はnullを返し、呼び出し側で実際に
// 見つかったトップレベルキーを表示してユーザーが原因を判断できるようにする。
function extractEventsArray(parsed){
  if(Array.isArray(parsed))return parsed;
  if(!parsed||typeof parsed!=="object")return null;
  for(const key of["events","market_events","marketEvents","items","data"]){
    if(Array.isArray(parsed[key]))return parsed[key];
  }
  // 上記の既知キーに無い場合、トップレベルで配列を値に持つプロパティが1つだけなら
  // それを使う（ラッパーキー名だけが想定外だったケースを安全に救う）。複数ある場合は
  // どれを使うべきか機械的に判断できないため諦める（推測で選ばない）。
  const arrayKeys=Object.keys(parsed).filter(k=>Array.isArray(parsed[k]));
  if(arrayKeys.length===1)return parsed[arrayKeys[0]];
  return null;
}
function EventsPanel({events,onReload,onOpenSmartImport}){
  const [pasteText,setPasteText]=useState("");
  const [importing,setImporting]=useState(false);
  const [importMsg,setImportMsg]=useState("");
  const [importOk,setImportOk]=useState(true); // メッセージの色分け（成功=通常色／失敗=警告色）
  const doImport=async()=>{
    let parsed;
    try{parsed=JSON.parse(pasteText);}catch(e){setImportMsg("JSONの形式が正しくありません: "+e.message);setImportOk(false);return;}
    const list=extractEventsArray(parsed);
    if(!Array.isArray(list)||!list.length){
      const topKeys=parsed&&typeof parsed==="object"&&!Array.isArray(parsed)?Object.keys(parsed).join("、"):"（トップレベルが配列でもオブジェクトでもありません）";
      setImportMsg(`イベント配列が見つかりません（[...]、{"events":[...]}、{"market_events":[...]}等の形式で貼り付けてください）。検出したトップレベルのキー：${topKeys}`);
      setImportOk(false);
      return;
    }
    setImporting(true);
    try{
      const r=await fetch("/api/market-events/import",{method:"POST",headers:{"Content-Type":"application/json"},

      const d=await r.json().catch(()=>null);

        // 0件（＝実質何も保存されなかった）の場合は成功扱いにしない（テキストも消さない）。
        const imported=d.imported||0,updated=d.updated||0,skipped=d.skipped||0,errors=d.errors||0;
        const success=(imported+updated)>0;
        // 2026-09-07追加：「スキップ20件」とだけ出て原因が分からない、を防ぐため、
        // サーバーが返すskipped_details/error_details（先頭数件のindex/title/reason）を
        // メッセージに併記する。件数だけの表示だった以前の仕様は残しつつ追記するだけ。
        const detailLines=[
          ...(d.error_details||[]).slice(0,5).map(x=>`  #${x.index+1} ${x.title||"(タイトル不明)"}：${x.reason}`),
          ...(d.skipped_details||[]).slice(0,5).map(x=>`  #${x.index+1} ${x.title||"(タイトル不明)"}：${x.reason}`),
        ];
        const detailText=detailLines.length?`\n${detailLines.join("\n")}`:"";
        setImportMsg(`イベント取込${success?"完了":"失敗"}\n新規 ${imported}件\n更新 ${updated}件\nスキップ ${skipped}件${errors?`\nエラー ${errors}件`:""}${detailText}`);
        setImportOk(success);
        if(success){setPasteText("");onReload();}
      }else{
        setImportMsg("取り込みに失敗しました"+(d&&d.error?`：${d.error}`:""));
        setImportOk(false);
      }
    }catch(e){setImportMsg("通信エラー: "+e.message);setImportOk(false);}
    setImporting(false);
  };
  const removeEvent=async(id)=>{
    if(!confirm("このイベントを削除しますか？"))return;
    try{
      await fetch("/api/market-events/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})});
      onReload();
    }catch(e){}
  };
  const sorted=useMemo(()=>[...events].sort((a,b)=>(a.event_date||"").localeCompare(b.event_date||"")),[events]);
  const todayStr=todayISO();
  const upcoming=sorted.filter(e=>e.event_date>=todayStr);
  const past=sorted.filter(e=>e.event_date<todayStr);
  return <div style={{marginTop:18}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
      <div className="sec-head">イベント登録</div>
      <button className="btn primary" onClick={onOpenSmartImport}>📥 Smart Importで追加</button>
    </div>
    <details style={{marginTop:10,marginBottom:14}}>
      <summary style={{cursor:"pointer",fontSize:12,color:"var(--inkSoft)"}}>高度な入力（JSON直接入力）</summary>
      <div style={{background:"var(--card)",border:"1px solid var(--rule)",borderRadius:4,padding:"10px 12px",marginTop:8}}>
        <textarea value={pasteText} onChange={e=>setPasteText(e.target.value)} rows={6}
          placeholder={'例: [{"event_date":"2026-09-10","title":"米雇用統計","event_type":"ECONOMIC","importance":"HIGH","country":"US","source":"ChatGPT画像認識","verification_status":"IMAGE_DERIVED"}]'}
          style={{width:"100%",fontSize:12,padding:8,border:"1px solid var(--rule)",borderRadius:3,background:"var(--bg)",color:"var(--ink)",fontFamily:"monospace",boxSizing:"border-box"}}/>
        <div style={{display:"flex",alignItems:"center",gap:8,marginTop:8}}>
          <button className="btn primary" disabled={importing||!pasteText.trim()} onClick={doImport}>{importing?"取り込み中…":"JSONを取り込む"}</button>
          {importMsg && <span style={{fontSize:12,whiteSpace:"pre-line",color:importOk?"var(--up)":"var(--down)",fontWeight:importOk?400:700}}>{importMsg}</span>}

          {upcoming.map(ev=>{
            const days=businessDaysUntil(ev.event_date);
            const icon=EVENT_TYPE_ICON[ev.event_type]||EVENT_TYPE_ICON.OTHER;
            return <div key={ev.id} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 10px",border:"1px solid var(--rule)",borderRadius:4,background:"var(--card)",fontSize:12.5,flexWrap:"wrap"}}>
              <span className="mono" style={{color:"var(--inkSoft)",width:90}}>{ev.event_date}{ev.event_time?` ${ev.event_time}`:""}</span>
              <span style={{fontWeight:700}}>{icon} {ev.title}</span>
              {ev.importance && <span style={{fontSize:11,color:(ev.importance==="HIGH"||ev.importance==="高")?"var(--down)":"var(--inkFaint)"}}>{ev.importance}</span>}
              <span style={{fontSize:11,color:"var(--inkFaint)"}}>{days!=null?(days<=0?"本日":days+"営業日後"):""}</span>
              <span style={{fontSize:10.5,color:"var(--inkFaint)",border:"1px solid var(--rule)",borderRadius:3,padding:"1px 5px"}}>{ev.verification_status}</span>
              {ev.affected_stocks && ev.affected_stocks.length>0 && <span style={{fontSize:11,color:"var(--inkFaint)"}}>{ev.affected_stocks.join("・")}</span>}
              <button className="iconbtn" style={{marginLeft:"auto"}} title="削除" onClick={()=>removeEvent(ev.id)}>×</button>
            </div>;
          })}
        </div>}
    {past.length>0 && <details style={{marginTop:16}}>
      <summary style={{cursor:"pointer",fontSize:12.5,color:"var(--inkSoft)"}}>過去のイベント（{past.length}件）</summary>
      <div style={{display:"flex",flexDirection:"column",gap:4,marginTop:8}}>
        {past.slice(-30).reverse().map(ev=><div key={ev.id} style={{fontSize:11.5,color:"var(--inkFaint)"}}>{ev.event_date} {ev.title}</div>)}
      </div>
    </details>}
  </div>;
}

// v3-9続き（PHASE 4 NEWS/CATALYST INTELLIGENCE）：カタリスト一覧タブ。EventsPanelと全く同じ
// 「貼り付け→保存→リロード」パターン。ニュース本体（RSS/TDnet）は既存のニュースタブが担当し、
// ここはChatGPT等で構造化したカタログ情報専用（重複しない）。
function CatalystsPanel({catalysts,onReload,onOpenSmartImport}){
  const [pasteText,setPasteText]=useState("");
  const [importing,setImporting]=useState(false);
  const [importMsg,setImportMsg]=useState("");
  const [categoryFilter,setCategoryFilter]=useState("ALL");
  const doImport=async()=>{
    let parsed;
    try{parsed=JSON.parse(pasteText);}catch(e){setImportMsg("JSONの形式が正しくありません: "+e.message);return;}
    const list=Array.isArray(parsed)?parsed:(parsed&&parsed.catalysts)||[];
    if(!Array.isArray(list)||!list.length){setImportMsg("catalysts配列が見つかりません（[...]または{\"catalysts\":[...]}の形式で貼り付けてください）");return;}
    setImporting(true);
    try{
      const r=await fetch("/api/news-catalysts/import",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({catalysts:list})});
      if(r.ok){
        const d=await r.json();
        setImportMsg(`取り込み完了：${d.imported}件（不備でスキップ${d.skipped}件）`);
        setPasteText("");
        onReload();
      }else{
        setImportMsg("取り込みに失敗しました");
      }
    }catch(e){setImportMsg("通信エラー: "+e.message);}
    setImporting(false);
  };
  const removeCatalyst=async(id)=>{
    if(!confirm("このカタリストを削除しますか？"))return;
    try{
      await fetch("/api/news-catalysts/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})});
      onReload();
    }catch(e){}
  };
  const todayStr=todayISO();
  const filtered=useMemo(()=>categoryFilter==="ALL"?catalysts:catalysts.filter(c=>c.category===categoryFilter),[catalysts,categoryFilter]);
  const sorted=useMemo(()=>[...filtered].sort((a,b)=>(b.catalyst_date||"").localeCompare(a.catalyst_date||"")),[filtered]);
  const isRelevant=c=>catalystFreshnessLabel(c.catalyst_date)!=="OLD"||(c.event_date&&c.event_date>=todayStr);
  const active=sorted.filter(isRelevant);
  const old=sorted.filter(c=>!isRelevant(c));
  return <div style={{marginTop:18}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
      <div className="sec-head">カタリスト</div>
      <button className="btn primary" onClick={onOpenSmartImport}>📥 Smart Importで追加</button>
    </div>
    <details style={{marginTop:10,marginBottom:14}}>
      <summary style={{cursor:"pointer",fontSize:12,color:"var(--inkSoft)"}}>高度な入力（JSON直接入力）</summary>
      <div style={{background:"var(--card)",border:"1px solid var(--rule)",borderRadius:4,padding:"10px 12px",marginTop:8}}>
        <textarea value={pasteText} onChange={e=>setPasteText(e.target.value)} rows={6}
          placeholder={'例: [{"catalyst_date":"2026-09-05","title":"半導体関連セクターに資金流入","category":"SECTOR_CATALYST","importance":"HIGH","affected_sectors":["半導体"],"source":"ChatGPT画像認識","verification_status":"IMAGE_DERIVED"}]'}
          style={{width:"100%",fontSize:12,padding:8,border:"1px solid var(--rule)",borderRadius:3,background:"var(--bg)",color:"var(--ink)",fontFamily:"monospace",boxSizing:"border-box"}}/>
        <div style={{display:"flex",alignItems:"center",gap:8,marginTop:8}}>
          <button className="btn primary" disabled={importing||!pasteText.trim()} onClick={doImport}>{importing?"取り込み中…":"JSONを取り込む"}</button>
          {importMsg && <span style={{fontSize:12,color:"var(--inkSoft)"}}>{importMsg}</span>}
        </div>
      </div>
    </details>
    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,flexWrap:"wrap"}}>
      <span style={{fontSize:12,color:"var(--inkSoft)"}}>カテゴリ:</span>
      <select value={categoryFilter} onChange={e=>setCategoryFilter(e.target.value)}
        style={{fontSize:12,padding:"3px 6px",border:"1px solid var(--rule)",borderRadius:3,background:"var(--bg)",color:"var(--ink)"}}>
        <option value="ALL">すべて</option>
        {CATALYST_CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}
      </select>
    </div>
    <div className="sec-head" style={{fontSize:13}}>直近のカタリスト（{active.length}件）</div>
    {active.length===0
      ? <div style={{padding:16,color:"var(--inkFaint)",fontSize:13}}>登録されているカタリストはありません。</div>
      : <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {active.map(c=>{
            const icon=CATALYST_CATEGORY_ICON[c.category]||CATALYST_CATEGORY_ICON.OTHER;
            const pending=c.event_date&&c.event_date>=todayStr;
            return <div key={c.id} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 10px",border:"1px solid var(--rule)",borderRadius:4,background:"var(--card)",fontSize:12.5,flexWrap:"wrap"}}>
              <span className="mono" style={{color:"var(--inkSoft)",width:90}}>{c.catalyst_date}</span>
              <span style={{fontWeight:700}}>{icon} {c.title}</span>
              {c.importance && <span style={{fontSize:11,color:(c.importance==="HIGH"||c.importance==="高")?"var(--down)":"var(--inkFaint)"}}>{c.importance}</span>}
              <span style={{fontSize:10.5,color:"var(--inkFaint)",border:"1px solid var(--rule)",borderRadius:3,padding:"1px 5px"}}>{c.category}</span>
              {pending && <span style={{fontSize:11,color:"var(--accent)"}}>発効:{c.event_date}</span>}
              <span style={{fontSize:10.5,color:"var(--inkFaint)",border:"1px solid var(--rule)",borderRadius:3,padding:"1px 5px"}}>{c.verification_status}</span>
              {c.affected_stocks && c.affected_stocks.length>0 && <span style={{fontSize:11,color:"var(--inkFaint)"}}>{c.affected_stocks.join("・")}</span>}
              <button className="iconbtn" style={{marginLeft:"auto"}} title="削除" onClick={()=>removeCatalyst(c.id)}>×</button>
            </div>;
          })}
        </div>}
    {old.length>0 && <details style={{marginTop:16}}>
      <summary style={{cursor:"pointer",fontSize:12.5,color:"var(--inkSoft)"}}>古いカタリスト（{old.length}件）</summary>
      <div style={{display:"flex",flexDirection:"column",gap:4,marginTop:8}}>
        {old.slice(0,30).map(c=><div key={c.id} style={{fontSize:11.5,color:"var(--inkFaint)"}}>{c.catalyst_date} {c.title}</div>)}
      </div>
    </details>}
  </div>;
}

// v3-9続き（PHASE 5 EXPERT INTELLIGENCE）：有識者見解一覧タブ。EventsPanel/CatalystsPanelと
// 全く同じ「貼り付け→保存→リロード」パターン。重複判定キー（expert_name/source_title/
// published_at）はサーバー側のupsertで保証されるため、ここではimportして結果を表示するだけ。
// 2026-09-10新規（Unified Smart Import、Phase SI-A）：カタリスト・イベント・有識者意見など
// 入力経路ごとに異なるJSON schemaをユーザーが意識しなくてよいよう、「何でも貼る→解析→
// プレビュー→確定」の統一フローを提供する。既存のCatalystsPanel/EventsPanel/ExpertViewsPanel
// 内の「JSONを取り込む」欄は引き続き残す（指示書1・25番：既存入力経路も残してよい）。
// Phase SI-Aの実装範囲はCATALYST/EVENT/EXPERT_OPINIONの3カテゴリのみ（それ以外は
// UNKNOWN扱いになり保存されない、Phase SI-B以降で拡張予定）。
// 2026-09-10更新（Phase SI-B）：MARKET_ANALYSIS/MORNING_MARKET_CHECK/INTRADAY_REPORT/
// TRADE_RULEを追加。TRADE_RULEだけ🚨表示（指示書8番：confidenceに関わらず自動選択しない）。
const SMART_IMPORT_CATEGORY_META={
  CATALYST:{icon:"✅",label:"CATALYST（カタリスト）",color:"var(--up)"},
  EXPERT_OPINION:{icon:"✅",label:"EXPERT OPINION（有識者意見）",color:"var(--up)"},
  EVENT:{icon:"✅",label:"EVENT（イベント）",color:"var(--up)"},
  MARKET_ANALYSIS:{icon:"✅",label:"MARKET ANALYSIS（市場分析）",color:"var(--up)"},
  MORNING_MARKET_CHECK:{icon:"✅",label:"MORNING MARKET CHECK（朝一チェック）",color:"var(--up)"},
  INTRADAY_REPORT:{icon:"✅",label:"INTRADAY REPORT（場中レポート）",color:"var(--up)"},
  TRADE_RULE:{icon:"🚨",label:"TRADE RULE（売買ルール変更候補）",color:"var(--down)"},
  CHATGPT_LEGACY:{icon:"✅",label:"ChatGPT連携（従来形式）",color:"var(--up)"},
  WATCHLIST_UPDATE:{icon:"👀",label:"WATCHLIST UPDATE（監視銘柄）",color:"var(--up)"},
  WATCHLIST_MASTER_UPDATE:{icon:"📋",label:"WATCHLIST_UPDATE（監視銘柄更新）",color:"var(--up)"},
  POSITION_UPDATE:{icon:"💼",label:"POSITION UPDATE（保有ポジション）",color:"var(--down)"},
  SOCIAL_IMAGE_ANALYSIS:{icon:"🖼",label:"SOCIAL IMAGE ANALYSIS（X投稿画像解析）",color:"var(--up)"},
  WATCH_STOCK:{icon:"👁️",label:"WATCH STOCK（監視候補）",color:"var(--up)"},
  TRADE_REFLECTION:{icon:"📝",label:"TRADE REFLECTION（反省メモ）",color:"var(--up)"},
  UNKNOWN:{icon:"❔",label:"判別不能",color:"var(--inkFaint)"},
};
const SMART_IMPORT_CONFIDENCE_META={
  HIGH:{label:"HIGH", color:"var(--up)"}, MEDIUM:{label:"MEDIUM", color:"var(--accent)"},
  LOW:{label:"LOW（要確認）", color:"var(--down)"},
};
// 2026-09-10更新（Phase SI-C）：WATCHLIST_UPDATE/POSITION_UPDATEを追加。
const SMART_IMPORT_IMPLEMENTED=["CATALYST","EVENT","EXPERT_OPINION","MARKET_ANALYSIS",
  "MORNING_MARKET_CHECK","INTRADAY_REPORT","TRADE_RULE","CHATGPT_LEGACY","WATCHLIST_UPDATE",
  "WATCHLIST_MASTER_UPDATE","POSITION_UPDATE","SOCIAL_IMAGE_ANALYSIS","WATCH_STOCK","TRADE_REFLECTION"];

// 指示書25番（Phase SI-D）：UIテキストを統一表現に寄せる。sourceContextはCatalystタブ等
// から開いた場合のヒント表示用（指示書12番：分類結果を強制しない、あくまで注記）。
const SMART_IMPORT_SOURCE_CONTEXT_LABEL={
  CATALYST:"カタリスト", EVENT:"イベント", EXPERT_OPINION:"有識者", CHATGPT:"ChatGPT連携",
};
// 指示書20番（Phase SI-D）・16番（Phase SI-C）：「安全な項目のみ選択」の対象（重要操作＝
// TRADE_RULE・POSITION_UPDATE全般・WATCHLIST_UPDATEのREMOVEは除外）。判定はカテゴリ単位
// （WATCHLIST_UPDATE自体はADD/UPDATEなら安全）＋isSmartImportCandidateSafe()で個別除外する。
const SMART_IMPORT_SAFE_CATEGORIES=["CATALYST","EVENT","EXPERT_OPINION","MARKET_ANALYSIS",
  "MORNING_MARKET_CHECK","INTRADAY_REPORT","WATCHLIST_UPDATE","SOCIAL_IMAGE_ANALYSIS","WATCH_STOCK","TRADE_REFLECTION"];
const isSmartImportCandidateSafe=c=>{
  if(!SMART_IMPORT_SAFE_CATEGORIES.includes(c.category))return false;
  if(c.category==="WATCHLIST_UPDATE"&&(c.draft?.action||"").toUpperCase()==="REMOVE")return false;
  return true;
};
const SMART_IMPORT_DATA_QUALITY_BY_CONFIDENCE={HIGH:"FULL",MEDIUM:"PARTIAL",LOW:"DEGRADED"};

function SmartImportPanel({onReload,sourceContext=null,onSaved=null,compactMode=false,initialText=""}){
  const [text,setText]=useState(initialText);
  const [analyzing,setAnalyzing]=useState(false);
  const [candidates,setCandidates]=useState(null);  // null=未解析
  const [selected,setSelected]=useState({});         // index -> bool
  const [saving,setSaving]=useState(false);
  const [resultMsg,setResultMsg]=useState("");
  const [history,setHistory]=useState(null);
  const textareaRef=useRef();

  useEffect(()=>{
    if(compactMode)return;  // モーダル内では履歴を出さない（画面を圧迫しないため）
    fetchJsonSafe("/api/smart-import/history").then(d=>{if(d&&d.history)setHistory(d.history);});
  },[compactMode]);

  const applySelectionRule=(cands,ruleFn)=>{
    const next={};
    cands.forEach((c,i)=>{next[i]=ruleFn(c);});
    setSelected(next);
  };
  // 指示書16・8番（SI-B）・6・16番（SI-C）：LOW confidence・TRADE_RULE・POSITION_UPDATE・
  // WATCHLIST REMOVEは既定で未選択（自動保存しない、能動的選択必須）
  const defaultSelectionRule=c=>c.confidence!=="LOW"&&SMART_IMPORT_IMPLEMENTED.includes(c.category)&&isSmartImportCandidateSafe(c);

  const analyze=async()=>{
    if(!text.trim())return;
    setAnalyzing(true);setResultMsg("");
    const d=await fetchJsonSafe("/api/smart-import/preview",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})});
    setAnalyzing(false);
    if(d&&d.candidates){
      setCandidates(d.candidates);
      applySelectionRule(d.candidates,defaultSelectionRule);
    }else{
      setResultMsg("解析に失敗しました");
    }
  };

  const updateDraft=(i,key,value)=>{
    setCandidates(prev=>prev.map((c,idx)=>idx===i?{...c,draft:{...c.draft,[key]:value}}:c));
  };
  const updateCategory=(i,category)=>{
    setCandidates(prev=>prev.map((c,idx)=>idx===i?{...c,category}:c));
  };

  const saveSelected=async(indexFilter)=>{
    const idxOk=i=>indexFilter?indexFilter(candidates[i]):selected[i];
    const toSave=candidates.filter((c,i)=>idxOk(i)).map(c=>({...c,force:c.confidence==="LOW"}));
    if(!toSave.length)return;
    setSaving(true);
    const d=await fetchJsonSafe("/api/smart-import/confirm",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({candidates:toSave,importSource:sourceContext?sourceContext.toLowerCase():"manual"})});
    setSaving(false);
    if(d&&d.results){
      // 指示書15番：保存結果サマリー（✅N件保存しました／⚠M件は未保存）
      const savedCount=Object.values(d.results).reduce((sum,r)=>sum+(r.imported!=null?r.imported:1),0);
      const parts=Object.entries(d.results).map(([cat,r])=>`${cat} ${r.imported!=null?r.imported:1}件`);
      const unsaved=(d.rejected_low_confidence||0)+(d.skipped_unimplemented||0)+(d.skipped_existing_report||0);
      let msg=`✅ ${savedCount}件保存しました（${parts.join("　")}）`;
      if(unsaved)msg+=`　⚠ ${unsaved}件は未保存（LOW confidence等、要確認）`;
      setResultMsg(msg);
      setText("");setCandidates(null);setSelected({});
      onReload?.();
      onSaved?.();
      if(!compactMode)fetchJsonSafe("/api/smart-import/history").then(d2=>{if(d2&&d2.history)setHistory(d2.history);});
    }else{
      setResultMsg("登録に失敗しました");
    }
  };

  // 指示書21番：Ctrl+Enterで解析、Ctrl+Shift+Enterで「安全な項目のみ」保存
  // （POSITION/RULE変更を伴う操作には誤操作防止のためショートカットを割り当てない）
  const onTextareaKeyDown=(e)=>{
    if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){
      e.preventDefault();
      if(e.shiftKey){
        if(candidates)saveSelected(c=>isSmartImportCandidateSafe(c)&&c.confidence!=="LOW");
      }else if(!analyzing&&text.trim()){
        analyze();
      }
    }
  };

  const selectedCount=Object.values(selected).filter(Boolean).length;

  return <div style={{marginTop:compactMode?4:18}}>
    {!compactMode && <>
      <div className="sec-head">📥 Smart Import</div>
      <div style={{fontSize:11.5,color:"var(--inkFaint)",marginBottom:8}}>
        ここに何でも貼り付けてください。ニュース記事・ChatGPT/Claude分析・JSON・イベント・有識者意見・売買メモなどを自動判別します。
      </div>
    </>}
    {sourceContext && SMART_IMPORT_SOURCE_CONTEXT_LABEL[sourceContext] && <div style={{fontSize:11,color:"var(--inkFaint)",marginBottom:6}}>
      {SMART_IMPORT_SOURCE_CONTEXT_LABEL[sourceContext]}タブから開いています（判定結果はカテゴリに関わらずそのまま表示されます）
    </div>}
    <div style={{background:"var(--card)",border:"1px solid var(--rule)",borderRadius:4,padding:"10px 12px"}}>
      <textarea ref={textareaRef} value={text} onChange={e=>setText(e.target.value)} onKeyDown={onTextareaKeyDown}
        rows={compactMode?5:7} autoFocus={compactMode}
        placeholder="ここに何でも貼り付けてください。&#10;例：ニュース記事・ChatGPT/Claudeの分析・有識者コメント・FOMC等のイベント情報・売買メモ・JSON&#10;（Ctrl+Enterで解析）"
        style={{width:"100%",fontSize:12.5,padding:8,border:"1px solid var(--rule)",borderRadius:3,background:"var(--bg)",color:"var(--ink)",fontFamily:"inherit",boxSizing:"border-box"}}/>
      <div style={{display:"flex",alignItems:"center",gap:8,marginTop:8,flexWrap:"wrap"}}>
        <button className="btn primary" disabled={analyzing||!text.trim()} onClick={analyze}>{analyzing?"解析中…":"内容を解析"}</button>
        {resultMsg && <span style={{fontSize:12,color:"var(--inkSoft)",whiteSpace:"pre-wrap"}}>{resultMsg}</span>}
      </div>
    </div>

    {candidates && <div style={{marginTop:14}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8,marginBottom:8}}>
        <div style={{fontSize:12.5,fontWeight:700}}>解析結果：{candidates.length}件</div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          <button className="iconbtn" style={{fontSize:11}} onClick={()=>applySelectionRule(candidates,c=>SMART_IMPORT_IMPLEMENTED.includes(c.category))}>全て選択</button>
          <button className="iconbtn" style={{fontSize:11}} onClick={()=>applySelectionRule(candidates,c=>isSmartImportCandidateSafe(c)&&c.confidence!=="LOW")}>安全な項目のみ選択</button>
          <button className="iconbtn" style={{fontSize:11}} onClick={()=>applySelectionRule(candidates,()=>false)}>選択解除</button>
        </div>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {candidates.map((c,i)=>{
          const meta=SMART_IMPORT_CATEGORY_META[c.category]||SMART_IMPORT_CATEGORY_META.UNKNOWN;
          const confMeta=SMART_IMPORT_CONFIDENCE_META[c.confidence]||{};
          const implemented=SMART_IMPORT_IMPLEMENTED.includes(c.category);
          const dataQuality=SMART_IMPORT_DATA_QUALITY_BY_CONFIDENCE[c.confidence]||"—";
          const sourceLabel=c.source_kind==="json"?"JSON":"自然文";
          return <div key={i} className="card" style={{padding:"10px 12px",opacity:implemented?1:0.6}}>
            <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
              {implemented && <input type="checkbox" checked={!!selected[i]} onChange={e=>setSelected(s=>({...s,[i]:e.target.checked}))}/>}
              <span>{meta.icon}</span>
              <select value={c.category} onChange={e=>updateCategory(i,e.target.value)}
                style={{fontSize:11.5,padding:"2px 4px",border:"1px solid var(--rule)",borderRadius:3,background:"var(--bg)",color:"var(--ink)"}}>
                {SMART_IMPORT_CATEGORIES_UI.map(cat=><option key={cat} value={cat}>{cat}</option>)}
              </select>
              <span style={{fontSize:11,fontWeight:700,color:confMeta.color}}>{c.confidence}/{dataQuality}</span>
              <span style={{fontSize:10.5,color:"var(--inkFaint)",border:"1px solid var(--rule)",borderRadius:3,padding:"1px 5px"}}>source: {sourceLabel}</span>
              {c.possible_duplicate && <span style={{fontSize:11,color:"var(--down)",fontWeight:700}}>⚠ 登録済みの可能性</span>}
              {!implemented && <span style={{fontSize:11,color:"var(--inkFaint)"}}>（このカテゴリは今後のフェーズで対応予定）</span>}
            </div>
            <div style={{marginTop:6,fontSize:12}}>
              {c.category==="CATALYST" && <>
                <input value={c.draft.title||""} onChange={e=>updateDraft(i,"title",e.target.value)} placeholder="タイトル"
                  style={{width:"100%",fontSize:12,padding:4,marginBottom:4,border:"1px solid var(--rule)",borderRadius:3,background:"var(--bg)",color:"var(--ink)",boxSizing:"border-box"}}/>
                <span style={{fontSize:11,color:"var(--inkFaint)"}}>銘柄:{c.draft.ticker||"（不明）"}　日付:{c.draft.catalyst_date||"（未指定＝当日）"}</span>
              </>}
              {c.category==="EVENT" && <>

                <div style={{fontSize:11,color:"var(--inkFaint)"}}>
                  対象post_id: {c.draft.post_id||"（不明）"}　保存先: social_market_posts.image_analysis_json（既存投稿への追記のみ、売買スコアには加点しません）

              </>}
              {c.category==="WATCH_STOCK" && <>
                {!c.draft.code && <div style={{fontSize:11,color:"var(--down)",fontWeight:700}}>⚠ 銘柄コードを解決できませんでした（自動推定しません）</div>}
                <div style={{fontSize:13,fontWeight:700,marginBottom:4}}>
                  [監視候補] {c.draft.code||"（不明）"} {c.draft.name||""}
                </div>
                {c.draft.theme && <div style={{fontSize:11.5,color:"var(--inkSoft)",marginBottom:2}}>テーマ: {c.draft.theme}</div>}

                {c.draft.source && <div style={{fontSize:11.5,color:"var(--inkSoft)",marginBottom:2}}>出典: {c.draft.source}</div>}

                {c.draft.priority && <div style={{fontSize:11.5,color:"var(--inkSoft)"}}>監視優先度: {String(c.draft.priority).toUpperCase()}</div>}

              </>}

                {!c.draft.reflection_text && <div style={{fontSize:11,color:"var(--down)",fontWeight:700}}>⚠ reflection_textが無いため保存できません</div>}
                <div style={{fontSize:12.5,whiteSpace:"pre-wrap",marginBottom:4}}>{c.draft.reflection_text}</div>
                {c.draft.lesson && <div style={{fontSize:11.5,color:"var(--inkSoft)",marginBottom:2}}>教訓: {c.draft.lesson}</div>}
                {c.draft.future_rule && <div style={{fontSize:11.5,color:"var(--inkSoft)",marginBottom:2}}>次回ルール: {c.draft.future_rule}</div>}
                {Array.isArray(c.draft.tags) && c.draft.tags.length>0 && <div style={{fontSize:11.5,color:"var(--inkSoft)",marginBottom:2}}>タグ: {c.draft.tags.join(" / ")}</div>}
                {Array.isArray(c.draft.event_types) && c.draft.event_types.length>0 && <div style={{fontSize:11.5,color:"var(--inkSoft)"}}>イベント種別: {c.draft.event_types.join(" / ")}</div>}
                <div style={{fontSize:11,color:"var(--inkFaint)",marginTop:2}}>保存先: trade_reflections（反省メモ）。lesson/future_rule/tags/event_typesが未指定なら自動抽出します。</div>
              </>}
              {!implemented && <div style={{fontSize:11.5,color:"var(--inkFaint)",whiteSpace:"pre-wrap"}}>{c.raw_text}</div>}
            </div>
          </div>;
        })}
      </div>
      <button className="btn primary" style={{marginTop:10}} disabled={saving||!selectedCount} onClick={()=>saveSelected()}>
        {saving?"保存中…":`選択した項目を保存（${selectedCount}件）`}
      </button>
    </div>}

    {/* 指示書14番：Smart Import経由の最近の取り込み履歴（専用ログDBは作らず既存DBから合成） */}
    {!compactMode && history && history.length>0 && <details style={{marginTop:18}}>
      <summary style={{cursor:"pointer",fontSize:12.5,color:"var(--inkSoft)"}}>取り込み履歴（{history.length}件）</summary>
      <div style={{display:"flex",flexDirection:"column",gap:4,marginTop:8}}>
        {history.map((h,i)=>{
          const meta=SMART_IMPORT_CATEGORY_META[h.category]||SMART_IMPORT_CATEGORY_META.UNKNOWN;
          return <div key={i} style={{fontSize:11.5,color:"var(--inkFaint)",display:"flex",gap:8,alignItems:"center"}}>
            <span className="mono">{h.time?new Date(h.time).toLocaleString("ja-JP"):"—"}</span>
            <span>{meta.icon} {h.category}</span>

            {h.status==="CONFIRM_REQUIRED" && <span style={{color:"var(--down)",fontWeight:700}}>要確認</span>}

        })}

    </details>}
  </div>;
}
const SMART_IMPORT_CATEGORIES_UI=["CATALYST","EVENT","EXPERT_OPINION","MARKET_ANALYSIS",
  "MORNING_MARKET_CHECK","INTRADAY_REPORT","TRADE_RULE","WATCHLIST_UPDATE","WATCHLIST_MASTER_UPDATE",
  "POSITION_UPDATE","SOCIAL_IMAGE_ANALYSIS","WATCH_STOCK","TRADE_REFLECTION","UNKNOWN"];

function ExpertViewsPanel({views,onReload,onOpenSmartImport}){
  const [pasteText,setPasteText]=useState("");
  const [importing,setImporting]=useState(false);
  const [importMsg,setImportMsg]=useState("");
  const [expertFilter,setExpertFilter]=useState("ALL");
  const doImport=async()=>{
    let parsed;
    try{parsed=JSON.parse(pasteText);}catch(e){setImportMsg("JSONの形式が正しくありません: "+e.message);return;}
    const list=Array.isArray(parsed)?parsed:(parsed&&parsed.views)||[];
    if(!Array.isArray(list)||!list.length){setImportMsg("views配列が見つかりません（[...]または{\"views\":[...]}の形式で貼り付けてください）");return;}
    setImporting(true);
    try{
      const r=await fetch("/api/expert-views/import",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({views:list})});
      if(r.ok){
        const d=await r.json();
        setImportMsg(`取り込み完了：${d.imported}件（不備でスキップ${d.skipped}件）`);
        setPasteText("");
        onReload();
      }else{
        setImportMsg("取り込みに失敗しました");
      }
    }catch(e){setImportMsg("通信エラー: "+e.message);}
    setImporting(false);
  };
  const removeView=async(id)=>{
    if(!confirm("この有識者見解を削除しますか？"))return;
    try{
      await fetch("/api/expert-views/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})});
      onReload();
    }catch(e){}
  };
  const experts=useMemo(()=>[...new Set(views.map(v=>v.expert_name).filter(Boolean))],[views]);
  const filtered=useMemo(()=>expertFilter==="ALL"?views:views.filter(v=>v.expert_name===expertFilter),[views,expertFilter]);
  const sorted=useMemo(()=>[...filtered].sort((a,b)=>(b.published_at||"").localeCompare(a.published_at||"")),[filtered]);
  return <div style={{marginTop:18}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
      <div className="sec-head">有識者</div>
      <button className="btn primary" onClick={onOpenSmartImport}>📥 Smart Importで追加</button>
    </div>
    <details style={{marginTop:10,marginBottom:14}}>
      <summary style={{cursor:"pointer",fontSize:12,color:"var(--inkSoft)"}}>高度な入力（JSON直接入力）</summary>
      <div style={{background:"var(--card)",border:"1px solid var(--rule)",borderRadius:4,padding:"10px 12px",marginTop:8}}>
        <textarea value={pasteText} onChange={e=>setPasteText(e.target.value)} rows={8}
          placeholder={'例: [{"expert_name":"○○○○","source_title":"○○チャンネル 9/4配信","source_type":"YOUTUBE","published_at":"2026-09-04","time_horizon":"SHORT_TERM","market":"JP","outlook":"9月〜10月上旬は警戒","risk_window_start":"2026-09-01","risk_window_end":"2026-10-10","thesis":"テクニカル過熱・円高・金融政策が短期逆風","confirmations":["円高一服","日銀QT議論"],"invalidation_conditions":["原油急騰","円高加速"],"verification_status":"USER_PROVIDED_TRANSCRIPT"}]'}
          style={{width:"100%",fontSize:12,padding:8,border:"1px solid var(--rule)",borderRadius:3,background:"var(--bg)",color:"var(--ink)",fontFamily:"monospace",boxSizing:"border-box"}}/>
        <div style={{display:"flex",alignItems:"center",gap:8,marginTop:8}}>
          <button className="btn primary" disabled={importing||!pasteText.trim()} onClick={doImport}>{importing?"取り込み中…":"JSONを取り込む"}</button>
          {importMsg && <span style={{fontSize:12,color:"var(--inkSoft)"}}>{importMsg}</span>}
        </div>
      </div>
    </details>
    {experts.length>0 && <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,flexWrap:"wrap"}}>
      <span style={{fontSize:12,color:"var(--inkSoft)"}}>有識者:</span>
      <select value={expertFilter} onChange={e=>setExpertFilter(e.target.value)}
        style={{fontSize:12,padding:"3px 6px",border:"1px solid var(--rule)",borderRadius:3,background:"var(--bg)",color:"var(--ink)"}}>
        <option value="ALL">すべて</option>
        {experts.map(e=><option key={e} value={e}>{e}</option>)}
      </select>
    </div>}
    <div className="sec-head" style={{fontSize:13}}>登録済みの見解（{sorted.length}件）</div>
    {sorted.length===0
      ? <div style={{padding:16,color:"var(--inkFaint)",fontSize:13}}>登録されている有識者見解はありません。</div>
      : <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {sorted.map(v=>{
            const verifyLabel=EXPERT_VERIFICATION_LABEL[v.verification_status]||v.verification_status;
            const active=isExpertViewActive(v);
            return <div key={v.id} style={{padding:"8px 10px",border:"1px solid var(--rule)",borderRadius:4,background:"var(--card)",fontSize:12.5,opacity:active?1:0.6}}>
              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                <span style={{fontWeight:700}}>🎓 {v.expert_name}</span>
                <span className="mono" style={{color:"var(--inkSoft)"}}>{v.published_at}</span>
                {v.source_type && <span style={{fontSize:10.5,color:"var(--inkFaint)",border:"1px solid var(--rule)",borderRadius:3,padding:"1px 5px"}}>{v.source_type}</span>}
                {v.time_horizon && <span style={{fontSize:10.5,color:"var(--inkFaint)"}}>{v.time_horizon}</span>}
                {(v.market||v.sector) && <span style={{fontSize:10.5,color:"var(--inkFaint)"}}>{[v.market,v.sector].filter(Boolean).join("・")}</span>}
                {v.stocks && v.stocks.length>0 && <span style={{fontSize:11,color:"var(--inkFaint)"}}>{v.stocks.join("・")}</span>}
                <span style={{fontSize:10.5,color:"var(--inkFaint)",border:"1px solid var(--rule)",borderRadius:3,padding:"1px 5px"}}>{verifyLabel}</span>
                <button className="iconbtn" style={{marginLeft:"auto"}} title="削除" onClick={()=>removeView(v.id)}>×</button>
              </div>
              {v.outlook && <div style={{marginTop:4}}>見通し：{v.outlook}</div>}
              {(v.risk_window_start||v.risk_window_end) && <div style={{color:"var(--inkFaint)"}}>リスク期間：{v.risk_window_start||"—"}〜{v.risk_window_end||"—"}</div>}
              {v.thesis && <div style={{color:"var(--inkFaint)"}}>根拠：{v.thesis}</div>}
              {v.confirmations && v.confirmations.length>0 && <div style={{color:"var(--inkFaint)"}}>確認：{v.confirmations.join(" / ")}</div>}
              {v.invalidation_conditions && v.invalidation_conditions.length>0 && <div style={{color:"var(--inkFaint)"}}>無効化：{v.invalidation_conditions.join(" / ")}</div>}
            </div>;
          })}
        </div>}
  </div>;
}

// v3-9続き（2026-09-05・EVENT DASHBOARD）：1件のイベントカード。PC・スマホ（390px程度）の
// どちらでも崩れないよう、横長テーブルではなくflexWrapする1カラムカードのみで構成する。
function EventDashboardCard({ev,heldRelated,watchedRelated,relatedNames}){
  const icon=EVENT_TYPE_ICON[ev.event_type]||EVENT_TYPE_ICON.OTHER;
  const isEarnings=ev.event_type==="EARNINGS";
  const impNorm=normalizeEventImportance(ev.importance);
  const impMeta=EVENT_IMPORTANCE_META[impNorm];
  const countdown=eventCountdownLabel(ev);
  const verifyIcon=EVENT_VERIFICATION_ICON[ev.verification_status]||"？";
  return <div style={{padding:"10px 12px",border:"1px solid var(--rule)",borderRadius:4,
      background:"var(--card)",borderLeft:heldRelated?"3px solid var(--up)":watchedRelated?"3px solid var(--accent)":"3px solid transparent"}}>
    <div style={{display:"flex",flexWrap:"wrap",gap:8,alignItems:"center"}}>
      <span className="mono" style={{color:"var(--inkSoft)",minWidth:44}}>{ev.event_time||"—"}</span>
      <span style={{fontWeight:700}}>{isEarnings?"📊":icon} {ev.title}</span>
      {impMeta && <span style={{fontSize:11,color:impMeta.color}}>{impMeta.icon} {impMeta.label}</span>}
      {countdown && <span style={{fontSize:11,color:"var(--inkFaint)",marginLeft:"auto"}}>{countdown}</span>}
    </div>
    <div style={{display:"flex",flexWrap:"wrap",gap:6,marginTop:6,fontSize:11,color:"var(--inkFaint)"}}>
      {ev.country && <span style={{border:"1px solid var(--rule)",borderRadius:3,padding:"1px 5px"}}>{ev.country}</span>}
      <span style={{border:"1px solid var(--rule)",borderRadius:3,padding:"1px 5px"}}>{EVENT_TYPE_LABEL[ev.event_type]||ev.event_type}</span>
      <span style={{border:"1px solid var(--rule)",borderRadius:3,padding:"1px 5px"}} title="画像由来・未検証の情報を確定情報として扱わない">{verifyIcon} {ev.verification_status}</span>
      {heldRelated && <span style={{color:"var(--up)",fontWeight:700}}>📌 保有銘柄関連</span>}
      {!heldRelated && watchedRelated && <span style={{color:"var(--accent)",fontWeight:700}}>📌 監視銘柄関連</span>}
    </div>
    {relatedNames && relatedNames.length>0 && <div style={{marginTop:4,fontSize:11,color:"var(--inkSoft)"}}>
      {relatedNames.map(r=><span key={r.code} style={{marginRight:10}}>{r.name?`${r.name}（${r.code}）`:r.code}{r.held?" ⭐保有中":r.watched?" 監視中":""}</span>)}
    </div>}
  </div>;
}

// v3-9続き（2026-09-05・EVENT DASHBOARD）：新規メインタブ「📅 イベント」。既存market_events
// （PHASE 3）を期間・重要度・種別で絞り込んで日付ごとに一覧表示するだけの参照画面。新しい
// 判定ロジックは追加しない＝Primary/Action Status・AUTOスコア・Position Statusには一切影響
// しない。EventRiskNote（銘柄分析・ポジションカード）はこのタブとは独立して従来通り動作する
// （このタブはEventRiskNoteの元データを一覧で見せる役割）。
function EventDashboardPanel({events,allWatch,heldItems,onOpenManage}){
  const [rangeDays,setRangeDays]=useState(7);
  const [importanceFilter,setImportanceFilter]=useState("HIGH_MEDIUM"); // HIGH|HIGH_MEDIUM|ALL
  const [categoryFilter,setCategoryFilter]=useState("ALL");

  const todayStr=todayISO();
  const endDateStr=addDaysISO(rangeDays);
  const heldByCode=useMemo(()=>new Map((heldItems||[]).map(h=>[h.code,h])),[heldItems]);
  const watchedByCode=useMemo(()=>new Map((allWatch||[]).map(w=>[w.code,w])),[allWatch]);
  const isHeldRelated=useCallback(ev=>(ev.affected_stocks||[]).some(c=>heldByCode.has(c)),[heldByCode]);
  const isWatchedRelated=useCallback(ev=>(ev.affected_stocks||[]).some(c=>watchedByCode.has(c)),[watchedByCode]);
  const relatedNamesFor=useCallback(ev=>(ev.affected_stocks||[]).map(code=>{
    const h=heldByCode.get(code),w=watchedByCode.get(code);
    return{code,name:(h&&h.name)||(w&&w.name)||null,held:!!h,watched:!!w};
  }),[heldByCode,watchedByCode]);

  const categoryDef=EVENT_CATEGORY_FILTERS.find(c=>c.key===categoryFilter);
  const filtered=useMemo(()=>{
    return(events||[]).filter(ev=>{
      if(!ev.event_date||ev.event_date<todayStr||ev.event_date>endDateStr)return false;
      if(!eventMatchesCategory(ev,categoryDef))return false;
      if(isHeldRelated(ev))return true; // 保有銘柄の決算等はimportanceに関係なく表示（ユーザー指定）
      const impNorm=normalizeEventImportance(ev.importance);
      if(importanceFilter==="HIGH"&&impNorm!=="HIGH")return false;
      if(importanceFilter==="HIGH_MEDIUM"&&!(impNorm==="HIGH"||impNorm==="MEDIUM"))return false;
      return true;
    });
  },[events,todayStr,endDateStr,categoryDef,importanceFilter,isHeldRelated]);

  const grouped=useMemo(()=>{
    const map=new Map();
    filtered.forEach(ev=>{
      if(!map.has(ev.event_date))map.set(ev.event_date,[]);
      map.get(ev.event_date).push(ev);
    });
    // 日付グループ自体は維持したまま、グループ内だけ保有＞監視＞重要イベント＞その他の順に
    // 並べ替える（ユーザー指定：「完全な並び替えではなく、日付グループは維持」）。
    return[...map.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([date,evs])=>({
      date,
      events:[...evs].sort((a,b)=>{
        const ah=isHeldRelated(a)?0:1,bh=isHeldRelated(b)?0:1;
        if(ah!==bh)return ah-bh;
        const aw=isWatchedRelated(a)?0:1,bw=isWatchedRelated(b)?0:1;
        if(aw!==bw)return aw-bw;
        const ai=normalizeEventImportance(a.importance)==="HIGH"?0:1,bi=normalizeEventImportance(b.importance)==="HIGH"?0:1;
        if(ai!==bi)return ai-bi;
        return(a.event_time||"").localeCompare(b.event_time||"");
      }),
    }));
  },[filtered,isHeldRelated,isWatchedRelated]);

  const todayHigh=useMemo(()=>filtered.filter(ev=>ev.event_date===todayStr&&
    (normalizeEventImportance(ev.importance)==="HIGH"||isHeldRelated(ev))),[filtered,todayStr,isHeldRelated]);

  const rangeOptions=[{v:0,label:"今日"},{v:3,label:"3日"},{v:7,label:"7日"},{v:14,label:"14日"}];
  const importanceOptions=[{v:"HIGH",label:"HIGHのみ"},{v:"HIGH_MEDIUM",label:"HIGH+MEDIUM"},{v:"ALL",label:"すべて"}];

  // 2026-09-07新規（「登録済みイベントが表示されない」不具合調査用）：DB総件数→期間内→種別
  // 通過→重要度通過→最終表示、の各段階の件数を確認できるようにする（既定は非表示、
  // 「デバッグ」ボタンで開閉）。新しい判定ロジックではなく、既存filteredの内訳を
  // 可視化するだけ。
  const [debugOpen,setDebugOpen]=useState(false);
  const debugCounts=useMemo(()=>{
    const all=events||[];
    const inRange=all.filter(ev=>ev.event_date&&ev.event_date>=todayStr&&ev.event_date<=endDateStr);
    const catPass=inRange.filter(ev=>eventMatchesCategory(ev,categoryDef));
    const impPass=catPass.filter(ev=>{
      if(isHeldRelated(ev))return true;
      const n=normalizeEventImportance(ev.importance);
      if(importanceFilter==="HIGH")return n==="HIGH";
      if(importanceFilter==="HIGH_MEDIUM")return n==="HIGH"||n==="MEDIUM";
      return true;
    });
    return{total:all.length,inRange:inRange.length,catPass:catPass.length,impPass:impPass.length,final:filtered.length};
  },[events,todayStr,endDateStr,categoryDef,importanceFilter,isHeldRelated,filtered]);

  return<div style={{marginTop:18}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
      <div className="sec-head" style={{marginBottom:0}}>📅 イベント</div>
      {/* 2026-09-07新規：カレンダーからそのまま「イベント登録」サブタブへ移動できるボタン
          （見る→登録する→確認する を同じ場所で完結させる）。 */}
      {onOpenManage && <button className="action-btn" onClick={onOpenManage}>＋ イベント登録へ</button>}
    </div>
    {todayHigh.length>0 && <div style={{background:"var(--upBg)",border:"1px solid var(--up)",borderRadius:4,padding:"10px 14px",marginBottom:14}}>
      <div style={{fontSize:13,fontWeight:700,color:"var(--up)"}}>⚠ 本日の重要イベント {todayHigh.length}件</div>
      <div style={{marginTop:4,display:"flex",flexDirection:"column",gap:2}}>
        {todayHigh.map(ev=><div key={ev.id} style={{fontSize:12.5,color:"var(--inkSoft)"}}>{ev.event_time?ev.event_time+"　":""}{ev.title}</div>)}
      </div>
    </div>}
    <div style={{display:"flex",flexWrap:"wrap",gap:16,marginBottom:10}}>
      <div>
        <div style={{fontSize:11,color:"var(--inkSoft)",marginBottom:4}}>期間</div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {rangeOptions.map(o=><button key={o.v} className={"chip"+(rangeDays===o.v?" on":"")} onClick={()=>setRangeDays(o.v)}>{o.label}</button>)}
        </div>
      </div>
      <div>
        <div style={{fontSize:11,color:"var(--inkSoft)",marginBottom:4}}>重要度</div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {importanceOptions.map(o=><button key={o.v} className={"chip"+(importanceFilter===o.v?" on":"")} onClick={()=>setImportanceFilter(o.v)}>{o.label}</button>)}
        </div>
      </div>
    </div>
    <div style={{display:"flex",flexWrap:"wrap",gap:6,alignItems:"center",marginBottom:8}}>
      {EVENT_CATEGORY_FILTERS.map(c=><button key={c.key} className={"chip"+(categoryFilter===c.key?" on":"")} onClick={()=>setCategoryFilter(c.key)}>{c.label}</button>)}
      <button className="iconbtn" style={{fontSize:10.5,marginLeft:"auto"}} onClick={()=>setDebugOpen(v=>!v)}>デバッグ {debugOpen?"▲":"▼"}</button>
    </div>
    {debugOpen && <div style={{fontSize:11,color:"var(--inkFaint)",background:"var(--band)",padding:"6px 10px",borderRadius:4,marginBottom:10}}>
      DB取得件数 {debugCounts.total} → 期間内（{todayStr}〜{endDateStr}） {debugCounts.inRange} → 種別通過 {debugCounts.catPass} → 重要度通過 {debugCounts.impPass} → 最終表示 {debugCounts.final}
    </div>}
    {grouped.length===0
      ? <div style={{padding:24,textAlign:"center",color:"var(--inkFaint)",fontSize:13,border:"1px solid var(--rule)",borderRadius:4,background:"var(--card)"}}>
          {debugCounts.total===0
            ? <>
                登録済みイベントがありません。
                {onOpenManage
                  ? <>［<button className="iconbtn" style={{fontSize:13,color:"var(--accent)",textDecoration:"underline"}} onClick={onOpenManage}>イベント登録</button>］からJSONを取り込んでください。</>
                  : "「イベント登録」タブからJSONを取り込んでください。"}
              </>
            : "該当する期間・条件のイベントはありません。"}
          <div style={{marginTop:10,fontSize:11.5,color:"var(--inkFaint)"}}>
            期間：{rangeOptions.find(o=>o.v===rangeDays)?.label}（{todayStr}〜{endDateStr}）／
            重要度：{importanceOptions.find(o=>o.v===importanceFilter)?.label}／
            種別：{categoryDef?.label}／基準日：{todayStr}
          </div>
        </div>
      : grouped.map(g=><div key={g.date} style={{marginBottom:16}}>
          <div style={{fontWeight:700,fontSize:13,marginBottom:6,borderBottom:"1px solid var(--ruleSoft)",paddingBottom:4}}>{eventDateJpLabel(g.date)}</div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {g.events.map(ev=><EventDashboardCard key={ev.id} ev={ev} heldRelated={isHeldRelated(ev)}
              watchedRelated={isWatchedRelated(ev)} relatedNames={relatedNamesFor(ev)}/>)}
          </div>
        </div>)}
  </div>;
}

// v3-9続き（2026-09-05・EVENT DASHBOARD）：日次モニター上部に表示する軽量ウィジェット
// （本日のHIGHイベント・保有銘柄関連イベントを最大3件だけ）。日次モニター自体を大きくしない
// ため、EventDashboardPanelの絞り込みロジック（EVENT_CATEGORY_FILTERS等）は使わず、
// 「今日・重要 or 保有銘柄関連」だけのごく単純な抽出に留める。クリックで「イベント」タブへ。
function TodayEventsWidget({events,heldItems,onOpen}){
  const todayStr=todayISO();
  const heldCodes=useMemo(()=>new Set((heldItems||[]).map(h=>h.code)),[heldItems]);
  const todayItems=useMemo(()=>(events||[])
    .filter(ev=>ev.event_date===todayStr&&
      (normalizeEventImportance(ev.importance)==="HIGH"||(ev.affected_stocks||[]).some(c=>heldCodes.has(c))))
    .sort((a,b)=>(a.event_time||"").localeCompare(b.event_time||""))
    .slice(0,3),[events,todayStr,heldCodes]);
  if(!todayItems.length)return null;
  return<div onClick={onOpen} style={{cursor:"pointer",background:"var(--band)",border:"1px solid var(--rule)",
      borderRadius:4,padding:"8px 12px",marginBottom:12,display:"flex",flexDirection:"column",gap:2}}
    title="クリックで「イベント」タブへ移動">
    <div style={{fontSize:12,fontWeight:700,color:"var(--ink)"}}>📅 TODAY</div>
    {todayItems.map(ev=><div key={ev.id} style={{fontSize:12,color:"var(--inkSoft)"}}>
      {ev.event_time?ev.event_time+"　":""}{ev.title}
    </div>)}
  </div>;
}

function RelevantMarketSummary({w,metrics}){
  const keys=relevantMarketMetricKeys(w);
  const rows=keys.map(k=>METRICS.find(m=>m.key===k)).filter(Boolean);
  if(!rows.length)return null;
  return <div style={{display:"flex",flexWrap:"wrap",gap:12,fontSize:11.5,color:"var(--inkSoft)",marginBottom:8}}
    title="この銘柄のセクター/テーマに関係が深い指数だけを表示（日次モニターと同じ既存データ）">
    {rows.map(m=>{
      const v=metrics?.[m.key];const t=v?num(v.t):null,p=v?num(v.p):null;
      const pct=(t!=null&&p!=null&&p)?(t-p)/p*100:null;
      return <span key={m.key} className="mono">{m.label} {t!=null?t.toFixed(m.dp):"—"}
        {pct!=null && <span style={{color:pct>0?"var(--up)":pct<0?"var(--down)":"var(--inkSoft)"}}> {pct>0?"+":""}{pct.toFixed(2)}%</span>}
      </span>;})}
  </div>;
}

// 銘柄分析カード用の総合判断表示（Trade Cockpit v2 Phase2・24番）。server.py analyze_stock()の
// assessmentをそのまま表示するだけ（AI不使用・ルールベースの結果を可視化するのみ）。
// 色は既存entryChecklist/avoidChecklistの慣習に合わせる（--up=赤=好材料寄り、--down=緑=警告寄り。
// CLAUDE.md記載の「上昇=赤・下落=緑」の株価配色とは別に、このアプリでは買いシグナル=赤／
// 見送り警告=緑の対比として使われている。混同しないよう既存チップと同じ配色に揃える）。
// v3-6 Step1（Status統合）：独自のoverallStatus（HOT/WATCH/WAIT/WEAK、サーバー側の別ロジック）は
// 廃止し、監視銘柄タブと全く同じPrimary Status／Action Status（enrichWatchRow()の出力、enrプロパティ
// で受け取る）に統一した。「一覧ではHOT+WAIT、分析画面では別の判定」という矛盾を防ぐため。
// ASSESSMENT_STATUS_METAは不要になったため削除（PRIMARY_STATUS_META/ACTION_STATUS_METAを使う）。
const AXIS_LABEL_META={
  "RISK ON":{color:"var(--up)"},"NEUTRAL":{color:"var(--inkSoft)"},"RISK OFF":{color:"var(--down)"},
  "STRONG":{color:"var(--up)"},"WEAK":{color:"var(--down)"},
  "POSITIVE":{color:"var(--up)"},"RISK":{color:"var(--down)"},
};
// v3-6 Step4（「なぜWAIT/RISKなのか」の理由→待つもの表示）：riskReasons/waitReasons（Step1で
// 既に導入済みのenrichWatchRow出力）を具体的な文章にする。数値はすべて既に取得済みのenr／
// a.indicators／a.fallingKnifeReasons・a.chaseRiskReasons（サーバー側で既に文章化済み）から
// 組み立てるだけで、新規計算は追加しない。
function describeRiskReason(code,enr,a){
  const pctTxt=enr.pct!=null?(enr.pct>0?"+":"")+enr.pct.toFixed(1)+"%":"—";
  switch(code){
    case "CHASE_UP": return `当日${pctTxt}（高値圏のまま反落なし）`;
    case "VWAP_EXTENDED": {
      const vwap=a.indicators?.vwap;
      if(vwap!=null&&a.current!=null)return `VWAP比+${((a.current-vwap)/vwap*100).toFixed(1)}%乖離`;
      return RISK_REASON_META.VWAP_EXTENDED;
    }
    case "VOLUME_CRASH": return `出来高急増を伴う急落（当日${pctTxt}）`;
    case "FALLING_KNIFE": return a.fallingKnifeReasons?.join("・")||RISK_REASON_META.FALLING_KNIFE;
    case "CHASE_RISK": return a.chaseRiskReasons?.join("・")||RISK_REASON_META.CHASE_RISK;
    case "SPIKE_REVERSAL": return `急騰後に高値から反落（当日${pctTxt}）`;
    case "EXTREME_MOVE": return `当日${pctTxt}の急変動`;
    case "MARGIN_DANGER": return a.tradeRules?.marginRatio!=null?`信用倍率${a.tradeRules.marginRatio}倍`:RISK_REASON_META.MARGIN_DANGER;
    case "RSI_HOT": return a.indicators?.rsi!=null?`RSI ${a.indicators.rsi}`:RISK_REASON_META.RSI_HOT;
    default: return RISK_REASON_META[code]||code;
  }
}
function describeWaitReason(code,enr,a){
  switch(code){
    case "VWAP_NOT_RECLAIMED": return a.indicators?.vwap!=null?`VWAP ${a.indicators.vwap}未回復`:WAIT_REASON_META.VWAP_NOT_RECLAIMED;
    case "RANGE_UNCONFIRMED": return "当日安値圏からの反発が浅い（下げ止まり未確認）";
    case "NEAR_BREAKOUT": return "ブレイク水準まで僅差（未突破）";
    case "SECTOR_WEAK": return enr.sectorRS!=null?`対セクター${enr.sectorRS>0?"+":""}${enr.sectorRS.toFixed(1)}pt`:WAIT_REASON_META.SECTOR_WEAK;
    case "MARKET_SOFT": return "地合いが軟調";
    case "NO_PULLBACK_YET": return `当日${enr.pct!=null?(enr.pct>0?"+":"")+enr.pct.toFixed(1)+"%":"—"}のまま高値から反落していない（押し目未形成）`;
    case "ENTRY_CONDITIONS_INCOMPLETE": return a.entryConditionsTotal>0?`Entry Conditions ${a.entryConditionsMet}/${a.entryConditionsTotal}（未達）`:WAIT_REASON_META.ENTRY_CONDITIONS_INCOMPLETE;
    case "PULLBACK_PENDING": {
      const z=a.tradeRules?.pullbackEntry;
      if(z?.zoneLow!=null&&z?.zoneHigh!=null)return `押し目候補 ${z.zoneLow.toLocaleString()}〜${z.zoneHigh.toLocaleString()}円に未到達`;
      return WAIT_REASON_META.PULLBACK_PENDING;
    }
    default: return WAIT_REASON_META[code]||code;
  }
}
// Action Statusが改善するために「何を待てばよいか」の一言。理由コードごとに固定の短文を
// 対応させるだけ（新規判定ロジックではなく、既存のriskReasons/waitReasonsの言い換え）。
const RISK_RESOLUTION_META={
  CHASE_UP:"押し目待ち（追いかけない）", VWAP_EXTENDED:"VWAPへの回帰待ち",
  VOLUME_CRASH:"出来高が落ち着くまで様子見", FALLING_KNIFE:"下げ止まり確認まで様子見",
  CHASE_RISK:"押し目待ち（高値掴み回避）", SPIKE_REVERSAL:"反落が収まるまで様子見",
  EXTREME_MOVE:"値動き沈静化まで様子見", MARGIN_DANGER:"信用需給の改善待ち", RSI_HOT:"過熱解消（RSI低下）待ち",
};
const WAIT_RESOLUTION_META={
  VWAP_NOT_RECLAIMED:"VWAP回復待ち", RANGE_UNCONFIRMED:"下げ止まり確認待ち",
  NEAR_BREAKOUT:"高値更新（ブレイク成立）待ち", SECTOR_WEAK:"セクター全体の回復待ち", MARKET_SOFT:"地合いの回復待ち",
  NO_PULLBACK_YET:"押し目形成待ち（高値掴み回避）", ENTRY_CONDITIONS_INCOMPLETE:"残りのエントリー条件成立待ち",
  PULLBACK_PENDING:"押し目候補ゾーン到達待ち",
};
// 2026-09-08更新（分析カードUI改善：DECISION_FIRST_LAYOUT「重要な理由3件以内」対応）：
// 表示件数を3件にキャップした。既存のriskReasons/waitReasons自体・describeRiskReason等の
// 判定ロジックは無変更（あくまで表示件数を絞るだけ、4件目以降が消えるわけではなく単に
// 一覧に出さないだけ＝データは既存のenrオブジェクトにそのまま残っている）。
const STATUS_REASON_DISPLAY_LIMIT=3;
function StatusReasonPanel({enr,a}){
  if(enr.actionStatus!=="RISK"&&enr.actionStatus!=="WAIT")return null;
  const isRisk=enr.actionStatus==="RISK";
  const codes=isRisk?enr.riskReasons:enr.waitReasons;
  const describe=isRisk?describeRiskReason:describeWaitReason;
  const resolutionMeta=isRisk?RISK_RESOLUTION_META:WAIT_RESOLUTION_META;
  const resolutions=[...new Set(codes.map(c=>resolutionMeta[c]).filter(Boolean))];
  const meta=ACTION_STATUS_META[enr.actionStatus];
  const shown=codes.slice(0,STATUS_REASON_DISPLAY_LIMIT);
  const omitted=codes.length-shown.length;
  return <div style={{border:`1px solid ${meta.color}`,borderRadius:4,padding:"8px 10px",marginBottom:8,background:"var(--band)"}}>
    <div style={{fontWeight:800,fontSize:12.5,color:meta.color,marginBottom:4}}>{meta.icon} {meta.label} の理由</div>
    <div style={{display:"flex",flexDirection:"column",gap:2}}>
      {shown.map(c=><div key={c} style={{fontSize:11.5,color:"var(--ink)"}}>・{describe(c,enr,a)}</div>)}
    </div>
    {omitted>0 && <div style={{fontSize:10.5,color:"var(--inkFaint)",marginTop:2}}>ほか{omitted}件</div>}
    {resolutions.length>0 && <div style={{fontSize:12,fontWeight:700,color:meta.color,marginTop:6}}>→ {resolutions.join("・")}</div>}
  </div>;
}
// 2026-09-08新規（分析カードUI改善）：押し目候補・短期ブレイク価格・損切り・利確・RR等の
// 決定的な数値を1項目=1行で見せる共通コンポーネント。旧実装ではIIFE内のローカル関数だった
// ものを、詳細情報トグル内（利確②）でも再利用するため最上位のコンポーネントとして独立させた。
function AnalysisRow({label,value,color,note}){
  return <div>
    <div style={{fontSize:11.5,color:"var(--inkSoft)"}}>{label}</div>
    <div className="mono" style={{fontSize:20,fontWeight:800,color,lineHeight:1.3}}>{value}</div>
    {note && <div style={{color:"var(--inkSoft)",fontSize:11,marginTop:2}}>{note}</div>}
  </div>;
}

// v3-6 Step3（Entry Conditionsの視覚チェックリスト）：既存データ（server.py analyze_stock()の
// tradeRules.entryChecklist・tradeRules.marginBadge、enrichWatchRow()のmarketRS/sectorRS/
// breakType/waitReasons）だけを使い、新規計算は追加しない。エントリー判断に効く項目を8個に
// 絞る（旧entryChecklistの全項目ダンプ＝SHOW_ANALYSIS_CHECKLISTS=falseで現在非表示、とは別物で
// 恒久的に表示する）。成立数だけでBUY判定はしない（あくまで判断材料の可視化、結論はPrimary/
// Action Statusバッジ側が担う）。
function EntryConditionsChecklist({a,enr}){
  const findChecklist=(key)=>a.tradeRules?.entryChecklist?.find(c=>c.key===key);
  const vwapItem=findChecklist("vwap");
  const volumeItem=findChecklist("volume");
  const items=[
    {key:"marketRS",label:"対市場プラス",pass:enr.marketRS!=null?enr.marketRS>0:null},
    {key:"sectorRS",label:"対セクタープラス",pass:enr.sectorRS!=null?enr.sectorRS>0:null},

    {key:"rangeConfirmed",label:"下げ止まり確認",pass:!enr.waitReasons.includes("RANGE_UNCONFIRMED")},
    {key:"breakout",label:"高値ブレイク",pass:enr.breakType!=null},
    {key:"marketSoft",label:"地合い許容",pass:!enr.waitReasons.includes("MARKET_SOFT")},
    {key:"marginOk",label:"需給警戒なし",pass:a.tradeRules?.marginBadge?(a.tradeRules.marginBadge!=="caution"&&a.tradeRules.marginBadge!=="danger"):null},
  ];
  const known=items.filter(it=>it.pass!=null);
  const met=known.filter(it=>it.pass).length;
  return <div style={{border:"1px solid var(--rule)",borderRadius:4,padding:"8px 10px",marginBottom:8,background:"var(--card)"}}>
    <div style={{fontSize:11.5,fontWeight:700,color:"var(--inkSoft)",marginBottom:6}}>ENTRY CONDITIONS</div>
    <div style={{display:"flex",flexDirection:"column",gap:3}}>
      {items.map(it=><div key={it.key} style={{fontSize:12,display:"flex",alignItems:"center",gap:6,
          color:it.pass==null?"var(--inkFaint)":it.pass?"var(--up)":"var(--inkSoft)"}}>
        <span>{it.pass==null?"？":it.pass?"✅":"⬜"}</span><span>{it.label}</span>
      </div>)}
    </div>
    <div style={{fontSize:11.5,fontWeight:700,color:"var(--inkSoft)",marginTop:6}}>
      {met} / {known.length} 条件成立{known.length<items.length?`（判定不能${items.length-known.length}件を除く）`:""}
    </div>
  </div>;
}

// 2026-09-09新規（ルール学習システム、指示書12・13番）：分析カードへ「適用ルール」を表示する
// ための、銘柄→関連カテゴリの簡易推定（サーバー側_guess_rule_categoryと同じ考え方の軽量版）。
// 新規のサーバー計算は追加せず、既存で分かっているsector/themeだけから推定する。
function guessRuleCategoriesForStock(sector,theme){
  const t=`${theme||""} ${sector||""}`;
  const cats=["market","risk","exit","entry","position"]; // どの銘柄にも関連しうる基本カテゴリ
  if(/半導体|SOX|ソックス/.test(t))cats.push("semiconductor");
  if(/銀行|金融/.test(t))cats.push("bank");
  if(sector)cats.push("sector");
  return cats;
}
// 分析カード内に「適用ルール」を表示する共通コンポーネント（指示書13番）。ACTIVE＋関連度の
// 高いTESTINGルールだけを/api/trade-rules/relevantから取得（全ルールは送らない）。
function AppliedRulesPanel({sector,theme}){
  const [rules,setRules]=useState(null);
  useEffect(()=>{
    let alive=true;
    const cats=guessRuleCategoriesForStock(sector,theme);
    fetchJsonSafe(`/api/trade-rules/relevant?categories=${encodeURIComponent(cats.join(","))}`)
      .then(d=>{if(alive)setRules((d&&d.rules)||[]);});
    return ()=>{alive=false;};
  },[sector,theme]);
  if(!rules||rules.length===0)return null;
  return <div style={{border:"1px solid var(--rule)",borderRadius:4,padding:"8px 10px",marginBottom:8,background:"var(--card)"}}>
    <div style={{fontSize:11.5,fontWeight:700,color:"var(--inkSoft)",marginBottom:6}}>適用ルール {rules.length}件</div>
    <div style={{display:"flex",flexDirection:"column",gap:4}}>
      {rules.map(r=>{
        const cm=TRADE_RULE_CONFIDENCE_META[r.confidence]||{icon:"",color:"var(--ink)"};
        return <div key={r.id} style={{fontSize:11.5,display:"flex",gap:6,alignItems:"flex-start"}}>
          <span style={{flexShrink:0}}>{cm.icon} {r.confidence}</span>
          <span>{r.rule_text}{r.action_text&&<span style={{color:"var(--inkSoft)"}}> → {r.action_text}</span>}</span>
        </div>;
      })}
    </div>
  </div>;
}

// playbook照合・判断エンジン用の軽量シグナルを組み立てる。
function buildSignalsFromAnalysis(a){
  if(!a)return{};
  const findCk=(list,key)=>(list||[]).find(c=>c.key===key)?.pass;
  return{
    volume_surge:!!findCk(a.tradeRules?.entryChecklist,"volume"),
    vwap_position:(a.indicators?.vwap&&a.current)?a.current/a.indicators.vwap:null,
    falling_knife:!!a.assessment?.fallingKnife,
    chase_risk:!!a.assessment?.chaseRisk,
    high_update:!!findCk(a.tradeRules?.entryTimingChecklist,"highUpdate"),
  };
}

// v3-4（ChatGPT連携の再配置）：監視銘柄タブ（WatchTargetsPanel）専用だった「今日の注目TOP5」の
// enrichWatchRow→選定ロジックを共通関数として切り出す。市場タブの「朝一分析」コピーにも同じ
// TOP5をそのまま使い回すため（計算内容は完全に同一、二重実装を避ける）。
function computeEnrichedWatch(items,stockQuotes,metrics,watchlistAll,breakoutLevels,analysisData,marketRiskLabel,eventRiskGuard){
  const m=metrics?.nikkei;
  const mt=m?num(m.t):null,mp=m?num(m.p):null;
  const marketPct=(mt!=null&&mp!=null&&mp)?(mt-mp)/mp*100:null;
  const groups=groupStocks(watchlistAll||[],stockQuotes,w=>w.sector);
  const sectorAvgMap=Object.fromEntries(groups.map(g=>[g.key,g.avgPct]));
  return items.map(w=>enrichWatchRow(w,stockQuotes,marketPct,sectorAvgMap[w.sector],breakoutLevels,analysisData,marketRiskLabel,eventRiskGuard));
}
// v3-6：RISK（actionStatus==="RISK"）とWEAK（Primary Status）は「デイトレ候補」としては出さない。
// TOP5表示ロジック修正指示（2026-09-12）：「今日の注目TOP5」は原則 前日比>0 の銘柄のみ
// （ユーザー要望「上がっている銘柄の中で今一番買い時TOP5」）。前日比マイナスでも、地合い悪化の
// 中で相対的に強い「逆行耐性」が明確な場合のみ例外的に候補へ含めるが、通常候補と黙って
// 混ぜず isResilienceException:true を付けてUI側で明示ラベル表示させる。
//   例外条件（全て満たす場合のみ）：
//   ①地合いが軟調（日経平均marketPct<=-1.0%）②当該銘柄の下落は小幅（pct>=-1.0%）
//   ③対市場RSが強い（marketRS>=+1.5pt）④対セクターRSも強い（sectorRS>=+1.5pt）
//   ⑤Primary StatusがWEAKではない
// バックエンド_classify_entry_state()の逆行耐性例外（VWAP回復・5分足反転構造等）と完全に同一の
// 判定はクライアント側の軽量データ（分析未実施の銘柄も含む）では再現できないため、相対強度
// （marketRS/sectorRS）ベースの近似判定にとどめる（この関数の限界として明記）。
function isResilienceExceptionCandidate(w){
  if(w.pct==null||w.pct>0)return false;
  const marketSelloff=w.marketPct!=null&&w.marketPct<=-1.0;
  const smallDecline=w.pct>=-1.0;
  const strongVsMarket=w.marketRS!=null&&w.marketRS>=1.5;
  const strongVsSector=w.sectorRS!=null&&w.sectorRS>=1.5;
  return marketSelloff&&smallDecline&&strongVsMarket&&strongVsSector&&w.status!=="WEAK";
}
const EVENT_RISK_SORT_ORDER={LOW:0,MEDIUM:1,HIGH:2};
function rankTop5(enriched,stockQuotes){
  const withData=[...enriched].filter(w=>w.rsScore!=null&&num(stockQuotes[w.code]?.t)!=null&&w.status!=="WEAK"&&w.actionStatus!=="RISK");
  const positive=withData.filter(w=>w.pct!=null&&w.pct>0);
  const exceptions=withData.filter(w=>isResilienceExceptionCandidate(w)).map(w=>({...w,isResilienceException:true}));
  // Event Risk Guard（2026-09-17新規、PHASE 8）：完全除外はしない。Status/RS Scoreが並んだ
  // 場合のタイブレークとしてeventRiskLevelの低い方を優先する程度の軽い調整のみ。
  return [...positive,...exceptions]
    .sort((a,b)=>PRIMARY_STATUS_META[a.status].order-PRIMARY_STATUS_META[b.status].order||(b.rsScore-a.rsScore)
      ||((EVENT_RISK_SORT_ORDER[a.eventRiskLevel]??0)-(EVENT_RISK_SORT_ORDER[b.eventRiskLevel]??0)))
    .slice(0,5);
}
// 指示書7番：0件時にどの条件で候補が落ちたのかを追えるようにするデバッグ集計。
function computeTop5Debug(enriched,stockQuotes){
  const withData=[...enriched].filter(w=>w.rsScore!=null&&num(stockQuotes[w.code]?.t)!=null);
  const riskExcluded=withData.filter(w=>w.actionStatus==="RISK").length;
  const weakExcluded=withData.filter(w=>w.status==="WEAK"&&w.actionStatus!=="RISK").length;
  const eligible=withData.filter(w=>w.status!=="WEAK"&&w.actionStatus!=="RISK");
  const positiveCount=eligible.filter(w=>w.pct!=null&&w.pct>0).length;
  const negativeExcluded=eligible.filter(w=>w.pct!=null&&w.pct<=0&&!isResilienceExceptionCandidate(w)).length;
  const exceptionCount=eligible.filter(w=>isResilienceExceptionCandidate(w)).length;
  return {
    scanned:enriched.length, positive_return_candidates:positiveCount, negative_excluded:negativeExcluded,
    exception_negative_candidates:exceptionCount, risk_excluded:riskExcluded, weak_excluded:weakExcluded,
    final_top5:Math.min(5,positiveCount+exceptionCount),
  };
}

const agoLabel=(iso)=>{if(!iso)return "—";const min=Math.max(0,Math.round((Date.now()-new Date(iso).getTime())/60000));return min<1?"1分未満前":min<60?`${min}分前`:`${Math.round(min/60)}時間前`;};

const REACTION_BADGE_META = {

// Market Intelligence Phase10新規（指示書14・15・28・36・38番）：過去時点のdecision_support
// 再現タイムライン。直近4時間を30分刻みでreplayする（未来データは使わない、hindsight adviceでは
// ない点を明記）。
function DecisionReplayTimeline({eventId,ticker}){
  const [timeline,setTimeline]=useState(null);
  useEffect(()=>{
    if(!eventId||!ticker)return;
    const now=new Date();
    const times=[];
    for(let i=8;i>=0;i--)times.push(new Date(now.getTime()-i*30*60000).toISOString());
    fetchJsonSafe(`/api/stocks/${encodeURIComponent(ticker)}/decision-replay?event_id=${eventId}&times=${times.join(",")}`)
      .then(d=>{if(d&&Array.isArray(d.replay))setTimeline(d.replay);}).catch(()=>{});
  },[eventId,ticker]);
  if(!timeline)return <div style={{fontSize:10,color:"var(--inkFaint)"}}>読み込み中…</div>;
  return <div style={{fontSize:10,marginTop:4,color:"var(--inkSoft)"}}>
    <div style={{color:"var(--inkFaint)",marginBottom:2}}>※過去時点で見えていた情報のみで再現（hindsight advice ではありません）</div>
    {timeline.filter(t=>t.decision_support_state).map((t,i)=>
      <div key={i}>{new Date(t.as_of).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})}　{t.decision_support_state}（{t.decision_support_score}）</div>
    )}
  </div>;
}

    {event.impact_score!=null && <div style={{fontSize:10,color:"var(--inkSoft)"}}>Impact {event.impact_score}</div>}

// Market Intelligence Phase12新規（指示書54番）：Market Intelligence系fetchにタイムアウトを
// 設定する（情報取得失敗で画面全体を待たせない）。既存の共通fetchJsonSafeは他の重要機能
// 全体で使われているため変更せず、新設のvalidation/calibration/候補実績パネル専用に
// タイムアウト付きラッパーを別途用意する。
async function fetchJsonSafeTimeout(url,ms=8000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),ms);
  try{
    return await fetchJsonSafe(url,{signal:controller.signal});
  }catch(e){
    return {error:`タイムアウトまたは通信エラー: ${e.message}`};
  }finally{
    clearTimeout(timer);
  }
}

function YaamanThemePanel({nextDayThemes,todayThemes,watchlistAll,onAddToWatchlist,onOpenAnalysis}){

  // 指示書10番：15:30（引け後発掘直後）〜翌営業日の寄り前（9:00目安）は「明日の注目テーマ」、
